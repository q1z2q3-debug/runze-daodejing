<h1>第六十九章｜为客</h1>

<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 九 章 · 主</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一盏灯</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">吾不敢为主，而为客。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「客」，《说文》「寄也」，从宀从各——寄居在别人家里。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">为主：时辰、地点、开头、收场都归我；为客：这四样全归他。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、为主：灯在当中，众物绕着它转</text>
<rect x="26" y="160" width="328" height="164" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>

<circle cx="190" cy="217" r="8" fill="none" stroke="#A2503B" stroke-width="0.6" opacity="0.5"/>
<text x="190" y="234" font-size="6.0" fill="#A2503B" text-anchor="middle">主</text>
<rect x="181" y="172" width="18" height="16" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<text x="190" y="183" font-size="4.2" fill="#6E6459" text-anchor="middle">物</text>

<text x="246" y="223" font-size="4.2" fill="#6E6459" text-anchor="middle">物</text>
<rect x="181" y="252" width="18" height="16" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<text x="190" y="263" font-size="4.2" fill="#6E6459" text-anchor="middle">物</text>
<circle cx="134" cy="220" r="9" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<text x="134" y="223" font-size="4.2" fill="#6E6459" text-anchor="middle">物</text>
<circle cx="190" cy="220" r="54" fill="none" stroke="#4A5C55" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.8"/>
<line x1="232" y1="250" x2="238" y2="240" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arr2)"/>
<line x1="148" y1="190" x2="142" y2="200" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arr2)"/>
<text x="190" y="316" font-size="4.6" fill="#A2503B" text-anchor="middle">一切从它这儿起：定时间、定地点的人，就是主人</text>
<text x="24" y="350" font-size="4.8" fill="#4A5C55">二、为客：宿在人家的屋里，时辰在他</text>
<rect x="26" y="362" width="328" height="130" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M70,418 L170,382 L270,418 L270,478 L70,478 Z" fill="none" stroke="#2F2A24" stroke-width="1"/>

<path d="M70,418 L170,382 L270,418" fill="none" stroke="#2F2A24" stroke-width="1.2"/>

<text x="147" y="446" font-size="4.2" fill="#6E6459" text-anchor="middle">主人家的灯</text>
<circle cx="243" cy="422" r="5.2" fill="none" stroke="#2F2A24" stroke-width="1"/>
<rect x="238" y="428" width="10" height="22" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="241" y1="450" x2="239" y2="478" stroke="#2F2A24" stroke-width="1"/>
<line x1="246" y1="450" x2="247" y2="478" stroke="#2F2A24" stroke-width="1"/>
<rect x="252" y="460" width="13" height="11" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0" stroke-dasharray="2 2"/>
<text x="222" y="420" font-size="4.6" fill="#4A5C55" text-anchor="middle">客</text>
<text x="190" y="508" font-size="4.6" fill="#4A5C55" text-anchor="middle">寄居：屋是他的，灯是他的，什么时候走也是他定</text>
<text x="24" y="526" font-size="4.8" fill="#2F2A24">主是灯里那一星火，别的东西围着它转：当主人，就是让所有事从你这儿起。</text>
<text x="24" y="542" font-size="4.8" fill="#2F2A24">让出去的不是那块地，是「谁先动」这个权力。</text>
<text x="24" y="560" font-size="5.0" fill="#4A5C55">不敢为主者，非不能战，乃不敢使此战归我所有。</text>
<line x1="24" y1="576" x2="338" y2="576" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="584" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="599" font-size="5.2" fill="#2F2A24" text-anchor="middle">主者，灯中一火，众物绕之；</text>
<text x="190" y="612" font-size="4.9" fill="#4A5C55" text-anchor="middle">客者，寄也，宿于人家之屋。</text>
<line x1="20" y1="638" x2="360" y2="638" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="652" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="668" font-size="8.4" fill="#2F2A24">主者，灯中一火，众物绕之；客者，寄也，宿于人家之屋。</text>
<text x="20" y="684" font-size="8.4" fill="#2F2A24">不敢为主者，非不能战，乃不敢使此战归我所有。</text>

<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 九 章 · 轻</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一双抬高的脚</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">祸莫大于轻敌，轻敌几丧吾宝。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">《左传》斗伯比只看了一眼屈瑕走路：「举趾高，心不固矣」——莫敖必败。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">轻敌先长在脚上：脚一抬，三宝先落。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、趾抬得高：脚下虚，心就没落处</text>

<line x1="177" y1="246" x2="168" y2="282" stroke="#2F2A24" stroke-width="1.2"/>

<line x1="206" y1="222" x2="216" y2="236" stroke="#2F2A24" stroke-width="1.2"/>
<g transform="translate(219,231) rotate(-32)"><ellipse cx="0" cy="0" rx="9" ry="4.6" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/><line x1="7" y1="-2" x2="11" y2="-3" stroke="#2F2A24" stroke-width="0.8"/><line x1="8" y1="0" x2="12" y2="0" stroke="#2F2A24" stroke-width="0.8"/><line x1="7" y1="2" x2="11" y2="3" stroke="#2F2A24" stroke-width="0.8"/></g>
<line x1="212" y1="244" x2="212" y2="286" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="2 2"/>
<line x1="230" y1="246" x2="230" y2="286" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="2 2"/>
<text x="221" y="270" font-size="4.5" fill="#A2503B" text-anchor="middle">虚</text>
<line x1="258" y1="278" x2="238" y2="248" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="262" y="282" font-size="4.5" fill="#A2503B">举趾高</text>
<text x="190" y="322" font-size="4.6" fill="#A2503B" text-anchor="middle">趾离地一寸，整只脚就没了根：心也跟着浮起来</text>
<text x="24" y="366" font-size="4.8" fill="#4A5C55">二、脚放平：根落在土里，心才稳</text>
<rect x="26" y="378" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="502" x2="340" y2="502" stroke="#2F2A24" stroke-width="1"/>

<line x1="188" y1="464" x2="191" y2="496" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M182,496 L200,496 Q204,500 198,502 L182,502 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<path d="M160,504 L200,504 L196,510 L164,510 Z" fill="#4A5C55" opacity="0.16" stroke="none"/>
<text x="190" y="522" font-size="4.6" fill="#4A5C55" text-anchor="middle">两只脚都落在土上：脚一放平，三宝才拿得住</text>
<text x="24" y="552" font-size="4.8" fill="#2F2A24">轻敌不是心里的一个念头，它先长在脚上：步子一浮，人就先浮了。</text>
<text x="24" y="568" font-size="4.8" fill="#2F2A24">轻敌几丧吾宝——三宝先落：慈落了，俭落了，不敢为先也落了。</text>
<text x="24" y="586" font-size="5.0" fill="#4A5C55">脚底有没有土，别人一眼就看得见。</text>
<line x1="24" y1="602" x2="338" y2="602" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="610" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="625" font-size="5.2" fill="#2F2A24" text-anchor="middle">斗伯比一眼而知其败：举趾高，心不固矣。</text>
<text x="190" y="638" font-size="4.9" fill="#4A5C55" text-anchor="middle">轻敌先长在脚上，脚一抬，三宝先落。</text>
<line x1="20" y1="664" x2="360" y2="664" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="678" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="694" font-size="8.4" fill="#2F2A24">斗伯比一眼而知其败：举趾高，心不固矣。</text>
<text x="20" y="710" font-size="8.4" fill="#2F2A24">轻敌先长在脚上，脚一抬，三宝先落。</text>
</svg>

<text x="20" y="58" font-size="21" fill="#2F2A24">一扇门</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">故抗兵相若，哀者胜矣。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「哀」，《说文》「闵也」；闵，又解「吊者在门也」——吊丧的人站在门口。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">不是「我很伤心」，是「我看见有人死了，我站在他家门口」。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、站在门外：不进去，也不走</text>
<rect x="26" y="160" width="328" height="146" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>

<rect x="222" y="198" width="66" height="90" fill="none" stroke="#DCCBB0" stroke-width="0.8"/>
