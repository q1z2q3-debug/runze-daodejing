<h1>第七十八章｜受垢</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>

<rect x="0" y="0" width="380" height="744" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 八 章 · 易</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只器</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">以其无以易之。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">易，《说文》曰「蜥蜴」，一说象两器倾水之形。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">倾水者非变也，移也：自此器倒之彼器——器换了，水还是那水。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、倒过来：器换了，水没换</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="294" x2="330" y2="294" stroke="#2F2A24" stroke-width="1"/>
<path d="M96,224 Q74,266 96,290" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M96,224 L130,212 Q146,254 130,280 L96,290" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="96" y1="224" x2="130" y2="212" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M132,218 Q170,232 206,226" fill="none" stroke="#4A5C55" stroke-width="2"/>
<path d="M206,226 Q214,246 214,266" fill="none" stroke="#4A5C55" stroke-width="2"/>
<text x="150" y="208" font-size="4.5" fill="#4A5C55">水在倒</text>
<path d="M200,222 Q186,254 196,292" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M232,222 Q246,254 236,292" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M196,292 Q216,302 236,292" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="200" y1="222" x2="232" y2="222" stroke="#2F2A24" stroke-width="1.2"/>
<text x="216" y="312" font-size="4.2" fill="#6E6459" text-anchor="middle">另一只器</text>
<text x="190" y="334" font-size="4.6" fill="#4A5C55" text-anchor="middle">器可易，水不可易：器者形也，水者体也</text>
<text x="24" y="358" font-size="4.8" fill="#4A5C55">二、都破了：水还在那里</text>
<rect x="26" y="370" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="502" x2="330" y2="502" stroke="#2F2A24" stroke-width="1"/>
<path d="M66,498 l14,-16 l12,6 l-2,10 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M100,500 l10,-18 l14,10 l-6,8 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M124,488 l6,-14 l10,8 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<text x="96" y="470" font-size="4.2" fill="#A2503B">器碎了</text>
<path d="M150,502 Q196,482 250,502 Q200,512 150,502 Z" fill="#4A5C55" fill-opacity="0.25" stroke="#4A5C55" stroke-width="1"/>
<text x="200" y="466" font-size="4.5" fill="#4A5C55" text-anchor="middle">还是那滩水</text>
<text x="190" y="542" font-size="4.6" fill="#4A5C55" text-anchor="middle">形易万次，体未尝一易</text>
<text x="24" y="566" font-size="4.8" fill="#2F2A24">故「无以易之」者，非不可变也，乃不可倒也。</text>
<text x="24" y="582" font-size="4.8" fill="#2F2A24">器一次就碎，水一次也不倒：这就是「莫之能胜」的意思。</text>
<text x="24" y="600" font-size="5.0" fill="#4A5C55">弱者非无力，是不可倒。</text>
<line x1="24" y1="618" x2="338" y2="618" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="626" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="641" font-size="5.0" fill="#2F2A24" text-anchor="middle">天下莫柔弱于水，而攻坚强者莫之能胜，以其无以易之。</text>
<text x="190" y="654" font-size="4.7" fill="#4A5C55" text-anchor="middle">器可易，水不可易。</text>
<line x1="20" y1="682" x2="360" y2="682" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="696" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="712" font-size="8.4" fill="#2F2A24">天下莫柔弱于水，而攻坚强者莫之能胜，以其无以易之。</text>
<text x="20" y="728" font-size="8.4" fill="#2F2A24">易者，《说文》曰「蜥蜴」，一说象两器倾水之形。</text>
</svg>

<text x="20" y="58" font-size="21" fill="#2F2A24">一捧土</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">受国之垢，是谓社稷主。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">垢，《说文》「浊也」，从土——垢即土也。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">水土相遇则浑，静则土沉，土沉则水清。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、接住：一捧土落进水里</text>

<line x1="34" y1="296" x2="330" y2="296" stroke="#2F2A24" stroke-width="1"/>

<text x="196" y="172" font-size="4.5" fill="#A2503B" text-anchor="middle">土落下来</text>
<text x="190" y="330" font-size="4.6" fill="#4A5C55" text-anchor="middle">接住：土落进来，水不拒——拒的，就不是受</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、沉之，复清之</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="500" x2="330" y2="500" stroke="#2F2A24" stroke-width="1"/>

<text x="252" y="440" font-size="4.5" fill="#4A5C55">上：清</text>
<text x="252" y="482" font-size="4.5" fill="#A2503B">下：土沉了</text>
<line x1="240" y1="476" x2="248" y2="480" stroke="#B9A98F" stroke-width="0.7"/>
<text x="190" y="534" font-size="4.6" fill="#4A5C55" text-anchor="middle">土沉了，水自己就清了：不是吞土，是放土</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">故受垢者三步：接之、沉之、复清之。非吞土也，乃放土也。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">能受者，非力大也，其体不倒也——水不清，是因为它一直在晃。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">垢从土，社亦从土：一污一神，一土之两面。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="5.2" fill="#2F2A24" text-anchor="middle">受国之垢，是谓社稷主。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">垢者，浊也，从土：垢即土也。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">受国之垢，是谓社稷主。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">垢者，《说文》曰「浊也」，从土——垢即土也。</text>

<text x="20" y="78" font-size="10.5" fill="#6E6459">受国不祥，是为天下王。</text>

<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">社，《说文》「地主也」，从示土——土神也。</text>
<text x="190" y="127" font-size="4.5" fill="#6E6459" text-anchor="middle">垢从土，社亦从土：一污一神；以污之一面自受，而后为神之一面之主。</text>

<text x="160" y="458" font-size="15" fill="#A2503B" text-anchor="middle">社</text>
<path d="M144,482 q16,-6 32,0" fill="none" stroke="#B9A98F" stroke-width="1"/>
<text x="196" y="432" font-size="4.5" fill="#A2503B">接过土的，</text>
<text x="196" y="444" font-size="4.5" fill="#A2503B">才配当它的主</text>
<text x="190" y="534" font-size="4.6" fill="#4A5C55" text-anchor="middle">土神不是另请一位：是把接过的那捧土立起来</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">受垢者不是不脏：是脏过之后还立得住，于是那块土立成了他的位。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">受不祥者，自置于羊之位也：羊在神主之前，先被牵去。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">垢从土，社从土：一污一神，同一块土。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="5.2" fill="#2F2A24" text-anchor="middle">受国不祥，是为天下王。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">社者，地主也，从示土。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">受国不祥，是为天下王。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">社者，《说文》曰「地主也」，从示土——土神也。</text>
