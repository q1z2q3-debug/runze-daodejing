<h1>第四十八章｜为学日益</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>
<div class="meta">正册共 3 幅　·　复核账随章落地　·　版本 2.9.154</div>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="学是加法，道是减法" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="500" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 八 章 · 益损</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只器，两只手</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">为学日益，为道日损。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.8" fill="#2F2A24" text-anchor="middle">「益」，《说文》「饶也」——字形是水在皿上，水满出来了。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">「损」，《说文》「减也」——从手：一只手从器物上把东西拿掉。</text>
<text x="86" y="156" font-size="5.6" fill="#A2503B" text-anchor="middle">一 · 益：水自己往外涨</text>
<path d="M50,222 L60,260 Q86,270 112,260 L122,222 Z" fill="#F0E8D8" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="48" y1="222" x2="124" y2="222" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M50,220 q10,4 20,0 q10,-4 20,0 q10,4 20,0" fill="none" stroke="#4A5C55" stroke-width="0.6"/>
<path d="M48,224 q2,5 0,8 q-3,-4 0,-8" fill="none" stroke="#4A5C55" stroke-width="0.5"/>
<path d="M52,234 q2,5 0,8 q-3,-4 0,-8" fill="none" stroke="#4A5C55" stroke-width="0.5"/>
<path d="M122,226 q2,5 0,8 q-3,-4 0,-8" fill="none" stroke="#4A5C55" stroke-width="0.5"/>
<path d="M118,236 q2,5 0,8 q-3,-4 0,-8" fill="none" stroke="#4A5C55" stroke-width="0.5"/>
<line x1="66" y1="212" x2="66" y2="200" stroke="#A2503B" stroke-width="0.5" marker-end="url(#arrS)"/>
<line x1="86" y1="212" x2="86" y2="200" stroke="#A2503B" stroke-width="0.5" marker-end="url(#arrS)"/>
<line x1="106" y1="212" x2="106" y2="200" stroke="#A2503B" stroke-width="0.5" marker-end="url(#arrS)"/>
<text x="86" y="276" font-size="4.6" fill="#6E6459" text-anchor="middle">加到一个程度，就不是「有」了</text>
<text x="86" y="288" font-size="4.6" fill="#6E6459" text-anchor="middle">是「漫出来」</text>
<text x="274" y="156" font-size="5.6" fill="#4A5C55" text-anchor="middle">二 · 损：手把它拿掉</text>
<rect x="244" y="204" width="60" height="58" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="244" y1="218" x2="304" y2="218" stroke="#4A5C55" stroke-width="0.5"/>
<path d="M246,220 q9,3 18,0 q9,-3 18,0 q9,3 18,0" fill="none" stroke="#4A5C55" stroke-width="0.45" opacity="0.8"/>
<rect x="265" y="178" width="18" height="13" fill="#DDD5C6" stroke="#2F2A24" stroke-width="0.6"/>
<line x1="274" y1="178" x2="274" y2="164" stroke="#4A5C55" stroke-width="0.5" marker-end="url(#arr2)"/>
<ellipse cx="308" cy="182" rx="12" ry="9" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="300" y1="176" x2="282" y2="175" stroke="#2F2A24" stroke-width="0.5"/>
<line x1="300" y1="180" x2="282" y2="179" stroke="#2F2A24" stroke-width="0.5"/>
<line x1="300" y1="184" x2="282" y2="183" stroke="#2F2A24" stroke-width="0.5"/>
<line x1="300" y1="188" x2="282" y2="187" stroke="#2F2A24" stroke-width="0.5"/>
<path d="M316,190 q8,4 6,12" fill="none" stroke="#2F2A24" stroke-width="0.6"/>
<text x="274" y="276" font-size="4.6" fill="#6E6459" text-anchor="middle">拿掉的是粘在上面的那层</text>
<text x="274" y="288" font-size="4.6" fill="#6E6459" text-anchor="middle">不是杯子本身</text>
<line x1="188" y1="168" x2="188" y2="268" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="4 3"/>
<text x="24" y="312" font-size="5.8" fill="#2F2A24">益是水自己涨出来，损是手往外拿；涨不由人，拿要人动手。</text>
<text x="24" y="328" font-size="5.2" fill="#6E6459">学，是往心里装「有」：一个概念一道边，一个标签一道边。</text>
<text x="24" y="344" font-size="5.2" fill="#4A5C55">损，是把粘在「知道」上面的那层执取拿掉——知识还留着。</text>
<line x1="24" y1="362" x2="338" y2="362" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="370" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="386" font-size="6.0" fill="#2F2A24" text-anchor="middle">学问把世界切得越来越细，切得越细越好用；</text>
<text x="190" y="398" font-size="6.0" fill="#4A5C55" text-anchor="middle">可那条「通」，恰恰不在细处。</text>
<line x1="20" y1="424" x2="360" y2="424" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="438" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="454" font-size="8.4" fill="#2F2A24">学问把世界切得越来越细，切得越细越好用；可那条「通」，恰恰不在细处。</text>
</svg>
<figcaption class="cap"><span class="badge">主图</span><b>一只器，两只手</b><span>ch48a-yi-yu-sun.svg</span><span class="gold">金句：学问把世界切得越来越细，切得越细越好用；可那条「通」，恰恰不在细处。</span><a class="zoom" href="../book/义理图/ch48a-yi-yu-sun.png" target="_blank" rel="noopener">看原图</a></figcaption>
</figure>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 646" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同一张框：往外推是学，把手松是道" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="646" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 八 章 · 一图两观</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一图两观</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">为学日益，为道日损。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.6" fill="#2F2A24" text-anchor="middle">「学」把框往外推，一天多一层；「道」把线往里损，一天少一层。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">同一个框，两种读法——这就是「益」和「损」是同一件事的两面。</text>
<rect x="116" y="228" width="32" height="32" fill="none" stroke="#2F2A24" stroke-width="1" opacity="0.95"/>
<rect x="96" y="208" width="72" height="72" fill="none" stroke="#2F2A24" stroke-width="0.8" opacity="0.62"/>
<rect x="76" y="188" width="112" height="112" fill="none" stroke="#A2503B" stroke-width="0.7" opacity="0.8" stroke-dasharray="4 3"/>
<rect x="56" y="168" width="152" height="152" fill="none" stroke="#A2503B" stroke-width="0.5" opacity="0.35" stroke-dasharray="5 4"/>
<line x1="144" y1="256" x2="216" y2="328" stroke="#A2503B" stroke-width="0.7" marker-end="url(#arrS)"/>
<text x="172" y="344" font-size="4.8" fill="#A2503B">学：同一个角往外推，框就大一圈、多一层</text>
<text x="220" y="182" font-size="4.8" fill="#4A5C55">道：同一条边，一路淡下去</text>
<line x1="220" y1="200" x2="262" y2="200" stroke="#A2503B" stroke-width="0.9" opacity="0.95"/>
<text x="268" y="202" font-size="4.5" fill="#6E6459">一 · 实线</text>
<line x1="220" y1="222" x2="262" y2="222" stroke="#A2503B" stroke-width="0.8" opacity="0.6"/>
<text x="268" y="224" font-size="4.5" fill="#6E6459">二 · 淡实线</text>
<line x1="220" y1="244" x2="262" y2="244" stroke="#A2503B" stroke-width="0.7" opacity="0.75" stroke-dasharray="4 3"/>
<text x="268" y="246" font-size="4.5" fill="#6E6459">三 · 虚线</text>
<line x1="220" y1="266" x2="262" y2="266" stroke="#A2503B" stroke-width="0.5" opacity="0.35" stroke-dasharray="5 4"/>
<text x="268" y="268" font-size="4.5" fill="#6E6459">四 · 几乎没了</text>
<line x1="24" y1="370" x2="338" y2="370" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="24" y="385" font-size="5.2" fill="#A2503B">中间过程：一个框正处在半中间</text>
<line x1="32" y1="406" x2="84" y2="406" stroke="#2F2A24" stroke-width="1"/>
<line x1="84" y1="406" x2="84" y2="458" stroke="#2F2A24" stroke-width="1"/>
<line x1="84" y1="458" x2="32" y2="458" stroke="#A2503B" stroke-width="1" stroke-dasharray="3.4 2.6"/>
<line x1="32" y1="458" x2="32" y2="406" stroke="#A2503B" stroke-width="1" stroke-dasharray="3.4 2.6"/>
<path d="M32,406 l6,-2 M32,406 l2,-6" stroke="#A2503B" stroke-width="0.6" fill="none"/>
<text x="92" y="416" font-size="4.7" fill="#2F2A24">上、右两条边：还硬着，撑得住</text>
<text x="92" y="428" font-size="4.7" fill="#A2503B">下、左两条边：已经虚了，不再划人</text>
<text x="92" y="440" font-size="4.7" fill="#6E6459">越往下走，实的那两条边也一条条虚掉</text>
<text x="24" y="474" font-size="5.2" fill="#4A5C55">所以「损之又损」不是一次全破：是先破一边，再破一边。</text>
<text x="24" y="498" font-size="5.6" fill="#2F2A24">往外读：框一层层变大——这是为学，越学越细，越细越好用。</text>
<text x="24" y="514" font-size="5.6" fill="#2F2A24">读线：每一条边由实变虚——这是为道，不是拆掉框，是让它不再硬着。</text>
<text x="24" y="530" font-size="5.2" fill="#4A5C55">同一张图：你把它往外推，它就多一层；你把手松开，它就淡一层。</text>
<line x1="24" y1="548" x2="338" y2="548" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="556" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="572" font-size="6.0" fill="#2F2A24" text-anchor="middle">框是同一个框；加和减，是同一只手的两件事。</text>
<text x="190" y="584" font-size="6.0" fill="#4A5C55" text-anchor="middle">推到极处，框最大、线最淡——那就是无为。</text>
<line x1="20" y1="610" x2="360" y2="610" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="624" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="640" font-size="8.4" fill="#2F2A24">损之又损，以至于无为。</text>
</svg>

<text x="20" y="58" font-size="21" fill="#2F2A24">一道关，一道关</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">取天下常以无事，及其有事，不足以取天下。</text>

<text x="190" y="114" font-size="5.6" fill="#2F2A24" text-anchor="middle">「事」，《说文》「职也」：无事不是什么都不干，是不给自己加职分。</text>
<text x="190" y="126" font-size="5.2" fill="#A2503B" text-anchor="middle">「取」，《说文》「捕取也」——从又从耳：割左耳计功的那个取。</text>
<text x="24" y="158" font-size="5.6" fill="#A2503B">一 · 有事：一道关、一道关往上加</text>
<line x1="24" y1="206" x2="338" y2="206" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="74" y1="206" x2="74" y2="180" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="96" y1="206" x2="96" y2="180" stroke="#2F2A24" stroke-width="0.8"/>

<line x1="170" y1="206" x2="170" y2="180" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="145" y1="182" x2="173" y2="182" stroke="#A2503B" stroke-width="0.7"/>
<line x1="222" y1="206" x2="222" y2="180" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="244" y1="206" x2="244" y2="180" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="219" y1="182" x2="247" y2="182" stroke="#A2503B" stroke-width="0.7"/>
<text x="36" y="234" font-size="4.8" fill="#6E6459">每干一件，就多一道边；守的地方越多，漏的地方越多。</text>
<text x="24" y="262" font-size="5.6" fill="#4A5C55">二 · 无事：一道也不设</text>
<line x1="24" y1="310" x2="338" y2="310" stroke="#2F2A24" stroke-width="0.8"/>
