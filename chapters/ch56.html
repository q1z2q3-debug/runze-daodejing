<h1>第五十六章｜知者不言</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>
<div class="meta">正册共 3 幅　·　复核账随章落地　·　版本 2.9.154</div>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="挫其锐：锐是芒，不是刀；芒不伤人，只扎人" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="600" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 六 章 · 芒</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一根芒</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">挫其锐，解其纷。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「锐」，《说文》「芒也」——芒是禾本科植物尖端那一根细刺。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">它不伤人，它只是扎人；人身上的芒，就是那点「我比你明白」的尖。</text>
<text x="24" y="146" font-size="5.2" fill="#A2503B">一、没磨过：尖还在，一碰就扎</text>
<line x1="38" y1="266" x2="130" y2="266" stroke="#2F2A24" stroke-width="1"/>
<path d="M50,266 C66,240 76,226 84,216" fill="none" stroke="#4A5C55" stroke-width="2.8"/>
<line x1="84" y1="216" x2="112" y2="198" stroke="#A2503B" stroke-width="1.3"/>
<circle cx="122" cy="194" r="5.5" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="126" y1="192" x2="162" y2="204" stroke="#2F2A24" stroke-width="1.6"/>
<text x="128" y="184" font-size="4.8" fill="#A2503B">一碰就扎</text>
<text x="44" y="278" font-size="4.5" fill="#6E6459">芒：草尖上那一根细刺</text>
<text x="24" y="294" font-size="5.2" fill="#4A5C55">二、磨过：尖磨平了，才不扎</text>
<line x1="38" y1="414" x2="130" y2="414" stroke="#2F2A24" stroke-width="1"/>
<path d="M50,414 C66,388 76,374 84,364" fill="none" stroke="#4A5C55" stroke-width="2.8"/>
<line x1="84" y1="364" x2="106" y2="350" stroke="#A2503B" stroke-width="1.3"/>
<line x1="102" y1="347" x2="112" y2="350" stroke="#A2503B" stroke-width="2.2"/>
<line x1="106" y1="350" x2="116" y2="343" stroke="#A2503B" stroke-width="0.4" stroke-dasharray="3 3"/>
<circle cx="124" cy="340" r="5.5" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="130" y1="334" x2="168" y2="324" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<text x="140" y="318" font-size="4.8" fill="#4A5C55">滑过去</text>
<text x="40" y="426" font-size="4.5" fill="#6E6459">虚线：原来那根尖</text>
<text x="24" y="454" font-size="5.2" fill="#2F2A24">「挫」是磨，不是砍——砍是断，磨是平；断了的还会再长，磨平了才不扎。</text>
<text x="24" y="470" font-size="5.2" fill="#2F2A24">而人身上那根芒，多半长在「我比你明白」这句话上。</text>
<text x="24" y="486" font-size="5.2" fill="#4A5C55">它不刺人，可一碰就扎；扎的不是对方，是那点不肯放的明白。</text>
<line x1="24" y1="504" x2="338" y2="504" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="512" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="528" font-size="6.0" fill="#2F2A24" text-anchor="middle">锐是芒，不是刀；芒不伤人，只扎人；</text>
<text x="190" y="540" font-size="6.0" fill="#4A5C55" text-anchor="middle">所以要磨，不要砍。</text>
<line x1="20" y1="566" x2="360" y2="566" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="580" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="596" font-size="8.4" fill="#2F2A24">锐是芒，不是刀；芒不伤人，只扎人；所以要磨，不要砍。</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 676" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="解其纷：纷是马尾韬，是那个套子，不是那团乱" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="676" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 六 章 · 套</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一个套</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">解其纷，和其光，同其尘。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「纷」，《说文》「马尾韬也」——韬是套子，缠在马尾上，防它跑起来乱甩。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">所以纷的本义不是「乱」，是「用来对付乱的那个东西」。</text>
<text x="24" y="146" font-size="5.2" fill="#A2503B">一、缠着：为了不乱，先缠上一个套</text>
<path d="M143.5,176 C143.5,214 142.0,246 142.0,284" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M146.1,176 C146.1,214 145.2,246 145.2,284" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M148.7,176 C148.7,214 148.4,246 148.4,284" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M151.3,176 C151.3,214 151.6,246 151.6,284" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M153.9,176 C153.9,214 154.8,246 154.8,284" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M156.5,176 C156.5,214 158.0,246 158.0,284" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<rect x="120" y="221" width="60" height="18" fill="#EFE6D4" stroke="#A2503B" stroke-width="0.8"/>
<line x1="120" y1="221" x2="118" y2="216" stroke="#A2503B" stroke-width="0.8"/>
<line x1="180" y1="221" x2="182" y2="216" stroke="#A2503B" stroke-width="0.8"/>
<text x="206" y="224" font-size="4.8" fill="#A2503B">套：缠住了，尾巴不敢甩</text>
<text x="206" y="236" font-size="4.5" fill="#6E6459">缠久了，它就长在尾巴上</text>
<text x="150" y="300" font-size="4.6" fill="#6E6459" text-anchor="middle">一套规矩、一句座右铭、一个「我一向如此」</text>
<text x="24" y="322" font-size="5.2" fill="#4A5C55">二、解开：放开那个缠，让它自己顺</text>
<path d="M143.5,352 C143.5,390 90.0,422 90.0,460" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M146.1,352 C146.1,390 114.0,422 114.0,460" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M148.7,352 C148.7,390 138.0,422 138.0,460" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M151.3,352 C151.3,390 162.0,422 162.0,460" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M153.9,352 C153.9,390 186.0,422 186.0,460" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M156.5,352 C156.5,390 210.0,422 210.0,460" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M92,404 C96,394 106,392 112,400" fill="none" stroke="#4A5C55" stroke-width="1"/>
<path d="M208,404 C204,394 194,392 188,400" fill="none" stroke="#4A5C55" stroke-width="1"/>
<text x="94" y="362" font-size="4.8" fill="#4A5C55" text-anchor="end">套松脱了</text>
<text x="206" y="424" font-size="4.8" fill="#4A5C55">尾巴会甩一阵</text>
<text x="206" y="436" font-size="4.5" fill="#6E6459">甩过之后，它自己会顺</text>
<text x="150" y="476" font-size="4.8" fill="#4A5C55" text-anchor="middle">解：不是理顺，是松绑</text>
<text x="24" y="498" font-size="5.2" fill="#2F2A24">「纷」是套，不是乱；乱能理，套只能解。</text>
<text x="24" y="514" font-size="5.2" fill="#2F2A24">人心里那些「为了不让自己乱」的规矩，缠久了，就是新的乱。</text>
<text x="24" y="530" font-size="5.2" fill="#4A5C55">放了，尾巴会甩一阵；甩过之后，它自己会顺。</text>
<line x1="24" y1="548" x2="338" y2="548" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="556" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="572" font-size="6.0" fill="#2F2A24" text-anchor="middle">纷是套，不是乱；</text>
<text x="190" y="584" font-size="6.0" fill="#4A5C55" text-anchor="middle">乱能理，套只能解。</text>
<line x1="20" y1="610" x2="360" y2="610" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="624" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="640" font-size="8.4" fill="#2F2A24">纷是套，不是乱；乱能理，套只能解。</text>
</svg>

<svg viewBox="0 0 380 588" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="不可得而亲……不可得而贱：六把尺都要一个「我」在中间才量得动" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="588" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 六 章 · 尺</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">六把尺</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">是谓玄同……故为天下贵。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.0" fill="#2F2A24" text-anchor="middle">亲疏、利害、贵贱，是世人最核心的六把尺；三组都建立在一个前提上：有一个「我」在中间。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">「不可得而」四个字，说的是：拿不到——那六把尺，在他身上找不到落脚的地方。</text>
<text x="24" y="146" font-size="5.2" fill="#A2503B">六把尺朝中间伸，中间那个位置空了</text>
<circle cx="190" cy="296" r="30" fill="none" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="190" y="300" font-size="5.2" fill="#A2503B" text-anchor="middle">空</text>
<line x1="190.0" y1="262.0" x2="190.0" y2="218.0" stroke="#2F2A24" stroke-width="2.6"/>
<line x1="190.0" y1="262.0" x2="190.0" y2="218.0" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="2 3"/>
<text x="190.0" y="205.0" font-size="5.2" fill="#2F2A24" text-anchor="middle">亲</text>
<line x1="219.4" y1="279.0" x2="257.5" y2="257.0" stroke="#2F2A24" stroke-width="2.6"/>
<line x1="219.4" y1="279.0" x2="257.5" y2="257.0" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="2 3"/>
<text x="271.4" y="252.0" font-size="5.2" fill="#2F2A24" text-anchor="middle">利</text>
<line x1="219.4" y1="313.0" x2="257.5" y2="335.0" stroke="#2F2A24" stroke-width="2.6"/>
<line x1="219.4" y1="313.0" x2="257.5" y2="335.0" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="2 3"/>
<text x="271.4" y="346.0" font-size="5.2" fill="#2F2A24" text-anchor="middle">贵</text>
<line x1="190.0" y1="330.0" x2="190.0" y2="374.0" stroke="#2F2A24" stroke-width="2.6"/>
<line x1="190.0" y1="330.0" x2="190.0" y2="374.0" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="2 3"/>
<text x="190.0" y="393.0" font-size="5.2" fill="#2F2A24" text-anchor="middle">害</text>
<line x1="160.6" y1="313.0" x2="122.5" y2="335.0" stroke="#2F2A24" stroke-width="2.6"/>
<line x1="160.6" y1="313.0" x2="122.5" y2="335.0" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="2 3"/>
<text x="108.6" y="346.0" font-size="5.2" fill="#2F2A24" text-anchor="middle">疏</text>
<line x1="160.6" y1="279.0" x2="122.5" y2="257.0" stroke="#2F2A24" stroke-width="2.6"/>
<line x1="160.6" y1="279.0" x2="122.5" y2="257.0" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="2 3"/>
<text x="108.6" y="252.0" font-size="5.2" fill="#2F2A24" text-anchor="middle">贱</text>
<text x="190" y="408" font-size="4.8" fill="#4A5C55" text-anchor="middle">尺都悬在外面：落不下来</text>
<text x="24" y="424" font-size="5.0" fill="#2F2A24">合我意则亲、则利、则贵；逆我意则疏、则害、则贱——尺一动，都要那个「我」在中间。</text>
<text x="24" y="440" font-size="5.2" fill="#2F2A24">不是他没有亲疏，是那六把尺在他身上找不到落脚的地方。</text>
<text x="24" y="456" font-size="5.0" fill="#4A5C55">「玄同」也不是大家都一样：一样是抹平，玄同是接上而看不出接头。</text>
<line x1="24" y1="474" x2="338" y2="474" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="482" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="498" font-size="6.0" fill="#2F2A24" text-anchor="middle">六把尺都要一个「我」在中间才量得动；</text>
<text x="190" y="510" font-size="6.0" fill="#4A5C55" text-anchor="middle">中间空了，尺就落不下来。</text>
<line x1="20" y1="536" x2="360" y2="536" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="550" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="566" font-size="8.4" fill="#2F2A24">六把尺都要一个「我」在中间才量得动；中间空了，尺就落不下来。</text>
