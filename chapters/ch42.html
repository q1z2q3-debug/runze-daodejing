<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 二 章 · 和 合</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">和，不是合</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">壁厚到把中空填实，器还在，用已亡。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="115" font-size="5.2" fill="#2F2A24" text-anchor="middle">万物负阴而抱阳，冲气以为和。</text>
<text x="190" y="127" font-size="5.7" fill="#6E6459" text-anchor="middle">负是背在背上，抱是抱在怀里：一物之内，阴在背，阳在怀。</text>
<text x="24" y="152" font-size="5.2" fill="#4A5C55">一 · 和：中间那道虚还空着</text>
<circle cx="84" cy="214" r="46" fill="#E6D8C2" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="84" cy="214" r="38" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.9"/>
<text x="84" y="218" font-size="8.6" fill="#4A5C55" text-anchor="middle">阳</text>
<path d="M70,228 a18,18 0 0 1 28,-24" fill="none" stroke="#A2503B" stroke-width="0.7"/>
<path d="M96,200 l5,3 l-6,3" fill="none" stroke="#A2503B" stroke-width="0.7"/>
<path d="M98,200 a18,18 0 0 1 -28,24" fill="none" stroke="#4A5C55" stroke-width="0.7"/>
<path d="M72,228 l-5,-3 l6,-3" fill="none" stroke="#4A5C55" stroke-width="0.7"/>
<text x="84" y="276" font-size="5.4" fill="#6E6459" text-anchor="middle">壁＝阴（背），腔＝阳（怀）</text>
<text x="150" y="174" font-size="6.1" fill="#2F2A24">阴守住成形的边界，阳保有流通的动能，二者互不吞并。</text>
<text x="150" y="192" font-size="6.1" fill="#2F2A24">靠的正是中间那道虚位：它不固化、不占据，</text>
<text x="150" y="206" font-size="6.1" fill="#2F2A24">才容得下两端持续涌摇往来。</text>
<text x="150" y="230" font-size="5.2" fill="#4A5C55">这就是和——</text>
<text x="150" y="246" font-size="5.2" fill="#4A5C55">不是静止的均衡，是动着的不散。</text>
<text x="24" y="302" font-size="5.2" fill="#A2503B">二 · 合：把虚位填实，强行归一</text>
<circle cx="84" cy="364" r="46" fill="#E6D8C2" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="84" cy="364" r="38" fill="#D9CBB2" stroke="#A2503B" stroke-width="0.8"/>
<line x1="54" y1="337" x2="114" y2="337" stroke="#A2503B" stroke-width="0.4" opacity="0.55"/>
<line x1="54" y1="346" x2="114" y2="346" stroke="#A2503B" stroke-width="0.4" opacity="0.55"/>
<line x1="54" y1="355" x2="114" y2="355" stroke="#A2503B" stroke-width="0.4" opacity="0.55"/>
<line x1="54" y1="364" x2="114" y2="364" stroke="#A2503B" stroke-width="0.4" opacity="0.55"/>
<line x1="54" y1="373" x2="114" y2="373" stroke="#A2503B" stroke-width="0.4" opacity="0.55"/>
<line x1="54" y1="382" x2="114" y2="382" stroke="#A2503B" stroke-width="0.4" opacity="0.55"/>
<line x1="54" y1="391" x2="114" y2="391" stroke="#A2503B" stroke-width="0.4" opacity="0.55"/>
<text x="84" y="368" font-size="5.2" fill="#A2503B" text-anchor="middle">实</text>
<text x="84" y="426" font-size="5.4" fill="#6E6459" text-anchor="middle">外壳还在，形制还像</text>
<text x="150" y="324" font-size="6.1" fill="#2F2A24">用泥把中空填满：阳的流通场没了。</text>
<text x="150" y="342" font-size="6.1" fill="#2F2A24">抹去那道虚、消掉差异、强行归一，器就成了泥坨。</text>
<text x="150" y="356" font-size="6.1" fill="#6E6459">有之利还在，无之用已绝。</text>
<text x="150" y="380" font-size="5.2" fill="#A2503B">合是消掉中间，</text>
<text x="150" y="396" font-size="5.2" fill="#A2503B">和是容下中间。</text>
<line x1="24" y1="430" x2="338" y2="430" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="440" width="340" height="46" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="458" font-size="5.2" fill="#2F2A24" text-anchor="middle">纯阴则死，纯阳则散；一物之内，形质在外撑着，气化在内转着。</text>
<text x="190" y="472" font-size="5.2" fill="#6E6459" text-anchor="middle">抹去中间那道虚，器还在，用已亡。</text>
<line x1="20" y1="500" x2="360" y2="500" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="514" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="530" font-size="8.4" fill="#2F2A24">纯阴则死，纯阳则散。</text>
<text x="20" y="546" font-size="8.4" fill="#2F2A24">壁厚到把中空填实，器还在，用已亡。</text>
</svg>
