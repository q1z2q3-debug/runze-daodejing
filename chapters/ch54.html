<h1>第五十四章｜善建者不拔</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>
<div class="meta">正册共 3 幅　·　复核账随章落地　·　版本 2.9.154</div>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 596" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="善建者不拔：楼是立在地方的，律是立在人心里的" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="596" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 四 章 · 线</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一条线</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">善建者不拔，善抱者不脱。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「建」，《说文》「立朝律也」——立一条律；「拔」，《说文》「擢也」——往上抽。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">不是「会盖房子的人，房子不被推倒」，是「会立律的人，那条律抽不走」。</text>
<text x="24" y="146" font-size="5.2" fill="#A2503B">一、楼：立在一个地方，所以抽得走</text>
<line x1="24" y1="272" x2="180" y2="272" stroke="#2F2A24" stroke-width="1"/>
<rect x="84" y="212" width="48" height="20" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="84" y="232" width="48" height="20" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="84" y="252" width="48" height="20" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M76,212 L108,194 L140,212" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="108" y1="190" x2="108" y2="160" stroke="#A2503B" stroke-width="1.0" marker-end="url(#arrS)"/>
<text x="116" y="176" font-size="4.8" fill="#A2503B">拔：往上抽</text>
<text x="108" y="286" font-size="4.6" fill="#6E6459" text-anchor="middle">它有位置，就有个地儿可以抓</text>
<text x="24" y="306" font-size="5.2" fill="#4A5C55">二、律：立在人心里，没有端点可抓</text>
<rect x="96" y="322" width="188" height="76" fill="#FBF6EC" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="190" y1="318" x2="190" y2="404" stroke="#2F2A24" stroke-width="1.6"/>
<text x="190" y="316" font-size="4.5" fill="#6E6459" text-anchor="middle">上不见头</text>
<text x="190" y="416" font-size="4.5" fill="#6E6459" text-anchor="middle">下不见底</text>
<line x1="120" y1="380" x2="156" y2="380" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="112" y="366" font-size="4.6" fill="#A2503B" text-anchor="middle">同样去抽</text>
<text x="112" y="376" font-size="4.5" fill="#6E6459" text-anchor="middle">抓了个空</text>
<text x="24" y="436" font-size="5.2" fill="#2F2A24">一座楼可以拔，一堵墙可以拆，一个人可以调走；一条立对了的律，抽不走。</text>
<text x="24" y="452" font-size="5.2" fill="#2F2A24">因为它不在某个位置上，它在人心里。</text>
<text x="24" y="468" font-size="5.0" fill="#4A5C55">第五十三章的台阶，可以修得更高，也可以被推得更低；律立住了，就一直在那儿。</text>
<line x1="24" y1="486" x2="338" y2="486" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="494" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="510" font-size="6.0" fill="#2F2A24" text-anchor="middle">楼是立在地方的，律是立在人心里的；</text>
<text x="190" y="522" font-size="6.0" fill="#4A5C55" text-anchor="middle">地方会被换，人心不容易。</text>
<line x1="20" y1="548" x2="360" y2="548" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="562" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="578" font-size="8.4" fill="#2F2A24">楼是立在地方的，律是立在人心里的；地方会被换，人心不容易。</text>
</svg>
<figcaption class="cap"><span class="badge">主图</span><b>一条线</b><span>ch54a-yi-tiao-xian.svg</span><span class="gold">金句：楼是立在地方的，律是立在人心里的；地方会被换，人心不容易。</span><a class="zoom" href="../book/义理图/ch54a-yi-tiao-xian.png" target="_blank" rel="noopener">看原图</a></figcaption>
</figure>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 556" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="善抱者不脱：手会松，怀不会" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="556" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 四 章 · 怀</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一副衣襟</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">善抱者不脱，子孙以祭祀不辍。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「抱」古字作「袌」，《说文》「褱也」——从衣：把东西放进衣襟里兜着。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">兜住的东西，是靠衣裳的重量压着，不是靠手臂箍着。</text>
<text x="24" y="146" font-size="5.2" fill="#A2503B">一、端在手上：手会累，会松</text>
<rect x="36" y="176" width="84" height="13" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="126" cy="182" rx="10" ry="8" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M136,176 C142,168 136,166 132,172" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="126" cy="164" r="10" fill="#FBF6EC" stroke="#A2503B" stroke-width="1"/>
<line x1="140" y1="158" x2="176" y2="158" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="150" y1="146" x2="150" y2="172" stroke="#A2503B" stroke-width="0.6" marker-end="url(#arrS)"/>
<text x="196" y="150" font-size="4.6" fill="#A2503B">手臂一累就松</text>
<text x="196" y="160" font-size="4.6" fill="#6E6459">端着的早晚要掉</text>
<text x="78" y="198" font-size="4.6" fill="#6E6459" text-anchor="middle">端：靠的是力</text>
<text x="24" y="246" font-size="5.2" fill="#4A5C55">二、放进怀里：衣裳压着，不用手</text>
<path d="M74,262 C64,328 100,354 160,354 C220,354 256,328 246,262" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M74,262 C110,318 210,318 246,262" fill="none" stroke="#2F2A24" stroke-width="0.6" stroke-dasharray="5 4"/>
<circle cx="160" cy="332" r="12" fill="#FBF6EC" stroke="#4A5C55" stroke-width="1.1"/>
<text x="160" y="376" font-size="4.6" fill="#4A5C55" text-anchor="middle">怀：靠的是衣裳的重量</text>
<line x1="266" y1="298" x2="296" y2="298" stroke="#4A5C55" stroke-width="0.4" stroke-dasharray="3 3"/>
<text x="300" y="300" font-size="4.5" fill="#4A5C55">不用手</text>
<text x="24" y="388" font-size="5.2" fill="#2F2A24">「脱」是从怀里滑出去——说的不是「不离」，是「放对了地方」。</text>
<text x="24" y="404" font-size="5.2" fill="#2F2A24">这里抱的不是外物，是那份生机、那条道脉。</text>
<text x="24" y="420" font-size="5.0" fill="#4A5C55">「辍」，《说文》「车小缺复合者也」——断了一段又接上；不辍，是一次也没断过。</text>
<line x1="24" y1="438" x2="338" y2="438" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="446" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="462" font-size="6.0" fill="#2F2A24" text-anchor="middle">手会松，怀不会；所以抱得住的东西，</text>
<text x="190" y="474" font-size="6.0" fill="#4A5C55" text-anchor="middle">都是放进怀里的，不是端在手上的。</text>
<line x1="20" y1="500" x2="360" y2="500" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="514" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="530" font-size="8.4" fill="#2F2A24">手会松，怀不会；所以抱得住的东西，都是放进怀里的，不是端在手上的。</text>
</svg>
<figcaption class="cap"><span class="badge">主图</span><b>一副衣襟</b><span>ch54b-yi-fu-yi-jin.svg</span><span class="gold">金句：手会松，怀不会；所以抱得住的东西，都是放进怀里的，不是端在手上的。</span><a class="zoom" href="../book/义理图/ch54b-yi-fu-yi-jin.png" target="_blank" rel="noopener">看原图</a></figcaption>
</figure>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 604" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="修之于身，其德乃真……其德乃普：五级不是爬上去的，是渗上去的" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="604" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 四 章 · 渗</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一圈涟漪</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">修之于身……修之于天下，其德乃普。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.0" fill="#2F2A24" text-anchor="middle">五个字不是四句好话，是四个刻度：余是量（多到溢出来）／长是时／丰是厚／普是匀。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">「普」，《说文》「日无色也」——太阳没有颜色的时候，才是匀的。</text>
<text x="24" y="146" font-size="5.2" fill="#A2503B">一滴落下去，一圈一圈往外渗</text>
<circle cx="190" cy="298" r="120" fill="none" stroke="#D8CBB2" stroke-width="0.6"/>
<text x="190" y="172" font-size="4.8" fill="#D8CBB2" text-anchor="middle">普·天下</text>
<circle cx="190" cy="298" r="96" fill="none" stroke="#B9A98C" stroke-width="0.7"/>
<text x="190" y="196" font-size="4.8" fill="#B9A98C" text-anchor="middle">丰·邦</text>
<circle cx="190" cy="298" r="72" fill="none" stroke="#4A5C55" stroke-width="0.85"/>
<text x="190" y="220" font-size="4.8" fill="#4A5C55" text-anchor="middle">长·乡</text>
<circle cx="190" cy="298" r="48" fill="none" stroke="#7A8C7C" stroke-width="0.9"/>
<text x="190" y="244" font-size="4.8" fill="#7A8C7C" text-anchor="middle">余·家</text>
<circle cx="190" cy="298" r="24" fill="none" stroke="#A2503B" stroke-width="1.1"/>
<text x="190" y="268" font-size="4.8" fill="#A2503B" text-anchor="middle">真·身</text>
<circle cx="190" cy="298" r="4" fill="#2F2A24"/>
<text x="190" y="314" font-size="5.0" fill="#2F2A24" text-anchor="middle">身</text>
<text x="24" y="434" font-size="5.2" fill="#2F2A24">「修之于天下」不是「把天下修好」：不是你去修它，是它被渗到。</text>
<text x="24" y="450" font-size="5.2" fill="#2F2A24">你去改一个家，那个家就被你压住；你身上有余，那个家就自己松一点。</text>
<text x="24" y="466" font-size="5.2" fill="#4A5C55">从身上长出来的，会渗过去；从外面压过去的，会被顶回来。</text>
<line x1="24" y1="484" x2="338" y2="484" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="492" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="508" font-size="6.0" fill="#2F2A24" text-anchor="middle">德往外走，先多，再久，再厚，最后匀；</text>
<text x="190" y="520" font-size="6.0" fill="#4A5C55" text-anchor="middle">匀了才叫普，不是到处都有，是到处一样。</text>
<line x1="20" y1="546" x2="360" y2="546" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="560" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="576" font-size="8.4" fill="#2F2A24">德往外走，先多，再久，再厚，最后匀；匀了才叫普，不是到处都有，是到处一样。</text>
</svg>
<figcaption class="cap"><span class="badge">主图</span><b>一圈涟漪</b><span>ch54c-yi-quan-lian-yi.svg</span><span class="gold">金句：德往外走，先多，再久，再厚，最后匀；匀了才叫普，不是到处都有，是到处一样。</span><a class="zoom" href="../book/义理图/ch54c-yi-quan-lian-yi.png" target="_blank" rel="noopener">看原图</a></figcaption>
</figure>
