<h1>第七十六章｜柔脆</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>

<rect x="0" y="0" width="380" height="724" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 六 章 · 柔</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一根枝条</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">人之生也柔弱，其死也坚强。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">柔，《说文》「木曲直也」——曲者可直，直者可曲。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">柔不是软，是可逆；弱不是无力，是桡——曲而能直。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、被风弯了，风过了它回来</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="294" x2="330" y2="294" stroke="#2F2A24" stroke-width="1"/>
<path d="M40,202 q26,-6 52,0" fill="none" stroke="#B9A98F" stroke-width="0.9"/>
<path d="M40,224 q26,-6 52,0" fill="none" stroke="#B9A98F" stroke-width="0.9"/>
<path d="M40,246 q26,-6 52,0" fill="none" stroke="#B9A98F" stroke-width="0.9"/>
<polygon points="96,202 84,198 86,208" fill="#B9A98F"/>
<path d="M136,294 Q140,258 168,240 Q196,224 206,202" fill="none" stroke="#2F2A24" stroke-width="1.6"/>
<path d="M146,270 q-16,-2 -22,-12" fill="none" stroke="#2F2A24" stroke-width="1"/>
<text x="214" y="228" font-size="4.5" fill="#A2503B">弯</text>
<path d="M206,202 Q198,188 176,190" fill="none" stroke="#4A5C55" stroke-width="1" stroke-dasharray="4 3"/>
<polygon points="176,190 186,186 186,196" fill="#4A5C55"/>
<text x="176" y="180" font-size="4.5" fill="#4A5C55" text-anchor="middle">风过了：回来</text>
<text x="190" y="328" font-size="4.6" fill="#4A5C55" text-anchor="middle">枝条被风弯，风过了它回来：柔的失败，只是变形</text>
<text x="24" y="352" font-size="4.8" fill="#4A5C55">二、同一根枝，被折断了</text>
<rect x="26" y="364" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="496" x2="330" y2="496" stroke="#2F2A24" stroke-width="1"/>
<path d="M136,496 L140,442" fill="none" stroke="#2F2A24" stroke-width="1.6"/>
<path d="M140,442 l-6,-10 l8,-2 l-6,-9" fill="none" stroke="#A2503B" stroke-width="1.2"/>
<path d="M142,440 Q176,456 196,492" fill="none" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="196" y1="492" x2="214" y2="494" stroke="#2F2A24" stroke-width="1.2"/>
<text x="228" y="460" font-size="4.5" fill="#A2503B">断口：</text>
<text x="228" y="472" font-size="4.5" fill="#6E6459">接不回去</text>
<text x="228" y="492" font-size="4.2" fill="#6E6459">梢落在地上</text>
<text x="190" y="530" font-size="4.6" fill="#4A5C55" text-anchor="middle">同样一个力：弯的回来了，断的回不来</text>
<text x="24" y="554" font-size="4.8" fill="#2F2A24">所以柔非软也，可逆也；弱非无力也，桡也——曲而能直。</text>
<text x="24" y="570" font-size="4.8" fill="#2F2A24">坚强则异：坚者土之刚，硬而不动；强者弓有力，满而将断。</text>
<text x="24" y="588" font-size="5.0" fill="#4A5C55">柔的失败是变形，强的失败是断。</text>
<line x1="24" y1="606" x2="338" y2="606" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="614" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="629" font-size="5.2" fill="#2F2A24" text-anchor="middle">人之生也柔弱，其死也坚强。</text>
<text x="190" y="642" font-size="4.7" fill="#4A5C55" text-anchor="middle">曲者可直，直者可曲。</text>
<line x1="20" y1="670" x2="360" y2="670" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="684" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="700" font-size="8.4" fill="#2F2A24">人之生也柔弱，其死也坚强。</text>
<text x="20" y="716" font-size="8.4" fill="#2F2A24">柔者，《说文》曰「木曲直也」——曲者可直，直者可曲。</text>
</svg>

<text x="20" y="58" font-size="21" fill="#2F2A24">一张弓</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">故坚强者死之徒，柔弱者生之徒。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">强者，弓有力：满而将断。满不是力量，是离断点只剩一分。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">弓的用处全在「能回」：回弹是放箭，不回就是崩。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、拉满：两头都顶到极限</text>
<rect x="26" y="162" width="328" height="154" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>

<text x="250" y="254" font-size="4.6" fill="#A2503B" text-anchor="middle">满</text>

<circle cx="136" cy="294" r="3.2" fill="none" stroke="#A2503B" stroke-width="1.2"/>
<text x="104" y="184" font-size="4.2" fill="#A2503B">断点</text>
<text x="104" y="308" font-size="4.2" fill="#A2503B">断点</text>
<text x="190" y="330" font-size="4.6" fill="#4A5C55" text-anchor="middle">满到极处只有两条路：回弹，或者崩断</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、崩断：落下来的那一下</text>
<rect x="26" y="366" width="328" height="154" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M136,432 Q118,410 132,388" fill="none" stroke="#2F2A24" stroke-width="2.4"/>

<text x="168" y="462" font-size="4.5" fill="#6E6459">弦松了，箭射不出去</text>
<text x="104" y="442" font-size="4.2" fill="#A2503B">断在这里</text>
<text x="190" y="534" font-size="4.6" fill="#4A5C55" text-anchor="middle">一张弓最强之时，即其最危之时</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">弓的用处全在「能回」：弯是力存在库里，回才是力放出去。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">断了的弓，力气一分不少，只是再也回不去了。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">强不是力大，是离断点近。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="5.2" fill="#2F2A24" text-anchor="middle">故坚强者死之徒，柔弱者生之徒。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">徒者，步行也——两条路，不是一个类。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">故坚强者死之徒，柔弱者生之徒。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">徒者，《说文》曰「步行也」，从辵从土——其字本在走。</text>

<text x="282" y="456" font-size="4.5" fill="#A2503B" text-anchor="middle">木断了</text>
<text x="190" y="532" font-size="4.6" fill="#4A5C55" text-anchor="middle">柔者见弯，强者见断：弯可复，断不可复</text>
<text x="24" y="556" font-size="4.8" fill="#2F2A24">柔的失败是变形——弯了还能直回来；强的失败是断——断口没有第二种可能。</text>
<text x="24" y="572" font-size="4.8" fill="#2F2A24">至强之兵，是不能输的兵：一不能赢，则全输——非败于人也，无第二途也。</text>
<text x="24" y="590" font-size="5.0" fill="#4A5C55">故强大处下，柔弱处上。</text>
<line x1="24" y1="608" x2="338" y2="608" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="616" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="631" font-size="5.2" fill="#2F2A24" text-anchor="middle">是以兵强则灭，木强则折。</text>
<text x="190" y="644" font-size="4.7" fill="#4A5C55" text-anchor="middle">强者见断，柔者见弯。</text>
<line x1="20" y1="672" x2="360" y2="672" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="686" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="702" font-size="8.4" fill="#2F2A24">是以兵强则灭，木强则折。</text>
<text x="20" y="718" font-size="8.4" fill="#2F2A24">折者，《说文》曰「断也，从斤断艸」——斧落于草。</text>
