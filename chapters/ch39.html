<h1>第三十九章｜昔之得一者</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>
<div class="meta">正册共 3 幅　·　复核账随章落地　·　版本 2.9.154</div>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="得一不是得到什么，是不丢什么" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="448" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 九 章 · 得 一</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">六样东西，各自不裂</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">六种整全，不是一种整全。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="115" font-size="5.2" fill="#2F2A24" text-anchor="middle">昔之得一者：天得一以清，地得一以宁，神得一以灵，</text>
<text x="190" y="129" font-size="5.2" fill="#2F2A24" text-anchor="middle">谷得一以盈，万物得一以生，侯王得一以为天下贞。</text>
<text x="40" y="144" font-size="6.0" fill="#6E6459" text-anchor="middle">名</text>
<text x="126" y="144" font-size="5.2" fill="#4A5C55" text-anchor="middle">得一（守着的）</text>
<text x="258" y="144" font-size="5.2" fill="#A2503B" text-anchor="middle">无以（拿不出的）</text>
<line x1="24" y1="150" x2="338" y2="150" stroke="#2F2A24" stroke-width="0.7"/>
<text x="40" y="167" font-size="5.2" fill="#2F2A24" text-anchor="middle">天</text>
<text x="58" y="167" font-size="6.0" fill="#4A5C55">得一以清</text>
<text x="196" y="167" font-size="5.2" fill="#6E6459">无以清，将恐</text>
<text x="330" y="168" font-size="9.2" fill="#A2503B" text-anchor="end">裂</text>
<line x1="24" y1="176" x2="338" y2="176" stroke="#DCCBB0" stroke-width="0.5"/>
<text x="40" y="194" font-size="5.2" fill="#2F2A24" text-anchor="middle">地</text>
<text x="58" y="194" font-size="6.0" fill="#4A5C55">得一以宁</text>
<text x="196" y="194" font-size="5.2" fill="#6E6459">无以宁，将恐</text>
<text x="330" y="195" font-size="9.2" fill="#A2503B" text-anchor="end">废</text>
<line x1="24" y1="203" x2="338" y2="203" stroke="#DCCBB0" stroke-width="0.5"/>
<text x="40" y="221" font-size="5.2" fill="#2F2A24" text-anchor="middle">神</text>
<text x="58" y="221" font-size="6.0" fill="#4A5C55">得一以灵</text>
<text x="196" y="221" font-size="5.2" fill="#6E6459">无以灵，将恐</text>
<text x="330" y="222" font-size="9.2" fill="#A2503B" text-anchor="end">歇</text>
<line x1="24" y1="230" x2="338" y2="230" stroke="#DCCBB0" stroke-width="0.5"/>
<text x="40" y="248" font-size="5.2" fill="#2F2A24" text-anchor="middle">谷</text>
<text x="58" y="248" font-size="6.0" fill="#4A5C55">得一以盈</text>
<text x="196" y="248" font-size="5.2" fill="#6E6459">无以盈，将恐</text>
<text x="330" y="249" font-size="9.2" fill="#A2503B" text-anchor="end">竭</text>
<line x1="24" y1="257" x2="338" y2="257" stroke="#DCCBB0" stroke-width="0.5"/>
<text x="40" y="275" font-size="5.2" fill="#2F2A24" text-anchor="middle">万物</text>
<text x="58" y="275" font-size="6.0" fill="#4A5C55">得一以生</text>
<text x="196" y="275" font-size="5.2" fill="#6E6459">无以生，将恐</text>
<text x="330" y="276" font-size="9.2" fill="#A2503B" text-anchor="end">灭</text>
<line x1="24" y1="284" x2="338" y2="284" stroke="#DCCBB0" stroke-width="0.5"/>
<text x="40" y="302" font-size="5.2" fill="#2F2A24" text-anchor="middle">侯王</text>
<text x="58" y="302" font-size="6.0" fill="#4A5C55">得一以为天下贞</text>
<text x="196" y="302" font-size="5.2" fill="#6E6459">无以贵高，将恐</text>
<text x="330" y="303" font-size="9.2" fill="#A2503B" text-anchor="end">蹶</text>
<line x1="24" y1="311" x2="338" y2="311" stroke="#DCCBB0" stroke-width="0.5"/>
<rect x="20" y="324" width="340" height="50" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="341" font-size="5.2" fill="#2F2A24" text-anchor="middle">「一」不是把六样并成一样，是六样各自不裂：</text>
<text x="190" y="355" font-size="5.2" fill="#6E6459" text-anchor="middle">天得天的整全，地得地的整全，各清、各宁、各灵、各盈、各生、各贞。</text>
<text x="190" y="368" font-size="5.2" fill="#A2503B" text-anchor="middle">「得一」的反面不是「不得」，是「无以」——不是没得到，是拿不出了。</text>
<line x1="20" y1="386" x2="360" y2="386" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="400" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="416" font-size="8.4" fill="#2F2A24">「壹」是装满封口的壶；「一」只是一道横，没有盖。</text>
<text x="20" y="432" font-size="8.4" fill="#2F2A24">「得一」的对面不是「不得」，是「无以」——不是没得到，是拿不出了。</text>
</svg>
<figcaption class="cap"><span class="badge">主图</span><b>六样东西，各自不裂</b><span>ch39a-liu-de-yi.svg</span><span class="gold">金句：「壹」是装满封口的壶；「一」只是一道横，没有盖。</span><a class="zoom" href="../book/义理图/ch39a-liu-de-yi.png" target="_blank" rel="noopener">看原图</a></figcaption>
</figure>

<svg viewBox="0 0 380 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一切立着的东西，都靠一个不显眼的部分立着" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="612" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 九 章 · 托 底</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">底下那三只脚</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">整全不在明面上。</text>
<text x="24" y="120" font-size="5.2" fill="#2F2A24">一 · 鼎：贵的那一头，靠贱的那一头立着</text>
<ellipse cx="74" cy="170" rx="40" ry="24" fill="#F2EADA" stroke="#2F2A24" stroke-width="1"/>
<path d="M46,150 L46,138 L56,138" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M102,150 L102,138 L92,138" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="52" y1="192" x2="52" y2="206" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="74" y1="192" x2="74" y2="206" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="96" y1="192" x2="96" y2="206" stroke="#2F2A24" stroke-width="1.4"/>
<text x="74" y="174" font-size="5.2" fill="#A2503B" text-anchor="middle">贵 · 高</text>
<text x="74" y="218" font-size="5.8" fill="#6E6459" text-anchor="middle">贱 · 下（三只短足）</text>
<text x="150" y="142" font-size="5.2" fill="#2F2A24">三千斤的鼎，站在三只短短的脚上。</text>
<text x="150" y="156" font-size="5.2" fill="#2F2A24">足一断，腹立刻塌；腹越重，塌得越彻底。</text>
<text x="150" y="170" font-size="5.2" fill="#6E6459">越重的东西，落地的那一部分越小、越不起眼，</text>
<text x="150" y="182" font-size="5.2" fill="#6E6459">也从来不写进铭文。</text>
<text x="150" y="200" font-size="5.2" fill="#A2503B">故贵以贱为本，高以下为基。</text>
<text x="24" y="246" font-size="5.2" fill="#2F2A24">二 · 舆：数遍零件，数不出那个空位</text>
<rect x="50" y="264" width="68" height="34" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="50" y1="264" x2="118" y2="264" stroke="#DCCBB0" stroke-width="1"/>
<rect x="64" y="270" width="40" height="22" fill="none" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="5 4"/>
<text x="84" y="283" font-size="6.0" fill="#A2503B" text-anchor="middle">空位</text>
<circle cx="66" cy="308" r="12" fill="none" stroke="#2F2A24" stroke-width="1"/>
<circle cx="66" cy="308" r="3" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="118" y1="294" x2="146" y2="294" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="50" y1="298" x2="118" y2="298" stroke="#DCCBB0" stroke-width="0.8"/>
<text x="66" y="326" font-size="5.2" fill="#6E6459" text-anchor="middle">轮</text>
<text x="132" y="304" font-size="5.2" fill="#6E6459" text-anchor="middle">辕</text>
<text x="56" y="292" font-size="5.2" fill="#6E6459">辐</text>
<text x="150" y="268" font-size="5.2" fill="#2F2A24">「舆」是车厢——装人的那个空位，不是车轮车辕。</text>
<text x="150" y="282" font-size="5.2" fill="#2F2A24">轮、轴、辕、辐，数得再准，也数不出那个空位；</text>
<text x="150" y="296" font-size="5.2" fill="#2F2A24">空位不在零件里。这就是「数舆无舆」。</text>
<text x="150" y="312" font-size="5.2" fill="#6E6459">分析能把「有」拆到极细，拆不出「无」。</text>
<text x="150" y="330" font-size="5.2" fill="#A2503B">数得清的是零件，数不清的才是那辆车。</text>
<text x="24" y="378" font-size="5.2" fill="#2F2A24">三 · 玉与石：一块要借光，一块不用</text>
<ellipse cx="60" cy="428" rx="16" ry="12" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="66.2" y1="414.8" x2="68.6" y2="409.2" stroke="#A2503B" stroke-width="0.6"/>
<line x1="74.7" y1="420.0" x2="80.5" y2="416.5" stroke="#A2503B" stroke-width="0.6"/>
<line x1="78.0" y1="428.0" x2="85.0" y2="428.0" stroke="#A2503B" stroke-width="0.6"/>
<line x1="74.7" y1="436.0" x2="80.5" y2="439.5" stroke="#A2503B" stroke-width="0.6"/>
<line x1="66.2" y1="441.2" x2="68.6" y2="446.8" stroke="#A2503B" stroke-width="0.6"/>
<line x1="56.9" y1="414.2" x2="55.7" y2="408.3" stroke="#A2503B" stroke-width="0.6"/>
<line x1="53.8" y1="441.2" x2="51.4" y2="446.8" stroke="#A2503B" stroke-width="0.6"/>
<text x="60" y="454" font-size="5.6" fill="#A2503B" text-anchor="middle">玉 · 琭琭</text>
<path d="M104,422 L114,414 L128,420 L132,432 L122,441 L106,436 Z" fill="#E6D8C2" stroke="#2F2A24" stroke-width="0.9"/>
<text x="118" y="454" font-size="5.6" fill="#6E6459" text-anchor="middle">石 · 珞珞（字从玉）</text>
<text x="150" y="406" font-size="5.2" fill="#2F2A24">「琭琭」不是玉，是玉的光；光要照，照的人一走就没了。</text>
<text x="150" y="420" font-size="5.2" fill="#2F2A24">「珞」这个字本身从玉——那块石头不必去做玉。</text>
<text x="150" y="434" font-size="5.2" fill="#A2503B">玉的体面是别人给的，石的体面是自己有的。</text>
<text x="150" y="450" font-size="5.2" fill="#4A5C55">不欲琭琭如玉，珞珞如石。</text>
<rect x="20" y="474" width="340" height="48" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="490" font-size="5.2" fill="#2F2A24" text-anchor="middle">本是不动的，基是不空的；根断了树死，砖抽了墙倒。</text>
<text x="190" y="506" font-size="5.2" fill="#6E6459" text-anchor="middle">这一章不是叫人往下走，是叫人知道自己在什么上头站着。</text>
<text x="190" y="518" font-size="5.2" fill="#A2503B" text-anchor="middle">知道了，就不用怕低；不知道，才要一直往高里垫。</text>
<line x1="20" y1="534" x2="360" y2="534" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="548" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="564" font-size="8.4" fill="#2F2A24">数得清的是零件，数不清的才是那辆车。</text>
<text x="20" y="580" font-size="8.4" fill="#2F2A24">玉的体面是别人给的，石的体面是自己有的。</text>
</svg>

<rect x="0" y="0" width="380" height="608" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 九 章 · 其 三</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">玉 与 石</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">其致之：天无以清将恐裂，地无以宁将恐发。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「琭琭」，玉有光泽的样子；「珞珞」，石坚硬粗砺的样子。全书末一句落到这两样东西上。</text>
<text x="190" y="127" font-size="4.5" fill="#6E6459">玉贵而脆，石贱而坚：一个被捧着，一个被用着。</text>
<text x="24" y="152" font-size="5.0" fill="#4A5C55">一、如玉：被供着，也怕碎</text>
