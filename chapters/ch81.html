<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>

<text x="24" y="574" font-size="4.8" fill="#2F2A24">守得越紧，人越走不开——它越大，主人越不敢出门。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">圣人不积：不是不要仓，是知道仓算不出泉。</text>

<text x="20" y="720" font-size="8.4" fill="#2F2A24">积者，存也；不积者，不把天下往怀里拐。</text>
