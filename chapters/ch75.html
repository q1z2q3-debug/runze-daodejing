<h1>第七十五章｜食税</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>
<div class="meta">正册共 3 幅　·　复核账随章落地　·　版本 2.9.154</div>
<figure>
<?xml version="1.0" encoding="UTF-8"?>

<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 五 章 · 飢</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只空碗</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">民之饥，以其上食税之多，是以饥。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">飢，《说文》「饿也」——肚子空；饑，《说文》「谷不熟」——年成不好。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">本章用的是飢：老子不给天灾留位置。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、饑：谷不熟，账在天上</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>

<path d="M76,284 Q84,256 102,254 Q120,256 134,282" stroke="#2F2A24" stroke-width="1.3" fill="none"/>
<line x1="96" y1="258" x2="82" y2="246" stroke="#2F2A24" stroke-width="1"/>

<ellipse cx="136" cy="282" rx="7" ry="4" fill="none" stroke="#A2503B" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="228" y1="284" x2="228" y2="214" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="228" y1="236" x2="212" y2="226" stroke="#2F2A24" stroke-width="1"/>

<path d="M228,214 q-6,-14 0,-22 q6,8 0,22" fill="none" stroke="#A2503B" stroke-width="1" stroke-dasharray="3 2"/>
<text x="272" y="224" font-size="4.5" fill="#A2503B">饑：谷不熟</text>
<text x="272" y="236" font-size="4.5" fill="#6E6459">穗是空的</text>
<text x="190" y="330" font-size="4.6" fill="#4A5C55" text-anchor="middle">饑是天灾：年成不好，怨不到人身上</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、飢：肚子空，账在人身上</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="504" x2="330" y2="504" stroke="#2F2A24" stroke-width="1"/>
<path d="M64,440 Q92,496 120,440" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="62" y1="440" x2="122" y2="440" stroke="#2F2A24" stroke-width="1.3"/>
<ellipse cx="92" cy="440" rx="30" ry="5" fill="none" stroke="#B9A98F" stroke-width="0.6" stroke-dasharray="2 2"/>
<text x="92" y="486" font-size="4.5" fill="#6E6459" text-anchor="middle">碗里什么也没有</text>
<path d="M224,412 L286,412 L276,478 L234,478 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M224,412 q31,-22 62,0" fill="#DED2B8" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="228" y1="426" x2="282" y2="426" stroke="#B9A98F" stroke-width="0.6"/>
<line x1="232" y1="440" x2="278" y2="440" stroke="#B9A98F" stroke-width="0.6"/>
<line x1="236" y1="454" x2="274" y2="454" stroke="#B9A98F" stroke-width="0.6"/>
<text x="255" y="450" font-size="4.5" fill="#A2503B" text-anchor="middle">食税之多</text>
<path d="M126,462 Q168,448 220,428" fill="none" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3"/>
<polygon points="220,428 208,426 212,436" fill="#A2503B"/>
<text x="166" y="474" font-size="4.2" fill="#A2503B">取之于下</text>
<text x="190" y="534" font-size="4.6" fill="#4A5C55" text-anchor="middle">碗是空的，斗是满的：这一空一满，都在人的账上</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">《说文》「飢，饿也」，肚子空；「饑，谷不熟」，年成不好——两个字从来不混。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">老子不说「民之饑」，说「民之飢」：他把天灾这个变量拿掉了。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">天灾不在账上，账上只有人。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="5.2" fill="#2F2A24" text-anchor="middle">民之饥，以其上食税之多，是以饥。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">饿，不是天给的。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">民之饥，以其上食税之多，是以饥。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">飢者，《说文》曰「饿也」，腹空也；饑者，「谷不熟」也。</text>
</svg>

<text x="20" y="58" font-size="21" fill="#2F2A24">一条河</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">民之难治，以其上之有为，是以难治。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">治，《说文》「治，水。出东莱曲城阳丘山，南入海」——它先是一条河的名字。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">由河到治水，由治水到治理：治这个字的核心，不是管，是疏。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、一条河：它自己会走</text>
<rect x="26" y="162" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M40,236 Q120,228 200,236 Q280,244 340,238" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M40,274 Q120,266 200,274 Q280,282 340,276" fill="none" stroke="#2F2A24" stroke-width="1.2"/>

<polygon points="332,254 322,249 322,259" fill="#4A5C55"/>
<text x="190" y="208" font-size="4.5" fill="#6E6459" text-anchor="middle">水在两岸之间，自己往下走</text>
<text x="190" y="326" font-size="4.6" fill="#4A5C55" text-anchor="middle">治者，水名：一条河不需要人来管它</text>
<text x="24" y="350" font-size="4.8" fill="#4A5C55">二、筑堤：堵一次，水就找一次缝</text>
<rect x="26" y="362" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M40,418 Q190,410 340,420" fill="none" stroke="#2F2A24" stroke-width="1.2"/>

<path d="M46,440 q20,6 40,0 q20,-6 40,0 q20,6 40,0 q20,-6 40,0 q20,6 40,0" fill="none" stroke="#4A5C55" stroke-width="1"/>
<text x="64" y="456" font-size="4.2" fill="#4A5C55">水涨上来了</text>
<rect x="108" y="424" width="13" height="56" fill="#DED2B8" stroke="#2F2A24" stroke-width="1"/>

<text x="196" y="396" font-size="4.2" fill="#A2503B">漫过去：乱</text>
<path d="M178,480 Q192,502 214,488" fill="none" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3"/>
<polygon points="214,490 202,484 206,498" fill="#A2503B"/>
<text x="196" y="510" font-size="4.2" fill="#A2503B" text-anchor="middle">钻出去：逃</text>
<text x="258" y="446" font-size="4.2" fill="#6E6459">一层政令</text>
<text x="258" y="458" font-size="4.2" fill="#6E6459">一道堤</text>
<text x="190" y="530" font-size="4.6" fill="#4A5C55" text-anchor="middle">堵得越多，水越要找缝：堵出来的难，不叫难治</text>
<text x="24" y="554" font-size="4.8" fill="#2F2A24">帛书作「民之不治」：不是难，是根本治不了——因为病根就在「治」这个动作上。</text>
<text x="24" y="570" font-size="4.8" fill="#2F2A24">一个治水的人，不会去怪水。</text>
<text x="24" y="588" font-size="5.0" fill="#4A5C55">水没有去处，只有两个反应：要么漫过去，要么从底下钻出去。</text>
<line x1="24" y1="606" x2="338" y2="606" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="614" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="629" font-size="5.2" fill="#2F2A24" text-anchor="middle">民之难治，以其上之有为，是以难治。</text>
<text x="190" y="642" font-size="4.7" fill="#4A5C55" text-anchor="middle">难治者，堵之所致也。</text>
<line x1="20" y1="670" x2="360" y2="670" stroke="#E6D8C2" stroke-width="0.8"/>

<text x="20" y="700" font-size="8.4" fill="#2F2A24">民之难治，以其上之有为，是以难治。</text>
<text x="20" y="716" font-size="8.4" fill="#2F2A24">治者，《说文》曰「治，水，出东莱曲城阳丘山，南入海」——本为水名。</text>
</svg>

<text x="24" y="566" font-size="4.8" fill="#2F2A24">「无以生为」不是不要活，是不拿「生」当一件事去经营：活着是自然，经营活是项目。</text>
<text x="24" y="582" font-size="4.8" fill="#2F2A24">所以这一句不劝人饿着，也不劝人轻生——它反对的是「厚」，不是「生」。</text>
