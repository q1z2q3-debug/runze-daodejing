<text x="190" y="126" font-size="5.6" fill="#6E6459" text-anchor="middle">两个都是「收」：一个收力，一个收物。</text>

<text x="24" y="262" font-size="5.6" fill="#A2503B">一 · 收物</text>
<text x="88" y="262" font-size="5.6" fill="#2F2A24">粪，《说文》「弃除也」：把不要的扫出来，再送回田里。</text>
<text x="24" y="302" font-size="5.6" fill="#A2503B">二 · 收力</text>
<text x="88" y="302" font-size="5.6" fill="#2F2A24">却，《说文》「节欲也」：马不是自己回来的，是人先把手收住。</text>
<text x="24" y="342" font-size="5.6" fill="#A2503B">三 · 换用途</text>
<text x="88" y="342" font-size="5.6" fill="#2F2A24">没说不要马。那个时代最贵的军资，降成最贱的农具。</text>
<text x="24" y="382" font-size="5.6" fill="#A2503B">四 · 边界</text>
<text x="88" y="382" font-size="5.6" fill="#2F2A24">刀改犁，是把「推出去」改成「收回来」；边界不再往外长。</text>

<text x="190" y="458" font-size="5.8" fill="#4A5C55" text-anchor="middle">一件为杀而生的东西，改成一件为生而用的东西。</text>
