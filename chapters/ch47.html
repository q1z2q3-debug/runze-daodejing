<text x="20" y="78" font-size="10.5" fill="#6E6459">不窥于牖，以知天道。</text>

<text x="258" y="218" font-size="5.2" fill="#4A5C55">冲气为和。</text>
<text x="258" y="236" font-size="5.2" fill="#4A5C55">知道一处，就通了全部。</text>
<line x1="252" y1="248" x2="338" y2="248" stroke="#E6D8C2" stroke-width="0.4"/>
<text x="258" y="262" font-size="4.8" fill="#6E6459">知道走法的人，</text>
<text x="258" y="272" font-size="4.8" fill="#6E6459">站不站在路口都一样。</text>
<text x="24" y="330" font-size="5.6" fill="#2F2A24">不行而知，不是不走路：天下不是一堆散事，是一套统一的运化。</text>
<text x="24" y="346" font-size="5.6" fill="#2F2A24">散事只能一件件去看；一套机制，知道一处就通了全部。</text>
<text x="24" y="362" font-size="5.2" fill="#4A5C55">这就是「不出户」能成立的全部理由：他看的不是多，是那一条律。</text>
<line x1="24" y1="380" x2="338" y2="380" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="388" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="404" font-size="5.2" fill="#2F2A24" text-anchor="middle">站在路口的人只能选一条路；</text>
<text x="190" y="416" font-size="5.2" fill="#4A5C55" text-anchor="middle">知道路怎么走的人，不必选。</text>
<line x1="20" y1="442" x2="360" y2="442" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="456" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="472" font-size="8.4" fill="#2F2A24">站在路口的人只能选一条路；知道路怎么走的人，不必选。</text>
