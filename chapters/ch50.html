<h1>第五十章｜出生入死</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>
<div class="meta">正册共 3 幅　·　复核账随章落地　·　版本 2.9.154</div>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 566" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="出生入死是一条路的两头，不是两扇门；三成是天给的，三成是自己走进去的" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="566" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 章 · 路</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一条路的两头</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">出生入死。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「出生入死」不是两扇门，是一条路的两头：从出来的那一处，往进去的那一处走。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">「徒」，《说文》「步行也」——这三成不是三个命定，是三个方向。</text>
<text x="24" y="146" font-size="5.2" fill="#A2503B">一条路，三种走法</text>
<rect x="30" y="226" width="320" height="40" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.7"/>
<line x1="34" y1="242" x2="346" y2="242" stroke="#E6D8C2" stroke-width="0.5" stroke-dasharray="6 5"/>
<text x="30" y="216" font-size="5.0" fill="#4A5C55">出 · 生</text>
<text x="306" y="216" font-size="5.0" fill="#A2503B">入 · 死</text>
<circle cx="70" cy="232" r="2.6" fill="#4A5C55" opacity="0.9"/>
<circle cx="146" cy="232" r="2.6" fill="#4A5C55" opacity="0.75"/>
<circle cx="222" cy="232" r="2.6" fill="#4A5C55" opacity="0.6000000000000001"/>
<circle cx="70" cy="252" r="2.6" fill="#2F2A24" opacity="0.9"/>
<circle cx="140" cy="252" r="2.6" fill="#2F2A24" opacity="0.75"/>
<circle cx="210" cy="252" r="2.6" fill="#2F2A24" opacity="0.6000000000000001"/>
<circle cx="44" cy="242" r="2.6" fill="#A2503B"/>
<circle cx="92" cy="245" r="2.6" fill="#A2503B" opacity="0.8"/>
<circle cx="138" cy="248" r="2.6" fill="#A2503B" opacity="0.6"/>
<line x1="146" y1="250" x2="182" y2="284" stroke="#A2503B" stroke-width="0.8" marker-end="url(#arrS)"/>
<ellipse cx="200" cy="290" rx="17" ry="6" fill="none" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="3 2"/>
<text x="222" y="292" font-size="4.6" fill="#A2503B">死地：自己堆的土，塌成坑</text>
<circle cx="34" cy="298" r="2.4" fill="#4A5C55"/>
<text x="44" y="300" font-size="4.8" fill="#6E6459">生之徒：顺守生机，十有三</text>
<circle cx="34" cy="314" r="2.4" fill="#2F2A24"/>
<text x="44" y="316" font-size="4.8" fill="#6E6459">死之徒：禀赋耗散，十有三</text>
<circle cx="34" cy="330" r="2.4" fill="#A2503B"/>
<text x="44" y="332" font-size="4.8" fill="#6E6459">亦十有三：自己走进去的</text>
<text x="24" y="362" font-size="5.2" fill="#2F2A24">本来就有一批人容易早亡，那是禀赋与外缘；另外那一批，是自己动手把自己送进去的。</text>
<text x="24" y="378" font-size="5.2" fill="#2F2A24">而这后一批，恰恰是最用心养生的那一批。</text>
<text x="24" y="394" font-size="5.2" fill="#4A5C55">那个「亦」字，是老子全章唯一想说的。</text>
<line x1="24" y1="412" x2="338" y2="412" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="420" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="436" font-size="6.0" fill="#2F2A24" text-anchor="middle">三成是天给的，三成是自己走进去的；</text>
<text x="190" y="448" font-size="6.0" fill="#4A5C55" text-anchor="middle">这个「亦」字，是老子唯一想说的那句。</text>
<line x1="20" y1="474" x2="360" y2="474" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="488" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="504" font-size="8.4" fill="#2F2A24">三成是天给的，三成是自己走进去的；后面这个「亦」字，是老子唯一想说的那句。</text>
</svg>
<figcaption class="cap"><span class="badge">主图</span><b>一条路的两头</b><span>ch50a-yi-tiao-lu.svg</span><span class="gold">金句：三成是天给的，三成是自己走进去的；后面这个「亦」字，是老子唯一想说的那句。</span><a class="zoom" href="../book/义理图/ch50a-yi-tiao-lu.png" target="_blank" rel="noopener">看原图</a></figcaption>
</figure>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 556" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="厚、重、沉、地：厚和地是同一个方向，都是往下堆" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="556" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 章 · 土</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一把土</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">以其生生之厚。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「厚」是堆；「地」，《说文》「重浊阴为地」——重的东西沉下来，堆成那一层。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">所以「死地」不是会死的地方，是已经堆成土的那一层。</text>
<text x="24" y="146" font-size="5.2" fill="#4A5C55">一、薄：气还通，脚下没有那一层</text>
<line x1="30" y1="208" x2="350" y2="208" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="30" y="208" width="320" height="4" fill="#EFE6D4" stroke="#DCCBB0" stroke-width="0.35"/>
<circle cx="96" cy="217" r="1.4" fill="#E6D8C2" opacity="0.8"/>
<circle cx="128" cy="217" r="1.4" fill="#E6D8C2" opacity="0.8"/>
<circle cx="160" cy="217" r="1.4" fill="#E6D8C2" opacity="0.8"/>
<line x1="250" y1="162" x2="250" y2="210" stroke="#6E6459" stroke-width="0.8" marker-end="url(#arr)"/>
<text x="258" y="178" font-size="4.6" fill="#6E6459">角、爪、刃都找不到落点</text>
<text x="258" y="190" font-size="4.6" fill="#6E6459">薄薄一层，一按就散</text>
<text x="24" y="248" font-size="5.2" fill="#A2503B">二、厚：一层一层往上堆，堆成一层土</text>
<line x1="30" y1="342" x2="350" y2="342" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="56" y1="334" x2="304" y2="334" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="56" y1="326" x2="304" y2="326" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="56" y1="318" x2="304" y2="318" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="56" y1="310" x2="304" y2="310" stroke="#DCCBB0" stroke-width="0.5"/>
<rect x="56" y="310" width="248" height="32" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9" opacity="0.9"/>
<line x1="58" y1="334" x2="302" y2="334" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="58" y1="326" x2="302" y2="326" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="58" y1="318" x2="302" y2="318" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="56" y1="310" x2="304" y2="310" stroke="#2F2A24" stroke-width="1.6"/>
<line x1="250" y1="278" x2="250" y2="310" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<path d="M244,308 l6,-5 M250,308 l-6,-5" stroke="#A2503B" stroke-width="0.7" fill="none"/>
<text x="258" y="280" font-size="4.6" fill="#A2503B">厚到成层，就硬成一块壳</text>
<text x="258" y="292" font-size="4.6" fill="#A2503B">每一处硬，都是一个落点</text>
<text x="24" y="298" font-size="5.0" fill="#A2503B">厚 → 重 → 沉 → 地 → 死地</text>
<text x="10" y="334" font-size="4.5" fill="#6E6459">补品、防护</text>
<text x="10" y="354" font-size="4.5" fill="#6E6459">一层一层堆</text>
<text x="24" y="382" font-size="5.2" fill="#2F2A24">堆的不是坏东西：补品、防护、一整套「我在养」的念头，一样一样都出于好意。</text>
<text x="24" y="398" font-size="5.2" fill="#2F2A24">可「厚」这个字的方向是往下：厚的东西沉，沉到底，就成了地。</text>
<text x="24" y="414" font-size="5.2" fill="#4A5C55">死地不是命给的，是自己一锹一锹堆起来的；撤土比加甲难。</text>
<line x1="24" y1="432" x2="338" y2="432" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="440" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="456" font-size="6.0" fill="#2F2A24" text-anchor="middle">「厚」和「地」是同一个方向：都是往下堆；</text>
<text x="190" y="468" font-size="6.0" fill="#4A5C55" text-anchor="middle">堆到成层，人就站在自己堆的那块土上。</text>
<line x1="20" y1="494" x2="360" y2="494" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="508" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="524" font-size="8.4" fill="#2F2A24">「厚」和「地」是同一个方向：都是往下堆；堆到成层，人就站在自己堆的那块土上。</text>
</svg>
<figcaption class="cap"><span class="badge">主图</span><b>一把土</b><span>ch50b-yi-ba-tu.svg</span><span class="gold">金句：「厚」和「地」是同一个方向：都是往下堆；堆到成层，人就站在自己堆的那块土上。</span><a class="zoom" href="../book/义理图/ch50b-yi-ba-tu.png" target="_blank" rel="noopener">看原图</a></figcaption>
</figure>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 598" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="兕无所投其角：不是伤害不来，是伤害找不到落点" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="598" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 章 · 角</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只角</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">兕无所投其角，虎无所用其爪。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">角要顶穿一样东西，得有一个硬的点；爪要抓，得有一处能挂住的地方。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">不是「伤害不来」，是「伤害找不到落点」。</text>
<text x="24" y="146" font-size="5.2" fill="#A2503B">一、一身设防：每一道防线都是一个可破的点</text>
<rect x="202" y="172" width="14" height="80" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="204" y1="186" x2="214" y2="186" stroke="#DCCBB0" stroke-width="0.4"/>
<line x1="204" y1="206" x2="214" y2="206" stroke="#DCCBB0" stroke-width="0.4"/>
<line x1="204" y1="226" x2="214" y2="226" stroke="#DCCBB0" stroke-width="0.4"/>
<path d="M92,201 C138,195 160,199 200,212 C160,225 138,229 92,223 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M92,201 q-7,11 0,22" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="110" y1="199" x2="110" y2="225" stroke="#DCCBB0" stroke-width="0.35"/>
<line x1="144" y1="200" x2="144" y2="224" stroke="#DCCBB0" stroke-width="0.35"/>
<path d="M216,206 l10,-5 M216,218 l10,5" stroke="#A2503B" stroke-width="0.8" fill="none"/>
<line x1="216" y1="212" x2="256" y2="212" stroke="#A2503B" stroke-width="1.0" marker-end="url(#arrS)"/>
<text x="260" y="214" font-size="4.8" fill="#A2503B">穿进去</text>
<text x="30" y="260" font-size="4.6" fill="#6E6459">壳越硬，越像一个可以被钉住的靶心</text>
<text x="24" y="288" font-size="5.2" fill="#4A5C55">二、无死地：同一只角，没有地方可投</text>
<line x1="202" y1="314" x2="202" y2="394" stroke="#E6D8C2" stroke-width="0.6" stroke-dasharray="4 4"/>
<path d="M92,343 C138,337 160,341 200,354 C160,367 138,371 92,365 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M92,343 q-7,11 0,22" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="110" y1="341" x2="110" y2="367" stroke="#DCCBB0" stroke-width="0.35"/>
<line x1="144" y1="342" x2="144" y2="366" stroke="#DCCBB0" stroke-width="0.35"/>
<path d="M202,354 q12,-6 22,-18" fill="none" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<text x="226" y="330" font-size="4.8" fill="#4A5C55">角滑开了：无处落点</text>
<text x="30" y="402" font-size="4.6" fill="#6E6459">不是练成刀枪不入——那是把土堆得更厚</text>
<text x="24" y="424" font-size="5.2" fill="#2F2A24">一个全身紧绷、处处设防的人，恰恰把自己变成了一排靶子。</text>
<text x="24" y="440" font-size="5.2" fill="#2F2A24">无死地，不是没有一处可以被打——是没有一处「可以被定点击中」。</text>
<text x="24" y="456" font-size="5.2" fill="#4A5C55">所以那个「摄」字是往回收：不堆，就不成地。</text>
<line x1="24" y1="474" x2="338" y2="474" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="482" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="498" font-size="6.0" fill="#2F2A24" text-anchor="middle">他不是没遇到兕虎，</text>
<text x="190" y="510" font-size="6.0" fill="#4A5C55" text-anchor="middle">是兕虎找不到那个可以下角的地方。</text>
<line x1="20" y1="536" x2="360" y2="536" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="550" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="566" font-size="8.4" fill="#2F2A24">他不是没遇到兕虎，是兕虎找不到那个可以下角的地方。</text>
