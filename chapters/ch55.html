<h1>第五十五章｜含德之厚</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>
<div class="meta">正册共 3 幅　·　复核账随章落地　·　版本 2.9.154</div>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 652" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="含德之厚：含是衔在口里，不咽也不吐" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="652" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 五 章 · 含</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一张嘴</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">含德之厚，比于赤子。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「含」，《说文》「嗛也」——嗛就是衔：东西在嘴里，不咽下去，也不吐出来。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">不是「心里藏着一份德」：藏是往里放，含是含在嘴边。</text>
<text x="24" y="146" font-size="5.2" fill="#4A5C55">一、含着：在嘴边上，没咽下去，也没吐掉</text>
<ellipse cx="150" cy="222" rx="34" ry="12" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<ellipse cx="150" cy="254" rx="34" ry="12" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="150" cy="238" r="14" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="150" y1="272" x2="150" y2="298" stroke="#A2503B" stroke-width="0.8" marker-end="url(#arrS)"/>
<line x1="138" y1="286" x2="162" y2="286" stroke="#A2503B" stroke-width="1.1"/>
<text x="150" y="314" font-size="4.6" fill="#A2503B" text-anchor="middle">咽：咽下去就没了</text>
<line x1="196" y1="238" x2="246" y2="238" stroke="#A2503B" stroke-width="0.8" marker-end="url(#arrS)"/>
<line x1="236" y1="228" x2="236" y2="248" stroke="#A2503B" stroke-width="1.1"/>
<text x="248" y="232" font-size="4.6" fill="#A2503B">吐：吐出来</text>
<text x="248" y="244" font-size="4.5" fill="#6E6459">就散了</text>
<text x="60" y="204" font-size="5.0" fill="#4A5C55">含：不咽不吐</text>
<text x="24" y="330" font-size="5.2" fill="#A2503B">二、吐出来：那是第五十三章的「夸」</text>
<ellipse cx="96" cy="376" rx="30" ry="10" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<ellipse cx="96" cy="436" rx="30" ry="10" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="130" y1="406" x2="186" y2="406" stroke="#A2503B" stroke-width="1.0" marker-end="url(#arrS)"/>
<circle cx="204" cy="406" r="12" fill="#EFE6D4" stroke="#A2503B" stroke-width="1"/>
<text x="236" y="400" font-size="4.8" fill="#A2503B">摆出来</text>
<text x="236" y="412" font-size="4.5" fill="#6E6459">给人看</text>
<text x="96" y="458" font-size="4.6" fill="#6E6459" text-anchor="middle">张口给人看：吐一次，就少一点</text>
<text x="24" y="478" font-size="5.2" fill="#2F2A24">第四十四章说「多藏必厚亡」；本章说「含」——藏是往里放，含是含在嘴边。</text>
<text x="24" y="494" font-size="5.2" fill="#2F2A24">藏起来的东西会忘，含在嘴里的忘不掉：它离得很近，一直在。</text>
<text x="24" y="510" font-size="5.2" fill="#4A5C55">含着的人，安稳；一松开，就哭。</text>
<line x1="24" y1="528" x2="338" y2="528" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="536" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="552" font-size="6.0" fill="#2F2A24" text-anchor="middle">藏是往里放，含是含在嘴边；</text>
<text x="190" y="564" font-size="6.0" fill="#4A5C55" text-anchor="middle">藏起来的东西会忘，含在嘴里的忘不掉。</text>
<line x1="20" y1="590" x2="360" y2="590" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="604" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="620" font-size="8.4" fill="#2F2A24">藏是往里放，含是含在嘴边；藏起来的东西会忘，含在嘴里的忘不掉。</text>
</svg>
<figcaption class="cap"><span class="badge">主图</span><b>一张嘴</b><span>ch55a-yi-zhang-zui.svg</span><span class="gold">金句：藏是往里放，含是含在嘴边；藏起来的东西会忘，含在嘴里的忘不掉。</span><a class="zoom" href="../book/义理图/ch55a-yi-zhang-zui.png" target="_blank" rel="noopener">看原图</a></figcaption>
</figure>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="骨弱筋柔而握固：婴儿攥拳是为了收，成人攥拳是为了抓" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="630" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 五 章 · 拳</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只拳</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">骨弱筋柔而握固。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「握」，《说文》「搤持也」——搤，掐住；婴儿那只拳，拇指是扣在四指里面的。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">骨弱筋柔是外面软，握固是里面紧：边界柔，生机实。</text>
<text x="24" y="146" font-size="5.2" fill="#4A5C55">一、婴儿的拳：拇指扣在里面，把自己握住</text>
<ellipse cx="126" cy="242" rx="42" ry="34" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M102,212 C98,230 98,248 104,262" fill="none" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M116,212 C112,230 112,248 118,262" fill="none" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M130,212 C126,230 126,248 132,262" fill="none" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M144,212 C140,230 140,248 146,262" fill="none" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M88,238 C102,256 124,262 144,258 C154,256 156,246 150,238" fill="none" stroke="#A2503B" stroke-width="1.3"/>
<line x1="214" y1="248" x2="178" y2="248" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arrL)"/>
<text x="216" y="264" font-size="4.8" fill="#4A5C55">收：往里</text>
<text x="126" y="292" font-size="4.5" fill="#6E6459" text-anchor="middle">不抓外面的东西，就是收着</text>
<text x="268" y="218" font-size="4.8" fill="#4A5C55">外面软</text>
<text x="268" y="230" font-size="4.5" fill="#6E6459">（骨弱筋柔）</text>
<text x="268" y="256" font-size="4.8" fill="#4A5C55">里面紧</text>
<text x="268" y="268" font-size="4.5" fill="#6E6459">（握固）</text>
<text x="24" y="324" font-size="5.2" fill="#A2503B">二、成人的拳：同一只手，方向朝外</text>
<ellipse cx="126" cy="408" rx="42" ry="34" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M102,378 C98,396 98,414 104,428" fill="none" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M116,378 C112,396 112,414 118,428" fill="none" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M130,378 C126,396 126,414 132,428" fill="none" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M144,378 C140,396 140,414 146,428" fill="none" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M88,404 C102,422 124,428 144,424 C154,422 156,412 150,404" fill="none" stroke="#A2503B" stroke-width="1.3"/>
<line x1="172" y1="414" x2="210" y2="414" stroke="#A2503B" stroke-width="1.0" marker-end="url(#arrS)"/>
<rect x="216" y="398" width="42" height="34" fill="#FBF6EC" stroke="#A2503B" stroke-width="0.8"/>
<text x="237" y="416" font-size="4.8" fill="#A2503B" text-anchor="middle">物</text>
<text x="126" y="458" font-size="4.5" fill="#A2503B" text-anchor="middle">抓：往外；一放下就没了</text>
<text x="237" y="452" font-size="4.5" fill="#6E6459" text-anchor="middle">攥拳是为了抓</text>
<text x="24" y="480" font-size="5.2" fill="#2F2A24">同一只手，两个方向：一只往里收，一只往外抓。</text>
<text x="24" y="496" font-size="5.0" fill="#2F2A24">第五十二章讲「塞其兑，闭其门」，讲的就是这个「收」；只不过一个是功夫，一个是天生。</text>
<text x="24" y="512" font-size="5.2" fill="#4A5C55">收的那只，不用力就一直在；抓的那只，一放下就没了。</text>
<line x1="24" y1="530" x2="338" y2="530" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="538" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="554" font-size="6.0" fill="#2F2A24" text-anchor="middle">成年人攥拳是为了抓，婴儿攥拳是为了收；</text>
<text x="190" y="566" font-size="6.0" fill="#4A5C55" text-anchor="middle">抓是往外，收是往里，一只是同一只手。</text>
<line x1="20" y1="592" x2="360" y2="592" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="606" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="622" font-size="8.4" fill="#2F2A24">成年人攥拳是为了抓，婴儿攥拳是为了收；抓是往外，收是往里，一只是同一只手。</text>
</svg>
<figcaption class="cap"><span class="badge">主图</span><b>一只拳</b><span>ch55b-yi-zhi-quan.svg</span><span class="gold">金句：成年人攥拳是为了抓，婴儿攥拳是为了收；抓是往外，收是往里，一只是同一只手。</span><a class="zoom" href="../book/义理图/ch55b-yi-zhi-quan.png" target="_blank" rel="noopener">看原图</a></figcaption>
</figure>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="终日号而不嗄：婴儿哭一天嗓子不坏，不是嗓子好，是他从不憋气" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="616" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 五 章 · 气</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一根管</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">终日号而不嗄，和之至也。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「嗄」，声败。婴儿哭是气出尽了就吸，吸满了再哭；他不存气，也不压气。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">「和」不是平和这个状态，是进出的量对得上——中点一直在被穿过。</text>
<text x="24" y="146" font-size="5.2" fill="#4A5C55">一、不憋：两头通着，出尽了就进</text>
<rect x="48" y="182" width="284" height="40" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="48" y1="202" x2="332" y2="202" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="4 4"/>
<line x1="56" y1="192" x2="316" y2="192" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arr2)"/>
<line x1="316" y1="212" x2="56" y2="212" stroke="#A2503B" stroke-width="1.0" marker-end="url(#arrS)"/>
<text x="190" y="168" font-size="4.6" fill="#4A5C55" text-anchor="middle">进：吸到满</text>
<text x="190" y="230" font-size="4.6" fill="#A2503B" text-anchor="middle">出：哭到尽</text>
<text x="190" y="256" font-size="4.8" fill="#4A5C55" text-anchor="middle">中间没有闸：两头一直在换</text>
<text x="24" y="284" font-size="5.2" fill="#A2503B">二、憋着：中间装一道闸，管就鼓起来</text>
<rect x="48" y="320" width="284" height="40" fill="#FBEEE8" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M48,320 C110,290 270,290 332,320" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<path d="M48,320 C110,292 270,292 332,320" fill="none" stroke="#A2503B" stroke-width="0.4" opacity="0.6"/>
<rect x="178" y="318" width="12" height="44" fill="#EFE6D4" stroke="#A2503B" stroke-width="1.0"/>
<line x1="66" y1="340" x2="168" y2="340" stroke="#A2503B" stroke-width="1.0" marker-end="url(#arrS)"/>
<line x1="160" y1="330" x2="160" y2="350" stroke="#A2503B" stroke-width="1.2"/>
<text x="74" y="330" font-size="4.6" fill="#A2503B">进不去</text>
<text x="248" y="346" font-size="4.6" fill="#A2503B">出不来</text>
<text x="190" y="394" font-size="4.8" fill="#A2503B" text-anchor="middle">「存」起来了：有了存，就有了伤</text>
<text x="24" y="422" font-size="5.2" fill="#2F2A24">婴儿哭一整天，嗓子不沙，不是嗓子好，是他从不憋气。</text>
<text x="24" y="438" font-size="5.2" fill="#2F2A24">成年人哭，多半是憋着的：一边哭一边忍，气出不尽，也吸不满。</text>
<text x="24" y="454" font-size="5.0" fill="#4A5C55">「心使气」就是往这管子里装闸，派气去做事；一装，它就不按自己的节奏走了。</text>
<line x1="24" y1="472" x2="338" y2="472" stroke="#DCCBB0" stroke-width="0.6"/>

<text x="190" y="508" font-size="6.0" fill="#4A5C55" text-anchor="middle">一憋，就有了「存」，就有了「伤」。</text>
