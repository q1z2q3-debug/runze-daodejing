<text x="20" y="58" font-size="21" fill="#2F2A24">一条河</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">大国者下流，天下之牝，天下之交也。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「流」，《说文》「水行也」——水在走；「下流」是水走到底的那一段。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">江河的下游，是所有上游都往那儿去的地方。</text>
<text x="24" y="146" font-size="5.2" fill="#4A5C55">上游都往下走，走到低处汇成一处</text>

<text x="150" y="444" font-size="4.8" fill="#4A5C55" text-anchor="middle">下游：所有水都到这儿</text>
<text x="150" y="458" font-size="4.8" fill="#6E6459" text-anchor="middle">不是被推下去的，它本来就在那儿</text>
<text x="24" y="484" font-size="5.2" fill="#2F2A24">「下流」是水走到底的那一段，不是品行低下。</text>
<text x="24" y="500" font-size="5.0" fill="#2F2A24">不往上争的水，上游非来不可——它不用抢，位置就在那里。</text>
<text x="24" y="516" font-size="4.9" fill="#4A5C55">大国把自己放在那一段上，天下的水自己就往这儿流。</text>
<line x1="24" y1="534" x2="338" y2="534" stroke="#DCCBB0" stroke-width="0.6"/>

<text x="190" y="558" font-size="5.6" fill="#2F2A24" text-anchor="middle">下游不是被推下去的，它本来就在那儿；</text>
<text x="190" y="570" font-size="5.6" fill="#4A5C55" text-anchor="middle">不往上争的水，上游非来不可。</text>
<line x1="20" y1="596" x2="360" y2="596" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="610" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="626" font-size="8.4" fill="#2F2A24">下游不是被推下去的，它本来就在那儿；不往上争的水，上游非来不可。</text>
</svg>

<text x="70" y="424" font-size="4.6" fill="#4A5C55" text-anchor="middle">牝：静着，不动</text>
<text x="168" y="424" font-size="4.5" fill="#6E6459" text-anchor="middle">跟着的那群，都是它孵的</text>
