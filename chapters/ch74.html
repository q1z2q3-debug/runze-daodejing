<h1>第七十四章｜司杀</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>

<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 四 章 · 司</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一个翻过来的字</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">常有司杀者杀。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「司」，《说文》「臣司事于外者，从反后」——后是君；君翻过来，才是司。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">所以「司杀者」不是坐堂的那位，是在外面按规矩办事的那位。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、后：君坐堂上</text>
<rect x="26" y="162" width="328" height="148" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="66" y="274" width="200" height="9" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="34" y1="283" x2="330" y2="283" stroke="#2F2A24" stroke-width="1"/>
<rect x="118" y="188" width="86" height="86" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1.1" rx="3"/>
<line x1="130" y1="200" x2="192" y2="200" stroke="#DCCBB0" stroke-width="0.6"/>
<line x1="130" y1="262" x2="192" y2="262" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="161" y="254" font-size="38" fill="#2F2A24" text-anchor="middle">后</text>
<text x="161" y="300" font-size="4.5" fill="#6E6459" text-anchor="middle">君：坐堂发令</text>
<text x="252" y="214" font-size="4.5" fill="#6E6459">后：一人持口，</text>
<text x="252" y="226" font-size="4.5" fill="#6E6459">坐而发令</text>
<text x="190" y="326" font-size="4.6" fill="#4A5C55" text-anchor="middle">君在堂上：他发令，不办事</text>
<text x="24" y="348" font-size="4.8" fill="#4A5C55">二、司：同一个人翻过来，站到外面办事</text>
<rect x="26" y="360" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="104" y="382" width="86" height="86" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1.1" rx="3"/>
<text x="147" y="448" font-size="40" fill="#A2503B" text-anchor="middle">司</text>
<path d="M198,398 Q222,420 200,448" fill="none" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3"/>
<polygon points="200,448 206,438 194,438" fill="#A2503B"/>
<text x="232" y="420" font-size="4.5" fill="#A2503B">翻过来</text>
<circle cx="282" cy="422" r="6" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M273,430 L291,430 L292,460 L272,460 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>

<line x1="277" y1="460" x2="274" y2="478" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="287" y1="460" x2="290" y2="478" stroke="#2F2A24" stroke-width="0.9"/>
<text x="282" y="488" font-size="4.2" fill="#4A5C55" text-anchor="middle">在外办事</text>
<line x1="34" y1="478" x2="330" y2="478" stroke="#2F2A24" stroke-width="1"/>
<text x="190" y="526" font-size="4.6" fill="#4A5C55" text-anchor="middle">同一个字翻过来，堂上就没人了：发令的变成了办事的</text>
<text x="24" y="542" font-size="4.8" fill="#2F2A24">所以「司杀者」这个称呼本身就排除了坐堂的人：他不是掌生杀的，是按规矩办事的。</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">人想「代」他，先得把自己那一面翻过来——翻过来，就不是君了。</text>
<text x="24" y="576" font-size="5.0" fill="#4A5C55">字翻过来，堂就空出来：这才是这一章开头那一问的底。</text>
<line x1="24" y1="592" x2="338" y2="592" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="600" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="615" font-size="5.2" fill="#2F2A24" text-anchor="middle">司者，《说文》曰「臣司事于外者，从反后」；</text>
<text x="190" y="628" font-size="4.7" fill="#4A5C55" text-anchor="middle">后者，君也——君翻其身，乃为司。</text>
<line x1="20" y1="654" x2="360" y2="654" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="668" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="684" font-size="8.4" fill="#2F2A24">常有司杀者杀。</text>
<text x="20" y="700" font-size="8.4" fill="#2F2A24">司者，《说文》曰「臣司事于外者，从反后」；</text>
</svg>

<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 四 章 · 斫</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一把斧</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">夫代司杀者杀，是谓代大匠斫。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「斫」，《说文》「击也」，从斤——一下而断，断了就不能复。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">「代」，《说文》「更也」，是换班：替班的人手上没有那把斧的本事。</text>
<text x="24" y="150" font-size="4.8" fill="#4A5C55">一、匠人：斧落在木上，削出一件东西</text>

<path d="M176,262 L188,248 Q198,260 190,272 L174,268 Z" fill="#DED2B8" stroke="#2F2A24" stroke-width="1"/>
<text x="90" y="304" font-size="4.2" fill="#6E6459" text-anchor="middle">匠人</text>
<text x="272" y="240" font-size="4.5" fill="#4A5C55">只削一片</text>
<text x="272" y="252" font-size="4.5" fill="#6E6459">器由此成</text>
<text x="190" y="326" font-size="4.6" fill="#4A5C55" text-anchor="middle">斧在匠人手里，是「成」的工具：他知道这一刀要落多深</text>
<text x="24" y="348" font-size="4.8" fill="#A2503B">二、代班的人：同一把斧，一落就断，断不可复</text>
<rect x="26" y="360" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>

<path d="M138,378 L154,368 Q162,382 148,394 L132,388 Z" fill="#A2503B" fill-opacity="0.3" stroke="#A2503B" stroke-width="1"/>
<text x="92" y="504" font-size="4.2" fill="#A2503B" text-anchor="middle">代班</text>
<text x="276" y="430" font-size="4.5" fill="#A2503B">未观其性</text>
<text x="276" y="442" font-size="4.5" fill="#6E6459">先加其手</text>
<text x="190" y="528" font-size="4.6" fill="#4A5C55" text-anchor="middle">梓庆斋七日才敢加手；代班的人，一刀下去就断了</text>
<text x="24" y="544" font-size="4.8" fill="#2F2A24">所差的不在力气，在那七日：先看清楚这木头要成什么，才落斧。</text>
<text x="24" y="560" font-size="4.8" fill="#2F2A24">代班的人没有这七日——他手上没有这把斧的本事，只有这道令。</text>
<text x="24" y="578" font-size="5.0" fill="#4A5C55">所以「代大匠斫」不是夺权，是替班；替班的人，先输在手上。</text>
<line x1="24" y1="594" x2="338" y2="594" stroke="#DCCBB0" stroke-width="0.6"/>

<text x="190" y="617" font-size="5.0" fill="#2F2A24" text-anchor="middle">代者，《说文》曰「更也」，换班也；斫者，击也，从斤。</text>
<text x="190" y="630" font-size="4.7" fill="#4A5C55" text-anchor="middle">一下而断，不可复也。</text>
<line x1="20" y1="656" x2="360" y2="656" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="670" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="686" font-size="8.4" fill="#2F2A24">夫代司杀者杀，是谓代大匠斫。</text>
<text x="20" y="702" font-size="8.4" fill="#2F2A24">斫者，《说文》曰「击也」，从斤——一下而断，不可复也。</text>

<text x="24" y="552" font-size="4.8" fill="#2F2A24">「希」不是「少」，是「稀」；稀者疏也：上一章的疏在天为不漏，这里的疏在人必伤。</text>
<text x="24" y="568" font-size="4.8" fill="#2F2A24">所以这一句不说「必伤」，说「希有不伤」——留的那一点余地，是留给匠人的。</text>
<text x="24" y="586" font-size="5.0" fill="#4A5C55">代班的人没有那七日，斧就先替天把账记在他手上。</text>
