<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 二 章 · 威</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一位坐堂的婆婆</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">民不畏威，则大威至。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「威」，《说文》「姑也」，从女从戌——戌是斧：一个女人，手里备着一把斧。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">她不说话，全家不敢出声：这就是威的原型。</text>
<text x="24" y="150" font-size="4.8" fill="#4A5C55">一、备而不用：堂上不动，屋里自静</text>
<rect x="26" y="162" width="328" height="146" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>

<circle cx="148" cy="218" r="7" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M136,228 L160,228 L162,258 L134,258 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>

<line x1="212" y1="278" x2="212" y2="222" stroke="#2F2A24" stroke-width="1.4"/>
<path d="M210,214 L232,210 Q244,224 232,242 L210,236 Z" fill="#DED2B8" stroke="#2F2A24" stroke-width="1"/>

<text x="216" y="300" font-size="4.2" fill="#A2503B" text-anchor="middle">斧备着</text>
<circle cx="238" cy="246" r="5" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M230,253 L246,253 L247,274 L229,274 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="268" cy="246" r="5" fill="none" stroke="#2F2A24" stroke-width="0.9"/>

<path d="M290,253 L306,253 L307,274 L289,274 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<text x="286" y="294" font-size="4.2" fill="#6E6459" text-anchor="middle">不出一声</text>
<line x1="34" y1="278" x2="330" y2="278" stroke="#2F2A24" stroke-width="1"/>
<text x="190" y="324" font-size="4.6" fill="#4A5C55" text-anchor="middle">斧没动，声先低：不说话的那位，才让满屋的人不敢出声</text>
<text x="24" y="346" font-size="4.8" fill="#A2503B">二、斧一落：就只剩打人，威也就没了</text>
<rect x="26" y="358" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="88" y="464" width="110" height="8" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.7"/>
<rect x="78" y="456" width="130" height="8" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.7"/>

<circle cx="148" cy="402" r="7" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M136,412 L160,412 L162,442 L134,442 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="160" y1="416" x2="182" y2="396" stroke="#2F2A24" stroke-width="1"/>
<line x1="182" y1="396" x2="188" y2="372" stroke="#2F2A24" stroke-width="1.4"/>
<path d="M186,366 L206,362 Q220,378 206,394 L186,388 Z" fill="#A2503B" fill-opacity="0.3" stroke="#A2503B" stroke-width="1"/>
<circle cx="236" cy="438" r="5" fill="none" stroke="#2F2A24" stroke-width="0.9"/>

<line x1="318" y1="450" x2="328" y2="442" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="220" y1="420" x2="232" y2="412" stroke="#A2503B" stroke-width="1.0" marker-end="url(#arrS)"/>
<line x1="34" y1="470" x2="330" y2="470" stroke="#2F2A24" stroke-width="1"/>
<text x="190" y="526" font-size="4.6" fill="#4A5C55" text-anchor="middle">斧一落下，屋里就只剩躲与还手：被怕的那位，不再坐得住</text>
<text x="24" y="542" font-size="4.8" fill="#2F2A24">「民不畏威，则大威至」：不是他们要来打，是那个家自己在散。</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">威靠的是「我在这儿」这一件事；一动手，就换成「我打得过你」。</text>
<text x="24" y="576" font-size="5.0" fill="#4A5C55">前者不用斧，后者只剩斧——所以威亡在用斧那一年。</text>
<line x1="24" y1="592" x2="338" y2="592" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="600" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="615" font-size="5.2" fill="#2F2A24" text-anchor="middle">威从女从戌，戌者斧也；斧备而不用，用则威亡。</text>
<text x="190" y="628" font-size="4.7" fill="#4A5C55" text-anchor="middle">坐在那儿不动的那位，才叫威；一动，就只剩打。</text>
<line x1="20" y1="654" x2="360" y2="654" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="668" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="684" font-size="8.4" fill="#2F2A24">威从女从戌，戌者斧也；《说文》曰「姑也」——姑者，妇之尊长。</text>
<text x="20" y="700" font-size="8.4" fill="#2F2A24">斧备而不用，用则威亡；用斧者为人所还，还则堂不能安。</text>

<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="716" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 二 章 · 狎</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一窝挤着的狗</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">无狎其所居，无厌其所生。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「狎」，《说文》「犬可习也」——狗熟到能贴在人身上，就是狎。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">所以狎不是说屋子小，是说人跟人之间没有一寸距离。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、贴成一窝：屋子不小，都挤在一个角上</text>
<rect x="26" y="162" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M46,204 L176,172 L306,204 L306,284 L46,284 Z" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="46" y1="284" x2="330" y2="284" stroke="#2F2A24" stroke-width="1"/>
<circle cx="96" cy="218" r="6" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M86,226 L106,226 L108,258 L84,258 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="114" cy="246" rx="15" ry="8" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>

<ellipse cx="122" cy="260" rx="15" ry="8" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="107" cy="255" r="4.6" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="92" cy="256" rx="15" ry="8" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="77" cy="251" r="4.6" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="108" cy="272" rx="15" ry="8" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="93" cy="267" r="4.6" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>
<text x="214" y="244" font-size="4.5" fill="#A2503B">一窝挤在一角</text>
<text x="214" y="256" font-size="4.2" fill="#6E6459">屋还空着大半</text>
<text x="190" y="328" font-size="4.6" fill="#4A5C55" text-anchor="middle">房子并没变小：是身与身之间先没了空</text>
<text x="24" y="350" font-size="4.8" fill="#4A5C55">二、让开一线：狗各归一处，人才住得下</text>
<rect x="26" y="362" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M46,404 L176,372 L306,404 L306,484 L46,484 Z" fill="none" stroke="#2F2A24" stroke-width="1"/>

<circle cx="96" cy="418" r="6" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M86,426 L106,426 L108,458 L84,458 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="64" cy="458" rx="14" ry="7.5" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>

<circle cx="90" cy="462" r="4.4" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="154" cy="458" rx="14" ry="7.5" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="140" cy="454" r="4.4" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="128" cy="472" rx="14" ry="7.5" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="114" cy="468" r="4.4" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.9"/>
<text x="214" y="444" font-size="4.5" fill="#4A5C55">各归一处</text>
<text x="214" y="456" font-size="4.2" fill="#6E6459">中间留出一条</text>
<text x="190" y="528" font-size="4.6" fill="#4A5C55" text-anchor="middle">不狎不是赶走谁，是让每一头都有一处自己的地方</text>
<text x="24" y="544" font-size="4.8" fill="#2F2A24">「无狎其所居」：住的地方，先得留出一寸不属于任何人的空。</text>
<text x="24" y="560" font-size="4.8" fill="#2F2A24">挤到贴人，看着是亲，其实是没处可退：退无可退，话就不好说。</text>
<text x="24" y="578" font-size="5.0" fill="#4A5C55">所以这一句跟上一句连着：威要有堂上的距离，居要有身间的距离。</text>
<line x1="24" y1="594" x2="338" y2="594" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="602" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="617" font-size="5.2" fill="#2F2A24" text-anchor="middle">狎者，犬可习也，熟而贴人；非屋之窄，乃无距也。</text>
<text x="190" y="630" font-size="4.7" fill="#4A5C55" text-anchor="middle">让开一寸，人才住得下去。</text>

<text x="20" y="670" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="686" font-size="8.4" fill="#2F2A24">无狎其所居，无厌其所生。</text>
<text x="20" y="702" font-size="8.4" fill="#2F2A24">狎者，犬可习也，熟而贴人；非屋之窄，乃无距也。</text>

<svg viewBox="0 0 380 716" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="贵从贝，是价钱：自贵是给自己贴价签，自爱是不把自己当货" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="716" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 二 章 · 贵</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一杆秤</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">自知不自见，自爱不自贵。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「贵」，《说文》「物不贱也」，从贝——贵是价钱，不是德性。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">自爱是同一杆秤的另一头：不把自己贱卖。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、自贵：先给自己贴一张价签</text>
<rect x="26" y="162" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="196" y1="196" x2="196" y2="282" stroke="#2F2A24" stroke-width="1.6"/>
<line x1="150" y1="192" x2="248" y2="200" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="150" y1="192" x2="150" y2="202" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M150,202 q0,6 -6,8 q6,2 6,8" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="134" y="218" width="34" height="30" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<text x="151" y="230" font-size="5.6" fill="#2F2A24" text-anchor="middle">我</text>
<rect x="202" y="214" width="46" height="26" fill="#A2503B" fill-opacity="0.16" stroke="#A2503B" stroke-width="1"/>
<text x="225" y="224" font-size="4.2" fill="#A2503B" text-anchor="middle">价签</text>
<text x="225" y="234" font-size="4.2" fill="#A2503B" text-anchor="middle">很贵</text>
<line x1="166" y1="218" x2="202" y2="218" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="3 3"/>
<path d="M248,196 l8,10 l-16,0 Z" fill="#2F2A24" fill-opacity="0.4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="60" y1="282" x2="322" y2="282" stroke="#2F2A24" stroke-width="1"/>
<text x="190" y="328" font-size="4.6" fill="#4A5C55" text-anchor="middle">货上贴价签，秤就只称价钱：先标了，剩下的都是比价</text>
<text x="24" y="350" font-size="4.8" fill="#4A5C55">二、自爱：不上秤盘，不把自己当货</text>
<rect x="26" y="362" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="196" y1="396" x2="196" y2="482" stroke="#2F2A24" stroke-width="1.6"/>
<line x1="150" y1="392" x2="248" y2="400" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M150,400 q0,6 -6,8 q6,2 6,8" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M248,396 l8,10 l-16,0 Z" fill="#2F2A24" fill-opacity="0.4" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M134,416 Q150,428 166,416" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="134" y1="416" x2="150" y2="414" stroke="#B9A98F" stroke-width="0.6"/>
<line x1="166" y1="416" x2="150" y2="414" stroke="#B9A98F" stroke-width="0.6"/>
<text x="150" y="436" font-size="4.0" fill="#6E6459" text-anchor="middle">空盘</text>
<circle cx="108" cy="408" r="7" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M96,418 L120,418 L122,458 L94,458 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="120" y1="424" x2="134" y2="444" stroke="#2F2A24" stroke-width="1"/>
<line x1="130" y1="444" x2="146" y2="444" stroke="#2F2A24" stroke-width="1"/>
<line x1="130" y1="448" x2="144" y2="448" stroke="#2F2A24" stroke-width="0.6" opacity="0.6"/>
<text x="110" y="392" font-size="4.2" fill="#4A5C55">手摊着，不上秤</text>
<line x1="103" y1="458" x2="99" y2="482" stroke="#2F2A24" stroke-width="1"/>
<line x1="113" y1="458" x2="117" y2="482" stroke="#2F2A24" stroke-width="1"/>
<line x1="60" y1="482" x2="322" y2="482" stroke="#2F2A24" stroke-width="1"/>
<text x="190" y="528" font-size="4.6" fill="#4A5C55" text-anchor="middle">自爱不是抬价，是不把自己挂上去：不上盘，就不必被人称</text>
<text x="24" y="544" font-size="4.8" fill="#2F2A24">自见是把自己摆出来给人看；自知是知道自己在哪儿。</text>
<text x="24" y="560" font-size="4.8" fill="#2F2A24">自贵是贴价签；自爱是惜身。一杆秤，两头的话不一样。</text>
<text x="24" y="578" font-size="5.0" fill="#4A5C55">「去彼取此」：把价签取下，把身子留住。</text>
<line x1="24" y1="594" x2="338" y2="594" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="602" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="617" font-size="5.2" fill="#2F2A24" text-anchor="middle">自知不自见，自爱不自贵；故去彼取此。</text>
<text x="190" y="630" font-size="4.7" fill="#4A5C55" text-anchor="middle">取的是身子，去的是那张价签。</text>
<line x1="20" y1="656" x2="360" y2="656" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="670" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="686" font-size="8.4" fill="#2F2A24">自知不自见，自爱不自贵。</text>
<text x="20" y="702" font-size="8.4" fill="#2F2A24">故去彼取此。</text>
</svg>
