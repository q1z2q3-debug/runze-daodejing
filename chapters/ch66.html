<text x="20" y="58" font-size="21" fill="#2F2A24">一条水路</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">以其善下之，故能为百谷王。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「谷」，《说文》「泉出通川为谷」——泉水出地，流出去通到川，这一段叫谷。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">谷不吸引水：谷只是低，水自己往低处走。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、剖开看：泉出来，沿低处走，通到川</text>

<text x="190" y="356" font-size="4.8" fill="#6E6459" text-anchor="middle" letter-spacing="2">百 谷</text>
<line x1="190" y1="374" x2="190" y2="390" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arr2)"/>
<text x="190" y="368" font-size="4.4" fill="#A2503B" text-anchor="middle">王：天下所归往</text>
<text x="190" y="456" font-size="5.2" fill="#6E6459" text-anchor="middle">海不以大名，以纳百川：低处的好处，在所有的水都往这儿走</text>
<text x="24" y="474" font-size="4.9" fill="#2F2A24">「王」，《说文》「天下所归往也」：往，不是管。</text>
<text x="24" y="490" font-size="4.9" fill="#2F2A24">江海能王百谷，不是因为管着百川，是因为百川往它那儿去。</text>
<text x="24" y="508" font-size="5.0" fill="#4A5C55">水不是被叫来的，是自己走来的。</text>
<line x1="24" y1="526" x2="338" y2="526" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="534" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="549" font-size="5.4" fill="#2F2A24" text-anchor="middle">谷不是山的凹，是水的路；</text>
<text x="190" y="562" font-size="5.0" fill="#4A5C55" text-anchor="middle">不是谷招水，是水自己往低处走。</text>
<line x1="20" y1="588" x2="360" y2="588" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="602" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="618" font-size="8.4" fill="#2F2A24">谷不是山的凹，是水的路；不是谷招水，是水自己往低处走。</text>
<text x="20" y="634" font-size="8.4" fill="#2F2A24">王是天下所归往：往者自至，非呼而来；海以纳百川名，不以大名。</text>

<text x="20" y="58" font-size="21" fill="#2F2A24">一口气</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">天下乐推而不厌。</text>

<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「厌」，《说文》「笮也」，笮是压；从厂从猒——厂是山崖，猒是「饱也」。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">一只吃饱的兽，被压在崖底下：又撑，又压。</text>

<text x="56" y="390" font-size="4.3" fill="#4A5C55">乐推：不是被挤上去</text>
<text x="56" y="400" font-size="4.3" fill="#4A5C55">是自己愿意送他上去</text>
<text x="190" y="496" font-size="4.6" fill="#4A5C55" text-anchor="middle">不厌：不觉得他压得慌，气还喘得动</text>
<text x="24" y="516" font-size="4.8" fill="#2F2A24">厌不是情绪，是体感：一个上位者好不好，看底下人觉得轻不觉得轻。</text>
<text x="24" y="532" font-size="4.8" fill="#2F2A24">乐推的推，《说文》「排也」——用手往外送：不是被挤上去，是自己愿意送上去。</text>
<text x="24" y="550" font-size="5.0" fill="#4A5C55">不争不是打赢所有人，是对手不存在：他不拽那件东西。</text>

<text x="20" y="674" font-size="8.4" fill="#2F2A24">天下乐推而不厌：送上去，不觉得沉。</text>
