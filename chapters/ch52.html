<h1>第五十二章｜知子守母</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>
<div class="meta">正册共 3 幅　·　复核账随章落地　·　版本 2.9.154</div>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="出去是顺水，回来是逆水：这一章的全部功夫，都在逆水那半圈上" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="612" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 二 章 · 圈</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一个圈</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">既得其母，以知其子；既知其子，复守其母。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">母生子，是天道；子归母，是功夫。出去那半圈，一步不用你走，它自己会走。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">回来那半圈，每一步都要你自己迈。</text>
<text x="24" y="146" font-size="5.2" fill="#A2503B">一个闭环：从母到子，是出去；从子到母，是回来</text>
<path d="M100,258 A110,54 0 0 1 280,258" fill="none" stroke="#A2503B" stroke-width="1.4"/>
<polygon points="186,198 186,210 197,204" fill="#A2503B"/>
<path d="M280,258 A110,54 0 0 1 100,258" fill="none" stroke="#4A5C55" stroke-width="1.4"/>
<polygon points="194,318 194,306 183,312" fill="#4A5C55"/>
<circle cx="80" cy="258" r="20" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1"/>
<text x="80" y="261" font-size="5.2" fill="#2F2A24" text-anchor="middle">母</text>
<text x="80" y="288" font-size="5.2" fill="#6E6459" text-anchor="middle">无·本源</text>
<circle cx="300" cy="258" r="20" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<text x="300" y="261" font-size="5.2" fill="#2F2A24" text-anchor="middle">子</text>
<text x="300" y="288" font-size="5.2" fill="#6E6459" text-anchor="middle">有·万象</text>
<text x="190" y="180" font-size="5.0" fill="#A2503B" text-anchor="middle">出去：顺水（天定的）</text>
<text x="190" y="342" font-size="5.0" fill="#4A5C55" text-anchor="middle">回来：逆水（人做的）</text>
<text x="24" y="364" font-size="5.2" fill="#2F2A24">两个岔口：站在这半圈上，还是站在那半圈上</text>
<rect x="20" y="374" width="164" height="54" fill="#FBF6EC" stroke="#4A5C55" stroke-width="1.0"/>
<text x="102" y="390" font-size="5.2" fill="#4A5C55" text-anchor="middle">塞其兑，闭其门</text>
<text x="102" y="404" font-size="5.2" fill="#6E6459" text-anchor="middle">站在回来的半圈上</text>
<text x="102" y="416" font-size="5.2" fill="#6E6459" text-anchor="middle">终身不勤：不用那么劳</text>
<rect x="196" y="374" width="164" height="54" fill="#FBF6EC" stroke="#A2503B" stroke-width="1.0"/>
<text x="278" y="390" font-size="5.2" fill="#A2503B" text-anchor="middle">开其兑，济其事</text>
<text x="278" y="404" font-size="5.2" fill="#6E6459" text-anchor="middle">站在出去那半圈上</text>
<text x="278" y="416" font-size="5.2" fill="#6E6459" text-anchor="middle">终身不救：一辈子停不下来</text>
<text x="24" y="446" font-size="5.2" fill="#2F2A24">「复」是走回来，不是停下来；没出去过的，谈不上复。</text>
<text x="24" y="462" font-size="5.2" fill="#2F2A24">出去要看得见万象（知子），回来要守得住虚源（守母）；</text>
<text x="24" y="478" font-size="5.2" fill="#4A5C55">不是关在母里不出来——那是闭门造车，不叫守母。</text>
<line x1="24" y1="496" x2="338" y2="496" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="504" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="520" font-size="6.0" fill="#2F2A24" text-anchor="middle">母生子，是天道；子归母，是功夫；</text>
<text x="190" y="532" font-size="6.0" fill="#4A5C55" text-anchor="middle">本章讲的，就是这后半圈。</text>
<line x1="20" y1="558" x2="360" y2="558" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="572" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="588" font-size="8.4" fill="#2F2A24">母生子，是天道；子归母，是功夫；本章讲的，就是这后半圈。</text>
</svg>
<figcaption class="cap"><span class="badge">主图</span><b>一个圈</b><span>ch52a-yi-ge-quan.svg</span><span class="gold">金句：母生子，是天道；子归母，是功夫；本章讲的，就是这后半圈。</span><a class="zoom" href="../book/义理图/ch52a-yi-ge-quan.png" target="_blank" rel="noopener">看原图</a></figcaption>
</figure>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="塞其兑，闭其门；开其兑，济其事：口一张一收，人就在两个半圈上" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="664" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 二 章 · 口</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一张脸</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">塞其兑，闭其门……开其兑，济其事。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「兑」在《易·说卦》里就是「口」——口、眼、耳、鼻，人身上一共就这几个口。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">塞不是缝上，是「不敞着」。</text>
<text x="24" y="146" font-size="5.2" fill="#4A5C55">一、塞其兑：把口收一收</text>
<circle cx="104" cy="230" r="44" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<circle cx="88" cy="218" r="6" fill="#FBF6EC" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="81" y1="218" x2="95" y2="218" stroke="#A2503B" stroke-width="1.1"/>
<circle cx="120" cy="218" r="6" fill="#FBF6EC" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="113" y1="218" x2="127" y2="218" stroke="#A2503B" stroke-width="1.1"/>
<ellipse cx="104" cy="252" rx="13" ry="7" fill="#FBF6EC" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="91" y1="252" x2="117" y2="252" stroke="#A2503B" stroke-width="1.1"/>
<text x="104" y="286" font-size="4.8" fill="#A2503B" text-anchor="middle">三孔皆塞</text>
<line x1="30" y1="218" x2="74" y2="218" stroke="#A2503B" stroke-width="0.8" marker-end="url(#arrS)"/>
<text x="30" y="232" font-size="4.5" fill="#6E6459">外头的东西</text>
<text x="30" y="242" font-size="4.5" fill="#6E6459">进不来</text>
<text x="24" y="304" font-size="5.2" fill="#A2503B">二、开其兑，济其事：口一敞，事一件件往外长</text>
<circle cx="104" cy="388" r="44" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<circle cx="88" cy="376" r="6" fill="#FBF6EC" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="120" cy="376" r="6" fill="#FBF6EC" stroke="#2F2A24" stroke-width="0.7"/>
<ellipse cx="104" cy="410" rx="13" ry="7" fill="#FBF6EC" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="74" y1="376" x2="30" y2="366" stroke="#A2503B" stroke-width="0.8" marker-end="url(#arrS)"/>
<line x1="134" y1="376" x2="178" y2="366" stroke="#A2503B" stroke-width="0.8" marker-end="url(#arrS)"/>
<line x1="104" y1="422" x2="104" y2="450" stroke="#A2503B" stroke-width="0.8" marker-end="url(#arrS)"/>
<rect x="10" y="354" width="9" height="9" fill="#FBF6EC" stroke="#A2503B" stroke-width="0.6"/>
<rect x="20" y="354" width="9" height="9" fill="#FBF6EC" stroke="#A2503B" stroke-width="0.6"/>
<rect x="186" y="354" width="9" height="9" fill="#FBF6EC" stroke="#A2503B" stroke-width="0.6"/>
<rect x="196" y="354" width="9" height="9" fill="#FBF6EC" stroke="#A2503B" stroke-width="0.6"/>
<rect x="96" y="454" width="9" height="9" fill="#FBF6EC" stroke="#A2503B" stroke-width="0.6"/>
<rect x="106" y="454" width="9" height="9" fill="#FBF6EC" stroke="#A2503B" stroke-width="0.6"/>
<text x="186" y="396" font-size="4.5" fill="#6E6459">事：一件未</text>
<text x="186" y="406" font-size="4.5" fill="#6E6459">完又起一件</text>
<text x="104" y="474" font-size="4.6" fill="#A2503B" text-anchor="middle">一辈子停不下来：「救」训「止」，不救是止不住</text>
<text x="24" y="496" font-size="5.2" fill="#2F2A24">「塞」与「闭」是两个动作：孔是一个个的，堵；门是一整扇的，合。</text>
<text x="24" y="512" font-size="5.2" fill="#2F2A24">「勤」训「劳」：不勤不是不干活，是不用那么劳。</text>
<text x="24" y="528" font-size="5.2" fill="#4A5C55">两个半圈的分界，就在这几个口上：收着，就在回来那半圈上。</text>
<line x1="24" y1="546" x2="338" y2="546" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="554" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="570" font-size="6.0" fill="#2F2A24" text-anchor="middle">「兑」是口，「袭」是袍，「救」是止；</text>
<text x="190" y="582" font-size="6.0" fill="#4A5C55" text-anchor="middle">三个字，一个在收口，一个在穿衣，一个在刹车。</text>
<line x1="20" y1="608" x2="360" y2="608" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="622" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="638" font-size="8.4" fill="#2F2A24">「兑」是口，「袭」是袍，「救」是止；三个字，一个在收口，一个在穿衣，一个在刹车。</text>
</svg>

<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 二 章 · 灯</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一盏灯</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">用其光，复归其明，无遗身殃，是为袭常。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">灯照屋子，屋子照亮了；灯一关，屋子黑，灯还在。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">光是照东西的，明是那个照本身；光一直在外面，人就一直在外面。</text>
<text x="24" y="146" font-size="5.2" fill="#A2503B">一、用其光：开灯，照见屋里的东西</text>
<rect x="56" y="172" width="268" height="118" fill="#FDFAF2" stroke="#2F2A24" stroke-width="1.0"/>
<polygon points="86,194 62,290 318,290 236,194" fill="#F6E9B8" opacity="0.55" stroke="none"/>
<path d="M74,194 L100,194 L96,180 L78,180 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="87" cy="203" r="5" fill="#F2C46B" stroke="#2F2A24" stroke-width="0.6"/>
<line x1="87" y1="194" x2="87" y2="198" stroke="#2F2A24" stroke-width="0.6"/>
<rect x="150" y="264" width="46" height="14" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.7"/>

<line x1="228" y1="262" x2="244" y2="262" stroke="#E6D8C2" stroke-width="0.5"/>
<text x="87" y="168" font-size="4.6" fill="#A2503B" text-anchor="middle">光：照出去</text>
<text x="190" y="306" font-size="4.6" fill="#6E6459" text-anchor="middle">开灯：屋里每样东西都看得见——这就是「用其光」</text>
<text x="24" y="340" font-size="5.2" fill="#4A5C55">二、复归其明：灯一关，屋子黑，灯还在</text>
<rect x="56" y="366" width="268" height="118" fill="#EFE8D8" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M74,388 L100,388 L96,374 L78,374 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="87" cy="397" r="5" fill="#FBF6EC" stroke="#4A5C55" stroke-width="1.1"/>
<line x1="87" y1="388" x2="87" y2="392" stroke="#2F2A24" stroke-width="0.6"/>
<rect x="150" y="458" width="46" height="14" fill="#E6DDC9" stroke="#2F2A24" stroke-width="0.7"/>
<rect x="206" y="452" width="60" height="20" fill="#E6DDC9" stroke="#2F2A24" stroke-width="0.7"/>
<text x="151" y="426" font-size="4.5" fill="#8A7E70">东西还在这儿，只是看不清了</text>
<text x="110" y="362" font-size="4.6" fill="#4A5C55" text-anchor="middle">灯还在：这就是「明」</text>
<text x="24" y="514" font-size="5.2" fill="#2F2A24">人最常见的病，是把「光」当成自己：光照到哪儿，人就以为自己在哪儿。</text>
<text x="24" y="530" font-size="5.2" fill="#2F2A24">照得越远，人越散；「复归其明」就是：光收回来，人还在原处。</text>
<text x="24" y="546" font-size="5.2" fill="#4A5C55">「袭」是左衽袍，一层层穿上：那件「常」，是要天天穿，穿到长在身上。</text>
<line x1="24" y1="564" x2="338" y2="564" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="572" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="588" font-size="6.0" fill="#2F2A24" text-anchor="middle">光是照东西的，明是那个照本身；</text>
<text x="190" y="600" font-size="6.0" fill="#4A5C55" text-anchor="middle">光一直在外面，人就一直在外面。</text>
<line x1="20" y1="626" x2="360" y2="626" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="640" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="656" font-size="8.4" fill="#2F2A24">光是照东西的，明是那个照本身；光一直在外面，人就一直在外面。</text>
