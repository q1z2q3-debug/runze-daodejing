<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">所以「未兆」不是还没有征兆，是还没烧、还没裂、还读不出来。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、这片甲：钻了孔，还没点火</text>

<text x="24" y="394" font-size="4.9" fill="#2F2A24">「未兆」不是征兆还小，是还没裂——连它自己都还不知道往哪儿走。</text>
<text x="24" y="412" font-size="5.0" fill="#4A5C55">其未兆易谋：趁它还没裂，还来得及决定它裂成什么样。</text>

<text x="190" y="466" font-size="5.2" fill="#4A5C55" text-anchor="middle">还没烧，就还读不出来——也还来得及。</text>

<text x="20" y="506" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="522" font-size="8.4" fill="#2F2A24">兆是烧出来的那道裂纹；还没烧，就还读不出来——也还来得及。</text>
<text x="20" y="538" font-size="8.4" fill="#2F2A24">未兆不是征兆还小，是还没裂；趁它没裂，才来得及决定它裂成什么样。</text>

<text x="190" y="432" font-size="5.2" fill="#4A5C55" text-anchor="middle">辅万物之自然，就是托住，不去捏。</text>

<text x="20" y="472" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="488" font-size="8.4" fill="#2F2A24">牙自己长，骨头只托；辅万物之自然，就是托住，不去捏。</text>
