<h1>第七十七章｜张弓</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>
<div class="meta">正册共 3 幅　·　复核账随章落地　·　版本 2.9.154</div>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 726" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="校准是两个方向的：高则抑，低则举" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="726" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 七 章 · 张</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一张弦</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">天之道，其犹张弓与？</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">张，《说文》「施弓弦也」——不是拉弓，是上弦：把两端调齐。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">拉满者只一个方向；调弦者两个方向：高则下之，低则上之。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、一头高了：抑之</text>
<rect x="26" y="162" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="60" y1="240" x2="320" y2="240" stroke="#B9A98F" stroke-width="0.7" stroke-dasharray="5 3"/>
<text x="60" y="254" font-size="4.0" fill="#B9A98F">准头</text>
<path d="M146,212 Q92,246 258,258" fill="none" stroke="#2F2A24" stroke-width="2.6"/>
<line x1="146" y1="212" x2="258" y2="258" stroke="#B9A98F" stroke-width="0.9"/>
<circle cx="146" cy="212" r="3" fill="none" stroke="#A2503B" stroke-width="1.2"/>
<circle cx="258" cy="258" r="3" fill="none" stroke="#B9A98F" stroke-width="1"/>
<text x="196" y="208" font-size="4.5" fill="#A2503B">左梢高了：弦是斜的</text>
<path d="M104,188 Q122,198 140,188" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="114" y1="190" x2="114" y2="182" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="121" y1="190" x2="121" y2="182" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="128" y1="190" x2="128" y2="182" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="118" y1="206" x2="118" y2="196" stroke="#A2503B" stroke-width="1" stroke-dasharray="3 2"/>
<polygon points="118,206 113,196 123,196" fill="#A2503B"/>
<text x="190" y="196" font-size="4.5" fill="#A2503B" text-anchor="middle">抑：一手按下</text>
<text x="190" y="278" font-size="4.5" fill="#6E6459" text-anchor="middle">抑者，《说文》曰「按也」——一手可矣</text>
<text x="190" y="328" font-size="4.6" fill="#4A5C55" text-anchor="middle">高者抑之：高处只需一只手按住</text>
<text x="24" y="352" font-size="4.8" fill="#4A5C55">二、一头低了：举之</text>
<rect x="26" y="364" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="60" y1="448" x2="320" y2="448" stroke="#B9A98F" stroke-width="0.7" stroke-dasharray="5 3"/>
<path d="M146,420 Q92,454 258,480" fill="none" stroke="#2F2A24" stroke-width="2.6"/>
<line x1="146" y1="420" x2="258" y2="480" stroke="#B9A98F" stroke-width="0.9"/>
<circle cx="146" cy="420" r="3" fill="none" stroke="#B9A98F" stroke-width="1"/>
<circle cx="258" cy="480" r="3" fill="none" stroke="#A2503B" stroke-width="1.2"/>
<text x="196" y="436" font-size="4.5" fill="#A2503B">右梢低了：弦还是斜的</text>
<path d="M244,496 Q262,506 280,496" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<path d="M244,482 Q262,492 280,482" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="262" y1="474" x2="262" y2="462" stroke="#A2503B" stroke-width="1" stroke-dasharray="3 2"/>
<polygon points="262,458 257,468 267,468" fill="#A2503B"/>
<text x="176" y="510" font-size="4.5" fill="#A2503B" text-anchor="middle">举：须两手托</text>
<text x="190" y="530" font-size="4.6" fill="#4A5C55" text-anchor="middle">举者，《说文》曰「对举也」——必须两只手</text>
<text x="24" y="554" font-size="4.8" fill="#2F2A24">故天道之力，大半费于「举」：损有余易，补不足难。</text>
<text x="24" y="570" font-size="4.8" fill="#2F2A24">抑只需一手按住，举则要两只手托起来——这就是「补」的代价。</text>
<text x="24" y="588" font-size="5.0" fill="#4A5C55">不是加总，是配平。</text>
<line x1="24" y1="606" x2="338" y2="606" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="614" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="629" font-size="5.2" fill="#2F2A24" text-anchor="middle">高者抑之，下者举之。</text>
<text x="190" y="642" font-size="4.7" fill="#4A5C55" text-anchor="middle">损有余易，补不足难。</text>
<line x1="20" y1="670" x2="360" y2="670" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="684" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="700" font-size="8.4" fill="#2F2A24">天之道，其犹张弓与？</text>
<text x="20" y="716" font-size="8.4" fill="#2F2A24">张者，《说文》曰「施弓弦也」——非拉弓也，上弦也。</text>
</svg>

<svg viewBox="0 0 380 726" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="补是完衣：缝，不是给" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>

<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 七 章 · 补</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一件破衣</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">有余者损之，不足者补之。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">补，《说文》「完衣也」——缝，不是给。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">给者移之，缝者复之：移者变其多寡，复者使其可衣。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、一布两处：一处有余，一处有阙</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="152" y="214" width="76" height="58" rx="4" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="176" y1="214" x2="190" y2="232" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="204" y1="214" x2="190" y2="232" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="118" y="216" width="34" height="26" rx="3" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<rect x="228" y="216" width="34" height="40" rx="3" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M150,218 l-6,8 l6,6 l-4,8" fill="none" stroke="#A2503B" stroke-width="1.4"/>
<text x="112" y="206" font-size="4.5" fill="#A2503B">阙：破了</text>
<rect x="262" y="218" width="22" height="34" rx="2" fill="#DED2B8" stroke="#A2503B" stroke-width="1" stroke-dasharray="3 2"/>
<text x="292" y="246" font-size="4.2" fill="#A2503B">余：多出一块</text>
<text x="190" y="310" font-size="4.5" fill="#4A5C55" text-anchor="middle">同一块布，两处挂着：不缝，则两处皆废</text>
<text x="190" y="330" font-size="4.6" fill="#4A5C55" text-anchor="middle">此天之算术也：非加总也，配平也</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、剪此补彼：一件衣，两处都好</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="152" y="418" width="76" height="58" rx="4" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="176" y1="418" x2="190" y2="436" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="204" y1="418" x2="190" y2="436" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="118" y="420" width="34" height="26" rx="3" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<rect x="228" y="420" width="34" height="26" rx="3" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="144" y1="420" x2="140" y2="434" stroke="#A2503B" stroke-width="1"/>
<line x1="149" y1="420" x2="145" y2="434" stroke="#A2503B" stroke-width="1"/>
<line x1="154" y1="420" x2="150" y2="434" stroke="#A2503B" stroke-width="1"/>
<line x1="159" y1="420" x2="155" y2="434" stroke="#A2503B" stroke-width="1"/>
<line x1="164" y1="420" x2="160" y2="434" stroke="#A2503B" stroke-width="1"/>
<text x="120" y="410" font-size="4.5" fill="#A2503B">缝上了</text>
<path d="M262,436 Q222,406 176,414" fill="none" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3"/>
<polygon points="176,414 186,410 186,420" fill="#A2503B"/>
<text x="272" y="458" font-size="4.2" fill="#6E6459">袖口不再多出</text>
<text x="190" y="514" font-size="4.5" fill="#4A5C55" text-anchor="middle">一布两处：一处有余，一处有阙；缝之，两处皆可用</text>
<text x="190" y="534" font-size="4.6" fill="#4A5C55" text-anchor="middle">补不是给它添，是让它重新穿得上</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">有余者，同衣之上多出之布也；一布而两处：一处有余，一处有阙。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">给者移之，移完还是两件破的；缝者复之，复完是一件可穿的。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">此天之算术也：非加总也，配平也。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="5.2" fill="#2F2A24" text-anchor="middle">有余者损之，不足者补之。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">补者，完衣也：缝也，非给也。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">有余者损之，不足者补之。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">补者，《说文》曰「完衣也」——缝也，非给也。</text>
</svg>

<text x="20" y="58" font-size="21" fill="#2F2A24">两只捧起的手</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">人之道则不然，损不足以奉有余。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">奉，《说文》「承也」，从手从廾——两手捧而献之。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">其象非被夺也，乃自空碗中刮其余，捧而献于满碗。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、人之道：从空的那只刮</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>

<line x1="54" y1="244" x2="102" y2="244" stroke="#2F2A24" stroke-width="1.2"/>
<text x="78" y="306" font-size="4.5" fill="#6E6459" text-anchor="middle">不足</text>
<path d="M262,226 Q288,278 314,226" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="258" y1="226" x2="318" y2="226" stroke="#2F2A24" stroke-width="1.2"/>

<text x="288" y="306" font-size="4.5" fill="#A2503B" text-anchor="middle">有余</text>
<path d="M98,214 Q118,228 138,214" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>

<text x="190" y="530" font-size="4.6" fill="#4A5C55" text-anchor="middle">孰能有余以奉天下？唯有道者</text>
<text x="24" y="554" font-size="4.8" fill="#2F2A24">人之道非「有人夺我」，乃「令被夺者自捧而献，且以为当然」。</text>
