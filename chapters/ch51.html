<h1>第五十一章｜道生之，德畜之</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>
<div class="meta">正册共 3 幅　·　复核账随章落地　·　版本 2.9.154</div>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="道生、德畜、物形、势成：四层链条，顺序不可颠倒" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="592" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 一 章 · 链</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">四层链条</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">道生之，德畜之，物形之，势成之。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">道不占地方，它「生」的方式是给一个能容的场；德是把这份生机存住。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">物给边界，势给时候——形管你在哪儿，势管你什么时候。</text>
<text x="24" y="146" font-size="5.2" fill="#A2503B">四层链条，从虚到成</text>
<line x1="52" y1="186" x2="52" y2="220" stroke="#E6D8C2" stroke-width="0.6" stroke-dasharray="4 4"/>
<line x1="52" y1="218" x2="52" y2="238" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<text x="86" y="171" font-size="5.2" fill="#2F2A24">道 生 之</text>
<text x="86" y="186" font-size="4.8" fill="#6E6459">虚：不占地方，先有「这回事」</text>
<line x1="52" y1="256" x2="52" y2="290" stroke="#E6D8C2" stroke-width="0.6" stroke-dasharray="4 4"/>
<line x1="52" y1="288" x2="52" y2="308" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<text x="86" y="241" font-size="5.2" fill="#2F2A24">德 畜 之</text>
<text x="86" y="256" font-size="4.8" fill="#6E6459">蓄：像存粮，把生机留住</text>
<line x1="52" y1="326" x2="52" y2="360" stroke="#E6D8C2" stroke-width="0.6" stroke-dasharray="4 4"/>
<text x="86" y="311" font-size="5.2" fill="#2F2A24">物 形 之</text>
<text x="86" y="326" font-size="4.8" fill="#6E6459">形：落到质料上，有了边界</text>
<text x="86" y="381" font-size="5.2" fill="#2F2A24">势 成 之</text>
<text x="86" y="396" font-size="4.8" fill="#6E6459">势：顺着时令风气，才长得成</text>
<circle cx="52" cy="164" r="15" fill="none" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="52" y="167" font-size="5.8" fill="#A2503B" text-anchor="middle">道</text>
<rect x="36" y="222" width="32" height="28" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="36" y1="226" x2="68" y2="226" stroke="#2F2A24" stroke-width="0.5"/>
<text x="52" y="243" font-size="5.8" fill="#2F2A24" text-anchor="middle">德</text>
<rect x="36" y="290" width="32" height="32" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="44" y="298" width="16" height="16" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M32,390 C44,384 60,376 72,364" fill="none" stroke="#4A5C55" stroke-width="0.9"/>
<line x1="66" y1="370" x2="74" y2="362" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<text x="24" y="424" font-size="5.2" fill="#2F2A24">世俗习惯反过来：只看见有形之物，看不见它后面的虚源与生机。</text>
<text x="24" y="440" font-size="5.2" fill="#2F2A24">所以「物形之」不是起点，是第三层；头一层，是一个不占地方的场。</text>
<text x="24" y="456" font-size="5.2" fill="#4A5C55">四层不能颠倒：先有虚，才有存；先有形，才谈得上顺时。</text>
<line x1="24" y1="474" x2="338" y2="474" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="482" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="498" font-size="6.0" fill="#2F2A24" text-anchor="middle">道负责「有」，德负责「留住」；</text>
<text x="190" y="510" font-size="6.0" fill="#4A5C55" text-anchor="middle">一个不占地方，一个专门存。</text>
<line x1="20" y1="536" x2="360" y2="536" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="550" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="566" font-size="8.4" fill="#2F2A24">道负责「有」，德负责「留住」；一个不占地方，一个专门存。</text>
</svg>
<figcaption class="cap"><span class="badge">主图</span><b>四层链条</b><span>ch51a-si-ceng-lian-tiao.svg</span><span class="gold">金句：道负责「有」，德负责「留住」；一个不占地方，一个专门存。</span><a class="zoom" href="../book/义理图/ch51a-si-ceng-lian-tiao.png" target="_blank" rel="noopener">看原图</a></figcaption>
</figure>
<figure>
<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="亭是有顶无壁的屋子，宰是屋下当差的人：一个给顶，一个进屋" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="592" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 一 章 · 屋</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一间屋</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">亭之毒之……长而不宰。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「亭」，《说文》「民所安定也」——有顶，所以能遮；无壁，所以不拦。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">「宰」，屋下执事者——长养你，却不搬进你屋里当那个管事的。</text>
<text x="24" y="146" font-size="5.2" fill="#4A5C55">一、亭之：给一个能停一停的顶</text>
<line x1="24" y1="254" x2="356" y2="254" stroke="#2F2A24" stroke-width="1"/>
<path d="M56,170 L156,142 L256,170" fill="none" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="72" y1="167" x2="240" y2="167" stroke="#2F2A24" stroke-width="0.6"/>
<line x1="76" y1="170" x2="76" y2="254" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="236" y1="170" x2="236" y2="254" stroke="#2F2A24" stroke-width="1.2"/>
<circle cx="156" cy="214" r="4" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<line x1="156" y1="218" x2="156" y2="240" stroke="#4A5C55" stroke-width="0.9"/>
<line x1="156" y1="240" x2="148" y2="254" stroke="#4A5C55" stroke-width="0.8"/>
<line x1="156" y1="240" x2="164" y2="254" stroke="#4A5C55" stroke-width="0.8"/>
<text x="292" y="180" font-size="4.8" fill="#4A5C55">有顶：能遮</text>
<text x="292" y="194" font-size="4.8" fill="#4A5C55">无壁：不拦</text>
<text x="292" y="206" font-size="4.6" fill="#6E6459">谁都能进</text>
<text x="292" y="218" font-size="4.6" fill="#6E6459">谁也不算</text>
<text x="292" y="228" font-size="4.6" fill="#6E6459">被关在里面</text>
<text x="24" y="268" font-size="4.8" fill="#4A5C55">毒之：不是替它长，是给它长厚的条件</text>
<text x="24" y="290" font-size="5.2" fill="#A2503B">二、宰：加了四壁，又搬进一个当差的</text>
<line x1="24" y1="394" x2="356" y2="394" stroke="#2F2A24" stroke-width="1"/>
<path d="M56,310 L156,282 L256,310" fill="none" stroke="#2F2A24" stroke-width="1.4"/>
<rect x="76" y="310" width="160" height="84" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="140" y1="310" x2="140" y2="370" stroke="#2F2A24" stroke-width="0.6"/>
<line x1="140" y1="370" x2="176" y2="370" stroke="#2F2A24" stroke-width="0.6"/>
<circle cx="196" cy="348" r="3.4" fill="none" stroke="#A2503B" stroke-width="0.8"/>
<line x1="196" y1="352" x2="196" y2="372" stroke="#A2503B" stroke-width="0.9"/>
<text x="196" y="386" font-size="5.0" fill="#A2503B" text-anchor="middle">宰</text>
<text x="292" y="334" font-size="4.6" fill="#A2503B">墙一立，里面就</text>
<text x="292" y="344" font-size="4.6" fill="#A2503B">有了「谁说了算」</text>
<text x="24" y="408" font-size="4.8" fill="#A2503B">「长养」最自然的下一步，就是搬进去管——这一步要按住的正是它</text>
<text x="24" y="434" font-size="5.2" fill="#2F2A24">「养大」和「让它长」的差别，不在动作，在手里有没有那一把。</text>
<text x="24" y="450" font-size="5.2" fill="#2F2A24">三个字，一个「不进屋」：亭给顶，毒给厚，宰不给位。</text>
<text x="24" y="466" font-size="5.2" fill="#4A5C55">这一章不教人怎么施恩，教人怎么施恩之后，不进那间屋。</text>
<line x1="24" y1="484" x2="338" y2="484" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="492" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="508" font-size="6.0" fill="#2F2A24" text-anchor="middle">亭是有顶无壁的屋子，宰是屋下当差的人；</text>
<text x="190" y="520" font-size="6.0" fill="#4A5C55" text-anchor="middle">一个给顶，一个进屋。</text>
<line x1="20" y1="546" x2="360" y2="546" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="560" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="576" font-size="8.4" fill="#2F2A24">亭是有顶无壁的屋子，宰是屋下当差的人；一个给顶，一个进屋。</text>
</svg>
<figcaption class="cap"><span class="badge">主图</span><b>一间屋</b><span>ch51b-yi-jian-wu.svg</span><span class="gold">金句：亭是有顶无壁的屋子，宰是屋下当差的人；一个给顶，一个进屋。</span><a class="zoom" href="../book/义理图/ch51b-yi-jian-wu.png" target="_blank" rel="noopener">看原图</a></figcaption>
</figure>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="「不有」是总开关：一划「这是我的」，恃与宰就自己跟上来" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="552" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 一 章 · 账</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一本账</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">生而不有，为而不恃，长而不宰。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「有」就是划一道界：这一块是我的。而这道界最常划在「我养的」这三个字上。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">恃与宰，是「我养了它」的利息；本金不借，利息不来。</text>
<text x="24" y="146" font-size="5.2" fill="#4A5C55">一、生而不有：账上不记这一笔</text>
<rect x="48" y="168" width="92" height="64" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="48" y1="186" x2="140" y2="186" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="48" y1="204" x2="140" y2="204" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="64" y1="168" x2="64" y2="232" stroke="#E6D8C2" stroke-width="0.4"/>
<text x="168" y="194" font-size="4.8" fill="#6E6459">没有这一笔，就没有利息</text>
<text x="168" y="210" font-size="4.6" fill="#4A5C55">为而不恃：做了，不靠着它站直</text>
<text x="168" y="222" font-size="4.6" fill="#4A5C55">长而不宰：养大了，不进去当管事</text>
<text x="24" y="258" font-size="5.2" fill="#A2503B">二、一划界：记上「我养的」，两笔利息自己来</text>
<rect x="48" y="288" width="92" height="64" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="48" y1="306" x2="140" y2="306" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="48" y1="324" x2="140" y2="324" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="64" y1="288" x2="64" y2="352" stroke="#E6D8C2" stroke-width="0.4"/>
<text x="70" y="302" font-size="4.6" fill="#A2503B">我养的</text>
<line x1="142" y1="312" x2="208" y2="294" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<line x1="142" y1="328" x2="208" y2="346" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="214" y="288" font-size="4.8" fill="#A2503B">恃：靠着它站直</text>
<text x="214" y="300" font-size="4.5" fill="#6E6459">说话硬一点，眼神定一点</text>
<text x="214" y="340" font-size="4.8" fill="#A2503B">宰：搬进它屋里</text>
<text x="214" y="352" font-size="4.5" fill="#6E6459">养了，就顺手管起来</text>
<text x="30" y="364" font-size="4.6" fill="#6E6459">这是「好人」的病：坏事的人不恃，好事的人才恃</text>
<text x="24" y="390" font-size="5.0" fill="#2F2A24">三个「不」是一条递进的线：不有不划界，不恃不靠它站直，不宰不搬进它屋里。</text>
<text x="24" y="406" font-size="5.0" fill="#2F2A24">玄德不是深：玄是两股丝绞在一起——一根看不出怎么绞的绳，才承得住重。</text>
<text x="24" y="422" font-size="5.2" fill="#4A5C55">开关一合，后面两样就关不上；这个开关，就在「这是我的」四个字上。</text>
<line x1="24" y1="440" x2="338" y2="440" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="448" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="464" font-size="6.0" fill="#2F2A24" text-anchor="middle">「不有」是总开关：一划「这是我的」，</text>
<text x="190" y="476" font-size="6.0" fill="#4A5C55" text-anchor="middle">恃与宰就自己跟上来了。</text>
<line x1="20" y1="502" x2="360" y2="502" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="516" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="532" font-size="8.4" fill="#2F2A24">「不有」是总开关：一划「这是我的」，恃与宰就自己跟上来了。</text>
