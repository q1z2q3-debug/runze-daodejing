<h1>第七十一章｜病病</h1>
<p class="sub">一章三图为本；本章另有补图，补图不占主图位次，只为另开一境。</p>

<rect x="0" y="0" width="380" height="708" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 一 章 · 知</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一支箭</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">知不知，尚矣；不知知，病也。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「知」从矢从口：矢是箭，口是报靶的那个口——射中了，喊一声，才叫知。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">所以知是「命中」这件事，不是一个揣在胸里的「有」。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、未出弦：箭在手，靶还没验</text>
<rect x="26" y="162" width="328" height="164" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M78,190 Q110,228 78,266" fill="none" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="78" y1="190" x2="78" y2="266" stroke="#2F2A24" stroke-width="0.9" opacity="0.85"/>
<line x1="60" y1="228" x2="158" y2="228" stroke="#2F2A24" stroke-width="1.2"/>
<polygon points="158,228 148,224 148,232" fill="#2F2A24"/>
<line x1="64" y1="222" x2="70" y2="228" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="64" y1="234" x2="70" y2="228" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="70" y1="222" x2="76" y2="228" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="70" y1="234" x2="76" y2="228" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="290" cy="228" r="16" fill="none" stroke="#B9A98F" stroke-width="0.9" stroke-dasharray="3 3"/>
<circle cx="290" cy="228" r="7" fill="none" stroke="#B9A98F" stroke-width="0.7" stroke-dasharray="3 3"/>
<text x="290" y="258" font-size="4.2" fill="#6E6459" text-anchor="middle">靶还在远处</text>
<text x="118" y="214" font-size="4.5" fill="#A2503B">箭搭在弦上</text>
<text x="190" y="318" font-size="4.6" fill="#4A5C55" text-anchor="middle">没射出去的，是打算，不是知：靶还没说话</text>
<text x="24" y="340" font-size="4.8" fill="#A2503B">二、已出弦：箭在靶上，这一下才叫知</text>
<rect x="26" y="352" width="328" height="146" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M72,386 Q104,420 72,454" fill="none" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="72" y1="386" x2="72" y2="454" stroke="#2F2A24" stroke-width="0.9" opacity="0.85"/>
<text x="84" y="454" font-size="4.2" fill="#6E6459">弦松了</text>
<circle cx="264" cy="420" r="26" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="264" cy="420" r="17" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="264" cy="420" r="7" fill="#A2503B" fill-opacity="0.35" stroke="#A2503B" stroke-width="0.8"/>
<line x1="196" y1="414" x2="260" y2="421" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="202" y1="408" x2="208" y2="414" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="202" y1="420" x2="208" y2="414" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="208" y1="408" x2="214" y2="414" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="208" y1="420" x2="214" y2="414" stroke="#2F2A24" stroke-width="0.8"/>
<text x="264" y="460" font-size="4.5" fill="#2F2A24" text-anchor="middle">靶</text>
<text x="150" y="398" font-size="4.5" fill="#A2503B">箭出而中</text>
<text x="190" y="516" font-size="4.6" fill="#4A5C55" text-anchor="middle">射中了才知道中没中：知是箭与靶碰上的那一下，不是想出来的</text>
<text x="24" y="532" font-size="4.8" fill="#2F2A24">所以「知不知」不是谦虚话：他知道自己这一箭偏了——偏在哪儿，也说得出来。</text>
<text x="24" y="548" font-size="4.8" fill="#2F2A24">而「不知知」是另一回事：箭在靶外，他嘴上说中。</text>
<text x="24" y="566" font-size="5.0" fill="#4A5C55">《说文》「病，疾加也」：疾是小病，病是加重了的——报错靶，是会加重的。</text>
<line x1="24" y1="582" x2="338" y2="582" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="590" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="605" font-size="5.2" fill="#2F2A24" text-anchor="middle">知从矢从口：箭出去，中了，才报得出口。</text>
<text x="190" y="618" font-size="4.7" fill="#4A5C55" text-anchor="middle">胸中之知不必有靶；矢口之知，先得有一张靶。</text>
<line x1="20" y1="644" x2="360" y2="644" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="658" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="674" font-size="8.4" fill="#2F2A24">知不知，尚矣；不知知，病也。</text>
<text x="20" y="690" font-size="8.4" fill="#2F2A24">知从矢从口：箭出而中，报之于口。</text>
</svg>

<rect x="0" y="0" width="380" height="714" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 一 章 · 靶</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一张靶</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">知不知，尚矣；不知知，病也。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">靶不在你手里：它立在那儿，环纹是它自己带的，箭落在几环由它说。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">这是「知」可验的全部理由——靶一挪，就没有靶了。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、有环：落点由靶说</text>
<rect x="26" y="162" width="328" height="142" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="176" cy="224" r="40" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="176" cy="224" r="27" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="176" cy="224" r="14" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="176" cy="224" r="4.4" fill="#A2503B" stroke="none"/>
<text x="230" y="218" font-size="4.2" fill="#6E6459">环是靶自带的</text>
<line x1="90" y1="258" x2="150" y2="252" stroke="#2F2A24" stroke-width="1.3"/>
<polygon points="150,252 140,246 144,255" fill="#2F2A24"/>
<line x1="98" y1="252" x2="104" y2="258" stroke="#2F2A24" stroke-width="0.8"/>

<line x1="104" y1="252" x2="110" y2="258" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="104" y1="264" x2="110" y2="258" stroke="#2F2A24" stroke-width="0.8"/>
<text x="116" y="274" font-size="4.5" fill="#A2503B">箭在二环外</text>
<line x1="220" y1="224" x2="216" y2="224" stroke="#4A5C55" stroke-width="0.1"/>
<text x="190" y="320" font-size="4.6" fill="#4A5C55" text-anchor="middle">靶不动，箭动：中不中，是靶说的，不是射的人说的</text>
<text x="24" y="342" font-size="4.8" fill="#A2503B">二、无环：说什么都不算数</text>
<rect x="26" y="354" width="328" height="146" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="176" cy="418" r="40" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="148" y1="390" x2="204" y2="446" stroke="#DCCBB0" stroke-width="0.9" stroke-dasharray="4 4"/>
<line x1="204" y1="390" x2="148" y2="446" stroke="#DCCBB0" stroke-width="0.9" stroke-dasharray="4 4"/>
<circle cx="176" cy="418" r="41" fill="none" stroke="#B9A98F" stroke-width="0.8"/>
<line x1="122" y1="396" x2="156" y2="406" stroke="#2F2A24" stroke-width="1"/>
<polygon points="156,406 148,401 149,409" fill="#2F2A24"/>
<line x1="160" y1="414" x2="194" y2="424" stroke="#2F2A24" stroke-width="1"/>
<polygon points="194,424 186,419 187,427" fill="#2F2A24"/>
<line x1="138" y1="432" x2="172" y2="442" stroke="#2F2A24" stroke-width="1"/>
<polygon points="172,442 164,437 165,445" fill="#2F2A24"/>
<text x="230" y="408" font-size="4.5" fill="#A2503B">没有环</text>
<text x="230" y="422" font-size="4.2" fill="#6E6459">落在哪儿都</text>
<text x="230" y="434" font-size="4.2" fill="#6E6459">可以叫「中」</text>
<text x="190" y="518" font-size="4.6" fill="#4A5C55" text-anchor="middle">环是靶的，不是你画的：环一擦掉，箭就成了自己给自己判的</text>
<text x="24" y="534" font-size="4.8" fill="#2F2A24">所以「知不知」的「不知」，是有靶可对的不知：他知道自己偏了，靶还在。</text>
<text x="24" y="550" font-size="4.8" fill="#2F2A24">而「不知知」先把环擦掉，再说「都在里圈」。</text>
<text x="24" y="568" font-size="5.0" fill="#4A5C55">靶一旦成了随身之物，箭就再也没有偏过——这不是本事，是病。</text>
<line x1="24" y1="584" x2="338" y2="584" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="592" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="607" font-size="5.2" fill="#2F2A24" text-anchor="middle">靶在彼，不由我说。</text>
<text x="190" y="620" font-size="4.7" fill="#4A5C55" text-anchor="middle">验证的意思是：有一件东西，你说不动它。</text>
<line x1="20" y1="646" x2="360" y2="646" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="660" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="676" font-size="8.4" fill="#2F2A24">知不知，尚矣；不知知，病也。</text>
<text x="20" y="692" font-size="8.4" fill="#2F2A24">知者，命中之事，非胸中之有。</text>
</svg>

<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">不报的还没射；照实报的说偏了；报错的，把靶画在箭落的地方。</text>
<text x="24" y="150" font-size="4.8" fill="#4A5C55">一、照实报：箭在靶外，曰「偏矣」——此为上等</text>

<text x="214" y="268" font-size="4.2" fill="#4A5C55">箭落在靶外</text>
<circle cx="84" cy="224" r="7" fill="none" stroke="#2F2A24" stroke-width="1"/>

<text x="128" y="218" font-size="5.0" fill="#4A5C55">「偏矣」</text>
<text x="190" y="320" font-size="4.6" fill="#4A5C55" text-anchor="middle">他不改靶，只改口：说偏，就是把自己的箭让给靶去判</text>
<text x="24" y="342" font-size="4.8" fill="#A2503B">二、报错：把靶套在箭落处，曰「中矣」——此为病</text>

<text x="292" y="430" font-size="4.0" fill="#6E6459" text-anchor="middle">原位空了</text>

<text x="126" y="398" font-size="5.0" fill="#A2503B">「中矣」</text>
<text x="190" y="522" font-size="4.6" fill="#4A5C55" text-anchor="middle">靶一挪，箭就永远中：此后每一箭都由他这双手判</text>
<text x="24" y="538" font-size="4.8" fill="#2F2A24">第三种最危险，不是因为他撒谎。撒谎的人知道自己撒。</text>
<text x="24" y="554" font-size="4.8" fill="#2F2A24">病是另一种：眼里看见靶外的箭，胸里那支还在靶心——两样都在，他信后者。</text>
<text x="24" y="572" font-size="5.0" fill="#4A5C55">「病病」不是治病，是认病：把「自以为知」当成病来盯，才不染这个病。</text>
<line x1="24" y1="588" x2="338" y2="588" stroke="#DCCBB0" stroke-width="0.6"/>

<text x="190" y="611" font-size="5.2" fill="#2F2A24" text-anchor="middle">病病者，以之为病也，非治之也，乃认之也。</text>
<text x="190" y="624" font-size="4.7" fill="#4A5C55" text-anchor="middle">先认这一句「我可能报错了」，靶才回得来。</text>

<text x="20" y="680" font-size="8.4" fill="#2F2A24">《说文》曰：病，疾加也。</text>
<text x="20" y="696" font-size="8.4" fill="#2F2A24">病者，目中见靶外之箭，胸中箭犹在靶。</text>
