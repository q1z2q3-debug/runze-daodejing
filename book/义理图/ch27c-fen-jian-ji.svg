<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="不是他心肠软，是他看见的分类不成立" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="690" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 七 章 · 一 架 分 拣 机</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一架分拣机</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">常善救人，故无弃人；常善救物，故无弃物。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「救」不是施恩，是成全：把它本来该有的样子还给它。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">而「无弃」是说：没有一个人被判为无用，没有一件物被判为多余。</text>
<text x="24" y="152" font-size="5.1" fill="#A2503B">一、机器开着：一直分，一直筛，一直淘汰</text>
<rect x="26" y="164" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M148,186 L232,186 L214,208 L166,208 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="140" y="208" width="100" height="30" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<text x="190" y="226" font-size="4.6" fill="#A2503B" text-anchor="middle">分</text>
<line x1="146" y1="238" x2="98" y2="268" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="234" y1="238" x2="282" y2="268" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M50,268 L128,268 L122,302 L56,302 Z" fill="#E9F0E6" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M252,268 L330,268 L324,302 L258,302 Z" fill="#F1EADA" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="70" cy="278" r="2.4" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="86" cy="278" r="2.4" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="102" cy="278" r="2.4" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<rect x="268" y="275" width="6" height="6" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<rect x="286" y="275" width="6" height="6" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<rect x="304" y="275" width="6" height="6" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<text x="89" y="296" font-size="4.5" fill="#4A5C55" text-anchor="middle">善</text>
<text x="291" y="296" font-size="4.2" fill="#8A7C69" text-anchor="middle">不善</text>
<circle cx="126" cy="254" r="2.8" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="112" cy="262" r="2.8" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<rect x="258" y="258" width="6" height="6" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<rect x="246" y="264" width="6" height="6" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<text x="190" y="308" font-size="4.1" fill="#8A7C69" text-anchor="middle">人被分成君子小人，物被分成贵贱有用无用</text>
<text x="24" y="338" font-size="5.1" fill="#4A5C55">二、关了机器：人还在，物还在，一只也没被推出去</text>
<rect x="26" y="350" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="140" y="380" width="100" height="44" fill="#EDE7DB" stroke="#9C9182" stroke-width="1.0"/>
<line x1="136" y1="376" x2="244" y2="376" stroke="#9C9182" stroke-width="1.0"/>
<line x1="140" y1="380" x2="136" y2="376" stroke="#9C9182" stroke-width="0.8"/>
<line x1="240" y1="380" x2="244" y2="376" stroke="#9C9182" stroke-width="0.8"/>
<text x="190" y="408" font-size="4.6" fill="#9C9182" text-anchor="middle">关</text>
<text x="190" y="442" font-size="4.1" fill="#8A7C69" text-anchor="middle">滑道撤了，筐也不分了</text>
<line x1="52" y1="480" x2="328" y2="480" stroke="#DCCBB0" stroke-width="0.9"/>
<circle cx="78" cy="462" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="78" y1="466" x2="78" y2="480" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="105.5" y="471" width="9" height="9" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="142" cy="462" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="142" y1="466" x2="142" y2="480" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="169.5" y="471" width="9" height="9" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="206" cy="462" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="206" y1="466" x2="206" y2="480" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="233.5" y="471" width="9" height="9" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="270" cy="462" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="270" y1="466" x2="270" y2="480" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="297.5" y="471" width="9" height="9" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<text x="190" y="494" font-size="4.1" fill="#4A5C55" text-anchor="middle">都在一处：无一弃人，无一弃物</text>
<text x="24" y="520" font-size="4.8" fill="#2F2A24">「常善救人」救的不是「好人」：只救值得救的，那还是在分类。</text>
<text x="24" y="536" font-size="4.8" fill="#2F2A24">能救不值得救的，才叫无弃；不是心肠软，是分类本身不成立。</text>
<text x="24" y="554" font-size="4.8" fill="#4A5C55">圣人不在这台机器前排队，也不去操作它——他把机器关了。</text>
<line x1="24" y1="572" x2="338" y2="572" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="580" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="596" font-size="6.0" fill="#2F2A24" text-anchor="middle">不是他心肠软，是他看见的分类不成立。</text>
<text x="190" y="608" font-size="5.0" fill="#4A5C55" text-anchor="middle">关掉的是一台机器，不是判断力。</text>
<line x1="20" y1="634" x2="360" y2="634" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="648" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="664" font-size="8.4" fill="#2F2A24">迷不在无知，在太会分。</text>
</svg>