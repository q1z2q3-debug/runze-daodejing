<line x1="232" y1="462" x2="216" y2="472" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="220" y="464" width="24" height="12" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<text x="232" y="472.5" font-size="3.5" fill="#2F2A24" text-anchor="middle">上将军</text>
<line x1="44" y1="404" x2="44" y2="510" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M44,404 l0,40 l14,-5 l0,-35 Z" fill="#F4F1E8" stroke="#DCCBB0" stroke-width="0.7"/>
<line x1="330" y1="404" x2="330" y2="510" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M330,404 l0,40 l14,-5 l0,-35 Z" fill="#F4F1E8" stroke="#DCCBB0" stroke-width="0.7"/>
<text x="51" y="524" font-size="3.7" fill="#8A7C69" text-anchor="middle">素幡</text>
<ellipse cx="190" cy="474" rx="20" ry="7" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="176" y1="480" x2="173" y2="508" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="204" y1="480" x2="207" y2="508" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M172,462 L208,462 L212,482 L168,482 Z" fill="#F4F1E8" stroke="#DCCBB0" stroke-width="0.7"/>
<text x="190" y="498" font-size="3.5" fill="#8A7C69" text-anchor="middle">鼓上盖布：撤乐</text>
<rect x="112" y="506" width="150" height="5" fill="#F4F1E8" stroke="#DCCBB0" stroke-width="0.5"/>
<text x="302" y="414" font-size="4.6" fill="#A2503B" text-anchor="middle">以丧礼处之</text>
<text x="302" y="428" font-size="3.8" fill="#2F2A24" text-anchor="middle">不许笑的仪式</text>
<text x="302" y="440" font-size="3.7" fill="#8A7C69" text-anchor="middle">位次不变</text>
<text x="302" y="450" font-size="3.7" fill="#8A7C69" text-anchor="middle">场面换成丧礼</text>
<text x="24" y="566" font-size="4.8" fill="#2F2A24">尚左尚右是当时活着的礼，人人会站；你站在哪一边，旁边的人就跟着站到哪一边。</text>
<text x="24" y="582" font-size="4.8" fill="#2F2A24">同一件事换一边站，就是给自己一个身体上的提醒：我现在做的，不是吉事。</text>
<text x="24" y="600" font-size="4.8" fill="#4A5C55">偏将军主辅助、节制，居左；上将军掌杀伐决断，居右——让权力站到它本来该站的那一边。</text>
<line x1="24" y1="618" x2="338" y2="618" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="626" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="642" font-size="5.6" fill="#2F2A24" text-anchor="middle">礼不是装饰，是把这件事的性质写在人身上。</text>
<text x="190" y="654" font-size="5.0" fill="#4A5C55" text-anchor="middle">心会忘，礼每天提醒你一次。</text>
<line x1="20" y1="680" x2="360" y2="680" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="694" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="710" font-size="8.4" fill="#2F2A24">不是天在罚你，是你的志与这个场不相容。</text>
<text x="20" y="726" font-size="8.4" fill="#2F2A24">丧礼是五礼里唯一不许笑的一种；用丧礼办胜仗，就是把它放进那个不许笑的地方。</text>
</svg>