<line x1="132" y1="462" x2="148" y2="472" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="132" y1="462" x2="116" y2="472" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="120" y="464" width="24" height="12" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<text x="132" y="472.5" font-size="3.5" fill="#2F2A24" text-anchor="middle">偏将军</text>
<circle cx="232" cy="448" r="6.4" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="232" y1="455" x2="232" y2="482" stroke="#2F2A24" stroke-width="1.2"/>
