<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="礼不是装饰，是把这件事的性质写在人身上" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="752" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 一 章 · 位 次（补图）</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">左吉右凶</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">吉事尚左，凶事尚右。偏将军居左，上将军居右。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「偏将军」「上将军」为战国以后官称，帛书甲、乙本已见；本书不据此疑经，只记一层文本痕迹。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">「言以丧礼处之」：这一整套排位，是在说「这件事按丧礼办」。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、位次：吉事尚左，凶事尚右</text>
<rect x="26" y="164" width="328" height="170" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="304" x2="336" y2="304" stroke="#2F2A24" stroke-width="1.1"/>
<rect x="34" y="188" width="66" height="20" fill="#EAF0E6" stroke="#4A5C55" stroke-width="1.0"/>
<text x="67" y="201" font-size="4.5" fill="#4A5C55" text-anchor="middle">吉 · 左</text>
<text x="67" y="216" font-size="3.7" fill="#8A7C69" text-anchor="middle">冠、婚、聘</text>
<circle cx="110" cy="242" r="6.4" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="110" y1="249" x2="110" y2="276" stroke="#2F2A24" stroke-width="1.2"/>
