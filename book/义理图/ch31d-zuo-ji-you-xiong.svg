<line x1="110" y1="276" x2="119" y2="304" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="110" y1="256" x2="126" y2="266" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="110" y1="256" x2="94" y2="266" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="98" y="258" width="24" height="12" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<text x="110" y="266.5" font-size="3.5" fill="#2F2A24" text-anchor="middle">偏将军</text>
<rect x="280" y="188" width="66" height="20" fill="#F3DCD4" stroke="#A2503B" stroke-width="1.0"/>
<text x="313" y="201" font-size="4.5" fill="#A2503B" text-anchor="middle">凶 · 右</text>
<text x="313" y="216" font-size="3.7" fill="#8A7C69" text-anchor="middle">丧、兵</text>
<circle cx="240" cy="242" r="6.4" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="240" y1="249" x2="240" y2="276" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="240" y1="276" x2="231" y2="304" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="240" y1="276" x2="249" y2="304" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="240" y1="256" x2="256" y2="266" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="240" y1="256" x2="224" y2="266" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="228" y="258" width="24" height="12" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<text x="240" y="266.5" font-size="3.5" fill="#2F2A24" text-anchor="middle">上将军</text>
<line x1="266" y1="234" x2="266" y2="288" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="266" y1="242" x2="286" y2="244" stroke="#A2503B" stroke-width="1.5"/>
<polygon points="286,244 279,240 279,248" fill="#A2503B"/>
<text x="190" y="276" font-size="4.5" fill="#A2503B" text-anchor="middle">把掌杀权的人，</text>
<text x="190" y="288" font-size="4.5" fill="#A2503B" text-anchor="middle">放在凶位上</text>
<text x="24" y="358" font-size="5.1" fill="#A2503B">二、以丧礼处之：五礼里唯一不许笑的仪式</text>
<rect x="26" y="370" width="328" height="170" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="510" x2="336" y2="510" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="132" cy="448" r="6.4" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="132" y1="455" x2="132" y2="482" stroke="#2F2A24" stroke-width="1.2"/>
