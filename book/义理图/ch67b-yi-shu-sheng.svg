<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 684" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="俭是约，约是绳缠束：收十处为一束，一束可推千里" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="684" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 七 章 · 俭</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一束绳</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">俭，故能广。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「俭」，《说文》「约也」——约是绳缠束：把散着的收拢成一束。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">俭的反面不是奢侈，是散：语言散出去收不回，心神散出去聚不拢。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、散在十处：十处都不深</text>
<rect x="26" y="160" width="328" height="132" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M68,252 L150,194" fill="none" stroke="#B9A98F" stroke-width="0.9" stroke-dasharray="3 3"/>
<circle cx="150" cy="194" r="2" fill="#B9A98F" stroke="none"/>
<path d="M68,252 L171,208" fill="none" stroke="#B9A98F" stroke-width="0.9" stroke-dasharray="3 3"/>
<circle cx="171" cy="208" r="2" fill="#B9A98F" stroke="none"/>
<path d="M68,252 L192,194" fill="none" stroke="#B9A98F" stroke-width="0.9" stroke-dasharray="3 3"/>
<circle cx="192" cy="194" r="2" fill="#B9A98F" stroke="none"/>
<path d="M68,252 L213,208" fill="none" stroke="#B9A98F" stroke-width="0.9" stroke-dasharray="3 3"/>
<circle cx="213" cy="208" r="2" fill="#B9A98F" stroke="none"/>
