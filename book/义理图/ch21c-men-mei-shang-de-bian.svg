<rect x="0" y="0" width="380" height="770" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 一 章 · 名 与 众 甫</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">门楣上的匾</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">自今及古，其名不去，以阅众甫。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">「道」这个名字，只是挂在门楣上的一块匾。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">匾一直在，指着这道门；匾不是门里的地方。</text>
<rect x="26" y="150" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
