<line x1="128" y1="276" x2="154" y2="262" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="154" y1="262" x2="159" y2="260" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="161" y1="260" x2="220" y2="234" stroke="#A2503B" stroke-width="0.6" stroke-dasharray="4 3"/>
<line x1="128" y1="276" x2="119" y2="286" stroke="#2F2A24" stroke-width="0.8"/>
<text x="190" y="318" font-size="3.9" fill="#8A7C69" text-anchor="middle">匾指着门；门里才是那地方——匾在门外，人还站在门外。</text>
<text x="24" y="339" font-size="5.0" fill="#A2503B">一、门外：匾一直在，路标不是那地方</text>
