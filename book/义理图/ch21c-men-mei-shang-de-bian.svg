<line x1="296" y1="484" x2="304" y2="498" stroke="#2F2A24" stroke-width="0.8"/>
<text x="96" y="517" font-size="3.7" fill="#8A7C69">众甫：物之始</text>
<text x="190" y="528" font-size="3.9" fill="#6E6459" text-anchor="middle">阅：门内逐一点数——点的是开端，不是器物。</text>
<text x="190" y="541" font-size="4.3" fill="#4A5C55" text-anchor="middle">以此：不是知道得多，是站对了地方。</text>
<text x="24" y="565" font-size="5.0" fill="#4A5C55">二、门内：一道一道点过去</text>
<text x="24" y="584" font-size="4.9" fill="#2F2A24">「阅」，《说文》「具数于门中也」：不是抽象地观照万物的开端，是把开端一一点过。</text>
<text x="24" y="600" font-size="4.9" fill="#2F2A24">自今及古：这个可以被名为「道」的存在，从来不曾消失。</text>
<text x="24" y="618" font-size="4.9" fill="#4A5C55">「以此」二字把「知」的来源说尽了：不向外求标准，向内体证。</text>
<line x1="24" y1="636" x2="338" y2="636" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="644" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="660" font-size="5.2" fill="#2F2A24" text-anchor="middle">名不去，是路标一直在；</text>
<text x="190" y="672" font-size="5.2" fill="#4A5C55" text-anchor="middle">路标在，不等于路标就是那个地方。</text>
<line x1="20" y1="698" x2="360" y2="698" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="712" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="728" font-size="8.4" fill="#2F2A24">名不去，是路标一直在；路标在，不等于路标就是那个地方。</text>
<text x="20" y="744" font-size="8.4" fill="#2F2A24">不是知道得多，是站对了地方。</text>
</svg>