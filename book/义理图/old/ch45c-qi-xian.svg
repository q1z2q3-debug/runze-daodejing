<rect x="0" y="0" width="380" height="578" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 五 章 · 琴</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">七弦里，留一根不弹</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">大直若屈，大巧若拙，大辩若讷。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="6.0" fill="#2F2A24" text-anchor="middle">「大音希声」：最响的，往往不是拨得最重的那一根。</text>
<text x="190" y="126" font-size="5.6" fill="#6E6459" text-anchor="middle">弦、指、弦外、停手——四处各留一分，声音才走得远。</text>
