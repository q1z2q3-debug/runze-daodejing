<path d="M336,206 q8,-4 16,0 q8,4 16,0" fill="none" stroke="#4A5C55" stroke-width="0.5" opacity="0.8"/>
<text x="352" y="196" font-size="4.4" fill="#4A5C55" text-anchor="middle">余音</text>
<circle cx="32" cy="252" r="6.2" fill="none" stroke="#E6D8C2" stroke-width="0.5"/>
<text x="32" y="255" font-size="4.6" fill="#A2503B" text-anchor="middle">1</text>
<text x="50" y="255" font-size="5.9" fill="#A2503B">弦 · 大直若屈</text>
<text x="50" y="272" font-size="5.6" fill="#2F2A24">弦看着是直的，其实一直有松；上到尽头，一拨就断。</text>
<circle cx="32" cy="298" r="6.2" fill="none" stroke="#E6D8C2" stroke-width="0.5"/>
<text x="32" y="301" font-size="4.6" fill="#A2503B" text-anchor="middle">2</text>
<text x="50" y="301" font-size="5.9" fill="#A2503B">指 · 大巧若拙</text>
<text x="50" y="318" font-size="5.6" fill="#2F2A24">好琴人指下看不出使劲，声音却到位。</text>
<circle cx="32" cy="344" r="6.2" fill="none" stroke="#E6D8C2" stroke-width="0.5"/>
<text x="32" y="347" font-size="4.6" fill="#A2503B" text-anchor="middle">3</text>
<text x="50" y="347" font-size="5.9" fill="#A2503B">不弹 · 大辩若讷</text>
<text x="50" y="364" font-size="5.6" fill="#2F2A24">七弦里留一根不弹：不是没有这根弦，是不拨它。</text>
<circle cx="32" cy="390" r="6.2" fill="none" stroke="#E6D8C2" stroke-width="0.5"/>
<text x="32" y="393" font-size="4.6" fill="#A2503B" text-anchor="middle">4</text>
<text x="50" y="393" font-size="5.9" fill="#A2503B">停手 · 清静为正</text>
<text x="50" y="410" font-size="5.6" fill="#2F2A24">曲子停在该停处，剩下的让余音自己走完。</text>
<line x1="24" y1="432" x2="338" y2="432" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="442" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="458" font-size="6.2" fill="#2F2A24" text-anchor="middle">弦留一分松，指留一分拙，话留一分默。</text>
<text x="190" y="472" font-size="6.2" fill="#4A5C55" text-anchor="middle">最响的一声，常常是没弹出来的那一下。</text>
<line x1="20" y1="500" x2="360" y2="500" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="514" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="530" font-size="8.4" fill="#2F2A24">最响的一声，常常是没弹出来的那一下。</text>
