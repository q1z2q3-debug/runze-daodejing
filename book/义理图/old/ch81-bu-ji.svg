<text x="70" y="206" font-size="11.5" fill="#2F2A24" text-anchor="middle">不积</text>
<line x1="38" y1="192" x2="102" y2="208" stroke="#A2503B" stroke-width="0.8" opacity="0.6"/>
<rect x="136" y="184" width="100" height="32" fill="#FBF6EC" stroke="{LINE2}" stroke-width="1.0"/>
<text x="186" y="206" font-size="11.5" fill="#2F2A24" text-anchor="middle">不害</text>
<line x1="154" y1="192" x2="218" y2="208" stroke="#A2503B" stroke-width="0.8" opacity="0.6"/>
<rect x="252" y="184" width="100" height="32" fill="#FBF6EC" stroke="{LINE2}" stroke-width="1.0"/>
<text x="302" y="206" font-size="11.5" fill="#2F2A24" text-anchor="middle">不争</text>
<line x1="270" y1="192" x2="334" y2="208" stroke="#A2503B" stroke-width="0.8" opacity="0.6"/>
<rect x="20" y="238" width="160" height="92" fill="#F6EFE0" stroke="{LINE2}" stroke-width="1.0"/>
<rect x="200" y="238" width="160" height="92" fill="#FBF6EC" stroke="{LINE2}" stroke-width="1.0"/>
<text x="32" y="260" font-size="12" fill="#8A7C69">仓</text>
<text x="32" y="282" font-size="9.5" fill="#6E6459">积则满，满则溢，溢则空</text>
<text x="32" y="300" font-size="9.5" fill="#A2503B">守住会空</text>
<text x="212" y="260" font-size="12" fill="#4A5C55">泉</text>
<text x="212" y="282" font-size="9.5" fill="#6E6459">既以为人，己愈有</text>
<text x="212" y="300" font-size="9.5" fill="#4A5C55">给出不会少</text>
<rect x="20" y="346" width="340" height="50" fill="#E9DFCC" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="368" font-size="10.5" fill="#2F2A24" text-anchor="middle">天之道，利而不害；圣人之道，为而不争。</text>
<text x="190" y="386" font-size="9.5" fill="#6E6459" text-anchor="middle">全书第一句划掉一个，最后一句划掉九个。</text>
