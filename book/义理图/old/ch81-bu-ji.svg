<text x="186" y="166" font-size="11.5" fill="#2F2A24" text-anchor="middle">不博</text>
<line x1="154" y1="152" x2="218" y2="168" stroke="#A2503B" stroke-width="0.8" opacity="0.6"/>
<rect x="252" y="144" width="100" height="32" fill="#FBF6EC" stroke="{LINE2}" stroke-width="1.0"/>
<text x="302" y="166" font-size="11.5" fill="#2F2A24" text-anchor="middle">不知</text>
