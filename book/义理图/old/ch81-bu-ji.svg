<rect x="0" y="0" width="380" height="690" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 八 十 一 章 · 收 口</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">九个不</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">他不肯说「这就是道」，只说：不是这个，不是这个。</text>
<rect x="20" y="104" width="100" height="32" fill="#FBF6EC" stroke="{LINE2}" stroke-width="1.0"/>
<text x="70" y="126" font-size="11.5" fill="#2F2A24" text-anchor="middle">不美</text>
