<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三个「不」，一个动作：不主动造标" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="484" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 章 · 治 世</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">不造标</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">标尺不起，争、盗、乱便无处生根——不是不许人，是不先把尺子立起来。</text>
<text x="20" y="122" font-size="10.5" fill="#A2503B">不尚贤</text>
<line x1="112" y1="117" x2="136" y2="117" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="142" y="122" font-size="10.5" fill="#2F2A24">不争</text>
<text x="184" y="122" font-size="9" fill="#6E6459">不把人的长处摆成徽章</text>
<text x="20" y="158" font-size="10.5" fill="#A2503B">不贵难得之货</text>
<line x1="112" y1="153" x2="136" y2="153" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="142" y="158" font-size="10.5" fill="#2F2A24">不为盗</text>
<text x="184" y="158" font-size="9" fill="#6E6459">不把稀罕东西标成高价</text>
<text x="20" y="194" font-size="10.5" fill="#A2503B">不见可欲</text>
<line x1="112" y1="189" x2="136" y2="189" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="142" y="194" font-size="10.5" fill="#2F2A24">心不乱</text>
<text x="184" y="194" font-size="9" fill="#6E6459">不把勾人的东西摆在眼前</text>
<text x="20" y="240" font-size="9.5" fill="#8A7C69">后半章转治身：壁与空，同一只器</text>
<rect x="30" y="266" width="14" height="82" fill="#2F2A24" opacity="0.55"/>
<rect x="130" y="266" width="14" height="82" fill="#2F2A24" opacity="0.55"/>
<line x1="44" y1="348" x2="130" y2="348" stroke="#2F2A24" stroke-width="1" opacity="0.55"/>
<text x="87" y="311.0" font-size="12" fill="#8A7C69" text-anchor="middle">空</text>
<text x="150" y="274" font-size="9" fill="#A2503B">壁</text>
<text x="166" y="286" font-size="9" fill="#A2503B">壁：实其腹 · 强其骨</text>
<text x="166" y="304" font-size="9" fill="#6E6459">厚其壁，是让它立得住</text>
<text x="166" y="322" font-size="9" fill="#6E6459">守其空，是让它容得下</text>
<text x="166" y="342" font-size="8.8" fill="#4A5C55">虚心弱志＝守其空，不是抽空人</text>
<rect x="20" y="370" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="397" font-size="12" fill="#2F2A24" text-anchor="middle" letter-spacing="1">为无为，则无不治</text>
<text x="190" y="440" font-size="9.5" fill="#6E6459" text-anchor="middle">最易读错处：把「不造标」读成「不许人」，或读成禁欲。</text>
</svg>