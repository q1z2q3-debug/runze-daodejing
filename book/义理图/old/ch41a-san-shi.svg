<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="不是境界高低，是把边界当不当真" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="540" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 一 章 · 三 士</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">三种边界</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">三个人看同一只杯子。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="115" font-size="6.6" fill="#2F2A24" text-anchor="middle">上士闻道，勤能行之；中士闻道，若存若亡；下士闻道，大笑之。</text>
<text x="190" y="129" font-size="6.6" fill="#A2503B" text-anchor="middle">弗笑，不足以为道。</text>
<text x="24" y="196" font-size="9.0" fill="#4A5C55">上士</text>
<path d="M68,186 l8,-6 l0,12 l-8,-6" fill="none" stroke="#4A5C55" stroke-width="1.1"/>
<path d="M83,186 l8,-6 l0,12 l-8,-6" fill="none" stroke="#4A5C55" stroke-width="1.1"/>
<path d="M98,186 l8,-6 l0,12 l-8,-6" fill="none" stroke="#4A5C55" stroke-width="1.1"/>
<path d="M113,186 l8,-6 l0,12 l-8,-6" fill="none" stroke="#4A5C55" stroke-width="1.1"/>
<path d="M128,186 l8,-6 l0,12 l-8,-6" fill="none" stroke="#4A5C55" stroke-width="1.1"/>
<text x="120" y="208" font-size="5.6" fill="#6E6459" text-anchor="middle">绵绵不断（勤，帛书作堇）</text>
<text x="190" y="168" font-size="6.4" fill="#2F2A24">知道那条线是自己画的，于是不照它活。</text>
<text x="190" y="184" font-size="6.2" fill="#6E6459">他的不同不在能吃苦，在不再需要边界。</text>
<text x="190" y="200" font-size="6.2" fill="#4A5C55">线一撤，路就通了。</text>
<text x="24" y="288" font-size="9.0" fill="#2F2A24">中士</text>
<line x1="68" y1="278" x2="94" y2="278" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="94" y1="278" x2="140" y2="278" stroke="#2F2A24" stroke-width="1.0" stroke-dasharray="5 5"/>
<text x="104" y="268" font-size="5.4" fill="#2F2A24" text-anchor="middle">信</text>
<text x="133" y="268" font-size="5.4" fill="#6E6459" text-anchor="middle">疑</text>
<text x="96" y="300" font-size="5.6" fill="#6E6459" text-anchor="middle">早上信，晚上疑</text>
<text x="190" y="260" font-size="6.4" fill="#2F2A24">看见了那个空的作用，可一动手，还是照边界去动。</text>
<text x="190" y="276" font-size="6.2" fill="#6E6459">讲的时候通，做的时候断——若存若亡。</text>
<text x="190" y="292" font-size="6.2" fill="#2F2A24">知道边界是画的，却还是照着它活。</text>
<text x="24" y="380" font-size="9.0" fill="#A2503B">下士</text>
<rect x="70" y="354" width="34" height="30" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.9"/>
<text x="87" y="373" font-size="7.0" fill="#2F2A24" text-anchor="middle">有</text>
<text x="115" y="373" font-size="8.0" fill="#A2503B">×</text>
<path d="M112,386 a10,10 0 0 0 20,0" fill="none" stroke="#A2503B" stroke-width="1"/>
<text x="96" y="402" font-size="5.6" fill="#6E6459" text-anchor="middle">只信边界内的东西</text>
<text x="190" y="352" font-size="6.4" fill="#2F2A24">他只认有形、有成果、有输赢、有定型。</text>
<text x="190" y="368" font-size="5.9" fill="#6E6459">你讲虚、讲退、讲不足，他听到的不是另一层，是「没有」。</text>
<text x="190" y="384" font-size="6.2" fill="#A2503B">所以他笑——那不是轻慢，是真诚的不信。</text>
<rect x="20" y="418" width="340" height="50" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="435" font-size="6.8" fill="#2F2A24" text-anchor="middle">三个人看同一只杯子：一个只看见壁，一个看见空却不敢松手，</text>
<text x="190" y="449" font-size="6.8" fill="#2F2A24" text-anchor="middle">一个知道壁和空本来是一回事。</text>
<text x="190" y="463" font-size="6.6" fill="#A2503B" text-anchor="middle">下士没有看错，他看的是背面。</text>
<line x1="20" y1="482" x2="360" y2="482" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="496" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="512" font-size="8.4" fill="#2F2A24">下士没有看错，他看的是背面；他只是不知道那件东西还有另一面。</text>
<text x="20" y="528" font-size="8.4" fill="#2F2A24">不是道难懂，是道难看；难懂可以学，难看只能翻过来看。</text>
</svg>