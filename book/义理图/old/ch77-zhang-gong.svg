<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 566" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="张弓：上弦不是拉满，是找那个刚好" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="566" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 七 章 · 调 平</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">张弓</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">拉满是使力，调平是找平；拉满会断，调平才久。</text>
<path d="M 120 236 Q 190 132 260 236" fill="none" stroke="#2F2A24" stroke-width="1.6"/>
<line x1="120" y1="236" x2="260" y2="236" stroke="#2F2A24" stroke-width="1"/>
<text x="198" y="226" font-size="9.5" fill="#8A7C69" text-anchor="middle">弓</text>
<text x="236" y="254" font-size="9.5" fill="#8A7C69">弦</text>
<line x1="94" y1="190" x2="146" y2="148" stroke="#C9B79A" stroke-width="1.0" marker-end="url(#arr)"/>
<text x="20" y="144" font-size="9.5" fill="#6E6459">高者抑之：按，一只手够</text>
<line x1="94" y1="256" x2="146" y2="230" stroke="#C9B79A" stroke-width="1.0" marker-end="url(#arr)"/>
<text x="20" y="274" font-size="9.5" fill="#6E6459">下者举之：举，要两只手</text>
<text x="274" y="192" font-size="9.5" fill="#6E6459">有余者损</text>
<text x="274" y="212" font-size="9.5" fill="#6E6459">不足者补</text>
<rect x="20" y="304" width="160" height="96" fill="#F6EFE0" stroke="{LINE2}" stroke-width="1.0"/>
<rect x="200" y="304" width="160" height="96" fill="#FBF6EC" stroke="{LINE2}" stroke-width="1.0"/>
<text x="32" y="326" font-size="10.5" fill="#4A5C55">天之道</text>
<text x="212" y="326" font-size="10.5" fill="#A2503B">人之道</text>
<text x="32" y="350" font-size="9.5" fill="#2F2A24">损有余</text>
<text x="32" y="366" font-size="9.5" fill="#2F2A24">补不足</text>
<text x="32" y="386" font-size="9" fill="#6E6459">往下按一半，往上抬到底</text>
<text x="212" y="350" font-size="9.5" fill="#2F2A24">损不足</text>
<text x="212" y="366" font-size="9.5" fill="#2F2A24">奉有余</text>
<text x="212" y="386" font-size="9" fill="#6E6459">越缺越拿，越有越给</text>
<text x="190" y="432" font-size="11" fill="#2F2A24" text-anchor="middle">孰能有余以奉天下？唯有道者。</text>
<text x="190" y="452" font-size="10" fill="#6E6459" text-anchor="middle">上弦的人不使力，使的是眼。</text>
</svg>