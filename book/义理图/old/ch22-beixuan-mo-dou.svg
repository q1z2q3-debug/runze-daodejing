<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="抱一为天下式：一条弹出来的线，抵得上一桌样板" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="780" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 二 章 · 抱 一</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只墨斗</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">是以圣人抱一为天下式。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">「式」，《说文》：法也。法式不是条目，是一条线。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">抱一，不是统一别人，是不让自己分成好几套标准。</text>
<rect x="26" y="150" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="60" y="256" width="260" height="26" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="68" y1="264" x2="312" y2="264" stroke="#E6D8C2" stroke-width="0.6"/>
<line x1="68" y1="271" x2="312" y2="271" stroke="#E6D8C2" stroke-width="0.6"/>
<rect x="66" y="216" width="38" height="30" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="85" cy="231" r="7" fill="#4A4A44" stroke="#2F2A24" stroke-width="0.6"/>
<line x1="104" y1="228" x2="306" y2="242" stroke="#8A7C69" stroke-width="0.7"/>
<circle cx="306" cy="242" r="2.6" fill="#2F2A24"/>
<line x1="60" y1="276" x2="320" y2="276" stroke="#2F2A24" stroke-width="2.2"/>
<text x="190" y="298" font-size="3.9" fill="#6E6459" text-anchor="middle">一条线，弹在木上：就依它下锯</text>
<text x="85" y="208" font-size="3.6" fill="#8A7C69" text-anchor="middle">墨斗</text>
<path d="M196,302 L214,302 M205,293 L205,293" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<text x="24" y="339" font-size="5.0" fill="#A2503B">一、抱一：一条线，天下木工都依它</text>
<rect x="26" y="352" width="328" height="210" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="60" y="456" width="260" height="26" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="66" y1="448" x2="314" y2="482" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<line x1="66" y1="452" x2="314" y2="480" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<line x1="66" y1="444" x2="314" y2="486" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<line x1="66" y1="456" x2="314" y2="476" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<line x1="66" y1="450" x2="314" y2="484" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<line x1="66" y1="454" x2="314" y2="478" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<line x1="66" y1="446" x2="314" y2="488" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<line x1="66" y1="458" x2="314" y2="474" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<line x1="66" y1="442" x2="314" y2="490" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<line x1="66" y1="460" x2="314" y2="472" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<line x1="60" y1="394" x2="320" y2="394" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="66" y="378" width="16" height="16" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.7"/>
<rect x="97" y="378" width="16" height="16" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.7"/>
<rect x="128" y="378" width="16" height="16" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.7"/>
<rect x="159" y="378" width="16" height="16" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.7"/>
<rect x="190" y="378" width="16" height="16" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.7"/>
<rect x="221" y="378" width="16" height="16" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.7"/>
<rect x="252" y="378" width="16" height="16" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.7"/>
<rect x="283" y="378" width="16" height="16" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.7"/>
<text x="190" y="368" font-size="3.9" fill="#6E6459" text-anchor="middle">架上一排样板，各说各的准</text>
<text x="190" y="500" font-size="3.9" fill="#6E6459" text-anchor="middle">多：十条线，十种标准——木不知道该听哪条。</text>
<text x="190" y="518" font-size="3.9" fill="#4A5C55" text-anchor="middle">手里尺子越多，越不知道哪把量得准。</text>
<text x="190" y="542" font-size="3.8" fill="#8A7C69" text-anchor="middle">抱一不是把线加粗，是把其余九条放下。</text>
<text x="24" y="575" font-size="5.0" fill="#4A5C55">二、多则惑：十条线，木无从下锯</text>
<text x="24" y="594" font-size="4.9" fill="#2F2A24">「抱」不是「守」：守是防它跑掉，抱是它就贴在你身上。</text>
<text x="24" y="610" font-size="4.9" fill="#2F2A24">第十章的抱一是身不裂，这一章的抱一是法不裂：一在内，一在外，说的是同一件事。</text>
<text x="24" y="628" font-size="4.9" fill="#4A5C55">儒家以仁义礼乐为天下式，圣人以抱一为天下式——两条路的分界，就在「式」有几条。</text>
<line x1="24" y1="646" x2="338" y2="646" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="654" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="670" font-size="5.4" fill="#2F2A24" text-anchor="middle">是以圣人抱一为天下式。</text>
<text x="190" y="682" font-size="4.6" fill="#4A5C55" text-anchor="middle">式只有一条：不是把自己分成好几套标准。</text>
<line x1="20" y1="708" x2="360" y2="708" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="722" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="738" font-size="8.4" fill="#2F2A24">曲则全，枉则直，洼则盈，敝则新。</text>
<text x="20" y="754" font-size="8.4" fill="#2F2A24">弯的能受，所以能全；低的能聚，所以能盈。</text>
</svg>