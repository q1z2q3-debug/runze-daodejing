<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="慈、俭、不敢为天下先：三条活得久的约束" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="548" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 七 章 · 三 宝</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">三宝</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">「长」量的是时间，不是位次：做得成，还要做得久。</text>
<rect x="20" y="104" width="108" height="108" fill="#FBF6EC" stroke="{LINE2}" stroke-width="1.0"/>
<text x="74" y="130" font-size="13.5" fill="#A2503B" text-anchor="middle">慈</text>
<path d="M 58 164 Q 74 140 90 164" fill="none" stroke="#4A5C55" stroke-width="1.1"/>
<line x1="74" y1="164" x2="74" y2="174" stroke="#4A5C55" stroke-width="1"/>
<text x="74" y="190" font-size="9" fill="#6E6459" text-anchor="middle">心里长草，护生</text>
<line x1="74" y1="212" x2="74" y2="228" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="74" y="246" font-size="11.5" fill="#4A5C55" text-anchor="middle">勇</text>
<rect x="136" y="104" width="108" height="108" fill="#FBF6EC" stroke="{LINE2}" stroke-width="1.0"/>
<text x="190" y="130" font-size="13.5" fill="#A2503B" text-anchor="middle">俭</text>
<path d="M 176 148 Q 190 140 204 148" fill="none" stroke="#4A5C55" stroke-width="1"/>
<path d="M 176 157 Q 190 149 204 157" fill="none" stroke="#4A5C55" stroke-width="1"/>
<path d="M 176 166 Q 190 158 204 166" fill="none" stroke="#4A5C55" stroke-width="1"/>
<text x="190" y="190" font-size="9" fill="#6E6459" text-anchor="middle">把散出的收成一束绳</text>
<line x1="190" y1="212" x2="190" y2="228" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="190" y="246" font-size="11.5" fill="#4A5C55" text-anchor="middle">广</text>
<rect x="252" y="104" width="108" height="108" fill="#FBF6EC" stroke="{LINE2}" stroke-width="1.0"/>
<text x="306" y="130" font-size="13.5" fill="#2F2A24" text-anchor="middle">不敢为先</text>
<line x1="288" y1="166" x2="324" y2="166" stroke="#4A5C55" stroke-width="1"/>
<line x1="296" y1="166" x2="296" y2="148" stroke="#4A5C55" stroke-width="1"/>
<text x="306" y="190" font-size="9" fill="#6E6459" text-anchor="middle">不抢位次</text>
<line x1="306" y1="212" x2="306" y2="228" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="306" y="246" font-size="11.5" fill="#2F2A24" text-anchor="middle">长 · 久</text>
<rect x="20" y="262" width="340" height="50" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="30" y="282" font-size="10.5" fill="#A2503B">今舍慈且勇，舍俭且广，舍后且先，死矣。</text>
<text x="30" y="302" font-size="9.5" fill="#6E6459">三样一起舍，就是把「久」换成了「快」。</text>
<text x="190" y="338" font-size="11" fill="#2F2A24" text-anchor="middle">夫慈，以战则胜，以守则固。</text>
</svg>