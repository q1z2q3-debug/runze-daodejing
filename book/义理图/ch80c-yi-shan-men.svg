<line x1="186" y1="282" x2="186" y2="220" stroke="#2F2A24" stroke-width="1.8"/>
<line x1="128" y1="220" x2="196" y2="220" stroke="#2F2A24" stroke-width="1.3"/>
<path d="M138,282 L138,224 L120,218 L120,276 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="129" y1="279" x2="129" y2="221" stroke="#DCCBB0" stroke-width="0.7"/>
<path d="M141,282 L196,282 L300,238 L268,238 Z" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.9"/>
<path d="M272,238 L284,224 L296,238" fill="none" stroke="#B9A98F" stroke-width="1.1"/>
<rect x="274" y="238" width="20" height="14" fill="none" stroke="#B9A98F" stroke-width="1.1"/>
<circle cx="308" cy="252" r="2" fill="#B9A98F"/>
<circle cx="317" cy="254" r="1.6" fill="#B9A98F"/>
<text x="290" y="262" font-size="4.2" fill="#6E6459" text-anchor="middle">邻国在望</text>
<text x="190" y="310" font-size="4.6" fill="#4A5C55" text-anchor="middle">门是开的：挡路的从来不是门</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、脚停在门槛前</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="486" x2="330" y2="486" stroke="#2F2A24" stroke-width="1"/>
<line x1="138" y1="486" x2="138" y2="424" stroke="#2F2A24" stroke-width="1.8"/>
<line x1="186" y1="486" x2="186" y2="424" stroke="#2F2A24" stroke-width="1.8"/>
<line x1="128" y1="424" x2="196" y2="424" stroke="#2F2A24" stroke-width="1.3"/>
<ellipse cx="74" cy="478" rx="9" ry="5" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="92" cy="478" rx="9" ry="5" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<circle cx="78" cy="475" r="0.9" fill="#2F2A24"/>
<circle cx="96" cy="475" r="0.9" fill="#2F2A24"/>
<circle cx="82" cy="475" r="0.9" fill="#2F2A24"/>
<circle cx="100" cy="475" r="0.9" fill="#2F2A24"/>
<circle cx="86" cy="475" r="0.9" fill="#2F2A24"/>
<circle cx="104" cy="475" r="0.9" fill="#2F2A24"/>
<path d="M104,478 L124,478" fill="none" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="124" y1="468" x2="124" y2="488" stroke="#A2503B" stroke-width="1.2"/>
<text x="120" y="462" font-size="4.2" fill="#A2503B" text-anchor="end">就到这里</text>
<path d="M206,448 q16,-8 32,0" fill="none" stroke="#B9A98F" stroke-width="0.8"/>
<path d="M214,440 q14,-10 28,0" fill="none" stroke="#B9A98F" stroke-width="0.6"/>
<text x="222" y="462" font-size="4.2" fill="#6E6459">鸡犬之声相闻</text>
<text x="190" y="514" font-size="4.6" fill="#4A5C55" text-anchor="middle">非不能往，是不必往</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">门开着，路通着，声音听得见：三样都在，三样都不动。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">没有走过去，不是因为走不过去，是因为没有非走不可的事。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">至老死不相往来者，非不能往，是不必往。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="4.5" fill="#2F2A24" text-anchor="middle">邻国相望，鸡犬之声相闻，民至老死不相往来。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">望得见，闻得见，脚不过去。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">邻国相望，鸡犬之声相闻，民至老死不相往来。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">不相往来者，非不能往，是不必往。</text>
</svg>