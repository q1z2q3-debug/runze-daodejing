<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="根重的树，冠再摇也不倒" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="560" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 六 章 · 轻 重</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">重为轻根</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">法地不是学地的形状，是学地的分量。</text>
<line x1="26" y1="258" x2="354" y2="258" stroke="#DCCBB0" stroke-width="1"/>
<path d="M190,258 q-16,26 -42,36" fill="none" stroke="#B9A98F" stroke-width="1.4"/>
<path d="M190,258 q-4,34 -4,50" fill="none" stroke="#B9A98F" stroke-width="1.4"/>
<path d="M190,258 q18,26 44,34" fill="none" stroke="#B9A98F" stroke-width="1.4"/>
<path d="M196,258 q26,18 46,20" fill="none" stroke="#B9A98F" stroke-width="1.4"/>
<path d="M180,258 C178,218 176,188 174,166 L206,166 C204,188 202,218 200,258 Z" fill="#E9DFCC" stroke="#DCCBB0" stroke-width="1"/>
<line x1="174" y1="166" x2="140" y2="146" stroke="#DCCBB0" stroke-width="1.1"/>
<line x1="174" y1="170" x2="156" y2="134" stroke="#DCCBB0" stroke-width="1.1"/>
<line x1="206" y1="166" x2="244" y2="144" stroke="#DCCBB0" stroke-width="1.1"/>
<line x1="206" y1="170" x2="224" y2="132" stroke="#DCCBB0" stroke-width="1.1"/>
<ellipse cx="138" cy="136" rx="26" ry="14" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.9"/>
<ellipse cx="160" cy="124" rx="22" ry="12" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.9"/>
<ellipse cx="246" cy="134" rx="26" ry="14" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.9"/>
<ellipse cx="224" cy="122" rx="22" ry="12" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.9"/>
<path d="M282,130 q14,-6 26,0" fill="none" stroke="#DCCBB0" stroke-width="0.9"/>
<path d="M282,142 q14,-6 26,0" fill="none" stroke="#DCCBB0" stroke-width="0.9"/>
<path d="M282,154 q14,-6 26,0" fill="none" stroke="#DCCBB0" stroke-width="0.9"/>
<text x="24" y="142" font-size="8.4" fill="#8A7C69">风来，冠摇，</text>
<text x="24" y="154" font-size="8.4" fill="#8A7C69">干不摇。</text>
<text x="26" y="116" font-size="8.2" fill="#6E6459">冠：轻</text>
<text x="28" y="320" font-size="8.2" fill="#2F2A24">根：重——往下那一截，才是立得住的。</text>
<text x="28" y="334" font-size="8.2" fill="#8A7C69">冠再大，根一浅，整棵就倒。</text>
<text x="28" y="358" font-size="8.6" fill="#A2503B">静为躁君：静不是不动，静是动的发令处。</text>
<text x="28" y="372" font-size="8.2" fill="#6E6459">干是静，枝叶是躁；风一来，先动的总是轻的那头。</text>
<rect x="20" y="386" width="340" height="46" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="404" font-size="9.4" fill="#2F2A24" text-anchor="middle">终日行，不离辎重：树长多高，根都在脚下。</text>
<text x="190" y="420" font-size="8.2" fill="#6E6459" text-anchor="middle">荣观是花果：好看；燕处是树身：不搬进去。</text>
<rect x="20" y="448" width="340" height="42" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="466" font-size="10.4" fill="#2F2A24" text-anchor="middle" letter-spacing="1">轻则失根，躁则失君。</text>
<text x="190" y="481" font-size="8.2" fill="#6E6459" text-anchor="middle">树一拔根，风还没停，它已经倒了。</text>
<line x1="20" y1="498" x2="360" y2="498" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="512" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="528" font-size="8.4" fill="#2F2A24">法地，不是学地的形状，是学地的分量。</text>
<text x="20" y="544" font-size="8.4" fill="#2F2A24">不是被外面夺了权，是你自己先把位置让出去了。</text>
</svg>