<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 626" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="法地不是学地的形状，是学地的分量" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="626" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 六 章 · 轻 重</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">重为轻根</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">轻车跑得快，正因为它不载重——代价是空。</text>
<rect x="30" y="142" width="96" height="26" fill="#D9C7A6" stroke="#B9A98F" stroke-width="1.0"/>
<text x="78" y="159" font-size="9.6" fill="#2F2A24" text-anchor="middle">重</text>
<line x1="78" y1="142" x2="78" y2="124" stroke="#DCCBB0" stroke-width="1"/>
<circle cx="78" cy="118" r="6" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1"/>
<text x="78" y="117" font-size="7" fill="#6E6459" text-anchor="middle">轻</text>
<text x="78" y="184" font-size="8.2" fill="#2F2A24" text-anchor="middle">有根：轻挂在重上</text>
<rect x="214" y="142" width="96" height="26" fill="#D9C7A6" stroke="#B9A98F" stroke-width="1.0"/>
<text x="262" y="159" font-size="9.6" fill="#2F2A24" text-anchor="middle">重</text>
<circle cx="330" cy="118" r="6" fill="#FBF6EC" stroke="#A2503B" stroke-width="1"/>
<text x="330" y="117" font-size="7" fill="#A2503B" text-anchor="middle">轻</text>
<line x1="330" y1="126" x2="330" y2="162" stroke="#A2503B" stroke-width="0.9" stroke-dasharray="3 3" marker-end="url(#arrS)"/>
<text x="336" y="148" font-size="7.4" fill="#A2503B">落</text>
<text x="262" y="184" font-size="8.2" fill="#A2503B" text-anchor="middle">失根：根一抽，轻就落</text>
<text x="20" y="204" font-size="8.8" fill="#A2503B">静为躁君：君是统摄，不是压制</text>
<rect x="34" y="246" width="48" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="58" y="265" font-size="10.4" fill="#2F2A24" text-anchor="middle">静</text>
<line x1="58" y1="246" x2="58" y2="228" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="58" y1="228" x2="148" y2="228" stroke="#6E6459" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="58" y="288" font-size="8.4" fill="#2F2A24">有君：动由我出</text>
<text x="58" y="302" font-size="7.6" fill="#8A7C69">令从座上发出，往哪去由上定</text>
<rect x="210" y="246" width="48" height="30" fill="none" stroke="#C9B79A" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="234" y="265" font-size="8.0" fill="#B0A18B" text-anchor="middle">空</text>
<line x1="234" y1="246" x2="234" y2="228" stroke="#A2503B" stroke-width="1.1"/>
<line x1="234" y1="228" x2="256" y2="236" stroke="#A2503B" stroke-width="1.1"/>
<line x1="256" y1="236" x2="278" y2="226" stroke="#A2503B" stroke-width="1.1"/>
<line x1="278" y1="226" x2="300" y2="238" stroke="#A2503B" stroke-width="1.1"/>
<line x1="300" y1="238" x2="322" y2="228" stroke="#A2503B" stroke-width="1.1"/>
<line x1="322" y1="228" x2="344" y2="234" stroke="#A2503B" stroke-width="1.1"/>
<text x="234" y="288" font-size="8.4" fill="#A2503B">失君：动自己乱摆</text>
<text x="234" y="302" font-size="7.6" fill="#8A7C69">座一空，线就不听令了</text>
<text x="20" y="324" font-size="8.4" fill="#6E6459">静不是不动，静是动的发令处；躁不是动，是动失了主。</text>
<text x="20" y="344" font-size="8.4" fill="#6E6459">终日行，不离辎重：走到哪，根就带到哪。</text>
<rect x="160" y="352" width="64" height="24" fill="#FBF6EC" stroke="#C9B79A" stroke-width="1.0"/>
<text x="192" y="368" font-size="9" fill="#2F2A24" text-anchor="middle">身</text>
<rect x="160" y="380" width="64" height="24" fill="#E9DFCC" stroke="#C9B79A" stroke-width="1.0"/>
<text x="192" y="396" font-size="8.6" fill="#2F2A24" text-anchor="middle">辎重</text>
<line x1="192" y1="376" x2="192" y2="380" stroke="#DCCBB0" stroke-width="1"/>
<line x1="30" y1="410" x2="340" y2="410" stroke="#E6D8C2" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="20" y="428" width="162" height="40" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="101" y="446" font-size="8.8" fill="#A2503B" text-anchor="middle">荣观：外面好看</text>
<text x="101" y="460" font-size="7.8" fill="#6E6459" text-anchor="middle">看一眼，不跟着走</text>
<rect x="198" y="428" width="162" height="40" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="279" y="446" font-size="8.4" fill="#4A5C55" text-anchor="middle">燕处超然：在场而不随之</text>
<text x="279" y="460" font-size="7.8" fill="#6E6459" text-anchor="middle">坐在这里，不搬进里头</text>
<rect x="20" y="486" width="340" height="42" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="505" font-size="10.4" fill="#2F2A24" text-anchor="middle" letter-spacing="1">轻则失根，躁则失君。</text>
<text x="190" y="520" font-size="8.2" fill="#6E6459" text-anchor="middle">不是被外面夺了权，是你自己先把位置让出去了。</text>
<line x1="20" y1="536" x2="360" y2="536" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="550" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="566" font-size="8.4" fill="#2F2A24">法地，不是学地的形状，是学地的分量。</text>
<text x="20" y="582" font-size="8.4" fill="#2F2A24">不是被外面夺了权，是你自己先把位置让出去了。</text>
</svg>