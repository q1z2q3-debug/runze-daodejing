<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="勇从力，是一股气；气没有方向，方向由敢给" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="712" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 三 章 · 勇</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一股气</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">勇于敢则杀，勇于不敢则活。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「勇」，《说文》「气也」，从力；「敢」，「进取也」——气是力气，敢是往前拿。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">同一股气：冲出去叫勇于敢，按住不放叫勇于不敢。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、气本身：没有方向，四下都吹</text>
<rect x="26" y="162" width="328" height="146" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="150" cy="194" r="8" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M136,206 L164,206 L166,254 L134,254 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="143" y1="254" x2="139" y2="286" stroke="#2F2A24" stroke-width="1"/>
<line x1="157" y1="254" x2="161" y2="286" stroke="#2F2A24" stroke-width="1"/>
<circle cx="150" cy="228" r="6" fill="#A2503B" fill-opacity="0.3" stroke="#A2503B" stroke-width="0.8"/>
<path d="M136.45536268481138,220.18 Q122.11398199814107,217.65 110.16283142591581,205.0" fill="none" stroke="#A2503B" stroke-width="0.9" opacity="0.75"/>
<path d="M150.0,214.4 Q150.0,210.0 150.0,188.0" fill="none" stroke="#A2503B" stroke-width="0.9" opacity="0.75"/>
<path d="M163.54463731518862,220.18 Q177.88601800185893,217.65 189.8371685740842,205.0" fill="none" stroke="#A2503B" stroke-width="0.9" opacity="0.75"/>
<path d="M138.22205450853164,234.8 Q125.75128869403572,237.0 115.35898384862244,248.0" fill="none" stroke="#A2503B" stroke-width="0.9" opacity="0.75"/>
<path d="M161.77794549146836,234.8 Q174.2487113059643,237.0 184.64101615137756,248.0" fill="none" stroke="#A2503B" stroke-width="0.9" opacity="0.75"/>
<path d="M150.0,242.96 Q150.0,247.8 150.0,272.0" fill="none" stroke="#A2503B" stroke-width="0.9" opacity="0.75"/>
<text x="190" y="324" font-size="4.6" fill="#4A5C55" text-anchor="middle">气在胸中，四面都吹：它有力气，没有去处</text>
<text x="24" y="346" font-size="4.8" fill="#4A5C55">二、同一股气，两个去处：冲出去，或按住</text>
<rect x="26" y="358" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="106" cy="390" r="8" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M92,402 L120,402 L122,450 L90,450 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="99" y1="450" x2="95" y2="482" stroke="#2F2A24" stroke-width="1"/>
<line x1="113" y1="450" x2="117" y2="482" stroke="#2F2A24" stroke-width="1"/>
<circle cx="106" cy="424" r="5" fill="#A2503B" fill-opacity="0.3" stroke="#A2503B" stroke-width="0.8"/>
<path d="M112,418 Q166,390 238,384" fill="none" stroke="#A2503B" stroke-width="1.1"/>
<polygon points="238,384 226,378 228,390" fill="#A2503B"/>
<text x="184" y="372" font-size="4.5" fill="#A2503B">勇于敢：冲出去</text>
<ellipse cx="160" cy="446" rx="15" ry="7" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="148" y1="440" x2="138" y2="440" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="148" y1="444" x2="138" y2="444" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="148" y1="448" x2="138" y2="448" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="148" y1="452" x2="138" y2="452" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M112,434 Q128,440 137,444" fill="none" stroke="#4A5C55" stroke-width="1.1"/>
<path d="M137,448 Q126,458 118,454" fill="none" stroke="#4A5C55" stroke-width="1" stroke-dasharray="4 3"/>
<polygon points="120,454 130,450 128,458" fill="#4A5C55"/>
<text x="110" y="474" font-size="4.5" fill="#4A5C55">勇于不敢：按住，气回旋</text>
<text x="190" y="524" font-size="4.6" fill="#4A5C55" text-anchor="middle">按住不比冲出省力：同一股气，只是没有往前拿</text>
<text x="24" y="540" font-size="4.8" fill="#2F2A24">所以「勇于不敢」四个字，勇字不可省：缩手的人不必费这个力。</text>
<text x="24" y="556" font-size="4.8" fill="#2F2A24">敢是方向：冲出去是一个方向，按住也是一个方向——都用这股气。</text>
<text x="24" y="574" font-size="5.0" fill="#4A5C55">气无方向，向由敢定；按亦须力，按错其处，气则白按。</text>
<line x1="24" y1="590" x2="338" y2="590" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="598" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="613" font-size="5.2" fill="#2F2A24" text-anchor="middle">勇者，气也，从力甬声；敢者，进取也，从攴。</text>
<text x="190" y="626" font-size="4.7" fill="#4A5C55" text-anchor="middle">气留着，方向自己给；不给方向的气，只是乱撞。</text>
<line x1="20" y1="652" x2="360" y2="652" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="666" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="682" font-size="8.4" fill="#2F2A24">勇于敢则杀，勇于不敢则活。</text>
<text x="20" y="698" font-size="8.4" fill="#2F2A24">气无方向，向由敢定；</text>
</svg>