<text x="250" y="502" font-size="3.9" fill="#8A7C69">沟是水自己让出来的</text>
<line x1="240" y1="498" x2="206" y2="480" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="190" y="542" font-size="4.2" fill="#4A5C55" text-anchor="middle">同一片沙，淌过几遍，沟就自己出来了：水顺着沟走，不再散。</text>
<text x="24" y="573" font-size="5.0" fill="#4A5C55">二、同一片沙：沟不是挖的，是水自己淌出来的</text>
<text x="24" y="590" font-size="4.9" fill="#2F2A24">「自然」不是「不管」，是「不需要管」：两件事的差别，全在有没有人在使劲。</text>
<text x="24" y="606" font-size="4.9" fill="#2F2A24">希言也不是闭口：话说得少、说得准，说完就收，事就自己这样了。</text>
<text x="24" y="624" font-size="4.9" fill="#4A5C55">放任是「不管」，自然是不必管——秩序自己长出来，用不着谁在旁边吆喝。</text>
<line x1="24" y1="640" x2="338" y2="640" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="648" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="664" font-size="5.2" fill="#2F2A24" text-anchor="middle">自然不是没有秩序，是秩序自己长出来的。</text>
<text x="190" y="676" font-size="4.5" fill="#4A5C55" text-anchor="middle">希言者不争久，而自久。</text>
<line x1="20" y1="702" x2="360" y2="702" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="716" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="732" font-size="8.4" fill="#2F2A24">自然不是「不管」，是「不需要管」——差别全在有没有人在使劲。</text>
<text x="20" y="748" font-size="8.4" fill="#2F2A24">信不足，不是话说得不够多，是话后面没有人。</text>
</svg>