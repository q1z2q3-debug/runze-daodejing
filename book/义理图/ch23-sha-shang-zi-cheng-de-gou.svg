<ellipse cx="228" cy="258" rx="9" ry="2.6" fill="#CFE0D6" stroke="none"/>
<text x="190" y="316" font-size="4.2" fill="#A2503B" text-anchor="middle">没人管，水也没有路：一落下来就四处走，走一路散一路。</text>
<text x="24" y="339" font-size="5.0" fill="#A2503B">一、一段新沙：水落上去，四处乱淌</text>
<rect x="26" y="352" width="328" height="208" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M56,418 Q90,412 120,418 Q170,410 214,418 Q270,412 324,418 L324,520 L56,520 Z" fill="#E9DFC7" stroke="#C9B79A" stroke-width="0.8"/>
