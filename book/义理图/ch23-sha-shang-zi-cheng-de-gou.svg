<rect x="0" y="0" width="380" height="774" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 三 章 · 希 言 自 然</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">沙上自成的沟</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">希言自然。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">希，稀也，少也：希言是少言、不滥施号令，不是闭口不言。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">自然：自，自身；然，如是——不借外力而自如此，不是今语的「自然界」。</text>
