<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="先站住，才够；先够，永远不够" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="512" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 六 章 · 足</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一句话里三个「足」</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">故知足之足，常足矣。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.9" fill="#2F2A24" text-anchor="middle">第一个足是脚，第二个足是够，第三个足是一直站着。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">书上说：用「知道脚站在哪儿」的那个足，去换「够」的那个足。</text>
<text x="24" y="152" font-size="5.9" fill="#2F2A24">一 · 第一个足：脚</text>
<line x1="24" y1="220" x2="126" y2="220" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="72" cy="212" rx="7.4" ry="6" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M66,206 Q63.5,198 67,193 L77,193 Q80.5,198 78,206 Z" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<ellipse cx="72" cy="189" rx="10" ry="6" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="62.5" cy="186" r="2.5" fill="none" stroke="#2F2A24" stroke-width="0.55"/>
<circle cx="68" cy="180" r="2.2" fill="none" stroke="#2F2A24" stroke-width="0.55"/>
<circle cx="73.5" cy="178" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.55"/>
<circle cx="79" cy="180" r="1.9" fill="none" stroke="#2F2A24" stroke-width="0.55"/>
<circle cx="82.5" cy="186" r="1.7" fill="none" stroke="#2F2A24" stroke-width="0.55"/>
<text x="72" y="234" font-size="4.8" fill="#4A5C55" text-anchor="middle">站住：脚知道地在哪儿</text>
<path d="M134,220 q6,-4 12,0 q6,4 12,0 q6,-4 12,0 q6,4 12,0" fill="none" stroke="#2F2A24" stroke-width="0.4" opacity="0.25"/>
<ellipse cx="190" cy="190" rx="7.4" ry="6" fill="none" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="3 3"/>
<path d="M184,184 Q181.5,176 185,171 L195,171 Q198.5,176 196,184 Z" fill="none" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="3 3"/>
<ellipse cx="190" cy="167" rx="10" ry="6" fill="none" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="3 3"/>
<circle cx="180.5" cy="164" r="2.5" fill="none" stroke="#A2503B" stroke-width="0.55" stroke-dasharray="3 3"/>
<circle cx="186" cy="158" r="2.2" fill="none" stroke="#A2503B" stroke-width="0.55" stroke-dasharray="3 3"/>
<circle cx="191.5" cy="156" r="2.0" fill="none" stroke="#A2503B" stroke-width="0.55" stroke-dasharray="3 3"/>
<circle cx="197" cy="158" r="1.9" fill="none" stroke="#A2503B" stroke-width="0.55" stroke-dasharray="3 3"/>
<circle cx="200.5" cy="164" r="1.7" fill="none" stroke="#A2503B" stroke-width="0.55" stroke-dasharray="3 3"/>
<path d="M183,212 v10 M197,212 v10" stroke="#A2503B" stroke-width="0.3" stroke-dasharray="2 2"/>
<path d="M176,222 q14,6 28,0" fill="none" stroke="#A2503B" stroke-width="0.3" stroke-dasharray="2 2"/>
<text x="190" y="234" font-size="4.8" fill="#A2503B" text-anchor="middle">还在往下探：底下没有地</text>
<text x="24" y="254" font-size="5.9" fill="#2F2A24">二 · 第二个足：够（门槛）</text>
<path d="M30,324 L96,316 L96,306 L162,298 L162,288 L228,280 L228,270 L294,262" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<text x="300" y="264" font-size="4.8" fill="#A2503B">够</text>
<text x="300" y="276" font-size="4.5" fill="#A2503B">的门槛</text>
<text x="36" y="340" font-size="5.2" fill="#A2503B">不知足的人：门槛一级一级往上，脚一直没落地。</text>
<text x="24" y="366" font-size="5.2" fill="#4A5C55">三 · 第三个足：常——脚先落地，门槛就不动了。</text>
<line x1="24" y1="380" x2="338" y2="380" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="388" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="404" font-size="5.2" fill="#2F2A24" text-anchor="middle">先站住，才够；先够，永远不够。</text>
<text x="190" y="418" font-size="5.8" fill="#4A5C55" text-anchor="middle">顺序不能倒：靠外物撑起来的「够」，是借来的。</text>
<line x1="20" y1="446" x2="360" y2="446" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="460" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="476" font-size="8.4" fill="#2F2A24">先站住，才够；先够，永远不够。</text>
<text x="20" y="492" font-size="8.4" fill="#2F2A24">靠外物撑起来的「够」，是借来的；借来的东西，主人随时可以收回。</text>
</svg>