<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 734" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="树结果就停，人却常拿结果去换一个更大的自己" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="734" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 章 · 果 与 树（补图）</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">果而已</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">善有果而已，不敢以取强。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「果」，《说文》「木实也」——树上的果子；「壮」，《说文》「大也」。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">果是树的事，强是我的事：树结果就停，人一贪就拿果去换一个更大的自己。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、果而已：结完就停</text>
<rect x="26" y="164" width="328" height="164" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M40,284 Q96,250 168,232" fill="none" stroke="#2F2A24" stroke-width="2.0"/>
<path d="M102,262 Q98,240 88,230" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M136,248 Q140,232 152,226" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="92" y1="269" x2="92" y2="266" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="92" cy="274" r="5.2" fill="#EDD6B0" stroke="#A2503B" stroke-width="0.9"/>
<line x1="120" y1="253" x2="120" y2="250" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="120" cy="258" r="5.2" fill="#EDD6B0" stroke="#A2503B" stroke-width="0.9"/>
<line x1="146" y1="237" x2="146" y2="234" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="146" cy="242" r="5.2" fill="#EDD6B0" stroke="#A2503B" stroke-width="0.9"/>
<line x1="164" y1="223" x2="164" y2="220" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="164" cy="228" r="5.2" fill="#EDD6B0" stroke="#A2503B" stroke-width="0.9"/>
<line x1="164" y1="226" x2="196" y2="226" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 2"/>
<text x="200" y="228" font-size="4.0" fill="#A2503B">到这儿就停</text>
<text x="190" y="306" font-size="4.1" fill="#8A7C69" text-anchor="middle">一棵树结果，结完就停了；它不会为了证明自己能结，再多结几个</text>
<text x="190" y="318" font-size="4.1" fill="#8A7C69" text-anchor="middle">果子熟了不摘就掉，树不因为结得好，就结到冬天</text>
<text x="24" y="352" font-size="5.1" fill="#A2503B">二、取强：拿这次的结果，去换一个更大的自己</text>
<rect x="26" y="364" width="328" height="164" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M40,484 Q96,450 168,432" fill="none" stroke="#2F2A24" stroke-width="2.0"/>
<path d="M102,462 Q98,440 88,430" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M136,448 Q140,432 152,426" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="92" cy="474" r="1.6" fill="none" stroke="#A79A86" stroke-width="0.6"/>
<circle cx="120" cy="458" r="1.6" fill="none" stroke="#A79A86" stroke-width="0.6"/>
<circle cx="146" cy="442" r="1.6" fill="none" stroke="#A79A86" stroke-width="0.6"/>
<circle cx="164" cy="428" r="1.6" fill="none" stroke="#A79A86" stroke-width="0.6"/>
<path d="M168,432 q10,-6 22,-4" fill="none" stroke="#A2503B" stroke-width="1.0"/>
<line x1="190" y1="428" x2="292" y2="384" stroke="#A2503B" stroke-width="1.0"/>
<line x1="280" y1="390" x2="302" y2="376" stroke="#A2503B" stroke-width="1.2" marker-end="url(#arrS)"/>
<text x="300" y="372" font-size="4.0" fill="#A2503B" text-anchor="middle">拽</text>
<text x="190" y="506" font-size="4.1" fill="#8A7C69" text-anchor="middle">果子被摘走，枝还往上挣：树不再结果，人去换更大的自己</text>
<text x="190" y="518" font-size="4.1" fill="#8A7C69" text-anchor="middle">枝上只剩果柄——果已经不在树上了</text>
<text x="24" y="548" font-size="4.8" fill="#2F2A24">「果而已」说的不是打赢，是事办完就收；「不敢以取强」是不敢拿结果去换「强」。</text>
<text x="24" y="564" font-size="4.8" fill="#2F2A24">一棵树结完就停，是因为它的本事只在那一季；人的贪，是想把一季的本事当成永远的本事。</text>
<text x="24" y="582" font-size="4.8" fill="#4A5C55">这跟主图的弓是一件事：弓张一下就放，树结完就停——都是知道自己的量有多大。</text>
<line x1="24" y1="600" x2="338" y2="600" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="608" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="624" font-size="6.0" fill="#2F2A24" text-anchor="middle">果子熟了不摘，它就掉了。</text>
<text x="190" y="636" font-size="5.0" fill="#4A5C55" text-anchor="middle">树的量只够那一季；人的贪，是把一季的本事当成永远的本事。</text>
<line x1="20" y1="662" x2="360" y2="662" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="676" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="692" font-size="8.4" fill="#2F2A24">果是树的事，强是我的事；树结果就停，人一贪就老。</text>
<text x="20" y="708" font-size="8.4" fill="#2F2A24">一棵树结果，结完就停；它不会为了证明自己能结，再多结几个。</text>
</svg>