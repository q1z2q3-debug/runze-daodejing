<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="道生一、一生二、二生三、三生万物与反者道之动" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif"><rect x="0" y="0" width="1000" height="700" fill="#F8F3E6"/><text x="24" y="30" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">义 理 图 · 生 成 之 序</text><text x="24" y="66" font-size="18" fill="#2F2A24">道生一，一生二，二生三，三生万物 —— 而「反」是它的引擎</text><text x="24" y="92" font-size="10.4" fill="#6E6459">关键在「三」：它不是第三个数，是二与二之间的那个和。数到三就错了，看到和才对。</text><line x1="168" y1="286" x2="239" y2="286" stroke="#DCCBB0" stroke-width="1"/><path d="M233,282 L243,286 L233,290" fill="none" stroke="#DCCBB0" stroke-width="1.2"/><line x1="363" y1="286" x2="434" y2="286" stroke="#DCCBB0" stroke-width="1"/><path d="M428,282 L438,286 L428,290" fill="none" stroke="#DCCBB0" stroke-width="1.2"/><line x1="558" y1="286" x2="629" y2="286" stroke="#DCCBB0" stroke-width="1"/><path d="M623,282 L633,286 L623,290" fill="none" stroke="#DCCBB0" stroke-width="1.2"/><line x1="753" y1="286" x2="824" y2="286" stroke="#DCCBB0" stroke-width="1"/><path d="M818,282 L828,286 L818,290" fill="none" stroke="#DCCBB0" stroke-width="1.2"/><circle cx="110" cy="286" r="54" fill="#2E7C8F" opacity="0.08"/><circle cx="110" cy="286" r="54" fill="none" stroke="#2E7C8F" stroke-width="1.2"/><text x="110" y="220" font-size="9.2" fill="#2E7C8F" text-anchor="middle" letter-spacing="2">未</text><text x="110" y="299" font-size="34" fill="#2E7C8F" text-anchor="middle">无</text><text x="110" y="366" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">道。未分化、无边界、本自寂静。</text><text x="110" y="381" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">不是空无一物，是还没有「物」。</text><text x="110" y="396" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">此处不可说，只能说「未」。</text><circle cx="305" cy="286" r="54" fill="#8A7C69" opacity="0.08"/><circle cx="305" cy="286" r="54" fill="none" stroke="#8A7C69" stroke-width="1.2"/><text x="305" y="220" font-size="9.2" fill="#8A7C69" text-anchor="middle" letter-spacing="2">初显</text><text x="305" y="299" font-size="34" fill="#8A7C69" text-anchor="middle">一</text><text x="305" y="366" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">第一次显。浑然一体，尚未分。</text><text x="305" y="381" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">此时「有」与「无」还抱在一起，</text><text x="305" y="396" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">叫它「有」，是因为它已经在了。</text><circle cx="500" cy="286" r="54" fill="#B5462F" opacity="0.08"/><circle cx="500" cy="286" r="54" fill="none" stroke="#B5462F" stroke-width="1.2"/><text x="500" y="220" font-size="9.2" fill="#B5462F" text-anchor="middle" letter-spacing="2">分</text><text x="500" y="299" font-size="34" fill="#B5462F" text-anchor="middle">二</text><text x="500" y="366" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">有与无相对，阴阳始分。</text><text x="500" y="381" font-size="8.5" fill="#A2503B" text-anchor="middle" font-weight="600">有无相生，从这里才成立 ——</text><text x="500" y="396" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">一个有了对面，才谈得上相生。</text><circle cx="695" cy="286" r="54" fill="#4A5C55" opacity="0.08"/><circle cx="695" cy="286" r="54" fill="none" stroke="#4A5C55" stroke-width="1.2"/><text x="695" y="220" font-size="9.2" fill="#4A5C55" text-anchor="middle" letter-spacing="2">和</text><text x="695" y="299" font-size="34" fill="#4A5C55" text-anchor="middle">三</text><text x="695" y="366" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">二之间的那个「和」。</text><text x="695" y="381" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">不是第三个东西，是关系本身。</text><text x="695" y="396" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">冲气以为和 —— 和，才生得下万物。</text><circle cx="890" cy="286" r="54" fill="#A2503B" opacity="0.08"/><circle cx="890" cy="286" r="54" fill="none" stroke="#A2503B" stroke-width="1.2"/><text x="890" y="220" font-size="9.2" fill="#A2503B" text-anchor="middle" letter-spacing="2">成</text><text x="890" y="299" font-size="34" fill="#A2503B" text-anchor="middle">万</text><text x="890" y="366" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">三的组合，层层涌现。</text><text x="890" y="381" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">从分子到细胞到人体到宇宙，</text><text x="890" y="396" font-size="8.5" fill="#5C5247" text-anchor="middle" font-weight="400">十九级，每一级都再走一遍这个三。</text><path d="M890,412 L890,500 L110,500 L110,412" fill="none" stroke="#A2503B" stroke-width="1.1" stroke-dasharray="6 5"/><path d="M105,424 L110,408 L115,424" fill="none" stroke="#A2503B" stroke-width="1.2"/><text x="500" y="522" font-size="11" fill="#A2503B" text-anchor="middle" letter-spacing="2">反 者 道 之 动 —— 生 而 不 居，返 而 后 生</text><text x="500" y="546" font-size="9" fill="#6E6459" text-anchor="middle">没有这一返，有就是死有，无就是死无，万物数到三就断了。</text><text x="500" y="606" font-size="9.6" fill="#2F2A24" text-anchor="middle">「无中生有」只能作理上的原点，不能作事上的先后 —— 否则又回到「先有一个无，再生出一个有」。</text><text x="500" y="630" font-size="9.6" fill="#2F2A24" text-anchor="middle">以化学作比：原子是「二」（实核与虚云），键是「三」（两原子之间的和），分子以上是「万物」。</text><text x="500" y="654" font-size="9" fill="#8A7C69" text-anchor="middle">注家于「三」有数读（天地人／阴阳冲气／形气神），本书取「冲气以为和」一读，须在体例定谳。</text></svg>