<text x="20" y="58" font-size="21" fill="#2F2A24">一根标杆</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">上一章是诊断，这一章是方子：先拆招牌，再给归处。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「绝」是不再倚仗，不是砸招牌。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">绝掉的是名，回来的是实。</text>
