<text x="320" y="368" font-size="4.5" fill="#8A7C69" text-anchor="end">同一块田</text>
<text x="24" y="507" font-size="5.0" fill="#4A5C55">二、杆一拔：人回田里，民利百倍</text>
<text x="24" y="526" font-size="4.9" fill="#2F2A24">圣、智是被推崇出来的名；仁、义是被标举出来的德目；巧、利是竞逐出来的物。</text>
<text x="24" y="542" font-size="4.9" fill="#2F2A24">三样一齐放下，不是人变笨变冷，是不再朝同一块牌子使劲。</text>
<text x="24" y="560" font-size="4.9" fill="#4A5C55">孝慈不是提倡出来的，是撤掉标尺之后自己回来的。</text>
