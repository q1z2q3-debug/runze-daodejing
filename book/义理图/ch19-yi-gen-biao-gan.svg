<text x="190" y="602" font-size="6.0" fill="#2F2A24" text-anchor="middle">所绝者名，所复者实。</text>
<text x="190" y="614" font-size="5.2" fill="#4A5C55" text-anchor="middle">撤的是位置，不是东西。</text>
