<text x="20" y="654" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="670" font-size="8.4" fill="#2F2A24">所绝者名，所复者实。</text>
<text x="20" y="686" font-size="8.4" fill="#2F2A24">撤的是位置，不是东西。</text>
