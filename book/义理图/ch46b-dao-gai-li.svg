<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="他不是把刀收了，是把刀改成了犁" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="536" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 六 章 · 犁</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">刀改成犁</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">天下有道，却走马以粪。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.9" fill="#2F2A24" text-anchor="middle">「却」是把冲出去的拉回来；「粪」是把不要的扫回去。</text>
<text x="190" y="126" font-size="5.6" fill="#6E6459" text-anchor="middle">两个都是「收」：一个收力，一个收物。</text>
<text x="24" y="154" font-size="5.2" fill="#2F2A24">刀</text>
<path d="M44,186 Q64,192 96,192 L96,200 Q64,203 44,208 Z" fill="#DDD5C6" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="24" y="193" width="20" height="12" rx="2" fill="#E6D8C2" stroke="#2F2A24" stroke-width="0.6"/>
<line x1="44" y1="186" x2="44" y2="208" stroke="#2F2A24" stroke-width="1"/>
<text x="70" y="222" font-size="5.2" fill="#6E6459" text-anchor="middle">为杀而生</text>
<path d="M120,197 L162,197" fill="none" stroke="#4A5C55" stroke-width="0.6" marker-end="url(#arr2)"/>
<text x="140" y="214" font-size="5.2" fill="#4A5C55" text-anchor="middle">改用途</text>
<text x="140" y="226" font-size="4.2" fill="#6E6459" text-anchor="middle">不是取消力量</text>
<text x="300" y="154" font-size="5.2" fill="#2F2A24">犁</text>
<line x1="180" y1="232" x2="340" y2="232" stroke="#E6D8C2" stroke-width="0.7"/>
<path d="M210,196 Q250,184 320,176" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="320" y1="176" x2="338" y2="174" stroke="#2F2A24" stroke-width="0.5"/>
<line x1="228" y1="192" x2="242" y2="168" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="242" y1="168" x2="254" y2="172" stroke="#2F2A24" stroke-width="0.5"/>
<path d="M212,200 L240,200 L246,214 L232,216 Z" fill="#DDD5C6" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M206,208 L232,216 L214,232 Z" fill="#2F2A24" opacity="0.72"/>
<line x1="206" y1="208" x2="232" y2="216" stroke="#2F2A24" stroke-width="0.5"/>
<path d="M196,232 q4,-5 8,-2 q4,3 8,-1" fill="none" stroke="#4A5C55" stroke-width="0.4" opacity="0.7"/>
<path d="M244,232 q4,-5 8,-2 q4,3 8,-1" fill="none" stroke="#4A5C55" stroke-width="0.4" opacity="0.7"/>
<path d="M262,232 q4,-5 8,-2 q4,3 8,-1" fill="none" stroke="#4A5C55" stroke-width="0.4" opacity="0.7"/>
<text x="238" y="250" font-size="5.2" fill="#4A5C55" text-anchor="middle">为生而用：刀形还在，只是改成往前拉</text>
<text x="24" y="262" font-size="5.6" fill="#A2503B">一 · 收物</text>
<text x="88" y="262" font-size="5.5" fill="#2F2A24">粪，《说文》「弃除也」：把不要的扫出来，再送回田里。</text>
<text x="24" y="302" font-size="5.6" fill="#A2503B">二 · 收力</text>
<text x="88" y="302" font-size="5.5" fill="#2F2A24">却，《说文》「节欲也」：马不是自己回来的，是人先把手收住。</text>
<text x="24" y="342" font-size="5.6" fill="#A2503B">三 · 换用途</text>
<text x="88" y="342" font-size="5.5" fill="#2F2A24">没说不要马。那个时代最贵的军资，降成最贱的农具。</text>
<text x="24" y="382" font-size="5.6" fill="#A2503B">四 · 边界</text>
<text x="88" y="382" font-size="5.5" fill="#2F2A24">刀改犁，是把「推出去」改成「收回来」；边界不再往外长。</text>
<line x1="24" y1="418" x2="338" y2="418" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="428" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="444" font-size="5.2" fill="#2F2A24" text-anchor="middle">不是把刀收了，是把刀改成了犁。</text>
<text x="190" y="458" font-size="5.8" fill="#4A5C55" text-anchor="middle">一件为杀而生的东西，改成一件为生而用的东西。</text>
<line x1="20" y1="486" x2="360" y2="486" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="500" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="516" font-size="8.4" fill="#2F2A24">他不是把刀收了，是把刀改成了犁。</text>
</svg>