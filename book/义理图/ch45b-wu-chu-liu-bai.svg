<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="五处留白，是同一种手，留在不同的地方" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="664" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 五 章 · 五 若</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">五处，一道缝</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">冲到极处，都留一处没补齐。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="115" font-size="6.2" fill="#2F2A24" text-anchor="middle">大成若缺，大盈若冲，大直若屈，大巧若拙，大辩若讷。</text>
<text x="190" y="127" font-size="5.6" fill="#6E6459" text-anchor="middle">五处不是五个德目，是同一种手：到了头，留一处不补齐。</text>
<text x="24" y="154" font-size="5.4" fill="#6E6459">一 · 器</text>
<path d="M41,176 L47,210 L65,210 L71,176" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<line x1="41" y1="176" x2="51" y2="176" stroke="#4A5C55" stroke-width="1"/>
<line x1="61" y1="176" x2="71" y2="176" stroke="#4A5C55" stroke-width="1"/>
<path d="M56,164 v-6 M54,160 l2,-4 l2,4" fill="none" stroke="#4A5C55" stroke-width="0.5"/>
<text x="96" y="176" font-size="6.6" fill="#A2503B">大成若缺</text>
<text x="96" y="194" font-size="5.7" fill="#2F2A24">口沿缺一段，气从这里出去。</text>
<text x="96" y="207" font-size="5.7" fill="#6E6459">其用不敝：封死就裂，留口不敝。</text>
<text x="24" y="232" font-size="5.4" fill="#6E6459">二 · 水</text>
<path d="M41,254 L47,288 L65,288 L71,254" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<ellipse cx="56" cy="254" rx="15" ry="3.6" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<ellipse cx="56" cy="260" rx="10" ry="2.6" fill="#DCE6E0" stroke="#4A5C55" stroke-width="0.5"/>
<text x="96" y="254" font-size="6.6" fill="#A2503B">大盈若冲</text>
<text x="96" y="272" font-size="5.7" fill="#2F2A24">满在里面，外面仍是虚的；一直在往里续。</text>
<text x="96" y="285" font-size="5.7" fill="#6E6459">其用不穷：满在外面的，一满就到顶。</text>
<text x="24" y="310" font-size="5.4" fill="#6E6459">三 · 路</text>
<line x1="38" y1="364" x2="52" y2="348" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="4 3"/>
<path d="M38,368 C50,376 60,356 72,338" fill="none" stroke="#4A5C55" stroke-width="1"/>
<circle cx="72" cy="338" r="2.6" fill="#4A5C55"/>
<text x="96" y="332" font-size="6.6" fill="#A2503B">大直若屈</text>
<text x="96" y="350" font-size="5.7" fill="#2F2A24">直切撞上障碍；绕一下，仍然到得了。</text>
<text x="96" y="363" font-size="5.7" fill="#6E6459">屈不是弯，是缩：收短一点，好过去。</text>
<text x="24" y="388" font-size="5.4" fill="#6E6459">四 · 手</text>
<circle cx="47" cy="428" r="12" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="67" cy="428" r="12" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<text x="96" y="410" font-size="6.6" fill="#A2503B">大巧若拙</text>
<text x="96" y="428" font-size="5.7" fill="#2F2A24">巧到极处，不再需要「巧」这个动作。</text>
<text x="96" y="441" font-size="5.7" fill="#6E6459">看不出使过劲，才是本事；「拙」不是装笨。</text>
<text x="24" y="466" font-size="5.4" fill="#6E6459">五 · 口</text>
<ellipse cx="52" cy="506" rx="9" ry="4.4" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="64" y1="502" x2="78" y2="502" stroke="#A2503B" stroke-width="0.5"/>
<line x1="64" y1="510" x2="78" y2="510" stroke="#A2503B" stroke-width="0.5"/>
<text x="96" y="488" font-size="6.6" fill="#A2503B">大辩若讷</text>
<text x="96" y="506" font-size="5.7" fill="#2F2A24">话卡在嘴边；滔滔的是把世界切得顺手。</text>
<text x="96" y="519" font-size="5.7" fill="#6E6459">说不说满，比说得多更要紧。</text>
<line x1="24" y1="534" x2="338" y2="534" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="544" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="560" font-size="6.2" fill="#2F2A24" text-anchor="middle">世俗求显、锐、巧、辩、满；道这边是隐、柔、朴、默、虚。</text>
<text x="190" y="574" font-size="6.2" fill="#4A5C55" text-anchor="middle">不是没做到，是做到了，故意不补齐。</text>
<line x1="20" y1="602" x2="360" y2="602" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="616" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="632" font-size="8.4" fill="#2F2A24">一刀切过去的直，走不了远路；能缩一下的直，才真的到得了。</text>
<text x="20" y="648" font-size="8.4" fill="#2F2A24">巧到要人看出巧，那是手艺；巧到看不出使过劲，那才是本事。</text>
</svg>