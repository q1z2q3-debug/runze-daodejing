<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 706" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="奥是室之西南隅：最尊，也最暗；不是深奥，是那个角" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="706" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 二 章 · 奥</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一个墙角</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">道者，万物之奥。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「奥」，《说文》「宛也，室之西南隅」——就是屋里西南那个角。</text>
<text x="190" y="126" font-size="5.0" fill="#6E6459" text-anchor="middle">那个角，古人祭神、尊长坐；也最暗——「不见户明」。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、屋里那个角：最尊，也最暗</text>
<rect x="56" y="166" width="266" height="176" fill="#FBF6EC" stroke="none"/>
<polygon points="242,338 276,338 300,214 160,192" fill="#EADFC2" opacity="0.6" stroke="none"/>
<path d="M160,192 Q230,198 300,214" fill="none" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="60" y="294" width="54" height="44" fill="#DBCFB7" stroke="none"/>
<line x1="66" y1="296" x2="66" y2="336" stroke="#C6B79B" stroke-width="0.6"/>
<line x1="76" y1="296" x2="76" y2="336" stroke="#C6B79B" stroke-width="0.6"/>
<line x1="86" y1="296" x2="86" y2="336" stroke="#C6B79B" stroke-width="0.6"/>
<line x1="96" y1="296" x2="96" y2="336" stroke="#C6B79B" stroke-width="0.6"/>
<line x1="106" y1="296" x2="106" y2="336" stroke="#C6B79B" stroke-width="0.6"/>
<rect x="74" y="304" width="26" height="25" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="74" y1="312" x2="100" y2="312" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="74" y1="320" x2="100" y2="320" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="74" y1="328" x2="100" y2="328" stroke="#DCCBB0" stroke-width="0.5"/>
<rect x="56" y="161" width="266" height="5" fill="#E6DCC6" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="51" y="161" width="5" height="186" fill="#E6DCC6" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="322" y="161" width="5" height="186" fill="#E6DCC6" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="51" y="342" width="247 - 56" height="5" fill="#E6DCC6" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="276" y="342" width="51" height="5" fill="#E6DCC6" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M242,342 A36,36 0 0 1 278,306" fill="none" stroke="#DCCBB0" stroke-width="0.8" stroke-dasharray="2 2"/>
<text x="259" y="360" font-size="4.6" fill="#A2503B" text-anchor="middle">门：光从这儿进来</text>
<text x="296" y="228" font-size="4.5" fill="#A2503B" text-anchor="end">光只到这儿</text>
<text x="120" y="308" font-size="4.8" fill="#2F2A24">西南角：最尊</text>
<text x="120" y="322" font-size="4.6" fill="#6E6459">也最暗——光进不去</text>
<text x="190" y="380" font-size="4.6" fill="#A2503B" text-anchor="middle">万物归到这儿：不是归到光亮的台上被审判，</text>
<text x="190" y="394" font-size="4.6" fill="#A2503B" text-anchor="middle">是归到一个连光都进不去的角里，被收着。</text>
<text x="24" y="416" font-size="4.8" fill="#4A5C55">二、帛书作「注」：水往一处流</text>
<line x1="96" y1="436" x2="178" y2="472" stroke="#4A5C55" stroke-width="1" marker-end="url(#arr2)"/>
<line x1="190" y1="420" x2="190" y2="478" stroke="#4A5C55" stroke-width="1" marker-end="url(#arr2)"/>
<line x1="284" y1="436" x2="202" y2="472" stroke="#4A5C55" stroke-width="1" marker-end="url(#arr2)"/>
<ellipse cx="190" cy="488" rx="30" ry="9" fill="#EFE6D4" stroke="#4A5C55" stroke-width="1"/>
<text x="190" y="490" font-size="4.2" fill="#4A5C55" text-anchor="middle">一处</text>
<text x="190" y="514" font-size="4.6" fill="#6E6459" text-anchor="middle">注：水往一处流——奥讲屋，注讲水，讲的是同一件事</text>
<text x="24" y="532" font-size="4.8" fill="#2F2A24">「注」是水往一处流，「奥」是屋里的那个角：一个讲水，一个讲屋，</text>
<text x="24" y="548" font-size="4.9" fill="#2F2A24">讲的却是同一件事——有个地方，东西都往那儿去。</text>
<text x="24" y="566" font-size="5.0" fill="#4A5C55">尊，是因为没人敢坐；暗，是因为光进不去——暗，才是它能容的原因。</text>
<line x1="24" y1="584" x2="338" y2="584" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="592" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="608" font-size="5.8" fill="#2F2A24" text-anchor="middle">奥是最尊又最暗的那个角；</text>
<text x="190" y="620" font-size="5.2" fill="#4A5C55" text-anchor="middle">不是归到光亮的台上，是归到一个角落被收着。</text>
<line x1="20" y1="646" x2="360" y2="646" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="660" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="676" font-size="8.4" fill="#2F2A24">奥是那个不见光的西南角；坐进，是坐着往上走。</text>
<text x="20" y="692" font-size="8.4" fill="#2F2A24">奥是最尊又最暗的那个角；尊，是没人敢坐；暗，是光进不去。</text>
</svg>