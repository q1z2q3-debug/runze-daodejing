<svg viewBox="0 0 1000 886" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="涌现判据：八级台阶与生命门槛" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif"><rect x="0" y="0" width="1000" height="886" fill="#F8F3E6"/><text x="24" y="30" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">义 理 图 · 涌 现 判 据</text><text x="24" y="66" font-size="18" fill="#2F2A24">涌现不在某一点开始，它每一级都在发生</text><text x="24" y="92" font-size="10.4" fill="#6E6459">而「生命」这一属性，起点在细胞 —— 蛋白质是材料，不是命。</text><rect x="110" y="628" width="100" height="72" fill="#8A7C69" opacity="0.07"/><rect x="110" y="628" width="100" height="72" fill="none" stroke="#8A7C69" stroke-width="0.9"/><path d="M110,628 H210" stroke="#8A7C69" stroke-width="2"/><text x="119" y="651" font-size="9.6" fill="#2F2A24" font-weight="600">原子</text><text x="119" y="670" font-size="7.9" fill="#8A7C69">化合价</text><text x="119" y="685" font-size="7.9" fill="#8A7C69">化学键</text><rect x="210" y="572" width="100" height="72" fill="#8A7C69" opacity="0.07"/><rect x="210" y="572" width="100" height="72" fill="none" stroke="#8A7C69" stroke-width="0.9"/><path d="M210,572 H310" stroke="#8A7C69" stroke-width="2"/><text x="219" y="595" font-size="9.6" fill="#2F2A24" font-weight="600">小分子</text><text x="219" y="614" font-size="7.9" fill="#8A7C69">反应性</text><text x="219" y="629" font-size="7.9" fill="#8A7C69">分子的形状</text><rect x="310" y="516" width="100" height="72" fill="#8A7C69" opacity="0.07"/><rect x="310" y="516" width="100" height="72" fill="none" stroke="#8A7C69" stroke-width="0.9"/><path d="M310,516 H410" stroke="#8A7C69" stroke-width="2"/><text x="319" y="539" font-size="9.6" fill="#2F2A24" font-weight="600">有机大分子</text><text x="319" y="558" font-size="7.9" fill="#8A7C69">长链稳定</text><text x="319" y="573" font-size="7.9" fill="#8A7C69">自组织</text><rect x="410" y="460" width="100" height="72" fill="#4A5C55" opacity="0.07"/><rect x="410" y="460" width="100" height="72" fill="none" stroke="#4A5C55" stroke-width="0.9"/><path d="M410,460 H510" stroke="#4A5C55" stroke-width="2"/><text x="419" y="483" font-size="9.6" fill="#2F2A24" font-weight="600">蛋白质</text><text x="419" y="502" font-size="7.9" fill="#4A5C55">催化（酶）</text><text x="419" y="517" font-size="7.9" fill="#4A5C55">构象 · 识别</text><rect x="510" y="404" width="100" height="72" fill="#A2503B" opacity="0.07"/><rect x="510" y="404" width="100" height="72" fill="none" stroke="#A2503B" stroke-width="0.9"/><path d="M510,404 H610" stroke="#A2503B" stroke-width="2"/><text x="519" y="427" font-size="9.6" fill="#2F2A24" font-weight="600">细胞</text><text x="519" y="446" font-size="7.9" fill="#A2503B">代谢 · 自我维持</text><text x="519" y="461" font-size="7.9" fill="#A2503B">复制 · 边界</text><rect x="610" y="348" width="100" height="72" fill="#A2503B" opacity="0.07"/><rect x="610" y="348" width="100" height="72" fill="none" stroke="#A2503B" stroke-width="0.9"/><path d="M610,348 H710" stroke="#A2503B" stroke-width="2"/><text x="619" y="371" font-size="9.6" fill="#2F2A24" font-weight="600">组织</text><text x="619" y="390" font-size="7.9" fill="#A2503B">分工</text><text x="619" y="405" font-size="7.9" fill="#A2503B">协同</text><rect x="710" y="292" width="100" height="72" fill="#A2503B" opacity="0.07"/><rect x="710" y="292" width="100" height="72" fill="none" stroke="#A2503B" stroke-width="0.9"/><path d="M710,292 H810" stroke="#A2503B" stroke-width="2"/><text x="719" y="315" font-size="9.6" fill="#2F2A24" font-weight="600">器官</text><text x="719" y="334" font-size="7.9" fill="#A2503B">功能</text><text x="719" y="349" font-size="7.9" fill="#A2503B">系统里的角色</text><rect x="810" y="236" width="100" height="72" fill="#A2503B" opacity="0.07"/><rect x="810" y="236" width="100" height="72" fill="none" stroke="#A2503B" stroke-width="0.9"/><path d="M810,236 H910" stroke="#A2503B" stroke-width="2"/><text x="819" y="259" font-size="9.6" fill="#2F2A24" font-weight="600">人体</text><text x="819" y="278" font-size="7.9" fill="#A2503B">意识</text><text x="819" y="293" font-size="7.9" fill="#A2503B">自省</text><line x1="510" y1="208" x2="510" y2="712" stroke="#B5462F" stroke-width="1" stroke-dasharray="6 5"/><text x="498" y="200" font-size="9.2" fill="#8A7C69" text-anchor="end">此前都是「物」</text><text x="522" y="200" font-size="9.6" fill="#B5462F" letter-spacing="0.6">生命门槛 · 越此线才叫「活」</text><text x="110" y="748" font-size="8.4" fill="#2F2A24" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="2">判据</text><text x="150" y="748" font-size="9.8" fill="#2F2A24">涌现 = 下层单独不具备、且无法由下层线性加总得出的性质。</text><text x="110" y="774" font-size="8.4" fill="#6E6459" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="2">检验</text><text x="150" y="774" font-size="9.8" fill="#6E6459">把上层拆回下层，新性质随即消失；而在拆开的下层里，找不到它的影子。</text><text x="110" y="800" font-size="8.4" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="2">两向</text><text x="150" y="800" font-size="9.8" fill="#A2503B">蛋白质离体即失活、不复制；细胞拆散即不代谢 —— 两头都拆得住，故「生命」属于细胞，不属于蛋白质。</text><line x1="90" y1="822" x2="910" y2="822" stroke="#E6D8C2" stroke-width="0.8"/><text x="90" y="838" font-size="8.4" fill="#A89577" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="2">本 章 金 句</text><text x="500.0" y="856" font-size="10" fill="#2F2A24" text-anchor="middle">常有欲以观其徼。</text><text x="500.0" y="874" font-size="10" fill="#2F2A24" text-anchor="middle">观徼是划界：界线在细胞之前，不在蛋白质之后。</text></svg>