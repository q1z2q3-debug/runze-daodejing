<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 二 章 · 其 二</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">川 谷 与 江 海</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">江海之为大，在于它不要求支流先改成一样的河道。</text>
<text x="20" y="102" font-size="8.4" fill="#4A5C55">川谷：各有各的走向、宽窄、急缓</text>
