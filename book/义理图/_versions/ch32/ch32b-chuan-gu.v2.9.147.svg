<text x="250" y="228" font-size="10.0" fill="#4A5C55" text-anchor="middle" letter-spacing="2">江海</text>
<text x="20" y="260" font-size="7.6" fill="#6E6459">不挑水：千条支流不改河道，也能进来</text>
<rect x="20" y="276" width="162" height="56" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="32" y="294" font-size="8.2" fill="#4A5C55">道：同归，不失自性</text>
<text x="32" y="310" font-size="7.4" fill="#6E6459">差异不必先被抹平</text>
<text x="32" y="322" font-size="7.4" fill="#6E6459">来是「宾」，不是「臣」</text>
<rect x="198" y="276" width="162" height="56" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="210" y="294" font-size="8.2" fill="#A2503B">合：先改成一样的河道</text>
<text x="210" y="310" font-size="7.4" fill="#6E6459">削平、捏成一条</text>
<text x="210" y="322" font-size="7.4" fill="#6E6459">那是人之合</text>
<rect x="20" y="350" width="340" height="42" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="369" font-size="9.4" fill="#2F2A24" text-anchor="middle" letter-spacing="0.6">譬道之在天下，犹川谷之于江海。</text>
<text x="190" y="383" font-size="7.8" fill="#6E6459" text-anchor="middle">江海之为大，在于它不挑水。</text>
<line x1="20" y1="400" x2="360" y2="400" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="414" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="430" font-size="8.4" fill="#2F2A24">譬道之在天下，犹川谷之于江海。</text>
<text x="20" y="446" font-size="8.4" fill="#2F2A24">水往低处走不是被迫的，是它本来就往那儿去。</text>
</svg>