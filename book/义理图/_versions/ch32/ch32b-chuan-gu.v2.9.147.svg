<text x="208" y="196" font-size="7.2" fill="#6E6459" text-anchor="middle">宽</text>
<text x="316" y="196" font-size="7.2" fill="#6E6459" text-anchor="middle">窄</text>
<path d="M24,212 Q190,196 356,212 L356,234 Q190,250 24,234 z" fill="#DCE5DF" stroke="#B9C7BE" stroke-width="0.9"/>
<path d="M66,222 q22,-5 44,0 q22,5 44,0" fill="none" stroke="#9FB0A6" stroke-width="0.8"/>
