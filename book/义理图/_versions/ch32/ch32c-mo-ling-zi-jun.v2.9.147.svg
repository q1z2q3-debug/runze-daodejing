<text x="90" y="308" font-size="4.0" fill="#8A7C69" text-anchor="middle">坡上旱</text>
<text x="190" y="308" font-size="4.0" fill="#8A7C69" text-anchor="middle">平地足</text>
<text x="290" y="308" font-size="4.0" fill="#8A7C69" text-anchor="middle">洼地淹</text>
<text x="190" y="328" font-size="4.2" fill="#A2503B" text-anchor="middle">分得一样，未必长成一样</text>
<text x="24" y="348" font-size="5.1" fill="#4A5C55">二、无令：夜露落下来</text>
<rect x="26" y="360" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="300" cy="382" r="13" fill="#F0E7D2" stroke="none"/>
<circle cx="306" cy="378" r="11" fill="#FBF6EC" stroke="none"/>
<text x="108" y="380" font-size="4.2" fill="#8A7C69">夜里，天上没有发号的人</text>
