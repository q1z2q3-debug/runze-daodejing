<path d="M279,194 L301,194 L301,210 L279,210 Z" fill="#DDE9E1" stroke="none"/>
<line x1="278" y1="194" x2="302" y2="194" stroke="#E6D8C2" stroke-width="0.6"/>
<text x="190" y="174" font-size="4.2" fill="#8A7C69" text-anchor="middle">同一把斗，同一道水位</text>
<text x="60" y="224" font-size="5.0" fill="#A2503B">令</text>
<text x="70" y="224" font-size="4.1" fill="#8A7C69">：发号，按人头分</text>
<path d="M48,282 L132,258 L132,276 L48,288 Z" fill="#E6DCC6" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="102" y1="264" x2="102" y2="240" stroke="#A89A80" stroke-width="1.1"/>
