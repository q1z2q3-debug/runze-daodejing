<text x="190" y="482" font-size="4.2" fill="#4A5C55" text-anchor="middle">莫之令而自均：各得其分</text>
<text x="190" y="498" font-size="4.0" fill="#8A7C69" text-anchor="middle">天不分配，只落下；各处自己够</text>
<rect x="20" y="520" width="340" height="42" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="539" font-size="4.8" fill="#2F2A24" text-anchor="middle">天地相合，以降甘露，民莫之令而自均。</text>
<text x="190" y="553" font-size="4.4" fill="#6E6459" text-anchor="middle">人做的均是拉平，天做的均是刚好；兵压边界，露敬边界。</text>
<line x1="20" y1="570" x2="360" y2="570" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="584" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="600" font-size="8.4" fill="#2F2A24">人做的均是拉平，天做的均是刚好。</text>
<text x="20" y="616" font-size="8.4" fill="#2F2A24">不调度，而各处都够——那是自均。</text>
</svg>