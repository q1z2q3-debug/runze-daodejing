<circle cx="274" cy="242" r="1.6" fill="#A2503B"/>
<path d="M274,238 q6,-9 0,-17" fill="none" stroke="#B9A98F" stroke-width="0.6"/>
<text x="190" y="190" font-size="4.6" fill="#4A5C55" text-anchor="middle">陈：有位次</text>
<line x1="190" y1="194" x2="190" y2="234" stroke="#E6D8C2" stroke-width="0.6" stroke-dasharray="3 2"/>
<text x="250" y="228" font-size="4.4" fill="#6E6459">被恭敬摆着的还是那把草</text>
<text x="190" y="306" font-size="4.5" fill="#4A5C55" text-anchor="middle">天地给的只是位次，没给主人</text>
<text x="24" y="336" font-size="5.2" fill="#A2503B">二、复归：祭毕回草堆，还是那把草</text>
