<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 702" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="刍狗祭时陈设、祭毕回草堆：天地没有那本账，用完就归位" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="702" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 章 · 刍 狗</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只刍狗</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">天地不仁，以万物为刍狗。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.0" fill="#2F2A24" text-anchor="middle">刍狗是束草扎成的狗：祭时郑重陈设，事毕回草堆，任人践踏或当柴烧。</text>
<text x="190" y="128" font-size="5.0" fill="#6E6459" text-anchor="middle">天地不记账：不因你敬它而应，也不因你不敬而罚——它只是让万物各复其位。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、陈：祭时它有位次，被郑重摆着</text>
<rect x="26" y="164" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
