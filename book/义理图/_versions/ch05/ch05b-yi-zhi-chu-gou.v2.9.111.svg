<text x="208" y="424" font-size="4.4" fill="#A2503B">践其首脊</text>
<line x1="262" y1="438" x2="282" y2="458" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="267" y1="439" x2="287" y2="459" stroke="#2F2A24" stroke-width="0.7"/>
