<line x1="106" y1="268" x2="106" y2="242" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="106" cy="242" r="1.6" fill="#A2503B"/>
<path d="M106,238 q6,-9 0,-17" fill="none" stroke="#B9A98F" stroke-width="0.6"/>
