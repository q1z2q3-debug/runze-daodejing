<line x1="277" y1="441" x2="297" y2="461" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="282" y1="442" x2="302" y2="462" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="270" y1="442" x2="290" y2="456" stroke="#A2503B" stroke-width="1.0"/>
<line x1="268" y1="444" x2="276" y2="438" stroke="#A2503B" stroke-width="0.6"/>
<text x="300" y="426" font-size="4.4" fill="#A2503B" text-anchor="end">取而爨之</text>
<text x="190" y="488" font-size="4.5" fill="#4A5C55" text-anchor="middle">位次用完了，它就回草堆——不是被弃，是用完了</text>
<text x="24" y="516" font-size="5.4" fill="#2F2A24">「不仁」不是狠心，是天地根本没有「我敬了你，你就该应我」那一本账。</text>
<text x="24" y="532" font-size="5.4" fill="#2F2A24">祭祀有定时，祷无定时；人一祷就记账，天地却只按自己的节律转。</text>
<text x="24" y="550" font-size="5.2" fill="#4A5C55">刍狗在祭时被敬、祭毕被践，不是天在赏罚它，是它该回草堆了。</text>
<line x1="24" y1="568" x2="338" y2="568" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="576" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="592" font-size="6.0" fill="#2F2A24" text-anchor="middle">天地不仁，</text>
<text x="190" y="604" font-size="6.0" fill="#4A5C55" text-anchor="middle">不是不慈，是不替你作主。</text>
<line x1="20" y1="630" x2="360" y2="630" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="644" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="660" font-size="8.4" fill="#2F2A24">天地不仁，以万物为刍狗。</text>
<text x="20" y="676" font-size="8.4" fill="#2F2A24">刍者，束草也；刍狗有位而无主——用毕回草堆，不是被弃，是位次用完了。</text>
</svg>