<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="用刀压人，人会反弹；用木压火，火会自己熄" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="592" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 七 章 · 朴</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">朴 · 静 · 自正</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">那块木头没上漆、没雕花、没有名字。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="118" font-size="7.8" fill="#2F2A24" text-anchor="middle">化而欲作，吾将镇之以无名之朴。</text>
<text x="190" y="130" font-size="7.4" fill="#6E6459" text-anchor="middle">不欲以静，天下将自正。</text>
<rect x="20" y="144" width="340" height="118" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="32" y="162" font-size="8.2" fill="#2F2A24">镇：一块原木，不加一文</text>
<rect x="44" y="206" width="70" height="16" rx="2" fill="#E9DFCC" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="52" y1="212" x2="108" y2="210" stroke="#8A7C69" stroke-width="0.5"/>
<line x1="52" y1="218" x2="106" y2="217" stroke="#8A7C69" stroke-width="0.5"/>
<path d="M46,242 q-6,-8.0 0,-16 q6,8.0 0,16 z" fill="#EFD9CE" stroke="#A2503B" stroke-width="0.9"/>
<path d="M113,242 q-6,-6.5 0,-13 q6,6.5 0,13 z" fill="#EFD9CE" stroke="#A2503B" stroke-width="0.9"/>
<circle cx="58" cy="240" r="1.2" fill="#A2503B" opacity="0.7"/>
<circle cx="66" cy="240" r="1.2" fill="#A2503B" opacity="0.7"/>
<circle cx="98" cy="240" r="1.2" fill="#A2503B" opacity="0.7"/>
<line x1="38" y1="242" x2="74" y2="238" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="52" y1="238" x2="116" y2="242" stroke="#2F2A24" stroke-width="0.8"/>
<text x="40" y="202" font-size="6.4" fill="#6E6459">没上漆、没雕花、没名字</text>
<text x="126" y="236" font-size="6.8" fill="#4A5C55">火不靠扑，靠断柴</text>
<circle cx="214" cy="222" r="4.2" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="214" y1="226" x2="214" y2="240" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="208" y1="206" x2="222" y2="202" stroke="#A2503B" stroke-width="1.1"/>
<line x1="222" y1="202" x2="232" y2="200" stroke="#A2503B" stroke-width="0.9"/>
<line x1="214" y1="206" x2="214" y2="196" stroke="#A2503B" stroke-width="0.8" marker-end="url(#arrS)"/>
<text x="232" y="218" font-size="6.4" fill="#A2503B">刀压：越压越弹</text>
<text x="32" y="254" font-size="6.9" fill="#6E6459">「镇」不是压服，是压住那股要起的劲。</text>
<rect x="20" y="274" width="340" height="110" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="32" y="292" font-size="8.2" fill="#4A5C55">静：心不往外扯</text>
<text x="200" y="292" font-size="8.2" fill="#A2503B">驰：人坐着，心在跑</text>
<line x1="40" y1="346" x2="150" y2="346" stroke="#DCCBB0" stroke-width="0.9"/>
<circle cx="86" cy="320" r="4" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="86" y1="324" x2="86" y2="340" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M86,340 l-8,6 M86,340 l8,6" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M80,346 l-3,3 M92,346 l3,3" stroke="#2F2A24" stroke-width="0.7"/>
<text x="86" y="376" font-size="6.6" fill="#4A5C55" text-anchor="middle">忙，也静</text>
<circle cx="240" cy="340" r="4" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="240" y1="344" x2="240" y2="358" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M236,358 l-8,8 M236,358 l14,8" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M244,332 q26,-20 52,-6" fill="none" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="280" y1="320" x2="300" y2="328" stroke="#A2503B" stroke-width="0.7" marker-end="url(#arrS)"/>
<text x="240" y="376" font-size="6.6" fill="#A2503B" text-anchor="middle">坐，也躁</text>
<text x="200" y="308" font-size="6.6" fill="#6E6459">静的反面不是动，是驰。</text>
<rect x="20" y="396" width="340" height="84" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="32" y="414" font-size="8.2" fill="#2F2A24">自正：各归其位</text>
<line x1="38" y1="460" x2="150" y2="460" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="86" y1="460" x2="86" y2="452" stroke="#2F2A24" stroke-width="0.7"/>
<ellipse cx="74" cy="452" rx="9" ry="5" fill="#E9DFCC" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M80,448 l3,-4" stroke="#2F2A24" stroke-width="0.7"/>
<text x="104" y="454" font-size="6.5" fill="#6E6459">止：脚走到该停的地方</text>
<text x="190" y="414" font-size="8.2" fill="#A2503B">定：要一个人去平</text>
<line x1="188" y1="460" x2="300" y2="460" stroke="#2F2A24" stroke-width="0.6"/>
<ellipse cx="228" cy="452" rx="9" ry="5" fill="#E9DFCC" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M214,442 q14,-8 28,0" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<text x="252" y="454" font-size="6.4" fill="#A2503B">有人按着，才叫定</text>
<text x="32" y="474" font-size="6.6" fill="#6E6459">「正」从止：不是被纠正，是自己走到该停的那一点。</text>
<rect x="20" y="492" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="509" font-size="7.8" fill="#2F2A24" text-anchor="middle">压住火的不是更多的柴，是把它从柴上挪开。</text>
<text x="190" y="524" font-size="7.6" fill="#6E6459" text-anchor="middle">木头什么都没加，所以压得住。</text>
<line x1="20" y1="540" x2="360" y2="540" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="554" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="570" font-size="8.4" fill="#2F2A24">压住火的不是更多的柴，是把它从柴上挪开。</text>
<text x="20" y="586" font-size="8.4" fill="#2F2A24">静的对立面不是「动」，是「驰」。</text>
</svg>