<line x1="268" y1="460" x2="278" y2="462" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="258" y1="434" x2="246" y2="446" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="258" y1="434" x2="270" y2="446" stroke="#2F2A24" stroke-width="0.9"/>
