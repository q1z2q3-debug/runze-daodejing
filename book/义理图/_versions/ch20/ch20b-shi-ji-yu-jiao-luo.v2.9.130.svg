<text x="126" y="490" font-size="3.9" fill="#8A7C69" text-anchor="middle">远处的席，与自己无关了</text>
<circle cx="258" cy="422" r="5.4" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
