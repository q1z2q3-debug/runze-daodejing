<text x="258" y="520" font-size="4.2" fill="#4A5C55" text-anchor="middle">泊兮其未兆：水面未起波，念还未动</text>
<text x="24" y="556" font-size="4.9" fill="#2F2A24">「熙熙」不是错，只是热闹有个尽头：散席之后，还是各自回家。</text>
<text x="24" y="572" font-size="4.9" fill="#2F2A24">「独泊」也不是清高：是知道自己在哪一处不必挤，就不挤了。</text>
<text x="24" y="590" font-size="4.9" fill="#4A5C55">未兆：念头还没有起，就先把脚收住。</text>
<line x1="24" y1="608" x2="338" y2="608" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="616" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="632" font-size="6.0" fill="#2F2A24" text-anchor="middle">众人熙熙，如享太牢；</text>
<text x="190" y="644" font-size="6.0" fill="#4A5C55" text-anchor="middle">我独泊兮其未兆。</text>
<line x1="20" y1="670" x2="360" y2="670" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="684" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="700" font-size="8.4" fill="#2F2A24">众人熙熙，如享太牢；我独泊兮其未兆。</text>
<text x="20" y="716" font-size="8.4" fill="#2F2A24">不必挤的那一处，站定了，人就轻了。</text>
</svg>