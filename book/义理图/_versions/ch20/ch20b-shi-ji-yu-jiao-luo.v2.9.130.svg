<text x="190" y="326" font-size="4.3" fill="#A2503B" text-anchor="middle">如享太牢，如春登台：人人都在席上</text>
<text x="24" y="354" font-size="5.2" fill="#4A5C55">二、独泊：同席之外，一个人停在没起念处</text>
<rect x="26" y="366" width="328" height="172" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
