<text x="190" y="268" font-size="4.2" fill="#A2503B" text-anchor="middle">袋满，肩沉：没有人是空手来的</text>
<text x="24" y="306" font-size="5.2" fill="#4A5C55">二、独若遗：一只空袋，风穿得过去</text>
<rect x="26" y="318" width="328" height="124" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="160" cy="348" r="6" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="160" y1="354" x2="160" y2="382" stroke="#2F2A24" stroke-width="1.2"/>
