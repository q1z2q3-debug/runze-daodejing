<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="众人皆有余，而我独若遗" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="650" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 章 · 有 余 与 若 遗</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只空袋</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">众人皆有余，而我独若遗。我愚人之心也哉！</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「有余」是袋里装满，「若遗」是袋空着。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459">不是没有，是不必什么都带着。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、皆有余：人人挎一只鼓囊，走一步都带着全部家当</text>
<rect x="26" y="164" width="328" height="120" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
