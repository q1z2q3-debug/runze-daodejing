<line x1="160" y1="382" x2="167" y2="396" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="160" y1="362" x2="146" y2="374" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M182,352 q-8,26 2,44 q10,4 22,-2 q10,-20 2,-42 z" fill="none" stroke="#2F2A24" stroke-width="0.9" stroke-dasharray="4 2.5"/>
<path d="M184,354 q10,-4 20,0" fill="none" stroke="#DCCBB0" stroke-width="0.7"/>
<line x1="206" y1="368" x2="246" y2="368" stroke="#4A5C55" stroke-width="0.6"/>
<line x1="206" y1="368" x2="246" y2="368" stroke="none"/>
<line x1="206" y1="376" x2="246" y2="376" stroke="#4A5C55" stroke-width="0.6"/>
<line x1="206" y1="376" x2="246" y2="376" stroke="none"/>
<line x1="206" y1="384" x2="246" y2="384" stroke="#4A5C55" stroke-width="0.6"/>
<line x1="206" y1="384" x2="246" y2="384" stroke="none"/>
<line x1="212" y1="392" x2="252" y2="392" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<text x="254" y="368" font-size="4.0" fill="#4A5C55">风穿过去，什么都不留在里面</text>
<text x="196" y="418" font-size="4.1" fill="#2F2A24" text-anchor="middle">空袋</text>
<line x1="60" y1="398" x2="320" y2="398" stroke="#DCCBB0" stroke-width="0.8"/>
<text x="150" y="418" font-size="4.2" fill="#4A5C55" text-anchor="middle">袋空，肩轻</text>
<text x="160" y="434" font-size="4.1" fill="#6E6459" text-anchor="middle">留下的地方，装得下别的事；我愚人之心也哉，沌沌兮</text>
<text x="24" y="464" font-size="4.9" fill="#2F2A24">「有余」的人，走着走着就被自己的家当拖住；「若遗」的人，反倒走得远。</text>
<text x="24" y="480" font-size="4.9" fill="#2F2A24">沌沌不是糊涂，是不把每件事都先算成得失。</text>
<text x="24" y="498" font-size="4.9" fill="#4A5C55">空着的那只袋，看上去是缺，其实是余地。</text>
<line x1="24" y1="516" x2="338" y2="516" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="524" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="540" font-size="6.0" fill="#2F2A24" text-anchor="middle">众人皆有余，而我独若遗；</text>
<text x="190" y="552" font-size="6.0" fill="#4A5C55" text-anchor="middle">我愚人之心也哉！</text>
<line x1="20" y1="578" x2="360" y2="578" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="592" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="608" font-size="8.4" fill="#2F2A24">众人皆有余，而我独若遗。</text>
<text x="20" y="624" font-size="8.4" fill="#2F2A24">空着的那只袋，看上去是缺，其实是余地。</text>
</svg>