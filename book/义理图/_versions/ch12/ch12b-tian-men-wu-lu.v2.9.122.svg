<text x="120" y="444" font-size="4.0" fill="#4A5C55" text-anchor="middle">接住</text>
<line x1="132" y1="430" x2="206" y2="430" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="134" y1="430" x2="134" y2="446" stroke="#DCCBB0" stroke-width="0.6"/>
