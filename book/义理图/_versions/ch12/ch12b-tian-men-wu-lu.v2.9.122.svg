<text x="305" y="217.4" font-size="3.6" fill="#2F2A24" text-anchor="middle">声</text>
<rect x="262" y="223" width="26" height="13" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.6"/>
<text x="275" y="232.4" font-size="3.6" fill="#2F2A24" text-anchor="middle">味</text>
<rect x="292" y="223" width="26" height="13" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.6"/>
<text x="305" y="232.4" font-size="3.6" fill="#2F2A24" text-anchor="middle">驰</text>
<rect x="274" y="268" width="26" height="13" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.6"/>
<text x="287" y="277.4" font-size="3.6" fill="#2F2A24" text-anchor="middle">货</text>
<text x="288" y="298" font-size="4.4" fill="#2F2A24" text-anchor="middle">身</text>
<text x="292" y="324" font-size="4.2" fill="#A2503B" text-anchor="middle">塞满了：里头没有一处是自己的</text>
<text x="292" y="336" font-size="4.2" fill="#6E6459" text-anchor="middle">以物役己：他被物占着</text>
<text x="24" y="360" font-size="5.2" fill="#4A5C55">二、治于身：门照开，东西先在门口过一手</text>
<rect x="26" y="372" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="74" y1="400" x2="74" y2="522" stroke="#2F2A24" stroke-width="1.6"/>
