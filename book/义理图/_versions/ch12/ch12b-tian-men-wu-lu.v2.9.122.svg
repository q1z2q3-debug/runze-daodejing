<text x="163" y="463.4" font-size="3.6" fill="#2F2A24" text-anchor="middle">声</text>
<rect x="262" y="412" width="56" height="80" rx="4" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.2"/>
<circle cx="290" cy="454" r="9" fill="none" stroke="#4A5C55" stroke-width="0.9"/>
<text x="290" y="457" font-size="3.8" fill="#4A5C55" text-anchor="middle">心</text>
<text x="290" y="506" font-size="4.4" fill="#2F2A24" text-anchor="middle">身</text>
<text x="292" y="520" font-size="4.2" fill="#4A5C55" text-anchor="middle">身上是空的，心口那一处是静的</text>
<text x="292" y="534" font-size="4.2" fill="#6E6459" text-anchor="middle">以物养己：拿它养身，不让它役心</text>
<text x="24" y="568" font-size="5.1" fill="#2F2A24">「受于身」，是外物到来、感官被动接住，这一步不由人做主；「治于身」是接住之后怎么办。</text>
<text x="24" y="584" font-size="5.1" fill="#2F2A24">门照开，权收回：色、声、味是天地本来就有的景致，可以欣赏，不可以占有、绑架。</text>
<text x="24" y="602" font-size="5.0" fill="#4A5C55">一旦把「体验」变成「我要留住、独享」，就从观物变成了执物——明明还在看，其实已经看不见。</text>
<line x1="24" y1="620" x2="338" y2="620" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="628" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="644" font-size="6.0" fill="#2F2A24" text-anchor="middle">色不盲人，逐色者自盲；</text>
<text x="190" y="656" font-size="6.0" fill="#4A5C55" text-anchor="middle">门照开，权收回。</text>
<line x1="20" y1="682" x2="360" y2="682" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="696" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="712" font-size="8.4" fill="#2F2A24">五色令人目盲；五音令人耳聋；五味令人口爽。</text>
<text x="20" y="728" font-size="8.4" fill="#2F2A24">门照开，权收回：五样都进来，人就成了货架。</text>
</svg>