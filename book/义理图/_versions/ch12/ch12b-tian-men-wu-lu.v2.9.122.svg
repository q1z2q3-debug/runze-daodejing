<text x="45" y="276.6" font-size="3.9" fill="#2F2A24" text-anchor="middle">驰</text>
<rect x="32" y="286" width="26" height="13" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.7"/>
<text x="45" y="295.6" font-size="3.9" fill="#2F2A24" text-anchor="middle">货</text>
