<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="门不是要封死，是接法要自己管" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="472" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 二 章 · 受 体</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">门开五处</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">受于身，不如治于身：物自己来，怎么接是我。</text>
<text x="20" y="124" font-size="9.5" fill="#A2503B">五色</text>
<line x1="104" y1="119" x2="128" y2="119" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="134" y="124" font-size="9.5" fill="#2F2A24">目盲</text>
<text x="184" y="124" font-size="8.2" fill="#6E6459">看得越花，反而越看不清</text>
<text x="20" y="156" font-size="9.5" fill="#A2503B">五音</text>
<line x1="104" y1="151" x2="128" y2="151" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="134" y="156" font-size="9.5" fill="#2F2A24">耳聋</text>
<text x="184" y="156" font-size="8.2" fill="#6E6459">声音越满，反而听不进</text>
<text x="20" y="188" font-size="9.5" fill="#A2503B">五味</text>
<line x1="104" y1="183" x2="128" y2="183" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="134" y="188" font-size="9.5" fill="#2F2A24">口爽</text>
<text x="184" y="188" font-size="8.2" fill="#6E6459">味道越重，口中越失味</text>
<text x="20" y="220" font-size="9.5" fill="#A2503B">驰骋畋猎</text>
<line x1="104" y1="215" x2="128" y2="215" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="134" y="220" font-size="9.5" fill="#2F2A24">心发狂</text>
<text x="184" y="220" font-size="8.2" fill="#6E6459">追得越欢，心越收不住</text>
<text x="20" y="252" font-size="9.5" fill="#A2503B">难得之货</text>
<line x1="104" y1="247" x2="128" y2="247" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="134" y="252" font-size="9.5" fill="#2F2A24">行妨</text>
<text x="184" y="252" font-size="8.2" fill="#6E6459">稀罕的东西，先绊住脚</text>
<text x="20" y="272" font-size="8.6" fill="#8A7C69">五句不是五条禁令：说的是接收那一头先垮了。</text>
<rect x="20" y="288" width="160" height="46" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="100" y="308" font-size="9.5" fill="#4A5C55" text-anchor="middle">为腹：以物养己</text>
<text x="100" y="324" font-size="8.2" fill="#6E6459" text-anchor="middle">重心在里头，物来养它</text>
<rect x="200" y="288" width="160" height="46" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="280" y="308" font-size="9.5" fill="#A2503B" text-anchor="middle">为目：以物役己</text>
<text x="280" y="324" font-size="8.2" fill="#6E6459" text-anchor="middle">重心在外头，物来役它</text>
<rect x="20" y="350" width="340" height="42" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="369" font-size="11.5" fill="#2F2A24" text-anchor="middle" letter-spacing="1">为腹不为目：去彼取此。</text>
<text x="190" y="385" font-size="8.4" fill="#6E6459" text-anchor="middle">不是不要眼耳，是不把人生的重心交给外面。</text>
<line x1="20" y1="402" x2="360" y2="402" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="416" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="432" font-size="8.4" fill="#2F2A24">五色不盲人，逐色者自盲；五音不聋人，溺音者自聋。</text>
<text x="20" y="448" font-size="8.4" fill="#2F2A24">去彼取此，去的是执，取的是定。</text>
</svg>