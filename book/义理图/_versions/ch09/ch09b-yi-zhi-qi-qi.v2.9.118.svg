</g>
<line x1="96" y1="431" x2="96" y2="474" stroke="#2F2A24" stroke-width="0.6"/>
<line x1="89" y1="474" x2="103" y2="474" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="112" y="456" width="22" height="15" rx="5" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="126" y1="460" x2="134" y2="464" stroke="#2F2A24" stroke-width="0.7"/>
<text x="96" y="510" font-size="4.6" fill="#2F2A24" text-anchor="middle">守：扶着它别倒</text>
<text x="96" y="524" font-size="4.2" fill="#6E6459" text-anchor="middle">水不加，手不松——日日用力</text>
<line x1="210" y1="400" x2="332" y2="400" stroke="#2F2A24" stroke-width="1.2"/>
<g transform="rotate(-30,258,476)">
<path d="M242,462 L274,462 L268,488 L248,488 z" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="242" y1="462" x2="274" y2="462" stroke="#2F2A24" stroke-width="1.4"/>
<circle cx="242" cy="474" r="2.2" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="274" cy="474" r="2.2" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
</g>
<line x1="258" y1="431" x2="258" y2="474" stroke="#2F2A24" stroke-width="0.6"/>
<line x1="251" y1="474" x2="265" y2="474" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="300" y="468" width="22" height="15" rx="5" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="296" y1="476" x2="322" y2="476" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="258" y="510" font-size="4.6" fill="#A2503B" text-anchor="middle">退：不扶，也不加满</text>
<text x="258" y="524" font-size="4.2" fill="#6E6459" text-anchor="middle">空着，就自己斜着——一次决心</text>
<text x="24" y="568" font-size="5.2" fill="#2F2A24">「持」是攥住不放，「盈」是填到饱和：不是不能积累，是非要抵达圆满。</text>
<text x="24" y="584" font-size="5.2" fill="#2F2A24">虚，才有继续容纳的余地；满，就是循环的终点，紧跟着是散。</text>
<text x="24" y="602" font-size="5.0" fill="#4A5C55">孔子在庙里说要守，老子看着同一只器说要走——守是扶着别倒，退是根本不去扶。</text>
<line x1="24" y1="620" x2="338" y2="620" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="628" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="644" font-size="6.0" fill="#2F2A24" text-anchor="middle">持满则溢，不如早止；</text>
<text x="190" y="656" font-size="6.0" fill="#4A5C55" text-anchor="middle">揣锐则折，难以长保。</text>
<line x1="20" y1="682" x2="360" y2="682" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="696" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="712" font-size="8.4" fill="#2F2A24">持而盈之，不如其已；揣而锐之，不可长保。</text>
<text x="20" y="728" font-size="8.4" fill="#2F2A24">持满则溢，不如早止。</text>
</svg>