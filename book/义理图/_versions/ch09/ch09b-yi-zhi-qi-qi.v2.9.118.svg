<text x="88" y="318" font-size="4.8" fill="#6E6459" text-anchor="middle">虚则欹</text>
<text x="190" y="318" font-size="4.8" fill="#2F2A24" text-anchor="middle">中则正</text>
<text x="292" y="318" font-size="4.8" fill="#A2503B" text-anchor="middle">满则覆</text>
<text x="88" y="334" font-size="4.1" fill="#6E6459" text-anchor="middle">空着，它自己斜</text>
<text x="190" y="334" font-size="4.1" fill="#6E6459" text-anchor="middle">半下，它自己正</text>
<text x="292" y="334" font-size="4.1" fill="#A2503B" text-anchor="middle">多一点，它就翻</text>
<text x="24" y="360" font-size="5.2" fill="#4A5C55">二、同一只器，两种做法</text>
<rect x="26" y="372" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="190" y1="384" x2="190" y2="536" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 3"/>
<line x1="48" y1="400" x2="170" y2="400" stroke="#2F2A24" stroke-width="1.2"/>
<g transform="rotate(0,96,476)">
