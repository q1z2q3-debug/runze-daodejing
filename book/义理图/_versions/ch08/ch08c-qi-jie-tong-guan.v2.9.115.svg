<line x1="300" y1="423" x2="300" y2="453" stroke="#2F2A24" stroke-width="1.0"/>
<text x="61.42857142857143" y="414" font-size="4.4" fill="#2F2A24" text-anchor="middle">地</text>
<line x1="53.42857142857143" y1="437" x2="71.42857142857143" y2="437" stroke="#4A5C55" stroke-width="0.8" marker-end="url(#arr2)"/>
<text x="104.28571428571428" y="414" font-size="4.4" fill="#2F2A24" text-anchor="middle">渊</text>
<line x1="96.28571428571428" y1="437" x2="114.28571428571428" y2="437" stroke="#4A5C55" stroke-width="0.8" marker-end="url(#arr2)"/>
<text x="147.14285714285714" y="414" font-size="4.4" fill="#2F2A24" text-anchor="middle">仁</text>
<line x1="139.14285714285714" y1="437" x2="157.14285714285714" y2="437" stroke="#4A5C55" stroke-width="0.8" marker-end="url(#arr2)"/>
