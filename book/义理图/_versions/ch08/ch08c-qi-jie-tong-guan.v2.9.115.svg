<text x="30" y="414" font-size="4.2" fill="#A2503B">身</text>
<text x="350" y="414" font-size="4.2" fill="#A2503B" text-anchor="end">事</text>
<rect x="30" y="498" width="320" height="26" fill="#E4EAE0" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="46" y1="454" x2="46" y2="498" stroke="#4A5C55" stroke-width="0.8" stroke-dasharray="2 2"/>
<line x1="334" y1="454" x2="334" y2="498" stroke="#4A5C55" stroke-width="0.8" stroke-dasharray="2 2"/>
<text x="190" y="516" font-size="4.5" fill="#2F2A24" text-anchor="middle">同一底层：本体不变，才随缘应化</text>
<text x="190" y="538" font-size="4.2" fill="#6E6459" text-anchor="middle">不跟容器较劲的不是没原则，是先把身、心、存心摆正，手段才接得上</text>
<text x="24" y="568" font-size="5.0" fill="#2F2A24">第一组居与心，一外一内；第二组与与言，存心与兑现；第三组政、事、动，落地的一环。</text>
<text x="24" y="584" font-size="5.0" fill="#2F2A24">三者互相咬合：事与能互为支撑，动与时互为约束，政与治互为表里。</text>
<text x="24" y="602" font-size="4.9" fill="#4A5C55">存心不正而先学手段，学到的只是技巧——七善不是七处各自使劲。</text>
<line x1="24" y1="620" x2="338" y2="620" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="628" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="644" font-size="6.0" fill="#2F2A24" text-anchor="middle">七善是一条链，不是七条戒律；</text>
<text x="190" y="656" font-size="6.0" fill="#4A5C55" text-anchor="middle">链底是同一个本体：不变，才随缘。</text>
<line x1="20" y1="682" x2="360" y2="682" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="696" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="712" font-size="8.4" fill="#2F2A24">居善地，心善渊，与善仁，言善信，政善治，事善能，动善时。</text>
<text x="20" y="728" font-size="8.4" fill="#2F2A24">七善是一条链，不是七条戒律。</text>
</svg>