<text x="277.5" y="306" font-size="3.9" fill="#6E6459" text-anchor="middle">一勾</text>
<rect x="308" y="230" width="30" height="46" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="310" y="246" width="26" height="28" fill="#E4EAE0" stroke="none"/>
<line x1="310" y1="246" x2="336" y2="246" stroke="#DCCBB0" stroke-width="0.6"/>
