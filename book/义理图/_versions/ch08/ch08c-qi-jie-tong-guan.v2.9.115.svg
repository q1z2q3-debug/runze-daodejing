<text x="318.57142857142856" y="414" font-size="4.4" fill="#2F2A24" text-anchor="middle">时</text>
<line x1="310.57142857142856" y1="437" x2="328.57142857142856" y2="437" stroke="#4A5C55" stroke-width="0.8" marker-end="url(#arr2)"/>
<line x1="28" y1="437" x2="38" y2="437" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arr2)"/>
