<text x="323.0" y="294" font-size="4.4" fill="#2F2A24" text-anchor="middle">时</text>
<text x="323.0" y="306" font-size="3.9" fill="#6E6459" text-anchor="middle">一勾</text>
<text x="190" y="330" font-size="4.3" fill="#A2503B" text-anchor="middle">分开摆：各自打分，水在每一节停着——七善成了七条互不相干的戒律</text>
<text x="24" y="360" font-size="5.2" fill="#4A5C55">二、接成一根：一节通了，下一节才满</text>
<rect x="26" y="372" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="40" y="426" width="300" height="24" fill="#E4EAE0" stroke="#2F2A24" stroke-width="1.2"/>
