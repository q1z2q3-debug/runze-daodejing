<text x="140" y="194" font-size="8.2" fill="#6E6459" text-anchor="middle">玉杯</text>
<text x="140" y="298" font-size="9" fill="#2F2A24" text-anchor="middle">净：人捧着</text>
<text x="140" y="314" font-size="8" fill="#6E6459" text-anchor="middle">摆在案上、献在堂前</text>
<polygon points="318,216 410,216 392,268 336,268" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.1"/>
