<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 838" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="水入玉杯、入瓦盆、入江海，还是同一水；支点也在水里，不在水面上" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="760" height="838" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 八 章 · 本 体</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">本体不变，支点在本体</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">净、秽、贵、贱，都是人贴上去的标签——属于相，不属于水。</text>
<text x="24" y="152" font-size="9.6" fill="#4A5C55">一、三处容器：位置不同，相不同，水还是水</text>
<rect x="24" y="164" width="712" height="206" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<polygon points="106,204 174,204 164,268 116,268" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.1"/>
<polygon points="110,230 170,230 162,266 118,266" fill="#E4EAE0" stroke="none"/>
