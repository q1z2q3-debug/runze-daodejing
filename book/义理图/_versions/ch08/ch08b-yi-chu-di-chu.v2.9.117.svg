<line x1="247" y1="545" x2="256" y2="561" stroke="#A2503B" stroke-width="1"/>
<line x1="195" y1="545" x2="195" y2="564" stroke="#A2503B" stroke-width="1.6"/>
<circle cx="195" cy="564" r="2" fill="#A2503B"/>
<text x="199" y="444" font-size="10" fill="#A2503B" text-anchor="middle" letter-spacing="1">支点长在相上</text>
<text x="199" y="466" font-size="8.4" fill="#6E6459" text-anchor="middle">要好位置、好评价、好名声</text>
<text x="199" y="614" font-size="9.4" fill="#A2503B" text-anchor="middle">相一动，人就翻</text>
<rect x="396" y="564" width="330" height="70" fill="#E4EAE0" stroke="none"/>
<path d="M396,564 Q417.0,558 438,564 Q459.0,570 480,564 Q501.0,558 522,564 Q543.0,570 564,564 Q585.0,558 606,564 Q627.0,570 648,564 Q669.0,558 690,564 Q708.0,570 726,564" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="561" y1="542" x2="561" y2="618" stroke="#2F2A24" stroke-width="2"/>
<rect x="501" y="618" width="120" height="16" fill="#DDE4D8" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="561" cy="510" r="5" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="561" y1="515" x2="561" y2="536" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="561" y1="536" x2="553" y2="552" stroke="#2F2A24" stroke-width="1"/>
<line x1="561" y1="536" x2="569" y2="552" stroke="#2F2A24" stroke-width="1"/>
<text x="561" y="444" font-size="10" fill="#4A5C55" text-anchor="middle" letter-spacing="1">支点在本体</text>
<text x="561" y="466" font-size="8.4" fill="#6E6459" text-anchor="middle">万相来了都能承、都能应</text>
<text x="466" y="596" font-size="9.4" fill="#4A5C55">相照旧变，人不翻</text>
<text x="561" y="630" font-size="7.6" fill="#2F2A24" text-anchor="middle">本体</text>
<rect x="24" y="670" width="712" height="60" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="380" y="696" font-size="10" fill="#2F2A24" text-anchor="middle">几于道落回人身：不是把外境摆平，是把支点挪进来。</text>
<text x="380" y="716" font-size="9" fill="#5F564C" text-anchor="middle">逆境照样来，只是不再添一层自造的苦——这才叫无尤。</text>
<line x1="20" y1="766" x2="360" y2="766" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="780" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="796" font-size="8.4" fill="#2F2A24">故几于道。</text>
<text x="20" y="812" font-size="8.4" fill="#2F2A24">能入一切境，不改其性——几于道，就在这里。</text>
</svg>