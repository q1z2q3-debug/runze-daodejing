<line x1="606" y1="220" x2="606" y2="231" stroke="#4A5C55" stroke-width="0.8" marker-end="url(#arrS)"/>
<path d="M642,198 C 647,212 645,222 642,230" fill="none" stroke="#4A5C55" stroke-width="0.9"/>
<line x1="642" y1="220" x2="642" y2="231" stroke="#4A5C55" stroke-width="0.8" marker-end="url(#arrS)"/>
<text x="588" y="194" font-size="8.2" fill="#6E6459" text-anchor="middle">江海</text>
<text x="588" y="298" font-size="9" fill="#2F2A24" text-anchor="middle">下：众流来归</text>
<text x="588" y="314" font-size="8" fill="#6E6459" text-anchor="middle">它没有去召谁</text>
<text x="380" y="348" font-size="9.2" fill="#A2503B" text-anchor="middle">三处三样相，一水一体：净也受，秽也受，众流也受——受完了，它没变。</text>
<text x="24" y="400" font-size="9.6" fill="#4A5C55">二、支点在哪儿：相上，还是本体</text>
<rect x="24" y="414" width="350" height="232" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<rect x="386" y="414" width="350" height="232" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<rect x="34" y="564" width="330" height="70" fill="#E4EAE0" stroke="none"/>
<path d="M34,564 Q55.0,558 76,564 Q97.0,570 118,564 Q139.0,558 160,564 Q181.0,570 202,564 Q223.0,558 244,564 Q265.0,570 286,564 Q307.0,558 328,564 Q346.0,570 364,564" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="80" y1="552" x2="310" y2="538" stroke="#2F2A24" stroke-width="2"/>
<circle cx="274" cy="516" r="5" fill="none" stroke="#A2503B" stroke-width="1.1"/>
<line x1="269" y1="521" x2="247" y2="545" stroke="#A2503B" stroke-width="1.1"/>
