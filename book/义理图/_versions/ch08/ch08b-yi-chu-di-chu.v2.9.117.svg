<circle cx="358" cy="256" r="1.2" fill="#8A7A5E"/>
<circle cx="380" cy="250" r="1.2" fill="#8A7A5E"/>
<circle cx="394" cy="260" r="1.2" fill="#8A7A5E"/>
<circle cx="350" cy="262" r="1.2" fill="#8A7A5E"/>
<text x="364" y="194" font-size="8.2" fill="#6E6459" text-anchor="middle">瓦盆</text>
<text x="364" y="298" font-size="9" fill="#2F2A24" text-anchor="middle">秽：人绕着走</text>
<text x="364" y="314" font-size="8" fill="#6E6459" text-anchor="middle">洗过东西、搁在墙根</text>
<rect x="516" y="234" width="144" height="44" fill="#E4EAE0" stroke="none"/>
<path d="M516,234 Q534.0,230 552,234 Q570.0,238 588,234 Q606.0,230 624,234 Q642.0,238 660,234" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
