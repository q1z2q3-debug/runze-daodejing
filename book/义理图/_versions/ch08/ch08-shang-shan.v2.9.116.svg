<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="上善若水：四个字拆开读，一条象落到底" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="760" height="600" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 八 章 · 取 象</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">上善若水</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">「若」是像，不是是；「善」是取向，不是标签。</text>
<rect x="50" y="140" width="160" height="96" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<text x="130" y="178" font-size="22" fill="#2F2A24" text-anchor="middle">上</text>
<text x="130" y="202" font-size="8.4" fill="#6E6459" text-anchor="middle">是方向，不是位置</text>
<text x="130" y="218" font-size="8.4" fill="#6E6459" text-anchor="middle">往道的方向靠</text>
<rect x="218" y="140" width="160" height="96" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<text x="298" y="178" font-size="22" fill="#2F2A24" text-anchor="middle">善</text>
<text x="298" y="202" font-size="8.4" fill="#6E6459" text-anchor="middle">是取向，不是标签</text>
<text x="298" y="218" font-size="8.4" fill="#6E6459" text-anchor="middle">选择顺道而行</text>
<rect x="386" y="140" width="160" height="96" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<text x="466" y="178" font-size="22" fill="#2F2A24" text-anchor="middle">若</text>
<text x="466" y="202" font-size="8.4" fill="#6E6459" text-anchor="middle">是像它，不是是它</text>
<text x="466" y="218" font-size="8.4" fill="#6E6459" text-anchor="middle">所以后文只说几于道</text>
<rect x="554" y="140" width="160" height="96" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<text x="634" y="178" font-size="22" fill="#4A5C55" text-anchor="middle">水</text>
<text x="634" y="202" font-size="8.4" fill="#6E6459" text-anchor="middle">一个看得见的参照</text>
<text x="634" y="218" font-size="8.4" fill="#6E6459" text-anchor="middle">天天在脚边</text>
<path d="M568,224 q16,8 28,1 q13,-8 22,2 q11,9 24,0" fill="none" stroke="#4A5C55" stroke-width="1.2"/>
<text x="58" y="272" font-size="12.5" fill="#A2503B" letter-spacing="1">利 万 物</text>
<text x="196" y="272" font-size="9.8" fill="#5F564C">托着它生，也接着它朽；全程在场，自性不改</text>
<line x1="52" y1="294" x2="708" y2="294" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="58" y="318" font-size="12.5" fill="#A2503B" letter-spacing="1">不  争</text>
<text x="196" y="318" font-size="9.8" fill="#5F564C">不夺位，不居功；为而不抓</text>
<line x1="52" y1="340" x2="708" y2="340" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="58" y="364" font-size="12.5" fill="#A2503B" letter-spacing="1">处  下</text>
<text x="196" y="364" font-size="9.8" fill="#5F564C">安在众人不要的地方；不靠位置定义自己</text>
<rect x="52" y="420" width="656" height="78" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="380" y="446" font-size="11" fill="#A2503B" text-anchor="middle" letter-spacing="1">几 于 道 —— 是接近，不是等同</text>
<text x="380" y="468" font-size="9.4" fill="#5F564C" text-anchor="middle">水有形，道无体。学水学得再像，也只是靠近。</text>
<text x="380" y="486" font-size="9.4" fill="#5F564C" text-anchor="middle">把参照物当成终点，就又多了一尊像。</text>
<line x1="20" y1="532" x2="360" y2="532" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="546" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="562" font-size="8.4" fill="#2F2A24">上善若水，水善利万物而不争。</text>
<text x="20" y="578" font-size="8.4" fill="#2F2A24">「若」是像，不是是；「善」是取向，不是标签。</text>
</svg>