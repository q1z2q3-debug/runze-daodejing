<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 442" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="惊的不是宠辱，是那个钉在壁上的我" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="442" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 三 章 · 荣 辱</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">惊的是我</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">宠辱本身没有力气；力气是把自己交出去那一刻给的。</text>
<circle cx="190" cy="166" r="56" fill="#E9DCC4" stroke="#DCCBB0" stroke-width="1"/>
<circle cx="190" cy="166" r="37" fill="#F8F3E6" stroke="#DCCBB0" stroke-width="1"/>
<text x="190" y="170" font-size="8.6" fill="#8A7C69" text-anchor="middle">空</text>
<text x="190" y="104" font-size="8.4" fill="#A2503B" text-anchor="middle">壁＝我</text>
<line x1="56" y1="166" x2="128" y2="166" stroke="#4A5C55" stroke-width="1.2" marker-end="url(#arr2)"/>
<line x1="324" y1="166" x2="252" y2="166" stroke="#A2503B" stroke-width="1.2" marker-end="url(#arrS)"/>
<text x="58" y="142" font-size="8.2" fill="#6E6459">得之若惊</text>
<text x="322" y="142" font-size="8.2" fill="#6E6459" text-anchor="end">失之若惊</text>
<text x="58" y="206" font-size="13" fill="#4A5C55" text-anchor="middle" letter-spacing="1">宠</text>
<text x="322" y="206" font-size="13" fill="#A2503B" text-anchor="middle" letter-spacing="1">辱</text>
<text x="190" y="244" font-size="8.6" fill="#8A7C69" text-anchor="middle">宠为下：一求它，就把自己放在下位。</text>
<rect x="20" y="262" width="340" height="46" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="281" font-size="8.8" fill="#2F2A24" text-anchor="middle">吾所以有大患者，为吾有身；及吾无身，吾有何患？</text>
<text x="190" y="297" font-size="8.4" fill="#6E6459" text-anchor="middle">无身不是把壁拆了，是不把自己钉在壁上。</text>
<rect x="20" y="326" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="346" font-size="11" fill="#2F2A24" text-anchor="middle" letter-spacing="1">贵以身为天下，若可寄天下。</text>
<text x="190" y="362" font-size="8.4" fill="#6E6459" text-anchor="middle">先把自己看重，别人才敢把事托给你——不是相反。</text>
<line x1="20" y1="378" x2="360" y2="378" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="392" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="408" font-size="8.4" fill="#2F2A24">杯壁承一气，珍重莫轻伤；不缚荣辱相，中空纳天光。</text>
<text x="20" y="424" font-size="8.4" fill="#2F2A24">壁不可碎，执壁为我才碎；养身如养器，护壁不据壁。</text>
</svg>