<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 486" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="「晚成」把终点挪远，「免成」把终点取消" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="486" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 一 章 · 免 成</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">大器免成</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">不是不成器，是不封口。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="6.4" fill="#2F2A24" text-anchor="middle">帛书本作「大器免成」；通行本作「大器晚成」。</text>
<text x="190" y="127" font-size="6.2" fill="#A2503B" text-anchor="middle">「免」，脱除、除去——把「成」这件事从器上摘下来。</text>
<text x="24" y="154" font-size="6.6" fill="#6E6459">通行本 · 晚成</text>
<path d="M58,172 L64,222 L104,222 L110,172 Z" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="57" y1="166" x2="111" y2="166" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="57" y1="166" x2="57" y2="172" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="111" y1="166" x2="111" y2="172" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="118" y1="182" x2="150" y2="182" stroke="#C9B79A" stroke-width="0.6" stroke-dasharray="6 5"/>
<line x1="150" y1="174" x2="150" y2="206" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M150,174 l14,4 l-14,4 z" fill="#A2503B"/>
<text x="157" y="218" font-size="5.2" fill="#A2503B" text-anchor="middle">终点还在</text>
<text x="84" y="238" font-size="5.6" fill="#6E6459" text-anchor="middle">慢慢来，总会成的</text>
<text x="190" y="182" font-size="6.2" fill="#2F2A24">承认「成」是终点，只把终点推远一点。</text>
<text x="190" y="198" font-size="6.2" fill="#6E6459">盖还盖着，器还朝定型走。</text>
<text x="190" y="216" font-size="6.4" fill="#2F2A24">这是一句安慰话。</text>
<text x="24" y="258" font-size="6.6" fill="#4A5C55">帛书本 · 免成</text>
<path d="M58,276 L64,326 L104,326 L110,276 Z" fill="none" stroke="#4A5C55" stroke-width="1"/>
<ellipse cx="84" cy="276" rx="26" ry="5" fill="none" stroke="#4A5C55" stroke-width="0.9"/>
<path d="M70,270 a14,6 0 0 1 28,0" fill="none" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="4 3"/>
<text x="84" y="262" font-size="5.2" fill="#A2503B" text-anchor="middle">口一直开着</text>
<text x="130" y="288" font-size="9.0" fill="#A2503B" text-anchor="middle">成</text>
<line x1="120" y1="284" x2="140" y2="284" stroke="#A2503B" stroke-width="1.1"/>
<text x="130" y="306" font-size="5.0" fill="#6E6459" text-anchor="middle">免＝脱除</text>
<text x="84" y="334" font-size="5.4" fill="#4A5C55" text-anchor="middle">不封口，还留着一处在变</text>
<text x="190" y="286" font-size="6.2" fill="#2F2A24">不往那个终点去，因为「成」就是「定型」。</text>
<text x="190" y="302" font-size="5.9" fill="#6E6459">一定型，就碰上「物壮则老」：顶点后面只有下坡。</text>
<text x="190" y="320" font-size="6.4" fill="#4A5C55">所以它一直留着一处没完成。</text>
<line x1="24" y1="346" x2="338" y2="344" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="352" width="340" height="48" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="368" font-size="6.8" fill="#2F2A24" text-anchor="middle">「免成」不是不成器，是不封口——永远还留着一处在变。</text>
<text x="190" y="383" font-size="6.2" fill="#6E6459" text-anchor="middle">一个「免」字和一个「善」字，把「成」分成两件事：自己的成，和让别人成。</text>
<text x="190" y="396" font-size="6.6" fill="#4A5C55" text-anchor="middle">它不给自己定型，所以能给别人留出形。</text>
<line x1="20" y1="414" x2="360" y2="414" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="428" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="444" font-size="8.4" fill="#2F2A24">「晚成」是把终点挪远，「免成」是把终点取消。</text>
<text x="20" y="460" font-size="8.4" fill="#2F2A24">不是它没有样子，是任何样子都只是它的一块。</text>
</svg>