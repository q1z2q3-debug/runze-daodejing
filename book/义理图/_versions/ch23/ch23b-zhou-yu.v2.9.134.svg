<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="飘风不终朝，骤雨不终日：天地的力气也撑不久" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="700" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 三 章 · 一 场 骤 雨</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一场骤雨</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">孰为此者？天地。天地尚不能久，而况于人乎？</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「希言自然」：话少，才合乎自然的走法；多言即用力，用力必不久。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459">先把「不久」这件事，交给天地自己演一遍。</text>
<text x="24" y="152" font-size="5.1" fill="#A2503B">一、骤雨：来得猛，走得也快；旁边的更漏只走了一小格</text>
<rect x="26" y="164" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="44" y1="180" x2="35" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="57" y1="180" x2="48" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="70" y1="180" x2="61" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="83" y1="180" x2="74" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="96" y1="180" x2="87" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="109" y1="180" x2="100" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="122" y1="180" x2="113" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="135" y1="180" x2="126" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="148" y1="180" x2="139" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="161" y1="180" x2="152" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="174" y1="180" x2="165" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="187" y1="180" x2="178" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="200" y1="180" x2="191" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<line x1="213" y1="180" x2="204" y2="226" stroke="#8A7C69" stroke-width="0.8" opacity="0.75"/>
<ellipse cx="150" cy="178" rx="112" ry="14" fill="#EFE6D4" opacity="0.75" stroke="none"/>
<ellipse cx="96" cy="176" rx="52" ry="11" fill="#EFE6D4" opacity="0.6" stroke="none"/>
<ellipse cx="206" cy="176" rx="46" ry="10" fill="#EFE6D4" opacity="0.6" stroke="none"/>
<path d="M36,232 q40,8 84,2 q46,-6 92,2 q44,8 86,-1" fill="none" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="70" y="248" font-size="4.0" fill="#8A7C69">一阵就过</text>
<path d="M232,194 L268,194 L262,210 L252,242 L248,242 L238,210 Z" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="232" y1="194" x2="268" y2="194" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M238,216 L262,216 L256,238 L244,238 Z" fill="#EFE6D4" stroke="none"/>
<line x1="236" y1="204" x2="240" y2="204" stroke="#DCCBB0" stroke-width="0.6"/>
<line x1="236" y1="210" x2="240" y2="210" stroke="#DCCBB0" stroke-width="0.6"/>
<line x1="236" y1="216" x2="240" y2="216" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="292" y="208" font-size="3.9" fill="#A2503B">只走一格</text>
<line x1="286" y1="212" x2="256" y2="212" stroke="#DCCBB0" stroke-width="0.5"/>
<path d="M232,264 L272,264" stroke="none"/>
<text x="250" y="268" font-size="3.8" fill="#8A7C69" text-anchor="middle">更漏：量时之物，此处只量到一小段</text>
<text x="150" y="288" font-size="4.2" fill="#A2503B" text-anchor="middle">飘风不终朝，骤雨不终日：连天地也做不出一场长雨</text>
<text x="24" y="328" font-size="5.1" fill="#4A5C55">二、多言即用力：一口气喊出去，声圈越散越淡</text>
<rect x="26" y="340" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="104" cy="394" r="6.4" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="104" y1="401" x2="104" y2="438" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="104" y1="438" x2="96" y2="456" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="104" y1="438" x2="112" y2="456" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="104" y1="414" x2="120" y2="406" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="104" y1="416" x2="90" y2="424" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M116,392 q10,6 0,12" fill="none" stroke="#A2503B" stroke-width="0.8"/>
<ellipse cx="130" cy="398" rx="16" ry="10" fill="none" stroke="#A2503B" stroke-width="0.8" opacity="0.9"/>
<ellipse cx="136" cy="398" rx="30" ry="18" fill="none" stroke="#A2503B" stroke-width="0.8" opacity="0.6"/>
<ellipse cx="142" cy="398" rx="44" ry="26" fill="none" stroke="#A2503B" stroke-width="0.8" opacity="0.35"/>
<ellipse cx="148" cy="398" rx="58" ry="34" fill="none" stroke="#A2503B" stroke-width="0.8" opacity="0.2"/>
<text x="200" y="372" font-size="4.0" fill="#A2503B">越散越淡</text>
<line x1="286" y1="374" x2="300" y2="374" stroke="#DCCFBB" stroke-width="0.6"/>
<line x1="300" y1="374" x2="314" y2="374" stroke="#DCCFBB" stroke-width="0.6"/>
<line x1="314" y1="374" x2="328" y2="374" stroke="#DCCFBB" stroke-width="0.6"/>
<text x="300" y="366" font-size="3.8" fill="#8A7C69" text-anchor="middle">风已经停了</text>
<text x="190" y="472" font-size="4.2" fill="#4A5C55" text-anchor="middle">话一多，就得一直用力把它撑着；一停，就不见了</text>
<text x="24" y="514" font-size="4.8" fill="#2F2A24">天地做不出一场长雨，人也做不出一段长言：这不是悲观，是把力的限度先量清。</text>
<text x="24" y="530" font-size="4.8" fill="#2F2A24">「希言」不是不说话，是不拿话去替代那件要长久的事。</text>
<text x="24" y="548" font-size="4.8" fill="#4A5C55">飘风骤雨之后，地还是干的；话说尽之后，事还是没动。</text>
<line x1="24" y1="566" x2="338" y2="566" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="574" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="590" font-size="5.4" fill="#2F2A24" text-anchor="middle">希言自然。飘风不终朝，骤雨不终日。</text>
<text x="190" y="602" font-size="5.0" fill="#4A5C55" text-anchor="middle">天地尚不能久，而况于人乎？</text>
<line x1="20" y1="628" x2="360" y2="628" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="642" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="658" font-size="8.4" fill="#2F2A24">希言自然。飘风不终朝，骤雨不终日。</text>
<text x="20" y="674" font-size="8.4" fill="#2F2A24">天地做不出一场长雨，人也做不出一段长言。</text>
</svg>