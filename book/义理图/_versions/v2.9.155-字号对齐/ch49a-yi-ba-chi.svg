<line x1="274" y1="184" x2="274" y2="187.2" stroke="#2F2A24" stroke-width="0.5"/>
<line x1="44" y1="193" x2="288" y2="193" stroke="#A2503B" stroke-width="1.1" stroke-dasharray="6 3"/>
<text x="296" y="192" font-size="4.4" fill="#A2503B">合格线</text>
<circle cx="86" cy="200" r="5.6" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="86" y1="206" x2="86" y2="272" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="86" y1="216" x2="79" y2="226" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="86" y1="216" x2="93" y2="226" stroke="#2F2A24" stroke-width="0.9"/>
