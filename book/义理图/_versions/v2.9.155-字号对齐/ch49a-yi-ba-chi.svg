<line x1="86" y1="272" x2="92" y2="290" stroke="#2F2A24" stroke-width="1"/>
<line x1="86" y1="194.4" x2="86" y2="193" stroke="#4A5C55" stroke-width="0.6" stroke-dasharray="3 2"/>
<text x="86" y="304" font-size="4.3" fill="#4A5C55" text-anchor="middle">甲：够得到</text>
<circle cx="148" cy="224" r="5.6" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="148" y1="230" x2="148" y2="272" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="148" y1="240" x2="141" y2="250" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="148" y1="240" x2="155" y2="250" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="148" y1="272" x2="142" y2="290" stroke="#2F2A24" stroke-width="1"/>
<line x1="148" y1="272" x2="154" y2="290" stroke="#2F2A24" stroke-width="1"/>
<line x1="148" y1="218.4" x2="148" y2="198" stroke="#A2503B" stroke-width="0.6" stroke-dasharray="3 2"/>
<text x="148" y="304" font-size="4.3" fill="#A2503B" text-anchor="middle">乙：差一截</text>
<circle cx="210" cy="248" r="5.6" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="210" y1="254" x2="210" y2="272" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="210" y1="264" x2="203" y2="274" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="210" y1="264" x2="217" y2="274" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="210" y1="272" x2="204" y2="290" stroke="#2F2A24" stroke-width="1"/>
<line x1="210" y1="272" x2="216" y2="290" stroke="#2F2A24" stroke-width="1"/>
<line x1="210" y1="242.4" x2="210" y2="222" stroke="#A2503B" stroke-width="0.6" stroke-dasharray="3 2"/>
<text x="210" y="304" font-size="4.3" fill="#A2503B" text-anchor="middle">丙：差两截</text>
<text x="190" y="318" font-size="4.5" fill="#4A5C55" text-anchor="middle">尺一压下来，人就成了刻度上的一个读数</text>
<text x="190" y="346" font-size="4.6" fill="#4A5C55" text-anchor="middle">尺一伸出去，话就跟着出去；尺压在头顶，人就被钉住</text>
<text x="24" y="370" font-size="5.2" fill="#4A5C55">二、无常心：尺收回腰间，人还是三个人</text>
<rect x="26" y="382" width="328" height="168" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="510" x2="330" y2="510" stroke="#2F2A24" stroke-width="1"/>
<circle cx="86" cy="420" r="5.6" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="86" y1="426" x2="86" y2="492" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="86" y1="436" x2="79" y2="446" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="86" y1="436" x2="93" y2="446" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="86" y1="492" x2="80" y2="510" stroke="#2F2A24" stroke-width="1"/>
<line x1="86" y1="492" x2="92" y2="510" stroke="#2F2A24" stroke-width="1"/>
<text x="86" y="524" font-size="4.5" fill="#6E6459" text-anchor="middle">甲</text>
<circle cx="148" cy="444" r="5.6" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="148" y1="450" x2="148" y2="492" stroke="#2F2A24" stroke-width="1.2"/>
