<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="常心是一把自己打的尺：尺一横在人头顶，人就只剩一个读数" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="760" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 九 章 · 尺</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一把尺</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">圣人无常心，以百姓心为心。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「常」这个字最骗人：它听着像天理，其实是你自己的习惯。</text>
<text x="190" y="127" font-size="5.0" fill="#6E6459" text-anchor="middle">一把尺在手，万物皆有长短；放下尺，不是没有标准，是不再拿它钉人。</text>
<text x="24" y="150" font-size="5.2" fill="#A2503B">一、有常心：一把尺压在头顶</text>
<rect x="26" y="162" width="328" height="168" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="290" x2="330" y2="290" stroke="#2F2A24" stroke-width="1"/>
