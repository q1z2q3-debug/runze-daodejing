<line x1="148" y1="492" x2="142" y2="510" stroke="#2F2A24" stroke-width="1"/>
<line x1="148" y1="492" x2="154" y2="510" stroke="#2F2A24" stroke-width="1"/>
<text x="148" y="524" font-size="4.5" fill="#6E6459" text-anchor="middle">乙</text>
<circle cx="210" cy="468" r="5.6" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="210" y1="474" x2="210" y2="492" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="210" y1="484" x2="203" y2="494" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="210" y1="484" x2="217" y2="494" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="210" y1="492" x2="204" y2="510" stroke="#2F2A24" stroke-width="1"/>
<line x1="210" y1="492" x2="216" y2="510" stroke="#2F2A24" stroke-width="1"/>
<text x="210" y="524" font-size="4.5" fill="#6E6459" text-anchor="middle">丙</text>
<path d="M79,466 q7,3 14,0" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="92" y1="468" x2="124" y2="456" stroke="#EFE6D4" stroke-width="3.4"/>
<line x1="92" y1="468" x2="124" y2="456" stroke="#4A5C55" stroke-width="1.4"/>
<line x1="100" y1="466" x2="100" y2="470" stroke="#2F2A24" stroke-width="0.5"/>
<line x1="108" y1="463" x2="108" y2="467" stroke="#2F2A24" stroke-width="0.5"/>
<line x1="116" y1="460" x2="116" y2="464" stroke="#2F2A24" stroke-width="0.5"/>
<text x="238" y="426" font-size="4.4" fill="#4A5C55">尺插回腰间：还在，</text>
<text x="238" y="438" font-size="4.4" fill="#4A5C55">不横在人头顶</text>
<text x="190" y="566" font-size="4.6" fill="#4A5C55" text-anchor="middle">头顶那道虚线没有了：不把人划到哪一栏里去</text>
<text x="24" y="590" font-size="5.4" fill="#2F2A24">尺量长短，是它本分；尺压在头顶，它就把人钉住了。</text>
<text x="24" y="606" font-size="5.4" fill="#2F2A24">「以百姓心为心」不是照他们说的做，是不把他们划到哪一栏里去。</text>
<text x="24" y="624" font-size="5.2" fill="#4A5C55">这一章不是教人宽容，是教人把自己那把尺认出来，然后松开手。</text>
<line x1="24" y1="642" x2="338" y2="642" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="650" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="666" font-size="6.0" fill="#2F2A24" text-anchor="middle">一把尺能定长短，</text>
<text x="190" y="678" font-size="6.0" fill="#4A5C55" text-anchor="middle">也能把人钉在短的那一格里。</text>
<line x1="20" y1="704" x2="360" y2="704" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="718" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="734" font-size="8.4" fill="#2F2A24">一把尺能定长短，也能把人钉在短的那一格里。</text>
</svg>