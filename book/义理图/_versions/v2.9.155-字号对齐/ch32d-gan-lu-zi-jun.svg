<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一杯一样多不等于各得其分：人做的均是拉平，天做的均是刚好" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="630" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 二 章 · 甘 露（补图）</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">甘 露 与 自 均</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">天地相合，以降甘露，民莫之令而自均。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.6" fill="#2F2A24" text-anchor="middle">「令」，《说文》「发号也」；「均」，《说文》「平也」——均的本义是各得其分，不是削成一样。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">同样的水落在山上和洼地，山上流走的多，洼地积下的多；可草木各有各的长法。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、有令：一杯一样多</text>
<rect x="26" y="164" width="328" height="148" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<line x1="190" y1="170" x2="190" y2="192" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M190,170 L212,176 L190,182 Z" fill="#A2503B" stroke="#A2503B" stroke-width="0.8"/>
<text x="220" y="178" font-size="4.1" fill="#A2503B">令：发号，按人头分</text>
<path d="M77,198 L79,230 L101,230 L103,198 Z" fill="#F6EFE0" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M78.4,214 L101.6,214 L101,230 L79,230 Z" fill="#DDE9E1" stroke="none"/>
<line x1="77.6" y1="214" x2="102.4" y2="214" stroke="#E6D8C2" stroke-width="0.6"/>
<path d="M177,198 L179,230 L201,230 L203,198 Z" fill="#F6EFE0" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M178.4,214 L201.6,214 L201,230 L179,230 Z" fill="#DDE9E1" stroke="none"/>
<line x1="177.6" y1="214" x2="202.4" y2="214" stroke="#E6D8C2" stroke-width="0.6"/>
<path d="M277,198 L279,230 L301,230 L303,198 Z" fill="#F6EFE0" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M278.4,214 L301.6,214 L301,230 L279,230 Z" fill="#DDE9E1" stroke="none"/>
<line x1="277.6" y1="214" x2="302.4" y2="214" stroke="#E6D8C2" stroke-width="0.6"/>
<text x="190" y="242" font-size="3.9" fill="#8A7C69" text-anchor="middle">同一把斗，同一道水位——杯杯一样高</text>
<path d="M48,292 L132,268 L132,286 L48,298 Z" fill="#E6DCC6" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="102" y1="274" x2="102" y2="250" stroke="#A89A80" stroke-width="1.1"/>
<path d="M102,260 q-8,4 -10,10 M102,255 q8,4 10,9" fill="none" stroke="#A89A80" stroke-width="0.9"/>
<rect x="148" y="278" width="84" height="12" fill="#E6DCC6" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="190" y1="278" x2="190" y2="254" stroke="#4A5C55" stroke-width="1.2"/>
<path d="M190,266 q-10,-4 -11,4 M190,260 q10,-5 11,3" fill="none" stroke="#4A5C55" stroke-width="1.0"/>
<path d="M248,274 Q290,296 332,274 L332,286 Q290,308 248,286 Z" fill="#DDE9E1" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M251,280 Q290,300 329,280 L329,283 Q290,303 251,283 Z" fill="#C9DCD4" stroke="none"/>
<line x1="290" y1="284" x2="290" y2="260" stroke="#8FA99F" stroke-width="1.2"/>
<path d="M290,270 q-8,4 -10,10 M290,265 q8,4 10,9" fill="none" stroke="#8FA99F" stroke-width="1.0"/>
<text x="90" y="304" font-size="3.9" fill="#8A7C69" text-anchor="middle">坡上旱</text>
<text x="190" y="304" font-size="3.9" fill="#8A7C69" text-anchor="middle">平地足</text>
<text x="290" y="304" font-size="3.9" fill="#8A7C69" text-anchor="middle">洼地淹</text>
<text x="190" y="320" font-size="4.0" fill="#A2503B" text-anchor="middle">分得一样，未必长成一样——拉平的是数，长成的是各自的命。</text>
<text x="24" y="340" font-size="5.1" fill="#4A5C55">二、无令：夜露落下来</text>
<rect x="26" y="352" width="328" height="148" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<circle cx="300" cy="372" r="13" fill="#F0E7D2" stroke="none"/>
<circle cx="306" cy="368" r="11" fill="#FBF6EC" stroke="none"/>
<line x1="252" y1="364" x2="252" y2="384" stroke="#DCCBB0" stroke-width="0.7" stroke-dasharray="2 3"/>
<path d="M252,364 L272,370 L252,376 Z" fill="none" stroke="#DCCBB0" stroke-width="0.7" stroke-dasharray="2 3"/>
<text x="56" y="376" font-size="4.0" fill="#8A7C69">夜里，天上没有发号的人——令已撤</text>
<text x="252" y="392" font-size="3.6" fill="#8A7C69" text-anchor="middle">只剩空旗</text>
