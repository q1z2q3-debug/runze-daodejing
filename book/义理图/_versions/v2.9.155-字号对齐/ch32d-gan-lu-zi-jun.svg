<text x="190" y="478" font-size="4.2" fill="#4A5C55" text-anchor="middle">莫之令而自均：各得其分</text>
<text x="190" y="494" font-size="4.0" fill="#8A7C69" text-anchor="middle">天不分配，只落下；落下来，各处自己够</text>
<rect x="20" y="514" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="532" font-size="5.6" fill="#2F2A24" text-anchor="middle">天不分配，只落下；落下来，各处自己够。</text>
<text x="190" y="546" font-size="4.4" fill="#6E6459" text-anchor="middle">人一分配，就先得有一把斗；斗一出来，就有人量得比别人少。</text>
<line x1="20" y1="574" x2="360" y2="574" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="588" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="604" font-size="8.4" fill="#2F2A24">人做的「均」，是拉平；天做的「均」，是刚好。</text>
</svg>