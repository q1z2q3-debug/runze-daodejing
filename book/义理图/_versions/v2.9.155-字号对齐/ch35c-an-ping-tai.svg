<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 606" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="看一个场和不和，不看它多热闹，看里面的人有没有互相伤" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="606" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 五 章 · 其 三</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">安 · 平 · 泰</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">执大象，天下往；往而不害，安平泰。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「害」，《说文》「伤也」；「安」，从宀从女，人在屋下曰安；「平」，不倾斜、不压；「泰」，《序卦》「通也」。</text>
<text x="190" y="127" font-size="4.5" fill="#6E6459">三字连起来：有处可居、没有压迫、气息通畅——这就是「和」最具体的样貌。</text>
<text x="24" y="152" font-size="5.0" fill="#4A5C55">一、有框：进门第一件事，先量你合不合尺寸</text>
<rect x="26" y="164" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="276" x2="340" y2="276" stroke="#DCCBB0" stroke-width="0.9"/>
<rect x="150" y="186" width="150" height="90" fill="none" stroke="#A2503B" stroke-width="1.0"/>
