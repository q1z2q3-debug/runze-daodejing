<path d="M206,392 q20,-4 40,0 t40,0" fill="none" stroke="#9EB3A8" stroke-width="0.7" stroke-dasharray="6 4"/>
<text x="246" y="360" font-size="4.0" fill="#9EB3A8" text-anchor="middle">风</text>
<text x="84" y="460" font-size="4.1" fill="#4A5C55" text-anchor="middle">安：有处可居</text>
<text x="190" y="460" font-size="4.1" fill="#4A5C55" text-anchor="middle">平：没有谁被压</text>
<text x="286" y="460" font-size="4.1" fill="#4A5C55" text-anchor="middle">泰：气走得通</text>
<line x1="24" y1="480" x2="356" y2="480" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="488" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="504" font-size="4.6" fill="#2F2A24" text-anchor="middle">手一伸出去，场就变成了门槛；手不伸，场才容得下别人带着自己的样子进来。</text>
<text x="190" y="517" font-size="4.6" fill="#4A5C55" text-anchor="middle">安是有地方待，平是没人压你，泰是气走得通。</text>
<line x1="20" y1="534" x2="360" y2="534" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="548" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="564" font-size="8.4" fill="#2F2A24">手一伸出去，场就变成了门槛。</text>
<text x="20" y="580" font-size="8.4" fill="#2F2A24">安是有地方待，平是没人压你，泰是气走得通。</text>
</svg>