<path d="M268,238 l-30,4 M268,238 l30,4" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<text x="300" y="244" font-size="4.8" fill="#A2503B" text-anchor="middle">×</text>
<text x="96" y="220" font-size="4.0" fill="#8A7C69" text-anchor="middle">高一分，撞头</text>
<text x="96" y="232" font-size="4.0" fill="#8A7C69" text-anchor="middle">宽一分，侧挤</text>
<text x="96" y="248" font-size="4.0" fill="#A2503B" text-anchor="middle">尺寸先于人间</text>
<text x="190" y="292" font-size="4.3" fill="#2F2A24" text-anchor="middle">伸手的场，进门第一件事是先量你合不合尺寸</text>
<text x="24" y="322" font-size="5.0" fill="#4A5C55">二、无框：同一个场，三样东西</text>
<rect x="26" y="334" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="446" x2="340" y2="446" stroke="#DCCBB0" stroke-width="0.9"/>
