<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="其出弥远，其知弥少" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="470" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 七 章 · 网</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">网越密，越看不见</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">其出弥远，其知弥少。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.6" fill="#2F2A24" text-anchor="middle">「知」不是信息量，是「通」——知道这一件和那一件，是同一件事。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">而「出」是采集：多一件，就多一条线；多一条线，就多一处要连的地方。</text>
<circle cx="66" cy="220" r="42" fill="#4A5C55" opacity="0.28"/>
<circle cx="66" cy="220" r="42" fill="none" stroke="#4A5C55" stroke-width="0.5" opacity="0.7"/>
<circle cx="66" cy="220" r="9" fill="#4A5C55" opacity="0.9"/>
<line x1="52.0" y1="180.4" x2="52.0" y2="259.6" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="26.4" y1="206.0" x2="105.6" y2="206.0" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="80.0" y1="180.4" x2="80.0" y2="259.6" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="26.4" y1="234.0" x2="105.6" y2="234.0" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<text x="66" y="276" font-size="5.2" fill="#6E6459" text-anchor="middle">刚出门：还看得见</text>
<circle cx="190" cy="220" r="42" fill="#4A5C55" opacity="0.28"/>
<circle cx="190" cy="220" r="42" fill="none" stroke="#4A5C55" stroke-width="0.5" opacity="0.7"/>
<circle cx="190" cy="220" r="9" fill="#4A5C55" opacity="0.9"/>
<line x1="164.8" y1="186.4" x2="164.8" y2="253.6" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="156.4" y1="194.8" x2="223.6" y2="194.8" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="181.6" y1="178.8" x2="181.6" y2="261.2" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="148.8" y1="211.6" x2="231.2" y2="211.6" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="198.4" y1="178.8" x2="198.4" y2="261.2" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="148.8" y1="228.4" x2="231.2" y2="228.4" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="215.2" y1="186.4" x2="215.2" y2="253.6" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="156.4" y1="245.2" x2="223.6" y2="245.2" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<text x="190" y="276" font-size="5.2" fill="#6E6459" text-anchor="middle">走远了：线多了</text>
<circle cx="312" cy="220" r="42" fill="#4A5C55" opacity="0.28"/>
<circle cx="312" cy="220" r="42" fill="none" stroke="#4A5C55" stroke-width="0.5" opacity="0.7"/>
<circle cx="312" cy="220" r="9" fill="#4A5C55" opacity="0.9"/>
<line x1="279.3" y1="193.6" x2="279.3" y2="246.4" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="285.6" y1="187.3" x2="338.4" y2="187.3" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="288.7" y1="185.1" x2="288.7" y2="254.9" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="277.1" y1="196.7" x2="346.9" y2="196.7" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="298.0" y1="180.4" x2="298.0" y2="259.6" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="272.4" y1="206.0" x2="351.6" y2="206.0" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="307.3" y1="178.3" x2="307.3" y2="261.7" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="270.3" y1="215.3" x2="353.7" y2="215.3" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="316.7" y1="178.3" x2="316.7" y2="261.7" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="270.3" y1="224.7" x2="353.7" y2="224.7" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="326.0" y1="180.4" x2="326.0" y2="259.6" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="272.4" y1="234.0" x2="351.6" y2="234.0" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="335.3" y1="185.1" x2="335.3" y2="254.9" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="277.1" y1="243.3" x2="346.9" y2="243.3" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="344.7" y1="193.6" x2="344.7" y2="246.4" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<line x1="285.6" y1="252.7" x2="338.4" y2="252.7" stroke="#2F2A24" stroke-width="0.5" opacity="0.55"/>
<text x="312" y="276" font-size="5.2" fill="#6E6459" text-anchor="middle">走得很远：看不见了</text>
<text x="24" y="296" font-size="5.8" fill="#2F2A24">三个圆里是同一片「知」。网眼越密，中间那点亮越小；</text>
<text x="24" y="312" font-size="5.8" fill="#A2503B">线都是你自己一条条捡回来的，捡得越多，越放不下。</text>
<text x="24" y="328" font-size="5.4" fill="#6E6459">老子不是反对看；他反对把「向外看」当成求道的路。</text>
<line x1="24" y1="346" x2="338" y2="346" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="354" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="370" font-size="5.2" fill="#2F2A24" text-anchor="middle">信息是捡回来的，通是放下去的；</text>
<text x="190" y="382" font-size="5.2" fill="#4A5C55" text-anchor="middle">捡得越多，越放不下。</text>
<line x1="20" y1="408" x2="360" y2="408" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="422" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="438" font-size="8.4" fill="#2F2A24">其出弥远，其知弥少。</text>
</svg>