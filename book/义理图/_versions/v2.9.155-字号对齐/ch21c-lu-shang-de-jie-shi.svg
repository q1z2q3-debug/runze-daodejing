<path d="M249,488 L254,468 L259,488" fill="none" stroke="#4A5C55" stroke-width="1.0"/>
<line x1="254" y1="488" x2="254" y2="496" stroke="#4A5C55" stroke-width="0.9"/>
<path d="M275,488 L280,468 L285,488" fill="none" stroke="#4A5C55" stroke-width="1.0"/>
<line x1="280" y1="488" x2="280" y2="496" stroke="#4A5C55" stroke-width="0.9"/>
<circle cx="146" cy="458" r="4.0" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M146,462 L150,484" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="150" y1="484" x2="144" y2="500" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="150" y1="484" x2="156" y2="500" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M148,468 L170,480" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<text x="206" y="434" font-size="3.8" fill="#6E6459" text-anchor="middle">一株，一株，点过去</text>
<text x="190" y="514" font-size="3.8" fill="#8A7C69" text-anchor="middle">「阅」是门内逐一点数；「以此」，就是站对了地方，不向外求标准。</text>
<text x="24" y="537" font-size="5.0" fill="#4A5C55">二、门内：名指得对，还要进来一一点数</text>
<text x="24" y="556" font-size="4.9" fill="#2F2A24">「自今及古」是把时间拉直：从此刻一直排回去，路标始终没撤。</text>
<text x="24" y="572" font-size="4.9" fill="#2F2A24">「名不去」不是名字不会用坏，是它指的那处一直还在；名字指对了，不等于名字就是那处。</text>
<text x="24" y="590" font-size="4.9" fill="#4A5C55">「以此」：不问「你凭什么」，只问「你站在哪里」——站对了，就数得清。</text>
<line x1="24" y1="608" x2="338" y2="608" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="616" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="632" font-size="4.9" fill="#2F2A24" text-anchor="middle">名不去，是路标一直在；路标在，不等于路标就是那个地方。</text>
<text x="190" y="644" font-size="4.9" fill="#4A5C55" text-anchor="middle">不是知道得多，是站对了地方。</text>
<line x1="20" y1="670" x2="360" y2="670" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="684" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="700" font-size="8.4" fill="#2F2A24">名不去，是路标一直在；路标在，不等于路标就是那个地方。</text>
<text x="20" y="716" font-size="8.4" fill="#2F2A24">不是知道得多，是站对了地方。</text>
</svg>