<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="742" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 一 章 · 以 阅 众 甫</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">路上的界石</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">自今及古，其名不去，以阅众甫。吾何以知众甫之状哉？以此。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">名是路标：指得对，不等于路标就是那地方。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">从今天一路往回排，路标一直没撤。</text>
<rect x="26" y="150" width="328" height="196" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M46,328 L96,328 L268,212 L246,212 Z" fill="#EFE6D4" opacity="0.75" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="74" y="284" width="20" height="26" rx="3" fill="#E4D8BF" stroke="#2F2A24" stroke-width="0.9"/>
<text x="84" y="302" font-size="5.4" fill="#2F2A24" text-anchor="middle">今</text>
<rect x="140" y="246" width="20" height="26" rx="3" fill="#E4D8BF" stroke="#2F2A24" stroke-width="0.9"/>
<text x="150" y="264" font-size="5.4" fill="#2F2A24" text-anchor="middle">中</text>
<rect x="206" y="208" width="20" height="26" rx="3" fill="#E4D8BF" stroke="#2F2A24" stroke-width="0.9"/>
<text x="216" y="226" font-size="5.4" fill="#2F2A24" text-anchor="middle">古</text>
<line x1="104" y1="314" x2="234" y2="238" stroke="#4A5C55" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.85"/>
<path d="M234,238 L226,239 M234,238 L231,246" fill="none" stroke="#4A5C55" stroke-width="0.9"/>
<text x="150" y="326" font-size="3.8" fill="#4A5C55" text-anchor="middle">都朝同一个方向</text>
<circle cx="60" cy="274" r="4.2" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="60" y1="278" x2="60" y2="306" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="60" y1="286" x2="76" y2="280" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="60" y1="306" x2="54" y2="322" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="60" y1="306" x2="68" y2="322" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="246" y1="212" x2="246" y2="176" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="270" y1="212" x2="270" y2="176" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="242" y1="176" x2="274" y2="176" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="246" y="162" width="24" height="12" fill="#F2EADA" stroke="#A2503B" stroke-width="0.8"/>
<text x="258" y="171" font-size="5.2" fill="#A2503B" text-anchor="middle">道</text>
<text x="258" y="226" font-size="3.6" fill="#8A7C69" text-anchor="middle">尽头是那地方</text>
<text x="24" y="359" font-size="5.0" fill="#A2503B">一、路上：今、中、古，三块石头指一处</text>
<rect x="26" y="372" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="120" y1="412" x2="120" y2="492" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="296" y1="412" x2="296" y2="492" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="114" y1="412" x2="302" y2="412" stroke="#2F2A24" stroke-width="1.1"/>
<rect x="182" y="398" width="42" height="12" fill="#F2EADA" stroke="#A2503B" stroke-width="0.8"/>
<text x="203" y="407" font-size="4.8" fill="#A2503B" text-anchor="middle">阅</text>
<line x1="126" y1="492" x2="290" y2="492" stroke="#DCCBB0" stroke-width="0.7"/>
<path d="M171,488 L176,468 L181,488" fill="none" stroke="#4A5C55" stroke-width="1.0"/>
<line x1="176" y1="488" x2="176" y2="496" stroke="#4A5C55" stroke-width="0.9"/>
