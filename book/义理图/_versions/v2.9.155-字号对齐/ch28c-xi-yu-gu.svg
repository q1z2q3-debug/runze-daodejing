<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="溪是众水所归，谷是泉水所出；一个受，一个出" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="690" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 八 章 · 溪 与 谷</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">溪与谷</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">知其雄，守其雌，为天下溪；知其荣，守其辱，为天下谷。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「溪」是山谷间的水道，「谷」是泉出通川之处；溪受，谷出。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459">守雌守辱不是认输，是选址：这两处都是水会来的地方。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、溪：众水所归，受</text>
<rect x="26" y="164" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M52,194 L156,270 M328,194 L224,270" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M156,270 L224,270 L219,256 L161,256 Z" fill="#E9F0E6" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="112" y1="206" x2="158" y2="252" stroke="#6E8A6E" stroke-width="0.9" marker-end="url(#arrS)"/>
<line x1="190" y1="198" x2="190" y2="252" stroke="#6E8A6E" stroke-width="0.9" marker-end="url(#arrS)"/>
<line x1="268" y1="206" x2="222" y2="252" stroke="#6E8A6E" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="190" y="302" font-size="4.1" fill="#4A5C55" text-anchor="middle">低处不索取，高处的水自己下来</text>
<text x="190" y="184" font-size="5.2" fill="#8A7C69" text-anchor="middle">溪</text>
<text x="24" y="338" font-size="5.1" fill="#A2503B">二、谷：泉水所出，虚而能出</text>
<rect x="26" y="350" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M52,380 L150,446 M328,380 L232,446" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="150" y1="446" x2="232" y2="446" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="180" cy="438" rx="24" ry="8" fill="#E9F0E6" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="180" cy="438" rx="11" ry="4" fill="none" stroke="#6E8A6E" stroke-width="0.7"/>
<line x1="180" y1="430" x2="180" y2="396" stroke="#6E8A6E" stroke-width="0.9" marker-end="url(#arrS)"/>
<line x1="158" y1="432" x2="158" y2="406" stroke="#6E8A6E" stroke-width="0.7" marker-end="url(#arrS)"/>
<line x1="202" y1="432" x2="202" y2="406" stroke="#6E8A6E" stroke-width="0.7" marker-end="url(#arrS)"/>
<line x1="226" y1="458" x2="322" y2="458" stroke="#6E8A6E" stroke-width="0.9" marker-end="url(#arrS)"/>
<path d="M244,462 q10,5 20,0 M276,462 q10,5 20,0" fill="none" stroke="#E6D8C2" stroke-width="0.6"/>
<text x="300" y="472" font-size="3.9" fill="#8A7C69" text-anchor="middle">谷口</text>
<text x="190" y="370" font-size="5.2" fill="#8A7C69" text-anchor="middle">谷</text>
<text x="190" y="490" font-size="4.1" fill="#A2503B" text-anchor="middle">空而能出，才是谷；空而无出，那只是个坑</text>
<text x="24" y="520" font-size="4.8" fill="#2F2A24">「知其雄，守其雌，为天下溪」：守住那个低处，低处就成了你的位置。</text>
<text x="24" y="536" font-size="4.8" fill="#2F2A24">「知其荣，守其辱，为天下谷」：空而能出，德到这里才「足」。</text>
<text x="24" y="554" font-size="4.8" fill="#4A5C55">不离、不忒、乃足：从守住，到守稳，到守出余量。</text>
<line x1="24" y1="572" x2="338" y2="572" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="580" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="596" font-size="5.4" fill="#2F2A24" text-anchor="middle">溪受而不取，谷虚而能出。</text>
<text x="190" y="608" font-size="5.0" fill="#4A5C55" text-anchor="middle">守的是位置，不是人格。</text>
<line x1="20" y1="634" x2="360" y2="634" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="648" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="664" font-size="8.4" fill="#2F2A24">溪是众水所归，谷是泉水所出；一个受，一个出。</text>
</svg>