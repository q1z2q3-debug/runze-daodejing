<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 606" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="两者都不乱动，差别只在心里有没有那本账" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="606" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 八 章 · 其 二</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">那 本 账</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">上德无为而无以为；下德无为而有以为。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「不德」不是没有德，是不把德当一个东西去持有；一持有，德就从身上变成了手里的一件物什。</text>
<text x="190" y="127" font-size="4.5" fill="#6E6459">手里有物，就得时时看住它别掉了。</text>
<text x="24" y="152" font-size="5.0" fill="#4A5C55">一、上德：做完就完，手上没有东西</text>
<rect x="26" y="164" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="276" x2="340" y2="276" stroke="#DCCBB0" stroke-width="0.9"/>
<circle cx="112" cy="222.0" r="6.0" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M112,228.0 Q118.0,250.0 110.0,246.0" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M110.0,246.0 L102.0,276" stroke="#2F2A24" stroke-width="1.1"/>
