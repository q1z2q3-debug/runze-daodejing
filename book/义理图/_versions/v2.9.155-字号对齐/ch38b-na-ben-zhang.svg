<path d="M268,398.0 Q274.0,420.0 266.0,416.0" fill="none" stroke="#8A7C69" stroke-width="1.1"/>
<path d="M266.0,416.0 L258.0,446" stroke="#8A7C69" stroke-width="1.1"/>
<path d="M266.0,416.0 L277.0,446" stroke="#8A7C69" stroke-width="1.1"/>
<path d="M269.0,400.0 L280.0,410.0 M267.0,400.0 L259.0,412.0" fill="none" stroke="#8A7C69" stroke-width="1.0"/>
