<path d="M160,418 L196,418 L196,432 L160,432 Z" fill="#DDE9E1" stroke="none"/>
<line x1="158" y1="418" x2="198" y2="418" stroke="#E6D8C2" stroke-width="0.5"/>
<path d="M104,408 l-26,12" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="60" y="394" width="19" height="27" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.8"/>
<line x1="69.5" y1="396" x2="69.5" y2="419" stroke="#A2503B" stroke-width="0.4"/>
<line x1="64" y1="404" x2="76" y2="404" stroke="#A2503B" stroke-width="0.4"/>
<text x="69.5" y="416" font-size="3.8" fill="#A2503B" text-anchor="middle">德</text>
<text x="190" y="462" font-size="4.3" fill="#2F2A24" text-anchor="middle">事一样做完了，可还记了一笔——这一笔是记给自己看的</text>
<line x1="24" y1="480" x2="356" y2="480" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="488" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="504" font-size="4.8" fill="#2F2A24" text-anchor="middle">上德做事，做完就完；下德做事，做完还要记一笔。</text>
<text x="190" y="517" font-size="4.6" fill="#4A5C55" text-anchor="middle">给自己看的那一笔，恰恰是要紧处。</text>
<line x1="20" y1="534" x2="360" y2="534" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="548" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="564" font-size="8.4" fill="#2F2A24">上德做完就完，下德做完还要记一笔。</text>
<text x="20" y="580" font-size="8.4" fill="#2F2A24">给自己看的那一笔，恰恰是要紧处。</text>
</svg>