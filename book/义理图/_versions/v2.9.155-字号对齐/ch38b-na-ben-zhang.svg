<path d="M266.0,246.0 L277.0,276" stroke="#8A7C69" stroke-width="1.1"/>
<path d="M269.0,230.0 L280.0,240.0 M267.0,230.0 L259.0,242.0" fill="none" stroke="#8A7C69" stroke-width="1.0"/>
<path d="M120,242 l38,7" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M260,242 l-32,7" stroke="#8A7C69" stroke-width="1.0"/>
<path d="M156,240 L200,240 L196,262 L160,262 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M160,248 L196,248 L196,262 L160,262 Z" fill="#DDE9E1" stroke="none"/>
<line x1="158" y1="248" x2="198" y2="248" stroke="#E6D8C2" stroke-width="0.5"/>
<text x="190" y="292" font-size="4.3" fill="#2F2A24" text-anchor="middle">水递过去，手就空了——事做完，事就完了</text>
<text x="24" y="322" font-size="5.0" fill="#4A5C55">二、下德：另一只手里，攥着一本账</text>
<rect x="26" y="334" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="446" x2="340" y2="446" stroke="#DCCBB0" stroke-width="0.9"/>
