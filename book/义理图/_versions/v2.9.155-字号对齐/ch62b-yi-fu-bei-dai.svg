<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="保是从人从孚：不是给个地方，是驮在身上走" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="700" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 二 章 · 保</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一副背带</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">善人之宝，不善人之所保。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「保」，《说文》「养也」，从人从孚——孚，是一只被抱住的孩子。</text>
<text x="190" y="126" font-size="5.0" fill="#6E6459" text-anchor="middle">本义是背着孩子：驮在背上，两只手还要腾出来干活。</text>
<text x="24" y="148" font-size="4.8" fill="#6E6459">一、收留：给一个地方</text>
<rect x="126" y="208" width="6" height="64" fill="#E6DCC6" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="208" y="208" width="6" height="64" fill="#E6DCC6" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M126,208 Q170,190 214,208" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="152" y="272" width="36" height="7" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="170" cy="238.0" r="5.0" fill="none" stroke="#2F2A24" stroke-width="1"/>
<rect x="164.0" y="244.0" width="12.0" height="16.0" rx="2" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="167.0" y1="260.0" x2="166.0" y2="272" stroke="#2F2A24" stroke-width="1"/>
<line x1="173.0" y1="260.0" x2="174.0" y2="272" stroke="#2F2A24" stroke-width="1"/>
<text x="190" y="298" font-size="4.8" fill="#6E6459" text-anchor="middle">收留：给一个地方</text>
<text x="190" y="312" font-size="4.4" fill="#6E6459" text-anchor="middle">地方是死的，人在地方里</text>
<text x="24" y="338" font-size="4.8" fill="#A2503B">二、背着：驮在身上，走到哪儿带到哪儿</text>
<path d="M174,414 Q174,406 182,406 L190,406 Q196,406 196,415 L196,436 L174,436 Z" fill="#F6EFE0" stroke="#A2503B" stroke-width="1"/>
<circle cx="185" cy="402" r="5" fill="#F6EFE0" stroke="#A2503B" stroke-width="1"/>
<line x1="182" y1="396" x2="188" y2="396" stroke="#A2503B" stroke-width="0.8"/>
<line x1="200" y1="436" x2="197" y2="462" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="213" y1="436" x2="216" y2="462" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="194" y="408" width="22" height="28" rx="3" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<circle cx="208" cy="398" r="8" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="194" y1="410" x2="209" y2="428" stroke="#A2503B" stroke-width="1" stroke-dasharray="2.4 1.8"/>
<line x1="216" y1="414" x2="232" y2="432" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M224,436 A10,8 0 0 0 244,436" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M223,436 L225,454 L243,454 L245,436" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<text x="252" y="430" font-size="4.2" fill="#6E6459">手还空着</text>
<text x="190" y="488" font-size="4.8" fill="#A2503B" text-anchor="middle">背着：驮在背上，手还腾着提篮</text>
<text x="190" y="502" font-size="4.4" fill="#6E6459" text-anchor="middle">人走到哪儿，孩子就到哪儿</text>
<text x="24" y="524" font-size="4.8" fill="#2F2A24">宝是自己收着的，保是背着孩子的：一个揣在怀里，一个驮在背上。</text>
<text x="24" y="540" font-size="4.9" fill="#2F2A24">收留是给个地方，人得待在那儿；背着是带在身上，走到哪儿带到哪儿。</text>
<text x="24" y="558" font-size="5.0" fill="#4A5C55">「太保」做的就是这件事；道对不善之人做的事，就是太保做的事。</text>
<line x1="24" y1="576" x2="338" y2="576" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="584" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="600" font-size="5.8" fill="#2F2A24" text-anchor="middle">宝是自己收着的，保是背着孩子的；</text>
<text x="190" y="612" font-size="5.2" fill="#4A5C55" text-anchor="middle">一个揣在怀里，一个驮在背上。</text>
<line x1="20" y1="638" x2="360" y2="638" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="652" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="668" font-size="8.4" fill="#2F2A24">宝是自己收着的，保是背着孩子的；一个揣在怀里，一个驮在背上。</text>
<text x="20" y="684" font-size="8.4" fill="#2F2A24">收留是给个地方，背着是驮在身上——走到哪儿带到哪儿。</text>
</svg>