<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 556" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="厚、重、沉、地：厚和地是同一个方向，都是往下堆" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="556" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 章 · 土</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一把土</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">以其生生之厚。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「厚」是堆；「地」，《说文》「重浊阴为地」——重的东西沉下来，堆成那一层。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">所以「死地」不是会死的地方，是已经堆成土的那一层。</text>
<text x="24" y="146" font-size="5.4" fill="#4A5C55">一、薄：气还通，脚下没有那一层</text>
<line x1="30" y1="208" x2="350" y2="208" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="30" y="208" width="320" height="4" fill="#EFE6D4" stroke="#DCCBB0" stroke-width="0.35"/>
<circle cx="96" cy="217" r="1.4" fill="#E6D8C2" opacity="0.8"/>
<circle cx="128" cy="217" r="1.4" fill="#E6D8C2" opacity="0.8"/>
<circle cx="160" cy="217" r="1.4" fill="#E6D8C2" opacity="0.8"/>
<line x1="250" y1="162" x2="250" y2="210" stroke="#6E6459" stroke-width="0.8" marker-end="url(#arr)"/>
<text x="258" y="178" font-size="4.6" fill="#6E6459">角、爪、刃都找不到落点</text>
<text x="258" y="190" font-size="4.6" fill="#6E6459">薄薄一层，一按就散</text>
<text x="24" y="248" font-size="5.4" fill="#A2503B">二、厚：一层一层往上堆，堆成一层土</text>
<line x1="30" y1="342" x2="350" y2="342" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="56" y1="334" x2="304" y2="334" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="56" y1="326" x2="304" y2="326" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="56" y1="318" x2="304" y2="318" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="56" y1="310" x2="304" y2="310" stroke="#DCCBB0" stroke-width="0.5"/>
<rect x="56" y="310" width="248" height="32" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9" opacity="0.9"/>
<line x1="58" y1="334" x2="302" y2="334" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="58" y1="326" x2="302" y2="326" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="58" y1="318" x2="302" y2="318" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="56" y1="310" x2="304" y2="310" stroke="#2F2A24" stroke-width="1.6"/>
<line x1="250" y1="278" x2="250" y2="310" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<path d="M244,308 l6,-5 M250,308 l-6,-5" stroke="#A2503B" stroke-width="0.7" fill="none"/>
<text x="258" y="280" font-size="4.6" fill="#A2503B">厚到成层，就硬成一块壳</text>
<text x="258" y="292" font-size="4.6" fill="#A2503B">每一处硬，都是一个落点</text>
<text x="24" y="298" font-size="5.0" fill="#A2503B">厚 → 重 → 沉 → 地 → 死地</text>
<text x="10" y="334" font-size="4.5" fill="#6E6459">补品、防护</text>
<text x="10" y="354" font-size="4.5" fill="#6E6459">一层一层堆</text>
<text x="24" y="382" font-size="5.2" fill="#2F2A24">堆的不是坏东西：补品、防护、一整套「我在养」的念头，一样一样都出于好意。</text>
<text x="24" y="398" font-size="5.2" fill="#2F2A24">可「厚」这个字的方向是往下：厚的东西沉，沉到底，就成了地。</text>
<text x="24" y="414" font-size="5.4" fill="#4A5C55">死地不是命给的，是自己一锹一锹堆起来的；撤土比加甲难。</text>
<line x1="24" y1="432" x2="338" y2="432" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="440" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="456" font-size="6.0" fill="#2F2A24" text-anchor="middle">「厚」和「地」是同一个方向：都是往下堆；</text>
<text x="190" y="468" font-size="6.0" fill="#4A5C55" text-anchor="middle">堆到成层，人就站在自己堆的那块土上。</text>
<line x1="20" y1="494" x2="360" y2="494" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="508" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="524" font-size="8.4" fill="#2F2A24">「厚」和「地」是同一个方向：都是往下堆；堆到成层，人就站在自己堆的那块土上。</text>
</svg>