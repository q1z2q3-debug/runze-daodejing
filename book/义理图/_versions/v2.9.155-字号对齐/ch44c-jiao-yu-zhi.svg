<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 566" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="足是脚，止是脚趾：站住，才长久" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="566" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 四 章 · 足 止</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">站住，停脚</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">知足不是心态好，是站得稳。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="115" font-size="5.2" fill="#2F2A24" text-anchor="middle">「足」，脚；「止」，脚趾。这两个字本来是身体词。</text>
<text x="190" y="127" font-size="5.3" fill="#6E6459" text-anchor="middle">老子不是在劝人心态，是在说一个人得知道自己站在哪儿、什么时候停脚。</text>
<text x="24" y="156" font-size="6.0" fill="#4A5C55">一 · 足：站得住的那个地方</text>
<ellipse cx="84" cy="214" rx="17" ry="26" fill="#EFE4CF" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="71" cy="185.2" r="4.2" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<circle cx="77" cy="182.8" r="4.4" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<circle cx="83" cy="180.4" r="4.6" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<circle cx="88" cy="181.6" r="4.2" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<circle cx="93" cy="183.6" r="3.6" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<line x1="106" y1="176" x2="118" y2="168" stroke="#4A5C55" stroke-width="0.6"/>
<text x="122" y="168" font-size="6.0" fill="#4A5C55">止</text>
<text x="84" y="250" font-size="5.2" fill="#6E6459" text-anchor="middle">足＝脚：站着的地方</text>
<text x="150" y="174" font-size="5.9" fill="#2F2A24">「足」是脚。知足不是觉得自己够了，</text>
<text x="150" y="190" font-size="5.9" fill="#2F2A24">是知道自己站在哪儿——站得稳的人不抢，</text>
<text x="150" y="204" font-size="5.9" fill="#2F2A24">不抢的人不容易被踩。</text>
<text x="24" y="282" font-size="6.0" fill="#A2503B">二 · 止：停住的那个动作</text>
<path d="M42,354 C62,334 82,320 102,318 C118,317 128,326 138,340" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M138,340 C132,348 124,352 116,354" fill="none" stroke="#C9B79A" stroke-width="0.6" stroke-dasharray="4 4"/>
<text x="110" y="308" font-size="4.8" fill="#A2503B" text-anchor="middle">顶点</text>
<line x1="110" y1="312" x2="110" y2="317" stroke="#A2503B" stroke-width="0.5"/>
<circle cx="90" cy="323" r="4.2" fill="none" stroke="#4A5C55" stroke-width="1"/>
<text x="74" y="372" font-size="4.9" fill="#4A5C55" text-anchor="middle">在这里停脚</text>
<text x="144" y="302" font-size="5.8" fill="#2F2A24">「止」是脚趾，是落点：</text>
<text x="144" y="316" font-size="5.8" fill="#2F2A24">把脚放下，就不较劲了。</text>
<text x="144" y="334" font-size="5.8" fill="#A2503B">「忍」是拉住自己，还在往前倾。</text>
<text x="144" y="354" font-size="5.9" fill="#6E6459">一个已经放下，一个还在争。</text>
<line x1="24" y1="380" x2="338" y2="380" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="390" width="340" height="46" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="406" font-size="5.2" fill="#2F2A24" text-anchor="middle">长久不是不死，是一直没到那个该翻过来的点。</text>
<text x="190" y="420" font-size="5.2" fill="#6E6459" text-anchor="middle">过了顶点还在迈步，就撞上「物壮则老」。</text>
<line x1="20" y1="448" x2="360" y2="448" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="462" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="478" font-size="8.4" fill="#2F2A24">知足不是心态好，是站得稳；站得稳的人不抢，不抢的人不容易被踩。</text>
<text x="20" y="494" font-size="8.4" fill="#2F2A24">忍是拉住自己，止是把脚放下；一个还在跟自己较劲，一个已经不较了。</text>
</svg>