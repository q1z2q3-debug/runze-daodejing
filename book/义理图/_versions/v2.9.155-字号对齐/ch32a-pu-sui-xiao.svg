<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 622" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="朴是木之未加斧斤：包得住，切不开" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="622" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 二 章 · 其 一</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">朴 虽 小</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">朴不是没有形状，是形状还没有被定下来。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.6" fill="#2F2A24" text-anchor="middle">「朴」，《说文》「木素也」，谓木之未加斧斤者；「小」，《说文》「物之微也」——微到分不出来。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459" text-anchor="middle">朴不是「无」，是「未分」：无的位置还在，形还没有被定死。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、木素：一段还没动过斧子的木头</text>
<rect x="26" y="164" width="328" height="118" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<rect x="92" y="204" width="132" height="34" fill="#E9DFCC" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="224" cy="221" rx="9" ry="17" fill="#E9DFCC" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="92" cy="221" rx="10" ry="17" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="92" cy="221" rx="6" ry="11" fill="none" stroke="#DCCBB0" stroke-width="0.7"/>
<ellipse cx="92" cy="221" rx="2.6" ry="5" fill="none" stroke="#DCCBB0" stroke-width="0.7"/>
<path d="M104,208 q10,6 0,12" fill="none" stroke="#CBBBA0" stroke-width="0.6"/>
<path d="M144,208 q10,6 0,12" fill="none" stroke="#CBBBA0" stroke-width="0.6"/>
<path d="M184,208 q10,6 0,12" fill="none" stroke="#CBBBA0" stroke-width="0.6"/>
<line x1="84" y1="242" x2="236" y2="242" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="158" y="188" font-size="4.2" fill="#8A7C69" text-anchor="middle">斧斤未加</text>
<text x="150" y="264" font-size="4.2" fill="#4A5C55" text-anchor="middle">木素：质在，形未定</text>
<rect x="252" y="202" width="40" height="40" fill="none" stroke="#DCCBB0" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="272" y="256" font-size="3.9" fill="#8A7C69" text-anchor="middle">可方</text>
<circle cx="326" cy="222" r="20" fill="none" stroke="#DCCBB0" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="326" y="256" font-size="3.9" fill="#8A7C69" text-anchor="middle">可圆</text>
<text x="190" y="296" font-size="4.2" fill="#8A7C69" text-anchor="middle">一切形都还只是可能；一动手，可能就收窄成一件事。</text>
<text x="24" y="320" font-size="5.1" fill="#4A5C55">二、两把尺子：同一段木，量出大与小</text>
<rect x="26" y="332" width="328" height="130" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<line x1="190" y1="344" x2="190" y2="450" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="128" cy="390" r="46" fill="none" stroke="#4A5C55" stroke-width="0.9" stroke-dasharray="4 4"/>
<rect x="96" y="382" width="62" height="16" fill="#E9DFCC" stroke="#2F2A24" stroke-width="0.8"/>
<ellipse cx="96" cy="390" rx="5" ry="8" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.7"/>
<text x="128" y="452" font-size="4.3" fill="#4A5C55" text-anchor="middle">大：说它包得住</text>
<text x="56" y="354" font-size="3.7" fill="#8A7C69">二十五章：强为之名曰大</text>
<rect x="216" y="378" width="80" height="20" fill="#E9DFCC" stroke="#2F2A24" stroke-width="0.8"/>
<ellipse cx="296" cy="388" rx="6" ry="10" fill="#E9DFCC" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="248" y1="372" x2="258" y2="388" stroke="#A2503B" stroke-width="1.0"/>
<line x1="268" y1="372" x2="258" y2="388" stroke="#A2503B" stroke-width="1.0"/>
<line x1="258" y1="388" x2="258" y2="398" stroke="#A2503B" stroke-width="1.0"/>
<circle cx="258" cy="402" r="2.4" fill="#A2503B" stroke="none"/>
<line x1="258" y1="406" x2="258" y2="418" stroke="#A2503B" stroke-width="0.6"/>
<text x="258" y="430" font-size="3.7" fill="#A2503B" text-anchor="middle">劈到这一点</text>
<text x="250" y="452" font-size="4.3" fill="#4A5C55" text-anchor="middle">小：说它切不开</text>
<text x="24" y="476" font-size="4.2" fill="#8A7C69">大，是说它包得住；小，是说它切不开——同一个东西，两把尺子量的是两件事。</text>
<rect x="20" y="490" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="508" font-size="5.8" fill="#2F2A24" text-anchor="middle">朴是道显化在世间的那一层：幽而微。</text>
<text x="190" y="522" font-size="4.4" fill="#6E6459" text-anchor="middle">幽，是看不见；微，是分不出——可它在那里，一直在生。</text>
<line x1="20" y1="550" x2="360" y2="550" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="564" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="580" font-size="8.4" fill="#2F2A24">朴不是没有形状，是形状还没有被定下来。</text>
<text x="20" y="596" font-size="8.4" fill="#2F2A24">说它「大」，是从它无所不包说；说它「小」，是从它无处可指说。</text>
</svg>