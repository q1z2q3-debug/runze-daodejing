<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="万物生于有，有生于无：先有那只空缸，才有这一缸活物" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="620" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 章 · 其 三</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一 只 缸</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">天下万物生于有，有生于无。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「反」是翻转，「弱」是柔曲——两者合起来才生出东西：翻转给出位，柔曲填得住那个位。</text>
<text x="190" y="127" font-size="4.5" fill="#6E6459">而这一切的根，在空处：壁围出空，空才生得出用。</text>
<text x="24" y="152" font-size="5.0" fill="#4A5C55">一、无：还没有东西进来</text>
<rect x="26" y="164" width="328" height="146" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="288" x2="340" y2="288" stroke="#DCCBB0" stroke-width="0.9"/>
<path d="M132,190 L126,274 L264,274 L258,190 Z" fill="#F6EFE0" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="126" y="266" width="138" height="10" fill="#E4D9C0" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="140" y="204" width="108" height="58" fill="none" stroke="#C9B79A" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="194" y="236" font-size="8.0" fill="#B8AC94" text-anchor="middle">空</text>
<text x="194" y="208" font-size="4.2" fill="#6E6459" text-anchor="middle">无：壁围出来的那块</text>
<text x="190" y="302" font-size="4.3" fill="#2F2A24" text-anchor="middle">缸先有了壁，壁围出一块空——万物还没有，位置已经有了</text>
<text x="24" y="328" font-size="5.0" fill="#4A5C55">二、有：水落进来，活物跟着生</text>
<rect x="26" y="340" width="328" height="146" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="464" x2="340" y2="464" stroke="#DCCBB0" stroke-width="0.9"/>
<path d="M132,366 L126,450 L264,450 L258,366 Z" fill="#F6EFE0" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="126" y="442" width="138" height="10" fill="#E4D9C0" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M129,396 L127,442 L263,442 L261,396 Z" fill="#DCE9E3" stroke="none"/>
<line x1="129" y1="396" x2="261" y2="396" stroke="#E6D8C2" stroke-width="0.7"/>
<path d="M150,440 q-4,-13 1,-26 q5,13 -1,26" fill="none" stroke="#4A5C55" stroke-width="1.0"/>
<path d="M162,440 q-4,-17 1,-34 q5,17 -1,34" fill="none" stroke="#4A5C55" stroke-width="1.0"/>
<path d="M176,440 q-4,-11 1,-22 q5,11 -1,22" fill="none" stroke="#4A5C55" stroke-width="1.0"/>
<path d="M196,414 q10,-7 20,0 q-10,7 -20,0 Z" fill="#E7C9B8" stroke="#A2503B" stroke-width="0.7"/>
<path d="M216,414 l7,-4 l0,8 Z" fill="#E7C9B8" stroke="#A2503B" stroke-width="0.7"/>
<path d="M222,432 q-9,-6 -18,0 q9,6 18,0 Z" fill="#E7C9B8" stroke="#A2503B" stroke-width="0.7"/>
<path d="M204,432 l-7,-4 l0,8 Z" fill="#E7C9B8" stroke="#A2503B" stroke-width="0.7"/>
<text x="196" y="388" font-size="4.1" fill="#6E6459" text-anchor="middle">有：水先落进来</text>
<path d="M150,360 l6,20" stroke="#A9C3BC" stroke-width="0.5" stroke-dasharray="2 3"/>
<circle cx="152" cy="362" r="2.0" fill="#A9C3BC" stroke="none"/>
<circle cx="155" cy="370" r="1.6" fill="#A9C3BC" stroke="none"/>
<text x="190" y="478" font-size="4.3" fill="#2F2A24" text-anchor="middle">水至柔，却盛得住鱼与水草——弱者的用，就在这儿</text>
<line x1="24" y1="494" x2="356" y2="494" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="502" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="518" font-size="5.0" fill="#2F2A24" text-anchor="middle">天下万物生于有，有生于无。</text>
<text x="190" y="531" font-size="4.6" fill="#4A5C55" text-anchor="middle">先把壁立起来，空才有；空有了，用才生。</text>
<line x1="20" y1="548" x2="360" y2="548" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="562" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="578" font-size="8.4" fill="#2F2A24">天下万物生于有，有生于无。</text>
<text x="20" y="594" font-size="8.4" fill="#2F2A24">先把壁立起来，空才有；空有了，用才生。</text>
</svg>