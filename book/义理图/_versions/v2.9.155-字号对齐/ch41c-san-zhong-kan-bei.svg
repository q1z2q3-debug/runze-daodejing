<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 606" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="下士看见壁，就把空当作「没有」" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="606" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 一 章 · 有 无</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">三种看杯</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">有之以为利，无之以为用。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">上士闻道，勤能行之；中士闻道，若存若亡；下士闻道，大笑之。</text>
<text x="190" y="127" font-size="5.2" fill="#A2503B" text-anchor="middle">弗笑，不足以为道。</text>
<text x="24" y="162" font-size="8.6" fill="#A2503B">下士</text>
<text x="24" y="176" font-size="5.8" fill="#6E6459">只看见壁</text>
<path d="M80,164 L87,216 L125,216 L132,164 " fill="none" stroke="#2F2A24" stroke-width="1"/><line x1="87" y1="216" x2="125" y2="216" stroke="#2F2A24" stroke-width="1"/><ellipse cx="106" cy="166" rx="25" ry="5" fill="none" stroke="#2F2A24" stroke-width="1"/>
<text x="106" y="186" font-size="9.0" fill="#A2503B" text-anchor="middle">×</text>
<text x="138" y="174" font-size="5.4" fill="#A2503B">空＝</text>
<text x="144" y="186" font-size="5.4" fill="#A2503B">「没有」</text>
<text x="170" y="178" font-size="5.2" fill="#2F2A24">他摸得到的是壁：有形、有成果、有输赢、有定型。</text>
<text x="170" y="194" font-size="5.2" fill="#6E6459">壁里的那一块，他听成「不存在」。</text>
<text x="170" y="214" font-size="5.2" fill="#A2503B">所以他笑——笑的是那块空。</text>
<text x="24" y="278" font-size="8.6" fill="#2F2A24">中士</text>
<text x="24" y="292" font-size="5.6" fill="#6E6459">看见空，不敢松手</text>
<path d="M80,280 L87,332 L125,332 L132,280 " fill="none" stroke="#2F2A24" stroke-width="1"/><line x1="87" y1="332" x2="125" y2="332" stroke="#2F2A24" stroke-width="1"/><ellipse cx="106" cy="282" rx="25" ry="5" fill="none" stroke="#A2503B" stroke-width="0.6" stroke-dasharray="4 4"/>
<text x="106" y="306" font-size="6.0" fill="#A2503B" text-anchor="middle">空</text>
<path d="M134,284 a12,9 0 0 1 14,4" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="148" y1="288" x2="150" y2="296" stroke="#2F2A24" stroke-width="1"/>
<text x="136" y="308" font-size="4.9" fill="#6E6459">手抓着壁</text>
<text x="170" y="294" font-size="5.2" fill="#2F2A24">他看得出空有用，可一动手，还是照着壁去动。</text>
<text x="170" y="310" font-size="5.2" fill="#6E6459">早上信，晚上疑；讲的时候通，做的时候断。</text>
<text x="170" y="330" font-size="5.2" fill="#2F2A24">知道了是一回事，松手是另一回事。</text>
<text x="24" y="394" font-size="8.6" fill="#4A5C55">上士</text>
<text x="24" y="408" font-size="5.8" fill="#6E6459">壁空一起用</text>
<path d="M80,396 L87,448 L125,448 L132,396 " fill="none" stroke="#2F2A24" stroke-width="1"/><line x1="87" y1="448" x2="125" y2="448" stroke="#2F2A24" stroke-width="1"/><ellipse cx="106" cy="398" rx="25" ry="5" fill="none" stroke="#2F2A24" stroke-width="1"/><path d="M83,416 L129,416 L126,447 L86,447 Z" fill="#DCE6E0" stroke="none"/><line x1="83" y1="416" x2="129" y2="416" stroke="#4A5C55" stroke-width="0.7"/>
<text x="106" y="424" font-size="5.6" fill="#4A5C55" text-anchor="middle">水</text>
<path d="M76,388 a30,10 0 0 1 60,0" fill="none" stroke="#4A5C55" stroke-width="0.7"/>
<text x="106" y="384" font-size="5.0" fill="#4A5C55" text-anchor="middle">一体</text>
<text x="170" y="410" font-size="5.2" fill="#2F2A24">壁围出空，空盛住水；两样一起，杯才成杯。</text>
<text x="170" y="426" font-size="5.2" fill="#6E6459">他不照那条线活，所以线一撤，路就通了。</text>
<text x="170" y="446" font-size="5.2" fill="#4A5C55">弗笑，不足以为道：被笑，是道的常态。</text>
<rect x="20" y="472" width="340" height="46" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="488" font-size="5.2" fill="#2F2A24" text-anchor="middle">下士把空当成「没有」，所以只认壁；他并没有看错——</text>
<text x="190" y="503" font-size="5.2" fill="#6E6459" text-anchor="middle">空不是没有，是这个器能用的那一处。</text>
<text x="190" y="516" font-size="5.2" fill="#4A5C55" text-anchor="middle">有之以为利，无之以为用。</text>
<line x1="20" y1="532" x2="360" y2="532" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="546" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="562" font-size="8.4" fill="#2F2A24">下士没有看错，他看的是背面；他只是不知道那件东西还有另一面。</text>
<text x="20" y="578" font-size="8.4" fill="#2F2A24">有之以为利，无之以为用。</text>
</svg>