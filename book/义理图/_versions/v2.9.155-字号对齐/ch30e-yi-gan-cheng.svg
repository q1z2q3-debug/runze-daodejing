<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 758" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="不得已，是全章唯一的分量" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="758" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 章 · 一 杆 秤（补图）</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">不得已</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">果而不得已，果而勿强。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「矜」在心里，「伐」在嘴上，「骄」在气上——心、口、气，一层比一层外。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">「果而不得已」不是第四个「勿」，它是前三个「勿」的理由。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、只有不得已：这一头压得住</text>
<rect x="26" y="164" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="150" y1="312" x2="230" y2="312" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="190" y1="312" x2="190" y2="208" stroke="#2F2A24" stroke-width="1.4"/>
<circle cx="190" cy="208" r="3.0" fill="#2F2A24"/>
<line x1="96" y1="232" x2="284" y2="208" stroke="#2F2A24" stroke-width="1.6"/>
<line x1="96" y1="232" x2="96" y2="266" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M62,266 L130,266 L122,278 L70,278 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="284" y1="208" x2="284" y2="242" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M250,242 L318,242 L310,254 L258,254 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="62" y="268" width="68" height="20" fill="#F2EADA" stroke="#A2503B" stroke-width="0.9"/>
<text x="96" y="282" font-size="4.3" fill="#A2503B" text-anchor="middle">不得已</text>
<text x="284" y="260" font-size="3.7" fill="#A79A86" text-anchor="middle">（空）</text>
<text x="190" y="330" font-size="4.1" fill="#8A7C69" text-anchor="middle">四个「勿」之前，先有这一张许可证：我本来不想打</text>
<text x="24" y="364" font-size="5.1" fill="#A2503B">二、果后生矜、生伐、生骄：秤翻了</text>
<rect x="26" y="376" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="150" y1="524" x2="230" y2="524" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="190" y1="524" x2="190" y2="420" stroke="#2F2A24" stroke-width="1.4"/>
<circle cx="190" cy="420" r="3.0" fill="#2F2A24"/>
<line x1="96" y1="420" x2="284" y2="446" stroke="#2F2A24" stroke-width="1.6"/>
<line x1="96" y1="420" x2="96" y2="454" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M62,454 L130,454 L122,466 L70,466 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="284" y1="446" x2="284" y2="480" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M250,480 L318,480 L310,492 L258,492 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="62" y="456" width="68" height="20" fill="#F2EADA" stroke="#A2503B" stroke-width="0.9"/>
<text x="96" y="470" font-size="4.3" fill="#A2503B" text-anchor="middle">不得已</text>
<rect x="250" y="482" width="68" height="17" fill="#FBF6EC" stroke="#C9B79A" stroke-width="0.9"/>
<text x="284" y="494" font-size="3.8" fill="#2F2A24" text-anchor="middle">矜·心</text>
<rect x="250" y="473" width="68" height="17" fill="#FBF6EC" stroke="#C9B79A" stroke-width="0.9"/>
<text x="284" y="485" font-size="3.8" fill="#2F2A24" text-anchor="middle">伐·口</text>
<rect x="250" y="464" width="68" height="17" fill="#FBF6EC" stroke="#C9B79A" stroke-width="0.9"/>
<text x="284" y="476" font-size="3.8" fill="#2F2A24" text-anchor="middle">骄·气</text>
<text x="190" y="542" font-size="4.1" fill="#8A7C69" text-anchor="middle">本来是止损，变成了证明自己——这一念，往往在胜利当天就来</text>
<text x="24" y="572" font-size="4.8" fill="#2F2A24">「勿矜」在心里：自己觉得自己高明；「勿伐」在嘴上：说出来给人听；「勿骄」在气上：整个人往上抬。</text>
<text x="24" y="588" font-size="4.8" fill="#2F2A24">三样一层比一层外。而「不得已」是它们共同的理由：因为本来不想打，所以打完不必得意。</text>
<text x="24" y="606" font-size="4.8" fill="#4A5C55">它既是许可证，也是事后不许得意的凭据；末一句「果而勿强」，连「我很强」都不许说。</text>
<line x1="24" y1="624" x2="338" y2="624" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="632" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="648" font-size="6.0" fill="#2F2A24" text-anchor="middle">四个「勿」之前，先有这一张许可证。</text>
<text x="190" y="660" font-size="5.0" fill="#4A5C55" text-anchor="middle">它压得住，秤才平；它一松，矜、伐、骄就压下来了。</text>
<line x1="20" y1="686" x2="360" y2="686" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="700" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="716" font-size="8.4" fill="#2F2A24">不得已三个字，是全章的秤；它既是许可证，也是不许得意的凭据。</text>
<text x="20" y="732" font-size="8.4" fill="#2F2A24">本来是止损，变成了证明自己——这一念，往往在胜利当天就来了。</text>
</svg>