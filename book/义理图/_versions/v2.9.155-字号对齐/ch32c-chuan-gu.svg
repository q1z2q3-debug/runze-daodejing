<text x="96" y="256" font-size="3.9" fill="#6E6459" text-anchor="middle">宽</text>
<text x="96" y="204" font-size="3.9" fill="#6E6459" text-anchor="middle">窄</text>
<text x="152" y="230" font-size="3.9" fill="#6E6459" text-anchor="middle">弯</text>
<text x="34" y="346" font-size="3.9" fill="#8A7C69">六条进来，一条也没被改成别人的样子；源头看不见，就看它流到的那一段。</text>
<rect x="20" y="366" width="340" height="30" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="378" font-size="4.2" fill="#A2503B" text-anchor="middle">对照第二十九章的「合」：把支流削平成一条槽，那是人之合。</text>
<text x="190" y="390" font-size="4.2" fill="#6E6459" text-anchor="middle">不改河道而能纳，这才是「和」——合要一样，和要各是各。</text>
<rect x="20" y="412" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="430" font-size="5.2" fill="#2F2A24" text-anchor="middle">万千差异，同归一道，而不失各自的自性——这就是「和」。</text>
<text x="190" y="444" font-size="4.4" fill="#6E6459" text-anchor="middle">来者不必先改成别人的样子，才准进来。</text>
<line x1="20" y1="472" x2="360" y2="472" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="486" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="502" font-size="8.4" fill="#2F2A24">江海之为大，在于它不挑水。</text>
</svg>