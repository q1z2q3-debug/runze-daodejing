<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="528" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 二 章 · 其 三</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">川 谷 与 江 海</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">譬道之在天下，犹川谷之于江海。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.6" fill="#2F2A24" text-anchor="middle">「川」，《说文》「贯穿通流水也」；「谷」，《说文》「泉出通川为谷」——川是流，谷是口。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">本书取「江海之于川谷」一读：万物如百川，归入道这个总汇——方向向内，向总。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">六条谷：各有各的宽窄、走向、急缓</text>
<rect x="26" y="164" width="328" height="190" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<rect x="286" y="178" width="62" height="160" fill="#DCE5DF" stroke="#B9C7BE" stroke-width="0.9" rx="6"/>
<path d="M296,198 q12,-4 24,0 q12,4 22,0" fill="none" stroke="#9FB0A6" stroke-width="0.8"/>
