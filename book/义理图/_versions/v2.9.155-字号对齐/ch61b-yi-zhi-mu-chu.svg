<text x="70" y="424" font-size="4.6" fill="#4A5C55" text-anchor="middle">牝：静着，不动</text>
<text x="168" y="424" font-size="4.4" fill="#6E6459" text-anchor="middle">跟着的那群，都是它孵的</text>
<text x="24" y="450" font-size="4.8" fill="#2F2A24">「胜」是担得起，不是打得赢：母鸡不争，脚边那一群都是它的。</text>
<text x="24" y="466" font-size="4.9" fill="#2F2A24">静不是不动，是不必动；下不是低人一等，是让水自己流过来。</text>
<text x="24" y="482" font-size="5.1" fill="#4A5C55">以静为下：静到那个位置，就有人来。</text>
<line x1="24" y1="500" x2="338" y2="500" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="508" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="524" font-size="5.8" fill="#2F2A24" text-anchor="middle">「胜」是担得起，不是打得赢；</text>
<text x="190" y="536" font-size="5.2" fill="#4A5C55" text-anchor="middle">母畜担得起，因为后面那一群都是它生的。</text>
<line x1="20" y1="562" x2="360" y2="562" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="576" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="592" font-size="8.4" fill="#2F2A24">「胜」是担得起，不是打得赢；母畜担得起，因为后面那一群都是它生的。</text>
</svg>