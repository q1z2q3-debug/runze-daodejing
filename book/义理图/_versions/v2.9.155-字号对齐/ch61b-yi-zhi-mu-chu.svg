<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="牝常以静胜牡：胜是担得起，不是打得赢" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="620" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 一 章 · 牝</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只母鸡</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">牝常以静胜牡，以静为下。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「牝」是雌，「牡」是雄；「胜」训「肩」——是担得起，不是打得赢。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">母鸡不争，可脚边那一群，都是它孵出来的。</text>
<text x="24" y="146" font-size="5.4" fill="#A2503B">一、牡：昂着头，争那一步</text>
<line x1="24" y1="258" x2="240" y2="258" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="86" cy="235.0" rx="29.9" ry="19.549999999999997" fill="#EFE6D4" stroke="#A2503B" stroke-width="1"/>
<line x1="109.0" y1="230.4" x2="113.60000000000001" y2="218.9" stroke="#A2503B" stroke-width="1.2"/>
<circle cx="117.05000000000001" cy="215.45000000000002" r="5.75" fill="none" stroke="#A2503B" stroke-width="1"/>
<path d="M114.75000000000001,209.70000000000002 C114.75000000000001,205.1 117.05000000000001,205.1 117.05000000000001,208.55" fill="none" stroke="#A2503B" stroke-width="0.8"/>
