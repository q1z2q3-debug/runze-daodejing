<path d="M122.80000000000001,215.45000000000002 L128.55,217.75 L122.80000000000001,220.05 Z" fill="none" stroke="#A2503B" stroke-width="0.7"/>
<line x1="53.800000000000004" y1="216.1" x2="40.0" y2="206.9" stroke="#A2503B" stroke-width="0.8"/>
<line x1="53.800000000000004" y1="224.1" x2="40.0" y2="214.9" stroke="#A2503B" stroke-width="0.8"/>
<line x1="76.8" y1="252.55" x2="76.8" y2="258" stroke="#A2503B" stroke-width="1"/>
<line x1="97.5" y1="252.55" x2="97.5" y2="258" stroke="#A2503B" stroke-width="1"/>
<text x="160" y="206" font-size="4.8" fill="#A2503B">一只，站着</text>
<text x="160" y="218" font-size="4.4" fill="#6E6459">冠最高，脚边没有别的</text>
<text x="86" y="272" font-size="4.6" fill="#A2503B" text-anchor="middle">牡：以力相争</text>
<text x="24" y="292" font-size="5.4" fill="#4A5C55">二、牝：静着卧下，脚边一群</text>
<line x1="24" y1="410" x2="240" y2="410" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="70" cy="400.1" rx="28.6" ry="18.700000000000003" fill="#EFE6D4" stroke="#4A5C55" stroke-width="1"/>
