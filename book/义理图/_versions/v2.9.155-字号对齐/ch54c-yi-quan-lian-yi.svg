<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 604" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="修之于身，其德乃真……其德乃普：五级不是爬上去的，是渗上去的" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="604" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 四 章 · 渗</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一圈涟漪</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">修之于身……修之于天下，其德乃普。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.0" fill="#2F2A24" text-anchor="middle">五个字不是四句好话，是四个刻度：余是量（多到溢出来）／长是时／丰是厚／普是匀。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">「普」，《说文》「日无色也」——太阳没有颜色的时候，才是匀的。</text>
<text x="24" y="146" font-size="5.4" fill="#A2503B">一滴落下去，一圈一圈往外渗</text>
<circle cx="190" cy="298" r="120" fill="none" stroke="#D8CBB2" stroke-width="0.6"/>
<text x="190" y="172" font-size="4.8" fill="#D8CBB2" text-anchor="middle">普·天下</text>
<circle cx="190" cy="298" r="96" fill="none" stroke="#B9A98C" stroke-width="0.7"/>
<text x="190" y="196" font-size="4.8" fill="#B9A98C" text-anchor="middle">丰·邦</text>
<circle cx="190" cy="298" r="72" fill="none" stroke="#4A5C55" stroke-width="0.85"/>
<text x="190" y="220" font-size="4.8" fill="#4A5C55" text-anchor="middle">长·乡</text>
<circle cx="190" cy="298" r="48" fill="none" stroke="#7A8C7C" stroke-width="0.9"/>
<text x="190" y="244" font-size="4.8" fill="#7A8C7C" text-anchor="middle">余·家</text>
<circle cx="190" cy="298" r="24" fill="none" stroke="#A2503B" stroke-width="1.1"/>
<text x="190" y="268" font-size="4.8" fill="#A2503B" text-anchor="middle">真·身</text>
<circle cx="190" cy="298" r="4" fill="#2F2A24"/>
<text x="190" y="314" font-size="5.0" fill="#2F2A24" text-anchor="middle">身</text>
<text x="24" y="434" font-size="5.2" fill="#2F2A24">「修之于天下」不是「把天下修好」：不是你去修它，是它被渗到。</text>
<text x="24" y="450" font-size="5.2" fill="#2F2A24">你去改一个家，那个家就被你压住；你身上有余，那个家就自己松一点。</text>
<text x="24" y="466" font-size="5.4" fill="#4A5C55">从身上长出来的，会渗过去；从外面压过去的，会被顶回来。</text>
<line x1="24" y1="484" x2="338" y2="484" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="492" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="508" font-size="6.0" fill="#2F2A24" text-anchor="middle">德往外走，先多，再久，再厚，最后匀；</text>
<text x="190" y="520" font-size="6.0" fill="#4A5C55" text-anchor="middle">匀了才叫普，不是到处都有，是到处一样。</text>
<line x1="20" y1="546" x2="360" y2="546" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="560" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="576" font-size="8.4" fill="#2F2A24">德往外走，先多，再久，再厚，最后匀；匀了才叫普，不是到处都有，是到处一样。</text>
</svg>