<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="智是拿一叠词往别人身上挂，明是灯照见自己手里也有一叠" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="656" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 三 章 · 其 三</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">词 牌 与 灯</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">知人者智，自知者明。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.6" fill="#2F2A24" text-anchor="middle">「智」，《说文》「识词也」——识别，并且能把它说出来；它离开名就无法工作。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459" text-anchor="middle">「明」，《说文》「照也」——本义是光照。明不是想通的，是被照亮的。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、智：一叠词牌，往别人身上挂</text>
<rect x="26" y="164" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<line x1="40" y1="290" x2="340" y2="290" stroke="#2F2A24" stroke-width="0.9"/>
<polygon points="106,246 250,214 250,282" fill="#F6EFDC" stroke="#D9C9A8" stroke-width="0.6" opacity="0.8"/>
<circle cx="68" cy="234" r="5.6" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="68" y1="240" x2="68" y2="264" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="68" y1="264" x2="60" y2="290" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="68" y1="264" x2="76" y2="290" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="68" y1="246" x2="92" y2="248" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="98" cy="246" rx="7" ry="2.6" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M98,244 q-3,-6 0,-9 q3,3 0,9" fill="#A2503B" stroke="none" opacity="0.9"/>
<line x1="98" y1="248.6" x2="98" y2="252" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="68" y1="248" x2="58" y2="258" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="44" y="256" width="22" height="7" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<rect x="46" y="251" width="20" height="6" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.5"/>
<rect x="48" y="247" width="18" height="5" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.5"/>
<text x="32" y="274" font-size="3.6" fill="#A2503B">一叠词</text>
<text x="68" y="304" font-size="4.0" fill="#8A7C69" text-anchor="middle">自己</text>
<circle cx="246" cy="234" r="5.6" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="246" y1="240" x2="246" y2="264" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="246" y1="264" x2="238" y2="290" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="246" y1="264" x2="254" y2="290" stroke="#2F2A24" stroke-width="1.1"/>
<rect x="232" y="244" width="26" height="11" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<text x="245" y="252" font-size="3.8" fill="#A2503B" text-anchor="middle">善</text>
<rect x="232" y="259" width="26" height="11" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<text x="245" y="267" font-size="3.8" fill="#A2503B" text-anchor="middle">能</text>
<rect x="232" y="274" width="26" height="11" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<text x="245" y="282" font-size="3.8" fill="#A2503B" text-anchor="middle">庸</text>
<text x="246" y="304" font-size="4.0" fill="#8A7C69" text-anchor="middle">人</text>
<text x="190" y="330" font-size="4.3" fill="#2F2A24" text-anchor="middle">智先有词，才认得出——它离开名就没法工作。</text>
<text x="24" y="354" font-size="5.1" fill="#A2503B">二、明：灯转过来，照见自己手里也有一叠</text>
<rect x="26" y="366" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<line x1="40" y1="492" x2="340" y2="492" stroke="#2F2A24" stroke-width="0.9"/>
<polygon points="212,434 146,466 232,490" fill="#F6EFDC" stroke="#D9C9A8" stroke-width="0.6" opacity="0.8"/>
<circle cx="190" cy="436" r="5.6" fill="none" stroke="#4A5C55" stroke-width="1.0"/>
<line x1="190" y1="442" x2="190" y2="466" stroke="#4A5C55" stroke-width="1.2"/>
<line x1="190" y1="466" x2="182" y2="492" stroke="#4A5C55" stroke-width="1.1"/>
<line x1="190" y1="466" x2="198" y2="492" stroke="#4A5C55" stroke-width="1.1"/>
<line x1="190" y1="446" x2="206" y2="438" stroke="#4A5C55" stroke-width="1.0"/>
<ellipse cx="212" cy="434" rx="7" ry="2.6" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M212,432 q-3,-6 0,-9 q3,3 0,9" fill="#A2503B" stroke="none" opacity="0.9"/>
<line x1="212" y1="436.6" x2="212" y2="440" stroke="#2F2A24" stroke-width="0.8"/>
<text x="190" y="506" font-size="4.0" fill="#8A7C69" text-anchor="middle">自己</text>
<rect x="150" y="460" width="34" height="13" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.7"/>
<text x="167" y="469" font-size="3.8" fill="#A2503B" text-anchor="middle">我要赢</text>
<text x="54" y="462" font-size="3.6" fill="#8A7C69">手里那一叠里，最上面一张</text>
<line x1="106" y1="466" x2="146" y2="464" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="240" y="422" font-size="4.0" fill="#8A7C69">照别人，</text>
<text x="240" y="432" font-size="3.8" fill="#8A7C69">换来判断、先手、</text>
<text x="240" y="442" font-size="3.8" fill="#8A7C69">一句「他看得真准」</text>
<text x="240" y="456" font-size="4.0" fill="#A2503B">照自己，</text>
<text x="240" y="466" font-size="3.8" fill="#A2503B">只照见一件</text>
<text x="240" y="476" font-size="3.8" fill="#A2503B">不太体面的事</text>
<text x="190" y="532" font-size="4.3" fill="#2F2A24" text-anchor="middle">同一盏灯，转过来；同一叠词，压在自己手上。</text>
<line x1="24" y1="546" x2="356" y2="546" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="554" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="570" font-size="5.6" fill="#2F2A24" text-anchor="middle">智是识词，明是照见。</text>
<text x="190" y="583" font-size="4.6" fill="#4A5C55" text-anchor="middle">一个拿词去量人，一个把灯照到自己手上。</text>
<line x1="20" y1="600" x2="360" y2="600" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="614" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="630" font-size="8.4" fill="#2F2A24">智是识词，明是照见；智越用越熟，明越照越静。</text>
</svg>