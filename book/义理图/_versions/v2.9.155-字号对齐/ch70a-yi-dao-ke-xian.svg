<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 676" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鼎上划一道线，长短不齐的东西都拿来比；它不是道理，是尺子" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="676" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 章 · 则</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一道刻线</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">知我者希，则我者贵。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「则」，《说文》「等画物也」，金文从鼎从刀——在鼎上划一道线，用来把东西比齐。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">比齐的不是东西，是那道刻痕；把我当成它，才叫「则我」。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、比齐：长短不齐的木，对着同一道线</text>
<rect x="26" y="162" width="328" height="134" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M64,192 L120,192 L117,230 L67,230 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<path d="M67,192 L67,185 L77,185 L77,192" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M107,192 L107,185 L117,185 L117,192" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="75" y1="230" x2="70" y2="290" stroke="#2F2A24" stroke-width="1"/>
<line x1="92" y1="230" x2="92" y2="290" stroke="#2F2A24" stroke-width="1"/>
<line x1="109" y1="230" x2="114" y2="290" stroke="#2F2A24" stroke-width="1"/>
<text x="92" y="224" font-size="4.4" fill="#6E6459" text-anchor="middle">鼎</text>
<line x1="70" y1="206" x2="330" y2="206" stroke="#A2503B" stroke-width="1.6"/>
<text x="330" y="201" font-size="4.8" fill="#A2503B" text-anchor="end">则</text>
<rect x="168" y="232" width="13" height="58" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="174.5" y1="230" x2="174.5" y2="206" stroke="#4A5C55" stroke-width="0.8" stroke-dasharray="3 3"/>
<rect x="218" y="250" width="13" height="40" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="224.5" y1="248" x2="224.5" y2="206" stroke="#4A5C55" stroke-width="0.8" stroke-dasharray="3 3"/>
<rect x="268" y="270" width="13" height="20" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="274.5" y1="268" x2="274.5" y2="206" stroke="#4A5C55" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="34" y1="290" x2="346" y2="290" stroke="#2F2A24" stroke-width="1"/>
<text x="190" y="310" font-size="4.6" fill="#4A5C55" text-anchor="middle">线不评价长短：它只把长短显出来，比齐了，谁长谁短自己看见</text>
<text x="24" y="330" font-size="4.8" fill="#A2503B">二、一垂一刻：天上那道，刻到鼎上这道</text>
<rect x="26" y="342" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M52,386 Q190,350 328,386" fill="none" stroke="#2F2A24" stroke-width="1"/>
<text x="58" y="380" font-size="4.6" fill="#6E6459" text-anchor="middle">天</text>
<line x1="152" y1="368" x2="152" y2="390" stroke="#A2503B" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="190" y1="368" x2="190" y2="390" stroke="#A2503B" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="228" y1="368" x2="228" y2="390" stroke="#A2503B" stroke-width="1" stroke-dasharray="3 2"/>
<text x="190" y="362" font-size="4.2" fill="#A2503B" text-anchor="middle">垂 象</text>
<path d="M164,408 L216,408 L213,442 L167,442 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<path d="M167,408 L167,401 L177,401 L177,408" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M203,408 L203,401 L213,401 L213,408" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="60" y1="464" x2="320" y2="464" stroke="#2F2A24" stroke-width="1"/>
<line x1="175" y1="442" x2="170" y2="464" stroke="#2F2A24" stroke-width="1"/>
<line x1="190" y1="442" x2="190" y2="464" stroke="#2F2A24" stroke-width="1"/>
<line x1="205" y1="442" x2="210" y2="464" stroke="#2F2A24" stroke-width="1"/>
<line x1="170" y1="421" x2="210" y2="421" stroke="#A2503B" stroke-width="1.6"/>
<line x1="190" y1="392" x2="190" y2="404" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arr2)"/>
<text x="200" y="400" font-size="4.0" fill="#4A5C55">刻</text>
<text x="292" y="424" font-size="4.2" fill="#4A5C55" text-anchor="middle">圣人则之</text>
<text x="190" y="498" font-size="4.6" fill="#4A5C55" text-anchor="middle">天先垂了一道，圣人把它刻下来：一垂一刻，是同一个动作的两半</text>
<text x="24" y="514" font-size="4.8" fill="#2F2A24">则不是效仿。效仿是照着做，则是在自己这口鼎上划同一道线。</text>
<text x="24" y="530" font-size="4.8" fill="#2F2A24">线一划下，长短就显出来；人一站上去，自己就知道差在哪。</text>
<text x="24" y="548" font-size="5.0" fill="#4A5C55">故曰「则我者贵」：贵不在人多，在那道线被当真过。</text>
<line x1="24" y1="564" x2="338" y2="564" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="572" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="587" font-size="5.4" fill="#2F2A24" text-anchor="middle">则不评价，只显出来；天垂一道，人刻一道。</text>
<text x="190" y="600" font-size="4.7" fill="#4A5C55" text-anchor="middle">把我当成那道刻线：不是学我，是拿我比。</text>
<line x1="20" y1="626" x2="360" y2="626" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="640" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="656" font-size="8.4" fill="#2F2A24">吾言甚易知，甚易行；天下莫能知，莫能行。</text>
<text x="20" y="672" font-size="8.4" fill="#2F2A24">易者，非浅也，直也；无仪式，无秘传，无门槛——而无人走，故难不在道。</text>
</svg>