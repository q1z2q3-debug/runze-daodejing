<text x="214" y="522" font-size="3.6" fill="#8A7C69" text-anchor="middle">今</text>
<text x="304" y="522" font-size="3.6" fill="#8A7C69" text-anchor="middle">明</text>
<text x="330" y="428" font-size="6.0" fill="#4A5C55" text-anchor="middle">信</text>
<text x="330" y="440" font-size="3.7" fill="#6E6459" text-anchor="middle">不催它，</text>
<text x="330" y="450" font-size="3.7" fill="#6E6459" text-anchor="middle">每年这时候</text>
<text x="330" y="460" font-size="3.7" fill="#6E6459" text-anchor="middle">都来</text>
<text x="190" y="538" font-size="3.7" fill="#8A7C69" text-anchor="middle">精不是精气，是去粗取精剩下的那一点；信不是守信，是节律不失期。</text>
<text x="24" y="575" font-size="5.0" fill="#4A5C55">二、臼与田：精在臼底，信在田里</text>
<text x="24" y="594" font-size="4.9" fill="#2F2A24">先有象，后成物：有形世界，从这个恍惚的本源里生发。</text>
<text x="24" y="610" font-size="4.9" fill="#2F2A24">「精」，《说文》「择也」，本义是舂过的精米——说的是纯，不是玄。</text>
<text x="24" y="628" font-size="4.9" fill="#4A5C55">四层是一条递进：看不见，但不是没有；有，而且真；真，而且有常。</text>
<line x1="24" y1="646" x2="338" y2="646" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="654" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="670" font-size="5.4" fill="#2F2A24" text-anchor="middle">看不见的东西，不等于靠不住的东西。</text>
<text x="190" y="682" font-size="4.8" fill="#4A5C55" text-anchor="middle">精，是舂过的米：去掉糠皮，剩下那一点。</text>
<line x1="20" y1="708" x2="360" y2="708" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="722" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="738" font-size="8.4" fill="#2F2A24">看不见的东西，不等于靠不住的东西。</text>
<text x="20" y="754" font-size="8.4" fill="#2F2A24">精，是舂过的米：去掉糠皮，剩下那一点。</text>
</svg>