<svg viewBox="0 0 380 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="其中有象，其中有物，其中有精，其中有信" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
