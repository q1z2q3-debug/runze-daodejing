<text x="24" y="412" font-size="6.0" fill="#A2503B">精</text>
<text x="24" y="424" font-size="3.7" fill="#6E6459">舂过的米：</text>
<text x="24" y="434" font-size="3.7" fill="#6E6459">去掉糠皮，</text>
<text x="24" y="444" font-size="3.7" fill="#6E6459">剩下那一点</text>
