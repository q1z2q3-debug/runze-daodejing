<rect x="0" y="0" width="380" height="780" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 一 章 · 象 物 精 信</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一株稻的四层</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">惚兮恍兮，其中有象；恍兮惚兮，其中有物。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">一层比一层近实，一层比一层离名。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">看不见，但不是没有；有，而且真；真，而且有常。</text>
