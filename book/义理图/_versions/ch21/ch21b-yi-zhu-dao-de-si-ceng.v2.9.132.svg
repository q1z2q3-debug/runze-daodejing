<text x="66" y="224" font-size="6.0" fill="#A2503B">象</text>
<text x="66" y="236" font-size="3.8" fill="#6E6459">还没固化的样子</text>
<line x1="104" y1="230" x2="153" y2="240" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="210" y="288" font-size="6.0" fill="#4A5C55">物</text>
<text x="210" y="300" font-size="3.8" fill="#6E6459">已经成形的东西</text>
<line x1="206" y1="292" x2="172" y2="268" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="190" y="318" font-size="3.8" fill="#8A7C69" text-anchor="middle">同一穗：上段还是样子，下段已成粒子——先有象，后成物。</text>
<text x="24" y="347" font-size="5.0" fill="#A2503B">一、田里的穗：象在上游，物在下游</text>
