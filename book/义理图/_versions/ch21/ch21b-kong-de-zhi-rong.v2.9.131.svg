<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 730" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="孔德之容，惟道是从：德不占地方，道才进得来" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="730" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 一 章 · 一 枚 带 孔 的 璧</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一枚带孔的璧</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">孔，大也、空也、通也：三读各异，落处是一处。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">「孔」有三读：河上公读「大」，王弼读「空」，《说文》本义是「通」。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459">三个读法落在一件东西上：一枚中间穿孔的玉璧。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、璧：环体是「大」，孔里是「空」，孔穿过去是「通」</text>
<rect x="26" y="164" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="150" cy="252" r="62" fill="#F6EEE0" stroke="#2F2A24" stroke-width="1.4"/>
