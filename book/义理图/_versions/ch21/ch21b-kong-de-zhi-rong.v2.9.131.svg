<text x="120" y="488" font-size="4.1" fill="#8A7C69" text-anchor="middle">水在口上打住</text>
<line x1="246" y1="378" x2="246" y2="396" stroke="#4A5C55" stroke-width="0.7"/>
<line x1="258" y1="378" x2="258" y2="396" stroke="#4A5C55" stroke-width="0.7"/>
<line x1="270" y1="378" x2="270" y2="396" stroke="#4A5C55" stroke-width="0.7"/>
<text x="258" y="488" font-size="4.1" fill="#4A5C55" text-anchor="middle">水一直进得去</text>
<text x="190" y="510" font-size="4.2" fill="#2F2A24" text-anchor="middle">空不是没有，是留出可以进的那处</text>
<text x="24" y="544" font-size="4.8" fill="#2F2A24">「孔德之容」：不是先修出一份德、再去从道；是德的一切呈现，本来就只从道出。</text>
<text x="24" y="560" font-size="4.8" fill="#2F2A24">「容」是描摹，不是定义——第十五章「强为之容」也是描摹。</text>
<text x="24" y="578" font-size="4.8" fill="#4A5C55">德若自己占满了，道就进不来。</text>
<line x1="24" y1="596" x2="338" y2="596" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="604" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="620" font-size="6.0" fill="#2F2A24" text-anchor="middle">孔德之容，惟道是从。</text>
<text x="190" y="632" font-size="5.0" fill="#4A5C55" text-anchor="middle">德之所以能容，正因它不占地方。</text>
<line x1="20" y1="658" x2="360" y2="658" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="672" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="688" font-size="8.4" fill="#2F2A24">孔德之容，惟道是从。</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">德之所以能容，正因它不占地方。</text>
</svg>