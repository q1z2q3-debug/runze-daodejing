<circle cx="167.0" cy="222.6" r="1.6" fill="#C9B79A"/>
<circle cx="174.0" cy="228.0" r="1.6" fill="#C9B79A"/>
<circle cx="179.4" cy="235.0" r="1.6" fill="#C9B79A"/>
<circle cx="182.8" cy="243.2" r="1.6" fill="#C9B79A"/>
<text x="252" y="204" font-size="4.3" fill="#A2503B">环体宽厚：大</text>
<text x="252" y="220" font-size="4.3" fill="#4A5C55">孔里虚着：空</text>
<text x="252" y="236" font-size="4.3" fill="#2F2A24">孔能穿过：通</text>
<line x1="262" y1="208" x2="170" y2="246" stroke="#DCCBB0" stroke-width="0.6"/>
<line x1="262" y1="224" x2="168" y2="254" stroke="#DCCBB0" stroke-width="0.6"/>
<line x1="262" y1="240" x2="172" y2="264" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="150" y="332" font-size="4.2" fill="#A2503B" text-anchor="middle">三句话说的是同一件事：德之所以能容，正因它不占地方</text>
<text x="24" y="358" font-size="5.2" fill="#4A5C55">二、一只杯：壁若自己占满了，水就进不来</text>
<rect x="26" y="370" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
