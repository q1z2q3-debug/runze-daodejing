<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="六组对偶：六个关系字，不可互换" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="420" height="648" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 章 · 对 照</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">六组对偶</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">六句六字，不是六次同义；认出是哪一种关系，才知该护哪一处。</text>
<text x="89" y="114" font-size="9" fill="#6E6459" text-anchor="middle" letter-spacing="1">一 端</text>
<text x="210" y="114" font-size="9" fill="#6E6459" text-anchor="middle" letter-spacing="1">关 系 字</text>
<text x="331" y="114" font-size="9" fill="#6E6459" text-anchor="middle" letter-spacing="1">另 一 端</text>
<rect x="20" y="126" width="138" height="40" fill="#FBF6EC" stroke="#E6D8C2"/>
<rect x="262" y="126" width="138" height="40" fill="#FBF6EC" stroke="#E6D8C2"/>
<text x="89" y="152" font-size="14" fill="#A2503B" text-anchor="middle">有</text>
<text x="210" y="146" font-size="17" fill="#2F2A24" text-anchor="middle">生</text>
<text x="210" y="161" font-size="8.4" fill="#4A5C55" text-anchor="middle" letter-spacing="1">互为源</text>
<text x="331" y="152" font-size="14" fill="#A2503B" text-anchor="middle">无</text>
<rect x="20" y="172" width="138" height="40" fill="#FBF6EC" stroke="#E6D8C2"/>
<rect x="262" y="172" width="138" height="40" fill="#FBF6EC" stroke="#E6D8C2"/>
<text x="89" y="198" font-size="14" fill="#A2503B" text-anchor="middle">难</text>
<text x="210" y="192" font-size="17" fill="#2F2A24" text-anchor="middle">成</text>
<text x="210" y="207" font-size="8.4" fill="#4A5C55" text-anchor="middle" letter-spacing="1">互为功</text>
<text x="331" y="198" font-size="14" fill="#A2503B" text-anchor="middle">易</text>
<rect x="20" y="218" width="138" height="40" fill="#FBF6EC" stroke="#E6D8C2"/>
<rect x="262" y="218" width="138" height="40" fill="#FBF6EC" stroke="#E6D8C2"/>
<text x="89" y="244" font-size="14" fill="#A2503B" text-anchor="middle">长</text>
<text x="210" y="238" font-size="17" fill="#2F2A24" text-anchor="middle">形</text>
<text x="210" y="253" font-size="8.4" fill="#4A5C55" text-anchor="middle" letter-spacing="1">互为尺</text>
<text x="331" y="244" font-size="14" fill="#A2503B" text-anchor="middle">短</text>
<rect x="20" y="264" width="138" height="40" fill="#FBF6EC" stroke="#E6D8C2"/>
<rect x="262" y="264" width="138" height="40" fill="#FBF6EC" stroke="#E6D8C2"/>
<text x="89" y="290" font-size="14" fill="#A2503B" text-anchor="middle">高</text>
<text x="210" y="284" font-size="17" fill="#2F2A24" text-anchor="middle">倾</text>
<text x="210" y="299" font-size="8.4" fill="#4A5C55" text-anchor="middle" letter-spacing="1">互为势</text>
<text x="331" y="290" font-size="14" fill="#A2503B" text-anchor="middle">下</text>
<rect x="20" y="310" width="138" height="40" fill="#FBF6EC" stroke="#E6D8C2"/>
<rect x="262" y="310" width="138" height="40" fill="#FBF6EC" stroke="#E6D8C2"/>
<text x="89" y="336" font-size="14" fill="#A2503B" text-anchor="middle">音</text>
<text x="210" y="330" font-size="17" fill="#2F2A24" text-anchor="middle">和</text>
<text x="210" y="345" font-size="8.4" fill="#4A5C55" text-anchor="middle" letter-spacing="1">互为应</text>
<text x="331" y="336" font-size="14" fill="#A2503B" text-anchor="middle">声</text>
<rect x="20" y="356" width="138" height="40" fill="#FBF6EC" stroke="#E6D8C2"/>
<rect x="262" y="356" width="138" height="40" fill="#FBF6EC" stroke="#E6D8C2"/>
<text x="89" y="382" font-size="14" fill="#A2503B" text-anchor="middle">前</text>
<text x="210" y="376" font-size="17" fill="#2F2A24" text-anchor="middle">随</text>
<text x="210" y="391" font-size="8.4" fill="#4A5C55" text-anchor="middle" letter-spacing="1">互为序</text>
<text x="331" y="382" font-size="14" fill="#A2503B" text-anchor="middle">后</text>
<text x="210" y="420" font-size="9.8" fill="#A2503B" text-anchor="middle">六个字，六种作用方式；塌成一句，后面就无据可依</text>
<rect x="20" y="436" width="380" height="84" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="34" y="464" font-size="12.5" fill="#2F2A24">是以圣人处无为之事</text>
<text x="34" y="486" font-size="10.2" fill="#6E6459">不立这把尺，故不随之起倒；行不言之教，事成而不居。</text>
<text x="34" y="506" font-size="10.2" fill="#A2503B">执一岸，必被另一岸牵着走。</text>
<line x1="20" y1="580" x2="360" y2="580" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="594" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="610" font-size="8.4" fill="#2F2A24">有无相生，难易相成。</text>
<text x="20" y="626" font-size="8.4" fill="#2F2A24">六句六字，不是六次同义；认准是哪一种关系，才知该护哪一处。</text>
</svg>