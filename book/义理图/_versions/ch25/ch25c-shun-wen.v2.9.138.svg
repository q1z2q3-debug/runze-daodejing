<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 714" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="道法自然：它上面没有更高的东西命令它，它只是自己如此" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="714" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 五 章 · 顺 纹 而 刨</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">顺纹而刨</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">道法自然。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「自然」不是今语「自然界」：自，自身；然，如是——自己如此。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459">道之上没有更高的主宰，它不靠着谁的命令运转。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、顺纹：刨子沿着木自己长出来的纹走</text>
<rect x="26" y="164" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="52" y="220" width="212" height="56" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M56,226 q40,-4 78,0 q42,4 126,0" fill="none" stroke="#B7A99A" stroke-width="0.7"/>
<path d="M56,235 q40,-4 78,0 q42,4 126,0" fill="none" stroke="#B7A99A" stroke-width="0.7"/>
<path d="M56,244 q40,-4 78,0 q42,4 126,0" fill="none" stroke="#B7A99A" stroke-width="0.7"/>
<path d="M56,253 q40,-4 78,0 q42,4 126,0" fill="none" stroke="#B7A99A" stroke-width="0.7"/>
<path d="M56,262 q40,-4 78,0 q42,4 126,0" fill="none" stroke="#B7A99A" stroke-width="0.7"/>
<path d="M56,271 q40,-4 78,0 q42,4 126,0" fill="none" stroke="#B7A99A" stroke-width="0.7"/>
<rect x="80" y="206" width="32" height="14" fill="#F2EADA" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="106" y1="208" x2="96" y2="220" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="84" cy="203" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="110" y1="248" x2="152" y2="248" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arr2)"/>
<text x="130" y="240" font-size="4.0" fill="#4A5C55" text-anchor="middle">顺着</text>
<text x="190" y="294" font-size="4.1" fill="#4A5C55" text-anchor="middle">刨面光、出长花：木顺着自己走，手也省力</text>
<text x="24" y="342" font-size="5.1" fill="#A2503B">二、逆纹：硬扳着它走，刨不下去，只起毛刺</text>
<rect x="26" y="354" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="52" y="410" width="212" height="56" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M56,416 q40,-4 78,0 q42,4 126,0" fill="none" stroke="#B7A99A" stroke-width="0.7"/>
<path d="M56,425 q40,-4 78,0 q42,4 126,0" fill="none" stroke="#B7A99A" stroke-width="0.7"/>
<path d="M56,434 q40,-4 78,0 q42,4 126,0" fill="none" stroke="#B7A99A" stroke-width="0.7"/>
<path d="M56,443 q40,-4 78,0 q42,4 126,0" fill="none" stroke="#B7A99A" stroke-width="0.7"/>
<path d="M56,452 q40,-4 78,0 q42,4 126,0" fill="none" stroke="#B7A99A" stroke-width="0.7"/>
<path d="M56,461 q40,-4 78,0 q42,4 126,0" fill="none" stroke="#B7A99A" stroke-width="0.7"/>
<path d="M120,410 q-3,-5 -7,-7" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<path d="M136,410 q-3,-5 -7,-7" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<path d="M152,410 q-3,-5 -7,-7" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<path d="M168,410 q-3,-5 -7,-7" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<path d="M184,410 q-3,-5 -7,-7" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<path d="M200,410 q-3,-5 -7,-7" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<rect x="134" y="396" width="32" height="14" fill="#F2EADA" stroke="#A2503B" stroke-width="1.0"/>
<line x1="160" y1="398" x2="150" y2="410" stroke="#A2503B" stroke-width="1.0"/>
<circle cx="138" cy="393" r="3.4" fill="none" stroke="#A2503B" stroke-width="0.8"/>
<line x1="158" y1="442" x2="200" y2="442" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arr2)"/>
<text x="178" y="434" font-size="4.0" fill="#A2503B" text-anchor="middle">逆着</text>
<text x="190" y="484" font-size="4.1" fill="#A2503B" text-anchor="middle">刃口被纹理顶住：越用力，越不平</text>
<text x="24" y="528" font-size="4.8" fill="#2F2A24">道法自然：四层取法到此为止——地之上是天，天之上是道，道之上没有了。</text>
<text x="24" y="544" font-size="4.8" fill="#2F2A24">不是道去效法一个更大的「自然界」，是它自己如此，不由谁命令。</text>
<text x="24" y="562" font-size="4.8" fill="#4A5C55">所以学它，不是学一套规矩，是学着不硬扳。</text>
<line x1="24" y1="580" x2="338" y2="580" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="588" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="604" font-size="5.4" fill="#2F2A24" text-anchor="middle">人法地，地法天，天法道，道法自然。</text>
<text x="190" y="616" font-size="5.0" fill="#4A5C55" text-anchor="middle">道之上没有更高的东西命令它。</text>
<line x1="20" y1="642" x2="360" y2="642" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="656" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="672" font-size="8.4" fill="#2F2A24">人法地，地法天，天法道，道法自然。</text>
<text x="20" y="688" font-size="8.4" fill="#2F2A24">道法自然：它上面没有更高的东西命令它，它只是自己如此。</text>
</svg>