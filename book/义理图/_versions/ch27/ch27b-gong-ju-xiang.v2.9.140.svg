<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 706" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="善数不用筹策：不是不做，是做到了不必做" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="706" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 七 章 · 一 只 工 具 箱</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只工具箱</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">工具一件一件撤掉，里头的东西一件一件长出来。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「筹策」是计数的竹签；「关」是横闩，「楗」是竖插门后之木；「约」是绳缠。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459">三样都是工具；三句话都在说：到了那个地方，工具不必带。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、摊开：数要签、闭要闩、结要绳</text>
<rect x="26" y="164" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="44" y1="268" x2="316" y2="268" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="58" y1="268" x2="58" y2="290" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="302" y1="268" x2="302" y2="290" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="44" y1="290" x2="316" y2="290" stroke="#E6D8C2" stroke-width="0.6"/>
<line x1="66" y1="268" x2="66" y2="234" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="72" y1="268" x2="72" y2="234" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="78" y1="268" x2="78" y2="234" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="84" y1="268" x2="84" y2="234" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="90" y1="268" x2="90" y2="234" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="96" y1="268" x2="96" y2="234" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="102" y1="268" x2="102" y2="234" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="63" y1="256" x2="108" y2="256" stroke="#E6D8C2" stroke-width="0.5"/>
<rect x="152" y="204" width="46" height="64" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="152" y1="244" x2="214" y2="244" stroke="#2F2A24" stroke-width="1.5"/>
<rect x="206" y="230" width="7" height="28" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<ellipse cx="270" cy="250" rx="26" ry="16" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="270" cy="250" rx="18" ry="10" fill="none" stroke="#E6D8C2" stroke-width="0.6"/>
<path d="M296,250 q14,4 10,14" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<text x="84" y="304" font-size="4.1" fill="#8A7C69" text-anchor="middle">筹策·数</text>
<text x="178" y="304" font-size="4.1" fill="#8A7C69" text-anchor="middle">关楗·闭</text>
<text x="270" y="304" font-size="4.1" fill="#8A7C69" text-anchor="middle">绳约·结</text>
<text x="190" y="194" font-size="4.3" fill="#A2503B" text-anchor="middle">工具摊一桌：样样都在，样样都要先取</text>
<text x="24" y="338" font-size="5.1" fill="#A2503B">二、收进箱子：桌空了，路也平了</text>
<rect x="26" y="350" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="44" y1="476" x2="316" y2="476" stroke="#2F2A24" stroke-width="1.1"/>
<rect x="212" y="434" width="92" height="42" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="212" y1="446" x2="304" y2="446" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="258" y1="446" x2="258" y2="476" stroke="#E6D8C2" stroke-width="0.6"/>
<text x="258" y="464" font-size="4.4" fill="#A2503B" text-anchor="middle">收</text>
<circle cx="108" cy="430" r="6" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="108" y1="436" x2="108" y2="464" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="108" y1="464" x2="101" y2="476" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="108" y1="464" x2="115" y2="476" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="108" y1="446" x2="100" y2="462" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="108" y1="446" x2="116" y2="462" stroke="#2F2A24" stroke-width="0.9"/>
<text x="108" y="498" font-size="4.1" fill="#4A5C55" text-anchor="middle">空手过路，路面是平的</text>
<text x="258" y="498" font-size="4.1" fill="#4A5C55" text-anchor="middle">工具在箱里</text>
<text x="190" y="384" font-size="4.3" fill="#8A7C69" text-anchor="middle">路上有印子，箱里没声息</text>
<text x="24" y="520" font-size="4.8" fill="#2F2A24">「善行无辙迹」：载着很重的东西走过去，路上却不留沟。</text>
<text x="24" y="536" font-size="4.8" fill="#2F2A24">「善言无瑕谪」：话说完就收，没有把柄留在人手里。</text>
<text x="24" y="554" font-size="4.8" fill="#4A5C55">五善练到极处，就成了「不用」——不是不做，是做到了不必做。</text>
<line x1="24" y1="572" x2="338" y2="572" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="580" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="596" font-size="6.0" fill="#2F2A24" text-anchor="middle">不是不做，是做到了不必做。</text>
<text x="190" y="608" font-size="5.0" fill="#4A5C55" text-anchor="middle">五善是手，师资是眼，无弃是心。</text>
<line x1="20" y1="634" x2="360" y2="634" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="648" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="664" font-size="8.4" fill="#2F2A24">不是不做，是做到了不必做。</text>
<text x="20" y="680" font-size="8.4" fill="#2F2A24">工具一件一件撤掉，里头的东西一件一件长出来。</text>
</svg>