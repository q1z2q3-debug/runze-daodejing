<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="四级不是四种人，是同一件事的四次退化" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="432" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 七 章 · 治 道</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">四级台阶</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">从上往下：不必被感念 → 要被感念 → 只能被怕 → 连怕也不怕。</text>
<text x="20" y="134" font-size="9" fill="#8A7C69">太上</text>
<rect x="66" y="112" width="108" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="120" y="132" font-size="9.6" fill="#2F2A24" text-anchor="middle">下知有之</text>
<text x="188" y="132" font-size="8.4" fill="#6E6459">只知有他，不必感念</text>
<text x="20" y="174" font-size="9" fill="#8A7C69">其次</text>
<rect x="66" y="152" width="108" height="30" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="120" y="172" font-size="9.6" fill="#2F2A24" text-anchor="middle">亲而誉之</text>
<text x="188" y="172" font-size="8.4" fill="#6E6459">要被感念了</text>
<line x1="120" y1="146" x2="120" y2="151" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="20" y="214" font-size="9" fill="#8A7C69">其次</text>
<rect x="66" y="192" width="108" height="30" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="120" y="212" font-size="9.6" fill="#6E6459" text-anchor="middle">畏之</text>
<text x="188" y="212" font-size="8.4" fill="#6E6459">只能被怕了</text>
<line x1="120" y1="186" x2="120" y2="191" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="20" y="254" font-size="9" fill="#8A7C69">其次</text>
<rect x="66" y="232" width="108" height="30" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="120" y="252" font-size="9.6" fill="#6E6459" text-anchor="middle">侮之</text>
<text x="188" y="252" font-size="8.4" fill="#6E6459">连怕也不怕了</text>
<line x1="120" y1="226" x2="120" y2="231" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="20" y="281" font-size="8.6" fill="#8A7C69">信不足焉，有不信焉：不是下面不信，是上面先不足。</text>
<rect x="20" y="297" width="340" height="48" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="317" font-size="10.8" fill="#2F2A24" text-anchor="middle" letter-spacing="1">功成事遂，百姓皆谓：我自然。</text>
<text x="190" y="334" font-size="8.4" fill="#6E6459" text-anchor="middle">最好的治理，是做完之后没人把它记在谁头上。</text>
<line x1="20" y1="349" x2="360" y2="349" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="363" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="379" font-size="8.4" fill="#2F2A24">贵言者，非不言，是不以言夺人之自性。</text>
<text x="20" y="395" font-size="8.4" fill="#2F2A24">功成事遂，百姓曰「我自然」——此谓善治。</text>
</svg>