<rect x="0" y="0" width="380" height="750" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 七 章 · 功 成</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">功成之后</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">功成事遂，百姓皆谓我自然。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">最难的不是把事做成，是做成之后站在哪儿。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459">站在中间，事就成了他的；退到边上，事才是大家的。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、站在中间：旗子一举，功都算在他头上</text>
