<text x="190" y="310" font-size="4.2" fill="#A2503B" text-anchor="middle">众人围着他：这是他做成的</text>
<text x="24" y="356" font-size="5.2" fill="#4A5C55">二、退到边上：事还是成了，只是没人记得谁做的</text>
<rect x="26" y="368" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
