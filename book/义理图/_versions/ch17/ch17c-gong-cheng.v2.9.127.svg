<line x1="240" y1="432" x2="240" y2="454" stroke="#2F2A24" stroke-width="1.1"/>
<text x="96" y="480" font-size="4.3" fill="#4A5C55">我自然</text>
<text x="168" y="502" font-size="4.2" fill="#6E6459">没人记得谁做成的，事却成了</text>
<text x="190" y="528" font-size="4.4" fill="#4A5C55" text-anchor="middle">功成事遂，百姓皆谓我自然</text>
<text x="24" y="564" font-size="4.9" fill="#2F2A24">举旗的人，把众人的力气记成自己的功劳；退到树下的人，把功劳还给做事的人。</text>
<text x="24" y="580" font-size="4.9" fill="#2F2A24">「我自然」不是百姓不知情，是他们不必知道——这正是太上该有的样子。</text>
<text x="24" y="598" font-size="4.9" fill="#4A5C55">功成之后最难的一步：从中间退到边上，让事自己站着。</text>
<line x1="24" y1="616" x2="338" y2="616" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="624" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="640" font-size="6.0" fill="#2F2A24" text-anchor="middle">功成事遂，</text>
<text x="190" y="652" font-size="6.0" fill="#4A5C55" text-anchor="middle">百姓皆谓我自然。</text>
<line x1="20" y1="678" x2="360" y2="678" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="692" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="708" font-size="8.4" fill="#2F2A24">功成事遂，百姓皆谓我自然。</text>
<text x="20" y="724" font-size="8.4" fill="#2F2A24">从中间退到边上，让事自己站着。</text>
</svg>