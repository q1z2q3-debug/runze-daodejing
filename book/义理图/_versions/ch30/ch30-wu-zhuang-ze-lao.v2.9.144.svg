<path d="M72,130 Q86,174 72,218" fill="none" stroke="#B9A98F" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="72" y="240" font-size="8.2" fill="#2F2A24" text-anchor="middle">满而不久：一矢而止</text>
<text x="72" y="253" font-size="7.4" fill="#8A7C69" text-anchor="middle">果而已，不取强</text>
<path d="M252,130 Q222,174 252,218" fill="none" stroke="#2F2A24" stroke-width="1.5"/>
