<text x="252" y="240" font-size="8.2" fill="#A2503B" text-anchor="middle">久张：弦断弓折</text>
<text x="252" y="253" font-size="7.4" fill="#8A7C69" text-anchor="middle">取强，则物壮</text>
<text x="162" y="286" font-size="7.4" fill="#6E6459" text-anchor="middle">「其事好还」：力发出去，最先回来的是它自己</text>
<text x="20" y="302" font-size="8.6" fill="#4A5C55">果：树结果就停，人未必</text>
