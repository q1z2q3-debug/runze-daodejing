<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 章 · 兵 与 果</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">物壮则老</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">佐是搭手，不是推手；弓有力，是因为它被拉满了。</text>
<text x="20" y="106" font-size="8.6" fill="#4A5C55">兵：一张满弓，两种用法</text>
<path d="M72,130 Q42,174 72,218" fill="none" stroke="#2F2A24" stroke-width="1.5"/>
<path d="M72,130 Q48,174 72,218" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
