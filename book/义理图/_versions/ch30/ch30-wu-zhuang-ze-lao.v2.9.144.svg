<text x="20" y="512" font-size="7.6" fill="#A2503B">荒地先长刺，因为刺不需要人养。</text>
<rect x="20" y="528" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="547" font-size="9.6" fill="#2F2A24" text-anchor="middle" letter-spacing="0.6">物壮则老，是谓不道；不道早已。</text>
<text x="190" y="562" font-size="8.0" fill="#6E6459" text-anchor="middle">求壮，就是提前领老。</text>
<line x1="20" y1="580" x2="360" y2="580" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="594" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="610" font-size="8.4" fill="#2F2A24">兵是「合」的物理形态：它不让他想通，它让他不能不想通。</text>
<text x="20" y="626" font-size="8.4" fill="#2F2A24">弓有力，是因为它被拉满了；而拉满的弓，不能久张。</text>
