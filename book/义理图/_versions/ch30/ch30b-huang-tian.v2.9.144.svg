<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 章 · 一 片 荒 田</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一片荒田</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">兵是「合」的极端形态：它不让对方想通，它让对方不能不想通。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「荆」是牡荆，「棘」是丛生小枣——两个字都带刺。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459">这一句写的不是战场，是战后：人一撤手，地就回到野的样子。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、师未至：田畴齐整，禾苗有穗</text>
