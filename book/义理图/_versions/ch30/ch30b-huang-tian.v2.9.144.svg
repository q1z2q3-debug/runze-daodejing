<text x="302" y="480" font-size="4.0" fill="#A2503B" text-anchor="middle">凶年：一只空碗</text>
<text x="140" y="488" font-size="4.1" fill="#A2503B" text-anchor="middle">刺不需要人养，庄稼要</text>
<text x="24" y="520" font-size="4.7" fill="#2F2A24">「师」是军队，「荆」「棘」皆带刺：军队驻扎过的地方，农时断了，田荒了。</text>
<text x="24" y="536" font-size="4.7" fill="#2F2A24">「必」这个字很硬：一场大战误一季农时，误一季就是一年。</text>
<text x="24" y="554" font-size="4.5" fill="#4A5C55">这就是「合」的账单：你要一个统一的样子，代价是这一整片地的生生节奏被掐断。</text>
<line x1="24" y1="572" x2="338" y2="572" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="580" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="596" font-size="5.8" fill="#2F2A24" text-anchor="middle">荒地先长刺，因为刺不需要人养。</text>
<text x="190" y="608" font-size="5.0" fill="#4A5C55" text-anchor="middle">一个统一的样子，和一片长刺的地。</text>
<line x1="20" y1="634" x2="360" y2="634" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="648" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="664" font-size="8.4" fill="#2F2A24">荒地先长刺，因为刺不需要人养。</text>
<text x="20" y="680" font-size="8.4" fill="#2F2A24">一个统一的样子，和一片长刺的地。</text>
</svg>