<text x="190" y="302" font-size="4.1" fill="#4A5C55" text-anchor="middle">田埂、水渠、禾苗：一季的生生节奏</text>
<text x="24" y="338" font-size="5.1" fill="#A2503B">二、师过后：田埂还在，长的是带刺的</text>
