<line x1="104" y1="466" x2="104" y2="477" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<ellipse cx="118" cy="472" rx="4.2" ry="2.4" fill="#E4EAE0" stroke="#4A5C55" stroke-width="0.6"/>
<line x1="118" y1="456" x2="118" y2="467" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<ellipse cx="136" cy="486" rx="4.2" ry="2.4" fill="#E4EAE0" stroke="#4A5C55" stroke-width="0.6"/>
<line x1="136" y1="470" x2="136" y2="481" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<ellipse cx="152" cy="478" rx="4.2" ry="2.4" fill="#E4EAE0" stroke="#4A5C55" stroke-width="0.6"/>
<line x1="152" y1="462" x2="152" y2="473" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<ellipse cx="170" cy="484" rx="4.2" ry="2.4" fill="#E4EAE0" stroke="#4A5C55" stroke-width="0.6"/>
<line x1="170" y1="468" x2="170" y2="479" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<ellipse cx="188" cy="474" rx="4.2" ry="2.4" fill="#E4EAE0" stroke="#4A5C55" stroke-width="0.6"/>
<line x1="188" y1="458" x2="188" y2="469" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<text x="206" y="426" font-size="4.0" fill="#4A5C55">各自落回脚下</text>
<text x="24" y="532" font-size="4.9" fill="#2F2A24">生发是「作」，回收是「复」；只看见作，看不见复，人就以为一直往前是对的。</text>
<text x="24" y="548" font-size="4.9" fill="#2F2A24">复归其根，不是退步，是把今年长出来的、重新变成明年的底。</text>
<text x="24" y="566" font-size="4.9" fill="#4A5C55">观复的人不急：他知道每一轮落下来的，都在根那里等着。</text>
<line x1="24" y1="584" x2="338" y2="584" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="592" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="608" font-size="6.0" fill="#2F2A24" text-anchor="middle">万物并作，吾以观复；</text>
<text x="190" y="620" font-size="6.0" fill="#4A5C55" text-anchor="middle">夫物芸芸，各复归其根。</text>
<line x1="20" y1="646" x2="360" y2="646" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="660" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="676" font-size="8.4" fill="#2F2A24">夫物芸芸，各复归其根。</text>
<text x="20" y="692" font-size="8.4" fill="#2F2A24">复归其根，是把今年长出来的、重新变成明年的底。</text>
</svg>