<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 644" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="借来的高度站不住，省下的步子走不远" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="644" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 四 章 · 企 者 不 立</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一双鞋</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">企者不立，跨者不行。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">企，《说文》「举踵也」：踮起脚跟；跨，「渡也」：大步越过。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">一个求高，一个求快；动机是一个：想越过自己本来的位置。</text>
<rect x="26" y="150" width="328" height="130" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="240" x2="340" y2="240" stroke="#C9B79A" stroke-width="0.9"/>
<path d="M64,224 L64,198 C72,193 90,191 108,193 C128,195 142,205 146,216 L151,217 C153,221 153,223 153,224 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<ellipse cx="81" cy="199" rx="11" ry="3.2" fill="#FCF8EF" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="64" y="224" width="90" height="7" fill="#E7DCC4" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="64" y="231" width="36" height="9" fill="#D9CCAE" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M206,224 L206,198 C214,193 232,191 250,193 C270,195 284,205 288,216 L293,217 C295,221 295,223 295,224 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<ellipse cx="223" cy="199" rx="11" ry="3.2" fill="#FCF8EF" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="206" y="224" width="90" height="7" fill="#E7DCC4" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="224" cy="234" r="6.5" fill="#E7DCC4" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="224" cy="234" r="1.5" fill="#2F2A24" opacity="0.55"/>
<circle cx="282" cy="234" r="6.5" fill="#E7DCC4" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="282" cy="234" r="1.5" fill="#2F2A24" opacity="0.55"/>
<text x="109" y="256" font-size="4.0" fill="#A2503B" text-anchor="middle">后跟垫一块木</text>
<text x="109" y="268" font-size="3.8" fill="#6E6459" text-anchor="middle">垫出来的高：一寸</text>
<text x="253" y="256" font-size="4.0" fill="#A2503B" text-anchor="middle">底上装两只轮</text>
<text x="253" y="268" font-size="3.8" fill="#6E6459" text-anchor="middle">省下来的步：半步</text>
<text x="24" y="293" font-size="5.0" fill="#A2503B">一、一只垫高、一只带轮：都不是脚上长的</text>
<rect x="26" y="306" width="328" height="124" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="388" x2="340" y2="388" stroke="#C9B79A" stroke-width="0.9"/>
<path d="M112,381 L112,355 C120,350 138,348 156,350 C176,352 190,362 194,373 L199,374 C201,378 201,380 201,381 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<ellipse cx="129" cy="356" rx="11" ry="3.2" fill="#FCF8EF" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="112" y="381" width="90" height="7" fill="#E7DCC4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="112" y1="388" x2="202" y2="388" stroke="#4A5C55" stroke-width="2.0"/>
<text x="206" y="372" font-size="3.9" fill="#4A5C55">鞋底整只贴地：底下没有东西隔着</text>
<line x1="204" y1="388" x2="206" y2="380" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="62" y="380" width="26" height="8" fill="#D9CCAE" stroke="#2F2A24" stroke-width="0.8" stroke-dasharray="3 2"/>
<circle cx="98" cy="384" r="5" fill="#E7DCC4" stroke="#2F2A24" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="58" y="366" font-size="3.6" fill="#8A7C69">拆下的木块与轮</text>
<line x1="86" y1="369" x2="78" y2="378" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="190" y="410" font-size="4.0" fill="#4A5C55" text-anchor="middle">鞋还是那双鞋；木与轮一拆，鞋底就落到地上。</text>
<text x="24" y="443" font-size="5.0" fill="#4A5C55">二、拆了木与轮：鞋底整只贴地，人就回到自己的高度</text>
<text x="24" y="460" font-size="4.9" fill="#2F2A24">踮脚能站住，靠的是小腿那点力气；力气一松，人就落回原高。</text>
<text x="24" y="476" font-size="4.9" fill="#2F2A24">跨步能走远，靠的是每一步省了半步；省下的半步，迟早要还。</text>
<text x="24" y="494" font-size="4.9" fill="#4A5C55">这两句不是劝人别努力，是说：借来的高度站不住，省下的步子走不远。</text>
<line x1="24" y1="510" x2="338" y2="510" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="518" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="534" font-size="5.4" fill="#2F2A24" text-anchor="middle">借来的高度站不住，省下的步子走不远。</text>
<text x="190" y="546" font-size="4.5" fill="#4A5C55" text-anchor="middle">问题不在能力，在姿势。</text>
<line x1="20" y1="572" x2="360" y2="572" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="586" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="602" font-size="8.4" fill="#2F2A24">借来的高度站不住，省下的步子走不远。</text>
<text x="20" y="618" font-size="8.4" fill="#2F2A24">问题不在能力，在姿势。</text>
</svg>