<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 726" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="企者不立，跨者不行：踮得越高，越站不稳" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="726" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 四 章 · 踮 脚 与 跨 步</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">踮脚与跨步</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">企者不立，跨者不行。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">两个动作，一个心思：踮脚求高，跨步求速。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459">求高与求速，都是在自己脚下多垫了一寸。</text>
<text x="24" y="152" font-size="5.1" fill="#A2503B">一、踮脚：脚跟离了地，身就靠脚尖撑着</text>
<rect x="26" y="164" width="328" height="158" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="46" y1="282" x2="176" y2="282" stroke="#DCCBB0" stroke-width="0.9"/>
<circle cx="108" cy="208" r="7" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="108" y1="215" x2="108" y2="242" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="108" y1="242" x2="108" y2="258" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="108" y1="258" x2="118" y2="280" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="118" y1="280" x2="130" y2="282" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="93" y1="230" x2="108" y2="236" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="123" y1="230" x2="108" y2="236" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="106" y1="282" x2="106" y2="276" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="2 2"/>
<line x1="90" y1="282" x2="90" y2="216" stroke="#A2503B" stroke-width="0.6" stroke-dasharray="4 3"/>
<line x1="90" y1="282" x2="82" y2="274" stroke="#A2503B" stroke-width="0.6"/>
<line x1="90" y1="282" x2="82" y2="290" stroke="#A2503B" stroke-width="0.6"/>
<text x="74" y="260" font-size="3.6" fill="#A2503B" text-anchor="middle">重心线</text>
<text x="114" y="300" font-size="3.9" fill="#A2503B" text-anchor="middle">脚跟悬空，全身靠一点脚尖</text>
<circle cx="262" cy="208" r="7" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="262" y1="215" x2="262" y2="268" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="262" y1="268" x2="253" y2="282" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="262" y1="268" x2="271" y2="282" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M253,282 l-7,2 M271,282 l7,2" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="262" y1="234" x2="248" y2="256" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="262" y1="234" x2="276" y2="256" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="242" y1="282" x2="282" y2="282" stroke="#DCCBB0" stroke-width="0.9"/>
<text x="262" y="300" font-size="3.9" fill="#4A5C55" text-anchor="middle">整只脚落地，重心在中间</text>
<text x="190" y="314" font-size="4.2" fill="#A2503B" text-anchor="middle">企者不立：高出来的那一寸，是从站住里借的</text>
<text x="24" y="348" font-size="5.1" fill="#4A5C55">二、跨步：一步迈得太远，落点就接不上</text>
<rect x="26" y="360" width="328" height="156" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="44" y1="480" x2="336" y2="480" stroke="#DCCBB0" stroke-width="0.9"/>
<ellipse cx="66" cy="476" rx="6" ry="3" fill="none" stroke="#E6D8C2" stroke-width="0.8"/>
<ellipse cx="90" cy="476" rx="6" ry="3" fill="none" stroke="#E6D8C2" stroke-width="0.8"/>
<ellipse cx="114" cy="476" rx="6" ry="3" fill="none" stroke="#E6D8C2" stroke-width="0.8"/>
<ellipse cx="138" cy="476" rx="6" ry="3" fill="none" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="110" y="492" font-size="3.8" fill="#8A7C69" text-anchor="middle">平常一步</text>
<ellipse cx="206" cy="476" rx="8" ry="3.4" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<ellipse cx="290" cy="476" rx="8" ry="3.4" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<path d="M206,472 Q248,444 290,472" fill="none" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="248" y="438" font-size="3.8" fill="#A2503B" text-anchor="middle">一步跨出这么远</text>
<circle cx="202" cy="404" r="6.4" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M204,410 L214,448" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="214" y1="448" x2="204" y2="474" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="214" y1="448" x2="232" y2="472" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="210" y1="422" x2="226" y2="434" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="210" y1="422" x2="192" y2="434" stroke="#2F2A24" stroke-width="0.9"/>
<text x="190" y="506" font-size="4.2" fill="#4A5C55" text-anchor="middle">跨者不行：腿张得开，身子却先歪了</text>
<text x="24" y="540" font-size="4.8" fill="#2F2A24">踮脚是为高一寸，跨步是为快一步；一寸一步都在脚下垫着。</text>
<text x="24" y="556" font-size="4.8" fill="#2F2A24">自见、自是、自伐、自矜，四个动作同出一处：把「我」举起来一点。</text>
<text x="24" y="574" font-size="4.8" fill="#4A5C55">举起来的那一点，就是脚下垫的那一寸。</text>
<line x1="24" y1="592" x2="338" y2="592" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="600" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="616" font-size="6.0" fill="#2F2A24" text-anchor="middle">企者不立，跨者不行。</text>
<text x="190" y="628" font-size="5.0" fill="#4A5C55" text-anchor="middle">自见者不明，自是者不彰。</text>
<line x1="20" y1="654" x2="360" y2="654" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="668" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="684" font-size="8.4" fill="#2F2A24">企者不立，跨者不行。</text>
<text x="20" y="700" font-size="8.4" fill="#2F2A24">举起来的那一点，就是脚下垫的那一寸。</text>
</svg>