<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="道冲：一个永远装不满的空" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="568" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 章 · 本 体</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">装不满的空</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">上半说它是什么，下半说你怎么办；中间贯通的那句，是「有生于无」。</text>
<path d="M 48 122 L 48 208 Q 110 248 172 208 L 172 122" fill="none" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="40" y1="122" x2="180" y2="122" stroke="#2F2A24" stroke-width="1"/>
<line x1="86" y1="140" x2="134" y2="140" stroke="#E6D8C2" stroke-width="0.7" stroke-dasharray="2 3"/>
<line x1="86" y1="162" x2="134" y2="162" stroke="#E6D8C2" stroke-width="0.7" stroke-dasharray="2 3"/>
<line x1="86" y1="184" x2="134" y2="184" stroke="#E6D8C2" stroke-width="0.7" stroke-dasharray="2 3"/>
<text x="110" y="112" font-size="9.5" fill="#8A7C69" text-anchor="middle">冲 · 虚</text>
<text x="192" y="148" font-size="10" fill="#4A5C55">用之或不盈</text>
<text x="192" y="164" font-size="8.8" fill="#6E6459">倒多少进去，它都不满</text>
<text x="192" y="186" font-size="9.5" fill="#A2503B">渊兮，似万物之宗</text>
<text x="20" y="276" font-size="9.5" fill="#8A7C69">落到人身上：四句实修</text>
<text x="20" y="306" font-size="10.5" fill="#A2503B">挫其锐</text>
<text x="74" y="306" font-size="9.5" fill="#6E6459">磨去锋芒</text>
<text x="20" y="322" font-size="8.8" fill="#8A7C69">先减，不是先增</text>
<text x="194" y="306" font-size="10.5" fill="#A2503B">解其纷</text>
<text x="248" y="306" font-size="9.5" fill="#6E6459">理清纠缠</text>
<text x="194" y="322" font-size="8.8" fill="#8A7C69">把结打开，不加新结</text>
<text x="20" y="352" font-size="10.5" fill="#A2503B">和其光</text>
<text x="74" y="352" font-size="9.5" fill="#6E6459">收敛光耀</text>
<text x="20" y="368" font-size="8.8" fill="#8A7C69">亮而不刺人</text>
<text x="194" y="352" font-size="10.5" fill="#A2503B">同其尘</text>
<text x="248" y="352" font-size="9.5" fill="#6E6459">落回尘土</text>
<text x="194" y="368" font-size="8.8" fill="#8A7C69">与粗处同处</text>
<rect x="20" y="388" width="340" height="46" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="408" font-size="10" fill="#2F2A24" text-anchor="middle">湛兮，似或存；吾不知谁之子，象帝之先。</text>
<text x="190" y="426" font-size="9" fill="#6E6459" text-anchor="middle">它先于一切被命名者——连「谁生的」都问不到它头上。</text>
<text x="190" y="454" font-size="9.5" fill="#6E6459" text-anchor="middle">四句不是四种修养，是把加在身上的东西一件件卸下来。</text>
<line x1="20" y1="516" x2="360" y2="516" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="530" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="546" font-size="8.4" fill="#2F2A24">道冲而用之或不盈。</text>
<text x="20" y="562" font-size="8.4" fill="#2F2A24">装不满不是不够，是它不让自己被装满。</text>
</svg>