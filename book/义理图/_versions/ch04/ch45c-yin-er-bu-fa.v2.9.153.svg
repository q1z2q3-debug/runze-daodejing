<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="引而不发：有话说得出，却不说满" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="650" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 五 章 · 弓</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">引而不发</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">大直若屈，大巧若拙，大辩若讷。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.8" fill="#2F2A24" text-anchor="middle">弓臂是弯的，箭才走得直；弦拉到「满」，弓臂就折。</text>
<text x="190" y="126" font-size="5.6" fill="#6E6459" text-anchor="middle">所以好射手引而不发——留一分不给出去。</text>
<path d="M82,174 Q58,200 46,228 Q42,244 46,260 Q58,288 82,314" fill="none" stroke="#2F2A24" stroke-width="2.2"/>
<path d="M82,174 l-12,-4 M82,314 l-12,4" fill="none" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="80" y1="178" x2="80" y2="310" stroke="#2F2A24" stroke-width="0.4" opacity="0.45"/>
<line x1="126" y1="232" x2="126" y2="256" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="126" y="270" font-size="4.6" fill="#A2503B" text-anchor="middle">还差一分</text>
<line x1="80" y1="178" x2="108" y2="244" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="80" y1="310" x2="108" y2="244" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="108" cy="244" r="2.6" fill="#4A5C55"/>
<line x1="110" y1="244" x2="246" y2="244" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M246,244 l-7,-3.4 l0,6.8 z" fill="#2F2A24"/>
<line x1="72" y1="170" x2="66" y2="182" stroke="#A2503B" stroke-width="0.5"/>
<line x1="66" y1="182" x2="70" y2="184" stroke="#A2503B" stroke-width="0.5"/>
<text x="58" y="158" font-size="4.4" fill="#A2503B">拉到满，先折这里</text>
<line x1="108" y1="278" x2="108" y2="252" stroke="#4A5C55" stroke-width="0.4"/>
<text x="108" y="288" font-size="5.2" fill="#4A5C55" text-anchor="middle">引而不发</text>
<circle cx="30" cy="328" r="2.4" fill="#A2503B" opacity="0.55"/>
<text x="42" y="332" font-size="5.9" fill="#A2503B">臂 · 大直若屈</text>
<text x="42" y="347" font-size="5.6" fill="#2F2A24">臂做成直的，一拉就折；弯着，力才存得住，箭才走得直。</text>
<circle cx="30" cy="372" r="2.4" fill="#A2503B" opacity="0.55"/>
<text x="42" y="376" font-size="5.9" fill="#A2503B">弦 · 大巧若拙</text>
<text x="42" y="391" font-size="5.6" fill="#2F2A24">撒放的人只是松手，弦自己出去——看不出使过劲。</text>
<circle cx="30" cy="416" r="2.4" fill="#A2503B" opacity="0.55"/>
<text x="42" y="420" font-size="5.9" fill="#A2503B">不发 · 大辩若讷</text>
<text x="42" y="435" font-size="5.6" fill="#2F2A24">引而不发：话到嘴边、力到弦上，仍留一分不给出去。</text>
<circle cx="30" cy="460" r="2.4" fill="#A2503B" opacity="0.55"/>
<text x="42" y="464" font-size="5.9" fill="#A2503B">收 · 清静为正</text>
<text x="42" y="479" font-size="5.6" fill="#2F2A24">射完就松弦。弓不常张，张久了臂就疲。</text>
<line x1="24" y1="502" x2="338" y2="502" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="512" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="528" font-size="6.2" fill="#2F2A24" text-anchor="middle">弓不常张，话不说满，力不使尽。</text>
<text x="190" y="542" font-size="6.2" fill="#4A5C55" text-anchor="middle">三样都留着那一分——那一分，才是能再用的。</text>
<line x1="20" y1="570" x2="360" y2="570" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="584" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="600" font-size="8.4" fill="#2F2A24">弓不常张，话不说满，力不使尽。</text>
<text x="20" y="616" font-size="8.4" fill="#2F2A24">弦绷到尽处就只剩断；留一分不发的，才叫有余。</text>
</svg>