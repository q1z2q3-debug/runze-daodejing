<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 706" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="终日行不离辎重：走得慢，是不肯把根丢了" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="706" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 六 章 · 一 辆 辎 重 车</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一辆辎重车</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">重为轻根，静为躁君。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">「辎重」是行军带的粮械车：重，压得住队伍。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459">「终日行不离辎重」：一天走到晚，也不把它甩下。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、辎重车：车重、辙深，一路压得住</text>
<rect x="26" y="164" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="276" x2="336" y2="276" stroke="#DCCBB0" stroke-width="0.9"/>
<rect x="112" y="220" width="112" height="34" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<rect x="124" y="204" width="30" height="18" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="164" y="202" width="36" height="20" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M160,204 q10,-10 22,-2" fill="none" stroke="#E6D8C2" stroke-width="0.7"/>
<line x1="112" y1="254" x2="224" y2="254" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="132" cy="264" r="12" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<circle cx="132" cy="264" r="2.4" fill="#2F2A24"/>
<circle cx="204" cy="264" r="12" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<circle cx="204" cy="264" r="2.4" fill="#2F2A24"/>
<line x1="112" y1="238" x2="76" y2="238" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="78" y1="238" x2="74" y2="250" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M56,276 q6,6 14,0 q8,-6 14,0 M120,276 q6,6 14,0 q8,-6 14,0 M186,276 q6,6 14,0 q8,-6 14,0" fill="none" stroke="#E6D8C2" stroke-width="0.7"/>
<text x="170" y="294" font-size="4.1" fill="#4A5C55" text-anchor="middle">车重、货满，轮子压出深辙</text>
<text x="300" y="220" font-size="4.4" fill="#A2503B" text-anchor="middle">辎</text>
<text x="300" y="236" font-size="4.4" fill="#A2503B" text-anchor="middle">重</text>
<text x="24" y="338" font-size="5.1" fill="#A2503B">二、荣观与燕处：台观再高，人还是那样坐着</text>
<rect x="26" y="350" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="466" x2="336" y2="466" stroke="#DCCBB0" stroke-width="0.9"/>
<rect x="64" y="446" width="132" height="20" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="76" y="394" width="108" height="52" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="88" y1="394" x2="88" y2="446" stroke="#E6D8C2" stroke-width="0.6"/>
<line x1="118" y1="394" x2="118" y2="446" stroke="#E6D8C2" stroke-width="0.6"/>
<line x1="152" y1="394" x2="152" y2="446" stroke="#E6D8C2" stroke-width="0.6"/>
<line x1="172" y1="394" x2="172" y2="446" stroke="#E6D8C2" stroke-width="0.6"/>
<path d="M68,394 q58,-20 116,0" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M84,378 q42,-14 84,0" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<text x="130" y="370" font-size="4.2" fill="#8A7C69" text-anchor="middle">荣观</text>
<circle cx="262" cy="412" r="6.4" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="262" y1="419" x2="262" y2="446" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M248,452 q14,-10 28,0" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="262" y1="434" x2="250" y2="448" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="262" y1="434" x2="274" y2="448" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="246" y="452" width="32" height="7" fill="#F1EADA" stroke="#DCCBB0" stroke-width="0.7"/>
<text x="262" y="478" font-size="4.0" fill="#4A5C55" text-anchor="middle">燕处超然：身在，心不被它牵走</text>
<line x1="196" y1="420" x2="228" y2="420" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="24" y="520" font-size="4.8" fill="#2F2A24">「重为轻根」：重不是慢，是那副压住自己的分量；丢了它，快就成了漂。</text>
<text x="24" y="536" font-size="4.8" fill="#2F2A24">「终日行不离辎重」：圣人的辎重不是粮车，是那副不肯轻举的心。</text>
<text x="24" y="554" font-size="4.8" fill="#4A5C55">轻则失根，躁则失君：轻失的是根，躁失的是主。</text>
<line x1="24" y1="572" x2="338" y2="572" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="580" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="596" font-size="6.0" fill="#2F2A24" text-anchor="middle">重为轻根，静为躁君。</text>
<text x="190" y="608" font-size="5.0" fill="#4A5C55" text-anchor="middle">是以圣人终日行不离辎重。</text>
<line x1="20" y1="634" x2="360" y2="634" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="648" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="664" font-size="8.4" fill="#2F2A24">重为轻根，静为躁君。</text>
<text x="20" y="680" font-size="8.4" fill="#2F2A24">轻失的是根，躁失的是主。</text>
</svg>