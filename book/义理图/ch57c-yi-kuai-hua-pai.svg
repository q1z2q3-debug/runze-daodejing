<rect x="0" y="0" width="380" height="628" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 七 章 · 彰</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一块木牌</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">法令滋彰，盗贼多有。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.0" fill="#2F2A24" text-anchor="middle">「彰」从彡——彡是三撇毛，是画上去的花纹；不是「法令很多」，是「条文越画越花」。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">花是画在木牌上的；木牌本来只有一条线，是给人踩的。</text>
<text x="24" y="146" font-size="5.2" fill="#4A5C55">一、素牌：一条刻线，脚踩得着</text>
<line x1="24" y1="252" x2="250" y2="252" stroke="#2F2A24" stroke-width="1"/>
<rect x="38" y="178" width="80" height="58" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
