<text x="196" y="208" font-size="4.8" fill="#4A5C55">一条线：</text>
<text x="196" y="220" font-size="4.5" fill="#6E6459">踩得着，看得懂</text>
<text x="100" y="266" font-size="4.5" fill="#6E6459" text-anchor="middle">禁什么、许什么，一站就知道</text>
<text x="24" y="292" font-size="5.2" fill="#A2503B">二、花牌：条文越画越花，人只剩绕</text>
