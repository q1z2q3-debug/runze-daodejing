<text x="200" y="346" font-size="4.8" fill="#A2503B">线多了：</text>
<text x="200" y="358" font-size="4.5" fill="#6E6459">一条都不敢踩</text>
<text x="100" y="412" font-size="4.5" fill="#A2503B" text-anchor="middle">绕着走：绕到最后，就是铤而走险</text>
<text x="24" y="438" font-size="5.2" fill="#2F2A24">「彰」从彡：三撇毛，是画上去的花。</text>
<text x="24" y="454" font-size="4.8" fill="#2F2A24">木牌上本来只有一条线，那条线是给人踩的；画满了花，就没有一条清楚的线可踩。</text>
<text x="24" y="470" font-size="4.6" fill="#4A5C55">人不是不怕法，是踩不到那条线；踩不到，就只剩下绕——绕到最后，就是铤而走险。</text>
<line x1="24" y1="488" x2="338" y2="488" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="496" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="512" font-size="6.0" fill="#2F2A24" text-anchor="middle">彰是画上去的花；</text>
<text x="190" y="524" font-size="5.2" fill="#4A5C55" text-anchor="middle">条文画得越花，能踩的线就越多。</text>
<line x1="20" y1="550" x2="360" y2="550" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="564" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="580" font-size="8.4" fill="#2F2A24">彰是画上去的花；条文画得越花，能踩的线就越多。</text>
</svg>