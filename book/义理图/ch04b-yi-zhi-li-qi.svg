<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 762" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="器之所以为器，正在那处铸出来的空：实心一勺即满，空腔百勺不见底" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="762" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 章 · 礼 器</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只礼器</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">道冲，而用之或不盈。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.0" fill="#2F2A24" text-anchor="middle">《说文》「盅，器虚也」——冲就是盅，就是那只被铸出来的空。</text>
<text x="190" y="128" font-size="5.0" fill="#6E6459" text-anchor="middle">青铜再贵、纹饰再繁，内里若是实的，就盛不下一勺黍稷。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、实心：一勺下去就满，再一勺就溢</text>
<rect x="26" y="164" width="328" height="180" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="316" x2="330" y2="316" stroke="#2F2A24" stroke-width="1"/>
<path d="M138,236 L150,304 Q190,312 230,304 L242,236 Z" fill="#D8CBAC" stroke="#2F2A24" stroke-width="1.2"/>
<ellipse cx="190" cy="236" rx="52" ry="7.5" fill="#D8CBAC" stroke="#2F2A24" stroke-width="1"/>
<path d="M160,236 q10,-6 22,0" fill="none" stroke="#B39A72" stroke-width="0.6"/>
<path d="M164,236 q10,-6 22,0" fill="none" stroke="#B39A72" stroke-width="0.6"/>
<path d="M168,236 q10,-6 22,0" fill="none" stroke="#B39A72" stroke-width="0.6"/>
<line x1="160" y1="304" x2="156" y2="316" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="220" y1="304" x2="224" y2="316" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M240,238 q12,22 7,42 q-2,12 5,16" fill="none" stroke="#A2503B" stroke-width="1.1"/>
<ellipse cx="253" cy="300" rx="2.6" ry="4" fill="#A2503B" opacity="0.8"/>
<path d="M140,238 q-12,20 -7,36 q2,10 -4,14" fill="none" stroke="#A2503B" stroke-width="1.1"/>
<ellipse cx="128" cy="292" rx="2.6" ry="4" fill="#A2503B" opacity="0.8"/>
<text x="266" y="262" font-size="4.4" fill="#A2503B">溢了</text>
<text x="114" y="258" font-size="4.4" fill="#A2503B" text-anchor="end">溢了</text>
<path d="M178,210 q-14,10 0,14 q14,-4 0,-14 z" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="178" y1="210" x2="198" y2="194" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="182" y1="226" x2="188" y2="230" stroke="#A2503B" stroke-width="0.8" marker-end="url(#arr)"/>
<text x="190" y="336" font-size="4.5" fill="#4A5C55" text-anchor="middle">实心则无处可受：一勺下去就没有余处，用完这一次就断了</text>
<text x="24" y="364" font-size="5.2" fill="#A2503B">二、空腹：一勺下去不见底，再来一勺还是不见底</text>
<rect x="26" y="376" width="328" height="180" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="528" x2="330" y2="528" stroke="#2F2A24" stroke-width="1"/>
<path d="M138,448 L150,516 Q190,524 230,516 L242,448 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M146,455 L158,512 Q190,518 222,512 L234,455 Z" fill="#F8F3E6" stroke="#4A5C55" stroke-width="0.8" stroke-dasharray="4 3"/>
<ellipse cx="190" cy="448" rx="52" ry="7.5" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="190" cy="448" rx="44" ry="4.6" fill="none" stroke="#4A5C55" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="160" y1="516" x2="156" y2="528" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="220" y1="516" x2="224" y2="528" stroke="#2F2A24" stroke-width="1.1"/>
<text x="190" y="484" font-size="5.0" fill="#4A5C55" text-anchor="middle">空</text>
<text x="260" y="472" font-size="4.3" fill="#4A5C55">不见底</text>
<line x1="258" y1="470" x2="232" y2="470" stroke="#E6D8C2" stroke-width="0.6" stroke-dasharray="3 2"/>
<text x="260" y="486" font-size="4.3" fill="#4A5C55">从来不满</text>
<line x1="258" y1="484" x2="230" y2="492" stroke="#E6D8C2" stroke-width="0.6" stroke-dasharray="3 2"/>
<path d="M178,422 q-14,10 0,14 q14,-4 0,-14 z" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="178" y1="422" x2="198" y2="406" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="182" y1="438" x2="188" y2="442" stroke="#4A5C55" stroke-width="0.8" marker-end="url(#arr2)"/>
<text x="190" y="548" font-size="4.5" fill="#4A5C55" text-anchor="middle">空的那处，才是它能盛的本钱——器之所以为器，正在此处</text>
<text x="24" y="576" font-size="5.4" fill="#2F2A24">道的体就是一个空，不是一个物：问它「是什么」，它答不上来，只能答「能盛」。</text>
<text x="24" y="592" font-size="5.4" fill="#2F2A24">「或不盈」是现象，「有弗盈」是本性——帛书那句多写一个字，说的是它从来不满。</text>
<text x="24" y="610" font-size="5.2" fill="#4A5C55">所以器之用在空：没有那处空，青铜再贵也盛不下一勺。</text>
<line x1="24" y1="628" x2="338" y2="628" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="636" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="652" font-size="6.0" fill="#2F2A24" text-anchor="middle">一个器之所以为器，</text>
<text x="190" y="664" font-size="6.0" fill="#4A5C55" text-anchor="middle">在那处铸出来的空。</text>
<line x1="20" y1="690" x2="360" y2="690" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="704" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">道冲，而用之或不盈。</text>
<text x="20" y="736" font-size="8.4" fill="#2F2A24">冲者，虚也；《说文》「盅，器虚也」——器之所以为器，正在那处铸出来的空。</text>
</svg>