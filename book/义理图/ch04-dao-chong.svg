<rect x="0" y="0" width="720" height="762" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 章 · 本 体</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">井：一直在用，从不溢出</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">冲是中空；用之或不盈，就是这口井——取不尽，也从不漫出来。</text>
