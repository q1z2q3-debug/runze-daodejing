<text x="369" y="408" font-size="8.4" fill="#A2503B">随取随落</text>
<line x1="240" y1="312" x2="480" y2="312" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="234" y="315" font-size="8.4" fill="#A2503B" text-anchor="end">到此便止：不漫口</text>
<line x1="240" y1="448" x2="480" y2="448" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="234" y="451" font-size="8.4" fill="#A2503B" text-anchor="end">到此便回：不干涸</text>
<line x1="60" y1="466" x2="271" y2="466" stroke="#8FA8A1" stroke-width="0.8" stroke-dasharray="5 4"/>
<line x1="449" y1="466" x2="660" y2="466" stroke="#8FA8A1" stroke-width="0.8" stroke-dasharray="5 4"/>
<line x1="235" y1="466" x2="276" y2="466" stroke="#6E8C86" stroke-width="1" marker-end="url(#arr)"/>
<line x1="485" y1="466" x2="444" y2="466" stroke="#6E8C86" stroke-width="1" marker-end="url(#arr)"/>
<text x="360" y="516" font-size="8.8" fill="#5E7368" text-anchor="middle">水从脉来：取走多少，补回多少</text>
<line x1="360" y1="110" x2="360" y2="172" stroke="#9C8B72" stroke-width="1"/>
<path d="M 344 172 L 376 172 L 372 194 L 348 194 Z" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M 345 172 Q 360 160 375 172" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="406" y1="178" x2="406" y2="128" stroke="#A2503B" stroke-width="1" marker-end="url(#arr)"/>
<text x="418" y="154" font-size="9.4" fill="#A2503B">越取，越出</text>
<text x="464" y="238" font-size="9.2" fill="#2F2A24">井不因取用而浅，</text>
<text x="464" y="258" font-size="9.2" fill="#2F2A24">也不因无人取用而满。</text>
<text x="464" y="290" font-size="9.2" fill="#6E6459">水到某处便止，</text>
<text x="464" y="310" font-size="9.2" fill="#6E6459">取到某处便回。</text>
<text x="464" y="344" font-size="9.2" fill="#4A5C55">壁只是界，</text>
<text x="464" y="364" font-size="9.2" fill="#4A5C55">空才是器。</text>
<text x="360.0" y="548" font-size="10.6" fill="#2F2A24" text-anchor="middle">它一直在用，从不溢出——这就是「用之或不盈」。</text>
<text x="360.0" y="572" font-size="9.2" fill="#6E6459" text-anchor="middle">井口朝天，井底通脉：往上没有顶，往下没有底——一只杯里的空，与地上这片太虚是同一片。</text>
<rect x="78" y="600" width="564" height="54" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="360.0" y="632" font-size="10.4" fill="#2F2A24" text-anchor="middle">湛兮，似或存；吾不知谁之子，象帝之先。</text>
<line x1="20" y1="694" x2="360" y2="694" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="708" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="724" font-size="8.4" fill="#2F2A24">道冲而用之或不盈。</text>
<text x="20" y="740" font-size="8.4" fill="#2F2A24">井一直在用，从不溢出——用不完，也不漫出来。</text>
</svg>