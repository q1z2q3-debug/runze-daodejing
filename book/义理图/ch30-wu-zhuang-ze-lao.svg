<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 706" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="弓的本事在弛，不在张" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="706" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 章 · 一 弓 两 态</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">物壮则老</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">以道佐人主者，不以兵强天下。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「强」，古字作「彊」，《说文》「弓有力也」——强，本义是一张被拉满的弓。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">「壮」，《说文》「大也」；「已」，止也——不合道的路，走不长远就完了。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、一弓两态：张一下就放，不是拉满挂着</text>
<rect x="26" y="164" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="190" y1="174" x2="190" y2="304" stroke="#E6D8C2" stroke-width="0.6"/>
<path d="M122,180.0 Q142,226 122,272.0" fill="none" stroke="#2F2A24" stroke-width="1.6"/>
<path d="M122,180 L88,226 L122,272" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="88" cy="226" r="2.0" fill="#A2503B"/>
<text x="88" y="294" font-size="4.6" fill="#2F2A24" text-anchor="middle">张：弦拉满</text>
<text x="88" y="304" font-size="3.9" fill="#8A7C69" text-anchor="middle">满，只为一发</text>
<path d="M248,180.0 Q268,226 248,272.0" fill="none" stroke="#2F2A24" stroke-width="1.6"/>
<line x1="248" y1="180" x2="248" y2="272" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="288" y1="226" x2="340" y2="226" stroke="#2F2A24" stroke-width="1.0"/>
<polygon points="340,226 333,223 333,229" fill="#2F2A24"/>
<path d="M288,223 l-7,-2.4000000000000004" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M288,229 l-7,2.4000000000000004" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<text x="300" y="294" font-size="4.6" fill="#2F2A24" text-anchor="middle">放：弦回，弓弛</text>
<text x="300" y="304" font-size="3.9" fill="#8A7C69" text-anchor="middle">一发即止，弓的本事在弛</text>
<text x="24" y="338" font-size="5.1" fill="#A2503B">二、久张：挂在墙上不放，弦疲弓废</text>
<rect x="26" y="350" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="60" y="364" width="76" height="122" fill="#EFE6D4" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M136,380 q10,4 4,10" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<text x="98" y="492" font-size="3.9" fill="#8A7C69" text-anchor="middle">墙</text>
<path d="M150,366.0 Q170,412 150,458.0" fill="none" stroke="#2F2A24" stroke-width="1.6"/>
<path d="M150,366 L116,412 L150,458" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="116" cy="412" r="3.2" fill="#A2503B"/>
<text x="116" y="400" font-size="3.7" fill="#A2503B" text-anchor="middle">钉住</text>
<path d="M156,390 l5,-2 l-3,4 l5,-2" fill="none" stroke="#A2503B" stroke-width="0.8"/>
<path d="M156,412 l5,-2 l-3,4 l5,-2" fill="none" stroke="#A2503B" stroke-width="0.8"/>
<path d="M156,434 l5,-2 l-3,4 l5,-2" fill="none" stroke="#A2503B" stroke-width="0.8"/>
<text x="258" y="390" font-size="5.4" fill="#A2503B">久张</text>
<text x="258" y="406" font-size="4.2" fill="#2F2A24">弦疲、弓废</text>
<text x="258" y="418" font-size="4.2" fill="#2F2A24">取强，则物壮</text>
<text x="258" y="434" font-size="3.9" fill="#8A7C69">弓的价值在能放；</text>
<text x="258" y="446" font-size="3.9" fill="#8A7C69">一直张着，弦会疲，弓会废</text>
<text x="24" y="520" font-size="4.8" fill="#2F2A24">「不以兵强天下」：不要把天下拉成一张久张的弓。</text>
<text x="24" y="536" font-size="4.8" fill="#2F2A24">「物壮则老」：壮不是罪，求壮才是——求壮，就是提前领老。</text>
<text x="24" y="554" font-size="4.8" fill="#4A5C55">「已」，止也：不合道的路，走不长远就完了。</text>
<line x1="24" y1="572" x2="338" y2="572" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="580" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="596" font-size="6.0" fill="#2F2A24" text-anchor="middle" letter-spacing="0.5">物壮则老，是谓不道；不道早已。</text>
<text x="190" y="608" font-size="5.0" fill="#4A5C55" text-anchor="middle">求壮，就是提前领老。</text>
<line x1="20" y1="634" x2="360" y2="634" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="648" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="664" font-size="8.4" fill="#2F2A24">兵是「合」的物理形态：它不让他想通，它让他不能不想通。</text>
<text x="20" y="680" font-size="8.4" fill="#2F2A24">弓有力，是因为它被拉满了；而拉满的弓，不能久张。</text>
</svg>