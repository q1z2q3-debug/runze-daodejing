<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 754" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一根轴，两轮同转；轴一断，两轮各自倒" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="754" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 章 · 抱 一</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">两轮一轴</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">载营魄抱一，能无离乎？</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「营魄」是魂与魄：魂气轻清，魄重浊；生时二者相合，死则相离。</text>
<text x="190" y="128" font-size="4.9" fill="#6E6459" text-anchor="middle">「载」是车载之载：一辆车，两根轮子穿在一根轴上，才走得动。</text>
<text x="24" y="152" font-size="5.2" fill="#4A5C55">一、抱一：一根轴，两轮同转</text>
<rect x="26" y="164" width="328" height="180" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="112" y1="272" x2="268" y2="272" stroke="#2F2A24" stroke-width="1.6"/>
<circle cx="112" cy="272" r="15" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<circle cx="112" cy="272" r="3" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="112" y1="272" x2="126" y2="272" stroke="#2F2A24" stroke-width="0.7" transform="rotate(0,112,272)"/>
<line x1="112" y1="272" x2="126" y2="272" stroke="#2F2A24" stroke-width="0.7" transform="rotate(45,112,272)"/>
<line x1="112" y1="272" x2="126" y2="272" stroke="#2F2A24" stroke-width="0.7" transform="rotate(90,112,272)"/>
<line x1="112" y1="272" x2="126" y2="272" stroke="#2F2A24" stroke-width="0.7" transform="rotate(135,112,272)"/>
<circle cx="268" cy="272" r="15" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<circle cx="268" cy="272" r="3" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="268" y1="272" x2="282" y2="272" stroke="#2F2A24" stroke-width="0.7" transform="rotate(0,268,272)"/>
<line x1="268" y1="272" x2="282" y2="272" stroke="#2F2A24" stroke-width="0.7" transform="rotate(45,268,272)"/>
<line x1="268" y1="272" x2="282" y2="272" stroke="#2F2A24" stroke-width="0.7" transform="rotate(90,268,272)"/>
<line x1="268" y1="272" x2="282" y2="272" stroke="#2F2A24" stroke-width="0.7" transform="rotate(135,268,272)"/>
<rect x="104" y="228" width="172" height="24" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="122" y1="252" x2="122" y2="272" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="258" y1="252" x2="258" y2="272" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="150" y1="228" x2="150" y2="218" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="230" y1="228" x2="230" y2="218" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="142" y1="218" x2="238" y2="218" stroke="#2F2A24" stroke-width="1.0"/>
<text x="190" y="210" font-size="4.5" fill="#2F2A24" text-anchor="middle">载：车上一副身，轴下一根一</text>
<text x="112" y="302" font-size="4.6" fill="#4A5C55" text-anchor="middle">魂</text>
<text x="268" y="302" font-size="4.6" fill="#6E6459" text-anchor="middle">魄</text>
<text x="190" y="265" font-size="4.5" fill="#4A5C55" text-anchor="middle">一＝轴</text>
<text x="190" y="332" font-size="4.5" fill="#4A5C55" text-anchor="middle">两轮一轴：魂不出走，魄不自沉，人在此时此地</text>
<text x="24" y="360" font-size="5.2" fill="#A2503B">二、离：轴一断，两轮各归其处</text>
<rect x="26" y="372" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="112" y1="456" x2="176" y2="456" stroke="#2F2A24" stroke-width="1.6"/>
<line x1="204" y1="456" x2="268" y2="456" stroke="#2F2A24" stroke-width="1.6"/>
<line x1="180" y1="461" x2="184" y2="448" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="198" y1="461" x2="202" y2="448" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="182" y1="461" x2="187" y2="448" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="200" y1="461" x2="205" y2="448" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="184" y1="461" x2="190" y2="448" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="202" y1="461" x2="208" y2="448" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="112" cy="456" r="15" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<circle cx="112" cy="456" r="3" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="112" y1="456" x2="126" y2="456" stroke="#2F2A24" stroke-width="0.7" transform="rotate(0,112,456)"/>
<line x1="112" y1="456" x2="126" y2="456" stroke="#2F2A24" stroke-width="0.7" transform="rotate(45,112,456)"/>
<line x1="112" y1="456" x2="126" y2="456" stroke="#2F2A24" stroke-width="0.7" transform="rotate(90,112,456)"/>
<line x1="112" y1="456" x2="126" y2="456" stroke="#2F2A24" stroke-width="0.7" transform="rotate(135,112,456)"/>
<circle cx="268" cy="456" r="15" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<circle cx="268" cy="456" r="3" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="268" y1="456" x2="282" y2="456" stroke="#2F2A24" stroke-width="0.7" transform="rotate(0,268,456)"/>
<line x1="268" y1="456" x2="282" y2="456" stroke="#2F2A24" stroke-width="0.7" transform="rotate(45,268,456)"/>
<line x1="268" y1="456" x2="282" y2="456" stroke="#2F2A24" stroke-width="0.7" transform="rotate(90,268,456)"/>
<line x1="268" y1="456" x2="282" y2="456" stroke="#2F2A24" stroke-width="0.7" transform="rotate(135,268,456)"/>
<line x1="112" y1="432" x2="112" y2="410" stroke="#A2503B" stroke-width="1.0" marker-end="url(#arrS)"/>
<line x1="268" y1="480" x2="268" y2="500" stroke="#A2503B" stroke-width="1.0" marker-end="url(#arrS)"/>
<text x="112" y="402" font-size="4.2" fill="#A2503B" text-anchor="middle">魂：轻清，上归于天</text>
<text x="268" y="510" font-size="4.2" fill="#A2503B" text-anchor="middle">魄：重浊，下归于地</text>
<text x="190" y="436" font-size="4.5" fill="#A2503B" text-anchor="middle">断</text>
<text x="190" y="532" font-size="4.5" fill="#6E6459" text-anchor="middle">轴断了才招魂，人已经走了——老子问的是生前合不合得住</text>
<text x="190" y="544" font-size="4.1" fill="#6E6459" text-anchor="middle">《礼记》：「魂气归于天，形魄归于地」</text>
<text x="24" y="568" font-size="5.2" fill="#2F2A24">凡人最大的分裂在这里：肉身活在当下，心神活在别处——活在评判里、活在掌控里。</text>
<text x="24" y="584" font-size="5.2" fill="#2F2A24">「抱一」不是把两样捏成一样，是让它们回到同一根轴上：身在此时，心也回到此时。</text>
<text x="24" y="602" font-size="5.0" fill="#4A5C55">一分开，两头都空：身体在做这件事，心已经在算下一件。</text>
<line x1="24" y1="620" x2="338" y2="620" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="628" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="644" font-size="6.0" fill="#2F2A24" text-anchor="middle">身在此时，心也回到此时；</text>
<text x="190" y="656" font-size="6.0" fill="#4A5C55" text-anchor="middle">一分开，两头都空。</text>
<line x1="20" y1="682" x2="360" y2="682" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="696" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="712" font-size="8.4" fill="#2F2A24">载营魄抱一，能无离乎？</text>
<text x="20" y="728" font-size="8.4" fill="#2F2A24">身在此时，心也回到此时。</text>
</svg>