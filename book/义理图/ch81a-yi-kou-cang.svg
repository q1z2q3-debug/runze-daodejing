<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 728" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="它越大，主人越不敢出门" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="728" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 八 十 一 章 · 仓</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一口仓</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">圣人不积，既以为人，己愈有。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">仓有四壁，有门，有锁：它能装，能算，能守着。</text>
<text x="190" y="127" font-size="4.5" fill="#6E6459" text-anchor="middle">仓是存量：越取越少；守得越紧，人越不敢走开。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、有壁有锁：装得下</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="290" x2="330" y2="290" stroke="#2F2A24" stroke-width="1"/>
<path d="M96,290 L96,214 L190,196 L284,214 L284,290" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.4"/>
<path d="M96,214 L190,196 L284,214" fill="none" stroke="#2F2A24" stroke-width="1.6"/>
<rect x="172" y="246" width="36" height="44" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="184" y="264" width="12" height="10" fill="#A2503B" stroke="none"/>
<path d="M186,264 q4,-6 8,0" fill="none" stroke="#A2503B" stroke-width="1.2"/>
<text x="190" y="306" font-size="4.5" fill="#A2503B" text-anchor="middle">装得下：四壁、门、锁</text>
<text x="190" y="330" font-size="4.6" fill="#4A5C55" text-anchor="middle">存量：一斗一斗数得清</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、越大，越不敢出门</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="494" x2="330" y2="494" stroke="#2F2A24" stroke-width="1"/>
<path d="M60,494 L60,414 L190,394 L320,414 L320,494" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.4"/>
<path d="M60,414 L190,394 L320,414" fill="none" stroke="#2F2A24" stroke-width="1.6"/>
<rect x="172" y="450" width="36" height="44" fill="#B9A98F" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="183" y="468" width="14" height="11" fill="#A2503B" stroke="none"/>
<path d="M186,468 q4,-7 8,0" fill="none" stroke="#A2503B" stroke-width="1.3"/>
<circle cx="120" cy="466" r="5" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M120,471 L120,494" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M113,494 L120,484 L127,494" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M124,476 l8,6" stroke="#2F2A24" stroke-width="1"/>
<circle cx="132" cy="483" r="1.4" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<circle cx="135" cy="484" r="1.4" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<circle cx="138" cy="485" r="1.4" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<text x="120" y="510" font-size="4.5" fill="#A2503B" text-anchor="middle">主人守在门外</text>
<text x="232" y="474" font-size="4.5" fill="#6E6459">仓越大，</text>
<text x="232" y="486" font-size="4.5" fill="#6E6459">越不敢走。</text>
<text x="190" y="534" font-size="4.6" fill="#4A5C55" text-anchor="middle">仓会空，泉不会：不积，是换一种算法</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">仓是存量：有壁、有门、有锁，越取越少。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">守得越紧，人越走不开——它越大，主人越不敢出门。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">圣人不积：不是不要仓，是知道仓算不出泉。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="5.2" fill="#2F2A24" text-anchor="middle">圣人不积，既以为人，己愈有。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">仓会空，泉不会。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">圣人不积，既以为人，己愈有。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">积者，存也；不积者，不把天下往怀里拐。</text>
</svg>