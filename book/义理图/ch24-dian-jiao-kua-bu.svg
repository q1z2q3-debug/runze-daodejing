<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 708" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="借来的高度站不住，省下的步子走不远" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="708" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 四 章 · 企 者 不 立</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">踮脚与跨步</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">企者不立，跨者不行。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">企，《说文》「举踵也」：踮起脚跟；跨，「渡也」：大步越过。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">一个求高，一个求快；动机是同一个：想越过自己本来的位置。</text>
<rect x="26" y="152" width="328" height="158" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="284" x2="340" y2="284" stroke="#C9B79A" stroke-width="0.9"/>
<circle cx="108" cy="192" r="6.5" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="108" y1="199" x2="108" y2="236" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="108" y1="206" x2="96" y2="226" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="108" y1="206" x2="120" y2="224" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="108" y1="236" x2="106" y2="270" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="108" y1="236" x2="110" y2="268" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M106,270 C102,278 114,282 126,284" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M106,270 C112,280 120,282 126,284" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="126" y1="284" x2="126" y2="280.5" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="98" y1="270" x2="98" y2="284" stroke="#A2503B" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="78" y="274" font-size="3.7" fill="#A2503B" text-anchor="end">脚跟离地</text>
<line x1="80" y1="272" x2="96" y2="276" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="110" y="300" font-size="3.9" fill="#6E6459" text-anchor="middle">踮起半寸：靠小腿撑着</text>
<circle cx="254" cy="192" r="6.5" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="254" y1="199" x2="254" y2="236" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="254" y1="206" x2="241" y2="224" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="254" y1="206" x2="267" y2="222" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="254" y1="236" x2="280" y2="281" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="254" y1="236" x2="230" y2="281" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="272" y1="284" x2="292" y2="284" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="222" y1="284" x2="240" y2="284" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M228,274 C246,264 264,264 280,274" fill="none" stroke="#A2503B" stroke-width="0.9" stroke-dasharray="5 3"/>
<text x="306" y="258" font-size="3.7" fill="#A2503B">省下的半步</text>
<line x1="304" y1="256" x2="284" y2="268" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="248" y="300" font-size="3.9" fill="#6E6459" text-anchor="middle">一步当两步走：赊的</text>
<text x="24" y="323" font-size="5.0" fill="#A2503B">一、踮脚与跨步：借来的高度、赊来的步子</text>
<rect x="26" y="336" width="328" height="156" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<text x="88" y="368" font-size="5.2" fill="#A2503B">自见者</text>
<line x1="146" y1="366" x2="192" y2="366" stroke="#DCCBB0" stroke-width="0.7" stroke-dasharray="3 3"/>
<text x="206" y="368" font-size="7.4" fill="#2F2A24">不明</text>
<text x="88" y="400" font-size="5.2" fill="#A2503B">自是者</text>
<line x1="146" y1="398" x2="192" y2="398" stroke="#DCCBB0" stroke-width="0.7" stroke-dasharray="3 3"/>
<text x="206" y="400" font-size="7.4" fill="#2F2A24">不彰</text>
<text x="88" y="432" font-size="5.2" fill="#A2503B">自伐者</text>
<line x1="146" y1="430" x2="192" y2="430" stroke="#DCCBB0" stroke-width="0.7" stroke-dasharray="3 3"/>
<text x="206" y="432" font-size="7.4" fill="#2F2A24">无功</text>
<text x="88" y="464" font-size="5.2" fill="#A2503B">自矜者</text>
<line x1="146" y1="462" x2="192" y2="462" stroke="#DCCBB0" stroke-width="0.7" stroke-dasharray="3 3"/>
<text x="206" y="464" font-size="7.4" fill="#2F2A24">不长</text>
<text x="88" y="478" font-size="3.9" fill="#4A5C55">四个方向，同一个人往上举；举的是自己，落下去的是那一样。</text>
<text x="24" y="505" font-size="5.0" fill="#4A5C55">二、四句：同一根线往上举，落下去的是那一样</text>
<text x="24" y="522" font-size="4.9" fill="#2F2A24">踮脚能站住，靠的是小腿那点力气；力气一松，人就落回原高。</text>
<text x="24" y="538" font-size="4.9" fill="#2F2A24">跨步能走远，靠的是每一步省了半步；省下的半步，迟早要还。</text>
<text x="24" y="556" font-size="4.9" fill="#4A5C55">功本身没丢，丢的是功的成色：做完还要说，就成了买卖。</text>
<line x1="24" y1="574" x2="338" y2="574" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="582" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="598" font-size="5.2" fill="#2F2A24" text-anchor="middle">借来的高度站不住，省下的步子走不远。</text>
<text x="190" y="610" font-size="4.5" fill="#4A5C55" text-anchor="middle">问题不在能力，在姿势。</text>
<line x1="20" y1="636" x2="360" y2="636" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="650" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="666" font-size="8.4" fill="#2F2A24">借来的高度站不住，省下的步子走不远。</text>
<text x="20" y="682" font-size="8.4" fill="#2F2A24">功本身没丢，丢的是功的成色。</text>
</svg>