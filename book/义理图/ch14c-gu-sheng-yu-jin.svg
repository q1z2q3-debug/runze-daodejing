<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 724" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="执古之道，以御今之有：一根准绳，量得住今天的手" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="724" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 四 章 · 准 绳</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一根准绳</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">执古之道，以御今之有；能知古始，是谓道纪。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">今之尺各说各话：同一样东西，谁量谁是数。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">古始是一切存在共同的源头；执古，是用那根共同的绳去量。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、三把今尺：同一只箱，量出三个数</text>
<rect x="26" y="164" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="60" y="208" width="56" height="48" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="60" y1="224" x2="116" y2="224" stroke="#DCCBB0" stroke-width="0.7"/>
<line x1="60" y1="240" x2="116" y2="240" stroke="#DCCBB0" stroke-width="0.7"/>
<line x1="120" y1="214" x2="198" y2="214" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="135.6" y1="211" x2="135.6" y2="217" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="151.2" y1="211" x2="151.2" y2="217" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="166.8" y1="211" x2="166.8" y2="217" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="182.4" y1="211" x2="182.4" y2="217" stroke="#DCCBB0" stroke-width="0.8"/>
<text x="212" y="216" font-size="4.8" fill="#A2503B">三</text>
<line x1="120" y1="230" x2="214" y2="230" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="138.8" y1="227" x2="138.8" y2="233" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="157.6" y1="227" x2="157.6" y2="233" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="176.4" y1="227" x2="176.4" y2="233" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="195.2" y1="227" x2="195.2" y2="233" stroke="#DCCBB0" stroke-width="0.8"/>
<text x="228" y="232" font-size="4.8" fill="#A2503B">五</text>
<line x1="120" y1="246" x2="230" y2="246" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="142.0" y1="243" x2="142.0" y2="249" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="164.0" y1="243" x2="164.0" y2="249" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="186.0" y1="243" x2="186.0" y2="249" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="208.0" y1="243" x2="208.0" y2="249" stroke="#DCCBB0" stroke-width="0.8"/>
<text x="244" y="248" font-size="4.8" fill="#A2503B">七</text>
<text x="190" y="302" font-size="4.7" fill="#A2503B" text-anchor="middle">甲、乙、丙三把今尺，各有各的刻：同一只箱，量出三个数</text>
<text x="24" y="330" font-size="5.2" fill="#4A5C55">二、一根古绳：拉直了，箱子挂上去，只得一个数</text>
<rect x="26" y="342" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M52,408 q140,8 276,0" fill="none" stroke="#2F2A24" stroke-width="1.6"/>
<circle cx="52" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="75" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="98" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="121" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="144" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="167" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="190" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="213" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="236" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="259" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="282" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="305" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="328" cy="411" r="2.0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<text x="52" y="398" font-size="4.2" fill="#4A5C55">古·本始</text>
<text x="328" y="398" font-size="4.2" fill="#4A5C55" text-anchor="end">今·有</text>
<line x1="166" y1="410" x2="166" y2="430" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="140" y="430" width="52" height="46" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="140" y1="445" x2="192" y2="445" stroke="#DCCBB0" stroke-width="0.7"/>
<line x1="140" y1="461" x2="192" y2="461" stroke="#DCCBB0" stroke-width="0.7"/>
<text x="196" y="452" font-size="4.1" fill="#4A5C55">一个数：同一根绳上的同一个结</text>
<text x="52" y="506" font-size="4.7" fill="#4A5C55">绳绳兮不可名：它一直在起作用，却始终没有名字</text>
<text x="24" y="538" font-size="4.9" fill="#2F2A24">古不是过去，是本始：一切存在共同的源头。执古不是复古，是拿那根共同的绳来量今天。</text>
<text x="24" y="554" font-size="4.9" fill="#2F2A24">御不是驭世，是安己：手里的物有了定数，人就不必再拿自己的尺去争一个高低。</text>
<text x="24" y="572" font-size="4.9" fill="#4A5C55">能知古始，是谓道纪——知道了万物的来处，才有一根不被风向吹弯的准绳。</text>
<line x1="24" y1="590" x2="338" y2="590" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="598" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="614" font-size="6.0" fill="#2F2A24" text-anchor="middle">执古之道，以御今之有；</text>
<text x="190" y="626" font-size="6.0" fill="#4A5C55" text-anchor="middle">不是驭世，是安己。</text>
<line x1="20" y1="652" x2="360" y2="652" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="666" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="682" font-size="8.4" fill="#2F2A24">执古之道，以御今之有；能知古始，是谓道纪。</text>
<text x="20" y="698" font-size="8.4" fill="#2F2A24">古不是过去，是本始：一根不被风向吹弯的准绳。</text>
</svg>