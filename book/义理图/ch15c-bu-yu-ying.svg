<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="夫唯不盈，故能蔽而新成：旧罐不满，反而常新" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="740" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 五 章 · 不 欲 盈</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">旧罐</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">夫唯不盈，故能蔽而新成。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">盈不是「多」，是「没有再往里的余地」。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">不盈：留一处空，器物才换得动、久得住。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、新罐盛满：一次就要盛到头，罐口溢、罐身裂</text>
<rect x="26" y="164" width="328" height="172" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<ellipse cx="110" cy="268.0" rx="30" ry="24.0" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="92.6" y="218" width="34.8" height="28" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="110" cy="218" rx="17.4" ry="4" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M80,292.0 a30,9 0 0 0 60,0" fill="none" stroke="#2F2A24" stroke-width="0.0"/>
<path d="M116,248 l5,12 l-4,9 l6,10" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<path d="M94,222 q-5,8 -8,13 M126,222 q5,8 8,13" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<circle cx="84" cy="238" r="1.6" fill="#4A5C55"/>
<circle cx="136" cy="238" r="1.6" fill="#4A5C55"/>
<text x="110" y="314" font-size="4.2" fill="#A2503B" text-anchor="middle">满到没处可加：脆</text>
<text x="258" y="256" font-size="4.2" fill="#A2503B" text-anchor="middle">新的、满的、不碰就裂的</text>
<text x="258" y="276" font-size="4.1" fill="#6E6459" text-anchor="middle">盈则无余地：换不动，也久不住</text>
<text x="24" y="354" font-size="5.2" fill="#4A5C55">二、旧罐七分：斑驳却完好，留三口空在里头</text>
<rect x="26" y="366" width="328" height="168" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<ellipse cx="110" cy="464.0" rx="27" ry="22.0" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="94.34" y="416" width="31.317407407407407" height="28" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="110" cy="416" rx="15.657407407407408" ry="4" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M83,486.0 a27,9 0 0 0 54,0" fill="none" stroke="#2F2A24" stroke-width="0.0"/>
<circle cx="101" cy="456" r="1.6" fill="#C9B79A"/>
<circle cx="117" cy="470" r="1.4" fill="#C9B79A"/>
<line x1="86" y1="450" x2="134" y2="450" stroke="#4A5C55" stroke-width="0.7" stroke-dasharray="3 2"/>
<text x="140" y="450" font-size="4.0" fill="#4A5C55">只到七分：留三口空</text>
<text x="110" y="514" font-size="4.2" fill="#4A5C55" text-anchor="middle">旧而不坏：蔽而新成</text>
<text x="262" y="456" font-size="4.2" fill="#4A5C55" text-anchor="middle">旧了、不满、还在用</text>
<text x="262" y="476" font-size="4.1" fill="#6E6459" text-anchor="middle">留白处换得动气，故常新</text>
<text x="24" y="554" font-size="4.9" fill="#2F2A24">「蔽」是旧、是覆着的那层旧相；「新成」是它仍能成事。留一处不满，旧物就还在生长。</text>
<text x="24" y="570" font-size="4.9" fill="#2F2A24">人不肯留空，是怕不够；越怕不够，越先裂。</text>
<text x="24" y="588" font-size="4.9" fill="#4A5C55">不欲盈：不是不要，是不肯盛到没有余地的那一步。</text>
<line x1="24" y1="606" x2="338" y2="606" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="614" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="630" font-size="6.0" fill="#2F2A24" text-anchor="middle">夫唯不盈，</text>
<text x="190" y="642" font-size="6.0" fill="#4A5C55" text-anchor="middle">故能蔽而新成。</text>
<line x1="20" y1="668" x2="360" y2="668" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="682" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="698" font-size="8.4" fill="#2F2A24">夫唯不盈，故能蔽而新成。</text>
<text x="20" y="714" font-size="8.4" fill="#2F2A24">留一处不满，旧物就还在生长。</text>
</svg>