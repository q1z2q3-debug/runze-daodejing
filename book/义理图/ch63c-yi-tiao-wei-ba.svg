<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 604" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="易本是蜥蜴：会变色，会断尾——看得容易，是没看见它会变" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="604" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 三 章 · 易</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一条尾巴</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">夫轻诺必寡信，多易必多难。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「易」本义是蜥蜴：会变色，会断尾——不是「容易」那个易。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">你看它趴着不动，就当它不会变；一拉，尾巴先没了。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、会变色、会断尾的那条尾巴</text>
<line x1="76" y1="314" x2="318" y2="314" stroke="#DCCBB0" stroke-width="0.7" stroke-dasharray="4 3"/>
<ellipse cx="184" cy="262" rx="44" ry="16" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M184,246 A44,16 0 0 0 184,278 L184,278 Z" fill="#CFD8CD" stroke="none"/>
<path d="M184,246 A44,16 0 0 1 228,262 L184,262 Z" fill="#E3D2C6" stroke="none"/>
<ellipse cx="184" cy="262" rx="44" ry="16" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M146,252 C132,254 112,258 102,262 C112,267 132,272 146,274" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="126" cy="262" r="1.7" fill="#2F2A24"/>
<path d="M102,262 L116,264" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M156,276 L150,292 L146,312" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="146" y1="312" x2="142" y2="312" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M176,278 L174,294 L172,312" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="172" y1="312" x2="168" y2="312" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M204,278 L208,294 L212,312" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="212" y1="312" x2="208" y2="312" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M220,274 L226,290 L232,310" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="232" y1="310" x2="228" y2="310" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M226,256 C248,254 264,266 270,278" fill="none" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="272" y1="274" x2="278" y2="280" stroke="#A2503B" stroke-width="1.6"/>
<line x1="268" y1="278" x2="274" y2="284" stroke="#A2503B" stroke-width="1.6"/>
<path d="M278,288 C292,298 302,304 310,312" fill="none" stroke="#2F2A24" stroke-width="1.2" stroke-dasharray="2 1.6"/>
<text x="300" y="330" font-size="4.2" fill="#A2503B" text-anchor="middle">断了的那一截</text>
<text x="120" y="330" font-size="4.5" fill="#6E6459" text-anchor="middle">半青半赭：它会变色</text>
<text x="24" y="354" font-size="4.8" fill="#2F2A24">「易」本是蜥蜴的名字：会变色，尾巴一拉就断，断了自己再长。</text>
<text x="24" y="370" font-size="4.9" fill="#2F2A24">轻诺、多易，错在把趴着不动的当成了不会动的。</text>
<text x="24" y="388" font-size="5.0" fill="#4A5C55">圣人犹难之：连看得容易的，也先当它会变，所以终无难。</text>
<line x1="24" y1="406" x2="338" y2="406" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="414" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="430" font-size="5.6" fill="#2F2A24" text-anchor="middle">易本是蜥蜴：会变色，会断尾；</text>
<text x="190" y="442" font-size="5.2" fill="#4A5C55" text-anchor="middle">看得容易，是没看见它会变。</text>
<line x1="20" y1="468" x2="360" y2="468" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="482" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="498" font-size="8.4" fill="#2F2A24">易本是蜥蜴：会变色，会断尾；看得容易，是没看见它会变。</text>
<text x="20" y="514" font-size="8.4" fill="#2F2A24">轻诺必寡信，多易必多难；圣人犹难之，故终无难。</text>
</svg>