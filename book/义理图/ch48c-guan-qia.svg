<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="不是懒，是勤得太多" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="512" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 八 章 · 事</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一道关，一道关</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">取天下常以无事，及其有事，不足以取天下。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.6" fill="#2F2A24" text-anchor="middle">「事」，《说文》「职也」：无事不是什么都不干，是不给自己加职分。</text>
<text x="190" y="126" font-size="5.2" fill="#A2503B" text-anchor="middle">「取」，《说文》「捕取也」——从又从耳：割左耳计功的那个取。</text>
<text x="24" y="158" font-size="5.6" fill="#A2503B">一 · 有事：一道关、一道关往上加</text>
<line x1="24" y1="206" x2="338" y2="206" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="74" y1="206" x2="74" y2="180" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="96" y1="206" x2="96" y2="180" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="71" y1="182" x2="99" y2="182" stroke="#A2503B" stroke-width="0.7"/>
<line x1="148" y1="206" x2="148" y2="180" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="170" y1="206" x2="170" y2="180" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="145" y1="182" x2="173" y2="182" stroke="#A2503B" stroke-width="0.7"/>
<line x1="222" y1="206" x2="222" y2="180" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="244" y1="206" x2="244" y2="180" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="219" y1="182" x2="247" y2="182" stroke="#A2503B" stroke-width="0.7"/>
<text x="36" y="234" font-size="4.8" fill="#6E6459">每干一件，就多一道边；守的地方越多，漏的地方越多。</text>
<text x="24" y="262" font-size="5.6" fill="#4A5C55">二 · 无事：一道也不设</text>
<line x1="24" y1="310" x2="338" y2="310" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="28" y1="299" x2="334" y2="299" stroke="#4A5C55" stroke-width="0.35" stroke-dasharray="6 5" opacity="0.6"/>
<line x1="90" y1="310" x2="90" y2="286" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 3"/>
<line x1="112" y1="310" x2="112" y2="286" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 3"/>
<line x1="87" y1="288" x2="115" y2="288" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 3"/>
<line x1="164" y1="310" x2="164" y2="286" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 3"/>
<line x1="186" y1="310" x2="186" y2="286" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 3"/>
<line x1="161" y1="288" x2="189" y2="288" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 3"/>
<line x1="238" y1="310" x2="238" y2="286" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 3"/>
<line x1="260" y1="310" x2="260" y2="286" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 3"/>
<line x1="235" y1="288" x2="263" y2="288" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 3"/>
<text x="300" y="278" font-size="4.5" fill="#6E6459" text-anchor="middle">虚线：本该有的关，一道也没设</text>
<text x="36" y="338" font-size="4.8" fill="#6E6459">不新立法度，不频出号令，不年年加码。</text>
<text x="24" y="358" font-size="5.6" fill="#2F2A24">那个时代最好的治理，是让人感觉不到有人在管。</text>
<text x="24" y="374" font-size="5.6" fill="#A2503B">一个上位者最容易犯的，不是懒，是勤——他总想再干点什么。</text>
<line x1="24" y1="400" x2="338" y2="400" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="408" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="424" font-size="6.0" fill="#2F2A24" text-anchor="middle">「取天下」的「取」是割耳朵，所以老子换了个动作：</text>
<text x="190" y="436" font-size="6.0" fill="#A2503B" text-anchor="middle">不是割，是不动。</text>
<line x1="20" y1="462" x2="360" y2="462" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="476" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="492" font-size="8.4" fill="#2F2A24">「取天下」的「取」是割耳朵，所以老子换了一个动作：不是割，是不动。</text>
</svg>