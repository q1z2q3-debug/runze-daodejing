<line x1="124" y1="462" x2="116" y2="462" stroke="#A2503B" stroke-width="2"/>
<line x1="140" y1="456" x2="140" y2="468" stroke="#A2503B" stroke-width="1"/>
<line x1="164" y1="456" x2="164" y2="468" stroke="#A2503B" stroke-width="1"/>
<path d="M186,462 L200,462" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="3 2"/>
<line x1="200" y1="455" x2="200" y2="469" stroke="#A2503B" stroke-width="1.1"/>
<text x="196" y="448" font-size="4.4" fill="#A2503B" text-anchor="middle">卡住</text>
<text x="190" y="514" font-size="4.6" fill="#4A5C55" text-anchor="middle">逆着走，刀就卡：力加在刃上，不在禾上</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">刀不砍，只是顺着禾走：顺是「不害」的做法。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">逆着走，禾没下来，刀先卡住——力用在自己身上了。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">天之道，利而不害；圣人之道，为而不争。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="4.8" fill="#2F2A24" text-anchor="middle">天之道，利而不害；圣人之道，为而不争。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">刀顺着禾走，禾才下来。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">天之道，利而不害；圣人之道，为而不争。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">利者，顺也；不害者，不逆也。</text>
</svg>