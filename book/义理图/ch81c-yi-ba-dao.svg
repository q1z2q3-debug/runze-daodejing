<text x="252" y="198" font-size="4.6" fill="#A2503B" text-anchor="middle">顺</text>
<text x="190" y="310" font-size="4.6" fill="#4A5C55" text-anchor="middle">刀顺着禾走，禾就下来</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、逆着走：刀卡住</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="492" x2="330" y2="492" stroke="#2F2A24" stroke-width="1"/>
