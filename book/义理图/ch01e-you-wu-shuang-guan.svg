<svg viewBox="0 0 1000 1152" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="以有观无与以无观有：十九级的空与用" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif"><rect x="0" y="0" width="1000" height="1152" fill="#F8F3E6"/><text x="110" y="30" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">义 理 图 · 有 无 双 观</text><text x="110" y="66" font-size="18" fill="#2F2A24">以有观无，一路上到宇宙；以无观有，一路下到量子</text><text x="110" y="88" font-size="10.5" fill="#6E6459">每一级先空出一处，那一层的「妙」就住在里头 —— 空是「徼」围出来的，不是第一章那个「无」。</text><text x="270" y="124" font-size="8.4" fill="#8A7C69" text-anchor="end" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="2">级</text><text x="322" y="124" font-size="8.4" fill="#B5462F" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="2">它空出的那一处（妙所寓）</text><text x="950" y="124" font-size="8.4" fill="#4A5C55" text-anchor="end" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="2">因此之「用」</text><path d="M290,856 L290,168" stroke="#DCCBB0" stroke-width="0.9"/><path d="M285,156 L290,118 L295,156" fill="none" stroke="#B5462F" stroke-width="1.3"/><path d="M285,868 L290,906 L295,868" fill="none" stroke="#2E7C8F" stroke-width="1.3"/><text x="274" y="902" font-size="9" fill="#2E7C8F" letter-spacing="1" text-anchor="end">以无观有 · 还原在下</text><line x1="280" y1="850.0" x2="300" y2="850.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="854.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">量子</text><text x="320" y="854.0" font-size="9" fill="#A2503B">「无可再分」，它没有里面</text><text x="950" y="854.0" font-size="9" fill="#4A5C55" text-anchor="end">一切精确性的底</text><line x1="280" y1="812.0" x2="300" y2="812.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="816.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">元素</text><text x="320" y="816.0" font-size="9" fill="#A2503B">同一元素，千万种样子</text><text x="950" y="816.0" font-size="9" fill="#4A5C55" text-anchor="end">同一种料，到处可用</text><line x1="280" y1="774.0" x2="300" y2="774.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="778.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">原子</text><text x="320" y="778.0" font-size="9" fill="#A2503B">空轨道：价住在空处</text><text x="950" y="778.0" font-size="9" fill="#4A5C55" text-anchor="end">能成键，才有万物</text><line x1="280" y1="736.0" x2="300" y2="736.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="740.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">无机小分子</text><text x="320" y="740.0" font-size="9" fill="#A2503B">晶格之间的间隙</text><text x="950" y="740.0" font-size="9" fill="#4A5C55" text-anchor="end">能溶、能渗</text><line x1="280" y1="698.0" x2="300" y2="698.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="702.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">有机大分子</text><text x="320" y="702.0" font-size="9" fill="#A2503B">链与链之间的折叠空间</text><text x="950" y="702.0" font-size="9" fill="#4A5C55" text-anchor="end">能存信息、能自组装</text><line x1="280" y1="660.0" x2="300" y2="660.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="664.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">蛋白质</text><text x="320" y="664.0" font-size="9" fill="#A2503B">活性口袋：口袋空了才装下底物</text><text x="950" y="664.0" font-size="9" fill="#4A5C55" text-anchor="end">能催化，成为酶</text><line x1="280" y1="622.0" x2="300" y2="622.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="626.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">细胞</text><text x="320" y="626.0" font-size="9" fill="#A2503B">膜围出的「内」——第一次有里面</text><text x="950" y="626.0" font-size="9" fill="#4A5C55" text-anchor="end">能代谢、能自持</text><line x1="280" y1="584.0" x2="300" y2="584.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="588.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">组织</text><text x="320" y="588.0" font-size="9" fill="#A2503B">细胞之间的缝</text><text x="950" y="588.0" font-size="9" fill="#4A5C55" text-anchor="end">能输送、能连接</text><line x1="280" y1="546.0" x2="300" y2="546.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="550.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">器官</text><text x="320" y="550.0" font-size="9" fill="#A2503B">腔与管：胃腔、血管腔、心腔</text><text x="950" y="550.0" font-size="9" fill="#4A5C55" text-anchor="end">能收纳、能流通</text><line x1="280" y1="508.0" x2="300" y2="508.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="512.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">五脏六腑</text><text x="320" y="512.0" font-size="9" fill="#A2503B">系统之间的循环回路</text><text x="950" y="512.0" font-size="9" fill="#4A5C55" text-anchor="end">能生化、能平衡</text><line x1="280" y1="470.0" x2="300" y2="470.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="474.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">人体</text><text x="320" y="474.0" font-size="9" fill="#A2503B">意识：心里那个空，装得下万物</text><text x="950" y="474.0" font-size="9" fill="#4A5C55" text-anchor="end">能观、能知</text><line x1="280" y1="432.0" x2="300" y2="432.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="436.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">家庭</text><text x="320" y="436.0" font-size="9" fill="#A2503B">成员之间的位份：人不在，位还空着</text><text x="950" y="436.0" font-size="9" fill="#4A5C55" text-anchor="end">能承继、能相处</text><line x1="280" y1="394.0" x2="300" y2="394.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="398.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">团体·企业</text><text x="320" y="398.0" font-size="9" fill="#A2503B">岗位：职位是空位，人填进去</text><text x="950" y="398.0" font-size="9" fill="#4A5C55" text-anchor="end">能分工、能协作</text><line x1="280" y1="356.0" x2="300" y2="356.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="360.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">国家</text><text x="320" y="360.0" font-size="9" fill="#A2503B">制度：一个空框，人处其中</text><text x="950" y="360.0" font-size="9" fill="#4A5C55" text-anchor="end">能治、能序</text><line x1="280" y1="318.0" x2="300" y2="318.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="322.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">文明</text><text x="320" y="322.0" font-size="9" fill="#A2503B">生死之间的传递：人没了，话还在</text><text x="950" y="322.0" font-size="9" fill="#4A5C55" text-anchor="end">能积累、能超越个体</text><line x1="280" y1="280.0" x2="300" y2="280.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="284.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">生态圈</text><text x="320" y="284.0" font-size="9" fill="#A2503B">物质循环的回路</text><text x="950" y="284.0" font-size="9" fill="#4A5C55" text-anchor="end">能自养、能再生</text><line x1="280" y1="242.0" x2="300" y2="242.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="246.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">地球</text><text x="320" y="246.0" font-size="9" fill="#A2503B">圈层界面：地壳与大气之间</text><text x="950" y="246.0" font-size="9" fill="#4A5C55" text-anchor="end">能承载</text><line x1="280" y1="204.0" x2="300" y2="204.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="208.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">星系</text><text x="320" y="208.0" font-size="9" fill="#A2503B">引力势阱：看不见的坑，星在其中</text><text x="950" y="208.0" font-size="9" fill="#4A5C55" text-anchor="end">能聚、能成形</text><line x1="280" y1="166.0" x2="300" y2="166.0" stroke="#2F2A24" stroke-width="1"/><text x="266" y="170.0" font-size="10" fill="#2F2A24" font-weight="600" text-anchor="end">宇宙</text><text x="320" y="170.0" font-size="9" fill="#A2503B">大而无外：连「外」也没有</text><text x="950" y="170.0" font-size="9" fill="#4A5C55" text-anchor="end">能容一切</text><text x="500.0" y="932" font-size="11" fill="#2F2A24" text-anchor="middle">此两者同出而异名，同谓之玄 —— 不是两条路，是同一实相的两面。</text><text x="500.0" y="960" font-size="9.6" fill="#6E6459" text-anchor="middle">向上看得越远，看见的是更大的空；向下看得越深，看见的是更细的实。</text><text x="500.0" y="984" font-size="9.6" fill="#A2503B" text-anchor="middle">空不是没有，是被「有」围出来的那一处可用之处。</text><text x="500.0" y="1010" font-size="9.4" fill="#6E6459" text-anchor="middle">而空之所以有用，不在空本身，在里头住着那一层的妙 —— 无形之势。</text><text x="500.0" y="1040" font-size="9.4" fill="#B5462F" text-anchor="middle">「无」与「空」二字分用：无是尚未分化处，空是已有形之后围出来的未占处。</text><line x1="90" y1="1088" x2="910" y2="1088" stroke="#E6D8C2" stroke-width="0.8"/><text x="90" y="1104" font-size="8.4" fill="#A89577" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="2">本 章 金 句</text><text x="500.0" y="1122" font-size="10" fill="#2F2A24" text-anchor="middle">常无欲以观其妙。</text><text x="500.0" y="1140" font-size="10" fill="#2F2A24" text-anchor="middle">观妙是见势：空是「徼」围出来的，妙住在空里。</text></svg>