<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 746" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="为己是一条通道，尽头是枯；不为己是一个环，通了就能久" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="746" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 章 · 环</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一个环</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">天地所以能长且久者，以其不自生，故能长生。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.0" fill="#2F2A24" text-anchor="middle">两种活法的差别不在善恶，在闭环：为己的是一条单向通道，不为己的是一个循环。</text>
<text x="190" y="128" font-size="5.0" fill="#6E6459" text-anchor="middle">取进来、堵在里头，越堵越紧；生出去、收回来、再出去，通了就能久。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、为己：取进来，堵在里头</text>
<rect x="26" y="164" width="328" height="164" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="52" y1="222" x2="286" y2="222" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="52" y1="274" x2="286" y2="274" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="286" y1="222" x2="286" y2="274" stroke="#2F2A24" stroke-width="3.0"/>
<line x1="238" y1="226" x2="238" y2="270" stroke="#B9A98F" stroke-width="0.6"/>
<line x1="248" y1="226" x2="248" y2="270" stroke="#B9A98F" stroke-width="0.6"/>
<line x1="258" y1="226" x2="258" y2="270" stroke="#B9A98F" stroke-width="0.6"/>
<line x1="268" y1="226" x2="268" y2="270" stroke="#B9A98F" stroke-width="0.6"/>
<line x1="66" y1="248" x2="128" y2="248" stroke="#A2503B" stroke-width="1.2" marker-end="url(#arrS)"/>
<text x="74" y="214" font-size="5.0" fill="#A2503B">取</text>
<line x1="140" y1="248" x2="196" y2="248" stroke="#A2503B" stroke-width="1.0" marker-end="url(#arrS)"/>
<text x="214" y="214" font-size="5.0" fill="#A2503B" text-anchor="middle">堵</text>
<text x="304" y="242" font-size="4.5" fill="#A2503B" text-anchor="end">尽头</text>
<text x="304" y="254" font-size="4.5" fill="#A2503B" text-anchor="end">是枯</text>
<text x="190" y="318" font-size="4.5" fill="#A2503B" text-anchor="middle">通道只进不出：越堵越紧，紧到某处就尽</text>
<text x="24" y="356" font-size="5.2" fill="#4A5C55">二、不为己：生出去，再回来</text>
<rect x="26" y="368" width="328" height="164" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<ellipse cx="190" cy="452" rx="92" ry="54" fill="none" stroke="#4A5C55" stroke-width="1.4"/>
<circle cx="190.0" cy="398.0" r="2.2" fill="#4A5C55"/>
<circle cx="282.0" cy="452.0" r="2.2" fill="#4A5C55"/>
<circle cx="190.0" cy="506.0" r="2.2" fill="#4A5C55"/>
<circle cx="98.0" cy="452.0" r="2.2" fill="#4A5C55"/>
<path d="M110,425 Q190,380 270,425" fill="none" stroke="#4A5C55" stroke-width="1.3" marker-end="url(#arr2)"/>
<path d="M270,479 Q190,524 110,479" fill="none" stroke="#4A5C55" stroke-width="1.3" marker-end="url(#arr2)"/>
<text x="190" y="446" font-size="5.0" fill="#4A5C55" text-anchor="middle">空</text>
<text x="294" y="408" font-size="4.5" fill="#4A5C55">生出去</text>
<text x="86" y="504" font-size="4.5" fill="#4A5C55" text-anchor="end">收回来</text>
<text x="190" y="522" font-size="4.5" fill="#4A5C55" text-anchor="middle">环里始终空着：不占住哪一段，才转得下去</text>
<text x="24" y="560" font-size="5.2" fill="#2F2A24">天地没有一颗「为我」的心，所以不被「取—耗」这条闭环困住。</text>
<text x="24" y="576" font-size="5.2" fill="#2F2A24">生发与归根往复流通，不滞一处，所以长久——这叫长生，不是求来的。</text>
<text x="24" y="594" font-size="5.2" fill="#4A5C55">不是先有一个长久的目标再去不自生；是先不自生，长久自己来。</text>
<line x1="24" y1="612" x2="338" y2="612" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="620" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="636" font-size="6.0" fill="#2F2A24" text-anchor="middle">为己者，取而入，入而塞；</text>
<text x="190" y="648" font-size="6.0" fill="#4A5C55" text-anchor="middle">不为己者，生而出，出而复。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">天地所以能长且久者，以其不自生，故能长生。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">为己者，取而入，入而塞；不为己者，生而出，出而复——差别不在善恶，在闭环。</text>
</svg>