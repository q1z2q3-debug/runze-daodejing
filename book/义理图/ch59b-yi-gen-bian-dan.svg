<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="重积德则无不克：克训「肩」，是担得起，不是打遍天下" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="648" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 九 章 · 克</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一根扁担</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">重积德则无不克。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「积」从禾，是一袋一袋码起来；「克」训「肩」，是扛得起。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">所以「无不克」不是打遍天下，是天下事都担得起。</text>
<text x="24" y="146" font-size="5.4" fill="#4A5C55">一根扁担两头沉：担得起，才走得远</text>
<line x1="24" y1="278" x2="250" y2="278" stroke="#2F2A24" stroke-width="1"/>
<circle cx="114" cy="206" r="6" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="114" y1="212" x2="114" y2="248" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="100" y1="220" x2="128" y2="220" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="114" y1="248" x2="102" y2="278" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="114" y1="248" x2="126" y2="278" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="56" y1="220" x2="172" y2="220" stroke="#2F2A24" stroke-width="2"/>
<line x1="56" y1="220" x2="56" y2="226" stroke="#2F2A24" stroke-width="0.5"/>
<path d="M40,226 L72,226 L67,276 L45,276 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="46" y1="234" x2="66" y2="234" stroke="#DCCBB0" stroke-width="0.4"/>
<line x1="46" y1="244" x2="66" y2="244" stroke="#DCCBB0" stroke-width="0.4"/>
<line x1="46" y1="254" x2="66" y2="254" stroke="#DCCBB0" stroke-width="0.4"/>
<line x1="172" y1="220" x2="172" y2="226" stroke="#2F2A24" stroke-width="0.5"/>
<path d="M156,226 L188,226 L183,276 L161,276 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="162" y1="234" x2="182" y2="234" stroke="#DCCBB0" stroke-width="0.4"/>
<line x1="162" y1="244" x2="182" y2="244" stroke="#DCCBB0" stroke-width="0.4"/>
<line x1="162" y1="254" x2="182" y2="254" stroke="#DCCBB0" stroke-width="0.4"/>
<text x="56" y="292" font-size="4.4" fill="#6E6459" text-anchor="middle">一头：担子</text>
<text x="172" y="292" font-size="4.4" fill="#6E6459" text-anchor="middle">另一头：也担着</text>
<text x="196" y="200" font-size="4.8" fill="#4A5C55">克是肩：</text>
<text x="196" y="212" font-size="4.4" fill="#6E6459">担得起，不是打得过</text>
<text x="24" y="318" font-size="5.4" fill="#A2503B">积是码货：一袋一袋往上堆，才堆得高</text>
<line x1="24" y1="434" x2="250" y2="434" stroke="#2F2A24" stroke-width="1"/>
<rect x="101.0" y="416" width="30" height="16" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="107.0" y1="427" x2="125.0" y2="427" stroke="#DCCBB0" stroke-width="0.4"/>
<rect x="99.0" y="398" width="34" height="16" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="105.0" y1="409" x2="127.0" y2="409" stroke="#DCCBB0" stroke-width="0.4"/>
<rect x="97.0" y="380" width="38" height="16" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="103.0" y1="391" x2="129.0" y2="391" stroke="#DCCBB0" stroke-width="0.4"/>
<rect x="95.0" y="362" width="42" height="16" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="101.0" y1="373" x2="131.0" y2="373" stroke="#DCCBB0" stroke-width="0.4"/>
<rect x="93.0" y="344" width="46" height="16" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="99.0" y1="355" x2="133.0" y2="355" stroke="#DCCBB0" stroke-width="0.4"/>
<text x="150" y="394" font-size="4.8" fill="#A2503B">积：从禾，是码货</text>
<text x="150" y="406" font-size="4.4" fill="#6E6459">德是堆出来的，堆的前提是先收</text>
<text x="116" y="448" font-size="4.6" fill="#6E6459" text-anchor="middle">底下一袋是「啬」收回来的</text>
<text x="24" y="474" font-size="5.0" fill="#2F2A24">积德是码货，不是做好事：德是堆出来的，堆的前提是先收。</text>
<text x="24" y="490" font-size="5.0" fill="#2F2A24">克是肩，不是刀：「无不克」不是打遍天下，是天下事都担得起。</text>
<text x="24" y="506" font-size="4.8" fill="#4A5C55">担子两头都沉，人才走得稳；只挑轻的那头，走两步就歪。</text>
<line x1="24" y1="524" x2="338" y2="524" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="532" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="548" font-size="5.6" fill="#2F2A24" text-anchor="middle">克是肩，不是刀；「无不克」不是打遍天下，</text>
<text x="190" y="560" font-size="6.0" fill="#4A5C55" text-anchor="middle">是天下事都担得起。</text>
<line x1="20" y1="586" x2="360" y2="586" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="600" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="616" font-size="8.4" fill="#2F2A24">克是肩，不是刀；「无不克」不是打遍天下，是天下事都担得起。</text>
</svg>