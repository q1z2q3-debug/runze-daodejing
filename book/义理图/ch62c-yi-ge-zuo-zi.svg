<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 686" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="坐训止，进训登：停住，却往上走——这条路上不用脚" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="686" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 二 章 · 坐</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一个坐姿</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">虽有拱璧以先驷马，不如坐进此道。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「坐」，《说文》「止也」——停下来；「进」，《说文》「登也」——往上走。</text>
<text x="190" y="126" font-size="5.0" fill="#6E6459" text-anchor="middle">两个字摆在一起，是一对矛盾：停住，却往上走。</text>
<text x="24" y="148" font-size="4.8" fill="#6E6459">一、用脚：一步一阶</text>
<rect x="132" y="282" width="112" height="14" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="132" y="268" width="112" height="14" fill="#F6EFE0" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="132" y="254" width="112" height="14" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="132" y="240" width="112" height="14" fill="#F6EFE0" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="132" y="226" width="112" height="14" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="132" y="212" width="112" height="14" fill="#F6EFE0" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="132" y="198" width="112" height="14" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<g transform="translate(170,260) scale(0.66)"><path d="M-9,-12 C-11,-2 -10,9 -4,14 C2,18 8,10 9,-2 C10,-11 6,-17 -1,-17 C-6,-17 -8,-16 -9,-12 Z" fill="none" stroke="#2F2A24" stroke-width="1.3"/><circle cx="-6" cy="-20" r="2.3" fill="none" stroke="#2F2A24" stroke-width="1"/><circle cx="-1.5" cy="-23" r="2.0" fill="none" stroke="#2F2A24" stroke-width="1"/><circle cx="2.5" cy="-22" r="1.7" fill="none" stroke="#2F2A24" stroke-width="1"/><circle cx="6" cy="-19" r="1.5" fill="none" stroke="#2F2A24" stroke-width="1"/></g>
<g transform="translate(206,218) scale(0.66)"><path d="M-9,-12 C-11,-2 -10,9 -4,14 C2,18 8,10 9,-2 C10,-11 6,-17 -1,-17 C-6,-17 -8,-16 -9,-12 Z" fill="none" stroke="#2F2A24" stroke-width="1.3"/><circle cx="-6" cy="-20" r="2.3" fill="none" stroke="#2F2A24" stroke-width="1"/><circle cx="-1.5" cy="-23" r="2.0" fill="none" stroke="#2F2A24" stroke-width="1"/><circle cx="2.5" cy="-22" r="1.7" fill="none" stroke="#2F2A24" stroke-width="1"/><circle cx="6" cy="-19" r="1.5" fill="none" stroke="#2F2A24" stroke-width="1"/></g>
<line x1="124" y1="292" x2="124" y2="192" stroke="#6E6459" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>
<text x="124" y="186" font-size="4.2" fill="#6E6459" text-anchor="middle">往上</text>
<text x="190" y="320" font-size="4.8" fill="#6E6459" text-anchor="middle">用脚：一步一阶，两个脚印隔着一阶</text>
<text x="24" y="348" font-size="4.8" fill="#A2503B">二、不用脚：坐在这儿，就往上走</text>
<line x1="120" y1="446" x2="262" y2="446" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="176" y1="420" x2="158" y2="438" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="204" y1="420" x2="222" y2="438" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="158" y1="438" x2="198" y2="444" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="222" y1="438" x2="182" y2="444" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M178,392 L202,392 L206,422 L174,422 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<circle cx="190" cy="382" r="7.5" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="180" y1="396 " x2="164" y2="430" stroke="#2F2A24" stroke-width="1"/>
<line x1="200" y1="396" x2="216" y2="430" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="163" cy="432" rx="4" ry="3" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="217" cy="432" rx="4" ry="3" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="146" y1="454" x2="234" y2="454" stroke="#DCCBB0" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="190" y1="366" x2="190" y2="326" stroke="#4A5C55" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr2)"/>
<text x="200" y="336" font-size="4.6" fill="#4A5C55">进：往上走</text>
<text x="146" y="472" font-size="4.6" fill="#A2503B">坐：停住，脚不用迈</text>
<text x="24" y="496" font-size="4.8" fill="#2F2A24">第一条路上，「进」是脚的事；这一条路上，「进」是坐的事。</text>
<text x="24" y="512" font-size="4.9" fill="#2F2A24">往外走要开路，往里走只要坐下：停了，才升得起来。</text>
<text x="24" y="530" font-size="5.0" fill="#4A5C55">帛书作「坐而进此」——多一个「而」字：先停，再进。</text>
<line x1="24" y1="548" x2="338" y2="548" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="556" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="572" font-size="5.8" fill="#2F2A24" text-anchor="middle">坐是停，进是登；</text>
<text x="190" y="584" font-size="5.2" fill="#4A5C55" text-anchor="middle">这条路上的「进」，脚一步也不用迈。</text>
<line x1="20" y1="610" x2="360" y2="610" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="624" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="640" font-size="8.4" fill="#2F2A24">坐是停，进是登；这条路上的「进」，脚一步也不用迈。</text>
<text x="20" y="656" font-size="8.4" fill="#2F2A24">拱是两手收起来往前献，坐是手放开往下停；一个送一次，一个待一辈子。</text>
</svg>