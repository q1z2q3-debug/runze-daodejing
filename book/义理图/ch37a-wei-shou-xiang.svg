<rect x="0" y="0" width="380" height="484" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 七 章 · 为</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">手牵象，与自化</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">「为」从爪从象：一只手在上，一只象在下。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="118" font-size="7.6" fill="#2F2A24" text-anchor="middle">道常无为而无不为。侯王若能守之，万物将自化。</text>
<text x="190" y="130" font-size="7.2" fill="#6E6459" text-anchor="middle">化而欲作，吾将镇之以无名之朴。</text>
<rect x="20" y="144" width="162" height="122" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<rect x="198" y="144" width="162" height="122" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="32" y="162" font-size="8.2" fill="#A2503B">为：爪在象上</text>
<text x="210" y="162" font-size="8.2" fill="#4A5C55">无为：手撤了</text>
