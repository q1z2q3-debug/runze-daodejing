<text x="102" y="320" font-size="7.0" fill="#A2503B" text-anchor="middle">教</text>
<text x="104" y="370" font-size="6.7" fill="#6E6459" text-anchor="middle">「化」本带一个「教」：方向由外给。</text>
<path d="M294,328 a6,6 0 0 1 12,0" fill="none" stroke="#4A5C55" stroke-width="0.6" stroke-dasharray="3 2"/>
<path d="M289,328 a11,11 0 0 1 22,0" fill="none" stroke="#4A5C55" stroke-width="0.6" stroke-dasharray="3 2"/>
<text x="300" y="308" font-size="8.0" fill="#4A5C55" text-anchor="middle">自</text>
<text x="300" y="370" font-size="6.7" fill="#6E6459" text-anchor="middle">加一个「自」：同一条路，掉头走。</text>
<rect x="20" y="386" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="403" font-size="7.6" fill="#2F2A24" text-anchor="middle">「为」是那只牵着象的手：象的每一步，都算在它身上。</text>
<text x="190" y="418" font-size="7.6" fill="#6E6459" text-anchor="middle">无为：手拿开，象自己走——事一件没少。</text>
<line x1="20" y1="434" x2="360" y2="434" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="448" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="464" font-size="8.4" fill="#2F2A24">「为」的原型是一只手牵着象：无为撤掉的不是事，是那只手。</text>
<text x="20" y="480" font-size="8.4" fill="#2F2A24">「化」字本带一个「教」；老子加了一个「自」——同一条路，方向反了。</text>
</svg>