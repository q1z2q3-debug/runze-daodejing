<text x="238" y="174" font-size="6.2" fill="#A2503B">绳落在地上</text>
<line x1="222" y1="206" x2="206" y2="200" stroke="#4A5C55" stroke-width="0.8" marker-end="url(#arrS)"/>
<text x="210" y="254" font-size="6.9" fill="#6E6459">象照走：撤的不是事，是手。</text>
<rect x="20" y="278" width="340" height="96" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="32" y="296" font-size="8.2" fill="#A2503B">化：路是别人指的</text>
<text x="200" y="296" font-size="8.2" fill="#4A5C55">自化：方向从内起</text>
