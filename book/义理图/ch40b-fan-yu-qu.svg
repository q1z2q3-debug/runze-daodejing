<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="反不是对抗，是翻转；弱不是衰弱，是柔曲" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="540" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 章 · 翻 与 曲</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一翻，二曲</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">环上没有终点，只有转捩点。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="7.4" fill="#2F2A24" text-anchor="middle">反者，道之动；弱者，道之用。</text>
<text x="190" y="127" font-size="6.6" fill="#6E6459" text-anchor="middle">天下万物生于有，有生于无。</text>
<circle cx="96" cy="200" r="38" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<text x="96" y="204" font-size="13.0" fill="#2F2A24" text-anchor="middle">反</text>
<path d="M102,160 l8,3 l-8,4 z" fill="#A2503B"/>
<path d="M90,240 l-8,-3 l8,-4 z" fill="#4A5C55"/>
<text x="96" y="152" font-size="5.8" fill="#A2503B" text-anchor="middle">翻过去</text>
<text x="96" y="252" font-size="5.8" fill="#4A5C55" text-anchor="middle">翻回来</text>
<text x="160" y="178" font-size="6.4" fill="#2F2A24">「反」，《说文》「覆也」，从又从厂——</text>
<text x="160" y="191" font-size="6.4" fill="#2F2A24">一只手把东西翻过来。</text>
<text x="160" y="208" font-size="6.2" fill="#6E6459">翻过去：推到顶，必向对面回转；</text>
<text x="160" y="221" font-size="6.2" fill="#6E6459">翻回来：从向外追的路上回头。</text>
<text x="160" y="238" font-size="6.4" fill="#A2503B">老子用「反」不用「返」：两件事，一条环。</text>
<text x="24" y="274" font-size="6.6" fill="#2F2A24">二 · 直者易折，弯者能活</text>
<line x1="74" y1="296" x2="74" y2="352" stroke="#2F2A24" stroke-width="2.2"/>
<path d="M67,326 l7,-5 l7,5 l7,-5" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<text x="74" y="368" font-size="5.6" fill="#6E6459" text-anchor="middle">直的：一动就断</text>
<path d="M122,352 C126,326 136,318 144,322 C158,328 162,342 168,352" fill="none" stroke="#4A5C55" stroke-width="2.2"/>
<circle cx="144" cy="314" r="5" fill="#A2503B"/>
<line x1="144" y1="300" x2="144" y2="307" stroke="#C9B79A" stroke-width="0.7" marker-end="url(#arrS)"/>
<text x="144" y="368" font-size="5.6" fill="#4A5C55" text-anchor="middle">弯的：还能弯</text>
<text x="190" y="288" font-size="6.4" fill="#2F2A24">「弱」，《说文》「桡也」——曲木，</text>
<text x="190" y="301" font-size="6.4" fill="#2F2A24">木弯而不折的那个样子。</text>
<text x="190" y="318" font-size="6.2" fill="#6E6459">直的易折，弯的能活；硬的易碎，软的能存。</text>
<text x="190" y="334" font-size="6.2" fill="#6E6459">绷得最紧的那一处，最先断。</text>
<text x="190" y="352" font-size="6.4" fill="#A2503B">弱不是没力，是把力放在能回来的地方。</text>
<line x1="24" y1="372" x2="338" y2="372" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="380" width="340" height="50" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="397" font-size="7.6" fill="#2F2A24" text-anchor="middle">刚者求胜于一击，柔者求存于千日。</text>
<text x="190" y="412" font-size="6.8" fill="#6E6459" text-anchor="middle">一击之后无处可退，千日之后仍在场中。</text>
<text x="190" y="425" font-size="6.6" fill="#A2503B" text-anchor="middle">看懂物极必反，是为知止，不是撂手等坏。</text>
<line x1="20" y1="444" x2="360" y2="444" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="458" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="474" font-size="8.4" fill="#2F2A24">万物形于有，有自无中生；金钱为器壁，幸福是虚空。</text>
<text x="20" y="490" font-size="8.4" fill="#2F2A24">外求终有尽，内守得本源；知反明弱用，静里见真诠。</text>
</svg>