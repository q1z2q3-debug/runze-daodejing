<circle cx="98" cy="268.24242424242425" r="2.6" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="98" y1="270.8424242424243" x2="98" y2="278.24242424242425" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="98" y1="278.24242424242425" x2="94.5" y2="281.24242424242425" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="98" y1="278.24242424242425" x2="101.5" y2="281.24242424242425" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="94" y1="274.24242424242425" x2="102" y2="272.24242424242425" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="130" cy="250.3030303030303" r="2.6" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="130" y1="252.9030303030303" x2="130" y2="260.3030303030303" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="130" y1="260.3030303030303" x2="126.5" y2="263.3030303030303" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="130" y1="260.3030303030303" x2="133.5" y2="263.3030303030303" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="126" y1="256.3030303030303" x2="134" y2="254.3030303030303" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="48" y1="310" x2="84" y2="289" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arr2)"/>
<text x="172" y="206" font-size="4.6" fill="#A2503B" text-anchor="end">争高</text>
<text x="172" y="218" font-size="4.2" fill="#6E6459" text-anchor="end">位越高，越要守</text>
<text x="100" y="332" font-size="4.2" fill="#6E6459" text-anchor="middle">越往上，站的人越少，扶的人也越少</text>
<path d="M204,222 L266,298 L328,222" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M238,292 q14,-4 28,0 q14,4 28,0" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="240" y="293" width="52" height="4.5" fill="#E4EAE0" stroke="none"/>
<line x1="212" y1="212" x2="254" y2="276" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arr2)"/>
<line x1="320" y1="212" x2="278" y2="276" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arr2)"/>
<text x="266" y="198" font-size="4.6" fill="#4A5C55" text-anchor="middle">就下</text>
<text x="266" y="316" font-size="4.2" fill="#6E6459" text-anchor="middle">众人所恶：没人要的低处</text>
<text x="266" y="330" font-size="4.2" fill="#4A5C55" text-anchor="middle">安得住，是因为不靠位置定义自己</text>
<text x="24" y="360" font-size="5.2" fill="#4A5C55">二、江海：把自己放在最低处，百川自来</text>
<rect x="26" y="372" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="40" y="492" width="300" height="40" fill="#E4EAE0" stroke="none"/>
<path d="M40,492 q20,-5 40,0 q20,5 40,0 q20,-5 40,0 q20,5 40,0 q20,-5 40,0 q20,5 40,0 q20,-5 40,0" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="40" y1="532" x2="340" y2="532" stroke="#DCCBB0" stroke-width="0.6"/>
