<text x="470" y="638" font-size="8" fill="#6E6459" text-anchor="middle">泡开的，汤色深了</text>
<polygon points="620,530 680,530 673,596 627,596" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.0"/>
<polygon points="623,548 677,548 671,594 629,594" fill="#D8C070" stroke="none"/>
<circle cx="638" cy="550" r="2.6" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="652" cy="550" r="2.6" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="664" cy="550" r="2.6" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<text x="650" y="622" font-size="9.4" fill="#2F2A24" text-anchor="middle">尿</text>
<text x="650" y="638" font-size="8" fill="#6E6459" text-anchor="middle">尿出来的，起了泡</text>
<text x="380" y="670" font-size="9.2" fill="#A2503B" text-anchor="middle">这四样倒进海里，还是同一水——人给它贴的是名，不是性。</text>
<text x="24" y="720" font-size="9.6" fill="#4A5C55">三、支点在哪儿：相上，还是本体</text>
<rect x="24" y="732" width="350" height="236" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<rect x="386" y="732" width="350" height="236" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<rect x="34" y="882" width="330" height="74" fill="#E4EAE0" stroke="none"/>
<path d="M34,882 Q55.0,876 76,882 Q97.0,888 118,882 Q139.0,876 160,882 Q181.0,888 202,882 Q223.0,876 244,882 Q265.0,888 286,882 Q307.0,876 328,882 Q346.0,888 364,882" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="80" y1="870" x2="310" y2="856" stroke="#2F2A24" stroke-width="2"/>
<line x1="195" y1="863" x2="195" y2="882" stroke="#A2503B" stroke-width="1.6"/>
