<text x="646" y="310" font-size="8.4" fill="#6E6459" text-anchor="middle">河</text>
<path d="M88,370 q7,-18 0,-30 q-7,-16 2,-26" fill="none" stroke="#4A5C55" stroke-width="0.9"/>
<line x1="120" y1="372" x2="120" y2="260" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arrS)"/>
<text x="150" y="316" font-size="8.4" fill="#6E6459">蒸发</text>
<line x1="206" y1="242" x2="224" y2="216" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arrS)"/>
<line x1="470" y1="224" x2="486" y2="248" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arrS)"/>
<line x1="690" y1="348" x2="664" y2="374" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="356" y="364" font-size="9" fill="#A2503B" text-anchor="middle">上天是汽，落地是雨，汇流是河，归处是海——换的只是相。</text>
<text x="24" y="500" font-size="9.6" fill="#4A5C55">二、人间的水：洗过的、放坏的、泡开的、尿出来的</text>
<rect x="24" y="512" width="712" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<polygon points="80,530 140,530 133,596 87,596" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.0"/>
<polygon points="83,548 137,548 131,594 89,594" fill="#B9AE93" stroke="none"/>
<rect x="98" y="560" width="4" height="3" fill="#6E6459"/>
<rect x="116" y="570" width="4" height="3" fill="#6E6459"/>
<rect x="124" y="556" width="4" height="3" fill="#6E6459"/>
<rect x="106" y="582" width="4" height="3" fill="#6E6459"/>
<text x="110" y="622" font-size="9.4" fill="#2F2A24" text-anchor="middle">污水</text>
<text x="110" y="638" font-size="8" fill="#6E6459" text-anchor="middle">洗过的，渣还浮着</text>
<polygon points="260,530 320,530 313,596 267,596" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.0"/>
<polygon points="263,548 317,548 311,594 269,594" fill="#9FAE8E" stroke="none"/>
<line x1="264" y1="548" x2="316" y2="548" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="280" cy="564" r="2.2" fill="#5F7250"/>
<circle cx="298" cy="574" r="2.2" fill="#5F7250"/>
<text x="290" y="622" font-size="9.4" fill="#2F2A24" text-anchor="middle">死水</text>
<text x="290" y="638" font-size="8" fill="#6E6459" text-anchor="middle">放坏的，不动、发绿</text>
<polygon points="440,530 500,530 493,596 447,596" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.0"/>
<polygon points="443,548 497,548 491,594 449,594" fill="#B98A52" stroke="none"/>
