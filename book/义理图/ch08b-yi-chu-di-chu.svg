<line x1="168" y1="242" x2="168" y2="316" stroke="#DCCBB0" stroke-width="0.6" stroke-dasharray="2 3"/>
<circle cx="66" cy="286.1818181818182" r="2.6" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="66" y1="288.7818181818182" x2="66" y2="296.1818181818182" stroke="#2F2A24" stroke-width="0.9"/>
