<line x1="256" y1="464" x2="256" y2="486" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arr2)"/>
<line x1="248" y1="396" x2="264" y2="396" stroke="#DCCBB0" stroke-width="0.5"/>
<path d="M314,390 C 322,428 318,464 314,488" fill="none" stroke="#4A5C55" stroke-width="1.0"/>
<line x1="314" y1="464" x2="314" y2="486" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arr2)"/>
<line x1="306" y1="396" x2="322" y2="396" stroke="#DCCBB0" stroke-width="0.5"/>
<text x="54" y="518" font-size="5.4" fill="#2F2A24">江海</text>
<text x="334" y="518" font-size="4.4" fill="#4A5C55" text-anchor="end">百川归之</text>
<text x="190" y="540" font-size="4.2" fill="#6E6459" text-anchor="middle">它不召、不催、不争——只在最低处，水自然来</text>
<text x="24" y="568" font-size="5.2" fill="#2F2A24">「恶」读 wù：厌弃、嫌弃。低处是人人躲开的地方，水偏偏在那里聚。</text>
<text x="24" y="584" font-size="5.2" fill="#2F2A24">它能安，是因为不靠位置来定义自己：位置高一点低一点，对它没有分别。</text>
<text x="24" y="602" font-size="5.0" fill="#4A5C55">学水不是学它的德，是学它把自己放到哪儿——先挪身，再谈修德。</text>
<line x1="24" y1="620" x2="338" y2="620" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="628" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="644" font-size="6.0" fill="#2F2A24" text-anchor="middle">低处不是惩罚，是不必守的位置；</text>
<text x="190" y="656" font-size="6.0" fill="#4A5C55" text-anchor="middle">水往那里去，是不争。</text>
<line x1="20" y1="682" x2="360" y2="682" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="696" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="712" font-size="8.4" fill="#2F2A24">处众人之所恶，故几于道。</text>
<text x="20" y="728" font-size="8.4" fill="#2F2A24">低处不是惩罚，是不必守的位置。</text>
</svg>