<line x1="247" y1="863" x2="256" y2="879" stroke="#A2503B" stroke-width="1"/>
<text x="199" y="762" font-size="10" fill="#A2503B" text-anchor="middle" letter-spacing="1">支点长在相上</text>
<text x="199" y="784" font-size="8.4" fill="#6E6459" text-anchor="middle">要好位置、好评价、好名声</text>
<text x="199" y="932" font-size="9.4" fill="#A2503B" text-anchor="middle">相一动，人就翻</text>
<rect x="396" y="882" width="330" height="74" fill="#E4EAE0" stroke="none"/>
<path d="M396,882 Q417.0,876 438,882 Q459.0,888 480,882 Q501.0,876 522,882 Q543.0,888 564,882 Q585.0,876 606,882 Q627.0,888 648,882 Q669.0,876 690,882 Q708.0,888 726,882" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="561" y1="860" x2="561" y2="936" stroke="#2F2A24" stroke-width="2"/>
<rect x="501" y="936" width="120" height="16" fill="#DDE4D8" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="561" cy="828" r="5" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="561" y1="833" x2="561" y2="854" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="561" y1="854" x2="553" y2="870" stroke="#2F2A24" stroke-width="1"/>
<line x1="561" y1="854" x2="569" y2="870" stroke="#2F2A24" stroke-width="1"/>
<text x="561" y="762" font-size="10" fill="#4A5C55" text-anchor="middle" letter-spacing="1">支点在本体</text>
<text x="561" y="784" font-size="8.4" fill="#6E6459" text-anchor="middle">万相来了都能承、都能应</text>
<text x="466" y="914" font-size="9.4" fill="#4A5C55">相照旧变，人不翻</text>
<text x="561" y="948" font-size="7.4" fill="#2F2A24" text-anchor="middle">本体</text>
<rect x="24" y="994" width="712" height="60" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="380" y="1020" font-size="10" fill="#2F2A24" text-anchor="middle">几于道落回人身：不是把外境摆平，是把支点挪进来。</text>
<text x="380" y="1040" font-size="9" fill="#5F564C" text-anchor="middle">逆境照样来，只是不再添一层自造的苦——这才叫无尤。</text>
<line x1="20" y1="1090" x2="360" y2="1090" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="1104" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="1120" font-size="8.4" fill="#2F2A24">故几于道。</text>
<text x="20" y="1136" font-size="8.4" fill="#2F2A24">能入一切境，不改其性——几于道，就在这里。</text>
</svg>