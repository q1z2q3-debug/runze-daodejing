<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 754" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="位置低一点，对它没有分别——因为它有别的东西可以立" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="754" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 八 章 · 低 处</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一处低处</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">处众人之所恶，故几于道。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「处众人之所恶」不是自苦，是把自己放在别人不要的位置上，而且安。</text>
<text x="190" y="128" font-size="4.9" fill="#6E6459" text-anchor="middle">一处是争来的位，一处是流到的位——位次要用力气守，归宿不必。</text>
<text x="24" y="152" font-size="5.2" fill="#4A5C55">一、争高与就下：人往上挤，水往下流</text>
<rect x="26" y="164" width="328" height="180" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="190" y1="176" x2="190" y2="332" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 3"/>
