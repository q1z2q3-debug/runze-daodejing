<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 646" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="常心是一把自己打的尺：一把尺能定长短，也能把人钉在短的那一格里" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="646" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 九 章 · 尺 与 气</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一把尺，一口气</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">圣人无常心，以百姓心为心。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.4" fill="#2F2A24" text-anchor="middle">「常心」听着像常理，其实是自己打的尺；尺一伸出去，话就跟着出去。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">量人是一口气往外吐，放下是一口气往里吸——同一件事的两头。</text>
<text x="24" y="146" font-size="5.4" fill="#A2503B">一、有常心：一把尺横在人头顶</text>
<rect x="294" y="150" width="10" height="100" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="286" y1="237" x2="294" y2="237" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="289" y1="224" x2="294" y2="224" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="286" y1="211" x2="294" y2="211" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="289" y1="198" x2="294" y2="198" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="286" y1="185" x2="294" y2="185" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="289" y1="172" x2="294" y2="172" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="286" y1="159" x2="294" y2="159" stroke="#DCCBB0" stroke-width="0.5"/>
<line x1="40" y1="186" x2="294" y2="186" stroke="#A2503B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="30" y="182" font-size="4.6" fill="#A2503B">合格线</text>
<rect x="57" y="166" width="18" height="84" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="57" y1="166" x2="75" y2="166" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="75" y1="166" x2="294" y2="166" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 3"/>
<text x="66" y="261" font-size="4.6" fill="#4A5C55" text-anchor="middle">甲 · 合格</text>
<rect x="127" y="192" width="18" height="58" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="127" y1="192" x2="145" y2="192" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="145" y1="192" x2="294" y2="192" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 3"/>
<text x="136" y="261" font-size="4.6" fill="#A2503B" text-anchor="middle">乙 · 不合格</text>
<rect x="197" y="216" width="18" height="34" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="197" y1="216" x2="215" y2="216" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="215" y1="216" x2="294" y2="216" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 3"/>
<text x="206" y="261" font-size="4.6" fill="#A2503B" text-anchor="middle">丙 · 不合格</text>
<text x="210" y="276" font-size="4.6" fill="#6E6459">尺一横过来，人就成了几格里的一个读数</text>
<line x1="306" y1="200" x2="336" y2="200" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="340" y="202" font-size="6.2" fill="#A2503B">吐</text>
<text x="306" y="214" font-size="4.4" fill="#A2503B">标准、评判</text>
<text x="306" y="224" font-size="4.4" fill="#A2503B">一整套「应该」</text>
<text x="24" y="296" font-size="5.4" fill="#4A5C55">二、无常心：尺还在，只是不再横在人头顶</text>
<rect x="57" y="316" width="18" height="84" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="57" y1="316" x2="75" y2="316" stroke="#2F2A24" stroke-width="0.9"/>
<text x="66" y="411" font-size="4.8" fill="#6E6459" text-anchor="middle">甲</text>
<rect x="127" y="342" width="18" height="58" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="127" y1="342" x2="145" y2="342" stroke="#2F2A24" stroke-width="0.9"/>
<text x="136" y="411" font-size="4.8" fill="#6E6459" text-anchor="middle">乙</text>
<rect x="197" y="366" width="18" height="34" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="197" y1="366" x2="215" y2="366" stroke="#2F2A24" stroke-width="0.9"/>
<text x="206" y="411" font-size="4.8" fill="#6E6459" text-anchor="middle">丙</text>
<rect x="52" y="440" width="196" height="11" fill="#EFE6D4" stroke="#4A5C55" stroke-width="0.8"/>
<line x1="62" y1="440" x2="62" y2="446" stroke="#4A5C55" stroke-width="0.4"/>
<line x1="83" y1="440" x2="83" y2="446" stroke="#4A5C55" stroke-width="0.4"/>
<line x1="104" y1="440" x2="104" y2="446" stroke="#4A5C55" stroke-width="0.4"/>
<line x1="125" y1="440" x2="125" y2="446" stroke="#4A5C55" stroke-width="0.4"/>
<line x1="146" y1="440" x2="146" y2="446" stroke="#4A5C55" stroke-width="0.4"/>
<line x1="167" y1="440" x2="167" y2="446" stroke="#4A5C55" stroke-width="0.4"/>
<line x1="188" y1="440" x2="188" y2="446" stroke="#4A5C55" stroke-width="0.4"/>
<line x1="209" y1="440" x2="209" y2="446" stroke="#4A5C55" stroke-width="0.4"/>
<line x1="230" y1="440" x2="230" y2="446" stroke="#4A5C55" stroke-width="0.4"/>
<text x="254" y="442" font-size="4.5" fill="#4A5C55">尺收回来了：还在，</text>
<text x="254" y="452" font-size="4.5" fill="#4A5C55">只是不量人了</text>
<line x1="306" y1="366" x2="236" y2="366" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arr2)"/>
<text x="340" y="368" font-size="6.2" fill="#4A5C55">吸</text>
<text x="306" y="356" font-size="4.4" fill="#4A5C55">往里收</text>
<text x="24" y="354" font-size="4.6" fill="#6E6459">三个人还是三个高度，各自一个尺寸</text>
<text x="24" y="472" font-size="5.6" fill="#2F2A24">量人和吐气是同一个动作：尺一伸出去，话就跟着出去。</text>
<text x="24" y="488" font-size="5.6" fill="#2F2A24">「以百姓心为心」不是照他们说的做，是不把人划到哪一栏里去。</text>
<text x="24" y="504" font-size="5.2" fill="#4A5C55">把尺收回来，气才收得住——放下尺不是失去标准，是不再拿它钉人。</text>
<line x1="24" y1="522" x2="338" y2="522" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="530" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="546" font-size="6.0" fill="#2F2A24" text-anchor="middle">一把尺能定长短，</text>
<text x="190" y="558" font-size="6.0" fill="#4A5C55" text-anchor="middle">也能把人钉在短的那一格里。</text>
<line x1="20" y1="584" x2="360" y2="584" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="598" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="614" font-size="8.4" fill="#2F2A24">一把尺能定长短，也能把人钉在短的那一格里。</text>
</svg>