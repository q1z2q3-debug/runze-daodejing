<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一件器被定了名，就有了位次：左吉、右凶，兵不许搬到左边" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="552" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 一 章 · 器 与 位</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">兵者不祥之器</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">上一章管手，本章管心：给一件东西定名，才知道该怎么拿它。</text>
<text x="20" y="104" font-size="8.6" fill="#4A5C55">一器：定名</text>
<path d="M62,126 Q74,160 62,196 Q50,160 62,126 z" fill="#E9DFCC" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="62" y1="140" x2="62" y2="184" stroke="#A2503B" stroke-width="0.7"/>
<text x="88" y="146" font-size="10.0" fill="#A2503B">不祥之器</text>
<text x="88" y="162" font-size="7.6" fill="#6E6459">物或恶之，故有道者不处</text>
<text x="88" y="178" font-size="7.4" fill="#8A7C69">「处」是止、是安身——不是不能用，是不能住进去</text>
<text x="20" y="218" font-size="8.6" fill="#4A5C55">位次：吉事尚左，凶事尚右</text>
<text x="24" y="240" font-size="7.8" fill="#4A5C55">左 · 吉</text>
<text x="356" y="240" font-size="7.8" fill="#A2503B" text-anchor="end">右 · 凶</text>
<line x1="24" y1="258" x2="24" y2="290" stroke="#DCCBB0" stroke-width="1"/>
<line x1="356" y1="258" x2="356" y2="290" stroke="#DCCBB0" stroke-width="1"/>
<line x1="24" y1="286" x2="356" y2="286" stroke="#DCCBB0" stroke-width="1"/>
<rect x="44" y="258" width="18" height="18" fill="#F2EADA" stroke="#DCCBB0" stroke-width="1.0"/>
<text x="53" y="272" font-size="7.6" fill="#2F2A24" text-anchor="middle">冠</text>
<rect x="74" y="258" width="18" height="18" fill="#F2EADA" stroke="#DCCBB0" stroke-width="1.0"/>
<text x="83" y="272" font-size="7.6" fill="#2F2A24" text-anchor="middle">婚</text>
<rect x="104" y="258" width="18" height="18" fill="#F2EADA" stroke="#DCCBB0" stroke-width="1.0"/>
<text x="113" y="272" font-size="7.6" fill="#2F2A24" text-anchor="middle">聘</text>
<rect x="292" y="258" width="18" height="18" fill="#FDFBF4" stroke="#C9B79A" stroke-width="1.0"/>
<text x="301" y="272" font-size="7.6" fill="#2F2A24" text-anchor="middle">丧</text>
<rect x="322" y="258" width="18" height="18" fill="#E7C9BE" stroke="#A2503B" stroke-width="1.0"/>
<text x="331" y="272" font-size="7.8" fill="#A2503B" text-anchor="middle">兵</text>
<path d="M318,258 Q331,240 344,258" fill="none" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="348" y="258" font-size="7.4" fill="#A2503B">借</text>
<text x="24" y="300" font-size="7.6" fill="#6E6459">不得已：借它一次，用完还回右位——「恬淡为上」</text>
<line x1="318" y1="310" x2="96" y2="310" stroke="#A2503B" stroke-width="1.0" stroke-dasharray="4 3" marker-end="url(#arrS)"/>
<text x="206" y="306" font-size="8.4" fill="#A2503B" text-anchor="middle">×</text>
<text x="24" y="328" font-size="7.4" fill="#A2503B">美之：把右位搬到左位——「乐杀人者，不可以得志于天下」</text>
<rect x="20" y="340" width="106" height="58" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="30" y="360" font-size="9.2" fill="#2F2A24">恬淡</text>
<text x="30" y="378" font-size="7.2" fill="#6E6459">味薄，不往里加糖</text>
<rect x="136" y="340" width="106" height="58" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="146" y="360" font-size="9.2" fill="#2F2A24">居左居右</text>
<text x="146" y="378" font-size="7.2" fill="#6E6459">偏将军左，上将军右</text>
<rect x="252" y="340" width="106" height="58" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="262" y="360" font-size="9.2" fill="#2F2A24">胜而不美</text>
<text x="262" y="378" font-size="7.2" fill="#6E6459">胜是付，不是得</text>
<text x="20" y="416" font-size="7.2" fill="#8A7C69">丧礼是五礼里唯一不许笑的一种：战胜以丧礼处之，就是把它放进那个不许笑的地方。</text>
<rect x="20" y="430" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="449" font-size="9.0" fill="#2F2A24" text-anchor="middle">兵者不祥之器，非君子之器，不得已而用之。</text>
<text x="190" y="464" font-size="8.0" fill="#6E6459" text-anchor="middle">胜不是得，胜是付。</text>
<line x1="20" y1="482" x2="360" y2="482" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="496" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="512" font-size="8.4" fill="#2F2A24">用是借它一次，处是住在它里面；借一次可以，住进去你就变成那种人了。</text>
<text x="20" y="528" font-size="8.4" fill="#2F2A24">淡不是无味，是味薄；恬淡不是没有情绪，是不往里面加糖。</text>
</svg>