<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 708" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="兵是多出来的恶，不是必要的恶" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="708" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 一 章 · 一 器 定 名</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">不祥之器</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">夫兵者，不祥之器，物或恶之，故有道者不处。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「兵」，《说文》「兵，械也」——本义是器械，所以本章反复说「器」；「祥」，《说文》「福也」。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">「处」，《说文》「止也」：用，是借它一次；处，是住在它里面。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、一器定名：全书只有这一件器被判「不祥」</text>
<rect x="26" y="164" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="282" x2="336" y2="282" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="56" cy="270" r="8" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="76" cy="270" r="8" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="52" y="240" width="28" height="20" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="80" y1="250" x2="92" y2="246" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M120,244 L124,264 Q134,270 144,264 L148,244" fill="#F6EFE0" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M120,244 Q134,240 148,244" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M184,252 L200,234 L216,252" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="188" y="252" width="24" height="20" fill="#F6EFE0" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="264" y1="228" x2="264" y2="280" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="264" y1="236" x2="286" y2="238" stroke="#A2503B" stroke-width="1.6"/>
<polygon points="286,238 278,234 278,242" fill="#A2503B"/>
<rect x="55" y="288" width="22" height="13" fill="#E9DFCC" stroke="#DCCBB0" stroke-width="0.7"/>
<text x="66" y="298" font-size="4.0" fill="#2F2A24" text-anchor="middle">器</text>
<rect x="123" y="288" width="22" height="13" fill="#E9DFCC" stroke="#DCCBB0" stroke-width="0.7"/>
<text x="134" y="298" font-size="4.0" fill="#2F2A24" text-anchor="middle">器</text>
<rect x="189" y="288" width="22" height="13" fill="#E9DFCC" stroke="#DCCBB0" stroke-width="0.7"/>
<text x="200" y="298" font-size="4.0" fill="#2F2A24" text-anchor="middle">器</text>
<rect x="238" y="284" width="52" height="17" fill="#F3DCD4" stroke="#A2503B" stroke-width="0.9"/>
<text x="264" y="296" font-size="4.0" fill="#A2503B" text-anchor="middle">不祥之器</text>
<text x="292" y="262" font-size="3.9" fill="#8A7C69">物或恶之</text>
<text x="292" y="272" font-size="3.7" fill="#8A7C69">没有人喜欢</text>
<text x="292" y="282" font-size="3.7" fill="#8A7C69">兵器摆在堂上</text>
<text x="24" y="338" font-size="5.1" fill="#A2503B">二、不处：挂在床头，你就住进去了</text>
<rect x="26" y="350" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M56,396 L120,366 L184,396" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="60" y1="396" x2="60" y2="478" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="180" y1="396" x2="180" y2="478" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="72" y="446" width="90" height="16" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="78" y1="462" x2="78" y2="476" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="156" y1="462" x2="156" y2="476" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="84" cy="438" r="6" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="90" y1="442" x2="146" y2="442" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="140" y1="394" x2="140" y2="438" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="140" y1="400" x2="160" y2="402" stroke="#A2503B" stroke-width="1.5"/>
<polygon points="160,402 153,398 153,406" fill="#A2503B"/>
<text x="150" y="424" font-size="3.9" fill="#A2503B">戈</text>
<text x="214" y="404" font-size="5.0" fill="#A2503B">处＝住在它里面</text>
<text x="214" y="420" font-size="4.2" fill="#2F2A24">不把兵当成自己的家</text>
<text x="214" y="432" font-size="4.2" fill="#2F2A24">自己的依靠</text>
<text x="214" y="444" font-size="4.2" fill="#2F2A24">遇事的第一反应</text>
<text x="190" y="492" font-size="4.1" fill="#8A7C69" text-anchor="middle">借一次可以；住进去，你就变成那种人了</text>
<text x="24" y="522" font-size="4.8" fill="#2F2A24">「物或恶之」不是统计，是常识：没有人喜欢兵器摆在堂上。</text>
<text x="24" y="538" font-size="4.8" fill="#2F2A24">第二十四章「余食赘行」也是这八个字判的：同一条判词，同一个病根——多。</text>
<text x="24" y="556" font-size="4.8" fill="#4A5C55">必要只在那一个「不得已」的当口；其余备战、耀武、庆功，全是多出来的那部分。</text>
<line x1="24" y1="574" x2="338" y2="574" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="582" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="598" font-size="6.0" fill="#2F2A24" text-anchor="middle">兵是多出来的恶，不是必要的恶。</text>
<text x="190" y="610" font-size="5.0" fill="#4A5C55" text-anchor="middle">必要只在那一个「不得已」的当口——其余都是赘。</text>
<line x1="20" y1="636" x2="360" y2="636" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="650" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="666" font-size="8.4" fill="#2F2A24">用是借它一次，处是住在它里面；借一次可以，住进去你就变成那种人了。</text>
<text x="20" y="682" font-size="8.4" fill="#2F2A24">淡不是无味，是味薄；恬淡不是没有情绪，是不往里面加糖。</text>
</svg>