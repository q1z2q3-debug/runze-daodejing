<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 758" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="门在开合处，不在门板上；一着手去推，它就成了一堵墙" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="758" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 章 · 门</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一扇门轴</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">玄牝之门，是谓天地根。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.0" fill="#2F2A24" text-anchor="middle">「门」不是门框门扇：门是出入处，在开合之间。</text>
<text x="190" y="128" font-size="5.0" fill="#6E6459" text-anchor="middle">玄牝之门不是某个固定点位，是牡牝两端交互出入的那处枢机。</text>
<text x="24" y="152" font-size="5.2" fill="#4A5C55">一、开：门缝里出得来东西</text>
<rect x="26" y="164" width="328" height="180" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="126" y="194" width="128" height="120" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.4"/>
<path d="M126,194 L186,200 L186,308 L126,314 z" fill="#E4D8BF" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M254,194 L200,200 L200,308 L254,314 z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M193,202 L193,306 L200,308 L200,200 z" fill="#F6E9BF" stroke="none"/>
<line x1="202" y1="238" x2="222" y2="234" stroke="#D9C07A" stroke-width="0.8" opacity="0.85"/>
<line x1="202" y1="268" x2="222" y2="264" stroke="#D9C07A" stroke-width="0.8" opacity="0.85"/>
<line x1="202" y1="298" x2="222" y2="294" stroke="#D9C07A" stroke-width="0.8" opacity="0.85"/>
<line x1="224" y1="244" x2="252" y2="238" stroke="#D9C07A" stroke-width="0.7" opacity="0.6"/>
<line x1="224" y1="278" x2="252" y2="272" stroke="#D9C07A" stroke-width="0.7" opacity="0.6"/>
<rect x="117" y="214" width="9" height="12" fill="#BEA98A" stroke="#2F2A24" stroke-width="0.5"/>
<rect x="254" y="214" width="9" height="12" fill="#BEA98A" stroke="#2F2A24" stroke-width="0.5"/>
<rect x="117" y="280" width="9" height="12" fill="#BEA98A" stroke="#2F2A24" stroke-width="0.5"/>
<rect x="254" y="280" width="9" height="12" fill="#BEA98A" stroke="#2F2A24" stroke-width="0.5"/>
<text x="112" y="210" font-size="4.5" fill="#A2503B" text-anchor="end">轴</text>
<text x="300" y="210" font-size="4.5" fill="#4A5C55" text-anchor="end">门缝：显化从这里出去</text>
<text x="190" y="332" font-size="4.5" fill="#4A5C55" text-anchor="middle">门不在门板上，在两扇之间那道还没合死的缝</text>
<text x="24" y="364" font-size="5.2" fill="#A2503B">二、推：一着手去定位，缝就没了</text>
<rect x="26" y="376" width="328" height="180" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="126" y="406" width="128" height="120" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="190" y1="406" x2="190" y2="526" stroke="#2F2A24" stroke-width="0.6" stroke-dasharray="2 3"/>
<line x1="132" y1="406" x2="132" y2="526" stroke="#B9A98F" stroke-width="0.4"/>
<line x1="156" y1="406" x2="156" y2="526" stroke="#B9A98F" stroke-width="0.4"/>
<line x1="180" y1="406" x2="180" y2="526" stroke="#B9A98F" stroke-width="0.4"/>
<line x1="204" y1="406" x2="204" y2="526" stroke="#B9A98F" stroke-width="0.4"/>
<line x1="228" y1="406" x2="228" y2="526" stroke="#B9A98F" stroke-width="0.4"/>
<rect x="178" y="467" width="24" height="18" rx="5" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="180.0" y="457.0" width="4" height="12" rx="2" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="185.6" y="455.0" width="4" height="12" rx="2" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="191.2" y="455.0" width="4" height="12" rx="2" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="196.8" y="457.0" width="4" height="12" rx="2" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="172" y="470" width="9" height="4.4" rx="2" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="202" y1="478" x2="214" y2="486" stroke="#2F2A24" stroke-width="0.8"/>
<text x="258" y="450" font-size="4.5" fill="#A2503B">推住了</text>
<line x1="254" y1="452" x2="236" y2="460" stroke="#E6D8C2" stroke-width="0.6" stroke-dasharray="3 2"/>
<text x="190" y="544" font-size="4.5" fill="#A2503B" text-anchor="middle">一遇定位、占有，门当场变成了墙：通道闭塞</text>
<text x="24" y="572" font-size="5.2" fill="#2F2A24">门是出入处：不在门板，在开合。所以「玄牝之门」不是可找到、可占住的地方。</text>
<text x="24" y="588" font-size="5.2" fill="#2F2A24">凡从隐到显、从无到有，都经由这道门流出；可它不在天地之外，就在冲虚本身。</text>
<text x="24" y="606" font-size="5.2" fill="#4A5C55">「绵绵若存」的「若」，正是不许你把「存」把持成一个可守的东西——一守，就没了。</text>
<line x1="24" y1="624" x2="338" y2="624" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="632" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="648" font-size="6.0" fill="#2F2A24" text-anchor="middle">门在开合处，不在门板上；</text>
<text x="190" y="660" font-size="6.0" fill="#4A5C55" text-anchor="middle">一着手去推，它就成了一堵墙。</text>
<line x1="20" y1="686" x2="360" y2="686" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="700" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="716" font-size="8.4" fill="#2F2A24">玄牝之门，是谓天地根。</text>
<text x="20" y="732" font-size="8.4" fill="#2F2A24">门在开合处，不在门板上；一着手去推，它就成了一堵墙。</text>
</svg>