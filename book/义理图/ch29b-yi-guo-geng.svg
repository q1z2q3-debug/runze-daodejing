<rect x="201" y="400" width="9" height="14" fill="#E4D3B2" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="118" y1="458" x2="118" y2="486" stroke="#2F2A24" stroke-width="1.1"/>
