<path d="M248,358 q18,-4 30,10" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="204" y1="393" x2="198" y2="410" stroke="#6E8A6E" stroke-width="0.9"/>
<polygon points="100,498 105,482 110,498" fill="#A2503B" stroke="none" opacity="0.55"/>
<polygon points="136,498 141,482 146,498" fill="#A2503B" stroke="none" opacity="0.55"/>
<polygon points="178,498 183,482 188,498" fill="#A2503B" stroke="none" opacity="0.55"/>
<text x="280" y="434" font-size="5.6" fill="#A2503B">同</text>
<text x="280" y="450" font-size="4.2" fill="#2F2A24">抹去边界</text>
<text x="280" y="462" font-size="4.2" fill="#2F2A24">只剩一样</text>
<text x="280" y="476" font-size="3.9" fill="#8A7C69">摸得着的</text>
<text x="24" y="520" font-size="4.8" fill="#2F2A24">「和」：几支管子长短不一，音高低不同，凑在一起才成调。</text>
<text x="24" y="536" font-size="4.8" fill="#2F2A24">「合」：两半对上，严丝合缝，边没了——差异也就没了。</text>
<text x="24" y="554" font-size="4.8" fill="#4A5C55">道法自然是和，不是合：他不肯让不同的声音同时存在，他要一个音。</text>
<line x1="24" y1="572" x2="338" y2="572" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="580" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="596" font-size="6.0" fill="#2F2A24" text-anchor="middle">一样不少，才有味；一味兑一味，谁吃得下。</text>
<text x="190" y="608" font-size="5.0" fill="#4A5C55" text-anchor="middle">以他平他谓之和；以同裨同，尽乃弃矣。</text>
<line x1="20" y1="634" x2="360" y2="634" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="648" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="664" font-size="8.4" fill="#2F2A24">和是各不相同的声，在同一个调里共存；合是两个不同的形，扣成一个整体，边就没了。</text>
<text x="20" y="680" font-size="8.4" fill="#2F2A24">一锅羹，水火盐梅各不同，才有味；若只拿水去兑水，谁吃得下？</text>
</svg>