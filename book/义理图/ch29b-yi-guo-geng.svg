<line x1="187" y1="374" x2="187" y2="398" stroke="#6E8A6E" stroke-width="1.0"/>
<path d="M185,398 q2,4 4,0" fill="none" stroke="#6E8A6E" stroke-width="0.8"/>
<path d="M168,465 q4,-9 8,-2 q3,-5 5,-7" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<path d="M190,465 q4,-9 8,-2 q3,-5 5,-7" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<path d="M212,465 q4,-9 8,-2 q3,-5 5,-7" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<text x="190" y="490" font-size="4.1" fill="#A2503B" text-anchor="middle">若以水济水，谁能食之？同则不继</text>
<text x="300" y="416" font-size="5.6" fill="#8A7C69">同</text>
<text x="300" y="432" font-size="4.0" fill="#8A7C69">抹去边界</text>
<text x="300" y="444" font-size="4.0" fill="#8A7C69">只剩一形</text>
<text x="24" y="520" font-size="4.8" fill="#2F2A24">「和」：几支管子长短不一，吹出来的音高低不同，凑在一起才成调。</text>
<text x="24" y="536" font-size="4.8" fill="#2F2A24">「合」：两半对上了，严丝合缝；边没了，差异也就没了。</text>
<text x="24" y="554" font-size="4.8" fill="#4A5C55">道法自然，是和，不是合：他不肯让不同的声音同时存在，他要一个音。</text>
<line x1="24" y1="572" x2="338" y2="572" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="580" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="596" font-size="5.6" fill="#2F2A24" text-anchor="middle">和是许多个音成一个调，合是一个音盖住全部。</text>
<text x="190" y="608" font-size="5.0" fill="#4A5C55" text-anchor="middle">和是听得见的，合是摸得着的。</text>
<line x1="20" y1="634" x2="360" y2="634" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="648" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="664" font-size="8.4" fill="#2F2A24">和是许多个音成一个调，合是一个音盖住全部。</text>
<text x="20" y="680" font-size="8.4" fill="#2F2A24">和是听得见的，合是摸得着的。</text>
</svg>