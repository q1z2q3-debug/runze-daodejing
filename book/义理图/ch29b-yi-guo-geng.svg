<line x1="178" y1="272" x2="178" y2="300" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="148" y1="278" x2="148" y2="300" stroke="#2F2A24" stroke-width="1.1"/>
<rect x="118" y="216" width="14" height="12" fill="#D9C7A6" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="150" cy="222" r="6" fill="#E6C9A8" stroke="#2F2A24" stroke-width="0.7"/>
<ellipse cx="174" cy="224" rx="10" ry="4" fill="#F6EFE0" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M188,218 q10,-4 16,4" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<polygon points="100,312 105,296 110,312" fill="#A2503B" stroke="none" opacity="0.55"/>
<polygon points="136,312 141,296 146,312" fill="#A2503B" stroke="none" opacity="0.55"/>
<polygon points="178,312 183,296 188,312" fill="#A2503B" stroke="none" opacity="0.55"/>
<text x="244" y="216" font-size="5.6" fill="#4A5C55">和</text>
<text x="244" y="232" font-size="4.2" fill="#2F2A24">各守边界</text>
<text x="244" y="244" font-size="4.2" fill="#2F2A24">差异共存</text>
<text x="244" y="258" font-size="3.9" fill="#8A7C69">听得见的</text>
<text x="24" y="338" font-size="5.1" fill="#A2503B">二、以水济水：一味兑一味，就没人吃</text>
<rect x="26" y="350" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="496" x2="336" y2="496" stroke="#DCCBB0" stroke-width="0.9"/>
<ellipse cx="148" cy="412" rx="54" ry="8" fill="#F3EAD8" stroke="#2F2A24" stroke-width="1.0"/>
