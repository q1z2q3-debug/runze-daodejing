<path d="M146,226 L150,250 L230,250 L234,226 Z" fill="#E9F0E6" stroke="#E6D8C2" stroke-width="0.5"/>
<rect x="166" y="230" width="14" height="9" fill="#D9C7A6" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="198" cy="236" r="6" fill="#E4D3B2" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="218" cy="243" r="4.4" fill="#F6EFE0" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="172" cy="244" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M158,234 q8,3 16,0 M204,246 q8,3 16,0" fill="none" stroke="#6E8A6E" stroke-width="0.5"/>
<path d="M168,279 q4,-9 8,-2 q3,-5 5,-7" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<path d="M190,279 q4,-9 8,-2 q3,-5 5,-7" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<path d="M212,279 q4,-9 8,-2 q3,-5 5,-7" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<text x="190" y="302" font-size="4.1" fill="#4A5C55" text-anchor="middle">水、火、醯、醢、盐、梅：一样不少，样样不同</text>
<text x="300" y="230" font-size="5.6" fill="#8A7C69">和</text>
<text x="300" y="246" font-size="4.0" fill="#8A7C69">各守边界</text>
<text x="300" y="258" font-size="4.0" fill="#8A7C69">差异共存</text>
<text x="24" y="338" font-size="5.1" fill="#A2503B">二、以水济水：一锅里只添同一样</text>
<rect x="26" y="350" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="468" x2="336" y2="468" stroke="#DCCBB0" stroke-width="0.9"/>
<path d="M138,406 L146,444 L234,444 L242,406 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<ellipse cx="190" cy="406" rx="52" ry="9" fill="#F6EFE0" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="132" y="392" width="7" height="14" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="241" y="392" width="7" height="14" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
