<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 706" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一锅羹各样都在，一味兑一味就没人吃" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="706" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 九 章 · 一 锅 羹</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一锅羹</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">和实生物，同则不继。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">史伯：「和实生物，同则不继」；晏婴：「和如羹焉，水、火、醯、醢、盐、梅，以烹鱼肉」。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">「若以水济水，谁能食之？」——和是各样相济，同是一样加一样。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、各样都在：水火醯醢盐梅，一样不少</text>
<rect x="26" y="164" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="310" x2="336" y2="310" stroke="#DCCBB0" stroke-width="0.9"/>
<ellipse cx="148" cy="226" rx="54" ry="8" fill="#F3EAD8" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M94,226 L108,268 Q148,280 188,268 L202,226 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
