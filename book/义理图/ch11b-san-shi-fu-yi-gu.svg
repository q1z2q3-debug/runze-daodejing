<line x1="40" y1="448" x2="226" y2="448" stroke="#2F2A24" stroke-width="1.4"/>
<text x="46" y="440" font-size="4.2" fill="#4A5C55">轴穿过</text>
<path d="M168,464 A 40 40 0 0 1 144,486" fill="none" stroke="#4A5C55" stroke-width="1.1" marker-end="url(#arr2)"/>
<text x="178" y="480" font-size="4.8" fill="#4A5C55">转</text>
<text x="132" y="500" font-size="4.4" fill="#4A5C55" text-anchor="middle">毂心空着，轴才进得去，轮才滚得动</text>
<text x="190" y="528" font-size="4.3" fill="#6E6459" text-anchor="middle">同一圈骨架，只差中间那处空：有给利，无给用</text>
<text x="24" y="568" font-size="5.2" fill="#2F2A24">「当其无」，不是毂里有一团空气，是毂中心留出的那个虚位——轴进得去，力传得开。</text>
<text x="24" y="584" font-size="5.2" fill="#2F2A24">骨架不是为了堆木头，是为了撑开一个可以流转的虚场；骨架越定，虚场越清。</text>
<text x="24" y="602" font-size="5.0" fill="#4A5C55">所以利不是目的，是条件：有立得住，无才用得起来。</text>
<line x1="24" y1="620" x2="338" y2="620" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="628" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="644" font-size="6.0" fill="#2F2A24" text-anchor="middle">辐聚而成毂，毂虚而轴可穿；</text>
<text x="190" y="656" font-size="6.0" fill="#4A5C55" text-anchor="middle">有给你抓手，无给你生机。</text>
<line x1="20" y1="682" x2="360" y2="682" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="696" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="712" font-size="8.4" fill="#2F2A24">三十辐共一毂，当其无，有车之用。</text>
<text x="20" y="728" font-size="8.4" fill="#2F2A24">有给你抓手，无给你生机。</text>
</svg>