<text x="40" y="237" font-size="4.2" fill="#A2503B">轴</text>
<text x="200" y="208" font-size="4.3" fill="#6E6459">辐：二十根都在这儿</text>
<line x1="196" y1="212" x2="176" y2="212" stroke="#E6D8C2" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="132" y="300" font-size="4.5" fill="#A2503B" text-anchor="middle">毂心填实：木坨一块</text>
<text x="36" y="316" font-size="4.3" fill="#6E6459">辐条是「利」：给骨架、给定型、给抓手</text>
<text x="36" y="330" font-size="4.3" fill="#A2503B">毂心是「用」：填实了，转动的可能就没了</text>
<text x="24" y="360" font-size="5.2" fill="#4A5C55">二、毂心留虚：轴一穿进去，轮就转了</text>
