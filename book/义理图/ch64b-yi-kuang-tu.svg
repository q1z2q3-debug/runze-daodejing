<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="九层之台，起于累土：台有多高，等于抬过多少筐" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="620" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 四 章 · 累</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一筐土</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">九层之台，起于累土。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.0" fill="#2F2A24" text-anchor="middle">台不是一次垒成的：一筐一筐抬上去，抬过多少筐，就有多少高。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">「累」，《说文》「增也」——一层一层往上加。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、一筐，就是一层</text>
<rect x="105.0" y="274" width="150" height="22" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="113.0" y1="285" x2="247.0" y2="285" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="111.0" y="252" width="138" height="22" fill="#F6EFE0" stroke="#2F2A24" stroke-width="1"/>
<line x1="119.0" y1="263" x2="241.0" y2="263" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="117.0" y="230" width="126" height="22" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="125.0" y1="241" x2="235.0" y2="241" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="123.0" y="208" width="114" height="22" fill="#F6EFE0" stroke="#2F2A24" stroke-width="1"/>
<line x1="131.0" y1="219" x2="229.0" y2="219" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="129.0" y="186" width="102" height="22" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="137.0" y1="197" x2="223.0" y2="197" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="135.0" y="164" width="90" height="22" fill="#F6EFE0" stroke="#2F2A24" stroke-width="1"/>
<line x1="143.0" y1="175" x2="217.0" y2="175" stroke="#DCCBB0" stroke-width="0.6"/>
<line x1="88" y1="296" x2="332" y2="296" stroke="#2F2A24" stroke-width="1.4"/>
<path d="M292,294 L297,316 L319,316 L324,294" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M297,294 C303,286 313,286 319,294" fill="none" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="308" cy="296" rx="13" ry="4" fill="#DBCFB7" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="286" y1="274" x2="236" y2="170" stroke="#4A5C55" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr2)"/>
<text x="308" y="330" font-size="4.5" fill="#6E6459" text-anchor="middle">一筐土</text>
<text x="246" y="154" font-size="4.5" fill="#4A5C55">抬到顶上，</text>
<text x="246" y="166" font-size="4.5" fill="#4A5C55">就多一层</text>
<text x="24" y="340" font-size="4.8" fill="#2F2A24">九层之台，起于累土：每一筐都要走那段坡，都要对齐。</text>
<text x="24" y="356" font-size="4.9" fill="#2F2A24">台的高度，等于抬过的次数——不是等于想过多高。</text>
<text x="24" y="374" font-size="5.0" fill="#4A5C55">千里之行，始于足下：远不是一步跨过去的，是一步一步攒出来的。</text>
<line x1="24" y1="392" x2="338" y2="392" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="400" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="416" font-size="5.6" fill="#2F2A24" text-anchor="middle">九层之台，起于累土；</text>
<text x="190" y="428" font-size="5.2" fill="#4A5C55" text-anchor="middle">台有多高，等于抬过多少筐。</text>
<line x1="20" y1="454" x2="360" y2="454" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="468" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="484" font-size="8.4" fill="#2F2A24">九层之台，起于累土；台有多高，等于抬过多少筐。</text>
<text x="20" y="500" font-size="8.4" fill="#2F2A24">千里之行，始于足下：远不是一步跨过去的，是一步一步攒出来的。</text>
</svg>