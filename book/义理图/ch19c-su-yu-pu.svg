<text x="84" y="464" font-size="4.3" fill="#8A7C69" text-anchor="middle">染缸空着</text>
<text x="180" y="464" font-size="4.3" fill="#4A5C55" text-anchor="middle">素：未染，本就是那个色</text>
<text x="288" y="464" font-size="4.3" fill="#4A5C55" text-anchor="middle">朴：未下斧，带着皮</text>
<text x="190" y="352" font-size="4.6" fill="#6E6459" text-anchor="middle">还是那三样：一件没多，只是没再加工</text>
<text x="24" y="501" font-size="5.0" fill="#4A5C55">二、素与朴：丝回到本色，木回到原本</text>
<text x="24" y="520" font-size="4.9" fill="#2F2A24">少私寡欲：减的是攀缘，不除本然——吃饭穿衣不在戒除之列。</text>
<text x="24" y="536" font-size="4.9" fill="#2F2A24">绝学无忧：舍的是向外逐名的那套学问，不是闭目塞听。</text>
<text x="24" y="554" font-size="4.9" fill="#4A5C55">外学越积越多，多到装不下就忧；内明越照越少，少到不占地方就无忧。</text>
<line x1="24" y1="572" x2="338" y2="572" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="580" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="596" font-size="6.2" fill="#2F2A24" text-anchor="middle">见素抱朴，少私寡欲。</text>
<text x="190" y="608" font-size="5.1" fill="#4A5C55" text-anchor="middle">不染不雕，不必靠外加的东西证明自己。</text>
<line x1="20" y1="634" x2="360" y2="634" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="648" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="664" font-size="8.4" fill="#2F2A24">素者未染，朴者未雕；不加文饰，不下斧斤。</text>
<text x="20" y="680" font-size="8.4" fill="#2F2A24">不必靠外加的东西证明自己。</text>
</svg>