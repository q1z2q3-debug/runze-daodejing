<text x="84" y="282" font-size="4.3" fill="#6E6459" text-anchor="middle">染缸里有染液</text>
<text x="180" y="282" font-size="4.3" fill="#A2503B" text-anchor="middle">染过的绢：纹是外加的</text>
<text x="288" y="282" font-size="4.3" fill="#6E6459" text-anchor="middle">下过斧的器</text>
<text x="190" y="170" font-size="4.6" fill="#6E6459" text-anchor="middle">三处都在加：染、雕、斧斤</text>
<text x="24" y="319" font-size="5.0" fill="#A2503B">一、文饰之后：一处是染的，一处是下过斧的</text>
<rect x="26" y="332" width="328" height="156" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
