<rect x="0" y="0" width="380" height="706" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 九 章 · 素 与 朴</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">素与朴</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">素者未染，朴者未雕；不加文饰，不下斧斤。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">素管表面，朴管质地：一个防外加，一个防改造。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">这两个字，就是这一章给的归处。</text>
