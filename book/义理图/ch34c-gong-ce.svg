<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="功成而不名有：天下最大的一件事，册子上没有登记" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="592" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 四 章 · 其 三</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">功 劳 册</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">万物恃之而生而不辞，功成不名有。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">《周礼·夏官·司勋》：「掌六乡赏地之法，以等其功。」——王功曰勋，国功曰功，民功曰庸，</text>
<text x="190" y="127" font-size="4.5" fill="#6E6459">事功曰劳，治功曰力，战功曰多。功成了，就要取名、就要认领——这是当时的通则。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、有册：功成，则名之、有之</text>
<rect x="26" y="164" width="328" height="132" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="64" y="184" width="252" height="86" fill="#F6EFE0" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="190" y1="184" x2="190" y2="270" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="78" y="194" width="32" height="24" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<text x="94" y="205" font-size="4.8" fill="#A2503B" text-anchor="middle">勋</text>
<text x="94" y="214" font-size="3.4" fill="#A87C6C" text-anchor="middle">王功</text>
<line x1="84" y1="221" x2="104" y2="221" stroke="#A2503B" stroke-width="0.5"/>
<rect x="116" y="194" width="32" height="24" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<text x="132" y="205" font-size="4.8" fill="#A2503B" text-anchor="middle">功</text>
<text x="132" y="214" font-size="3.4" fill="#A87C6C" text-anchor="middle">国功</text>
<line x1="122" y1="221" x2="142" y2="221" stroke="#A2503B" stroke-width="0.5"/>
<rect x="154" y="194" width="32" height="24" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<text x="170" y="205" font-size="4.8" fill="#A2503B" text-anchor="middle">庸</text>
<text x="170" y="214" font-size="3.4" fill="#A87C6C" text-anchor="middle">民功</text>
<line x1="160" y1="221" x2="180" y2="221" stroke="#A2503B" stroke-width="0.5"/>
<rect x="78" y="226" width="32" height="24" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<text x="94" y="237" font-size="4.8" fill="#A2503B" text-anchor="middle">劳</text>
<text x="94" y="246" font-size="3.4" fill="#A87C6C" text-anchor="middle">事功</text>
<line x1="84" y1="253" x2="104" y2="253" stroke="#A2503B" stroke-width="0.5"/>
<rect x="116" y="226" width="32" height="24" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<text x="132" y="237" font-size="4.8" fill="#A2503B" text-anchor="middle">力</text>
<text x="132" y="246" font-size="3.4" fill="#A87C6C" text-anchor="middle">治功</text>
<line x1="122" y1="253" x2="142" y2="253" stroke="#A2503B" stroke-width="0.5"/>
<rect x="154" y="226" width="32" height="24" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<text x="170" y="237" font-size="4.8" fill="#A2503B" text-anchor="middle">多</text>
<text x="170" y="246" font-size="3.4" fill="#A87C6C" text-anchor="middle">战功</text>
<line x1="160" y1="253" x2="180" y2="253" stroke="#A2503B" stroke-width="0.5"/>
<line x1="202" y1="200" x2="302" y2="200" stroke="#E6D8C2" stroke-width="0.5"/>
<line x1="202" y1="204" x2="302" y2="204" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="2 3"/>
<line x1="202" y1="216" x2="302" y2="216" stroke="#E6D8C2" stroke-width="0.5"/>
<line x1="202" y1="220" x2="302" y2="220" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="2 3"/>
<line x1="202" y1="232" x2="302" y2="232" stroke="#E6D8C2" stroke-width="0.5"/>
<line x1="202" y1="236" x2="302" y2="236" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="2 3"/>
<line x1="202" y1="248" x2="302" y2="248" stroke="#E6D8C2" stroke-width="0.5"/>
<line x1="202" y1="252" x2="302" y2="252" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="2 3"/>
<text x="252" y="194" font-size="4.0" fill="#8A7C69" text-anchor="middle">记名 · 领有</text>
<rect x="322" y="242" width="22" height="22" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.9"/>
<text x="333" y="257" font-size="4.4" fill="#A2503B" text-anchor="middle">勋</text>
<text x="190" y="288" font-size="4.3" fill="#2F2A24" text-anchor="middle">记了名，就认领了；认领了，就成了「有」</text>
<text x="24" y="310" font-size="5.1" fill="#4A5C55">二、无记：最大那件事，册上空着</text>
<rect x="26" y="322" width="328" height="132" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="64" y="342" width="252" height="86" fill="#F6EFE0" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="190" y1="342" x2="190" y2="428" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="78" y="352" width="32" height="24" fill="none" stroke="#BEB2A0" stroke-width="0.6" stroke-dasharray="3 3"/>
<rect x="116" y="352" width="32" height="24" fill="none" stroke="#BEB2A0" stroke-width="0.6" stroke-dasharray="3 3"/>
<rect x="154" y="352" width="32" height="24" fill="none" stroke="#BEB2A0" stroke-width="0.6" stroke-dasharray="3 3"/>
<rect x="78" y="384" width="32" height="24" fill="none" stroke="#BEB2A0" stroke-width="0.6" stroke-dasharray="3 3"/>
<rect x="116" y="384" width="32" height="24" fill="none" stroke="#BEB2A0" stroke-width="0.6" stroke-dasharray="3 3"/>
<rect x="154" y="384" width="32" height="24" fill="none" stroke="#BEB2A0" stroke-width="0.6" stroke-dasharray="3 3"/>
<text x="252" y="362" font-size="4.6" fill="#4A5C55" text-anchor="middle">万物恃之而生</text>
<text x="252" y="376" font-size="4.4" fill="#4A5C55" text-anchor="middle">而不辞</text>
<text x="252" y="394" font-size="3.9" fill="#8A7C69" text-anchor="middle">功成 · 不名有</text>
<line x1="202" y1="406" x2="302" y2="406" stroke="#A2503B" stroke-width="0.6"/>
<text x="252" y="418" font-size="4.2" fill="#A2503B" text-anchor="middle">此页无姓名</text>
<text x="190" y="446" font-size="4.3" fill="#2F2A24" text-anchor="middle">事成了、走通了——道不给它取名，也不把它记在自己名下</text>
<line x1="24" y1="466" x2="356" y2="466" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="474" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="490" font-size="4.7" fill="#2F2A24" text-anchor="middle">居功，是求合的第一块砖：我成就你，所以你属于我，所以我能够定义你。</text>
<text x="190" y="503" font-size="4.6" fill="#4A5C55" text-anchor="middle">道把这块砖抽掉了——万物归焉，而弗为主。</text>
<line x1="20" y1="520" x2="360" y2="520" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="534" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="550" font-size="8.4" fill="#2F2A24">功成了不取名，也不记在自己名下。</text>
<text x="20" y="566" font-size="8.4" fill="#2F2A24">万物归焉而弗为主：归是真的归，主是不做主。</text>
</svg>