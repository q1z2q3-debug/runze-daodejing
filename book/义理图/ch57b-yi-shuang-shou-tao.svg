<svg viewBox="0 0 380 634" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="以奇用兵：奇，《说文》「不耦」——落单的一手" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="634" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 七 章 · 奇</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一双手套</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">奇是落单的一手，会用，不能落单成习惯。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「奇」，《说文》「异也，一曰不耦」——不耦，就是落单：没有配对的。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">一双手套，平时是两只；出手的时候，只戴一只。</text>
<text x="24" y="146" font-size="5.4" fill="#A2503B">一、出手：取一只，用一下</text>
<rect x="40" y="236" width="62" height="36" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="51" y="242" width="14" height="24" rx="5" stroke="#DCCBB0" stroke-width="1" fill="#FBF6EC"/>
<line x1="54.5" y1="243" x2="54.5" y2="250" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="58" y1="243" x2="58" y2="250" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="61.5" y1="243" x2="61.5" y2="250" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 2"/>
<ellipse cx="48.5" cy="257" rx="3" ry="4.6" stroke="#DCCBB0" stroke-width="1" fill="#FBF6EC"/>
