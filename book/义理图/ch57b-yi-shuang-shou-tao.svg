<ellipse cx="136.5" cy="377" rx="3" ry="4.6" stroke="#A2503B" stroke-width="1" fill="#FBF6EC"/>
<rect x="165" y="362" width="14" height="24" rx="5" stroke="#A2503B" stroke-width="1" fill="#FBF6EC"/>
<line x1="168.5" y1="363" x2="168.5" y2="370" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="172" y1="363" x2="172" y2="370" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="175.5" y1="363" x2="175.5" y2="370" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="2 2"/>
<ellipse cx="162.5" cy="377" rx="3" ry="4.6" stroke="#A2503B" stroke-width="1" fill="#FBF6EC"/>
<text x="159" y="404" font-size="4.6" fill="#A2503B" text-anchor="middle">两只都戴出去</text>
<text x="159" y="416" font-size="4.6" fill="#A2503B" text-anchor="middle">＝把奇当常</text>
<text x="159" y="428" font-size="4.6" fill="#4A5C55" text-anchor="middle">＝以兵治国</text>
<text x="190" y="450" font-size="4.6" fill="#6E6459" text-anchor="middle">会用，但不能落单成习惯——习惯就成常了</text>
<text x="24" y="464" font-size="5.2" fill="#2F2A24">「奇」是不耦，是落单：没有配对的。</text>
<text x="24" y="480" font-size="5.0" fill="#2F2A24">兵戈起于对立，是二元激化之后的应急，属于不得已的那一手。</text>
<text x="24" y="496" font-size="5.2" fill="#4A5C55">知雄守雌：知道那一手怎么用，绝不把它当日子过。</text>
<line x1="24" y1="514" x2="338" y2="514" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="522" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="538" font-size="6.0" fill="#2F2A24" text-anchor="middle">奇是落单的一手；会用，但不能落单成习惯。</text>
<text x="190" y="550" font-size="5.4" fill="#4A5C55" text-anchor="middle">无事是宗旨，正是常轨，奇只是兜底。</text>
<line x1="20" y1="576" x2="360" y2="576" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="590" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="606" font-size="8.4" fill="#2F2A24">奇是落单的一手；会用，但不能落单成习惯。</text>
</svg>