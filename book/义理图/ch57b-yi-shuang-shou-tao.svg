<line x1="86" y1="243" x2="86" y2="250" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="89.5" y1="243" x2="89.5" y2="250" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 2"/>
<ellipse cx="76.5" cy="257" rx="3" ry="4.6" stroke="#DCCBB0" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
<text x="71" y="280" font-size="4.2" fill="#8A8078" text-anchor="middle">盒里还剩一只</text>
<rect x="143" y="210" width="14" height="24" rx="5" stroke="#A2503B" stroke-width="1" fill="#FBF6EC"/>
<line x1="146.5" y1="211" x2="146.5" y2="218" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="150" y1="211" x2="150" y2="218" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="153.5" y1="211" x2="153.5" y2="218" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="2 2"/>
<ellipse cx="140.5" cy="225" rx="3" ry="4.6" stroke="#A2503B" stroke-width="1" fill="#FBF6EC"/>
<line x1="96" y1="234" x2="138" y2="218" stroke="#A2503B" stroke-width="0.7" marker-end="url(#arrS)"/>
<text x="170" y="210" font-size="4.8" fill="#A2503B">取出去：只戴一只</text>
<text x="170" y="222" font-size="4.4" fill="#6E6459">打完了，手要还回来</text>
<text x="190" y="280" font-size="4.6" fill="#6E6459" text-anchor="middle">兵是迫不得已的那一手</text>
<text x="24" y="306" font-size="5.4" fill="#4A5C55">二、成常：两只都取走，盒子就空了</text>
<rect x="40" y="390" width="62" height="36" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="51" y="396" width="14" height="24" rx="5" stroke="#DCCBB0" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
<line x1="54.5" y1="397" x2="54.5" y2="404" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="58" y1="397" x2="58" y2="404" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="61.5" y1="397" x2="61.5" y2="404" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 2"/>
