<line x1="82.5" y1="397" x2="82.5" y2="404" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="86" y1="397" x2="86" y2="404" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 2"/>
