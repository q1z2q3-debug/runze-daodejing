<ellipse cx="76.5" cy="411" rx="3" ry="4.6" stroke="#DCCBB0" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
<text x="71" y="434" font-size="4.2" fill="#8A8078" text-anchor="middle">盒里一只也没有</text>
<rect x="139" y="362" width="14" height="24" rx="5" stroke="#A2503B" stroke-width="1" fill="#FBF6EC"/>
<line x1="142.5" y1="363" x2="142.5" y2="370" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="146" y1="363" x2="146" y2="370" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="2 2"/>
