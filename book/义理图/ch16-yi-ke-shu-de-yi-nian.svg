<svg viewBox="0 0 380 762" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="万物并作，吾以观复：一棵树发满又落尽，回到根那一层" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="762" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 六 章 · 修 法</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一棵树的一年</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">万物并作，吾以观复：看的不是它长到多高，是它回到哪里。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">作：一齐发出来。复：一齐回到底。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">同一场生长，看它往哪儿去，还是看它从哪儿来。</text>
