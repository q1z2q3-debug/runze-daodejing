<path d="M190,276 C194,288 206,292 212,300" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="190" y1="276" x2="190" y2="306" stroke="#2F2A24" stroke-width="0.9"/>
<text x="298" y="204" font-size="8.4" fill="#4A5C55" text-anchor="middle">作</text>
<text x="298" y="220" font-size="4.6" fill="#6E6459" text-anchor="middle">一齐发</text>
<text x="24" y="344" font-size="5.2" fill="#4A5C55">一、并作：一齐发出来，各往各的方向长</text>
<rect x="26" y="360" width="328" height="180" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="190" y1="490" x2="190" y2="412" stroke="#2F2A24" stroke-width="1.8"/>
