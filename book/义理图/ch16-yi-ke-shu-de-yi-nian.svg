<text x="206" y="398" font-size="4.5" fill="#A2503B">次年从这里再发</text>
<text x="126" y="484" font-size="4.8" fill="#6E6459">根</text>
<text x="298" y="418" font-size="8.4" fill="#A2503B" text-anchor="middle">复</text>
<text x="298" y="434" font-size="4.6" fill="#6E6459" text-anchor="middle">一齐归</text>
<text x="24" y="558" font-size="5.2" fill="#A2503B">二、归根：芸芸满天满地，最后都回到根那一层</text>
<text x="24" y="576" font-size="4.9" fill="#2F2A24">归根曰静：叶落尽了，树不再动——静不是死，是有一处归到位了。</text>
<text x="24" y="592" font-size="4.9" fill="#2F2A24">是谓复命：回的不是原样，是回到自己那条本来节律。</text>
<text x="24" y="610" font-size="4.9" fill="#4A5C55">复命曰常，知常曰明：这条规矩年年都在，看见了就叫明。</text>
<line x1="24" y1="628" x2="338" y2="628" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="636" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="652" font-size="6.0" fill="#2F2A24" text-anchor="middle">万物并作，观其归；</text>
<text x="190" y="664" font-size="6.0" fill="#4A5C55" text-anchor="middle">归根曰静，静曰复命。</text>
<line x1="20" y1="690" x2="360" y2="690" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="704" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">万物并作，观其归；归根曰静，静曰复命。</text>
<text x="20" y="736" font-size="8.4" fill="#2F2A24">复归其根，是把今年长出来的、重新变成明年的底。</text>
</svg>