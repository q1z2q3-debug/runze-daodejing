<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="道是场域，不是王座" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="592" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 四 章 · 其 四（补图）</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">汎 与 汜</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">大道汎兮，其可左右。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.4" fill="#2F2A24" text-anchor="middle">「汎」，《说文》「浮也」——浮在水面；「汜」，《说文》「水别复入水也」——从主流分出，又回流入主流。</text>
<text x="190" y="127" font-size="4.4" fill="#6E6459" text-anchor="middle">通行本作「汜」，帛书作「汎」：汜有正路，汎只是铺开。本章从帛书。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、汜：有主流，有支流，有回水</text>
<rect x="26" y="164" width="328" height="136" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<path d="M40,208 C 120,198 220,220 300,210" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M40,250 C 120,260 220,238 300,248" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M40,208 C 120,198 220,220 300,210 L300,248 C 220,238 120,260 40,250 Z" fill="#DCEBE6" stroke="none" opacity="0.55"/>
<path d="M196,231 q4,30 26,30 q22,0 22,-22" fill="none" stroke="#4A5C55" stroke-width="0.9"/>
<text x="244" y="268" font-size="3.6" fill="#4A5C55" text-anchor="middle">支渠分出，又汇回来</text>
<text x="56" y="190" font-size="3.8" fill="#2F2A24">主流：水有个「正路」</text>
<text x="56" y="276" font-size="4.1" fill="#A2503B">有主有从，就有等级；有等级，就有归一。</text>
<text x="24" y="324" font-size="5.1" fill="#A2503B">二、汎：浮在水面，到哪儿都在，没有据点</text>
<rect x="26" y="336" width="328" height="130" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<rect x="44" y="368" width="292" height="70" fill="#DCEBE6" stroke="none" opacity="0.55"/>
<line x1="44" y1="368" x2="336" y2="368" stroke="#7FA39A" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.8"/>
<line x1="44" y1="398" x2="336" y2="398" stroke="#7FA39A" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.8"/>
<line x1="44" y1="438" x2="336" y2="438" stroke="#7FA39A" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.8"/>
<text x="330" y="364" font-size="3.5" fill="#6E8C84" text-anchor="end">水涨它高</text>
<text x="330" y="434" font-size="3.5" fill="#6E8C84" text-anchor="end">水落它低</text>
<g transform="rotate(12 84 382)"><ellipse cx="84" cy="382" rx="7" ry="3" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.6"/></g>
<g transform="rotate(-18 152 404)"><ellipse cx="152" cy="404" rx="7" ry="3" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.6"/></g>
<g transform="rotate(8 216 380)"><ellipse cx="216" cy="380" rx="7" ry="3" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.6"/></g>
<g transform="rotate(-10 286 414)"><ellipse cx="286" cy="414" rx="7" ry="3" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.6"/></g>
<text x="150" y="454" font-size="3.9" fill="#2F2A24">没有固定据点，也不分正路支路——不占一处，所以无所不在。</text>
<line x1="24" y1="482" x2="356" y2="482" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="490" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="506" font-size="5.4" fill="#2F2A24" text-anchor="middle">有中心，就有等级；有等级，就是合。</text>
<text x="190" y="519" font-size="4.6" fill="#4A5C55" text-anchor="middle">道不是王座，是场域；不占一处，所以无处不在。</text>
<line x1="20" y1="536" x2="360" y2="536" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="550" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="566" font-size="8.4" fill="#2F2A24">一做主，就要回答谁合格、谁排第一；这些问题一问出来，合就已经发生了。</text>
</svg>