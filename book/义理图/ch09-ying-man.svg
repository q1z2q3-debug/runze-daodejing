<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="四根向前，一根反向；功与身同一根轴；到得极处自己翻转" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="840" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 九 章 · 事 成</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">持而盈之</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">满不是问题；满了还要再加一步，才是问题。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、四根向前：每根都标着「又进一步」</text>
<text x="42" y="174" font-size="6.0" fill="#2F2A24" text-anchor="end">持</text>
<line x1="52" y1="172" x2="96" y2="172" stroke="#2F2A24" stroke-width="0.8" marker-end="url(#arrS)"/>
<text x="66" y="166" font-size="3.5" fill="#6E6459" text-anchor="middle">又进一步</text>
<text x="104" y="174" font-size="6.0" fill="#A2503B">盈</text>
<text x="152" y="174" font-size="4.2" fill="#6E6459">已满还要拿住，不如其已</text>
<text x="42" y="208" font-size="6.0" fill="#2F2A24" text-anchor="end">揣</text>
<line x1="52" y1="206" x2="96" y2="206" stroke="#2F2A24" stroke-width="0.8" marker-end="url(#arrS)"/>
<text x="66" y="200" font-size="3.5" fill="#6E6459" text-anchor="middle">又进一步</text>
<text x="104" y="208" font-size="6.0" fill="#A2503B">锐</text>
<text x="152" y="208" font-size="4.2" fill="#6E6459">还要磨尖，不可长保</text>
<text x="42" y="242" font-size="6.0" fill="#2F2A24" text-anchor="end">金玉</text>
<line x1="52" y1="240" x2="96" y2="240" stroke="#2F2A24" stroke-width="0.8" marker-end="url(#arrS)"/>
<text x="66" y="234" font-size="3.5" fill="#6E6459" text-anchor="middle">又进一步</text>
<text x="104" y="242" font-size="6.0" fill="#A2503B">满堂</text>
<text x="152" y="242" font-size="4.2" fill="#6E6459">还要囤着，莫之能守</text>
<text x="42" y="276" font-size="6.0" fill="#2F2A24" text-anchor="end">富贵</text>
<line x1="52" y1="274" x2="96" y2="274" stroke="#2F2A24" stroke-width="0.8" marker-end="url(#arrS)"/>
<text x="66" y="268" font-size="3.5" fill="#6E6459" text-anchor="middle">又进一步</text>
<text x="104" y="276" font-size="6.0" fill="#A2503B">骄</text>
<text x="152" y="276" font-size="4.2" fill="#6E6459">还要显出来，自遗其咎</text>
<text x="24" y="316" font-size="4.6" fill="#2F2A24">四句不是四种毛病，是同一条路走到头：把自我绑在所得上。</text>
<text x="24" y="338" font-size="5.2" fill="#4A5C55">二、唯一一根反向的：停手</text>
<rect x="26" y="350" width="62" height="22" fill="#F2EADA" stroke="#2F2A24" stroke-width="1.0"/>
<text x="57" y="365" font-size="5.2" fill="#2F2A24" text-anchor="middle">身退</text>
<line x1="306" y1="368" x2="92" y2="368" stroke="#A2503B" stroke-width="1.0" marker-end="url(#arr2)"/>
<text x="304" y="356" font-size="4.2" fill="#A2503B" text-anchor="end">停手，不是又进一步</text>
<text x="24" y="388" font-size="4.5" fill="#6E6459">次序不能倒：先功遂，再身退——没做成而先退，多半是给退缩找个好名字。</text>
<text x="24" y="412" font-size="5.2" fill="#4A5C55">三、功与身：同一根轴的两头，不是两件事</text>
<text x="44" y="456" font-size="6.0" fill="#2F2A24">身</text>
<text x="336" y="456" font-size="6.0" fill="#2F2A24" text-anchor="end">功</text>
<line x1="66" y1="450" x2="314" y2="450" stroke="#DCCBB0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="300" y1="442" x2="96" y2="442" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arr2)"/>
<text x="300" y="434" font-size="4.0" fill="#4A5C55" text-anchor="end">退：事留在外面</text>
<line x1="120" y1="464" x2="310" y2="464" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arr2)"/>
<text x="332" y="474" font-size="4.0" fill="#A2503B" text-anchor="end">进：事越做越大</text>
<text x="24" y="486" font-size="4.5" fill="#2F2A24">功是向外的果，身是向内的根。退不是走到那一头，</text>
<text x="24" y="500" font-size="4.5" fill="#2F2A24">是把根从果里挪出来——功可以越做越大，根只有一条。</text>
<text x="24" y="518" font-size="5.2" fill="#4A5C55">四、反：到得极处，自己翻成另一端</text>
<circle cx="104" cy="602" r="44" fill="#8C8578" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="104" cy="580.0" r="22.0" fill="#F8F3E6" stroke="none"/>
<circle cx="104" cy="624.0" r="22.0" fill="#8C8578" stroke="none"/>
<circle cx="104" cy="580.0" r="6" fill="#8C8578" stroke="none"/>
<circle cx="104" cy="624.0" r="6" fill="#F8F3E6" stroke="none"/>
<text x="104" y="606" font-size="1" fill="#2F2A24" text-anchor="middle"></text>
<text x="170" y="564" font-size="4.5" fill="#2F2A24">黑的那半一直加，加到端就溢。</text>
<text x="170" y="580" font-size="4.5" fill="#2F2A24">白的那半知道停在哪一格。</text>
<text x="170" y="602" font-size="4.5" fill="#4A5C55">不是对半均分，也不是停在中间——</text>
<text x="170" y="616" font-size="4.5" fill="#4A5C55">是走到头，自己翻转。</text>
<line x1="24" y1="688" x2="338" y2="688" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="696" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="714" font-size="6.0" fill="#2F2A24" text-anchor="middle">功遂身退，天之道</text>
<text x="190" y="728" font-size="5.0" fill="#4A5C55" text-anchor="middle">退的是那只还要再加一步的手，不是事。</text>
<line x1="20" y1="754" x2="360" y2="754" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="768" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="784" font-size="8.4" fill="#2F2A24">持而盈之，不如其已。</text>
<text x="20" y="800" font-size="8.4" fill="#2F2A24">满不是问题；满了还要再加一步，才是问题。</text>
</svg>