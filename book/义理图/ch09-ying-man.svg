<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一根箭头就是一步：又进一步" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="412" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 九 章 · 事 成</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">持而盈之</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">满不是问题；满了还要再加一步，才是问题。</text>
<text x="24" y="132" font-size="12" fill="#A2503B" letter-spacing="1">持</text>
<line x1="70" y1="127" x2="104" y2="127" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="87" y="118" font-size="7.2" fill="#A89577" text-anchor="middle">又进一步</text>
<text x="110" y="132" font-size="12" fill="#2F2A24" letter-spacing="1">盈</text>
<text x="170" y="132" font-size="8.6" fill="#6E6459">已满还要拿住，不如其已</text>
<text x="24" y="172" font-size="12" fill="#A2503B" letter-spacing="1">揣</text>
<line x1="70" y1="167" x2="104" y2="167" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="87" y="158" font-size="7.2" fill="#A89577" text-anchor="middle">又进一步</text>
<text x="110" y="172" font-size="12" fill="#2F2A24" letter-spacing="1">锐</text>
<text x="170" y="172" font-size="8.6" fill="#6E6459">还要磨尖，不可长保</text>
<text x="24" y="212" font-size="12" fill="#A2503B" letter-spacing="1">金玉</text>
<line x1="70" y1="207" x2="104" y2="207" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="87" y="198" font-size="7.2" fill="#A89577" text-anchor="middle">又进一步</text>
<text x="110" y="212" font-size="12" fill="#2F2A24" letter-spacing="1">满堂</text>
<text x="170" y="212" font-size="8.6" fill="#6E6459">还要囤着，莫之能守</text>
<text x="24" y="252" font-size="12" fill="#A2503B" letter-spacing="1">富贵</text>
<line x1="70" y1="247" x2="104" y2="247" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="87" y="238" font-size="7.2" fill="#A89577" text-anchor="middle">又进一步</text>
<text x="110" y="252" font-size="12" fill="#2F2A24" letter-spacing="1">骄</text>
<text x="170" y="252" font-size="8.6" fill="#6E6459">还要显出来，自遗其咎</text>
<text x="24" y="262" font-size="8.6" fill="#8A7C69">四句是同一根尺子的四个刻度：在哪一格停手，就叫度。</text>
<rect x="20" y="272" width="72" height="26" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="56" y="290" font-size="10.5" fill="#A2503B" text-anchor="middle" letter-spacing="1">身退</text>
<line x1="258" y1="285" x2="102" y2="285" stroke="#A2503B" stroke-width="1" marker-end="url(#arrS)"/>
<text x="266" y="289" font-size="8.6" fill="#A2503B">停手，不是又进一步</text>
<rect x="20" y="316" width="340" height="50" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="335" font-size="11.5" fill="#2F2A24" text-anchor="middle" letter-spacing="1">功遂身退，天之道。</text>
<text x="190" y="353" font-size="8.8" fill="#6E6459" text-anchor="middle">退的是那只还要加一步的手，不是事。</text>
</svg>