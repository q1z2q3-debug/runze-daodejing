<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="人事是一条下滑的坡，天道是一条回环的圆——坡上五句，环上四时" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="760" height="700" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 九 章 · 事 成</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">持而盈之，不如其已</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">满不是问题；满了还要再加一步，才是问题。</text>
<text x="24" y="144" font-size="9.6" fill="#4A5C55">一、人事：一条坡，五个站法，同一件错事</text>
<line x1="62" y1="188" x2="352" y2="340" stroke="#2F2A24" stroke-width="1.4"/>
<circle cx="82.3" cy="198.6" r="3.6" fill="#A2503B" stroke="none"/>
<text x="82.3" y="178.64" font-size="8.6" fill="#2F2A24" text-anchor="middle">持而盈之</text>
<circle cx="146.1" cy="232.1" r="3.6" fill="#A2503B" stroke="none"/>
<text x="146.1" y="258.08" font-size="8.6" fill="#2F2A24" text-anchor="middle">揣而锐之</text>
<circle cx="209.9" cy="265.5" r="3.6" fill="#A2503B" stroke="none"/>
<text x="209.9" y="245.51999999999998" font-size="8.6" fill="#2F2A24" text-anchor="middle">金玉满堂</text>
<circle cx="273.7" cy="299.0" r="3.6" fill="#A2503B" stroke="none"/>
<text x="273.7" y="324.96" font-size="8.6" fill="#2F2A24" text-anchor="middle">富贵而骄</text>
<circle cx="331.7" cy="329.4" r="3.6" fill="#A2503B" stroke="none"/>
<text x="331.7" y="309.36" font-size="8.6" fill="#A2503B" text-anchor="middle">功成不退</text>
<text x="366" y="345" font-size="10" fill="#A2503B">散</text>
<text x="62" y="384" font-size="8.6" fill="#5F564C">五句不是五种毛病，是同一条路走到头：抓取、满溢、炫耀、骄矜，</text>
<text x="62" y="400" font-size="8.6" fill="#5F564C">都是把自我绑在所得上；一绑，平衡就破。</text>
<line x1="392" y1="140" x2="392" y2="410" stroke="#DCCBB0" stroke-width="0.5" stroke-dasharray="2 3"/>
<text x="420" y="144" font-size="9.6" fill="#4A5C55">二、天道：一条环，四时自己做主</text>
<circle cx="560" cy="250" r="66" fill="none" stroke="#4A5C55" stroke-width="1.3"/>
<text x="560" y="176" font-size="9.4" fill="#4A5C55" text-anchor="middle">生</text>
<text x="634" y="253" font-size="9.4" fill="#4A5C55">长</text>
<text x="560" y="332" font-size="9.4" fill="#4A5C55" text-anchor="middle">收</text>
<text x="486" y="253" font-size="9.4" fill="#4A5C55" text-anchor="end">藏</text>
<line x1="576.3152" y1="199.78719999999998" x2="610.2128" y2="233.6848" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arr2)"/>
<line x1="610.2128" y1="266.3152" x2="576.3152" y2="300.2128" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arr2)"/>
<line x1="543.6848" y1="300.2128" x2="509.7872" y2="266.3152" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arr2)"/>
<line x1="509.7872" y1="233.6848" x2="543.6848" y2="199.78719999999998" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arr2)"/>
<text x="420" y="358" font-size="8.6" fill="#5F564C">生到极处就要收；收不是失败，是节律。</text>
<text x="420" y="374" font-size="8.6" fill="#5F564C">只生不收，才是逆天。</text>
<text x="24" y="436" font-size="9.6" fill="#4A5C55">三、出口：功遂，然后身退</text>
<text x="24" y="462" font-size="9.2" fill="#A2503B">次序不能倒：事要做成，心要收回。没做成而先退，多半是给退缩找个好名字。</text>
<text x="24" y="486" font-size="9.2" fill="#2F2A24">退的不是事，是恋；收的不是手，是心。能进也能退，能显也能藏。</text>
<rect x="24" y="506" width="712" height="56" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="380" y="530" font-size="11" fill="#2F2A24" text-anchor="middle" letter-spacing="1">功遂身退，天之道。</text>
<text x="380" y="548" font-size="9" fill="#5F564C" text-anchor="middle">退的是那只还要再加一步的手，不是事。</text>
<line x1="20" y1="632" x2="360" y2="632" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="646" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="662" font-size="8.4" fill="#2F2A24">持而盈之，不如其已。</text>
<text x="20" y="678" font-size="8.4" fill="#2F2A24">满不是问题；满了还要再加一步，才是问题。</text>
</svg>