<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 606" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="大道甚夷，而人好径：径是步道，窄到只容一个人过" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="606" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 三 章 · 路</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">两条路</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">大道甚夷，而人好径。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「夷」，《说文》「平也」；「径」，《说文》「步道也」——只能步行、容不下车的小路。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">古时路分等级：容得下车马的叫「道」，只容人走的叫「径」。</text>
<text x="24" y="146" font-size="5.4" fill="#4A5C55">一、大道：平、宽，谁都能走，谁也不快</text>
<rect x="24" y="178" width="332" height="46" fill="#FBF6EC" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="24" y1="189" x2="356" y2="189" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="24" y1="200" x2="356" y2="200" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="24" y1="211" x2="356" y2="211" stroke="#DCCBB0" stroke-width="0.45"/>
<circle cx="70" cy="188" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="70" y1="191" x2="70" y2="202" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="130" cy="188" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="130" y1="191" x2="130" y2="202" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="200" cy="188" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="200" y1="191" x2="200" y2="202" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="268" cy="188" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="268" y1="191" x2="268" y2="202" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="320" cy="188" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="320" y1="191" x2="320" y2="202" stroke="#2F2A24" stroke-width="0.7"/>
<text x="190" y="168" font-size="4.6" fill="#4A5C55" text-anchor="middle">夷：没有高低，没有转弯，没有一处要你显本事</text>
<text x="24" y="254" font-size="5.4" fill="#A2503B">二、小径：放着大道不走，偏去挤那一条</text>
<rect x="24" y="294" width="332" height="46" fill="#FBF6EC" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="24" y1="305" x2="356" y2="305" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="24" y1="316" x2="356" y2="316" stroke="#DCCBB0" stroke-width="0.45"/>
<line x1="24" y1="327" x2="356" y2="327" stroke="#DCCBB0" stroke-width="0.45"/>
<path d="M40,268 L336,356" stroke="#A2503B" stroke-width="3.2" opacity="0.55"/>
<path d="M40,268 L336,356" stroke="#A2503B" stroke-width="0.45"/>
<circle cx="196" cy="300" r="3.4" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<line x1="196" y1="303" x2="196" y2="312" stroke="#A2503B" stroke-width="0.9"/>
<text x="242" y="260" font-size="4.8" fill="#A2503B" text-anchor="middle">径：只容一人过</text>
<line x1="242" y1="264" x2="242" y2="304" stroke="#A2503B" stroke-width="0.35" stroke-dasharray="3 3" opacity="0.7"/>
<text x="300" y="368" font-size="4.6" fill="#A2503B">快，是因为窄</text>
<text x="300" y="378" font-size="4.4" fill="#6E6459">窄，是因为只打算</text>
<text x="300" y="387" font-size="4.4" fill="#6E6459">一个人过</text>
<text x="24" y="402" font-size="5.2" fill="#2F2A24">一条路宽不宽，看的不是石头，是走的人打算带几个一起走。</text>
<text x="24" y="418" font-size="5.0" fill="#2F2A24">大道是公共的：谁都走得，谁都不快；小路是私的：只容一人，所以快，也只利一人。</text>
<text x="24" y="434" font-size="5.2" fill="#4A5C55">窄的路走多了，就成了窄的人——这就是「私」的全部形状：不是坏，是窄。</text>
<line x1="24" y1="452" x2="338" y2="452" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="460" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="476" font-size="6.0" fill="#2F2A24" text-anchor="middle">「径」是步道：快，是因为窄；</text>
<text x="190" y="488" font-size="6.0" fill="#4A5C55" text-anchor="middle">窄，是因为只打算一个人过。</text>
<line x1="20" y1="514" x2="360" y2="514" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="528" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="544" font-size="8.4" fill="#2F2A24">「径」是步道：快，是因为窄；窄，是因为只打算一个人过。</text>
</svg>