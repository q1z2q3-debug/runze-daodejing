<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="武从止从戈：不是扔下戈，是脚停在戈前" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="690" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 八 章 · 武</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只脚</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">善为士者，不武。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「武」，《说文》引楚庄王「夫武，定功戢兵。故止戈为武」。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">止是脚：脚走到戈跟前，停住——不是把戈扔了。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、脚停在戈前：有戈，脚不动</text>
<rect x="26" y="160" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="236" y1="184" x2="236" y2="286" stroke="#2F2A24" stroke-width="1.6"/>
<path d="M236,182 L168,190 L236,197 Z" fill="#DED2B8" stroke="#2F2A24" stroke-width="1"/>
<rect x="228" y="197" width="8" height="18" fill="#DED2B8" stroke="#2F2A24" stroke-width="1"/>
<circle cx="236" cy="278" r="2.6" fill="#A2503B" stroke="none"/>
<text x="214" y="178" font-size="5.0" fill="#2F2A24">戈</text>
<path d="M176,280 Q174,271 184,269 L202,268 Q212,268 213,276 Q214,285 202,286 L184,286 Q176,286 176,280 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="213" y1="271" x2="220" y2="271" stroke="#2F2A24" stroke-width="1" stroke-linecap="round"/>
<line x1="213" y1="275" x2="220" y2="275" stroke="#2F2A24" stroke-width="1" stroke-linecap="round"/>
<line x1="213" y1="279" x2="220" y2="279" stroke="#2F2A24" stroke-width="1" stroke-linecap="round"/>
<line x1="213" y1="283" x2="220" y2="283" stroke="#2F2A24" stroke-width="1" stroke-linecap="round"/>
<text x="176" y="296" font-size="5.0" fill="#A2503B">脚</text>
<line x1="222" y1="256" x2="222" y2="288" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="222" y="252" font-size="4.4" fill="#A2503B" text-anchor="middle">停</text>
<line x1="40" y1="286" x2="340" y2="286" stroke="#2F2A24" stroke-width="1"/>
<text x="190" y="316" font-size="4.6" fill="#A2503B" text-anchor="middle">不是没有戈，是脚不动：趾尖离柲一寸，停在那儿</text>
<text x="24" y="358" font-size="4.8" fill="#4A5C55">二、戈收进鞘：功定，兵戢</text>
<rect x="26" y="370" width="328" height="130" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="486" x2="340" y2="486" stroke="#2F2A24" stroke-width="1"/>
<path d="M236,392 L168,400 L236,407 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.8" stroke-dasharray="2 2"/>
<rect x="150" y="390" width="94" height="18" rx="9" fill="#4A5C55" opacity="0.18" stroke="#4A5C55" stroke-width="1"/>
<rect x="176" y="394" width="4" height="16" rx="1.5" fill="none" stroke="#A2503B" stroke-width="1"/>
<rect x="216" y="394" width="4" height="16" rx="1.5" fill="none" stroke="#A2503B" stroke-width="1"/>
<line x1="236" y1="402" x2="236" y2="486" stroke="#2F2A24" stroke-width="1.6"/>
<text x="196" y="388" font-size="4.8" fill="#4A5C55">鞘</text>
<path d="M176,480 Q174,471 184,469 L202,468 Q212,468 213,476 Q214,485 202,486 L184,486 Q176,486 176,480 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="213" y1="471" x2="220" y2="471" stroke="#2F2A24" stroke-width="1" stroke-linecap="round"/>
<line x1="213" y1="475" x2="220" y2="475" stroke="#2F2A24" stroke-width="1" stroke-linecap="round"/>
<line x1="213" y1="479" x2="220" y2="479" stroke="#2F2A24" stroke-width="1" stroke-linecap="round"/>
<line x1="213" y1="483" x2="220" y2="483" stroke="#2F2A24" stroke-width="1" stroke-linecap="round"/>
<text x="190" y="502" font-size="4.6" fill="#4A5C55" text-anchor="middle">刃收进鞘，脚还在原地：这就是止戈</text>
<text x="24" y="520" font-size="4.8" fill="#2F2A24">邲之战后潘党要筑京观，楚庄王不肯：打赢的人先说的是「戢兵」。</text>
<text x="24" y="536" font-size="4.8" fill="#2F2A24">定功戢兵——功先定，刀后收；胜而不收者，犹未胜也。</text>
<text x="24" y="554" font-size="5.0" fill="#4A5C55">打输的人说收刀，是自慰；打赢的人说收刀，才算赢。</text>
<line x1="24" y1="570" x2="338" y2="570" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="578" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="593" font-size="5.4" fill="#2F2A24" text-anchor="middle">武从止从戈，止者足也；</text>
<text x="190" y="606" font-size="4.9" fill="#4A5C55" text-anchor="middle">非扔其戈，乃停其足。</text>
<line x1="20" y1="632" x2="360" y2="632" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="646" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="662" font-size="8.4" fill="#2F2A24">武从止从戈，止者足也；非扔其戈，乃停其足。</text>
<text x="20" y="678" font-size="8.4" fill="#2F2A24">定功戢兵——功先定，刀后收；胜而不收者，犹未胜也。</text>
</svg>