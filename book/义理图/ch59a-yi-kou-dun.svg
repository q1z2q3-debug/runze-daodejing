<circle cx="178.0" cy="215" r="1.6" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<circle cx="183.75" cy="215" r="1.6" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<path d="M104,212 C132,182 168,182 176,210" fill="none" stroke="#4A5C55" stroke-width="0.7"/>
<path d="M172,206 L176,212 L181,205" fill="none" stroke="#4A5C55" stroke-width="0.7"/>
<text x="110" y="176" font-size="4.6" fill="#4A5C55">收进去</text>
<text x="178" y="282" font-size="4.6" fill="#4A5C55" text-anchor="middle">仓：满了才叫啬</text>
<text x="24" y="308" font-size="5.0" fill="#A2503B">二、不是舍不得给：是往回拢，不是往外撒</text>
<line x1="24" y1="426" x2="240" y2="426" stroke="#2F2A24" stroke-width="1"/>
<path d="M96,386 L136,386 L128,426 L104,426 Z" fill="#EFE6D4" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="106" cy="374" r="2" fill="none" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="2 2"/>
<circle cx="116" cy="366" r="2" fill="none" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="2 2"/>
<circle cx="126" cy="358" r="2" fill="none" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="2 2"/>
<text x="124" y="364" font-size="4.6" fill="#A2503B">往外撒：那是给，不是啬</text>
<text x="124" y="376" font-size="4.5" fill="#6E6459">撒完了，仓是空的</text>
<rect x="199.0" y="362" width="46" height="64" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<path d="M199.0,362 C207.0,350 237.0,350 245.0,362" fill="none" stroke="#2F2A24" stroke-width="1"/>
