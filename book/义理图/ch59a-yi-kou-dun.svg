<line x1="199.0" y1="363" x2="245.0" y2="363" stroke="#DCCBB0" stroke-width="0.4"/>
<path d="M203.0,371 C214,365 230,365 241.0,371" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<circle cx="210.5" cy="373" r="1.6" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<circle cx="216.25" cy="373" r="1.6" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<circle cx="222.0" cy="373" r="1.6" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<circle cx="227.75" cy="373" r="1.6" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<text x="222" y="440" font-size="4.5" fill="#4A5C55" text-anchor="middle">拢回来：仓是实的</text>
<text x="24" y="466" font-size="4.8" fill="#2F2A24">「啬」从來、从回：來是麦子，回是围着囤转一圈，把麦子赶进仓。</text>
<text x="24" y="482" font-size="4.8" fill="#2F2A24">所以啬不是舍不得给，是先把该收的收回来；一个动作，两种人做出来是两回事。</text>
<text x="24" y="498" font-size="5.2" fill="#4A5C55">这一章不是讲节俭，是讲收成。</text>
<line x1="24" y1="516" x2="338" y2="516" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="524" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="540" font-size="5.6" fill="#2F2A24" text-anchor="middle">啬不是舍不得给，是把收下来的拢回仓里；</text>
<text x="190" y="552" font-size="6.0" fill="#4A5C55" text-anchor="middle">这一章不是讲节俭，是讲收成。</text>
<line x1="20" y1="578" x2="360" y2="578" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="592" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="608" font-size="8.4" fill="#2F2A24">啬不是舍不得给，是把收下来的拢回仓里；这一章不是讲节俭，是讲收成。</text>
</svg>