<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="治人事天，莫若啬：啬从來从回，是收庄稼入仓" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="640" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 九 章 · 啬</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一口囤</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">治人事天，莫若啬。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.0" fill="#2F2A24" text-anchor="middle">「啬」，《说文》「爱濇也」，从「來」（麦子）、从「回」（围着囤转一圈收进去）。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">所以啬的本义不是「省」，是「收庄稼入仓」。</text>
<text x="24" y="146" font-size="5.2" fill="#4A5C55">一、收：围着麦地转一圈，拢回仓里</text>
