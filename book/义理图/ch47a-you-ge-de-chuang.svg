<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 502" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="透过框看，看见的每一块都是真的" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="502" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 七 章 · 牖</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一扇有格的窗</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">不窥于牖，以知天道。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.8" fill="#2F2A24" text-anchor="middle">「窥」，《说文》「小视也」——从孔里看，看见多少由孔决定。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">「牖」，《说文》「穿壁以木为交窗」——你看见的每一块，都是被格出来的。</text>
<circle cx="120" cy="234" r="64" fill="#E8C9A0" opacity="0.9"/>
<rect x="30" y="162" width="36" height="138" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="174" y="162" width="40" height="138" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="66" y="162" width="108" height="22" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="66" y="284" width="108" height="22" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="74" y="184" width="6" height="100" fill="#2F2A24" opacity="0.82"/>
<rect x="96" y="184" width="6" height="100" fill="#2F2A24" opacity="0.82"/>
<rect x="118" y="184" width="6" height="100" fill="#2F2A24" opacity="0.82"/>
<rect x="140" y="184" width="6" height="100" fill="#2F2A24" opacity="0.82"/>
<rect x="162" y="184" width="6" height="100" fill="#2F2A24" opacity="0.82"/>
<rect x="66" y="184" width="108" height="3" fill="#2F2A24" opacity="0.5"/>
<circle cx="120" cy="234" r="78" fill="none" stroke="#2F2A24" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.5"/>
<line x1="184" y1="234" x2="222" y2="234" stroke="#E6D8C2" stroke-width="0.4" stroke-dasharray="3 2"/>
<text x="250" y="228" font-size="5.2" fill="#6E6459">框外：太阳一直圆着</text>
<text x="250" y="238" font-size="5.2" fill="#6E6459">你没看见的是这一段</text>
<text x="120" y="322" font-size="4.8" fill="#A2503B" text-anchor="middle">窗内：太阳被切成五条——每一条都是真的</text>
<text x="24" y="342" font-size="5.9" fill="#2F2A24">不窥于牖，不是「别看」，是「别从那个洞看」。</text>
<text x="24" y="358" font-size="5.6" fill="#6E6459">格是真的，天也是真的；可格在中间，天就被格说了算。</text>
<text x="24" y="374" font-size="5.6" fill="#4A5C55">要知道天道，先得知道那个框是框，不是天。</text>
<line x1="24" y1="394" x2="338" y2="394" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="402" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="418" font-size="5.2" fill="#2F2A24" text-anchor="middle">透过框看，你看见的每一块都是真的；</text>
<text x="190" y="430" font-size="5.2" fill="#4A5C55" text-anchor="middle">可你真的没看见框外。</text>
<line x1="20" y1="456" x2="360" y2="456" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="470" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="486" font-size="8.4" fill="#2F2A24">透过框看，你看见的每一块都是真的；可你真的没看见框外。</text>
</svg>