<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 556" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="善抱者不脱：手会松，怀不会" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="556" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 四 章 · 怀</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一副衣襟</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">善抱者不脱，子孙以祭祀不辍。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「抱」古字作「袌」，《说文》「褱也」——从衣：把东西放进衣襟里兜着。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">兜住的东西，是靠衣裳的重量压着，不是靠手臂箍着。</text>
<text x="24" y="146" font-size="5.4" fill="#A2503B">一、端在手上：手会累，会松</text>
<rect x="36" y="176" width="84" height="13" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="126" cy="182" rx="10" ry="8" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M136,176 C142,168 136,166 132,172" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="126" cy="164" r="10" fill="#FBF6EC" stroke="#A2503B" stroke-width="1"/>
<line x1="140" y1="158" x2="176" y2="158" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="150" y1="146" x2="150" y2="172" stroke="#A2503B" stroke-width="0.6" marker-end="url(#arrS)"/>
<text x="196" y="150" font-size="4.6" fill="#A2503B">手臂一累就松</text>
<text x="196" y="160" font-size="4.6" fill="#6E6459">端着的早晚要掉</text>
<text x="78" y="198" font-size="4.6" fill="#6E6459" text-anchor="middle">端：靠的是力</text>
<text x="24" y="246" font-size="5.4" fill="#4A5C55">二、放进怀里：衣裳压着，不用手</text>
<path d="M74,262 C64,328 100,354 160,354 C220,354 256,328 246,262" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M74,262 C110,318 210,318 246,262" fill="none" stroke="#2F2A24" stroke-width="0.6" stroke-dasharray="5 4"/>
<circle cx="160" cy="332" r="12" fill="#FBF6EC" stroke="#4A5C55" stroke-width="1.1"/>
<text x="160" y="376" font-size="4.6" fill="#4A5C55" text-anchor="middle">怀：靠的是衣裳的重量</text>
<line x1="266" y1="298" x2="296" y2="298" stroke="#4A5C55" stroke-width="0.4" stroke-dasharray="3 3"/>
<text x="300" y="300" font-size="4.4" fill="#4A5C55">不用手</text>
<text x="24" y="388" font-size="5.2" fill="#2F2A24">「脱」是从怀里滑出去——说的不是「不离」，是「放对了地方」。</text>
<text x="24" y="404" font-size="5.2" fill="#2F2A24">这里抱的不是外物，是那份生机、那条道脉。</text>
<text x="24" y="420" font-size="5.0" fill="#4A5C55">「辍」，《说文》「车小缺复合者也」——断了一段又接上；不辍，是一次也没断过。</text>
<line x1="24" y1="438" x2="338" y2="438" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="446" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="462" font-size="6.0" fill="#2F2A24" text-anchor="middle">手会松，怀不会；所以抱得住的东西，</text>
<text x="190" y="474" font-size="6.0" fill="#4A5C55" text-anchor="middle">都是放进怀里的，不是端在手上的。</text>
<line x1="20" y1="500" x2="360" y2="500" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="514" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="530" font-size="8.4" fill="#2F2A24">手会松，怀不会；所以抱得住的东西，都是放进怀里的，不是端在手上的。</text>
</svg>