<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 774" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="不争不是让，是换了个地方站；归不是得，是回家" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="774" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 二 章 · 不 争</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">跑道与家</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">夫唯不争，故天下莫能与之争……诚全而归之。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">不争同一件物，不争同一把尺，不进那个场。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">人不在场上，谁也没法跟他争。</text>
