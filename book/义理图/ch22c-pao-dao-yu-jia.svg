<text x="292" y="210" font-size="3.9" fill="#4A5C55" text-anchor="middle">他不在跑道上</text>
<text x="190" y="326" font-size="3.9" fill="#6E6459" text-anchor="middle">一条跑道，一只袋：两个在争，那个站在埂上。</text>
<text x="24" y="355" font-size="5.0" fill="#A2503B">一、跑道：争物、争尺，还是不在场</text>
<rect x="26" y="368" width="328" height="192" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="52" y1="440" x2="248" y2="440" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="52" y1="474" x2="248" y2="474" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M171,450 L185,450 L189,470 L167,470 Z" fill="#E4D8BF" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="178" cy="447" r="2.4" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="178" y1="447" x2="174" y2="443" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="178" y1="447" x2="182" y2="443" stroke="#2F2A24" stroke-width="0.7"/>
<text x="100" y="496" font-size="3.9" fill="#8A7C69" text-anchor="middle">跑道空着，袋还在原处</text>
<path d="M278,420 L312,396 L346,420" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="286" y="420" width="52" height="46" fill="#F2EADA" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="300" y="430" width="20" height="36" fill="#F6E9C9" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M320,430 L334,434 L334,468 L322,464" fill="#EFE6D4" stroke="#A2503B" stroke-width="1.0"/>
<line x1="300" y1="466" x2="322" y2="466" stroke="#A2503B" stroke-width="1.4"/>
<text x="312" y="390" font-size="5.2" fill="#A2503B" text-anchor="middle">家</text>
<text x="330" y="482" font-size="3.6" fill="#6E6459" text-anchor="middle">门开着</text>
<path d="M246,492 L298,468" fill="none" stroke="#DCCBB0" stroke-width="2.2"/>
<circle cx="270" cy="476" r="3.6" fill="none" stroke="#4A5C55" stroke-width="1.0"/>
<path d="M270,480 L272,490" fill="none" stroke="#4A5C55" stroke-width="1.0"/>
<line x1="272" y1="490" x2="268" y2="500" stroke="#4A5C55" stroke-width="1.0"/>
<line x1="272" y1="490" x2="276" y2="500" stroke="#4A5C55" stroke-width="1.0"/>
<text x="72" y="520" font-size="3.9" fill="#6E6459">争到最后的人，得的多，回不去；不争的人，回得去。</text>
<text x="72" y="538" font-size="3.9" fill="#4A5C55">「归」不是「至」：至是走到，归是回去。</text>
<text x="24" y="573" font-size="5.0" fill="#4A5C55">二、回家：全而归之，是回到本处</text>
<text x="24" y="590" font-size="4.9" fill="#2F2A24">不争的三层：不争同一件物，不争同一把尺，不在争的场地里。</text>
<text x="24" y="606" font-size="4.9" fill="#2F2A24">「天下莫能与之争」不是没人争得过他，是没有可争的对家——他不在那条赛道上。</text>
<text x="24" y="624" font-size="4.9" fill="#4A5C55">「诚全而归之」不是委曲之后终于得到，是完整地回到了本处。</text>
<line x1="24" y1="640" x2="338" y2="640" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="648" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="664" font-size="5.4" fill="#2F2A24" text-anchor="middle">不争不是让，是换了个地方站。</text>
<text x="190" y="676" font-size="4.7" fill="#4A5C55" text-anchor="middle">争到最后的人得的多，回不去；不争的人回得去。</text>
<line x1="20" y1="702" x2="360" y2="702" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="716" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="732" font-size="8.4" fill="#2F2A24">不争不是让，是换了个地方站。</text>
<text x="20" y="748" font-size="8.4" fill="#2F2A24">争到最后的人得的多，回不去；不争的人回得去。</text>
</svg>