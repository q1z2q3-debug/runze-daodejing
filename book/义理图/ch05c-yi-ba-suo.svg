<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 734" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="多言就是锁支点：锁在 0、锁在 1、锁在自己以为稳的中间，锁住即穷" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="734" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 章 · 锁</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一把锁</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">多言数穷，不如守中。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.0" fill="#2F2A24" text-anchor="middle">多言不只是话多：一切定义、评判、谋划、控制，都是把支点钉死。</text>
<text x="190" y="128" font-size="5.0" fill="#6E6459" text-anchor="middle">钉在 0 的空寂、钉在 1 的驰求、或钉在自以为稳妥的中间——三种钉法，一个结果。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、锁住：器还在，机死了</text>
<rect x="26" y="164" width="328" height="162" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="112" y="198" width="148" height="96" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1.2"/><rect x="130" y="208" width="11" height="76" fill="#2F2A24" opacity="0.45"/><line x1="135" y1="204" x2="135" y2="182" stroke="#2F2A24" stroke-width="1.3"/><line x1="122" y1="182" x2="148" y2="182" stroke="#2F2A24" stroke-width="1.3"/><circle cx="190" cy="246" r="3.2" fill="none" stroke="#4A5C55" stroke-width="1.0"/><text x="190" y="236" font-size="4.6" fill="#4A5C55" text-anchor="middle">枢</text><rect x="182" y="252" width="16" height="12" fill="#A2503B" stroke="#A2503B" stroke-width="0.8"/><path d="M186,252 q4,-9 8,0" fill="none" stroke="#A2503B" stroke-width="0.9"/><line x1="135" y1="258" x2="180" y2="258" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="190" y="316" font-size="4.5" fill="#A2503B" text-anchor="middle">枢一锁，开合即停：出风断在这里，一停就竭</text>
<text x="24" y="346" font-size="5.2" fill="#4A5C55">二、松开：枢自己走，越动愈出</text>
<rect x="26" y="358" width="328" height="162" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="112" y="392" width="148" height="96" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1.2"/><rect x="130" y="402" width="11" height="76" fill="#2F2A24" opacity="0.45"/><line x1="135" y1="398" x2="135" y2="376" stroke="#2F2A24" stroke-width="1.3"/><line x1="122" y1="376" x2="148" y2="376" stroke="#2F2A24" stroke-width="1.3"/><circle cx="190" cy="440" r="3.2" fill="none" stroke="#4A5C55" stroke-width="1.0"/><text x="190" y="430" font-size="4.6" fill="#4A5C55" text-anchor="middle">枢</text><line x1="174" y1="454" x2="224" y2="454" stroke="#4A5C55" stroke-width="1.1" marker-end="url(#arr2)"/><line x1="224" y1="472" x2="174" y2="472" stroke="#4A5C55" stroke-width="1.1" marker-end="url(#arrL)"/><text x="199" y="482" font-size="4.4" fill="#4A5C55" text-anchor="middle">往复</text><line x1="260" y1="420" x2="282" y2="420" stroke="#4A5C55" stroke-width="0.9"/><path d="M282,420 l-4,-2.4 M282,420 l-4,2.4" fill="none" stroke="#4A5C55" stroke-width="0.7"/><line x1="260" y1="432" x2="282" y2="432" stroke="#4A5C55" stroke-width="0.9"/><path d="M282,432 l-4,-2.4 M282,432 l-4,2.4" fill="none" stroke="#4A5C55" stroke-width="0.7"/><line x1="260" y1="444" x2="282" y2="444" stroke="#4A5C55" stroke-width="0.9"/><path d="M282,444 l-4,-2.4 M282,444 l-4,2.4" fill="none" stroke="#4A5C55" stroke-width="0.7"/><text x="266" y="410" font-size="4.4" fill="#4A5C55">出风</text>
<text x="190" y="510" font-size="4.5" fill="#4A5C55" text-anchor="middle">虚而不屈，动而愈出：不是越拉越满，是一直能开合</text>
<text x="24" y="548" font-size="5.4" fill="#2F2A24">锁不是外物，是人自己那本账：要他一定这样、一定那样，把活的支点浇成死的刻度。</text>
<text x="24" y="564" font-size="5.4" fill="#2F2A24">「数穷」不是没钱，是路走到头——支点不动，器再贵也只是个壳。</text>
<text x="24" y="582" font-size="5.2" fill="#4A5C55">守中不是找一个好位置站住，是随时肯挪；能挪的，才叫中。</text>
<line x1="24" y1="600" x2="338" y2="600" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="608" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="624" font-size="6.0" fill="#2F2A24" text-anchor="middle">执一则穷，</text>
<text x="190" y="636" font-size="6.0" fill="#4A5C55" text-anchor="middle">守中则通——枢不死，机才活。</text>
<line x1="20" y1="662" x2="360" y2="662" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="676" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="692" font-size="8.4" fill="#2F2A24">多言数穷，不如守中。</text>
<text x="20" y="708" font-size="8.4" fill="#2F2A24">穷者，路走到头也；锁在 0、锁在 1、锁在自以为稳的中间——枢不动，机就死。</text>
</svg>