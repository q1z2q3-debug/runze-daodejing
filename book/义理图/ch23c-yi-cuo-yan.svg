<ellipse cx="188" cy="266" rx="26" ry="7" fill="none" stroke="#B4CCC4" stroke-width="0.7" opacity="0.8"/>
<path d="M190,172 L190,216" fill="none" stroke="#C9B79A" stroke-width="0.9" stroke-dasharray="3 2"/>
<circle cx="187" cy="176" r="1.1" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<circle cx="192" cy="180" r="1.1" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<circle cx="189" cy="184" r="1.1" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<circle cx="194" cy="188" r="1.1" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<circle cx="185" cy="190" r="1.1" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<circle cx="191" cy="194" r="1.1" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<text x="190" y="308" font-size="4.2" fill="#4A5C55" text-anchor="middle">盐落进水里：水把它化了，收在自己里头。</text>
<text x="190" y="326" font-size="3.9" fill="#8A7C69" text-anchor="middle">不是水喜欢盐，是它们本就一处。</text>
<text x="24" y="353" font-size="5.0" fill="#4A5C55">一、盐落水里：化开，收下了</text>
<rect x="26" y="366" width="328" height="226" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M146,466 L176,448 L210,444 L244,458 L250,490 L228,516 L170,514 L142,490 Z" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M176,448 L184,470 L216,474 L244,458 L210,444" fill="none" stroke="#C9B79A" stroke-width="0.7"/>
<circle cx="186" cy="452" r="1.2" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<circle cx="191" cy="450" r="1.2" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<circle cx="197" cy="450" r="1.2" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<circle cx="203" cy="451" r="1.2" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<circle cx="208" cy="452" r="1.2" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<circle cx="189" cy="448" r="1.2" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<circle cx="200" cy="447" r="1.2" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<circle cx="211" cy="448" r="1.2" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.5"/>
<path d="M118,440 Q188,430 252,436" fill="none" stroke="#A9B8AF" stroke-width="1.0"/>
<path d="M122,430 Q194,420 258,426" fill="none" stroke="#A9B8AF" stroke-width="0.9"/>
<path d="M262,434 L276,432" fill="none" stroke="#A9B8AF" stroke-width="0.8"/>
