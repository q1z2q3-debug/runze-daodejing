<circle cx="262" cy="424" r="1.2" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.45" opacity="0.9"/>
<circle cx="278" cy="418" r="1.1" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.45" opacity="0.9"/>
<circle cx="296" cy="422" r="1.0" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.45" opacity="0.9"/>
<circle cx="314" cy="412" r="0.9" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.45" opacity="0.9"/>
<circle cx="328" cy="416" r="0.8" fill="#FFFFFF" stroke="#C9B79A" stroke-width="0.45" opacity="0.9"/>
<text x="190" y="542" font-size="4.2" fill="#A2503B" text-anchor="middle">同一撮盐落在石上：石收不住，风一过就散。</text>
<text x="190" y="560" font-size="3.9" fill="#8A7C69" text-anchor="middle">不是石罚盐，是石头本来就不是那个地方。</text>
<text x="190" y="580" font-size="3.9" fill="#A2503B" text-anchor="middle">没进到那一处，就谈不上信；话后面没有人，说多久都是空的。</text>
<text x="24" y="605" font-size="5.0" fill="#A2503B">二、盐落石上：收不住，风一过就散</text>
<text x="24" y="622" font-size="4.9" fill="#2F2A24">同于道：以本源为归；同于德：以孔德为归；同于失：住进滑落之后那个位置。</text>
<text x="24" y="638" font-size="4.9" fill="#2F2A24">「失」在这里是名词，不是动词：同一个字，两个身份。</text>
<text x="24" y="654" font-size="4.9" fill="#2F2A24">「同」不是与人一样，是同频：你往哪个方向安放自己，就融进哪一层。</text>
<text x="24" y="670" font-size="4.9" fill="#2F2A24">抱一是动作，同于是结果——不是道在挑人，是同类相取，不必求谁批准。</text>
<text x="24" y="686" font-size="4.9" fill="#4A5C55">「同于失者，失亦乐得之」是全章最冷一句：没有惩罚，只是收得越来越稳。</text>
<line x1="24" y1="706" x2="338" y2="706" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="714" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="730" font-size="5.2" fill="#2F2A24" text-anchor="middle">报，要有一个给的人；合，不需要。</text>
<text x="190" y="742" font-size="4.5" fill="#4A5C55" text-anchor="middle">你把自己放进什么里，就被什么收下。</text>
<line x1="20" y1="768" x2="360" y2="768" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="782" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="798" font-size="8.4" fill="#2F2A24">报，要有一个给的人；合，不需要。</text>
<text x="20" y="814" font-size="8.4" fill="#2F2A24">你把自己放进什么里，就被什么收下。</text>
</svg>