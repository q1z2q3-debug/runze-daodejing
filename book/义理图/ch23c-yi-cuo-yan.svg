<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="你把自己放进什么里，就被什么收下" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="840" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 三 章 · 同 于 道</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一撮盐</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">同于道者，道亦乐得之；同于失者，失亦乐得之。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">从事：从是追随，事是践行；同：合也、齐也，此处指同频，不是「与人一样」。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">乐得：自然相取、不劳而得；拟人之辞，不是说道有喜怒、在挑人。</text>
<rect x="26" y="150" width="328" height="190" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M130,224 C132,282 248,282 250,224" fill="#EAF1EC" stroke="#2F2A24" stroke-width="1.1"/>
<ellipse cx="190" cy="224" rx="60" ry="10" fill="#F2F6F1" stroke="#2F2A24" stroke-width="1.1"/>
