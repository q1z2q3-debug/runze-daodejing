<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="「固」是必然如此，不是「你就这样办」" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="536" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 六 章 · 四 对</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">四对：一张一阖</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">看清节律的人有两种：一种跟着走，一种拿它下套。</text>
<rect x="20" y="102" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="118" font-size="7.4" fill="#2F2A24" text-anchor="middle">将欲歙之，必固张之；将欲弱之，必固强之；</text>
<text x="190" y="134" font-size="7.4" fill="#2F2A24" text-anchor="middle">将欲废之，必固兴之；将欲取之，必固与之。</text>
<rect x="20" y="150" width="162" height="126" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<rect x="198" y="150" width="162" height="126" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<rect x="20" y="286" width="162" height="126" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<rect x="198" y="286" width="162" height="126" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="32" y="168" font-size="8.2" fill="#A2503B">歙 / 张：一口气</text>
<path d="M48,188 Q68,212 48,236" fill="none" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="44" y1="188" x2="44" y2="236" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="62" y1="202" x2="92" y2="194" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="100" y="202" font-size="6.8" fill="#6E6459">上弦之后必放</text>
<text x="32" y="250" font-size="7.0" fill="#2F2A24">吸气之后必呼，上弦之后必放。</text>
<text x="32" y="264" font-size="6.9" fill="#A2503B">你要收，是因为它已经张满了。</text>
<text x="210" y="168" font-size="8.2" fill="#4A5C55">弱 / 强：能弯的不折</text>
<path d="M216,230 Q236,194 256,230" fill="none" stroke="#4A5C55" stroke-width="1.3"/>
<line x1="268" y1="192" x2="292" y2="192" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M268,192 l-6,-4 M292,192 l6,-4" stroke="#A2503B" stroke-width="0.8"/>
<text x="280" y="206" font-size="6.6" fill="#A2503B" text-anchor="middle">绷到断</text>
<text x="210" y="250" font-size="7.0" fill="#2F2A24">弱是桡：一根能弯的枝；</text>
<text x="210" y="264" font-size="6.9" fill="#A2503B">强是弦绷紧。弯的不断，绷的会断。</text>
<text x="32" y="304" font-size="8.2" fill="#A2503B">废 / 兴：众手与撤手</text>
<rect x="38" y="342" width="36" height="24" fill="none" stroke="#DCCBB0" stroke-width="0.9"/>
<path d="M34,342 l10,-10 l12,8 l14,-12" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M40,370 l26,-8" stroke="#2F2A24" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="38" y="382" font-size="6.4" fill="#6E6459">屋塌：不用人管</text>
<rect x="118" y="338" width="26" height="18" fill="#E9DFCC" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="117" y1="370" x2="117" y2="358" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arrS)"/>
<line x1="127" y1="370" x2="127" y2="358" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arrS)"/>
<line x1="139" y1="370" x2="139" y2="358" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arrS)"/>
<line x1="149" y1="370" x2="149" y2="358" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arrS)"/>
<text x="131" y="382" font-size="6.4" fill="#4A5C55" text-anchor="middle">四手共举</text>
<text x="32" y="400" font-size="6.9" fill="#A2503B">举起来要合力，塌下去不用人管。</text>
<text x="210" y="304" font-size="8.2" fill="#4A5C55">取 / 与：拿与给</text>
<circle cx="220" cy="334" r="4.2" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M228,334 l16,0" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M244,330 l0,6 M244,336 l0,6" stroke="#2F2A24" stroke-width="0.7"/>
<text x="250" y="336" font-size="6.4" fill="#6E6459">取：从别人身上拿</text>
<circle cx="238" cy="360" r="8" fill="#E9DFCC" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M220,372 q14,-3 24,-1" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M244,371 l4,2 l-4,2" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<text x="210" y="386" font-size="6.7" fill="#A2503B">给出去的，都在等着被取。</text>
<text x="210" y="398" font-size="6.4" fill="#6E6459">给是给，取是拿，两件事。</text>
<rect x="20" y="424" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="442" font-size="8.2" fill="#2F2A24" text-anchor="middle">「固」＝必然如此：说这话的是观天的人。</text>
<text x="190" y="458" font-size="7.4" fill="#6E6459" text-anchor="middle">若读成「你就这样办」，就成了下棋的人——同一句，两条路。</text>
<line x1="20" y1="476" x2="360" y2="476" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="490" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="506" font-size="8.4" fill="#2F2A24">歙是吸气，张是上弦；一口气吸到底，下一口只能是呼。</text>
<text x="20" y="522" font-size="8.4" fill="#2F2A24">兴是众手共举，废是无人再举。</text>
</svg>