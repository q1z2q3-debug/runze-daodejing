<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="辅是颊车：牙自己长，骨头只托——托住，别去捏" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="610" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 四 章 · 辅</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一块骨头</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">以辅万物之自然而不敢为。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「辅」，《说文》「人颊车也」——脸颊里那块牙床骨。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">牙不是牙床长出来的：牙自己长，骨头只给它一个位置，托住。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、牙床托着的那排牙</text>
<path d="M112,296 C124,230 250,230 264,296" fill="none" stroke="#2F2A24" stroke-width="3.4"/>
<path d="M118,292 C130,238 246,238 258,292" fill="none" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="126" y="240" width="12" height="24" rx="3" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1"/>
<line x1="129" y1="244" x2="129" y2="260" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="146" y="224" width="12" height="24" rx="3" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1"/>
<line x1="149" y1="228" x2="149" y2="244" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="166" y="216" width="12" height="24" rx="3" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1"/>
<line x1="169" y1="220" x2="169" y2="236" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="186" y="214" width="12" height="24" rx="3" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1"/>
<line x1="189" y1="218" x2="189" y2="234" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="206" y="220" width="12" height="24" rx="3" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1"/>
<line x1="209" y1="224" x2="209" y2="240" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="226" y="234" width="12" height="24" rx="3" fill="#FBF6EC" stroke="#2F2A24" stroke-width="1"/>
<line x1="229" y1="238" x2="229" y2="254" stroke="#DCCBB0" stroke-width="0.6"/>
<line x1="182" y1="200" x2="182" y2="168" stroke="#4A5C55" stroke-width="1.1" stroke-dasharray="3 2" marker-end="url(#arr2)"/>
<line x1="158" y1="212" x2="158" y2="192" stroke="#4A5C55" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr2)"/>
<line x1="208" y1="212" x2="208" y2="192" stroke="#4A5C55" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr2)"/>
<text x="192" y="164" font-size="4.5" fill="#4A5C55">牙自己长</text>
<text x="258" y="258" font-size="4.5" fill="#2F2A24">骨头只托</text>
<text x="120" y="318" font-size="4.6" fill="#6E6459">托得好，牙正；托得歪，牙斜；骨头一动，满口都疼</text>
<text x="24" y="344" font-size="4.8" fill="#2F2A24">「辅」是颊车，就是牙床骨：它不造牙，只给牙一个位置。</text>
<text x="24" y="360" font-size="4.9" fill="#2F2A24">以辅万物之自然而不敢为：托住，不捏——捏，就是替它长。</text>
<text x="24" y="378" font-size="5.0" fill="#4A5C55">《左传》「辅车相依，唇亡齿寒」：辅与车是两块互相靠着的骨头。</text>
<line x1="24" y1="396" x2="338" y2="396" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="404" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="420" font-size="5.6" fill="#2F2A24" text-anchor="middle">牙自己长，骨头只托；</text>
<text x="190" y="432" font-size="5.2" fill="#4A5C55" text-anchor="middle">辅万物之自然，就是托住，不去捏。</text>
<line x1="20" y1="458" x2="360" y2="458" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="472" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="488" font-size="8.4" fill="#2F2A24">牙自己长，骨头只托；辅万物之自然，就是托住，不去捏。</text>
<text x="20" y="504" font-size="8.4" fill="#2F2A24">托得好，牙正；托得歪，牙斜；骨头一动，满口都疼。</text>
</svg>