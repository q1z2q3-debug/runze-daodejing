<text x="308" y="398" font-size="9" fill="#8A7C69" text-anchor="middle">空</text>
<text x="308" y="454" font-size="10" fill="#A2503B" text-anchor="middle">海绵壁</text>
<text x="308" y="470" font-size="8.4" fill="#6E6459" text-anchor="middle">过度：壁胀、变厚</text>
<text x="308" y="484" font-size="7.9" fill="#6E6459" text-anchor="middle">腔被挤小，空吸进孔里</text>
<rect x="20" y="500" width="340" height="60" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="32" y="517" font-size="8.8" fill="#A2503B">「虚」不是实的反面：是有的那部分自己松成海绵</text>
<text x="32" y="533" font-size="8.6" fill="#6E6459">虚其心：在空上做减法，留白，空还照用。</text>
<text x="32" y="549" font-size="8.6" fill="#6E6459">虚其腹：在壁上被动的松，料变多孔、变胀，空反被吃掉。</text>
<rect x="20" y="574" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="593" font-size="11.5" fill="#2F2A24" text-anchor="middle" letter-spacing="1">有之以为利，无之以为用。</text>
<text x="190" y="608" font-size="8.8" fill="#6E6459" text-anchor="middle">过与不及，皆失其用。</text>
</svg>