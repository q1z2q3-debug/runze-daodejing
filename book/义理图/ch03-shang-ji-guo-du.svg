<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 636" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="「尚」是把自然的分寸，抬成表态" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="636" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 章 · 治 世</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">尚即过度</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">壁在，空才用得起；壁胀了，空就用不上。</text>
<text x="20" y="116" font-size="9.5" fill="#A2503B">不尚贤</text>
<line x1="112" y1="111" x2="132" y2="111" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="138" y="116" font-size="9.5" fill="#2F2A24">使民不争</text>
<text x="206" y="116" font-size="8.5" fill="#6E6459">把长处摆成徽章</text>
<text x="20" y="140" font-size="9.5" fill="#A2503B">不贵难得之货</text>
<line x1="112" y1="135" x2="132" y2="135" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="138" y="140" font-size="9.5" fill="#2F2A24">使民不为盗</text>
<text x="206" y="140" font-size="8.5" fill="#6E6459">把稀罕标成高价</text>
<text x="20" y="164" font-size="9.5" fill="#A2503B">不见可欲</text>
<line x1="112" y1="159" x2="132" y2="159" stroke="#DCCBB0" stroke-width="1" marker-end="url(#arr)"/>
<text x="138" y="164" font-size="9.5" fill="#2F2A24">使民心不乱</text>
<text x="206" y="164" font-size="8.5" fill="#6E6459">把勾人的摆到眼前</text>
<text x="20" y="180" font-size="9" fill="#8A7C69">三个动作是同一件：不主动抬它，标尺就不起来。</text>
<text x="20" y="204" font-size="9.5" fill="#8A7C69">经文四句，恰好分成壁与空</text>
<rect x="36" y="234" width="13" height="74" fill="#2F2A24" opacity="0.62"/>
<rect x="132" y="234" width="13" height="74" fill="#2F2A24" opacity="0.62"/>
<line x1="49" y1="308" x2="132" y2="308" stroke="#2F2A24" stroke-width="1" opacity="0.5"/>
<text x="90" y="275.0" font-size="12" fill="#8A7C69" text-anchor="middle">空</text>
<text x="26" y="228" font-size="9" fill="#A2503B">壁</text>
<text x="162" y="236" font-size="9.5" fill="#A2503B">实其腹 · 强其骨 → 壁</text>
<text x="162" y="252" font-size="8.5" fill="#6E6459">厚其壁，是让它立得住</text>
<text x="162" y="282" font-size="9.5" fill="#4A5C55">虚其心 · 弱其志 → 空</text>
<text x="162" y="298" font-size="8.5" fill="#6E6459">守其空，是让空用得起</text>
<text x="20" y="332" font-size="9.2" fill="#8A7C69">同一段壁的三种质地：变的是壁，空一直是空</text>
<circle cx="72" cy="394" r="40.5" fill="none" stroke="#2F2A24" stroke-width="7" opacity="0.34"/>
<text x="72" y="398" font-size="9.5" fill="#8A7C69" text-anchor="middle">空</text>
<text x="72" y="454" font-size="10" fill="#A2503B" text-anchor="middle">薄壁</text>
<text x="72" y="470" font-size="8.4" fill="#6E6459" text-anchor="middle">不及：立不住</text>
<text x="72" y="484" font-size="8.2" fill="#6E6459" text-anchor="middle">空虽在，器不成</text>
<circle cx="190" cy="394" r="35.5" fill="none" stroke="#2F2A24" stroke-width="17" opacity="0.66"/>
<text x="190" y="398" font-size="9.5" fill="#8A7C69" text-anchor="middle">空</text>
<text x="190" y="454" font-size="10" fill="#A2503B" text-anchor="middle">实其腹</text>
<text x="190" y="470" font-size="8.4" fill="#6E6459" text-anchor="middle">分寸：壁致密而空存</text>
<text x="190" y="484" font-size="8.2" fill="#6E6459" text-anchor="middle">利与用俱</text>
<circle cx="308" cy="394" r="31.0" fill="none" stroke="#2F2A24" stroke-width="26" opacity="0.72"/>
