<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 728" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="契只存着，账天天在算" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="728" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 九 章 · 彻</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一张账</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">有德司契，无德司彻。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">彻，通也：通篇算过的账。它每月重算，所以永远有新数。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">契刻着齿，账写着数：一个记得住，一个算得清。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、账摊开着：天天在算</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M92,206 L188,214 L188,280 L92,272 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M284,206 L188,214 L188,280 L284,272 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="102" y1="220" x2="176" y2="224" stroke="#B9A98F" stroke-width="0.7"/>
<line x1="200" y1="224" x2="274" y2="220" stroke="#B9A98F" stroke-width="0.7"/>
<line x1="102" y1="231" x2="176" y2="235" stroke="#B9A98F" stroke-width="0.7"/>
<line x1="200" y1="235" x2="274" y2="231" stroke="#B9A98F" stroke-width="0.7"/>
<line x1="102" y1="242" x2="176" y2="246" stroke="#B9A98F" stroke-width="0.7"/>
<line x1="200" y1="246" x2="274" y2="242" stroke="#B9A98F" stroke-width="0.7"/>
<line x1="102" y1="253" x2="176" y2="257" stroke="#B9A98F" stroke-width="0.7"/>
<line x1="200" y1="257" x2="274" y2="253" stroke="#B9A98F" stroke-width="0.7"/>
<line x1="102" y1="264" x2="176" y2="268" stroke="#B9A98F" stroke-width="0.7"/>
<line x1="200" y1="268" x2="274" y2="264" stroke="#B9A98F" stroke-width="0.7"/>
<line x1="228" y1="196" x2="240" y2="254" stroke="#2F2A24" stroke-width="1.6"/>
<path d="M240,254 l-4,8 l6,-1" fill="#DED2B8" stroke="#2F2A24" stroke-width="1"/>
<text x="190" y="298" font-size="4.3" fill="#A2503B" text-anchor="middle">彻：通篇算过，条条都记得</text>
<text x="190" y="330" font-size="4.6" fill="#4A5C55" text-anchor="middle">它不出声，但它天天在动</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、账合上了：只存那一块木</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="112" y="426" width="60" height="56" rx="3" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="112" y1="440" x2="172" y2="440" stroke="#B9A98F" stroke-width="0.7"/>
<line x1="156" y1="426" x2="156" y2="482" stroke="#2F2A24" stroke-width="1.4"/>
<path d="M112,454 q-12,4 -6,14 q8,-6 6,-14" fill="none" stroke="#A2503B" stroke-width="1"/>
<text x="142" y="502" font-size="4.2" fill="#6E6459" text-anchor="middle">账合了，绳子系上</text>
<rect x="222" y="418" width="30" height="70" rx="2" fill="#DED2B8" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="222" y1="428" x2="236" y2="428" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="222" y1="440" x2="236" y2="440" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="222" y1="452" x2="236" y2="452" stroke="#2F2A24" stroke-width="0.9"/>
<text x="252" y="502" font-size="4.2" fill="#A2503B" text-anchor="middle">只剩这块木</text>
<text x="190" y="534" font-size="4.6" fill="#4A5C55" text-anchor="middle">司契者只存凭据，不算那一遍</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">账每算一遍，就多一遍的数；契不重算，齿还是那道齿。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">无德司彻：不是算错了，是算得太勤。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">有德司契，无德司彻。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="5.4" fill="#2F2A24" text-anchor="middle">有德司契，无德司彻。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">契记齿，账记数。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">有德司契，无德司彻。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">彻者，通也；司彻者，通篇算之，故其数日新。</text>
</svg>