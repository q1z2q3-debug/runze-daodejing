<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="不欲琭琭如玉，珞珞如石" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="608" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 九 章 · 其 三</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">玉 与 石</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">其致之：天无以清将恐裂，地无以宁将恐发。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「琭琭」，玉有光泽的样子；「珞珞」，石坚硬粗砺的样子。全书末一句落到这两样东西上。</text>
<text x="190" y="127" font-size="4.5" fill="#6E6459">玉贵而脆，石贱而坚：一个被捧着，一个被用着。</text>
<text x="24" y="152" font-size="5.0" fill="#4A5C55">一、如玉：被供着，也怕碎</text>
<rect x="26" y="164" width="328" height="164" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="276" x2="340" y2="276" stroke="#DCCBB0" stroke-width="0.9"/>
<rect x="112" y="248" width="112" height="8" fill="#E4D9C0" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="120" y1="256" x2="120" y2="276" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="216" y1="256" x2="216" y2="276" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M126,248 q8,-6 16,0 q8,-6 16,0 q8,-6 16,0 q8,-6 16,0 q8,-6 16,0" fill="none" stroke="#C69E8A" stroke-width="0.8"/>
<path d="M142,246 q-8,-40 26,-46 q34,-6 26,46 Z" fill="#E3EEE6" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M150,238 q-4,-26 18,-30" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="154" y="230" font-size="5.0" fill="#6E8C78" text-anchor="middle">玉</text>
<path d="M182,208 l-6,14 l5,10 l-4,12" fill="none" stroke="#A2503B" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="58" y="214" font-size="4.0" fill="#A2503B">一碰就裂</text>
<text x="272" y="222" font-size="4.5" fill="#A2503B">贵</text>
<text x="272" y="234" font-size="4.0" fill="#8A7C69">人人捧你</text>
<text x="272" y="246" font-size="4.0" fill="#8A7C69">也人人怕你碎</text>
<text x="190" y="292" font-size="4.5" fill="#2F2A24" text-anchor="middle">琭琭：光滑、体面、不能落地——它的贵，是不敢碰</text>
<text x="24" y="322" font-size="5.0" fill="#4A5C55">二、如石：被踩着，可承得住</text>
<rect x="26" y="334" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="450" x2="340" y2="450" stroke="#DCCBB0" stroke-width="0.9"/>
<rect x="150" y="354" width="56" height="66" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="163" y1="358" x2="163" y2="416" stroke="#C9B79A" stroke-width="0.5"/>
<line x1="193" y1="358" x2="193" y2="416" stroke="#C9B79A" stroke-width="0.5"/>
<path d="M134,420 L222,420 L228,450 L128,450 Z" fill="#D9CFBB" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M142,430 q10,4 20,-2 M186,434 q10,4 22,-3 M150,442 q16,4 30,-2" fill="none" stroke="#B4A78D" stroke-width="0.5"/>
<text x="178" y="440" font-size="4.6" fill="#8A7C69" text-anchor="middle">础</text>
<line x1="178" y1="368" x2="178" y2="416" stroke="#8A7C69" stroke-width="0.7" stroke-dasharray="3 3" marker-end="url(#arr)"/>
<text x="246" y="374" font-size="4.0" fill="#8A7C69">整座屋</text>
<text x="246" y="386" font-size="4.0" fill="#8A7C69">都压在它身上</text>
<text x="190" y="466" font-size="4.5" fill="#2F2A24" text-anchor="middle">珞珞：粗、硬、被踩着——它的贱，是承得住</text>
<line x1="24" y1="482" x2="356" y2="482" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="490" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="506" font-size="4.8" fill="#2F2A24" text-anchor="middle">贵以贱为本，高以下为基——最底下那一块，撑着上面全部。</text>
<text x="190" y="519" font-size="4.6" fill="#4A5C55" text-anchor="middle">宁做那块被踩着的石头，不做那块被捧着的玉。</text>
<line x1="20" y1="536" x2="360" y2="536" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="550" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="566" font-size="8.4" fill="#2F2A24">玉贵而脆，石贱而坚。</text>
<text x="20" y="582" font-size="8.4" fill="#2F2A24">宁做那块被踩着的石头，不做那块被捧着的玉。</text>
</svg>