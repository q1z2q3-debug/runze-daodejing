<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 706" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="力是筋：筋不使劲，筋是连——连上了，劲自然传过去" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="706" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 八 章 · 力</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一根筋</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">善用人者，为之下。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「力」，《说文》「筋也」——筋连骨，不使劲；力是传过去的，不是攒出来的。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">「为之下」：站到下面，筋才连得上。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、各站各的高处：筋搭不上</text>
<rect x="26" y="160" width="328" height="164" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="78" y="194" width="26" height="12" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="78" y="268" width="26" height="12" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M104,200 Q136,212 150,222" fill="none" stroke="#A2503B" stroke-width="1.3"/>
<path d="M104,274 Q136,260 150,248" fill="none" stroke="#A2503B" stroke-width="1.3"/>
<line x1="152" y1="218" x2="152" y2="252" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="160" y="238" font-size="4.5" fill="#A2503B">断</text>
<text x="60" y="200" font-size="4.5" fill="#6E6459" text-anchor="end">骨</text>
<text x="60" y="274" font-size="4.5" fill="#6E6459" text-anchor="end">骨</text>
<text x="230" y="206" font-size="4.5" fill="#6E6459">一人站高</text>
<text x="230" y="272" font-size="4.5" fill="#6E6459">一人站低</text>
<line x1="300" y1="220" x2="300" y2="256" stroke="#B9A98F" stroke-width="1.0" marker-end="url(#arr)"/>
<text x="190" y="316" font-size="4.6" fill="#A2503B" text-anchor="middle">高低差着，筋搭不上：各使各的劲，谁也不传</text>
<text x="24" y="344" font-size="4.8" fill="#4A5C55">二、站到下面：两端齐了，筋一连，劲就传过去</text>
<rect x="26" y="356" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="50" y="420" width="26" height="12" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="304" y="420" width="26" height="12" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<text x="44" y="426" font-size="4.2" fill="#6E6459" text-anchor="end">骨</text>
<text x="336" y="426" font-size="4.2" fill="#6E6459" text-anchor="end">骨</text>
<line x1="76" y1="426" x2="304" y2="426" stroke="#4A5C55" stroke-width="1.8"/>
<path d="M172,464 L190,430 L208,464 Z" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="164" y1="464" x2="216" y2="464" stroke="#2F2A24" stroke-width="1"/>
<text x="190" y="480" font-size="4.5" fill="#4A5C55" text-anchor="middle">为之下：支点在下面</text>
<line x1="190" y1="420" x2="96" y2="420" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arrL)"/>
<line x1="190" y1="420" x2="284" y2="420" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arr2)"/>
<text x="190" y="512" font-size="4.6" fill="#4A5C55" text-anchor="middle">一端在下面托住，筋才绷得直：两头的劲接上了</text>
<text x="24" y="530" font-size="4.8" fill="#2F2A24">力不是攒出来的，是传过去的：士是推十合一，不是一人当十。</text>
<text x="24" y="546" font-size="4.8" fill="#2F2A24">烛之武推辞，郑伯认错「是寡人之过也」——一句低头，换回一国。</text>
<text x="24" y="564" font-size="5.0" fill="#4A5C55">站低一处，众人的劲才连成一根筋。</text>
<line x1="24" y1="580" x2="338" y2="580" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="588" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="603" font-size="5.2" fill="#2F2A24" text-anchor="middle">力者，筋也；筋不使劲，筋是连。</text>
<text x="190" y="616" font-size="4.9" fill="#4A5C55" text-anchor="middle">连上了，劲自然传过去。</text>
<line x1="20" y1="642" x2="360" y2="642" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="656" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="672" font-size="8.4" fill="#2F2A24">力者，筋也；筋不使劲，筋是连。</text>
<text x="20" y="688" font-size="8.4" fill="#2F2A24">善用人者为之下：站低一处，众人的劲才连成一根筋。</text>
</svg>