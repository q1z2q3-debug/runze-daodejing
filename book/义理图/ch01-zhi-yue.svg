<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 636" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="指月三境：执字、会心、入境" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker></defs>
<rect x="0" y="0" width="380" height="636" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 一 章 · 读 法</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">指月三境</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">手指指月，人常盯着手指。三层就是把手指松开。</text>
<rect x="20" y="100" width="340" height="116" fill="#F2EADA" stroke="#DCCBB0" stroke-width="1.0"/>
<text x="32" y="126" font-size="13" fill="#A2503B">第一境 · 执字</text>
<text x="32" y="148" font-size="10.5" fill="#2F2A24">老子讲，我记；主客分明</text>
<text x="32" y="168" font-size="10.5" fill="#6E6459">字是讲义：字义、断句、概念</text>
<path d="M 232 178 L 300 170 L 300 180 Z" fill="#2F2A24" opacity="0.90" stroke="none"/>
<line x1="232" y1="166" x2="232" y2="190" stroke="#2F2A24" stroke-width="1.1" opacity="1.0"/>
<line x1="238" y1="170" x2="238" y2="188" stroke="#2F2A24" stroke-width="0.7" opacity="1.0"/>
<line x1="290" y1="172" x2="294" y2="178" stroke="#2F2A24" stroke-width="0.7" opacity="1.0"/>
<circle cx="320" cy="160" r="16" fill="none" stroke="#4A5C55" stroke-width="1.3" opacity="0.65"/>
<circle cx="320" cy="160" r="10" fill="none" stroke="#4A5C55" stroke-width="0.8" opacity="0.5"/>
<text x="320" y="206" font-size="10" fill="#6E6459" text-anchor="middle">月</text>
<line x1="190" y1="216" x2="190" y2="238" stroke="#C9B79A" stroke-width="1.0" marker-end="url(#arr)"/>
<rect x="20" y="240" width="340" height="116" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<text x="32" y="266" font-size="13" fill="#2F2A24">第二境 · 会心</text>
<text x="32" y="288" font-size="10.5" fill="#2F2A24">顺指望去，知其所指</text>
<text x="32" y="308" font-size="10.5" fill="#6E6459">方向对了，隔阂淡了</text>
<path d="M 232 318 L 284 310 L 284 320 Z" fill="#2F2A24" opacity="0.50" stroke="none"/>
<line x1="232" y1="306" x2="232" y2="330" stroke="#2F2A24" stroke-width="1.1" opacity="0.55"/>
<line x1="238" y1="310" x2="238" y2="328" stroke="#2F2A24" stroke-width="0.7" opacity="0.55"/>
<circle cx="320" cy="300" r="16" fill="none" stroke="#4A5C55" stroke-width="1.3" opacity="0.65"/>
<circle cx="320" cy="300" r="10" fill="none" stroke="#4A5C55" stroke-width="0.8" opacity="0.5"/>
<text x="320" y="346" font-size="10" fill="#6E6459" text-anchor="middle">月</text>
<line x1="190" y1="356" x2="190" y2="378" stroke="#C9B79A" stroke-width="1.0" marker-end="url(#arr)"/>
<rect x="20" y="380" width="340" height="116" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<text x="32" y="406" font-size="13" fill="#4A5C55">第三境 · 入境</text>
<text x="32" y="428" font-size="10.5" fill="#2F2A24">指、言、经俱舍；唯有月在</text>
<text x="32" y="448" font-size="10.5" fill="#6E6459">没有读经的我，也没有被读的经</text>
<circle cx="306" cy="438" r="24" fill="none" stroke="#4A5C55" stroke-width="1.7" opacity="1"/>
<circle cx="306" cy="438" r="31" fill="none" stroke="#4A5C55" stroke-width="0.5" opacity="0.35"/>
<text x="190" y="532" font-size="10.5" fill="#6E6459" text-anchor="middle">松手不是丢掉字，是不再靠字。</text>
</svg>