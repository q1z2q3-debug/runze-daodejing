<text x="196" y="404" font-size="3.7" fill="#8A7C69" text-anchor="middle">枯树</text>
<text x="312" y="498" font-size="3.9" fill="#A2503B" text-anchor="middle">凶年：一只空碗</text>
<text x="120" y="498" font-size="3.9" fill="#8A7C69" text-anchor="middle">刺不需要人养，庄稼需要</text>
<text x="24" y="528" font-size="4.8" fill="#2F2A24">「必」这个字很硬：一场大战误一季农时，误一季就是一年，一年还不够缓几年。</text>
<text x="24" y="544" font-size="4.8" fill="#2F2A24">上一句写地（荆棘），这一句写人（凶年）——「和」被打碎之后的两个维度。</text>
<text x="24" y="562" font-size="4.8" fill="#4A5C55">这就是「合」的账单：你要一个统一的样子，代价是这一整片地的生生节奏被掐断。</text>
<line x1="24" y1="580" x2="338" y2="580" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="588" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="604" font-size="6.0" fill="#2F2A24" text-anchor="middle">地不认人的功，只认人的手。</text>
<text x="190" y="616" font-size="5.0" fill="#4A5C55" text-anchor="middle">手一撤，它回野；这不是修辞，是农事的实情。</text>
<line x1="20" y1="642" x2="360" y2="642" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="656" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="672" font-size="8.4" fill="#2F2A24">荒地先长刺，因为刺不需要人养。</text>
<text x="20" y="688" font-size="8.4" fill="#2F2A24">一个统一的样子，和一片长刺的地。</text>
</svg>