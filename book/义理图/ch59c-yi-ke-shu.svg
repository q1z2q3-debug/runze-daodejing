<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="深根固柢：根是横着铺的，柢是竖着扎的" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="690" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 九 章 · 根柢</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一棵树</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">是谓深根固柢，长生久视之道。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">「根」是横着铺开的那一层须；「柢」，《说文》「木根也」，是那根往下扎死的主根。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">铺满一层挡不住风；扎死一根，才挡得住。</text>
<text x="24" y="146" font-size="5.4" fill="#A2503B">一、只有根：横着铺一层，风一来就歪</text>
<line x1="24" y1="266" x2="240" y2="266" stroke="#2F2A24" stroke-width="1"/>
<line x1="150" y1="266" x2="158" y2="196" stroke="#2F2A24" stroke-width="2.6"/>
<line x1="154.8" y1="222" x2="132.8" y2="200" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="156.4" y1="210" x2="176.4" y2="190" stroke="#2F2A24" stroke-width="1.2"/>
<circle cx="130.0" cy="196" r="12" fill="none" stroke="#4A5C55" stroke-width="0.5"/>
<circle cx="178.4" cy="186" r="13" fill="none" stroke="#4A5C55" stroke-width="0.5"/>
<path d="M150,268 C127.6,280 105.19999999999999,282 94,288" fill="none" stroke="#A2503B" stroke-width="0.7"/>
<path d="M150,268 C133.2,280 116.4,282 108,288" fill="none" stroke="#A2503B" stroke-width="0.7"/>
<path d="M150,268 C138.8,280 127.6,282 122,288" fill="none" stroke="#A2503B" stroke-width="0.7"/>
<path d="M150,268 C161.2,280 172.4,282 178,288" fill="none" stroke="#A2503B" stroke-width="0.7"/>
<path d="M150,268 C166.8,280 183.6,282 192,288" fill="none" stroke="#A2503B" stroke-width="0.7"/>
<path d="M150,268 C172.4,280 194.8,282 206,288" fill="none" stroke="#A2503B" stroke-width="0.7"/>
<line x1="150" y1="266" x2="158" y2="196" stroke="#DCCBB0" stroke-width="0.4" stroke-dasharray="3 3"/>
<line x1="196" y1="220" x2="176" y2="222" stroke="#A2503B" stroke-width="0.8" marker-end="url(#arrS)"/>
<text x="198" y="214" font-size="4.8" fill="#A2503B">风</text>
<text x="150" y="300" font-size="4.6" fill="#A2503B" text-anchor="middle">根浅、铺得广：一层皮毛，挡不住风</text>
<text x="24" y="336" font-size="5.4" fill="#4A5C55">二、有柢：一根扎死，风还在，树不动</text>
<line x1="24" y1="468" x2="240" y2="468" stroke="#2F2A24" stroke-width="1"/>
<line x1="150" y1="468" x2="150" y2="398" stroke="#2F2A24" stroke-width="2.6"/>
<line x1="150.0" y1="424" x2="128.0" y2="402" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="150.0" y1="412" x2="170.0" y2="392" stroke="#2F2A24" stroke-width="1.2"/>
<circle cx="126.0" cy="398" r="12" fill="none" stroke="#4A5C55" stroke-width="0.5"/>
<circle cx="172.0" cy="388" r="13" fill="none" stroke="#4A5C55" stroke-width="0.5"/>
<path d="M150,470 C134.0,478 118.0,480 110,484" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<path d="M150,470 C141.2,478 132.4,480 128,484" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<path d="M150,470 C158.8,478 167.6,480 172,484" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<path d="M150,470 C166.0,478 182.0,480 190,484" fill="none" stroke="#A2503B" stroke-width="0.6"/>
<line x1="150" y1="468" x2="150" y2="518" stroke="#A2503B" stroke-width="2.4"/>
<line x1="150" y1="494" x2="138" y2="508" stroke="#A2503B" stroke-width="0.8"/>
<line x1="150" y1="502" x2="162" y2="516" stroke="#A2503B" stroke-width="0.8"/>
<line x1="196" y1="422" x2="176" y2="424" stroke="#A2503B" stroke-width="0.8" marker-end="url(#arrS)"/>
<text x="198" y="416" font-size="4.8" fill="#A2503B">风还在</text>
<text x="196" y="478" font-size="4.8" fill="#4A5C55">柢：竖着扎死一根</text>
<text x="150" y="536" font-size="4.6" fill="#4A5C55" text-anchor="middle">长生久视：久不是远，是扎得住</text>
<text x="24" y="552" font-size="4.9" fill="#2F2A24">往外长的都有屋脊：树有顶，屋有顶，到顶就开始老。</text>
<text x="24" y="568" font-size="4.9" fill="#2F2A24">往里蓄的没有顶：仓越满越稳，柢越扎越深，都不长「顶」。</text>
<text x="24" y="584" font-size="4.7" fill="#4A5C55">「久视」是看得久，不是看得远；「长生」在这本书里，从不指肉身不坏。</text>
<line x1="24" y1="602" x2="338" y2="602" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="610" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="626" font-size="5.4" fill="#2F2A24" text-anchor="middle">根是横着铺的，柢是竖着扎的；铺满一层挡不住风，</text>
<text x="190" y="638" font-size="6.0" fill="#4A5C55" text-anchor="middle">扎死一根才挡得住。</text>
<line x1="20" y1="664" x2="360" y2="664" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="678" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="694" font-size="8.4" fill="#2F2A24">根是横着铺的，柢是竖着扎的；铺满一层挡不住风，扎死一根才挡得住。</text>
</svg>