<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 692" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="褐是贱者之服；披上它不是穷，是不打算靠这个说话" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="692" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 章 · 褐</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一件麻衣</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">是以圣人被褐而怀玉。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「褐」，《说文》「编枲袜也，一曰粗衣」——麻编的粗衣，贱者的衣裳。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">「被」读为「披」：是穿上去的动作，不是落到身上的境遇。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、褐：麻编的粗衣，面上没有话</text>
<rect x="26" y="162" width="328" height="142" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="102" y1="186" x2="194" y2="186" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="104" y1="186" x2="110" y2="198" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="192" y1="186" x2="186" y2="198" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="148" y1="186" x2="148" y2="196" stroke="#2F2A24" stroke-width="1"/>
<path d="M138,196 L148,210 L158,196 L167,204 L172,232 L163,232 L165,274 L131,274 L133,232 L124,232 L129,204 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
