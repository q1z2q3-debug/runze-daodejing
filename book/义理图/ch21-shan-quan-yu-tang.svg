<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 758" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="孔德之容，惟道是从：德不占地方，道才进得来" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="758" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 一 章 · 惟 道 是 从</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">山泉与塘</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">孔德之容，惟道是从。道之为物，惟恍惟惚。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">德的样子，就是道流过去的样子。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">泉在山上，你看不见它；塘里那一汪，全是它流来的。</text>
<rect x="26" y="150" width="328" height="214" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M26,242 L54,190 L82,224 L110,202 L138,238" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="88" cy="190" rx="32" ry="11" fill="#F3EBDD" opacity="0.40" stroke="none"/>
<path d="M68,182 q10,-2 20,0 q10,2 20,0" fill="none" stroke="#DCCFBB" stroke-width="0.6"/>
<path d="M68,188 q10,-2 20,0 q10,2 20,0" fill="none" stroke="#DCCFBB" stroke-width="0.6"/>
<path d="M76,226 q6,-6 12,0" fill="#E9F0E6" stroke="#2F2A24" stroke-width="0.9"/>
<text x="100" y="180" font-size="3.8" fill="#8A7C69">泉在雾里，看不见</text>
<path d="M86,230 L92,233 L164,298 L158,296 Z" fill="#E9F0E6" opacity="0.6" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="126" y="246" font-size="3.8" fill="#6E6459" text-anchor="middle">通：渠口通着</text>
<ellipse cx="246" cy="298" rx="84" ry="26" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.2"/>
<ellipse cx="246" cy="300" rx="64" ry="17" fill="#E9F0E6" stroke="#DCCBB0" stroke-width="0.9"/>
<text x="246" y="258" font-size="3.9" fill="#A2503B" text-anchor="middle">大：岸围得宽，不拦水道</text>
<text x="246" y="306" font-size="3.9" fill="#4A5C55" text-anchor="middle">空：塘底不垫土</text>
<text x="190" y="356" font-size="3.7" fill="#8A7C69" text-anchor="middle">一圈岸只开一个口。三读落在同一口塘上：岸不拦、底不垫、口不堵——都是不占地方。</text>
<text x="24" y="377" font-size="5.0" fill="#A2503B">一、塘：泉流过来，它才有水</text>
<rect x="26" y="390" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="288" y="398" width="44" height="14" fill="none" stroke="#A2503B" stroke-width="0.7"/>
<text x="310" y="408" font-size="3.8" fill="#A2503B" text-anchor="middle">反例</text>
<ellipse cx="246" cy="452" rx="84" ry="26" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.2"/>
<ellipse cx="246" cy="452" rx="64" ry="17" fill="#D9CBAA" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M212,444 l13,-4 l13,4 l-4,8 l-18,1 Z" fill="#C9B79A" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M244,456 l13,-4 l13,4 l-4,8 l-18,1 Z" fill="#C9B79A" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M278,446 l13,-4 l13,4 l-4,8 l-18,1 Z" fill="#C9B79A" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M96,416 L102,419 L166,452 L160,450 Z" fill="#E9F0E6" opacity="0.6" stroke="#DCCBB0" stroke-width="0.6"/>
<path d="M166,450 q2,-8 -2,-14" fill="none" stroke="#8FAA9A" stroke-width="0.8"/>
<ellipse cx="164" cy="436" rx="2.4" ry="3.2" fill="#CFE0D6" stroke="none"/>
<ellipse cx="158" cy="444" rx="1.9" ry="2.5" fill="#CFE0D6" stroke="none"/>
<text x="190" y="494" font-size="3.9" fill="#6E6459" text-anchor="middle">塘填实了：水进不去，在渠口漫出来</text>
<text x="190" y="516" font-size="4.6" fill="#A2503B" text-anchor="middle">德若自己占满，道就进不来。</text>
<text x="24" y="553" font-size="5.0" fill="#4A5C55">二、反例：塘填实，水在渠口漫出去</text>
<text x="24" y="572" font-size="4.9" fill="#2F2A24">「孔德之容」：不是先修出一份德、再去从道；是德的一切呈现，本来就只从道出。</text>
<text x="24" y="588" font-size="4.9" fill="#2F2A24">「容」是描摹样子，不是「容量」——第十五章「强为之容」也是描摹。</text>
<text x="24" y="606" font-size="4.9" fill="#4A5C55">恍惚不是道的属性，是道与抓取相遇时的样子：你不抓，它不恍惚。</text>
<line x1="24" y1="624" x2="338" y2="624" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="632" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="648" font-size="5.0" fill="#2F2A24" text-anchor="middle">孔德之容，惟道是从：德不是修出来的，是流出来的。</text>
<text x="190" y="660" font-size="5.0" fill="#4A5C55" text-anchor="middle">德之所以能容，正因它不占地方。</text>
<line x1="20" y1="686" x2="360" y2="686" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="700" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="716" font-size="8.4" fill="#2F2A24">孔德之容，惟道是从：德不是修出来的，是流出来的。</text>
<text x="20" y="732" font-size="8.4" fill="#2F2A24">德之所以能容，正因它不占地方。</text>
</svg>