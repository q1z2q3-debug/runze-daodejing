<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="六问一答：对内做主人，对外做租客" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="592" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 章 · 勘 验</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">载营魄抱一</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">六问各管一件，底子只有一句质问：你是不是在当主人？</text>
<text x="20" y="120" font-size="10" fill="#2F2A24">载营魄抱一</text>
<text x="112" y="120" font-size="9" fill="#8A7C69">能无离乎？</text>
<text x="20" y="136" font-size="8.8" fill="#8A7C69">身心一处，不各走各的</text>
<text x="20" y="164" font-size="10" fill="#2F2A24">专气致柔</text>
<text x="112" y="164" font-size="9" fill="#8A7C69">能婴儿乎？</text>
<text x="20" y="180" font-size="8.8" fill="#8A7C69">气顺到软，不绷着</text>
<text x="20" y="208" font-size="10" fill="#2F2A24">涤除玄览</text>
<text x="112" y="208" font-size="9" fill="#8A7C69">能无疵乎？</text>
<text x="20" y="224" font-size="8.8" fill="#8A7C69">擦净那面镜子，不留斑</text>
<text x="20" y="252" font-size="10" fill="#2F2A24">爱民治国</text>
<text x="112" y="252" font-size="9" fill="#8A7C69">能无为乎？</text>
<text x="20" y="268" font-size="8.8" fill="#8A7C69">事办了，人不被搅</text>
<text x="20" y="296" font-size="10" fill="#2F2A24">天门开阖</text>
<text x="112" y="296" font-size="9" fill="#8A7C69">能为雌乎？</text>
<text x="20" y="312" font-size="8.8" fill="#8A7C69">开合之际，肯受不肯抢</text>
<text x="20" y="340" font-size="10" fill="#2F2A24">明白四达</text>
<text x="112" y="340" font-size="9" fill="#8A7C69">能无知乎？</text>
<text x="20" y="356" font-size="8.8" fill="#8A7C69">都懂了，不拿懂去压人</text>
<rect x="20" y="376" width="160" height="92" fill="#F6EFE0" stroke="{LINE2}" stroke-width="1.0"/>
<rect x="200" y="376" width="160" height="92" fill="#FBF6EC" stroke="{LINE2}" stroke-width="1.0"/>
<text x="32" y="398" font-size="10" fill="#A2503B">对内：主人</text>
<text x="32" y="420" font-size="8.8" fill="#6E6459">自心是唯一有全权的地方</text>
<text x="32" y="436" font-size="8.8" fill="#6E6459">只能自己修，自己守</text>
<text x="212" y="398" font-size="10" fill="#4A5C55">对外：租客</text>
<text x="212" y="420" font-size="8.8" fill="#6E6459">万物只是暂住，可养可建</text>
<text x="212" y="436" font-size="8.8" fill="#6E6459">不可占有，不可改写其性</text>
<rect x="20" y="484" width="340" height="52" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="506" font-size="9.5" fill="#2F2A24" text-anchor="middle">生而不有，为而不恃，长而不宰，是谓玄德</text>
<text x="190" y="526" font-size="9" fill="#6E6459" text-anchor="middle">勘破了那份主宰欲，德自然现成——不必另修一个德出来。</text>
</svg>