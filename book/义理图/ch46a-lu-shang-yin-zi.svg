<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一个国家的秩序，看马站在哪儿就知道" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="500" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 六 章 · 马</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">路上的印子</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">天下有道，却走马以粪；天下无道，戎马生于郊。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.8" fill="#2F2A24" text-anchor="middle">「却」，《说文》「节欲也」——先节住欲，再把马拉回来。</text>
<text x="190" y="126" font-size="5.3" fill="#6E6459" text-anchor="middle">「郊」，《说文》「距国百里为郊」——都城往外一百里，最不该见血的一圈。</text>
<text x="24" y="154" font-size="5.9" fill="#4A5C55">一 · 有道：田里</text>
<line x1="24" y1="222" x2="338" y2="222" stroke="#E6D8C2" stroke-width="0.7"/>
<line x1="32" y1="214" x2="118" y2="214" stroke="#4A5C55" stroke-width="0.45" opacity="0.75"/>
