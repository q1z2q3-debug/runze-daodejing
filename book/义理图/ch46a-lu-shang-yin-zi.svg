<text x="196" y="342" font-size="4.6" fill="#A2503B" text-anchor="middle">母马上阵</text>
<text x="246" y="342" font-size="4.6" fill="#A2503B" text-anchor="middle">生在野地</text>
<path d="M288,330 q4,-3.2 8,0" fill="none" stroke="#A2503B" stroke-width="0.5" opacity="0.85"/>
<path d="M312,326 q4,-3.2 8,0" fill="none" stroke="#A2503B" stroke-width="0.5" opacity="0.85"/>
