<circle cx="305.6" cy="302.6" r="0.7" fill="#A2503B"/>
<text x="272" y="270" font-size="4.8" fill="#A2503B" text-anchor="middle">戎马生于郊</text>
<text x="272" y="336" font-size="4.6" fill="#6E6459" text-anchor="middle">蹄印又急又乱</text>
<line x1="24" y1="348" x2="338" y2="348" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="356" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="372" font-size="6.0" fill="#2F2A24" text-anchor="middle">同一个国家，两种年景：一条路上是车辙，一条路上是蹄印。</text>
<text x="190" y="386" font-size="6.0" fill="#4A5C55" text-anchor="middle">不必看它说什么，看马站在哪儿。</text>
<line x1="20" y1="414" x2="360" y2="414" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="428" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="444" font-size="8.4" fill="#2F2A24">一个国家的秩序好不好，看马站在哪儿就知道；不必看它说什么。</text>
<text x="20" y="460" font-size="8.4" fill="#2F2A24">「却」这个字自己写着答案：马是被拉回来的，欲是自己节住的。</text>
</svg>