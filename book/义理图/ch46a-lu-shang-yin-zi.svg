<text x="240" y="190" font-size="4.8" fill="#4A5C55" text-anchor="middle">却走马以粪</text>
<text x="241" y="248" font-size="4.6" fill="#6E6459" text-anchor="middle">最贵的军资，拉最贱的肥</text>
<text x="24" y="254" font-size="5.9" fill="#A2503B">二 · 无道：马在郊外生崽</text>
<line x1="24" y1="330" x2="338" y2="330" stroke="#E6D8C2" stroke-width="0.7"/>
