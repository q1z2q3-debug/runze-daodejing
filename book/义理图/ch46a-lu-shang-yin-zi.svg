<line x1="32" y1="181" x2="118" y2="181" stroke="#4A5C55" stroke-width="0.2" opacity="0.4"/>
<text x="75" y="234" font-size="4.6" fill="#6E6459" text-anchor="middle">田</text>
<line x1="150" y1="224" x2="248" y2="224" stroke="#2F2A24" stroke-width="0.6" opacity="0.6"/>
<line x1="150" y1="230" x2="248" y2="230" stroke="#2F2A24" stroke-width="0.6" opacity="0.6"/>
<text x="192" y="240" font-size="4.6" fill="#6E6459" text-anchor="middle">两道车辙，走得慢</text>
<rect x="244" y="190" width="62" height="26" fill="#E6D8C2" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="244" y1="198" x2="228" y2="194" stroke="#2F2A24" stroke-width="0.6"/>
<circle cx="256" cy="219" r="7" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="256" cy="219" r="2" fill="#2F2A24" opacity="0.5"/>
<circle cx="292" cy="219" r="7" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="292" cy="219" r="2" fill="#2F2A24" opacity="0.5"/>
<text x="275" y="180" font-size="4.8" fill="#4A5C55" text-anchor="middle">却走马以粪</text>
<text x="24" y="254" font-size="5.9" fill="#A2503B">二 · 无道：郊外</text>
<line x1="24" y1="318" x2="338" y2="318" stroke="#E6D8C2" stroke-width="0.7"/>
