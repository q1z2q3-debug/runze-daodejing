<line x1="86" y1="251" x2="111" y2="251" stroke="#A2503B" stroke-width="0.5" opacity="0.8"/>
<line x1="86" y1="260" x2="111" y2="260" stroke="#A2503B" stroke-width="0.5" opacity="0.8"/>
<line x1="86" y1="269" x2="111" y2="269" stroke="#A2503B" stroke-width="0.5" opacity="0.8"/>
<line x1="86" y1="278" x2="111" y2="278" stroke="#A2503B" stroke-width="0.5" opacity="0.8"/>
<line x1="86" y1="287" x2="111" y2="287" stroke="#A2503B" stroke-width="0.5" opacity="0.8"/>
<rect x="126" y="242" width="44" height="54" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="126" y1="260" x2="170" y2="260" stroke="#DCCBB0" stroke-width="0.7"/>
<line x1="126" y1="278" x2="170" y2="278" stroke="#DCCBB0" stroke-width="0.7"/>
<rect x="132" y="246" width="14" height="10" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.6"/>
<rect x="150" y="264" width="14" height="10" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.6"/>
<text x="148" y="312" font-size="3.5" fill="#8A7C69" text-anchor="middle">第三格空着</text>
<text x="108" y="320" font-size="4.0" fill="#2F2A24" text-anchor="middle">缺，不是因为东西少</text>
<text x="272" y="186" font-size="5.2" fill="#4A5C55" text-anchor="middle">备</text>
<text x="272" y="198" font-size="3.8" fill="#8A7C69" text-anchor="middle">单子短，柜子齐，脚站住</text>
<rect x="212" y="242" width="44" height="54" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="212" y1="260" x2="256" y2="260" stroke="#DCCBB0" stroke-width="0.7"/>
<line x1="212" y1="278" x2="256" y2="278" stroke="#DCCBB0" stroke-width="0.7"/>
<rect x="218" y="246" width="14" height="10" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.6"/>
<rect x="236" y="246" width="14" height="10" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.6"/>
<rect x="226" y="264" width="14" height="10" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.6"/>
<rect x="266" y="236" width="28" height="30" fill="#FBF2E9" stroke="#4A5C55" stroke-width="0.8"/>
<line x1="270" y1="244" x2="290" y2="244" stroke="#4A5C55" stroke-width="0.5"/>
<line x1="270" y1="252" x2="290" y2="252" stroke="#4A5C55" stroke-width="0.5"/>
<line x1="270" y1="260" x2="290" y2="260" stroke="#4A5C55" stroke-width="0.5"/>
<line x1="196" y1="306" x2="344" y2="306" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="236" cy="302" rx="9" ry="4" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.8"/>
<ellipse cx="256" cy="302" rx="9" ry="4" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.8"/>
<text x="272" y="320" font-size="4.0" fill="#4A5C55" text-anchor="middle">该有的都有了，就叫富</text>
<text x="24" y="354" font-size="5.1" fill="#A2503B">二、知足是减，强行是持：一放一持</text>
<rect x="26" y="366" width="328" height="132" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<line x1="190" y1="376" x2="190" y2="488" stroke="#E6D8C2" stroke-width="0.6"/>
<rect x="74" y="438" width="58" height="34" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="74" y1="438" x2="132" y2="438" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="80" y1="454" x2="126" y2="454" stroke="#B9A98F" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="80" y1="463" x2="126" y2="463" stroke="#B9A98F" stroke-width="0.7" stroke-dasharray="4 3"/>
<g transform="rotate(-26 140 460)"><rect x="138" y="456" width="32" height="9" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.8"/></g>
<text x="104" y="430" font-size="3.6" fill="#8A7C69" text-anchor="middle">匣空了，盖掀在旁</text>
<rect x="142" y="482" width="34" height="7" fill="#FBF2E9" stroke="#A2503B" stroke-width="0.6"/>
<text x="104" y="492" font-size="4.2" fill="#A2503B" text-anchor="middle">放：不再向外要</text>
<path d="M222,450 L278,450 L272,476 L228,476 Z" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="226" y1="450" x2="274" y2="450" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="250" y1="450" x2="250" y2="426" stroke="#4A5C55" stroke-width="1.5654654654654654"/>
<path d="M250,438 q-10,-4 -11,4 M250,432 q10,-5 11,3" fill="none" stroke="#4A5C55" stroke-width="1.4"/>
<path d="M244,410 q2,4 0,7" fill="none" stroke="#8FA9A0" stroke-width="0.9"/>
<path d="M250,402 q2,4 0,7" fill="none" stroke="#8FA9A0" stroke-width="0.9"/>
<path d="M256,410 q2,4 0,7" fill="none" stroke="#8FA9A0" stroke-width="0.9"/>
<text x="250" y="492" font-size="4.2" fill="#4A5C55" text-anchor="middle">持：日日守这一株</text>
<text x="190" y="514" font-size="4.2" fill="#2F2A24" text-anchor="middle">知足，是不再向外要；强行，是不肯向内停——一放一持，缺一句都不是本章。</text>
<line x1="24" y1="528" x2="356" y2="528" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="536" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="552" font-size="5.0" fill="#2F2A24" text-anchor="middle">富不是「多」，是「齐」；减到只剩根本，还要日日守住它。</text>
<text x="190" y="565" font-size="4.6" fill="#4A5C55" text-anchor="middle">知止是给名划界，知足是给欲划界；两个界，一条线。</text>
<line x1="20" y1="582" x2="360" y2="582" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="596" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="612" font-size="8.4" fill="#2F2A24">富不是「多」，是「齐」——缺，往往是因为那张「该有的」单子太长。</text>
<text x="20" y="628" font-size="8.4" fill="#2F2A24">知足是不再向外要，强行是不肯向内停。</text>
</svg>