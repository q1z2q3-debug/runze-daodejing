<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 654" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="缺不是东西少，是那张「该有的」单子太长" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="654" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 三 章 · 其 五（补图）</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一 张 单 子</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">知足者富，强行者有志。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.6" fill="#2F2A24" text-anchor="middle">「富」，《说文》「备也」——该有的都有了，就叫富：富不是多，是齐。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459" text-anchor="middle">「足」，《说文》「人之足也」——脚站住了，就不再往前挪。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、缺：单子太长；备：该有的齐了</text>
<rect x="26" y="164" width="328" height="168" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<line x1="190" y1="174" x2="190" y2="322" stroke="#E6D8C2" stroke-width="0.6"/>
<text x="108" y="186" font-size="5.2" fill="#A2503B" text-anchor="middle">缺</text>
<text x="108" y="198" font-size="3.8" fill="#8A7C69" text-anchor="middle">单子上的名目还在加</text>
<circle cx="58" cy="240" r="5.6" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="58" y1="246" x2="58" y2="270" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="58" y1="270" x2="50" y2="296" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="58" y1="270" x2="66" y2="296" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="58" y1="248" x2="80" y2="240" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="82" y="218" width="34" height="78" fill="#FBF2E9" stroke="#A2503B" stroke-width="0.8"/>
<line x1="86" y1="224" x2="111" y2="224" stroke="#A2503B" stroke-width="0.5" opacity="0.8"/>
<line x1="86" y1="233" x2="111" y2="233" stroke="#A2503B" stroke-width="0.5" opacity="0.8"/>
