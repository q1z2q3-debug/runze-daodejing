<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 948" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="对外做租客，对内做主人——这两句是一句" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="948" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 章 · 玄 德</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一间借住的屋</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">生而不有，为而不恃，长而不宰，是谓玄德。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">无为不是不做，是不主宰：管理是顺势成全，主宰是强行改造。</text>
<text x="190" y="128" font-size="4.9" fill="#6E6459" text-anchor="middle">租客也扫地、也浇花、也修瓦——只是知道屋子不是自己的。</text>
<text x="24" y="156" font-size="5.2" fill="#A2503B">一、对外当主人：拆房改地，挂牌作主</text>
<rect x="26" y="166" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M42,228 L100,192 L158,228 z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="46" y1="228" x2="154" y2="228" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="46" y1="228" x2="46" y2="282" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="46" y1="282" x2="154" y2="282" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="154" y1="228" x2="154" y2="244" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="154" y1="264" x2="154" y2="282" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="154" y1="244" x2="147" y2="248" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="154" y1="264" x2="147" y2="260" stroke="#2F2A24" stroke-width="1.0"/>
<text x="162" y="258" font-size="4.2" fill="#A2503B">拆</text>
<rect x="91" y="254" width="20" height="28" fill="#E4D8BF" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="107" cy="269" r="1.3" fill="#2F2A24"/>
<rect x="58" y="240" width="20" height="15" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="68" y1="240" x2="68" y2="255" stroke="#2F2A24" stroke-width="0.5"/>
<rect x="112" y="235" width="23" height="12" fill="#A2503B" opacity="0.14" stroke="none"/>
<rect x="112" y="235" width="23" height="12" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<text x="123" y="244" font-size="4.0" fill="#A2503B" text-anchor="middle">我</text>
<rect x="126" y="284" width="11" height="5" fill="#E4D8BF" stroke="#2F2A24" stroke-width="0.6" transform="rotate(-12,131,286)"/>
<rect x="141" y="286" width="11" height="5" fill="#E4D8BF" stroke="#2F2A24" stroke-width="0.6" transform="rotate(10,146,288)"/>
<text x="190" y="202" font-size="4.6" fill="#A2503B">主人三件事</text>
<text x="190" y="218" font-size="4.5" fill="#A2503B">挂牌：这屋写上我的名</text>
<text x="190" y="232" font-size="4.5" fill="#A2503B">刷墙：改成我的颜色</text>
<text x="190" y="246" font-size="4.5" fill="#A2503B">攥契：攥到指节发白</text>
<text x="190" y="260" font-size="4.5" fill="#A2503B">拆墙：碍事的这一面，拆</text>
<text x="190" y="282" font-size="4.2" fill="#6E6459">房不是他的，人先被房绑住。</text>
<text x="100" y="334" font-size="4.2" fill="#A2503B" text-anchor="middle">当主人：生而不有——你可以建，它不属于你</text>
<text x="24" y="358" font-size="5.2" fill="#4A5C55">二、对外当租客：扫、养、修，走时不拆房</text>
<rect x="26" y="368" width="328" height="188" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M42,428 L100,392 L158,428 z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="46" y1="428" x2="154" y2="428" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="46" y1="428" x2="46" y2="482" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="46" y1="482" x2="154" y2="482" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="154" y1="428" x2="154" y2="482" stroke="#2F2A24" stroke-width="1.1"/>
<rect x="91" y="454" width="20" height="28" fill="#E4D8BF" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="107" cy="469" r="1.3" fill="#2F2A24"/>
<rect x="58" y="440" width="20" height="15" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="68" y1="440" x2="68" y2="455" stroke="#2F2A24" stroke-width="0.5"/>
<line x1="224" y1="468" x2="234" y2="426" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="234" y1="468" x2="212" y2="480" stroke="#A89577" stroke-width="0.7"/>
<line x1="234" y1="468" x2="220" y2="480" stroke="#A89577" stroke-width="0.7"/>
<line x1="234" y1="468" x2="228" y2="480" stroke="#A89577" stroke-width="0.7"/>
<line x1="234" y1="468" x2="236" y2="480" stroke="#A89577" stroke-width="0.7"/>
<line x1="234" y1="468" x2="244" y2="480" stroke="#A89577" stroke-width="0.7"/>
<line x1="216" y1="472" x2="238" y2="472" stroke="#2F2A24" stroke-width="0.7"/>
<rect x="248" y="456" width="18" height="14" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="248" y1="461" x2="238" y2="453" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M257,456 q7,-8 0,-11" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="236" cy="460" r="1.0" fill="#4A5C55" opacity="0.7"/>
<circle cx="240" cy="465" r="1.0" fill="#4A5C55" opacity="0.7"/>
<path d="M276,476 l16,-4 l3,8 l-16,4 z" fill="#E4D8BF" stroke="#2F2A24" stroke-width="0.8"/>
<text x="284" y="492" font-size="3.8" fill="#6E6459" text-anchor="middle">待修</text>
<text x="195" y="510" font-size="4.5" fill="#4A5C55">三样都做：扫地、浇花、修瓦</text>
<text x="195" y="526" font-size="4.5" fill="#4A5C55">不挂牌、不拆改、不作主</text>
<text x="195" y="540" font-size="4.1" fill="#6E6459">走时，屋还是那间屋——手里的活一样没少</text>
<text x="100" y="550" font-size="4.2" fill="#4A5C55" text-anchor="middle">当租客：生之畜之——能养，却不作它的主</text>
<text x="24" y="578" font-size="5.2" fill="#2F2A24">三、对内当主人：这扇门的钥匙只在你手里</text>
<rect x="26" y="588" width="328" height="158" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="64" y1="622" x2="64" y2="692" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="128" y1="622" x2="128" y2="692" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="64" y1="622" x2="128" y2="622" stroke="#2F2A24" stroke-width="1.1"/>
<rect x="80" y="622" width="30" height="66" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="98" y="650" width="7" height="6" fill="#A2503B" opacity="0.18" stroke="#A2503B" stroke-width="0.8"/>
<circle cx="101" cy="662" r="1.8" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<text x="95" y="614" font-size="4.6" fill="#2F2A24" text-anchor="middle">心</text>
<line x1="64" y1="692" x2="128" y2="692" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="152" cy="650" r="4.2" fill="none" stroke="#A2503B" stroke-width="1.0"/>
<line x1="156" y1="650" x2="172" y2="650" stroke="#A2503B" stroke-width="1.0"/>
<line x1="168" y1="650" x2="168" y2="656" stroke="#A2503B" stroke-width="1.0"/>
<line x1="172" y1="650" x2="172" y2="654" stroke="#A2503B" stroke-width="1.0"/>
<text x="152" y="668" font-size="3.9" fill="#A2503B" text-anchor="middle">唯一一把</text>
<text x="192" y="626" font-size="4.5" fill="#2F2A24">这把锁不在外头，在心里</text>
<text x="192" y="642" font-size="4.5" fill="#2F2A24">开不开，只由自己</text>
<text x="192" y="660" font-size="4.2" fill="#6E6459">推给外境，就是这一处当了租客</text>
<text x="192" y="678" font-size="4.2" fill="#6E6459">今日起没起、守没守——没有第二个人可怪。</text>
<text x="190" y="730" font-size="4.2" fill="#4A5C55" text-anchor="middle">对内全权：不推、不赖、不借外境做自己的主人</text>
<text x="24" y="764" font-size="4.9" fill="#2F2A24">对外当主人，是妄；对内当租客，是逃——同一个病的两头。</text>
<text x="24" y="779" font-size="4.9" fill="#2F2A24">天地借我们暂住：能做的，是住得好一点，走时别拆房。</text>
<text x="24" y="796" font-size="4.8" fill="#4A5C55">做得多，占得少：这不是又一套要修的德，就是那四句本身。</text>
<line x1="24" y1="814" x2="358" y2="814" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="822" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="838" font-size="6.0" fill="#2F2A24" text-anchor="middle">生它、养它、让它长；</text>
<text x="190" y="850" font-size="6.0" fill="#4A5C55" text-anchor="middle">不占有、不恃功、不作主。</text>
<line x1="20" y1="876" x2="360" y2="876" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="890" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="906" font-size="8.4" fill="#2F2A24">生之畜之，生而不有，为而不恃，长而不宰。</text>
<text x="20" y="922" font-size="8.4" fill="#2F2A24">做得多，占得少。</text>
</svg>