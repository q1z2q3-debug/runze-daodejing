<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="到了头，还要留一个口" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="560" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 五 章 · 缺 冲</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">成、盈、冲</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">真正不破的，是那个本来就有破口的。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="115" font-size="6.6" fill="#2F2A24" text-anchor="middle">大成若缺，其用不敝；大盈若冲，其用不穷。</text>
<text x="190" y="127" font-size="5.5" fill="#6E6459" text-anchor="middle">「成」是走到了头，「缺」是器破了口——到了头的东西，要留一个口。</text>
<text x="24" y="154" font-size="6.0" fill="#A2503B">一 · 封死口：受力只能裂</text>
<path d="M56,170 L64,216 L108,216 L116,170" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="56" y1="170" x2="116" y2="170" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="88" y1="176" x2="84" y2="192" stroke="#A2503B" stroke-width="1"/>
<line x1="84" y1="192" x2="90" y2="204" stroke="#A2503B" stroke-width="1"/>
<text x="86" y="230" font-size="5.2" fill="#6E6459" text-anchor="middle">封死：压力全落在自己身上</text>
<text x="150" y="174" font-size="5.9" fill="#2F2A24">封死了口的器，用久了都会破——里面没有余地，</text>
<text x="150" y="188" font-size="5.9" fill="#2F2A24">一受力，只能裂。</text>
<text x="150" y="208" font-size="6.0" fill="#A2503B">「敝」是破旧的衣裳：穿到破，是迟早的事。</text>
<text x="24" y="250" font-size="6.0" fill="#4A5C55">二 · 留一个口：口替它卸力</text>
<path d="M56,266 L64,312 L108,312 L116,266" fill="none" stroke="#4A5C55" stroke-width="1"/>
<line x1="56" y1="266" x2="70" y2="266" stroke="#4A5C55" stroke-width="1.2"/>
<line x1="96" y1="266" x2="116" y2="266" stroke="#4A5C55" stroke-width="1.2"/>
<path d="M80,268 q2,-6 4,-8" fill="none" stroke="#4A5C55" stroke-width="0.5"/>
<path d="M80,268 q-6,-6 -12,-8" fill="none" stroke="#4A5C55" stroke-width="0.5"/>
<path d="M80,268 q6,-6 12,-8" fill="none" stroke="#4A5C55" stroke-width="0.5"/>
<text x="86" y="326" font-size="5.2" fill="#6E6459" text-anchor="middle">缺口不是缺陷，是泄压的地方</text>
<text x="150" y="270" font-size="5.9" fill="#2F2A24">留了口的器，用久了反而不破——</text>
<text x="150" y="284" font-size="5.9" fill="#2F2A24">那个口一直在替它卸力。</text>
<text x="150" y="304" font-size="6.0" fill="#4A5C55">缺口不在补，在于它是气出去的地方。</text>
<text x="24" y="346" font-size="6.0" fill="#2F2A24">三 · 满在里面，空在外面</text>
<path d="M56,374 L64,420 L108,420 L116,374" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="86" cy="374" rx="30" ry="6" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="86" cy="380" rx="23" ry="4.4" fill="#DCE6E0" stroke="#4A5C55" stroke-width="0.6"/>
<line x1="86" y1="364" x2="86" y2="372" stroke="#4A5C55" stroke-width="0.7"/>
<path d="M82,366 l4,6 l4,-6 z" fill="#4A5C55"/>
<text x="96" y="366" font-size="5.0" fill="#4A5C55">续</text>
<text x="86" y="430" font-size="5.2" fill="#6E6459" text-anchor="middle">外面是虚的，里面在续</text>
<text x="150" y="366" font-size="5.9" fill="#2F2A24">「冲」是虚而不满：里面有东西在动，外面永远是虚的。</text>
<text x="150" y="380" font-size="5.9" fill="#2F2A24">所以其用不穷——它一直在往里续，不在往外倒。</text>
<text x="150" y="400" font-size="5.9" fill="#6E6459">满在外面的，一满就到顶；满在里面的，永远还有空。</text>
<line x1="24" y1="440" x2="338" y2="440" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="450" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="466" font-size="6.2" fill="#2F2A24" text-anchor="middle">封死的器，压力全落在自己身上；留口的器，压力从那个口出去了。</text>
<text x="190" y="480" font-size="6.2" fill="#4A5C55" text-anchor="middle">「大成」不是做得更满，是做到头了，还知道留一处不封。</text>
<line x1="20" y1="508" x2="360" y2="508" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="522" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="538" font-size="8.4" fill="#2F2A24">真正不破的，是那个本来就有破口的。</text>
<text x="20" y="554" font-size="8.4" fill="#2F2A24">封死的器，压力全落在自己身上；留口的器，压力从那个口出去了。</text>
</svg>