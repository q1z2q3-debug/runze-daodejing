<path d="M64,200 q26,-7 52,0 q26,7 52,0 q26,-7 52,0 q26,7 52,0" fill="none" stroke="#DCCBB0" stroke-width="0.8"/>
<text x="190" y="292" font-size="4.5" fill="#A2503B" text-anchor="middle">里面空着，一样东西也没有；风照旧从上面过去</text>
<text x="24" y="313" font-size="5.0" fill="#A2503B">一、只有围：篱笆挡得住脚，挡不住空</text>
