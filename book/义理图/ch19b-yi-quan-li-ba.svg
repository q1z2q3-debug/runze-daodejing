<rect x="0" y="0" width="380" height="712" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 九 章 · 文 不 足</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一圈篱笆</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">只讲「不要什么」不够，还得给出「要归向何处」。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">三条「绝」都属于破：破完，台面空了，心里那块地方还空着。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">只以外在禁制为治，不足安顿人心。</text>
