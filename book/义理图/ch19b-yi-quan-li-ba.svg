<text x="190" y="346" font-size="4.5" fill="#6E6459" text-anchor="middle">围还是那一圈</text>
<text x="190" y="486" font-size="4.5" fill="#4A5C55" text-anchor="middle">多了一张席、一双鞋、一只碗：人坐得下，才算安顿</text>
<text x="24" y="507" font-size="5.0" fill="#4A5C55">二、有所属：围里先有一张席，人才坐得下</text>
<text x="24" y="526" font-size="4.9" fill="#2F2A24">「文」是人为设立的条文，篱笆就是它：拦得住脚，拦不住心。</text>
<text x="24" y="542" font-size="4.9" fill="#2F2A24">台面撤空了不给人归处，人迟早拿别的东西填上，往往填得更差。</text>
<text x="24" y="560" font-size="4.9" fill="#4A5C55">「属」是归向：见素抱朴、少私寡欲、绝学无忧——破完要给的，不是新禁令。</text>
<line x1="24" y1="578" x2="338" y2="578" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="586" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="602" font-size="6.0" fill="#2F2A24" text-anchor="middle">文不足以为治，</text>
<text x="190" y="614" font-size="6.0" fill="#4A5C55" text-anchor="middle">令有所属乃安。</text>
<line x1="20" y1="640" x2="360" y2="640" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="654" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="670" font-size="8.4" fill="#2F2A24">文不足以为治，令有所属乃安。</text>
<text x="20" y="686" font-size="8.4" fill="#2F2A24">篱笆挡得住脚，挡不住空。</text>
</svg>