<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 728" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="只有数，没有字：记的是我有多少" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="728" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 八 十 章 · 结</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一根打了结的绳</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">使民复结绳而用之。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">结绳：大事大结，小事小结。它只有数，没有条款。</text>
<text x="190" y="127" font-size="4.5" fill="#6E6459" text-anchor="middle">字一出来，绳子就变成了账：记的不再是「我有多少」，是「你欠我多少」。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、绳上只打结</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M46,246 q20,-10 40,0 q20,10 40,0 q20,-10 40,0 q20,10 40,0 q20,-10 40,0 q20,10 40,0" fill="none" stroke="#2F2A24" stroke-width="1.6"/>
<circle cx="76" cy="246" r="4" fill="#2F2A24"/>
<circle cx="116" cy="246" r="2.6" fill="#2F2A24"/>
<circle cx="156" cy="246" r="5" fill="#2F2A24"/>
<circle cx="196" cy="246" r="2.6" fill="#2F2A24"/>
<circle cx="236" cy="246" r="4" fill="#2F2A24"/>
<circle cx="276" cy="246" r="3" fill="#2F2A24"/>
<text x="190" y="278" font-size="4.4" fill="#A2503B" text-anchor="middle">大事大结，小事小结：只有数</text>
<text x="190" y="330" font-size="4.6" fill="#4A5C55" text-anchor="middle">没有字，就不必争那个字怎么写</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、结完了，挂在墙上</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="396" x2="330" y2="396" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="150" cy="396" r="2.2" fill="#2F2A24"/>
<ellipse cx="150" cy="434" rx="26" ry="20" fill="none" stroke="#2F2A24" stroke-width="1.4"/>
<ellipse cx="150" cy="434" rx="16" ry="12" fill="none" stroke="#2F2A24" stroke-width="1"/>
<line x1="150" y1="396" x2="150" y2="414" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M172,450 q10,10 4,20" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<text x="150" y="482" font-size="4.4" fill="#A2503B" text-anchor="middle">挂着：在，不用</text>
<text x="236" y="434" font-size="4.3" fill="#6E6459">绳在，不响；</text>
<text x="236" y="446" font-size="4.3" fill="#6E6459">数在，不算。</text>
<text x="190" y="534" font-size="4.6" fill="#4A5C55" text-anchor="middle">都在，都不用：这就是这一章全部的功夫</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">绳上只打结，不刻字：它是数，不是条款。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">刻了字，绳子就从「记我有多少」变成「记你欠我多少」。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">甘其食者，不尝人之食。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="5.4" fill="#2F2A24" text-anchor="middle">使民复结绳而用之。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">绳上只打结，不刻字。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">使民复结绳而用之。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">结绳者，大事大结，小事小结；只有数，无字。</text>
</svg>