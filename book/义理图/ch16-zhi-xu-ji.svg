<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="观不是往外看，是看它回到哪里" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="416" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 六 章 · 修 法</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">归根</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">万物并作，吾以观复：动的看一头，复的看另一头。</text>
<rect x="20" y="108" width="108" height="24" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="74" y="125" font-size="9" fill="#2F2A24" text-anchor="middle">万物并作</text>
<rect x="20" y="138" width="108" height="24" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="74" y="155" font-size="9" fill="#2F2A24" text-anchor="middle">芸芸</text>
<line x1="74" y1="132" x2="74" y2="137" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="20" y="168" width="108" height="24" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="74" y="185" font-size="9" fill="#2F2A24" text-anchor="middle">归根</text>
