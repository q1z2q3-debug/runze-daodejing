<rect x="120" y="288" width="40" height="24" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="140" y="304" font-size="8.6" fill="#2F2A24" text-anchor="middle">公</text>
<line x1="112" y1="300" x2="119" y2="300" stroke="#6E6459" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="168" y="288" width="40" height="24" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="188" y="304" font-size="8.6" fill="#2F2A24" text-anchor="middle">全</text>
<line x1="160" y1="300" x2="167" y2="300" stroke="#6E6459" stroke-width="1.2" marker-end="url(#arr)"/>
