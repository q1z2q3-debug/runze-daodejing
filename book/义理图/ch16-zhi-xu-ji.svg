<text x="44" y="304" font-size="8.6" fill="#2F2A24" text-anchor="middle">知常</text>
<rect x="72" y="288" width="40" height="24" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="92" y="304" font-size="8.6" fill="#2F2A24" text-anchor="middle">容</text>
