<rect x="20" y="198" width="108" height="24" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="74" y="215" font-size="9" fill="#2F2A24" text-anchor="middle">静</text>
<line x1="74" y1="192" x2="74" y2="197" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="20" y="242" font-size="8.4" fill="#8A7C69">这条线往下：动到最后，都要回到根。</text>
<rect x="252" y="116" width="108" height="24" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="306" y="133" font-size="9" fill="#2F2A24" text-anchor="middle">复命</text>
<rect x="252" y="146" width="108" height="24" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="306" y="163" font-size="9" fill="#2F2A24" text-anchor="middle">常</text>
<line x1="306" y1="140" x2="306" y2="145" stroke="#4A5C55" stroke-width="1.2" marker-end="url(#arr2)"/>
<rect x="252" y="176" width="108" height="24" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="306" y="193" font-size="9" fill="#2F2A24" text-anchor="middle">明</text>
<line x1="306" y1="170" x2="306" y2="175" stroke="#4A5C55" stroke-width="1.2" marker-end="url(#arr2)"/>
<text x="252" y="220" font-size="8.4" fill="#8A7C69">往上：回到根，才叫常与明。</text>
<line x1="132" y1="210" x2="230" y2="210" stroke="#A2503B" stroke-width="1.2" marker-end="url(#arrS)"/>
<line x1="236" y1="206" x2="236" y2="146" stroke="#A2503B" stroke-width="1.2" marker-end="url(#arrS)"/>
<text x="20" y="258" font-size="9.2" fill="#8A7C69">知常而后：一条顺下来的链</text>
