<text x="236" y="304" font-size="8.6" fill="#2F2A24" text-anchor="middle">天</text>
<line x1="208" y1="300" x2="215" y2="300" stroke="#6E6459" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="264" y="288" width="40" height="24" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="284" y="304" font-size="8.6" fill="#2F2A24" text-anchor="middle">道</text>
<line x1="256" y1="300" x2="263" y2="300" stroke="#6E6459" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="312" y="288" width="40" height="24" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="332" y="304" font-size="8.6" fill="#2F2A24" text-anchor="middle">久</text>
<line x1="304" y1="300" x2="311" y2="300" stroke="#6E6459" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="20" y="332" font-size="8.4" fill="#A2503B">不知常，妄作凶：这一条反过来，是从根部一断到底。</text>
<rect x="20" y="350" width="340" height="42" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="369" font-size="11.5" fill="#2F2A24" text-anchor="middle" letter-spacing="1">致虚极，守静笃。</text>
<text x="190" y="385" font-size="8.4" fill="#6E6459" text-anchor="middle">虚到极、静到笃，才看得见「复」这件事。</text>
</svg>