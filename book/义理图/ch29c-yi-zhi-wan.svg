<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 706" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="碗就那么大，添到溢出来，多余的是那一口" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="706" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 九 章 · 一 只 碗</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只碗</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">去甚，去奢，去泰。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「甚」是过度，「奢」是无度，「泰」通「太」，是骄纵越分——三字一件事的三个浓度。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">碗只有这么大，水只有这么多；「取天下而为之」的那个「为」，就是往里添。</text>
<text x="24" y="152" font-size="5.1" fill="#A2503B">一、满到溢出来：继续添，就溢到桌上</text>
<rect x="26" y="164" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="292" x2="336" y2="292" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M102.0,230 L114.0,276 Q146,285 178.0,276 L190.0,230 Z" fill="#F6EFE0" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="146" cy="230" rx="44.0" ry="6" fill="#E4D3B2" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="146" cy="231" rx="41.0" ry="4.5" fill="#EDE2CB" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M106.86956521739131,234 Q146,239 185.1304347826087,234" fill="none" stroke="#4A5C55" stroke-width="1.1"/>
<path d="M250,198 L288,198 L282,222 Q269,228 256,222 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="261" y="190" width="14" height="8" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M257,190 L279,190 L275,184 L261,184 Z" fill="#E4D3B2" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M270,185 q16,-4 26,8" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="242" y1="220" x2="190" y2="230" stroke="#6E8A6E" stroke-width="1.0"/>
<path d="M102,232 Q96,260 100,284" fill="none" stroke="#4A5C55" stroke-width="1.1"/>
<ellipse cx="100" cy="288" rx="22" ry="5" fill="#E8EDE0" stroke="#4A5C55" stroke-width="0.8"/>
<text x="24" y="338" font-size="5.1" fill="#4A5C55">二、拿走之后：碗还是平平一碗</text>
<rect x="26" y="350" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="478" x2="336" y2="478" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M102.0,416 L114.0,462 Q146,471 178.0,462 L190.0,416 Z" fill="#F6EFE0" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="146" cy="416" rx="44.0" ry="6" fill="#E4D3B2" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="146" cy="417" rx="41.0" ry="4.5" fill="#EDE2CB" stroke="#2F2A24" stroke-width="0.6"/>
<path d="M110.34782608695653,436 Q146,441 181.65217391304347,436" fill="none" stroke="#4A5C55" stroke-width="1.1"/>
<path d="M250,384 L288,384 L282,408 L256,408 Z" fill="none" stroke="#E6D8C2" stroke-width="0.7" stroke-dasharray="3 3" opacity="0.7"/>
<text x="268" y="424" font-size="3.7" fill="#A79A86" text-anchor="middle">壶已撤走</text>
<ellipse cx="104" cy="474" rx="20" ry="5" fill="none" stroke="#E6D8C2" stroke-width="0.7" stroke-dasharray="3 3"/>
<text x="100" y="492" font-size="3.7" fill="#A79A86" text-anchor="middle">擦过的水痕</text>
<text x="24" y="520" font-size="4.8" fill="#2F2A24">碗的容量是它自己的，不由「我要多少」定；水也是水自己的，不由「我添多少」定。</text>
<text x="24" y="536" font-size="4.8" fill="#2F2A24">溢出来的不是水多，是碗少：去，是知道碗只有这么大，拿走多余的那一口。</text>
<text x="24" y="554" font-size="4.8" fill="#4A5C55">三去不是三件工艺，是一个「我要」的三个浓度：过分、没有节制、凌驾一切。</text>
<line x1="24" y1="572" x2="338" y2="572" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="580" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="596" font-size="6.0" fill="#2F2A24" text-anchor="middle">去是拿走，不是添加。</text>
<text x="190" y="608" font-size="5.0" fill="#4A5C55" text-anchor="middle">拿走的是过度的冲动，不是正常的需求。</text>
<line x1="20" y1="634" x2="360" y2="634" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="648" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="664" font-size="8.4" fill="#2F2A24">不是「他没办法才这么做」，是「他这么做，最后一定没办法」。</text>
<text x="20" y="680" font-size="8.4" fill="#2F2A24">三去不是三件工艺，是一个「我要」的三个浓度。</text>
</svg>