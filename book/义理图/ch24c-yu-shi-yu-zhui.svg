<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 728" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="不是长出来的，是多出来的" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="728" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 四 章 · 余 食 赘 行</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">余食与赘</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">其在道也，曰：余食赘行。物或恶之，故有道者不处。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">余食＝吃剩的饭；赘行＝赘瘤（「行」一说通「形」）。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">一个指口腹，一个指身体；两个喻，一个意思：多出来的。</text>
<rect x="26" y="152" width="328" height="158" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="58" y="270" width="266" height="7" fill="#E7DCC4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="78" y1="277" x2="78" y2="292" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="304" y1="277" x2="304" y2="292" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M104,228 L120,268 L168,268 L184,228" fill="#FCF8EF" stroke="#2F2A24" stroke-width="1.1"/>
<ellipse cx="144" cy="228" rx="40" ry="7.5" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M114,260 L174,260" fill="none" stroke="#C9B79A" stroke-width="0.8"/>
<path d="M208,216 L226,268 L280,268 L298,216" fill="#FCF8EF" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M213,220 C222,240 284,240 293,220 L293,226 C284,246 222,246 L213,226 Z" fill="#DAC9A4" stroke="none"/>
<ellipse cx="253" cy="216" rx="45" ry="8" fill="#E3D3AE" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="209" y1="216" x2="297" y2="216" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 2"/>
<text x="253" y="204" font-size="3.6" fill="#A2503B" text-anchor="middle">满到碗口</text>
<text x="144" y="288" font-size="4.0" fill="#4A5C55" text-anchor="middle">吃到底：够了</text>
<text x="253" y="288" font-size="4.0" fill="#A2503B" text-anchor="middle">还满着：没动</text>
<text x="190" y="306" font-size="4.0" fill="#A2503B" text-anchor="middle">左边已经吃到见底，右边又端上一碗：多出来的那一碗，谁也吃不下。</text>
<text x="24" y="323" font-size="5.0" fill="#A2503B">一、余食：已经吃过了，还要再添</text>
<rect x="26" y="336" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M182,348 L222,348 L220,488 L184,488 Z" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="182" y1="348" x2="222" y2="348" stroke="#2F2A24" stroke-width="1.6"/>
<line x1="184" y1="488" x2="220" y2="488" stroke="#2F2A24" stroke-width="1.6"/>
<line x1="186" y1="376" x2="214" y2="376" stroke="#C9B79A" stroke-width="0.7"/>
<line x1="184" y1="414" x2="206" y2="414" stroke="#C9B79A" stroke-width="0.7"/>
<line x1="188" y1="468" x2="216" y2="468" stroke="#C9B79A" stroke-width="0.7"/>
<path d="M182,392 C152,394 140,414 140,426 C140,440 152,458 182,458 Z" fill="#D3C4A4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M182,402 C162,404 152,416 152,426" fill="none" stroke="#B5A583" stroke-width="0.7"/>
<path d="M182,412 C168,414 162,420 162,426" fill="none" stroke="#B5A583" stroke-width="0.7"/>
<line x1="188" y1="408" x2="162" y2="410" stroke="#A2503B" stroke-width="0.9" stroke-dasharray="4 2"/>
<path d="M156,410 L162,407.4 L162,412.6 Z" fill="#A2503B"/>
<line x1="188" y1="442" x2="166" y2="444" stroke="#A2503B" stroke-width="0.9" stroke-dasharray="4 2"/>
<path d="M160,444 L166,441.4 L166,446.6 Z" fill="#A2503B"/>
<text x="146" y="382" font-size="3.6" fill="#A2503B" text-anchor="middle">养分往这块里走</text>
<line x1="152" y1="386" x2="160" y2="402" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="190" y="504" font-size="4.2" fill="#4A5C55" text-anchor="middle">这块瘤从树干里取养分，却不替树干长年轮。</text>
<text x="24" y="525" font-size="5.0" fill="#4A5C55">二、赘：多出来的一块，靠你养着，不替你做事</text>
<text x="24" y="542" font-size="4.9" fill="#2F2A24">「其在道也」——他不说这不合礼，也不说这不合君子之德，他说「在道的眼里」。</text>
<text x="24" y="558" font-size="4.9" fill="#2F2A24">礼看的是合不合分寸，道看的是多不多出来：礼问你对不对，道问这一块本来该不该长。</text>
<text x="24" y="576" font-size="4.9" fill="#4A5C55">「物或恶之」的「或」是「有……的」，不是「或许」：不必人人都厌恶，有一部分排斥，它就立不住。</text>
<line x1="24" y1="594" x2="338" y2="594" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="602" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="618" font-size="5.0" fill="#2F2A24" text-anchor="middle">不处不是割掉，是不长——约束是按住它，不处是根本不在那儿站。</text>
<text x="190" y="630" font-size="4.4" fill="#4A5C55" text-anchor="middle">上一章讲怎么被收住，这一章讲怎么不被收住：出口在自己站的那一处。</text>
<line x1="20" y1="656" x2="360" y2="656" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="670" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="686" font-size="8.4" fill="#2F2A24">礼问「你做得对不对」，道问「这一块本来该不该长」。</text>
<text x="20" y="702" font-size="8.4" fill="#2F2A24">不处不是割掉，是不长——约束是按住它，不处是根本不在那儿站。</text>
</svg>