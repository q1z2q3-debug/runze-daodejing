<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 890" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="致虚极，守静笃：一口缸，三次动手" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="890" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 六 章 · 守 静</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">填、搬、搁下</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">虚是搬到底，不是空掉；静是手搁下，不是把人按住。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">致虚极：虚不是「心里本来是空的」。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">守静笃：静不是「不动」，是止躁、止搅。</text>
<rect x="26" y="146" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M84,168 C81,220.8 93,252 93,264 Q120,272 147,264 C147,252 159,220.8 156,168 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M86.25,176 Q120,181 153.75,176 L146,258 Q120,267 94,258 Z" fill="#E9F0E6" stroke="none" opacity="0.9"/>
<path d="M86.25,176 Q120,181 153.75,176" fill="none" stroke="#4A5C55" stroke-width="0.7"/>
<ellipse cx="120" cy="168" rx="36" ry="5" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M90,174 q-6,10 -9,18 M150,174 q6,10 9,18" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<circle cx="79" cy="196" r="1.5" fill="#4A5C55"/>
<circle cx="161" cy="196" r="1.5" fill="#4A5C55"/>
<path d="M113.6,150.8 L116.8,160.8 Q122,163 127.2,160.8 L130.4,150.8 Z" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M115.8,156.6 q6.2,2.8 12.4,0" fill="none" stroke="#4A5C55" stroke-width="0.7"/>
<line x1="130.4" y1="150.8" x2="155.62768888317592" y2="144.51003071440866" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="121" y1="160" x2="121" y2="176" stroke="#4A5C55" stroke-width="0.9"/>
<text x="200" y="208" font-size="4.8" fill="#A2503B">满了还在加</text>
<text x="200" y="226" font-size="4.6" fill="#6E6459">加不进去，就往外淌</text>
<text x="24" y="314" font-size="5.2" fill="#A2503B">一、填：一瓢一瓢往里加，早就满了，手还在加</text>
<rect x="26" y="330" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M84,352 C81,404.8 93,436 93,448 Q120,456 147,448 C147,436 159,404.8 156,352 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M91.6875,418 Q120,423 148.3125,418 L146,442 Q120,451 94,442 Z" fill="#E9F0E6" stroke="none" opacity="0.9"/>
<path d="M91.6875,418 Q120,423 148.3125,418" fill="none" stroke="#4A5C55" stroke-width="0.7"/>
<ellipse cx="120" cy="352" rx="36" ry="5" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="108" cy="434" r="1.6" fill="#C9B79A"/>
<circle cx="128" cy="438" r="1.6" fill="#C9B79A"/>
<circle cx="102" cy="430" r="1.6" fill="#C9B79A"/>
<path d="M123.6,417.8 L126.8,427.8 Q132,430 137.2,427.8 L140.4,417.8 Z" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M125.8,423.6 q6.2,2.8 12.4,0" fill="none" stroke="#4A5C55" stroke-width="0.7"/>
<line x1="140.4" y1="417.8" x2="162.9166604983954" y2="404.8" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="162" y1="394" x2="194" y2="360" stroke="#4A5C55" stroke-width="1.0" marker-end="url(#arr2)"/>
<text x="200" y="392" font-size="4.8" fill="#4A5C55">一瓢一瓢舀出去</text>
<text x="200" y="410" font-size="4.6" fill="#6E6459">舀到见得着底</text>
<text x="24" y="498" font-size="5.2" fill="#4A5C55">二、搬：把积着的一件件搬出去，搬到无可再搬</text>
<rect x="26" y="514" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M84,536 C81,588.8 93,620 93,632 Q120,640 147,632 C147,620 159,588.8 156,536 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M91.6875,602 Q120,607 148.3125,602 L146,626 Q120,635 94,626 Z" fill="#E9F0E6" stroke="none" opacity="0.9"/>
<path d="M91.6875,602 Q120,607 148.3125,602" fill="none" stroke="#4A5C55" stroke-width="0.7"/>
<ellipse cx="120" cy="536" rx="36" ry="5" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="104" cy="610" r="1.5" fill="#C9B79A"/>
<circle cx="116" cy="616" r="1.5" fill="#C9B79A"/>
<circle cx="130" cy="610" r="1.5" fill="#C9B79A"/>
<circle cx="140" cy="616" r="1.5" fill="#C9B79A"/>
<path d="M149.6,537.8 L152.8,547.8 Q158,550 163.2,547.8 L166.4,537.8 Z" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M151.8,543.6 q6.2,2.8 12.4,0" fill="none" stroke="#4A5C55" stroke-width="0.7"/>
<line x1="166.4" y1="537.8" x2="191.62768888317592" y2="544.0899692855913" stroke="#2F2A24" stroke-width="1.3"/>
<text x="200" y="576" font-size="4.8" fill="#4A5C55">瓢搁在缸沿</text>
<text x="200" y="594" font-size="4.6" fill="#6E6459">手不回去了</text>
<text x="200" y="612" font-size="4.6" fill="#6E6459">水自己平，沙自己沉</text>
<text x="24" y="682" font-size="5.2" fill="#2F2A24">三、搁下：手停下来，这份不搅守得住，才叫笃</text>
<text x="24" y="704" font-size="4.9" fill="#2F2A24">致虚极：不是心里本来是空的，是把积着的搬出去，一直搬到无可再搬。</text>
<text x="24" y="720" font-size="4.9" fill="#2F2A24">守静笃：搬完的手不回去；这份不动守得深厚，才叫笃。</text>
<text x="24" y="738" font-size="4.9" fill="#4A5C55">极管深度，笃管厚度：一个虚到底，一个静到底。</text>
<line x1="24" y1="756" x2="338" y2="756" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="764" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="780" font-size="6.0" fill="#2F2A24" text-anchor="middle">致虚极，守静笃。</text>
<text x="190" y="792" font-size="6.0" fill="#4A5C55" text-anchor="middle">虚到无可虚；静到无可动。</text>
<line x1="20" y1="818" x2="360" y2="818" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="832" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="848" font-size="8.4" fill="#2F2A24">致虚极，守静笃。</text>
<text x="20" y="864" font-size="8.4" fill="#2F2A24">致虚者，虚到无可虚；守静者，静到无可动。</text>
</svg>