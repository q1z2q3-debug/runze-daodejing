<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="把「看得见才算有」降回局部工具" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="356" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 四 章 · 道 体</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">三样工具探不到</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">探不到不等于没有；探得到也不等于全部。</text>
<text x="20" y="123" font-size="9.5" fill="#A2503B">视之不见</text>
<text x="102" y="123" font-size="10" fill="#4A5C55">夷</text>
<line x1="122" y1="119" x2="200" y2="119" stroke="#DCCBB0" stroke-width="1"/>
<text x="206" y="123" font-size="8.2" fill="#6E6459">眼睛这条线，走到这里就断了</text>
<text x="20" y="157" font-size="9.5" fill="#A2503B">听之不闻</text>
<text x="102" y="157" font-size="10" fill="#4A5C55">希</text>
<line x1="122" y1="153" x2="200" y2="153" stroke="#DCCBB0" stroke-width="1"/>
<text x="206" y="157" font-size="8.2" fill="#6E6459">耳朵这条线，走到这里就断了</text>
<text x="20" y="191" font-size="9.5" fill="#A2503B">搏之不得</text>
<text x="102" y="191" font-size="10" fill="#4A5C55">微</text>
<line x1="122" y1="187" x2="200" y2="187" stroke="#DCCBB0" stroke-width="1"/>
<text x="206" y="191" font-size="8.2" fill="#6E6459">手这条线，走到这里就断了</text>
<line x1="190" y1="220" x2="190" y2="230" stroke="#A2503B" stroke-width="1.2" marker-end="url(#arrS)"/>
<rect x="60" y="222" width="260" height="40" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="239" font-size="9.8" fill="#2F2A24" text-anchor="middle">此三者不可致诘，故混而为一</text>
<text x="190" y="255" font-size="8.4" fill="#6E6459" text-anchor="middle">三条线都断，断处却指着同一个东西。</text>
<text x="20" y="280" font-size="8.6" fill="#8A7C69">惚恍：其上不皦，其下不昧；迎之不见其首，随之不见其后。</text>
<rect x="20" y="292" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="311" font-size="10.5" fill="#2F2A24" text-anchor="middle" letter-spacing="1">执古之道，以御今之有。</text>
<text x="190" y="327" font-size="8.4" fill="#6E6459" text-anchor="middle">能知古始，是谓道纪：不是复古，是拿源流来看眼前。</text>
</svg>