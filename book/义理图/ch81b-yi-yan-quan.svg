<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 728" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="它不装，只是涌；越涌，周围越湿" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="728" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 八 十 一 章 · 泉</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一眼泉</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">既以与人，己愈多。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">泉没有四壁，没有门，没有锁：它不装，只是涌。</text>
<text x="190" y="127" font-size="4.5" fill="#6E6459" text-anchor="middle">泉是流量：越取越多；周围越湿，它越涌。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、无壁无锁：只是个眼</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="282" x2="330" y2="282" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="190" cy="282" rx="52" ry="10" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="190" cy="282" rx="34" ry="6" fill="#4A5C55" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M190,278 q-12,-22 0,-34 q12,12 0,34" fill="none" stroke="#4A5C55" stroke-width="1.2"/>
<path d="M176,278 q-8,-10 -2,-18" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<path d="M204,278 q8,-10 2,-18" fill="none" stroke="#4A5C55" stroke-width="0.8"/>
<ellipse cx="190" cy="283" rx="96" ry="16" fill="none" stroke="#DED2B8" stroke-width="1"/>
<ellipse cx="190" cy="284" rx="120" ry="20" fill="none" stroke="#DCCBB0" stroke-width="0.9"/>
<text x="190" y="308" font-size="4.5" fill="#A2503B" text-anchor="middle">不装，只是涌</text>
<text x="190" y="330" font-size="4.6" fill="#4A5C55" text-anchor="middle">流量：没有底，也没有顶</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、取走一瓢，还在涌</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="486" x2="330" y2="486" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="150" cy="486" rx="52" ry="10" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<ellipse cx="150" cy="486" rx="34" ry="6" fill="#4A5C55" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M150,482 q-12,-24 0,-36 q12,12 0,36" fill="none" stroke="#4A5C55" stroke-width="1.4"/>
<ellipse cx="150" cy="487" rx="96" ry="16" fill="none" stroke="#DED2B8" stroke-width="1"/>
<path d="M212,474 q14,16 28,2" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M216,476 q10,9 20,1" fill="#4A5C55" stroke="none" opacity="0.85"/>
<line x1="238" y1="474" x2="252" y2="458" stroke="#2F2A24" stroke-width="1.4"/>
<circle cx="253" cy="457" r="3" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M196,478 q10,-6 18,-2" fill="none" stroke="#4A5C55" stroke-width="0.9"/>
<text x="252" y="506" font-size="4.2" fill="#A2503B" text-anchor="middle">舀走一瓢</text>
<text x="150" y="512" font-size="4.5" fill="#A2503B" text-anchor="middle">取走，仍在涌</text>
<text x="190" y="534" font-size="4.6" fill="#4A5C55" text-anchor="middle">既以与人，己愈多</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">泉是流量：不装，只涌；越取越多。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">舀走一瓢，泉不记得，周围的地记得——它更湿了。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">既以与人，己愈多：给人，是让泉眼更旺。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="5.2" fill="#2F2A24" text-anchor="middle">既以与人，己愈多。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">越取越多：泉不会空。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">既以与人，己愈多。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">与人者，予之也；愈多者，泉不因取竭。</text>
</svg>