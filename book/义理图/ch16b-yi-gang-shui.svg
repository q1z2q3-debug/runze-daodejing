<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="归根曰静：水一动就浑，一静就清" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="740" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 六 章 · 守 静</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一缸浊水</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">致虚极，守静笃；万物并作，吾以观复。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">虚不是空掉，是把搅动的那只手先放下。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">静不是不动，是不再自己去搅。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、搅：手一搅，沙全浮起来，水就浑了</text>
<rect x="26" y="164" width="328" height="172" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M92,210 L104.8,284 q27.200000000000003,6 54.400000000000006,0 L172,210 z" fill="#D9D3C6" stroke="#2F2A24" stroke-width="1.2"/>
<ellipse cx="132" cy="210" rx="40" ry="5" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="132" cy="210" rx="37" ry="3.6" fill="#D9D3C6" stroke="none"/>
<circle cx="108.0" cy="222" r="1.5" fill="#B7ADA0"/>
<circle cx="137.0" cy="237" r="1.5" fill="#B7ADA0"/>
<circle cx="118.0" cy="252" r="1.5" fill="#B7ADA0"/>
<circle cx="147.0" cy="267" r="1.5" fill="#B7ADA0"/>
<circle cx="128.0" cy="228" r="1.5" fill="#B7ADA0"/>
<circle cx="109.0" cy="243" r="1.5" fill="#B7ADA0"/>
<circle cx="138.0" cy="258" r="1.5" fill="#B7ADA0"/>
<circle cx="119.0" cy="273" r="1.5" fill="#B7ADA0"/>
<circle cx="148.0" cy="234" r="1.5" fill="#B7ADA0"/>
<circle cx="129.0" cy="249" r="1.5" fill="#B7ADA0"/>
<circle cx="110.0" cy="264" r="1.5" fill="#B7ADA0"/>
<circle cx="139.0" cy="225" r="1.5" fill="#B7ADA0"/>
<circle cx="120.0" cy="240" r="1.5" fill="#B7ADA0"/>
<circle cx="149.0" cy="255" r="1.5" fill="#B7ADA0"/>
<line x1="132" y1="184" x2="140" y2="238" stroke="#2F2A24" stroke-width="1.4"/>
<path d="M98,222 q34,26 68,0" fill="none" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3"/>
<path d="M166,230 q-34,26 -68,0" fill="none" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="132" y="316" font-size="4.2" fill="#A2503B" text-anchor="middle">搅动：沙起，水浊，看不见底</text>
<text x="266" y="254" font-size="4.5" fill="#A2503B" text-anchor="middle">不知常，妄作凶</text>
<text x="266" y="272" font-size="4.1" fill="#6E6459" text-anchor="middle">越搅越浑，越急越看不见</text>
<text x="24" y="354" font-size="5.2" fill="#4A5C55">二、静：手放下，沙自己沉，水自己清</text>
<rect x="26" y="366" width="328" height="168" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M92,406 L104.8,480 q27.200000000000003,6 54.400000000000006,0 L172,406 z" fill="#DCEAE2" stroke="#2F2A24" stroke-width="1.2"/>
<ellipse cx="132" cy="406" rx="40" ry="5" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="132" cy="406" rx="37" ry="3.6" fill="#DCEAE2" stroke="none"/>
<circle cx="110.0" cy="470" r="1.5" fill="#A8A091"/>
<circle cx="137.0" cy="467" r="1.5" fill="#A8A091"/>
<circle cx="116.0" cy="470" r="1.5" fill="#A8A091"/>
<circle cx="143.0" cy="467" r="1.5" fill="#A8A091"/>
<circle cx="122.0" cy="470" r="1.5" fill="#A8A091"/>
<circle cx="149.0" cy="467" r="1.5" fill="#A8A091"/>
<circle cx="128.0" cy="470" r="1.5" fill="#A8A091"/>
<circle cx="155.0" cy="467" r="1.5" fill="#A8A091"/>
<circle cx="134.0" cy="470" r="1.5" fill="#A8A091"/>
<path d="M106,472 q26,8 52,0" fill="none" stroke="#A8A091" stroke-width="1.2"/>
<text x="186" y="474" font-size="4.0" fill="#4A5C55">沙沉到底：根在这里</text>
<line x1="88" y1="432" x2="176" y2="432" stroke="#4A5C55" stroke-width="0.7" stroke-dasharray="3 2"/>
<text x="186" y="434" font-size="4.0" fill="#4A5C55">水自清：上面那层不用管</text>
<text x="132" y="516" font-size="4.2" fill="#4A5C55" text-anchor="middle">静曰复命：浑是暂时的，清是本来的</text>
<text x="24" y="554" font-size="5.0" fill="#2F2A24">万物并作，吾以观复：不去推动，只看着它自己回去。</text>
<text x="24" y="570" font-size="5.0" fill="#2F2A24">归根曰静——静不是把人按住，是把那只搅动的手放下。</text>
<text x="24" y="588" font-size="4.9" fill="#4A5C55">知常曰明：知道它会自己清，就不必急着去搅。</text>
<line x1="24" y1="606" x2="338" y2="606" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="614" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="630" font-size="6.0" fill="#2F2A24" text-anchor="middle">归根曰静，静曰复命；</text>
<text x="190" y="642" font-size="6.0" fill="#4A5C55" text-anchor="middle">知常曰明，不知常妄作凶。</text>
<line x1="20" y1="668" x2="360" y2="668" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="682" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="698" font-size="8.4" fill="#2F2A24">致虚极，守静笃；万物并作，吾以观复。</text>
<text x="20" y="714" font-size="8.4" fill="#2F2A24">静不是把人按住，是把那只搅动的手放下。</text>
</svg>