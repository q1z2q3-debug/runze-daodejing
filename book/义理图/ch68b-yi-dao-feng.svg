<line x1="320" y1="450" x2="264" y2="442" stroke="#2F2A24" stroke-width="1.2"/>
<ellipse cx="256" cy="441" rx="8" ry="5" fill="none" stroke="#2F2A24" stroke-width="0.9" stroke-dasharray="2 2"/>
<text x="190" y="480" font-size="4.6" fill="#A2503B" text-anchor="middle">缝</text>
<text x="96" y="396" font-size="4.5" fill="#6E6459" text-anchor="middle">我们</text>
<text x="284" y="396" font-size="4.5" fill="#6E6459" text-anchor="middle">他们</text>
<text x="190" y="512" font-size="4.6" fill="#4A5C55" text-anchor="middle">手停在半路，缝里没有东西：谁也拽不进谁</text>
<text x="24" y="530" font-size="4.8" fill="#2F2A24">争要成对，与也要成对：两个动作的前提，是有一个对手。</text>
<text x="24" y="546" font-size="4.8" fill="#2F2A24">不给对手，就没有争；没有争，才谈得上胜。</text>
<text x="24" y="564" font-size="5.0" fill="#4A5C55">不跟敌人配对，却跟天配上了：是谓配天。</text>
<line x1="24" y1="580" x2="338" y2="580" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="588" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="603" font-size="5.2" fill="#2F2A24" text-anchor="middle">与者党与，四手抬一物；</text>
<text x="190" y="616" font-size="4.9" fill="#4A5C55" text-anchor="middle">缝留着，两边才还是两边。</text>
<line x1="20" y1="642" x2="360" y2="642" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="656" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="672" font-size="8.4" fill="#2F2A24">与者党与，四手抬一物；争者两手引一物，皆须有对。</text>
<text x="20" y="688" font-size="8.4" fill="#2F2A24">不与：不给对手，就没有争；不跟敌人配对，却跟天配上了。</text>
</svg>