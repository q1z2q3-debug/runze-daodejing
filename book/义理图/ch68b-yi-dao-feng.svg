<line x1="241" y1="207" x2="235" y2="206" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="240" y1="210" x2="234" y2="209" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="56" y1="256" x2="138" y2="246" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M138,246 q6,-6 14,0 q4,4 0,8 q-8,5 -14,0 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="138" y1="242" x2="144" y2="241" stroke="#2F2A24" stroke-width="0.8"/>
