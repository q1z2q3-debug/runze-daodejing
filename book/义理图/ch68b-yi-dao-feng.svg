<path d="M242,246 q-6,-6 -14,0 q-4,4 0,8 q8,5 14,0 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="242" y1="242" x2="236" y2="241" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="241" y1="245" x2="235" y2="244" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="240" y1="248" x2="234" y2="247" stroke="#2F2A24" stroke-width="0.8"/>
<text x="96" y="200" font-size="4.5" fill="#6E6459" text-anchor="middle">我们</text>
<text x="284" y="200" font-size="4.5" fill="#6E6459" text-anchor="middle">他们</text>
<text x="190" y="316" font-size="4.6" fill="#A2503B" text-anchor="middle">四手抬一物：两边成了一对，中间没有缝</text>
<text x="24" y="344" font-size="4.8" fill="#4A5C55">二、手收回来：缝留着，两边才还是两边</text>
<rect x="26" y="356" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="178" y="382" width="24" height="86" fill="#F2EADA" stroke="none"/>
<line x1="178" y1="382" x2="178" y2="468" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="202" y1="382" x2="202" y2="468" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="60" y1="412" x2="116" y2="404" stroke="#2F2A24" stroke-width="1.2"/>
<ellipse cx="124" cy="403" rx="8" ry="5" fill="none" stroke="#2F2A24" stroke-width="0.9" stroke-dasharray="2 2"/>
