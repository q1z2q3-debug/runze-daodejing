<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 706" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="与是党与：四手抬一物就成一对；不与，是留住那条缝" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="706" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 八 章 · 与</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一道缝</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">善胜敌者，不与。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「与」，《说文》「党与也」；争是两手引一物——两个动作都要有一个对手。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">不给对手，就没有争：不与不是避战，是不成对。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、四手抬一物：成了对，就只剩输赢</text>
<rect x="26" y="160" width="328" height="164" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="160" y="212" width="60" height="42" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<text x="190" y="238" font-size="4.8" fill="#2F2A24" text-anchor="middle">一物</text>
<line x1="56" y1="218" x2="138" y2="208" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M138,208 q6,-6 14,0 q4,4 0,8 q-8,5 -14,0 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
