<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 644" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="慧智出，有大伪：壳一圈圈加厚，里面还是那块原样" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="644" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 八 章 · 大 伪</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">壳</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">「伪」不是欺骗，是人为：成套而精巧的饰作。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">慧智向外分别、算计、修饰；明向内照见。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">一个越用越细，一个越用越静——两条路相反。</text>
<rect x="26" y="150" width="328" height="112" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="76" y="190" width="84" height="52" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="82" y1="200" x2="154" y2="200" stroke="#E6D8C2" stroke-width="0.6"/>
<line x1="82" y1="210" x2="154" y2="210" stroke="#E6D8C2" stroke-width="0.6"/>
<line x1="82" y1="220" x2="154" y2="220" stroke="#E6D8C2" stroke-width="0.6"/>
<text x="176" y="202" font-size="4.7" fill="#4A5C55">木纹在外，里头也是它</text>
<text x="176" y="216" font-size="4.6" fill="#6E6459">智未出时，不必包一层</text>
<text x="24" y="275" font-size="5.0" fill="#4A5C55">一、无壳：慧智未出，一件东西就是它自己</text>
<rect x="26" y="288" width="328" height="138" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="89.0" y="366" width="58" height="36" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="94.0" y1="375" x2="142.0" y2="375" stroke="#E6D8C2" stroke-width="0.6"/>
<line x1="94.0" y1="384" x2="142.0" y2="384" stroke="#E6D8C2" stroke-width="0.6"/>
<rect x="76.0" y="350" width="84" height="52" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="63.0" y="334" width="110" height="68" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="50" y="318" width="136" height="84" fill="none" stroke="#DCCBB0" stroke-width="1.0" stroke-dasharray="6 4"/>
<text x="118" y="304" font-size="4.5" fill="#8A7C69" text-anchor="middle">还在往上包</text>
<rect x="180" y="308" width="40" height="16" fill="#F2EADA" stroke="#A2503B" stroke-width="0.9"/>
<text x="200" y="320" font-size="4.7" fill="#A2503B" text-anchor="middle">道义</text>
<text x="180" y="298" font-size="4.5" fill="#8A7C69">最外一层贴一枚签：说得最像</text>
<text x="204" y="398" font-size="4.5" fill="#6E6459">里面还是那一只匣</text>
<text x="24" y="439" font-size="5.0" fill="#A2503B">二、有壳：一圈圈包上去，里面那块原样越来越看不见</text>
<text x="24" y="458" font-size="4.9" fill="#2F2A24">壳不是坏东西：壳是「人为」——成套、精巧、合乎道义的饰作。</text>
<text x="24" y="474" font-size="4.9" fill="#2F2A24">用它博名、避罚、包私，大伪就成型；壳越厚，里面越难对上外面。</text>
<text x="24" y="492" font-size="4.9" fill="#4A5C55">慧智与明，路径相反：一个向外分，一个向内照，不可混同。</text>
<line x1="24" y1="510" x2="338" y2="510" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="518" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="534" font-size="6.0" fill="#2F2A24" text-anchor="middle">慧智息，则大伪不生。</text>
<text x="190" y="546" font-size="5.2" fill="#4A5C55" text-anchor="middle">壳越像，越难看见里面那块原样。</text>
<line x1="20" y1="572" x2="360" y2="572" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="586" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="602" font-size="8.4" fill="#2F2A24">慧智息，则大伪不生。</text>
<text x="20" y="618" font-size="8.4" fill="#2F2A24">壳越像，越难看见里面那块原样。</text>
</svg>