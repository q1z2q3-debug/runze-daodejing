<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 726" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="受垢者三步：接之、沉之、复清之" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="726" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 八 章 · 垢</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一捧土</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">受国之垢，是谓社稷主。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">垢，《说文》「浊也」，从土——垢即土也。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">水土相遇则浑，静则土沉，土沉则水清。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、接住：一捧土落进水里</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="296" x2="330" y2="296" stroke="#2F2A24" stroke-width="1"/>
<path d="M148,218 Q148,284 190,288 Q232,284 232,218" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="148" y1="218" x2="232" y2="218" stroke="#2F2A24" stroke-width="1.3"/>
<path d="M150,220 L230,220 L228,262 Q190,272 152,262 Z" fill="#4A5C55" fill-opacity="0.3" stroke="#4A5C55" stroke-width="0.7"/>
<path d="M150,180 Q190,200 230,180" fill="#DED2B8" stroke="#2F2A24" stroke-width="1"/>
<circle cx="162" cy="208" r="1.6" fill="#B9A98F"/>
<circle cx="168" cy="218" r="1.4" fill="#B9A98F"/>
<circle cx="182" cy="214" r="1.6" fill="#B9A98F"/>
<circle cx="186" cy="223" r="1.4" fill="#B9A98F"/>
<circle cx="202" cy="208" r="1.6" fill="#B9A98F"/>
<circle cx="204" cy="218" r="1.4" fill="#B9A98F"/>
<circle cx="222" cy="214" r="1.6" fill="#B9A98F"/>
<circle cx="222" cy="223" r="1.4" fill="#B9A98F"/>
<text x="196" y="172" font-size="4.5" fill="#A2503B" text-anchor="middle">土落下来</text>
<text x="190" y="330" font-size="4.6" fill="#4A5C55" text-anchor="middle">接住：土落进来，水不拒——拒的，就不是受</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、沉之，复清之</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="500" x2="330" y2="500" stroke="#2F2A24" stroke-width="1"/>
<path d="M148,422 Q148,488 190,492 Q232,488 232,422" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="148" y1="422" x2="232" y2="422" stroke="#2F2A24" stroke-width="1.3"/>
<path d="M150,424 L230,424 L228,470 Q190,478 152,470 Z" fill="#4A5C55" fill-opacity="0.16" stroke="#4A5C55" stroke-width="0.7"/>
<path d="M152,470 Q190,478 228,470 Q228,484 190,488 Q152,484 152,470 Z" fill="#DED2B8" stroke="#2F2A24" stroke-width="0.8"/>
<text x="252" y="440" font-size="4.5" fill="#4A5C55">上：清</text>
<text x="252" y="482" font-size="4.5" fill="#A2503B">下：土沉了</text>
<line x1="240" y1="476" x2="248" y2="480" stroke="#B9A98F" stroke-width="0.7"/>
<text x="190" y="534" font-size="4.6" fill="#4A5C55" text-anchor="middle">土沉了，水自己就清了：不是吞土，是放土</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">故受垢者三步：接之、沉之、复清之。非吞土也，乃放土也。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">能受者，非力大也，其体不倒也——水不清，是因为它一直在晃。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">垢从土，社亦从土：一污一神，一土之两面。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="5.2" fill="#2F2A24" text-anchor="middle">受国之垢，是谓社稷主。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">垢者，浊也，从土：垢即土也。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">受国之垢，是谓社稷主。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">垢者，《说文》曰「浊也」，从土——垢即土也。</text>
</svg>