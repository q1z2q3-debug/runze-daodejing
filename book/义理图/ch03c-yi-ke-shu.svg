<line x1="204" y1="500" x2="213" y2="500" stroke="#B9A98F" stroke-width="0.5"/>
<line x1="169" y1="511" x2="178" y2="511" stroke="#B9A98F" stroke-width="0.5"/>
<line x1="204" y1="511" x2="213" y2="511" stroke="#B9A98F" stroke-width="0.5"/>
<line x1="169" y1="522" x2="178" y2="522" stroke="#B9A98F" stroke-width="0.5"/>
<line x1="204" y1="522" x2="213" y2="522" stroke="#B9A98F" stroke-width="0.5"/>
<text x="191" y="492" font-size="4.6" fill="#4A5C55" text-anchor="middle">空</text>
<line x1="214" y1="454" x2="260" y2="442" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="260" y1="442" x2="268" y2="436" stroke="#4A5C55" stroke-width="0.6"/>
<line x1="168" y1="454" x2="122" y2="442" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="122" y1="442" x2="114" y2="436" stroke="#4A5C55" stroke-width="0.6"/>
<line x1="214" y1="476" x2="248" y2="468" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="248" y1="468" x2="256" y2="462" stroke="#4A5C55" stroke-width="0.6"/>
<line x1="168" y1="476" x2="134" y2="468" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="134" y1="468" x2="126" y2="462" stroke="#4A5C55" stroke-width="0.6"/>
<text x="30" y="468" font-size="4.5" fill="#2F2A24">实其腹＝壁厚</text>
<line x1="100" y1="470" x2="166" y2="470" stroke="#E6D8C2" stroke-width="0.6" stroke-dasharray="3 2"/>
<text x="30" y="572" font-size="4.5" fill="#2F2A24">强其骨＝根深</text>
<line x1="100" y1="570" x2="144" y2="564" stroke="#E6D8C2" stroke-width="0.6" stroke-dasharray="3 2"/>
<text x="350" y="436" font-size="4.5" fill="#2F2A24" text-anchor="end">弱其志＝枝低</text>
<line x1="348" y1="438" x2="266" y2="436" stroke="#E6D8C2" stroke-width="0.6" stroke-dasharray="3 2"/>
<text x="190" y="624" font-size="4.5" fill="#4A5C55" text-anchor="middle">壁厚；虚线处是干心，留着空</text>
<text x="190" y="640" font-size="4.5" fill="#8A7C69" text-anchor="middle">实腹＝壁厚，虚心＝干心留空，强骨＝根深，弱志＝枝低</text>
<text x="24" y="668" font-size="5.2" fill="#2F2A24">「实其腹」不是吃饱，是把壁留厚；「虚其心」不是清空念头，是把干心留成中空。</text>
<text x="24" y="684" font-size="5.2" fill="#2F2A24">壁一厚，空就能用起来；若反把壁掏薄、把空填实，看着结实，一敲就碎。</text>
<text x="24" y="702" font-size="5.2" fill="#4A5C55">这是第十一章「有之以为利，无之以为用」在治身上的落地。</text>
<line x1="24" y1="720" x2="338" y2="720" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="728" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="744" font-size="6.0" fill="#2F2A24" text-anchor="middle">虚心不是空掉念头，</text>
<text x="190" y="756" font-size="6.0" fill="#4A5C55" text-anchor="middle">是把壁留厚、把空留住。</text>
<line x1="20" y1="782" x2="360" y2="782" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="796" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="812" font-size="8.4" fill="#2F2A24">虚其心，实其腹；弱其志，强其骨。</text>
<text x="20" y="828" font-size="8.4" fill="#2F2A24">虚者，器中之空也；实者，壁之厚也——空在，壁才用得起来。</text>
</svg>