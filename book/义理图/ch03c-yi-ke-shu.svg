<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 854" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="虚其心是干里留空，实其腹是干壁加厚；一根往上争高的树，风一来就折" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="854" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 章 · 树</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一棵树</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">虚其心，实其腹；弱其志，强其骨。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.0" fill="#2F2A24" text-anchor="middle">四句不是四个动作，是一棵树的上下两头：上头不争高，下头扎得住，中间壁厚而心空。</text>
<text x="190" y="128" font-size="5.0" fill="#6E6459" text-anchor="middle">「虚」不是把念头掏空，是把干心留成中空；空在，壁才用得起来。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、争高：枝往上抢，风一来断一根</text>
<rect x="26" y="164" width="328" height="180" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="304" x2="330" y2="304" stroke="#2F2A24" stroke-width="1"/>
<line x1="196" y1="304" x2="196" y2="208" stroke="#2F2A24" stroke-width="1.7"/>
<line x1="196" y1="280" x2="144" y2="246" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="196" y1="260" x2="240" y2="224" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="196" y1="242" x2="156" y2="212" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="196" y1="282" x2="240" y2="248" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="240" y1="248" x2="250" y2="242" stroke="#2F2A24" stroke-width="0.9" stroke-dasharray="3 2"/>
<line x1="226" y1="260" x2="234" y2="250" stroke="#A2503B" stroke-width="1.0"/>
<line x1="238" y1="240" x2="246" y2="248" stroke="#A2503B" stroke-width="1.0"/>
<line x1="262" y1="301" x2="328" y2="290" stroke="#A2503B" stroke-width="1.1"/>
<line x1="300" y1="295" x2="312" y2="282" stroke="#A2503B" stroke-width="0.6"/>
<text x="266" y="228" font-size="4.5" fill="#A2503B">折了</text>
<path d="M48,200 q30,-8 58,0" fill="none" stroke="#B9A98F" stroke-width="0.6"/>
<path d="M48,209 q30,-8 58,0" fill="none" stroke="#B9A98F" stroke-width="0.6"/>
<path d="M48,218 q30,-8 58,0" fill="none" stroke="#B9A98F" stroke-width="0.6"/>
<text x="52" y="190" font-size="4.5" fill="#8A7C69">风</text>
<text x="190" y="360" font-size="4.5" fill="#4A5C55" text-anchor="middle">志者，往上去的那股劲：劲全使在争高上，根就浅了</text>
<text x="190" y="376" font-size="4.5" fill="#8A7C69" text-anchor="middle">争高的树：枝细而尖，断口留在干上，断枝落在地上</text>
<text x="24" y="404" font-size="5.2" fill="#A2503B">二、实腹虚心：干厚、心空、根深、枝低</text>
<rect x="26" y="416" width="328" height="196" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="532" x2="330" y2="532" stroke="#2F2A24" stroke-width="1"/>
<path d="M172,532 q-12.0,20 -24,40" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M180,532 q-6.0,20 -12,50" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
