<rect x="179" y="452" width="24" height="80" fill="#F8F3E6" stroke="#4A5C55" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="169" y1="456" x2="178" y2="456" stroke="#B9A98F" stroke-width="0.5"/>
<line x1="204" y1="456" x2="213" y2="456" stroke="#B9A98F" stroke-width="0.5"/>
