<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 662" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="六亲不和，有孝慈；国家昏乱，有忠臣：药能已病，药不是身子" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="662" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 八 章 · 药</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一帖药</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">孝慈者，亲之药也；忠臣者，国之药也。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">夸一帖药好，先得承认有了病。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">药能已病，药不是身子。</text>
<rect x="26" y="150" width="328" height="118" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="62" y1="242" x2="154" y2="242" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="62" y1="242" x2="62" y2="260" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="154" y1="242" x2="154" y2="260" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M79.0,180 C74.0,202 82.0,230 85.0,242 Q108,247 131.0,242 C134.0,230 142.0,202 137.0,180 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<ellipse cx="108" cy="180" rx="29.0" ry="5" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M80.0,180 q28.0,7 56,0" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<rect x="99" y="171" width="18" height="12" fill="#F2EADA" stroke="#A2503B" stroke-width="0.8"/>
<text x="108" y="180" font-size="4.5" fill="#A2503B" text-anchor="middle">封</text>
<text x="170" y="198" font-size="4.6" fill="#4A5C55">没病：药封在罐里，不煎</text>
<text x="170" y="212" font-size="4.5" fill="#6E6459">家里不必天天讲孝</text>
<text x="170" y="226" font-size="4.5" fill="#6E6459">国里没有忠臣可称</text>
<text x="24" y="281" font-size="5.0" fill="#4A5C55">一、本和：药在罐里，谁也不必被称赞</text>
<rect x="26" y="294" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M76,396 L85,426 L131,426 L140,396 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="76" y1="396" x2="140" y2="396" stroke="#2F2A24" stroke-width="1.1"/>
<rect x="94" y="402" width="28" height="18" fill="#F8F3E6" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M100,419 q-3,-5 0,-9 q3,4 0,9" fill="none" stroke="#A2503B" stroke-width="0.8"/>
<path d="M108,419 q-3,-5 0,-9 q3,4 0,9" fill="none" stroke="#A2503B" stroke-width="0.8"/>
<path d="M116,419 q-3,-5 0,-9 q3,4 0,9" fill="none" stroke="#A2503B" stroke-width="0.8"/>
<path d="M79.0,334 C74.0,356 82.0,384 85.0,396 Q108,401 131.0,396 C134.0,384 142.0,356 137.0,334 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
