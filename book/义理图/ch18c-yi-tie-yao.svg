<path d="M108,322 q5,-7 0,-14 q-5,-7 0,-12" fill="none" stroke="#4A5C55" stroke-width="0.6" opacity="0.5466266266266299"/>
<path d="M120,322 q5,-7 0,-14 q-5,-7 0,-12" fill="none" stroke="#4A5C55" stroke-width="0.6" opacity="0.36626626626626627"/>
<line x1="224" y1="392" x2="280" y2="392" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="224" y1="392" x2="224" y2="404" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="280" y1="392" x2="280" y2="404" stroke="#2F2A24" stroke-width="0.8"/>
<path d="M232,391 q20,22 40,0 Z" fill="#E9F0E6" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="252" cy="391" rx="20" ry="4" fill="#E4D8BF" stroke="#2F2A24" stroke-width="0.9"/>
<text x="298" y="334" font-size="4.5" fill="#A2503B">煎得满屋药气</text>
<text x="298" y="348" font-size="4.5" fill="#6E6459">人人夸这药好</text>
<text x="298" y="362" font-size="4.5" fill="#6E6459">夸的是药，病还在</text>
<text x="24" y="457" font-size="5.0" fill="#A2503B">二、有病：上了炉，才煎得出孝慈与忠臣</text>
<text x="24" y="476" font-size="4.9" fill="#2F2A24">孝慈是医治不和的药，不是本来无病的常态。</text>
<text x="24" y="492" font-size="4.9" fill="#2F2A24">忠臣是昏乱中扶危的人，不是乱因；次序不可倒：先有缺口，才有名号。</text>
<text x="24" y="510" font-size="4.9" fill="#4A5C55">药有用，但药不是健康；理想是无需用药而自然安康。</text>
<line x1="24" y1="528" x2="338" y2="528" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="536" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="552" font-size="5.8" fill="#2F2A24" text-anchor="middle">孝慈者，亲之药也；</text>
<text x="190" y="564" font-size="5.8" fill="#4A5C55" text-anchor="middle">忠臣者，国之药也。</text>
<line x1="20" y1="590" x2="360" y2="590" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="604" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="620" font-size="8.4" fill="#2F2A24">孝慈者，亲之药也；忠臣者，国之药也。</text>
<text x="20" y="636" font-size="8.4" fill="#2F2A24">药能已病，药不是身子。</text>
</svg>