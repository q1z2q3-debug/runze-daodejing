<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 398" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="七喻不是七种美德，是七种「不」" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="398" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 五 章 · 体 道</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">七个比喻</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">微妙玄通，深不可识：认不出，是因为他不把自己摆出来。</text>
<text x="20" y="122" font-size="11" fill="#A2503B" letter-spacing="1">豫</text>
<text x="42" y="122" font-size="9" fill="#2F2A24">冬涉川</text>
<text x="116" y="122" font-size="8" fill="#6E6459">不敢抢先</text>
<text x="196" y="122" font-size="11" fill="#A2503B" letter-spacing="1">犹</text>
<text x="218" y="122" font-size="9" fill="#2F2A24">畏四邻</text>
<text x="292" y="122" font-size="8" fill="#6E6459">不敢自专</text>
<text x="20" y="156" font-size="11" fill="#A2503B" letter-spacing="1">俨</text>
<text x="42" y="156" font-size="9" fill="#2F2A24">其若客</text>
<text x="116" y="156" font-size="8" fill="#6E6459">不敢当主</text>
<text x="196" y="156" font-size="11" fill="#A2503B" letter-spacing="1">涣</text>
<text x="218" y="156" font-size="9" fill="#2F2A24">若凌释</text>
<text x="292" y="156" font-size="8" fill="#6E6459">不结死冰</text>
<text x="20" y="190" font-size="11" fill="#A2503B" letter-spacing="1">敦</text>
<text x="42" y="190" font-size="9" fill="#2F2A24">其若朴</text>
<text x="116" y="190" font-size="8" fill="#6E6459">不带修饰</text>
<text x="196" y="190" font-size="11" fill="#A2503B" letter-spacing="1">旷</text>
<text x="218" y="190" font-size="9" fill="#2F2A24">其若谷</text>
<text x="292" y="190" font-size="8" fill="#6E6459">不填满自己</text>
<text x="20" y="224" font-size="11" fill="#A2503B" letter-spacing="1">混</text>
<text x="42" y="224" font-size="9" fill="#2F2A24">其若浊</text>
<text x="116" y="224" font-size="8" fill="#6E6459">不装作清</text>
<text x="20" y="248" font-size="8.6" fill="#8A7C69">七字一个字都不褒：说的都是「不肯往前站一步」。</text>
<rect x="20" y="266" width="340" height="52" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="32" y="284" font-size="9.2" fill="#A2503B">孰能浊以静之徐清？</text>
<text x="200" y="284" font-size="8.4" fill="#6E6459">不是澄清，是让它自己沉下来。</text>
<text x="32" y="302" font-size="9.2" fill="#4A5C55">孰能安以动之徐生？</text>
<text x="200" y="302" font-size="8.4" fill="#6E6459">不是不动，是动得慢，才生得出来。</text>
<rect x="20" y="336" width="340" height="42" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="355" font-size="10.5" fill="#2F2A24" text-anchor="middle" letter-spacing="1">不欲盈：夫唯不盈，故能蔽而新成。</text>
<text x="190" y="371" font-size="8.4" fill="#6E6459" text-anchor="middle">不装满，旧样子才换得成新样子。</text>
</svg>