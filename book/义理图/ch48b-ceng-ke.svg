<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 438" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="损，就是把实线损成虚线" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="438" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 八 章 · 损</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">打破框框</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">损之又损，以至于无为。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.8" fill="#2F2A24" text-anchor="middle">「损」不是扔东西，是把那道边一点点损掉。</text>
<text x="190" y="126" font-size="5.4" fill="#6E6459" text-anchor="middle">实线是边；损一次，边就淡成虚线；再损，虚线也淡掉。</text>
<rect x="32" y="160" width="44" height="44" fill="none" stroke="#2F2A24" stroke-width="0.9" opacity="1.0"/>
<text x="54" y="226" font-size="4.6" fill="#6E6459" text-anchor="middle">框是实的</text>
<line x1="126" y1="160" x2="170" y2="160" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="170" y1="160" x2="170" y2="184" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="170" y1="192" x2="170" y2="204" stroke="#A2503B" stroke-width="0.9" stroke-dasharray="3 3"/>
<line x1="170" y1="204" x2="126" y2="204" stroke="#A2503B" stroke-width="0.9" stroke-dasharray="3 3"/>
<line x1="126" y1="204" x2="126" y2="180" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="126" y1="172" x2="126" y2="160" stroke="#2F2A24" stroke-width="0.9" stroke-dasharray="3 3"/>
<path d="M170,184 l4,-3 M170,184 l4,3" stroke="#A2503B" stroke-width="0.6" fill="none"/>
<text x="148" y="226" font-size="4.6" fill="#A2503B" text-anchor="middle">实线断成虚线</text>
<rect x="220" y="160" width="44" height="44" fill="none" stroke="#A2503B" stroke-width="0.9" opacity="1.0" stroke-dasharray="4 3"/>
<text x="242" y="226" font-size="4.6" fill="#A2503B" text-anchor="middle">损成了虚线</text>
<rect x="304" y="160" width="44" height="44" fill="none" stroke="#A2503B" stroke-width="0.9" opacity="0.4" stroke-dasharray="5 4"/>
<text x="326" y="226" font-size="4.6" fill="#6E6459" text-anchor="middle">虚线也淡掉</text>
<line x1="84" y1="182" x2="118" y2="182" stroke="#4A5C55" stroke-width="0.6" marker-end="url(#arr2)"/>
<line x1="178" y1="182" x2="212" y2="182" stroke="#4A5C55" stroke-width="0.6" marker-end="url(#arr2)"/>
<line x1="272" y1="182" x2="296" y2="182" stroke="#4A5C55" stroke-width="0.6" marker-end="url(#arr2)"/>
<text x="195.0" y="148" font-size="4.8" fill="#4A5C55" text-anchor="middle">又损</text>
<text x="101.0" y="148" font-size="4.8" fill="#4A5C55" text-anchor="middle">损</text>
<text x="284.0" y="162" font-size="4.8" fill="#4A5C55" text-anchor="middle">再损</text>
<text x="24" y="250" font-size="5.6" fill="#2F2A24">框是自己画的：一个概念一道框，一个标准一道框。</text>
<text x="24" y="266" font-size="5.6" fill="#2F2A24">损不是扔掉框，是让它不再硬着——实线还在，只是不再划人。</text>
<text x="24" y="282" font-size="5.4" fill="#4A5C55">这就是「又」：损一次不够，因为剩下的那条实线会自己又长硬。</text>
<line x1="24" y1="300" x2="338" y2="300" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="308" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="324" font-size="6.0" fill="#2F2A24" text-anchor="middle">损到极处，框还在，</text>
<text x="190" y="336" font-size="6.0" fill="#4A5C55" text-anchor="middle">可它已经不是一座墙了。</text>
<line x1="20" y1="362" x2="360" y2="362" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="376" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="392" font-size="8.4" fill="#2F2A24">损之又损，以至于无为。</text>
</svg>