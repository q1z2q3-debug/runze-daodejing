<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 486" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="每减掉一层，剩下那层长出新皮" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="486" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 八 章 · 又</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">损之又损</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">损之又损，以至于无为。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.8" fill="#2F2A24" text-anchor="middle">「又」不是重复劳动，是一层套一层地剥。</text>
<text x="190" y="126" font-size="5.4" fill="#6E6459" text-anchor="middle">为什么没有终点？不是路长，是壳会再生。</text>
<circle cx="120" cy="226" r="56" fill="none" stroke="#2F2A24" stroke-width="0.8" opacity="0.90"/>
<circle cx="120" cy="226" r="46" fill="none" stroke="#2F2A24" stroke-width="0.8" opacity="0.78"/>
<circle cx="120" cy="226" r="36" fill="none" stroke="#2F2A24" stroke-width="0.8" opacity="0.66"/>
<circle cx="120" cy="226" r="26" fill="none" stroke="#2F2A24" stroke-width="0.8" opacity="0.54"/>
<circle cx="120" cy="226" r="16" fill="none" stroke="#2F2A24" stroke-width="0.8" opacity="0.42"/>
<circle cx="120" cy="226" r="6" fill="#A2503B" opacity="0.55"/>
<path d="M170.8,249.7 A56,56 0 1 1 170.8,202.3" fill="none" stroke="#2F2A24" stroke-width="0.8" opacity="0.9"/>
<path d="M172.6,250.5 Q191.3,236.0 180.9,206.2" fill="none" stroke="#A2503B" stroke-width="0.8"/>
<path d="M180.9,206.2 q6,2 10,-2" fill="none" stroke="#A2503B" stroke-width="0.5"/>
<text x="196" y="178" font-size="4.8" fill="#A2503B">掀起的一层</text>
<line x1="194" y1="182" x2="186.9" y2="204.2" stroke="#E6D8C2" stroke-width="0.4"/>
<path d="M159.8,199.2 A48,48 0 0 0 161.6,250.0" fill="none" stroke="#4A5C55" stroke-width="0.9" stroke-dasharray="3 2.4"/>
<text x="196" y="256" font-size="4.8" fill="#4A5C55">断口这里，又长出一层新皮</text>
<line x1="194" y1="252" x2="164" y2="246" stroke="#E6D8C2" stroke-width="0.4"/>
<text x="120" y="302" font-size="4.8" fill="#6E6459" text-anchor="middle">减贪，减到最后贪「我已经不贪了」</text>
<text x="24" y="322" font-size="5.8" fill="#2F2A24">减一次，人就会把「我已经减了」也当成一层新的东西收着。</text>
<text x="24" y="338" font-size="5.4" fill="#6E6459">减评判，减到最后评判「他还在评判」。</text>
<text x="24" y="354" font-size="5.4" fill="#4A5C55">所以「又」是剥一层、等它长、再剥一层——不是同一刀重复。</text>
<line x1="24" y1="372" x2="338" y2="372" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="380" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="396" font-size="6.0" fill="#2F2A24" text-anchor="middle">剥到极处，不是手里空了，</text>
<text x="190" y="408" font-size="6.0" fill="#4A5C55" text-anchor="middle">是那只加边的手不动了。</text>
<line x1="20" y1="434" x2="360" y2="434" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="448" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="464" font-size="8.4" fill="#2F2A24">损之又损，以至于无为。</text>
</svg>