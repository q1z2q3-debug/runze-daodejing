<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="最远那一点，就是回来开始的地方" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="704" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 章 · 一 只 回 力 镖</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只回力镖</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">其事好还。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「还」，《说文》「复也」——回来；「好还」犹今言「最容易转回来」。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">不是鬼神在罚你，是势的力学：你向外压出的力，一定有一个回来的方向。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、掷出去：只想着「让它飞得更远」</text>
<rect x="26" y="164" width="328" height="148" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="36" y1="294" x2="344" y2="294" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="58" cy="232" r="7" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="58" y1="239" x2="58" y2="264" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="58" y1="264" x2="48" y2="294" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="58" y1="264" x2="68" y2="294" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="58" y1="244" x2="88" y2="256" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="58" y1="250" x2="49" y2="260" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M84,256 A112,30 0 0 1 308,256" fill="none" stroke="#A2503B" stroke-width="1.0"/>
<line x1="206" y1="227" x2="240" y2="232" stroke="#A2503B" stroke-width="1.2" marker-end="url(#arrS)"/>
<path d="M258,227 L281,240 L258,253" fill="none" stroke="#2F2A24" stroke-width="4.4" stroke-linejoin="miter"/>
<text x="196" y="218" font-size="4.2" fill="#8A7C69" text-anchor="middle">远</text>
<text x="190" y="306" font-size="4.1" fill="#8A7C69" text-anchor="middle">去的时候，人在意的是多远</text>
<text x="24" y="336" font-size="5.1" fill="#A2503B">二、绕回来：还是那只镖，方向反了</text>
<rect x="26" y="348" width="328" height="148" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="36" y1="478" x2="344" y2="478" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="58" cy="416" r="7" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="58" y1="423" x2="58" y2="448" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="58" y1="448" x2="48" y2="478" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="58" y1="448" x2="68" y2="478" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="58" y1="428" x2="88" y2="440" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="58" y1="434" x2="49" y2="444" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M308,440 A112,30 0 0 0 84,440" fill="none" stroke="#A2503B" stroke-width="1.0" stroke-dasharray="5 3"/>
<line x1="150" y1="470" x2="116" y2="464" stroke="#A2503B" stroke-width="1.2" marker-end="url(#arrS)"/>
<path d="M130,435 L107,448 L130,461" fill="none" stroke="#2F2A24" stroke-width="4.4" stroke-linejoin="miter"/>
<text x="190" y="490" font-size="4.1" fill="#8A7C69" text-anchor="middle">最远的那一点，就是回来开始的地方</text>
<text x="24" y="518" font-size="4.8" fill="#2F2A24">「好还」不是报应，是势的折返；老子不靠鬼神说这句话，他靠观察。</text>
<text x="24" y="534" font-size="4.8" fill="#2F2A24">用力的人，最后都被自己的力反着推；压得越紧，回来的那一下越直。</text>
<text x="24" y="552" font-size="4.8" fill="#4A5C55">这跟第二十九、三十章是一条力学：「合」推出去的，最后都回到推它的那只手上。</text>
<line x1="24" y1="570" x2="338" y2="570" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="578" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="594" font-size="6.0" fill="#2F2A24" text-anchor="middle">「好还」的「好」，读去声，犹「易」。</text>
<text x="190" y="606" font-size="5.0" fill="#4A5C55" text-anchor="middle">这件事最容易转回来——不是它记仇，是它本来就要回。</text>
<line x1="20" y1="632" x2="360" y2="632" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="646" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="662" font-size="8.4" fill="#2F2A24">不是天在罚你，是你推出去的那股劲儿回来了。</text>
<text x="20" y="678" font-size="8.4" fill="#2F2A24">压得越紧，回来的越直。</text>
</svg>