<path d="M226,520 l3,-13 M230,520 l6,-4" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M246,512 l2,-14 M248,512 l6,-5" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="258" cy="526" r="2.2" fill="#A2503B"/>
<rect x="20" y="602" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="620" font-size="8.4" fill="#2F2A24" text-anchor="middle">四对八句：前一半是世人正在追的，后一半才是老子要的。</text>
<text x="190" y="636" font-size="8.0" fill="#6E6459" text-anchor="middle">外面守得住，是因为里面先不争了。</text>
<line x1="20" y1="654" x2="360" y2="654" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="668" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="684" font-size="8.4" fill="#2F2A24">智是识词，明是照见；智越用越熟，明越照越静。</text>
<text x="20" y="700" font-size="8.4" fill="#2F2A24">力是筋，越使越少；强是弓，能张能弛。</text>
</svg>