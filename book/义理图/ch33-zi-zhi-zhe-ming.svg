<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="四对八句：前一半是世人正在追的，后一半才是老子要的" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="712" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 三 章 · 四 对</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">自知者明</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">前面收的是事；这一章收的是那个做事的人。</text>
<rect x="20" y="102" width="162" height="112" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<rect x="198" y="102" width="162" height="112" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="32" y="122" font-size="8.8" fill="#4A5C55">知人 · 智</text>
<text x="210" y="122" font-size="8.8" fill="#A2503B">自知 · 明</text>
<text x="32" y="186" font-size="7.2" fill="#6E6459">拿灯照别人</text>
<text x="32" y="199" font-size="7.2" fill="#6E6459">识词、贴标签</text>
<text x="210" y="186" font-size="7.2" fill="#6E6459">灯照到自己</text>
<text x="210" y="199" font-size="7.2" fill="#6E6459">照见，不是想通</text>
<rect x="20" y="224" width="162" height="112" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<rect x="198" y="224" width="162" height="112" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="32" y="244" font-size="8.8" fill="#4A5C55">胜人 · 有力</text>
<text x="210" y="244" font-size="8.8" fill="#A2503B">自胜 · 强</text>
<text x="32" y="308" font-size="7.2" fill="#6E6459">筋：一次性的</text>
<text x="32" y="321" font-size="7.2" fill="#6E6459">越使越少</text>
<text x="210" y="308" font-size="7.2" fill="#6E6459">弓：能张能弛</text>
<text x="210" y="321" font-size="7.2" fill="#6E6459">越练越熟</text>
<rect x="20" y="346" width="162" height="112" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<rect x="198" y="346" width="162" height="112" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="32" y="366" font-size="8.8" fill="#4A5C55">知足 · 富</text>
<text x="210" y="366" font-size="8.8" fill="#A2503B">强行 · 有志</text>
<text x="32" y="430" font-size="7.2" fill="#6E6459">备：该有的都有</text>
<text x="32" y="443" font-size="7.2" fill="#6E6459">缺是单子太长</text>
<text x="210" y="430" font-size="7.2" fill="#6E6459">向外止，向内行</text>
<text x="210" y="443" font-size="7.2" fill="#6E6459">不肯向内停</text>
<rect x="20" y="468" width="162" height="112" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<rect x="198" y="468" width="162" height="112" fill="#FBF6EC" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="32" y="488" font-size="8.8" fill="#4A5C55">不失其所 · 久</text>
<text x="210" y="488" font-size="8.8" fill="#A2503B">死而不亡 · 寿</text>
<text x="32" y="552" font-size="7.2" fill="#6E6459">根扎在原处</text>
<text x="32" y="565" font-size="7.2" fill="#6E6459">位不失，故久</text>
<text x="210" y="552" font-size="7.2" fill="#6E6459">身可以散</text>
<text x="210" y="565" font-size="7.2" fill="#6E6459">根不能失</text>
