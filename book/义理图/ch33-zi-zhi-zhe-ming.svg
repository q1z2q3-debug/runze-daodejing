<text x="238" y="399" font-size="6.6" fill="#6E6459" text-anchor="middle">己</text>
<line x1="206" y1="396" x2="224" y2="396" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<line x1="28" y1="530" x2="86" y2="530" stroke="#DCCBB0" stroke-width="0.9"/>
