<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="以阅众甫：在门内把万物的开端一一点过" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="744" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 一 章 · 门 内 点 数</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">门内点数</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">阅，具数于门中也。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">「名」是指向实相的符号，不是实相；符号留得住，地方留不住。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459">「阅」是门里逐个点数——比空说的「观照」具体得多。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、路标：名不去，是路标一直在；路标不是那个地方</text>
<rect x="26" y="164" width="328" height="164" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M40,296 q60,-6 120,4 q60,10 120,2 q40,-5 52,0" fill="none" stroke="#E6D8C2" stroke-width="1.0"/>
<line x1="120" y1="292" x2="120" y2="226" stroke="#2F2A24" stroke-width="1.6"/>
<path d="M92,204 L150,204 L166,218 L150,232 L92,232 Z" fill="#F2EADA" stroke="#2F2A24" stroke-width="1.1"/>
<text x="122" y="220" font-size="5.6" fill="#A2503B" text-anchor="middle">道</text>
<line x1="170" y1="218" x2="196" y2="218" stroke="#A2503B" stroke-width="0.9" stroke-dasharray="4 2"/>
<line x1="198" y1="218" x2="222" y2="218" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arr2)"/>
<text x="224" y="212" font-size="4.1" fill="#A2503B">所指：那边</text>
<ellipse cx="288" cy="234" rx="48" ry="26" fill="#F3EBDD" opacity="0.5" stroke="none"/>
<ellipse cx="288" cy="234" rx="38" ry="20" fill="#F3EBDD" opacity="0.6" stroke="none"/>
<ellipse cx="288" cy="234" rx="28" ry="14" fill="#F3EBDD" opacity="0.7" stroke="none"/>
<path d="M262,224 q13,-4 26,0 q13,4 26,0" fill="none" stroke="#DCCFBB" stroke-width="0.6"/>
<path d="M262,234 q13,-4 26,0 q13,4 26,0" fill="none" stroke="#DCCFBB" stroke-width="0.6"/>
<path d="M262,244 q13,-4 26,0 q13,4 26,0" fill="none" stroke="#DCCFBB" stroke-width="0.6"/>
<text x="286" y="272" font-size="3.9" fill="#8A7C69" text-anchor="middle">那处本身，看不见也说不全</text>
<text x="127" y="312" font-size="4.1" fill="#8A7C69" text-anchor="middle">路标写着名，不等于名就是那处</text>
<text x="24" y="346" font-size="5.2" fill="#4A5C55">二、门内点数：一器一器点过，点名的是开端，不是器物</text>
<rect x="26" y="358" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="70" y1="384" x2="70" y2="508" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="310" y1="384" x2="310" y2="508" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="70" y1="384" x2="310" y2="384" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="70" y1="508" x2="310" y2="508" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="140" y="374" width="100" height="14" fill="#F2EADA" stroke="#DCCBB0" stroke-width="0.8"/>
<text x="190" y="384" font-size="4.4" fill="#A2503B" text-anchor="middle">道</text>
<text x="252" y="370" font-size="3.9" fill="#8A7C69">名不去：路标一直在</text>
<line x1="92" y1="508" x2="92" y2="474" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M84.0,474 q8.0,-14 16,0 q-8.0,6 -16,0" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<text x="92" y="524" font-size="3.6" fill="#4A5C55" text-anchor="middle">一</text>
<line x1="136" y1="508" x2="136" y2="474" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="125.0" y="462" width="22" height="12" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<text x="136" y="524" font-size="3.6" fill="#4A5C55" text-anchor="middle">二</text>
<line x1="180" y1="508" x2="180" y2="474" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M173.0,474 q7.0,-14 14,0 q-7.0,6 -14,0" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<text x="180" y="524" font-size="3.6" fill="#4A5C55" text-anchor="middle">三</text>
<line x1="224" y1="508" x2="224" y2="474" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="215.0" y="462" width="18" height="12" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<text x="224" y="524" font-size="3.6" fill="#4A5C55" text-anchor="middle">四</text>
<line x1="268" y1="508" x2="268" y2="474" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M262.0,474 q6.0,-14 12,0 q-6.0,6 -12,0" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<text x="268" y="524" font-size="3.6" fill="#4A5C55" text-anchor="middle">五</text>
<circle cx="200" cy="436" r="5" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="200" y1="441" x2="200" y2="466" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="200" y1="466" x2="194" y2="486" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="200" y1="466" x2="206" y2="486" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="200" y1="448" x2="230" y2="454" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="200" y1="448" x2="170" y2="454" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="236" y1="456" x2="268" y2="456" stroke="#4A5C55" stroke-width="0.8" marker-end="url(#arr2)"/>
<text x="190" y="402" font-size="4.0" fill="#8A7C69" text-anchor="middle">自今及古，其名不去</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">「阅」的本义是在门内逐一点数：不是抽象地观照万物的开端，是把开端一一点过。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">自今及古：从当下回溯上古，这个可以被名为「道」的存在，从来不曾消失。</text>
<text x="24" y="592" font-size="4.8" fill="#4A5C55">「以此」二字，把「知」的来源说尽了：不是知道得多，是站对了地方。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="634" font-size="5.4" fill="#2F2A24" text-anchor="middle">惚兮恍兮，其中有象；恍兮惚兮，其中有物。</text>
<text x="190" y="646" font-size="5.4" fill="#4A5C55" text-anchor="middle">吾何以知众甫之状哉？以此。</text>
<line x1="20" y1="672" x2="360" y2="672" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="686" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="702" font-size="8.4" fill="#2F2A24">自今及古，其名不去，以阅众甫。</text>
<text x="20" y="718" font-size="8.4" fill="#2F2A24">不是知道得多，是站对了地方。</text>
</svg>