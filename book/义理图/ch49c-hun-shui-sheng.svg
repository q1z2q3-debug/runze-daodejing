<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="浑是水混着流的声音：水还在流，只是不再一格一格地流" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="660" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 九 章 · 浑</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">浑，是水声</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">为天下浑其心。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「浑」，《说文》「混流声也」——水混着流的声音。</text>
<text x="190" y="127" font-size="5.0" fill="#6E6459" text-anchor="middle">不是糊涂，不是把人弄傻：是让被切碎的心重新连成一片。</text>
<text x="24" y="150" font-size="5.2" fill="#A2503B">一、一格一格：每滴都在自己的格子里</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="208" x2="40" y2="280" stroke="#2F2A24" stroke-width="1"/>
<line x1="104" y1="208" x2="104" y2="280" stroke="#2F2A24" stroke-width="1"/>
<line x1="168" y1="208" x2="168" y2="280" stroke="#2F2A24" stroke-width="1"/>
<line x1="232" y1="208" x2="232" y2="280" stroke="#2F2A24" stroke-width="1"/>
<line x1="296" y1="208" x2="296" y2="280" stroke="#2F2A24" stroke-width="1"/>
<line x1="330" y1="208" x2="330" y2="280" stroke="#2F2A24" stroke-width="1"/>
<line x1="40" y1="208" x2="330" y2="208" stroke="#DCCBB0" stroke-width="0.6"/>
<line x1="40" y1="280" x2="330" y2="280" stroke="#2F2A24" stroke-width="1"/>
<line x1="46" y1="254" x2="98" y2="254" stroke="#4A5C55" stroke-width="0.9"/>
<line x1="110" y1="254" x2="162" y2="254" stroke="#4A5C55" stroke-width="0.9"/>
<line x1="174" y1="254" x2="226" y2="254" stroke="#4A5C55" stroke-width="0.9"/>
<line x1="238" y1="254" x2="290" y2="254" stroke="#4A5C55" stroke-width="0.9"/>
<line x1="302" y1="254" x2="324" y2="254" stroke="#4A5C55" stroke-width="0.9"/>
<text x="190" y="298" font-size="4.5" fill="#A2503B" text-anchor="middle">五格，五潭死水：一格不流到另一格</text>
<text x="190" y="336" font-size="4.5" fill="#4A5C55" text-anchor="middle">墙一道一道立着：好坏、得失、敌我，每一刀都切得很准</text>
<text x="24" y="354" font-size="5.2" fill="#4A5C55">二、浑：墙软下来，水连成一片，也出了声</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="484" x2="330" y2="484" stroke="#2F2A24" stroke-width="1"/>
<line x1="40" y1="412" x2="330" y2="412" stroke="#E6D8C2" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="40" y1="412" x2="40" y2="484" stroke="#2F2A24" stroke-width="1"/>
<line x1="330" y1="412" x2="330" y2="484" stroke="#2F2A24" stroke-width="1"/>
<line x1="104" y1="412" x2="104" y2="484" stroke="#E6D8C2" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="168" y1="412" x2="168" y2="484" stroke="#E6D8C2" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="232" y1="412" x2="232" y2="484" stroke="#E6D8C2" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="296" y1="412" x2="296" y2="484" stroke="#E6D8C2" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M44,458 q16,-9 32,0 q16,9 32,0 q16,-9 32,0 q16,9 32,0 q16,-9 32,0 q16,9 32,0 q16,-9 32,0 q16,9 32,0 q14,-7 28,-1" fill="none" stroke="#4A5C55" stroke-width="1.1"/>
<line x1="60" y1="424" x2="168" y2="424" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<text x="174" y="426" font-size="4.5" fill="#4A5C55">还是有流向</text>
<path d="M222,428 q8,-9 16,0" fill="none" stroke="#4A5C55" stroke-width="0.9" opacity="0.85"/>
<path d="M246,428 q8,-7 16,0" fill="none" stroke="#4A5C55" stroke-width="0.9" opacity="0.6"/>
<path d="M270,428 q8,-5 16,0" fill="none" stroke="#4A5C55" stroke-width="0.9" opacity="0.4"/>
<text x="246" y="418" font-size="4.4" fill="#4A5C55" text-anchor="middle">混流声也</text>
<text x="190" y="502" font-size="4.5" fill="#4A5C55" text-anchor="middle">格子软了，水重新连成一片</text>
<text x="190" y="540" font-size="4.5" fill="#4A5C55" text-anchor="middle">不是没有分别，是不再一格一格站着</text>
<text x="24" y="558" font-size="5.4" fill="#2F2A24">一个时代的心被切碎，不是切得不准，是切得太准。</text>
<text x="24" y="574" font-size="5.4" fill="#2F2A24">每一刀都对，可每个人都站进了一个很小的格子。</text>
<text x="24" y="592" font-size="5.2" fill="#4A5C55">浑，是把格子的墙软下来——水才又能流到别人那儿去，也才重新有声。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="634" font-size="6.0" fill="#2F2A24" text-anchor="middle">「浑」是水声，不是糊涂；</text>
<text x="190" y="646" font-size="6.0" fill="#4A5C55" text-anchor="middle">水还在流，只是不再一格一格地流。</text>
<line x1="20" y1="672" x2="360" y2="672" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="686" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="702" font-size="8.4" fill="#2F2A24">「浑」是水声，不是糊涂；水还在流，只是不再一格一格地流。</text>
</svg>