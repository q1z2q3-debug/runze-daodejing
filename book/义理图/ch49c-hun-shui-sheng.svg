<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 566" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="浑是水混着流的声音：水还在流，只是不再一格一格地流" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="566" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 九 章 · 浑</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">浑，是水声</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">为天下浑其心。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.6" fill="#2F2A24" text-anchor="middle">「浑」，《说文》「混流声也」——水混着流的声音。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">不是糊涂，不是把人弄傻：是让被切碎的心重新连成一片。</text>
<text x="24" y="146" font-size="5.4" fill="#A2503B">一、一格一格：每滴都在自己的格子里</text>
<line x1="30" y1="224" x2="350" y2="224" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="30" y1="172" x2="350" y2="172" stroke="#DCCBB0" stroke-width="0.6"/>
<line x1="30" y1="172" x2="30" y2="224" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="94" y1="172" x2="94" y2="224" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="158" y1="172" x2="158" y2="224" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="222" y1="172" x2="222" y2="224" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="286" y1="172" x2="286" y2="224" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="350" y1="172" x2="350" y2="224" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="36" y1="202" x2="88" y2="202" stroke="#4A5C55" stroke-width="0.8"/>
<line x1="100" y1="202" x2="152" y2="202" stroke="#4A5C55" stroke-width="0.8"/>
<line x1="164" y1="202" x2="216" y2="202" stroke="#4A5C55" stroke-width="0.8"/>
<line x1="228" y1="202" x2="280" y2="202" stroke="#4A5C55" stroke-width="0.8"/>
<line x1="292" y1="202" x2="344" y2="202" stroke="#4A5C55" stroke-width="0.8"/>
<text x="30" y="238" font-size="4.6" fill="#6E6459">墙一道一道立着：好坏、得失、敌我，每一刀都切得很准</text>
<text x="24" y="258" font-size="5.4" fill="#4A5C55">二、浑：墙软下来，水连成一片</text>
<line x1="30" y1="336" x2="350" y2="336" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="30" y1="284" x2="350" y2="284" stroke="#E6D8C2" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="30" y1="284" x2="30" y2="336" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="350" y1="284" x2="350" y2="336" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="94" y1="284" x2="94" y2="336" stroke="#E6D8C2" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="158" y1="284" x2="158" y2="336" stroke="#E6D8C2" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="222" y1="284" x2="222" y2="336" stroke="#E6D8C2" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="286" y1="284" x2="286" y2="336" stroke="#E6D8C2" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M34,314 q16,-9 32,0 q16,9 32,0 q16,-9 32,0 q16,9 32,0 q16,-9 32,0 q16,9 32,0 q16,-9 32,0 q16,9 32,0" fill="none" stroke="#4A5C55" stroke-width="1"/>
<line x1="70" y1="298" x2="200" y2="298" stroke="#4A5C55" stroke-width="0.7" marker-end="url(#arr2)"/>
<text x="206" y="300" font-size="4.6" fill="#4A5C55">还是有流向</text>
<text x="30" y="350" font-size="4.6" fill="#6E6459">格子软了，水重新连成一片；不是没有分别，是不再一格一格站着</text>
<text x="24" y="372" font-size="5.6" fill="#2F2A24">一个时代的心被切碎，不是切得不准，是切得太准。</text>
<text x="24" y="388" font-size="5.6" fill="#2F2A24">每一刀都对，可每个人都站进了一个很小的格子。</text>
<text x="24" y="404" font-size="5.4" fill="#4A5C55">浑，是把格子的墙软下来——水才又能流到别人那儿去。</text>
<line x1="24" y1="422" x2="338" y2="422" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="430" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="446" font-size="6.0" fill="#2F2A24" text-anchor="middle">「浑」是水声，不是糊涂；</text>
<text x="190" y="458" font-size="6.0" fill="#4A5C55" text-anchor="middle">水还在流，只是不再一格一格地流。</text>
<line x1="20" y1="484" x2="360" y2="484" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="498" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="514" font-size="8.4" fill="#2F2A24">「浑」是水声，不是糊涂；水还在流，只是不再一格一格地流。</text>
</svg>