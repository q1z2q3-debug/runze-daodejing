<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 666" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="唯之与阿，相去几何：一把尺的两面" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="666" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 章 · 独 异</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一把尺的两面</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">唯之与阿，相去几何？善之与恶，相去若何？</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">「唯」是恭顺应答，「阿」是怠慢呵斥——都是人给的判词。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">两端的分寸，是尺定的，不是事定的。</text>
<rect x="26" y="150" width="328" height="132" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="52" y="216" width="276" height="13" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="60" y1="216" x2="60" y2="227" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="74" y1="216" x2="74" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="88" y1="216" x2="88" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="102" y1="216" x2="102" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="116" y1="216" x2="116" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="130" y1="216" x2="130" y2="227" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="144" y1="216" x2="144" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="158" y1="216" x2="158" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="172" y1="216" x2="172" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="186" y1="216" x2="186" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="200" y1="216" x2="200" y2="227" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="214" y1="216" x2="214" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="228" y1="216" x2="228" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="242" y1="216" x2="242" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="256" y1="216" x2="256" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="270" y1="216" x2="270" y2="227" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="284" y1="216" x2="284" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="298" y1="216" x2="298" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="312" y1="216" x2="312" y2="224" stroke="#2F2A24" stroke-width="0.7"/>
<rect x="52" y="182" width="30" height="20" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.9"/>
<text x="67" y="196" font-size="5.6" fill="#A2503B" text-anchor="middle">唯</text>
<rect x="298" y="182" width="30" height="20" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.9"/>
<text x="313" y="196" font-size="5.6" fill="#A2503B" text-anchor="middle">阿</text>
<line x1="67" y1="202" x2="67" y2="216" stroke="#DCCBB0" stroke-width="0.8" stroke-dasharray="2 2"/>
<line x1="313" y1="202" x2="313" y2="216" stroke="#DCCBB0" stroke-width="0.8" stroke-dasharray="2 2"/>
<line x1="72" y1="240" x2="308" y2="240" stroke="#8A7C69" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="80" y1="240" x2="296" y2="240" stroke="#8A7C69" stroke-width="0.7" marker-end="url(#arr)"/>
<line x1="300" y1="240" x2="88" y2="240" stroke="#8A7C69" stroke-width="0.7" marker-end="url(#arrL)"/>
<text x="190" y="272" font-size="4.5" fill="#8A7C69" text-anchor="middle">相去几何：这一面上，两端被量成了一段距离</text>
<text x="24" y="295" font-size="5.0" fill="#A2503B">一、有刻度的一面：两端离得很远，还要问「几 何」</text>
<rect x="26" y="308" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="52" y="392" width="276" height="13" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="56" y1="396" x2="326" y2="396" stroke="#E6D8C2" stroke-width="0.5"/>
<line x1="56" y1="401" x2="326" y2="401" stroke="#E6D8C2" stroke-width="0.5"/>
<path d="M52,366 q-14,10 0,22" fill="none" stroke="#8A7C69" stroke-width="0.7"/>
<line x1="52" y1="366" x2="56" y2="362" stroke="#8A7C69" stroke-width="0.7" marker-end="url(#arr)"/>
<rect x="172" y="352" width="30" height="20" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.9"/>
<text x="187" y="366" font-size="5.2" fill="#A2503B" text-anchor="middle">阿</text>
<rect x="160" y="370" width="30" height="22" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.9"/>
<text x="175" y="385" font-size="5.2" fill="#A2503B" text-anchor="middle">唯</text>
<text x="190" y="438" font-size="4.5" fill="#8A7C69" text-anchor="middle">翻过来：没有刻度，两端并在一处——只是一声应答</text>
<text x="24" y="461" font-size="5.0" fill="#4A5C55">二、翻过来的一面：两块牌并在一处</text>
<text x="24" y="480" font-size="4.9" fill="#2F2A24">尺子有刻度，才有了「几 何」这个问；刻度是人刻的，不是木头上长出来的。</text>
<text x="24" y="496" font-size="4.9" fill="#2F2A24">同一句应答，这场里是恭顺，换一场就是谄媚——判词在场合手上，不在这句话上。</text>
<text x="24" y="514" font-size="4.9" fill="#4A5C55">人之所畏，不可不畏：看穿这套规矩，不等于要去撞它。</text>
<line x1="24" y1="532" x2="338" y2="532" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="540" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="556" font-size="6.0" fill="#2F2A24" text-anchor="middle">唯之与阿，相去几何。</text>
<text x="190" y="568" font-size="5.2" fill="#4A5C55" text-anchor="middle">尺子定的，不是事定的。</text>
<line x1="20" y1="594" x2="360" y2="594" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="608" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="624" font-size="8.4" fill="#2F2A24">唯之与阿，相去几何——尺子定的，不是事定的。</text>
<text x="20" y="640" font-size="8.4" fill="#2F2A24">翻过来看，两端并在一处。</text>
</svg>