<text x="190" y="296" font-size="4.3" fill="#2F2A24" text-anchor="middle">照完这头，那头还黑；事一件一件做，总有照不到的地方</text>
<text x="24" y="322" font-size="5.0" fill="#4A5C55">二、无为：灯挂在屋子当中</text>
