<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 七 章 · 其 三</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一 盏 灯</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">道恒无为而无不为。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.6" fill="#2F2A24" text-anchor="middle">「为」从爪从象，是一只手在上面；无为，撤的不是事，是那只手。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">灯不推任何东西，可满室皆明——不做的那个，恰恰成全了所有的做。</text>
<text x="24" y="152" font-size="5.0" fill="#4A5C55">一、有为：一件一件来</text>
