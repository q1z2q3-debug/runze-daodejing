<rect x="20" y="488" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="504" font-size="4.9" fill="#2F2A24" text-anchor="middle">无为而无不为：不做的那个，恰恰成全了所有的做。</text>
<text x="190" y="517" font-size="4.6" fill="#4A5C55" text-anchor="middle">手撤了，事一件没少——象照走。</text>
<line x1="20" y1="534" x2="360" y2="534" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="548" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="564" font-size="8.4" fill="#2F2A24">它什么也没做，可没有一样东西没被照到。</text>
<text x="20" y="580" font-size="8.4" fill="#2F2A24">不做的那个，恰恰成全了所有的做。</text>
