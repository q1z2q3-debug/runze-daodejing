<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="力是筋，越使越少；强是弓，能张能弛" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="630" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 三 章 · 其 三</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">筋 与 弓</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">胜人者有力，自胜者强。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.6" fill="#2F2A24" text-anchor="middle">「力」，《说文》「筋也，象人筋之形」——力是筋的事，用一次少一分。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459">「强」，古字作「彊」，《说文》「弓有力也」——弓的本事在能张能弛。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、胜人者有力：越使越少</text>
<rect x="26" y="164" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="276" x2="340" y2="276" stroke="#DCCBB0" stroke-width="0.9"/>
<circle cx="74" cy="222.0" r="6.0" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M74,228.0 Q80.0,250.0 72.0,246.0" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M72.0,246.0 L64.0,276" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M72.0,246.0 L83.0,276" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M75.0,230.0 L86.0,240.0 M73.0,230.0 L65.0,242.0" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="67.0" y="239" width="14" height="10" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M65,246 q13.0,6 22,-2 M83,246 q-11.0,8 -16,2" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="150" cy="222.0" r="6.0" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M150,228.0 Q156.0,250.0 148.0,246.0" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M148.0,246.0 L140.0,276" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M148.0,246.0 L159.0,276" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M151.0,230.0 L162.0,240.0 M149.0,230.0 L141.0,242.0" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="141.0" y="237" width="18" height="12" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M141,246 q15.0,6 26,-2 M159,246 q-13.0,8 -20,2" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<circle cx="232" cy="222.0" r="6.0" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<path d="M232,228.0 Q238.0,250.0 230.0,246.0" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M230.0,246.0 L222.0,276" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M230.0,246.0 L241.0,276" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M233.0,230.0 L244.0,240.0 M231.0,230.0 L223.0,242.0" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="220.0" y="234" width="24" height="15" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M223,246 q18.0,6 32,-2 M241,246 q-16.0,8 -26,2" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="96" y1="264" x2="122" y2="264" stroke="#DCCBB0" stroke-width="0.8" marker-end="url(#arr)"/>
<line x1="174" y1="262" x2="200" y2="262" stroke="#DCCBB0" stroke-width="0.8" marker-end="url(#arr)"/>
<text x="300" y="260" font-size="4.0" fill="#8A7C69" text-anchor="middle">二十岁</text>
<text x="300" y="270" font-size="4.0" fill="#8A7C69" text-anchor="middle">扛二百斤</text>
<text x="300" y="288" font-size="4.0" fill="#8A7C69" text-anchor="middle">四十岁</text>
<text x="300" y="298" font-size="4.0" fill="#8A7C69" text-anchor="middle">扛不动</text>
<text x="190" y="292" font-size="4.3" fill="#2F2A24" text-anchor="middle">一次一次地使，筋就一次一次地少</text>
<text x="24" y="334" font-size="5.1" fill="#4A5C55">二、自胜者强：能张能弛，松了它还在</text>
<rect x="26" y="346" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="458" x2="340" y2="458" stroke="#DCCBB0" stroke-width="0.9"/>
<path d="M96,386 Q64,418 96,450" fill="none" stroke="#2F2A24" stroke-width="1.8"/>
<line x1="96" y1="386" x2="150" y2="418" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="96" y1="450" x2="150" y2="418" stroke="#2F2A24" stroke-width="0.8"/>
<text x="96" y="468" font-size="4.6" fill="#2F2A24" text-anchor="middle">张</text>
<path d="M186,390 Q160,418 186,446" fill="none" stroke="#9EB3A8" stroke-width="1.4" stroke-dasharray="5 3"/>
<line x1="186" y1="390" x2="186" y2="446" stroke="#9EB3A8" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="186" y="418" font-size="3.8" fill="#9EB3A8" text-anchor="middle">弦松</text>
<text x="186" y="468" font-size="4.6" fill="#8A7C69" text-anchor="middle">弛</text>
<path d="M264,386 Q232,418 264,450" fill="none" stroke="#2F2A24" stroke-width="1.8"/>
<line x1="264" y1="386" x2="318" y2="418" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="264" y1="450" x2="318" y2="418" stroke="#2F2A24" stroke-width="0.8"/>
<text x="264" y="468" font-size="4.6" fill="#2F2A24" text-anchor="middle">还是那张弓</text>
<line x1="112" y1="418" x2="158" y2="418" stroke="#DCCBB0" stroke-width="0.8" marker-end="url(#arr)"/>
<line x1="200" y1="418" x2="226" y2="418" stroke="#DCCBB0" stroke-width="0.8" marker-end="url(#arr)"/>
<text x="190" y="480" font-size="4.3" fill="#2F2A24" text-anchor="middle">张满了不放，弦会疲；放了再张，弓还是那张弓</text>
<line x1="24" y1="504" x2="356" y2="504" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="512" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="528" font-size="4.8" fill="#2F2A24" text-anchor="middle">向外压人的力量，永远是拉满的状态——你一松，他就回来了。</text>
<text x="190" y="541" font-size="4.6" fill="#4A5C55" text-anchor="middle">向内降服的力量可以松：松了，它还在。</text>
<line x1="20" y1="558" x2="360" y2="558" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="572" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="588" font-size="8.4" fill="#2F2A24">力是筋，越使越少；强是弓，能张能弛。</text>
<text x="20" y="604" font-size="8.4" fill="#2F2A24">松了它还在，那才是强。</text>
</svg>