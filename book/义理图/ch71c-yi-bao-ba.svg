<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="报靶的三种人：不报、照实报、把靶画在箭落的地方" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="720" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 一 章 · 病</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一个报靶的人</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">圣人不病，以其病病。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「病」，《说文》「疾加也」：疾是小病，病是加重了的——报错一次，往后每箭都「中」。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">不报的还没射；照实报的说偏了；报错的，把靶画在箭落的地方。</text>
<text x="24" y="150" font-size="4.8" fill="#4A5C55">一、照实报：箭在靶外，曰「偏矣」——此为上等</text>
<rect x="26" y="162" width="328" height="142" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="232" cy="220" r="32" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<circle cx="232" cy="220" r="20" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="232" cy="220" r="6" fill="#A2503B" fill-opacity="0.35" stroke="#A2503B" stroke-width="0.8"/>
<line x1="124" y1="272" x2="176" y2="274" stroke="#2F2A24" stroke-width="1.2"/>
<polygon points="176,274 166,270 166,278" fill="#2F2A24"/>
<line x1="128" y1="268" x2="134" y2="272" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="128" y1="276" x2="134" y2="272" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="70" y1="280" x2="330" y2="280" stroke="#2F2A24" stroke-width="1"/>
<text x="214" y="268" font-size="4.2" fill="#4A5C55">箭落在靶外</text>
<circle cx="84" cy="224" r="7" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M73,234 L95,234 L96,266 L72,266 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="72" y1="238" x2="58" y2="258" stroke="#2F2A24" stroke-width="1"/>
<line x1="96" y1="238" x2="110" y2="228" stroke="#2F2A24" stroke-width="1"/>
<line x1="79" y1="266" x2="76" y2="280" stroke="#2F2A24" stroke-width="1"/>
<line x1="89" y1="266" x2="92" y2="280" stroke="#2F2A24" stroke-width="1"/>
<text x="128" y="218" font-size="5.0" fill="#4A5C55">「偏矣」</text>
<text x="190" y="320" font-size="4.6" fill="#4A5C55" text-anchor="middle">他不改靶，只改口：说偏，就是把自己的箭让给靶去判</text>
<text x="24" y="342" font-size="4.8" fill="#A2503B">二、报错：把靶套在箭落处，曰「中矣」——此为病</text>
<rect x="26" y="354" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="196" cy="406" r="30" fill="#FBF6EC" fill-opacity="0.6" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="196" cy="406" r="4" fill="#A2503B" fill-opacity="0.4" stroke="#A2503B" stroke-width="0.7"/>
<line x1="162" y1="410" x2="200" y2="406" stroke="#2F2A24" stroke-width="1.2"/>
<text x="156" y="372" font-size="4.0" fill="#2F2A24">箭</text>
<text x="236" y="372" font-size="4.2" fill="#A2503B">靶被拎过来</text>
<circle cx="292" cy="398" r="20" fill="none" stroke="#B9A98F" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="292" y="430" font-size="4.0" fill="#6E6459" text-anchor="middle">原位空了</text>
<circle cx="120" cy="406" r="7" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M109,416 L131,416 L132,450 L108,450 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="131" y1="420" x2="170" y2="420" stroke="#2F2A24" stroke-width="1"/>
<line x1="114" y1="450" x2="111" y2="478" stroke="#2F2A24" stroke-width="1"/>
<line x1="126" y1="450" x2="129" y2="478" stroke="#2F2A24" stroke-width="1"/>
<text x="126" y="398" font-size="5.0" fill="#A2503B">「中矣」</text>
<text x="190" y="522" font-size="4.6" fill="#4A5C55" text-anchor="middle">靶一挪，箭就永远中：此后每一箭都由他这双手判</text>
<text x="24" y="538" font-size="4.8" fill="#2F2A24">第三种最危险，不是因为他撒谎。撒谎的人知道自己撒。</text>
<text x="24" y="554" font-size="4.8" fill="#2F2A24">病是另一种：眼里看见靶外的箭，胸里那支还在靶心——两样都在，他信后者。</text>
<text x="24" y="572" font-size="5.0" fill="#4A5C55">「病病」不是治病，是认病：把「自以为知」当成病来盯，才不染这个病。</text>
<line x1="24" y1="588" x2="338" y2="588" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="596" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="611" font-size="5.2" fill="#2F2A24" text-anchor="middle">病病者，以之为病也，非治之也，乃认之也。</text>
<text x="190" y="624" font-size="4.7" fill="#4A5C55" text-anchor="middle">先认这一句「我可能报错了」，靶才回得来。</text>
<line x1="20" y1="650" x2="360" y2="650" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="664" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="680" font-size="8.4" fill="#2F2A24">《说文》曰：病，疾加也。</text>
<text x="20" y="696" font-size="8.4" fill="#2F2A24">病者，目中见靶外之箭，胸中箭犹在靶。</text>
</svg>