<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 634" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="以正治国：正从止，是一只脚停在它该在的地方" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="634" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 五 十 七 章 · 正</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只脚</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">以正治国，以奇用兵，以无事取天下。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「正」从止——止就是脚趾，正的本义是「一只脚停在它该在的地方」。</text>
<text x="190" y="126" font-size="5.2" fill="#6E6459" text-anchor="middle">所以正不是「对」，是不动：脚不乱换地方，那个地方才立得住。</text>
<text x="24" y="146" font-size="5.2" fill="#A2503B">一、脚乱换地方：换个地方，就换一套说法</text>
<line x1="24" y1="262" x2="246" y2="262" stroke="#2F2A24" stroke-width="1"/>
<path d="M57,230 C55,240 56,251 62,256 C68,260 74,252 75,240 C76,231 72,225 65,225 C60,225 58,226 57,230 Z" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
<circle cx="60" cy="222" r="2.3" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="64.5" cy="219" r="2.0" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="68.5" cy="220" r="1.7" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="72" cy="223" r="1.5" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<path d="M115,230 C113,240 114,251 120,256 C126,260 132,252 133,240 C134,231 130,225 123,225 C118,225 116,226 115,230 Z" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
<circle cx="118" cy="222" r="2.3" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="122.5" cy="219" r="2.0" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="126.5" cy="220" r="1.7" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="130" cy="223" r="1.5" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<path d="M173,230 C171,240 172,251 178,256 C184,260 190,252 191,240 C192,231 188,225 181,225 C176,225 174,226 173,230 Z" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
<circle cx="176" cy="222" r="2.3" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="180.5" cy="219" r="2.0" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="184.5" cy="220" r="1.7" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<circle cx="188" cy="223" r="1.5" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<line x1="58" y1="200" x2="118" y2="200" stroke="#A2503B" stroke-width="0.7" marker-end="url(#arrS)"/>
<line x1="120" y1="206" x2="176" y2="206" stroke="#A2503B" stroke-width="0.7" marker-end="url(#arrS)"/>
<text x="140" y="190" font-size="4.8" fill="#A2503B" text-anchor="middle">年年换新法</text>
<text x="66" y="276" font-size="4.6" fill="#6E6459">三个规矩，三只脚，哪一只都不常</text>
<text x="24" y="302" font-size="5.2" fill="#4A5C55">二、脚站定：同一个地方，明年还是它</text>
<line x1="24" y1="418" x2="246" y2="418" stroke="#2F2A24" stroke-width="1"/>
<path d="M103,386 C101,396 102,407 108,412 C114,416 120,408 121,396 C122,387 118,381 111,381 C106,381 104,382 103,386 Z" stroke="#4A5C55" stroke-width="1" fill="#EFE6D4"/>
<circle cx="106" cy="378" r="2.3" stroke="#4A5C55" stroke-width="0.8" fill="#EFE6D4"/>
<circle cx="110.5" cy="375" r="2.0" stroke="#4A5C55" stroke-width="0.8" fill="#EFE6D4"/>
<circle cx="114.5" cy="376" r="1.7" stroke="#4A5C55" stroke-width="0.8" fill="#EFE6D4"/>
<circle cx="118" cy="379" r="1.5" stroke="#4A5C55" stroke-width="0.8" fill="#EFE6D4"/>
<text x="150" y="392" font-size="4.8" fill="#4A5C55">同一只脚，同一个地方</text>
<text x="150" y="404" font-size="4.5" fill="#6E6459">一笔不动，百姓才敢照着过日子</text>
<line x1="52" y1="356" x2="212" y2="356" stroke="#DCCBB0" stroke-width="0.9"/>
<line x1="64" y1="352" x2="64" y2="360" stroke="#2F2A24" stroke-width="0.9"/>
<text x="64" y="347" font-size="4.2" fill="#6E6459" text-anchor="middle">去</text>
<line x1="108" y1="352" x2="108" y2="360" stroke="#2F2A24" stroke-width="0.9"/>
<text x="108" y="347" font-size="4.2" fill="#6E6459" text-anchor="middle">今</text>
<line x1="152" y1="352" x2="152" y2="360" stroke="#2F2A24" stroke-width="0.9"/>
<text x="152" y="347" font-size="4.2" fill="#6E6459" text-anchor="middle">明</text>
<line x1="196" y1="352" x2="196" y2="360" stroke="#2F2A24" stroke-width="0.9"/>
<text x="196" y="347" font-size="4.2" fill="#6E6459" text-anchor="middle">后</text>
<line x1="112" y1="364" x2="112" y2="374" stroke="#4A5C55" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="220" y="358" font-size="4.6" fill="#4A5C55">年年都落这一处</text>
<text x="112" y="434" font-size="4.6" fill="#6E6459" text-anchor="middle">四个年头，都落在这一处</text>
<text x="24" y="462" font-size="5.2" fill="#2F2A24">「正」从止，止是脚趾：一只脚停在它该在的地方。</text>
<text x="24" y="478" font-size="5.2" fill="#2F2A24">所以正不是「对」，是不动；一个政策最大的德，是明年还是它。</text>
<text x="24" y="494" font-size="5.0" fill="#4A5C55">朝令夕改的地方，不是百姓不听话，是脚没有地方可落。</text>
<line x1="24" y1="512" x2="338" y2="512" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="520" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="536" font-size="6.0" fill="#2F2A24" text-anchor="middle">正，是脚站定；奇，是落单的一手；</text>
<text x="190" y="548" font-size="6.0" fill="#4A5C55" text-anchor="middle">无事，是不给自己加职分。</text>
<line x1="20" y1="574" x2="360" y2="574" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="588" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="604" font-size="8.4" fill="#2F2A24">正，是脚站定；一个政策最大的德，是明年还是它。</text>
</svg>