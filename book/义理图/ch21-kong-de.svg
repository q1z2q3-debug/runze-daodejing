<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="恍惚不是玄，是还没成形就说成形必失真" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="436" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 一 章 · 道 之 为 物</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">由粗到细</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">惚兮恍兮其中有象；窈兮冥兮其中有精。</text>
<rect x="20" y="116" width="340" height="32" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="190" y="137" font-size="8.4" fill="#6E6459" text-anchor="middle">惚兮恍兮：不是一个清楚的东西，是一团还没定形的</text>
<text x="40" y="178" font-size="13" fill="#A2503B">象</text>
<text x="76" y="178" font-size="8.8" fill="#6E6459">其中有个模糊的样子</text>
<text x="40" y="212" font-size="13" fill="#A2503B">物</text>
<text x="76" y="212" font-size="8.8" fill="#6E6459">那样子里，有东西</text>
<line x1="52" y1="188" x2="52" y2="195" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="40" y="246" font-size="13" fill="#4A5C55">精</text>
<text x="76" y="246" font-size="8.8" fill="#6E6459">那东西里，有极细的质</text>
<line x1="52" y1="222" x2="52" y2="229" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="40" y="280" font-size="13" fill="#4A5C55">信</text>
<text x="76" y="280" font-size="8.8" fill="#6E6459">这质可验、不骗人</text>
<line x1="52" y1="256" x2="52" y2="263" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="30" y1="156" x2="30" y2="282" stroke="#E6D8C2" stroke-width="1"/>
<text x="20" y="300" font-size="8.6" fill="#8A7C69">越往里越细，但每一层都是真的：不是越玄越空。</text>
<rect x="20" y="316" width="340" height="46" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="334" font-size="10" fill="#2F2A24" text-anchor="middle" letter-spacing="1">孔德之容，惟道是从。</text>
<text x="190" y="350" font-size="8.4" fill="#6E6459" text-anchor="middle">德的样子，只是跟着道走；不是自己长成一套。</text>
<rect x="20" y="380" width="340" height="42" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="399" font-size="10" fill="#2F2A24" text-anchor="middle" letter-spacing="1">自今及古，其名不去，以阅众甫。</text>
<text x="190" y="415" font-size="8.2" fill="#6E6459" text-anchor="middle">往回看不是怀旧：是拿这条不断的名，看清万物怎么起头。</text>
</svg>