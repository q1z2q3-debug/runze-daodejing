<line x1="96" y1="412" x2="105" y2="428" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="122" cy="408" r="8" fill="none" stroke="#DCCBB0" stroke-width="0.7" stroke-dasharray="2 2"/>
<text x="122" y="398" font-size="4.2" fill="#8A7C69" text-anchor="middle">还没起</text>
<text x="60" y="382" font-size="4.5" fill="#6E6459">手空着，脚下一小块空地</text>
<text x="190" y="478" font-size="4.5" fill="#8A7C69" text-anchor="middle">别人看他没站处，他自己知道站在哪儿</text>
<text x="24" y="501" font-size="5.0" fill="#4A5C55">二、独泊：手还空着，欲还没起</text>
<text x="24" y="520" font-size="4.9" fill="#2F2A24">众人向外抓取：从物、从盛宴、从赞誉、从热闹里取满足。</text>
<text x="24" y="536" font-size="4.9" fill="#2F2A24">体道者淡泊平顺，不起羡慕攀求的征兆——不是压住，是还没起。</text>
<text x="24" y="554" font-size="4.9" fill="#4A5C55">如婴儿之未孩：不是不会笑，是还没有好恶分别。</text>
<line x1="24" y1="572" x2="338" y2="572" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="580" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="596" font-size="5.8" fill="#2F2A24" text-anchor="middle">众人熙熙，我独未兆；</text>
<text x="190" y="608" font-size="5.6" fill="#4A5C55" text-anchor="middle">未兆者，欲未起也。</text>
<line x1="20" y1="634" x2="360" y2="634" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="648" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="664" font-size="8.4" fill="#2F2A24">众人熙熙，我独未兆；未兆者，欲未起也。</text>
<text x="20" y="680" font-size="8.4" fill="#2F2A24">泊不是冷，是停在没起念的那一处。</text>
</svg>