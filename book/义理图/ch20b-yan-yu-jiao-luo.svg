<text x="190" y="176" font-size="4.5" fill="#6E6459" text-anchor="middle">案上摆满了，人人手上都有杯</text>
<text x="190" y="296" font-size="4.5" fill="#8A7C69" text-anchor="middle">熙熙：热闹有个尽头，散席之后各自回家</text>
<text x="24" y="319" font-size="5.0" fill="#A2503B">一、熙熙：都挤在案后，谁也没有落后</text>
