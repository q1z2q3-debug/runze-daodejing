<rect x="0" y="0" width="380" height="706" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 章 · 未 兆</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">宴与角落</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">众人熙熙，如享太牢，如春登台；我独泊兮其未兆。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">「泊」不是冷，是停在没起念的那一处。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">「未兆」：不是把欲按下去，是它还没起。</text>
