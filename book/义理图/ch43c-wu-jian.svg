<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="无有入无间：它不是凿开门缝进去的，它是那扇门本身就有的东西" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="612" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 三 章 · 其 三</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一 块 石 头</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">无有入无间。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.5" fill="#2F2A24" text-anchor="middle">「间」从门从月：门关着，月光从缝里透进来——那道缝，就是「间」。无间，是连一道缝都没有。</text>
<text x="190" y="127" font-size="4.5" fill="#6E6459">这是「有」的极致：密合、无缝、外面进不去。</text>
<text x="24" y="152" font-size="5.0" fill="#4A5C55">一、无间：一块密不透风的石</text>
<rect x="26" y="164" width="328" height="136" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="276" x2="340" y2="276" stroke="#DCCBB0" stroke-width="0.9"/>
<rect x="122" y="198" width="120" height="78" fill="#D9CFBB" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="126" y1="204" x2="216" y2="209" stroke="#B8AC94" stroke-width="0.4"/>
<line x1="126" y1="215" x2="216" y2="220" stroke="#B8AC94" stroke-width="0.4"/>
<line x1="126" y1="226" x2="216" y2="231" stroke="#B8AC94" stroke-width="0.4"/>
<line x1="126" y1="237" x2="216" y2="242" stroke="#B8AC94" stroke-width="0.4"/>
<line x1="126" y1="248" x2="216" y2="253" stroke="#B8AC94" stroke-width="0.4"/>
<line x1="126" y1="259" x2="216" y2="264" stroke="#B8AC94" stroke-width="0.4"/>
<line x1="126" y1="270" x2="216" y2="275" stroke="#B8AC94" stroke-width="0.4"/>
<path d="M104,216 q4,-4 8,0 q-4,4 -8,0" fill="#DCE9E3" stroke="#A9C3BC" stroke-width="0.5"/>
<path d="M104,232 q4,-4 8,0 q-4,4 -8,0" fill="#DCE9E3" stroke="#A9C3BC" stroke-width="0.5"/>
<path d="M104,248 q4,-4 8,0 q-4,4 -8,0" fill="#DCE9E3" stroke="#A9C3BC" stroke-width="0.5"/>
<line x1="108" y1="234" x2="120" y2="234" stroke="#A9C3BC" stroke-width="0.8" marker-end="url(#arrS)"/>
<text x="86" y="230" font-size="4.0" fill="#7E9A92">进不去</text>
<rect x="272" y="200" width="46" height="76" fill="#E4D9C0" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="295" y1="206" x2="295" y2="218" stroke="#B8AC94" stroke-width="0.5"/>
<text x="295" y="240" font-size="4.4" fill="#6E6459" text-anchor="middle">门</text>
<text x="295" y="254" font-size="3.7" fill="#6E6459" text-anchor="middle">关严</text>
<text x="190" y="290" font-size="4.3" fill="#2F2A24" text-anchor="middle">外面有再多水，也只是停在表面上</text>
<text x="24" y="318" font-size="5.0" fill="#4A5C55">二、无有：里面一直在动</text>
<rect x="26" y="330" width="328" height="146" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="452" x2="340" y2="452" stroke="#DCCBB0" stroke-width="0.9"/>
<rect x="122" y="360" width="120" height="86" fill="#E9E0CB" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M130,368 q14,-4 28,0 t28,0 t28,0 t20,0" fill="none" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="4 3"/>
<path d="M130,384 q14,-4 28,0 t28,0 t28,0 t20,0" fill="none" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="4 3"/>
<path d="M130,400 q14,-4 28,0 t28,0 t28,0 t20,0" fill="none" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="4 3"/>
<path d="M130,416 q14,-4 28,0 t28,0 t28,0 t20,0" fill="none" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="4 3"/>
<path d="M130,432 q14,-4 28,0 t28,0 t28,0 t20,0" fill="none" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="150" y1="380" x2="168" y2="374" stroke="#A2503B" stroke-width="0.6" marker-end="url(#arrS)"/>
<line x1="150" y1="404" x2="168" y2="398" stroke="#A2503B" stroke-width="0.6" marker-end="url(#arrS)"/>
<line x1="150" y1="428" x2="168" y2="422" stroke="#A2503B" stroke-width="0.6" marker-end="url(#arrS)"/>
<path d="M100,404 l14,-4 M100,408 l14,0" fill="none" stroke="#A2503B" stroke-width="0.7"/>
<text x="84" y="402" font-size="4.0" fill="#A2503B" text-anchor="middle">变，只是慢</text>
<text x="190" y="462" font-size="4.3" fill="#2F2A24" text-anchor="middle">凡是还在变的，里面就有「无」在起作用</text>
<text x="290" y="392" font-size="5.0" fill="#A2503B">无</text>
<text x="290" y="406" font-size="3.9" fill="#8A7C69">不占位置</text>
<path d="M286,392 l-30,0" stroke="#A2503B" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="24" y1="486" x2="356" y2="486" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="494" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="510" font-size="4.8" fill="#2F2A24" text-anchor="middle">不是从外面钻进去的——是那扇门本身就有的东西。</text>
<text x="190" y="523" font-size="4.5" fill="#4A5C55" text-anchor="middle">占地方的东西要别人让开；不占地方的，从来不需要谁让。</text>
<line x1="20" y1="540" x2="360" y2="540" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="554" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="570" font-size="8.4" fill="#2F2A24">不是从外面钻进去的——是那扇门本身就有的东西。</text>
<text x="20" y="586" font-size="8.4" fill="#2F2A24">不占地方的，从来不需要谁让。</text>
</svg>