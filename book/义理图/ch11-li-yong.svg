<text x="58" y="424" font-size="10" fill="#8A7C69" text-anchor="middle">室</text>
<text x="96" y="362" font-size="11" fill="#A2503B">墙、户、牖</text>
<text x="96" y="380" font-size="10" fill="#6E6459">有 · 立界</text>
<text x="96" y="408" font-size="11" fill="#4A5C55">室中之虚</text>
<text x="96" y="426" font-size="10" fill="#6E6459">无 · 留虚</text>
<text x="250" y="380" font-size="11" fill="#2F2A24">居而能通</text>
<text x="250" y="398" font-size="10.5" fill="#6E6459">室之用</text>
<rect x="20" y="456" width="340" height="58" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="480" font-size="13" fill="#2F2A24" text-anchor="middle" letter-spacing="1">有之以为利，无之以为用</text>
<text x="190" y="500" font-size="10" fill="#6E6459" text-anchor="middle">不是先有器壁再补一个空，是器壁把那个空撑出来。</text>
<text x="190" y="534" font-size="10.5" fill="#6E6459" text-anchor="middle">该立多少界，该留多少空——这是一份分寸表，不是技巧。</text>
<line x1="20" y1="556" x2="360" y2="556" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="570" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="586" font-size="8.4" fill="#2F2A24">有之以为利，无之以为用。</text>
<text x="20" y="602" font-size="8.4" fill="#2F2A24">有形给依托，虚空给功能。</text>
</svg>