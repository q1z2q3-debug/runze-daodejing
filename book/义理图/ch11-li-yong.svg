<line x1="52.5" y1="145.9" x2="46.0" y2="134.7" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="56.0" y1="145.0" x2="56.0" y2="132.0" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="59.5" y1="145.9" x2="66.0" y2="134.7" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="62.1" y1="148.5" x2="73.3" y2="142.0" stroke="#2F2A24" stroke-width="0.7"/>
<circle cx="56" cy="152" r="7" fill="none" stroke="#A2503B" stroke-width="1"/>
<text x="56" y="190" font-size="10" fill="#8A7C69" text-anchor="middle">毂</text>
<text x="96" y="130" font-size="11" fill="#A2503B">辐、毂、舆</text>
<text x="96" y="148" font-size="10" fill="#6E6459">有 · 立界</text>
<text x="96" y="174" font-size="11" fill="#4A5C55">毂中之虚</text>
<text x="96" y="192" font-size="10" fill="#6E6459">无 · 让位</text>
<text x="248" y="146" font-size="11" fill="#2F2A24">轴穿而转</text>
<text x="248" y="164" font-size="10.5" fill="#6E6459">车之用</text>
<rect x="20" y="216" width="340" height="106" fill="#F6EFE0" stroke="#DCCBB0" stroke-width="1.0"/>
<path d="M 34 252 Q 56 288 78 252" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="32" y1="252" x2="80" y2="252" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="34" y1="252" x2="78" y2="252" stroke="#A2503B" stroke-width="0.5" opacity="0.6"/>
<text x="56" y="304" font-size="10" fill="#8A7C69" text-anchor="middle">器</text>
<text x="96" y="244" font-size="11" fill="#A2503B">黏土、器壁</text>
<text x="96" y="262" font-size="10" fill="#6E6459">有 · 立界</text>
<text x="96" y="288" font-size="11" fill="#4A5C55">器腹之腔</text>
<text x="96" y="306" font-size="10" fill="#6E6459">无 · 让位</text>
<text x="248" y="260" font-size="11" fill="#2F2A24">盛而能容</text>
<text x="248" y="278" font-size="10.5" fill="#6E6459">器之用</text>
<rect x="20" y="330" width="340" height="106" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<rect x="32" y="366" width="48" height="30" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="48" y1="366" x2="48" y2="396" stroke="#A2503B" stroke-width="1"/>
<text x="56" y="418" font-size="10" fill="#8A7C69" text-anchor="middle">室</text>
<text x="96" y="358" font-size="11" fill="#A2503B">墙、户、牖</text>
<text x="96" y="376" font-size="10" fill="#6E6459">有 · 立界</text>
<text x="96" y="402" font-size="11" fill="#4A5C55">室中之虚</text>
<text x="96" y="420" font-size="10" fill="#6E6459">无 · 让位</text>
<text x="248" y="374" font-size="11" fill="#2F2A24">居而能通</text>
<text x="248" y="392" font-size="10.5" fill="#6E6459">室之用</text>
<rect x="20" y="450" width="340" height="58" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="474" font-size="13" fill="#2F2A24" text-anchor="middle" letter-spacing="1">有之以为利，无之以为用</text>
<text x="190" y="494" font-size="10" fill="#6E6459" text-anchor="middle">不是先有器壁再补一个空，是器壁把那个空撑出来。</text>
<text x="190" y="528" font-size="10.5" fill="#6E6459" text-anchor="middle">该立多少界，该留多少空——这是一份分寸表，不是技巧。</text>
</svg>