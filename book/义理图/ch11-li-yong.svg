<text x="58" y="192" font-size="10" fill="#8A7C69" text-anchor="middle">毂</text>
<text x="96" y="130" font-size="11" fill="#A2503B">辐、毂、舆</text>
<text x="96" y="148" font-size="10" fill="#6E6459">有 · 立界</text>
<text x="96" y="176" font-size="11" fill="#4A5C55">毂中之虚</text>
<text x="96" y="194" font-size="10" fill="#6E6459">无 · 留虚</text>
<text x="250" y="148" font-size="11" fill="#2F2A24">轴穿而转</text>
<text x="250" y="166" font-size="10.5" fill="#6E6459">车之用</text>
