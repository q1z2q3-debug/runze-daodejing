<circle cx="46" cy="140.0" r="4.6" fill="#F8F3E6" stroke="#A2503B" stroke-width="0.8"/>
<text x="46" y="170" font-size="4.6" fill="#8A7C69" text-anchor="middle">毂</text>
<text x="72" y="120" font-size="5.0" fill="#2F2A24">三十辐共一毂，当其无，有车之用。</text>
<text x="72" y="140" font-size="4.5" fill="#A2503B">有·利　</text>
<text x="96" y="140" font-size="4.4" fill="#6E6459">辐、毂、舆：一圈骨架，立界给依托</text>
<text x="72" y="157" font-size="4.5" fill="#4A5C55">无·用　</text>
<text x="96" y="157" font-size="4.4" fill="#6E6459">毂中那处虚位：轴穿得进，轮转得动</text>
<rect x="20" y="184" width="340" height="76" fill="#F6EFE0" stroke="#DCCBB0" stroke-width="1.0"/>
<path d="M 29 212.0 Q 46 239.0 63 212.0 Z" fill="#E9F0E6" stroke="none"/>
<path d="M 29 212.0 Q 46 239.0 63 212.0" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="28" y1="212.0" x2="64" y2="212.0" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M 32 212.5 Q 46 234.0 60 212.5" fill="none" stroke="#2F2A24" stroke-width="0.35" opacity="0.7"/>
<text x="46" y="252" font-size="4.6" fill="#8A7C69" text-anchor="middle">器</text>
<text x="72" y="202" font-size="5.0" fill="#2F2A24">埏埴以为器，当其无，有器之用。</text>
<text x="72" y="222" font-size="4.5" fill="#A2503B">有·利　</text>
<text x="96" y="222" font-size="4.4" fill="#6E6459">黏土、器壁：围成一圈，给承载力</text>
<text x="72" y="239" font-size="4.5" fill="#4A5C55">无·用　</text>
<text x="96" y="239" font-size="4.4" fill="#6E6459">器腹之腔：盛得住，倒得出</text>
<rect x="20" y="266" width="340" height="76" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<path d="M 29 299.0 L 46 288.0 L 63 299.0 z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="30" y="299.0" width="32" height="18" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="35" y="307.0" width="7" height="10" fill="#E4EAE0" stroke="#2F2A24" stroke-width="0.7"/>
<rect x="48" y="302.0" width="8" height="6" fill="#E4EAE0" stroke="#2F2A24" stroke-width="0.7"/>
<line x1="52" y1="302.0" x2="52" y2="308.0" stroke="#2F2A24" stroke-width="0.35"/>
<text x="46" y="334" font-size="4.6" fill="#8A7C69" text-anchor="middle">室</text>
<text x="72" y="284" font-size="5.0" fill="#2F2A24">凿户牖以为室，当其无，有室之用。</text>
<text x="72" y="304" font-size="4.5" fill="#A2503B">有·利　</text>
<text x="96" y="304" font-size="4.4" fill="#6E6459">墙、梁、户牖之框：划界、遮雨、立框</text>
<text x="72" y="321" font-size="4.5" fill="#4A5C55">无·用　</text>
<text x="96" y="321" font-size="4.4" fill="#6E6459">室中之虚空：住得下，往来得开</text>
<rect x="20" y="356" width="340" height="50" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="376" font-size="6.4" fill="#2F2A24" text-anchor="middle" letter-spacing="1">有之以为利，无之以为用</text>
<text x="190" y="392" font-size="4.6" fill="#6E6459" text-anchor="middle">不是先有器壁再补一个空，是器壁把那个空撑出来。</text>
<text x="190" y="418" font-size="4.6" fill="#6E6459" text-anchor="middle">该立多少界，该留多少空——这是一份分寸表，不是技巧。</text>
<line x1="20" y1="440" x2="360" y2="440" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="454" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="470" font-size="8.4" fill="#2F2A24">有之以为利，无之以为用。</text>
<text x="20" y="486" font-size="8.4" fill="#2F2A24">有形给依托，虚空给功能。</text>
</svg>