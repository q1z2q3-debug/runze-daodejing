<text x="58" y="308" font-size="10" fill="#8A7C69" text-anchor="middle">器</text>
<text x="96" y="246" font-size="11" fill="#A2503B">黏土、器壁</text>
<text x="96" y="264" font-size="10" fill="#6E6459">有 · 立界</text>
<text x="96" y="292" font-size="11" fill="#4A5C55">器腹之腔</text>
<text x="96" y="310" font-size="10" fill="#6E6459">无 · 留虚</text>
<text x="250" y="264" font-size="11" fill="#2F2A24">盛而能容</text>
<text x="250" y="282" font-size="10.5" fill="#6E6459">器之用</text>
