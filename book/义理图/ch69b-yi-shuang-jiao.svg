<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="轻敌不是一个念头，是一个姿势：举趾高，心不固矣" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="720" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 九 章 · 轻</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一双抬高的脚</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">祸莫大于轻敌，轻敌几丧吾宝。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">《左传》斗伯比只看了一眼屈瑕走路：「举趾高，心不固矣」——莫敖必败。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">轻敌先长在脚上：脚一抬，三宝先落。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、趾抬得高：脚下虚，心就没落处</text>
<rect x="26" y="160" width="328" height="146" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="288" x2="340" y2="288" stroke="#2F2A24" stroke-width="1"/>
<circle cx="176" cy="194" r="6.4" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M170,202 L184,201 L190,244 L174,246 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="177" y1="246" x2="168" y2="282" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M160,282 L176,282 Q180,286 174,288 L160,288 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="188" y1="244" x2="206" y2="222" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="206" y1="222" x2="216" y2="236" stroke="#2F2A24" stroke-width="1.2"/>
<g transform="translate(219,231) rotate(-32)"><ellipse cx="0" cy="0" rx="9" ry="4.6" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/><line x1="7" y1="-2" x2="11" y2="-3" stroke="#2F2A24" stroke-width="0.8"/><line x1="8" y1="0" x2="12" y2="0" stroke="#2F2A24" stroke-width="0.8"/><line x1="7" y1="2" x2="11" y2="3" stroke="#2F2A24" stroke-width="0.8"/></g>
<line x1="212" y1="244" x2="212" y2="286" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="2 2"/>
<line x1="230" y1="246" x2="230" y2="286" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="2 2"/>
<text x="221" y="270" font-size="4.5" fill="#A2503B" text-anchor="middle">虚</text>
<line x1="258" y1="278" x2="238" y2="248" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="262" y="282" font-size="4.5" fill="#A2503B">举趾高</text>
<text x="190" y="322" font-size="4.6" fill="#A2503B" text-anchor="middle">趾离地一寸，整只脚就没了根：心也跟着浮起来</text>
<text x="24" y="366" font-size="4.8" fill="#4A5C55">二、脚放平：根落在土里，心才稳</text>
<rect x="26" y="378" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="502" x2="340" y2="502" stroke="#2F2A24" stroke-width="1"/>
<circle cx="176" cy="412" r="6.4" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M170,420 L184,419 L184,464 L170,464 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="166" y1="464" x2="163" y2="496" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M154,496 L172,496 Q176,500 170,502 L154,502 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="188" y1="464" x2="191" y2="496" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M182,496 L200,496 Q204,500 198,502 L182,502 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<path d="M160,504 L200,504 L196,510 L164,510 Z" fill="#4A5C55" opacity="0.16" stroke="none"/>
<text x="190" y="522" font-size="4.6" fill="#4A5C55" text-anchor="middle">两只脚都落在土上：脚一放平，三宝才拿得住</text>
<text x="24" y="552" font-size="4.8" fill="#2F2A24">轻敌不是心里的一个念头，它先长在脚上：步子一浮，人就先浮了。</text>
<text x="24" y="568" font-size="4.8" fill="#2F2A24">轻敌几丧吾宝——三宝先落：慈落了，俭落了，不敢为先也落了。</text>
<text x="24" y="586" font-size="5.0" fill="#4A5C55">脚底有没有土，别人一眼就看得见。</text>
<line x1="24" y1="602" x2="338" y2="602" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="610" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="625" font-size="5.2" fill="#2F2A24" text-anchor="middle">斗伯比一眼而知其败：举趾高，心不固矣。</text>
<text x="190" y="638" font-size="4.9" fill="#4A5C55" text-anchor="middle">轻敌先长在脚上，脚一抬，三宝先落。</text>
<line x1="20" y1="664" x2="360" y2="664" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="678" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="694" font-size="8.4" fill="#2F2A24">斗伯比一眼而知其败：举趾高，心不固矣。</text>
<text x="20" y="710" font-size="8.4" fill="#2F2A24">轻敌先长在脚上，脚一抬，三宝先落。</text>
</svg>