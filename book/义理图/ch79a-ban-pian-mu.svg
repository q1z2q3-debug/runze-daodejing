<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 728" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="契剖开了，所以只剩一半；它不响，但它一直在" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="728" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 九 章 · 契</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">半片木</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">是以圣人执左契，而不责于人。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">契，刻木为信：一剖两半，债权人执左，负债者执右。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">两半只有并起来才看得出齿；分开时，各自只是一块木。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、一剖两半：齿要对得上</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="86" y="206" width="46" height="88" rx="2" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="150" y="206" width="46" height="88" rx="2" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="134" y1="206" x2="134" y2="294" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="132" y1="220" x2="118" y2="220" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="136" y1="220" x2="150" y2="220" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="132" y1="240" x2="118" y2="240" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="136" y1="240" x2="150" y2="240" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="132" y1="260" x2="118" y2="260" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="136" y1="260" x2="150" y2="260" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="132" y1="280" x2="118" y2="280" stroke="#2F2A24" stroke-width="1.4"/>
<line x1="136" y1="280" x2="150" y2="280" stroke="#2F2A24" stroke-width="1.4"/>
<text x="108" y="192" font-size="4.3" fill="#A2503B" text-anchor="middle">左契</text>
<text x="172" y="192" font-size="4.3" fill="#6E6459" text-anchor="middle">右契</text>
<text x="216" y="236" font-size="4.3" fill="#A2503B">齿对得上，</text>
<text x="216" y="248" font-size="4.3" fill="#6E6459">才认得出这一份</text>
<text x="190" y="330" font-size="4.6" fill="#4A5C55" text-anchor="middle">剖开过，所以只剩一半：它记得住，是靠那道齿</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、执在手上，但不伸出去</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="500" x2="330" y2="500" stroke="#2F2A24" stroke-width="1"/>
<circle cx="120" cy="410" r="8" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M110,424 L130,424 L132,470 L108,470 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="110" y1="470" x2="108" y2="498" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="130" y1="470" x2="132" y2="498" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="122" y="436" width="26" height="34" rx="2" fill="#DED2B8" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="122" y1="442" x2="134" y2="442" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="122" y1="451" x2="134" y2="451" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="122" y1="460" x2="134" y2="460" stroke="#2F2A24" stroke-width="0.9"/>
<text x="136" y="432" font-size="4.2" fill="#A2503B">左契在手上</text>
<circle cx="272" cy="414" r="7" fill="none" stroke="#B9A98F" stroke-width="1"/>
<path d="M264,426 L280,426 L282,466 L262,466 Z" fill="none" stroke="#B9A98F" stroke-width="1"/>
<text x="272" y="484" font-size="4.2" fill="#B9A98F" text-anchor="middle">欠他的人</text>
<path d="M150,454 L204,454" fill="none" stroke="#A2503B" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="204" y1="448" x2="204" y2="460" stroke="#A2503B" stroke-width="1.2"/>
<text x="204" y="472" font-size="4.2" fill="#A2503B" text-anchor="middle">停在这里</text>
<text x="190" y="534" font-size="4.6" fill="#4A5C55" text-anchor="middle">执而不责：有凭据，却不用它去索</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">大怨既成，和亦有痕；善者不待其成。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">契不响，账出声：一个只存着，一个天天在算。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">有而不取，是为有德。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="5.2" fill="#2F2A24" text-anchor="middle">是以圣人执左契，而不责于人。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">执契而不责。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">是以圣人执左契，而不责于人。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">契者，刻木为信，一剖两半；左契在债权人手，右契在负债者手。</text>
</svg>