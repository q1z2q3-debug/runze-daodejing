<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 684" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="慈从心兹，兹是草木多益：心里长草，草不问落在哪儿" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="684" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 七 章 · 慈</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一丛草</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">一曰慈，二曰俭，三曰不敢为天下先。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「慈」，《说文》「爱也」，从心、兹声；兹是「草木多益」——草越长越多。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">爱有对象，慈没有：它是那片草，草长出来，不管落在哪儿。</text>
<text x="24" y="148" font-size="4.8" fill="#4A5C55">一、心里长草：不圈、不指，四面都长</text>
<rect x="26" y="160" width="328" height="132" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="190" cy="226" r="30" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<text x="190" y="229" font-size="9.5" fill="#2F2A24" text-anchor="middle">心</text>
<path d="M182,222 Q178.4,205.5 176,192" fill="none" stroke="#4A5C55" stroke-width="1.3"/>
