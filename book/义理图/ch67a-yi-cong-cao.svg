<path d="M220,220 Q227,212 233,204" fill="none" stroke="#4A5C55" stroke-width="1.0" opacity="0.75"/>
<path d="M220,220 Q233,212 239,204" fill="none" stroke="#4A5C55" stroke-width="1.0" opacity="0.75"/>
<path d="M216,240 Q223,232 229,224" fill="none" stroke="#4A5C55" stroke-width="1.0" opacity="0.75"/>
<path d="M216,240 Q229,232 235,224" fill="none" stroke="#4A5C55" stroke-width="1.0" opacity="0.75"/>
<path d="M182,256 Q179,264 179,274" fill="none" stroke="#4A5C55" stroke-width="1.0" opacity="0.75"/>
<path d="M182,256 Q185,264 185,274" fill="none" stroke="#4A5C55" stroke-width="1.0" opacity="0.75"/>
<path d="M200,256 Q197,264 197,274" fill="none" stroke="#4A5C55" stroke-width="1.0" opacity="0.75"/>
<path d="M200,256 Q203,264 203,274" fill="none" stroke="#4A5C55" stroke-width="1.0" opacity="0.75"/>
<text x="190" y="308" font-size="4.6" fill="#4A5C55" text-anchor="middle">草往外长，四面都有：不圈定一个对象</text>
<text x="24" y="328" font-size="4.8" fill="#A2503B">二、圈住一棵：那是爱，不是慈</text>
<rect x="26" y="340" width="328" height="132" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="40" y1="444" x2="340" y2="444" stroke="#2F2A24" stroke-width="1"/>
<path d="M94,444 Q97,414 92,404" fill="none" stroke="#4A5C55" stroke-width="1.1" opacity="0.45"/>
<path d="M100,444 Q103,414 98,392" fill="none" stroke="#4A5C55" stroke-width="1.1" opacity="0.45"/>
<path d="M106,444 Q109,414 104,404" fill="none" stroke="#4A5C55" stroke-width="1.1" opacity="0.45"/>
<path d="M184,444 Q187,414 182,404" fill="none" stroke="#4A5C55" stroke-width="1.1" opacity="0.85"/>
<path d="M190,444 Q193,414 188,392" fill="none" stroke="#4A5C55" stroke-width="1.1" opacity="0.85"/>
<path d="M196,444 Q199,414 194,404" fill="none" stroke="#4A5C55" stroke-width="1.1" opacity="0.85"/>
<path d="M274,444 Q277,414 272,404" fill="none" stroke="#4A5C55" stroke-width="1.1" opacity="0.45"/>
<path d="M280,444 Q283,414 278,392" fill="none" stroke="#4A5C55" stroke-width="1.1" opacity="0.45"/>
<path d="M286,444 Q289,414 284,404" fill="none" stroke="#4A5C55" stroke-width="1.1" opacity="0.45"/>
<circle cx="190" cy="420" r="34" fill="none" stroke="#A2503B" stroke-width="1" stroke-dasharray="3 3"/>
<text x="190" y="380" font-size="4.4" fill="#A2503B" text-anchor="middle">圈住这一棵</text>
<text x="100" y="460" font-size="4.2" fill="#A89577" text-anchor="middle">其余在外</text>
<text x="280" y="460" font-size="4.2" fill="#A89577" text-anchor="middle">其余在外</text>
<text x="190" y="488" font-size="4.6" fill="#6E6459" text-anchor="middle">爱护一棵，护不住就拼命；慈护一片，护的时候极稳</text>
<text x="24" y="506" font-size="4.8" fill="#2F2A24">慈不是「心里有个喜欢的人」，是「心里有一片自己在长的东西」。</text>
<text x="24" y="522" font-size="4.8" fill="#2F2A24">草不会因为护一棵，就把别的拔掉。</text>
<text x="24" y="540" font-size="5.0" fill="#4A5C55">慈故能勇：护的是一片生机，不用拼命，反而极稳。</text>
<line x1="24" y1="556" x2="338" y2="556" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="564" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="579" font-size="5.4" fill="#2F2A24" text-anchor="middle">慈从心兹，兹者草木多益；</text>
<text x="190" y="592" font-size="4.9" fill="#4A5C55" text-anchor="middle">心中自有草长，不问其落于何处。</text>
<line x1="20" y1="618" x2="360" y2="618" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="632" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="648" font-size="8.4" fill="#2F2A24">慈从心兹，兹者草木多益；心中自有草长，不问其落于何处。</text>
<text x="20" y="664" font-size="8.4" fill="#2F2A24">爱护一棵，慈护一片：护的时候不拼命，反而极稳。</text>
</svg>