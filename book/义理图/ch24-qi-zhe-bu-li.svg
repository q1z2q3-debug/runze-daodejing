<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="两个动作，一个方向：想越过自己本来的位置" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="452" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 四 章 · 余 食 赘 行</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">企者不立</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">一个求高，一个求快；动机是同一个。</text>
<text x="20" y="118" font-size="8.8" fill="#A2503B">企：举踵</text>
<line x1="24" y1="162" x2="158" y2="162" stroke="#E6D8C2" stroke-width="1"/>
<line x1="64" y1="162" x2="88" y2="146" stroke="#A2503B" stroke-width="1.2"/>
<circle cx="64" cy="162" r="2.6" fill="#A2503B"/>
<line x1="88" y1="146" x2="88" y2="162" stroke="#DCCBB0" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="100" y1="146" x2="100" y2="124" stroke="#A2503B" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="96" y1="146" x2="104" y2="146" stroke="#A2503B" stroke-width="1"/>
<line x1="96" y1="124" x2="104" y2="124" stroke="#A2503B" stroke-width="1"/>
<text x="110" y="130" font-size="8.0" fill="#6E6459">借来的高度</text>
<text x="110" y="144" font-size="7.8" fill="#8A7C69">力气一松，落回原高</text>
<text x="186" y="118" font-size="8.8" fill="#4A5C55">跨：大步越</text>
<line x1="182" y1="162" x2="356" y2="162" stroke="#E6D8C2" stroke-width="1"/>
<ellipse cx="200" cy="159" rx="6" ry="3" fill="none" stroke="#4A5C55" stroke-width="1"/>
<ellipse cx="340" cy="159" rx="6" ry="3" fill="none" stroke="#4A5C55" stroke-width="1"/>
<line x1="206" y1="159" x2="334" y2="159" stroke="#DCCBB0" stroke-width="1" stroke-dasharray="3 3"/>
<text x="206" y="142" font-size="7.8" fill="#8A7C69">一步顶两步：半步要还</text>
<text x="20" y="180" font-size="8.4" fill="#8A7C69">不是劝人别努力：是这两个动作，都离开了本来的位置。</text>
<text x="30" y="212" font-size="9.4" fill="#A2503B">自见</text>
<line x1="74" y1="207" x2="96" y2="207" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="102" y="212" font-size="9.4" fill="#6E6459">不明</text>
<text x="202" y="212" font-size="9.4" fill="#A2503B">自是</text>
<line x1="246" y1="207" x2="268" y2="207" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="274" y="212" font-size="9.4" fill="#6E6459">不彰</text>
<text x="30" y="242" font-size="9.4" fill="#A2503B">自伐</text>
<line x1="74" y1="237" x2="96" y2="237" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="102" y="242" font-size="9.4" fill="#6E6459">无功</text>
<text x="202" y="242" font-size="9.4" fill="#A2503B">自矜</text>
<line x1="246" y1="237" x2="268" y2="237" stroke="#C9B79A" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="274" y="242" font-size="9.4" fill="#6E6459">不长</text>
<text x="20" y="270" font-size="8.4" fill="#8A7C69">四个词是同一件事：把自己往前挪了半步。</text>
<rect x="20" y="288" width="162" height="48" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="101" y="306" font-size="9.4" fill="#A2503B" text-anchor="middle">余食</text>
<text x="101" y="321" font-size="7.8" fill="#6E6459" text-anchor="middle">吃饱了，还要再添一口</text>
<rect x="198" y="288" width="162" height="48" fill="#F6EFE0" stroke="#C9B79A" stroke-width="1.0"/>
<text x="279" y="306" font-size="9.4" fill="#A2503B" text-anchor="middle">赘行</text>
<text x="279" y="321" font-size="7.8" fill="#6E6459" text-anchor="middle">身上多长出来的一块</text>
<rect x="20" y="352" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="371" font-size="10.4" fill="#2F2A24" text-anchor="middle" letter-spacing="1">物或恶之，故有道者不处。</text>
<text x="190" y="387" font-size="8.4" fill="#6E6459" text-anchor="middle">不处不是割掉，是不长在那儿。</text>
<line x1="20" y1="404" x2="360" y2="404" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="418" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="434" font-size="8.4" fill="#2F2A24">借来的高度站不住，省下的步子走不远。</text>
<text x="20" y="450" font-size="8.4" fill="#2F2A24">不处不是割掉，是不长——约束是按住它，不处是根本不在那儿站。</text>
</svg>