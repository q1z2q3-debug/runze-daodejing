<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 770" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="四层取法，取到无可取" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="770" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 五 章 · 四 法</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">四法：交到顶</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">人法地，地法天，天法道，道法自然。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">「法」是取法、以为则：一层比一层根本，不是层层复制。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">自然：自，自身；然，如是——自己如此，不是今语「自然界」。</text>
<rect x="26" y="152" width="328" height="226" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="168" y1="364" x2="168" y2="226" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="176" y1="364" x2="176" y2="226" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="168" y1="358" x2="176" y2="351" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="349" x2="176" y2="342" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="340" x2="176" y2="333" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="331" x2="176" y2="324" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="322" x2="176" y2="315" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="313" x2="176" y2="306" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="304" x2="176" y2="297" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="295" x2="176" y2="288" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="286" x2="176" y2="279" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="277" x2="176" y2="270" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="268" x2="176" y2="261" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="259" x2="176" y2="252" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="250" x2="176" y2="243" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="241" x2="176" y2="234" stroke="#8A7C69" stroke-width="0.8"/>
<line x1="168" y1="232" x2="176" y2="225" stroke="#8A7C69" stroke-width="0.8"/>
<ellipse cx="172" cy="358" rx="12" ry="4.2" fill="#EADFC8" stroke="#A2503B" stroke-width="1.0"/>
<line x1="168" y1="354" x2="177" y2="365" stroke="#A2503B" stroke-width="0.7"/>
<text x="154" y="359" font-size="8.4" fill="#2F2A24" text-anchor="end">人</text>
<text x="192" y="359" font-size="3.9" fill="#6E6459">（帛书本作「王」）</text>
<ellipse cx="172" cy="324" rx="12" ry="4.2" fill="#EADFC8" stroke="#A2503B" stroke-width="1.0"/>
<line x1="168" y1="320" x2="177" y2="331" stroke="#A2503B" stroke-width="0.7"/>
<text x="154" y="325" font-size="8.4" fill="#2F2A24" text-anchor="end">地</text>
<text x="192" y="325" font-size="3.9" fill="#6E6459">承载而不居功</text>
<ellipse cx="172" cy="284" rx="12" ry="4.2" fill="#EADFC8" stroke="#A2503B" stroke-width="1.0"/>
<line x1="168" y1="280" x2="177" y2="291" stroke="#A2503B" stroke-width="0.7"/>
<text x="154" y="285" font-size="8.4" fill="#2F2A24" text-anchor="end">天</text>
<text x="192" y="285" font-size="3.9" fill="#6E6459">覆照而无私</text>
<ellipse cx="172" cy="246" rx="12" ry="4.2" fill="#EADFC8" stroke="#A2503B" stroke-width="1.0"/>
<line x1="168" y1="242" x2="177" y2="253" stroke="#A2503B" stroke-width="0.7"/>
<text x="154" y="247" font-size="8.4" fill="#2F2A24" text-anchor="end">道</text>
<text x="192" y="247" font-size="3.9" fill="#6E6459">混成而独立</text>
<path d="M168,224 L168,192 C168,178 198,178 198,194" fill="none" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M198,194 C198,208 178,210 176,244" fill="none" stroke="#A2503B" stroke-width="1.1"/>
<ellipse cx="184" cy="202" rx="12" ry="10" fill="none" stroke="#A2503B" stroke-width="1.0"/>
<text x="226" y="206" font-size="3.9" fill="#4A5C55">绳头绕回自己身上系住</text>
<text x="226" y="218" font-size="3.9" fill="#4A5C55">——上面没有下一个挂钩</text>
<text x="190" y="168" font-size="4.2" fill="#A2503B" text-anchor="middle">上面没有更高的东西</text>
<text x="24" y="391" font-size="5.0" fill="#A2503B">一、一根四节的绳：交到顶，绳头没有下一个挂钩</text>
<rect x="26" y="404" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="44" y="434" width="118" height="84" fill="none" stroke="#C9B79A" stroke-width="0.9"/>
<circle cx="122" cy="454" r="7" fill="none" stroke="#8A7C69" stroke-width="0.9"/>
<path d="M56,504 L84,470 L104,504" fill="none" stroke="#8A7C69" stroke-width="0.9"/>
<path d="M110,504 L126,482 L142,504" fill="none" stroke="#8A7C69" stroke-width="0.9"/>
<path d="M64,510 C80,506 96,514 112,509" fill="none" stroke="#4A5C55" stroke-width="0.9"/>
<text x="103" y="530" font-size="4.0" fill="#8A7C69" text-anchor="middle">「大自然」</text>
<line x1="58" y1="500" x2="148" y2="454" stroke="#A2503B" stroke-width="1.4"/>
<text x="103" y="542" font-size="4.0" fill="#A2503B" text-anchor="middle">错读：道效法大自然</text>
<text x="64" y="428" font-size="4.4" fill="#A2503B">道 →</text>
<line x1="176" y1="424" x2="176" y2="536" stroke="#DCCBB0" stroke-width="0.7"/>
<ellipse cx="238" cy="508" rx="5" ry="3.4" fill="#DCD0B6" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="238" y1="504" x2="238" y2="460" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M238,490 C245.2,484 250,480 250,474" fill="none" stroke="#4A5C55" stroke-width="0.9"/>
<path d="M238,478 C230.8,472 226,468 226,462" fill="none" stroke="#4A5C55" stroke-width="0.9"/>
<circle cx="238" cy="454" r="9" fill="none" stroke="#4A5C55" stroke-width="0.9"/>
<text x="238" y="530" font-size="3.9" fill="#6E6459" text-anchor="middle">没人命令它，它就长成这样</text>
<text x="238" y="542" font-size="4.0" fill="#4A5C55" text-anchor="middle">正读：自，自身；然，如是</text>
<text x="24" y="567" font-size="5.0" fill="#4A5C55">二、「自然」不是「自然界」：不是另有一层要效法</text>
<text x="24" y="584" font-size="4.9" fill="#2F2A24">王法地，地法天，天法道——四层取法，一层比一层根本，最后停在「自然」。</text>
<text x="24" y="600" font-size="4.9" fill="#2F2A24">若在道之外还有一个「自然」要效法，就成了五层，而且最上一层反而更玄。</text>
<text x="24" y="618" font-size="4.9" fill="#4A5C55">所以道法自然，说的是：道之上没有更高的主宰，它只是如其所是。</text>
<line x1="24" y1="636" x2="338" y2="636" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="644" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="660" font-size="5.2" fill="#2F2A24" text-anchor="middle">道无可法，故曰自然；人有所法，故曰法地。</text>
<text x="190" y="672" font-size="4.5" fill="#4A5C55" text-anchor="middle">上面没有更高的东西命令它，它只是自己如此。</text>
<line x1="20" y1="698" x2="360" y2="698" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="712" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="728" font-size="8.4" fill="#2F2A24">造作的反面不是不做事，是不必多此一举。</text>
<text x="20" y="744" font-size="8.4" fill="#2F2A24">道无可法，故曰自然；人有所法，故曰法地。</text>
</svg>