<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 566" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一整章十一个「如」，都在说同一件事：道难看" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="566" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 一 章 · 翻 面</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">翻过来，全是反面</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">不是深奥，是不好看。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">反，《说文》「覆也」，从又从厂——</text>
<text x="190" y="127" font-size="5.2" fill="#6E6459" text-anchor="middle">一只手在崖上把东西翻过来；不是转身走。</text>
<rect x="70" y="166" width="76" height="9" fill="#F2EADA" stroke="#2F2A24" stroke-width="1"/>
<line x1="78" y1="166" x2="78" y2="152" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="138" y1="166" x2="138" y2="152" stroke="#2F2A24" stroke-width="1.1"/>
<path d="M156,182 a16,16 0 0 1 0,-22" fill="none" stroke="#A2503B" stroke-width="0.8"/>
<path d="M156,160 l-5,5 M156,160 l5,5" fill="none" stroke="#A2503B" stroke-width="0.8"/>
<text x="60" y="190" font-size="5.2" fill="#2F2A24" text-anchor="middle">正面</text>
<text x="196" y="164" font-size="5.2" fill="#2F2A24">翻一下，正面对你的那一面，就成了反面。</text>
<text x="196" y="178" font-size="6.0" fill="#6E6459">下士笑的是那个背面；老子手里握的是同一件东西。</text>
<text x="196" y="194" font-size="5.2" fill="#A2503B">他笑，是因为他站在原来那一面。</text>
<line x1="24" y1="208" x2="338" y2="208" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="218" width="160" height="24" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="34" y="234" font-size="5.2" fill="#2F2A24">明道</text>
<text x="82" y="233" font-size="5.2" fill="#6E6459" text-anchor="middle">如</text>
<text x="116" y="234" font-size="5.2" fill="#A2503B">昧</text>
<rect x="188" y="218" width="160" height="24" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="202" y="234" font-size="5.2" fill="#2F2A24">进道</text>
<text x="250" y="233" font-size="5.2" fill="#6E6459" text-anchor="middle">如</text>
<text x="284" y="234" font-size="5.2" fill="#A2503B">退</text>
<rect x="20" y="248" width="160" height="24" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="34" y="264" font-size="5.2" fill="#2F2A24">夷道</text>
<text x="82" y="263" font-size="5.2" fill="#6E6459" text-anchor="middle">如</text>
<text x="116" y="264" font-size="5.2" fill="#A2503B">颣</text>
<rect x="188" y="248" width="160" height="24" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="202" y="264" font-size="5.2" fill="#2F2A24">上德</text>
<text x="250" y="263" font-size="5.2" fill="#6E6459" text-anchor="middle">如</text>
<text x="284" y="264" font-size="5.2" fill="#A2503B">谷</text>
<rect x="20" y="278" width="160" height="24" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="34" y="294" font-size="5.2" fill="#2F2A24">大白</text>
<text x="82" y="293" font-size="5.2" fill="#6E6459" text-anchor="middle">如</text>
<text x="116" y="294" font-size="5.2" fill="#A2503B">辱</text>
<rect x="188" y="278" width="160" height="24" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="202" y="294" font-size="5.2" fill="#2F2A24">广德</text>
<text x="250" y="293" font-size="5.2" fill="#6E6459" text-anchor="middle">如</text>
<text x="284" y="294" font-size="5.2" fill="#A2503B">不足</text>
<rect x="20" y="308" width="160" height="24" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="34" y="324" font-size="5.2" fill="#2F2A24">建德</text>
<text x="82" y="323" font-size="5.2" fill="#6E6459" text-anchor="middle">如</text>
<text x="116" y="324" font-size="5.2" fill="#A2503B">偷</text>
<rect x="188" y="308" width="160" height="24" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="202" y="324" font-size="5.2" fill="#2F2A24">质真</text>
<text x="250" y="323" font-size="5.2" fill="#6E6459" text-anchor="middle">如</text>
<text x="284" y="324" font-size="5.2" fill="#A2503B">渝</text>
<rect x="20" y="338" width="160" height="24" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="34" y="354" font-size="5.2" fill="#2F2A24">大方</text>
<text x="82" y="353" font-size="5.2" fill="#6E6459" text-anchor="middle">如</text>
<text x="116" y="354" font-size="5.2" fill="#A2503B">无隅</text>
<rect x="188" y="338" width="160" height="24" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="202" y="354" font-size="5.2" fill="#2F2A24">大器</text>
<text x="250" y="353" font-size="5.2" fill="#6E6459" text-anchor="middle">如</text>
<text x="284" y="354" font-size="5.2" fill="#A2503B">免成</text>
<rect x="20" y="368" width="160" height="24" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="34" y="384" font-size="5.2" fill="#2F2A24">大音</text>
<text x="82" y="383" font-size="5.2" fill="#6E6459" text-anchor="middle">如</text>
<text x="116" y="384" font-size="5.2" fill="#A2503B">希声</text>
<rect x="188" y="368" width="160" height="24" fill="#F7F1E3" stroke="#E6D8C2" stroke-width="1.0"/>
<text x="202" y="384" font-size="5.2" fill="#2F2A24">大象</text>
<text x="250" y="383" font-size="5.2" fill="#6E6459" text-anchor="middle">如</text>
<text x="284" y="384" font-size="5.2" fill="#A2503B">无形</text>
<text x="190" y="406" font-size="5.2" fill="#4A5C55" text-anchor="middle">道隐无名：名字贴不住，因为它分不开。</text>
<rect x="20" y="418" width="340" height="46" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="434" font-size="5.2" fill="#2F2A24" text-anchor="middle">不是道难懂，是道难看；难懂可以学，难看只能翻过来看。</text>
<text x="190" y="449" font-size="5.2" fill="#6E6459" text-anchor="middle">翻过来的东西，永远背对着站在原来那一面的人。</text>
<text x="190" y="462" font-size="5.2" fill="#4A5C55" text-anchor="middle">方到极处，是不需要角来证明自己是方的。</text>
<line x1="20" y1="478" x2="360" y2="478" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="492" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="508" font-size="8.4" fill="#2F2A24">「晚成」是把终点挪远，「免成」是把终点取消。</text>
<text x="20" y="524" font-size="8.4" fill="#2F2A24">不是它没有样子，是任何样子都只是它的一块。</text>
</svg>