<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 714" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="靶在那儿，不由你说：有环才有落点，没环说什么都不算" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="714" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 七 十 一 章 · 靶</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一张靶</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">知不知，尚矣；不知知，病也。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">靶不在你手里：它立在那儿，环纹是它自己带的，箭落在几环由它说。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">这是「知」可验的全部理由——靶一挪，就没有靶了。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、有环：落点由靶说</text>
<rect x="26" y="162" width="328" height="142" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="176" cy="224" r="40" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="176" cy="224" r="27" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="176" cy="224" r="14" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.8"/>
<circle cx="176" cy="224" r="4.4" fill="#A2503B" stroke="none"/>
<text x="230" y="218" font-size="4.2" fill="#6E6459">环是靶自带的</text>
<line x1="90" y1="258" x2="150" y2="252" stroke="#2F2A24" stroke-width="1.3"/>
<polygon points="150,252 140,246 144,255" fill="#2F2A24"/>
<line x1="98" y1="252" x2="104" y2="258" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="98" y1="264" x2="104" y2="258" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="104" y1="252" x2="110" y2="258" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="104" y1="264" x2="110" y2="258" stroke="#2F2A24" stroke-width="0.8"/>
<text x="116" y="274" font-size="4.5" fill="#A2503B">箭在二环外</text>
<line x1="220" y1="224" x2="216" y2="224" stroke="#4A5C55" stroke-width="0.1"/>
<text x="190" y="320" font-size="4.6" fill="#4A5C55" text-anchor="middle">靶不动，箭动：中不中，是靶说的，不是射的人说的</text>
<text x="24" y="342" font-size="4.8" fill="#A2503B">二、无环：说什么都不算数</text>
<rect x="26" y="354" width="328" height="146" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="176" cy="418" r="40" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="148" y1="390" x2="204" y2="446" stroke="#DCCBB0" stroke-width="0.9" stroke-dasharray="4 4"/>
<line x1="204" y1="390" x2="148" y2="446" stroke="#DCCBB0" stroke-width="0.9" stroke-dasharray="4 4"/>
<circle cx="176" cy="418" r="41" fill="none" stroke="#B9A98F" stroke-width="0.8"/>
<line x1="122" y1="396" x2="156" y2="406" stroke="#2F2A24" stroke-width="1"/>
<polygon points="156,406 148,401 149,409" fill="#2F2A24"/>
<line x1="160" y1="414" x2="194" y2="424" stroke="#2F2A24" stroke-width="1"/>
<polygon points="194,424 186,419 187,427" fill="#2F2A24"/>
<line x1="138" y1="432" x2="172" y2="442" stroke="#2F2A24" stroke-width="1"/>
<polygon points="172,442 164,437 165,445" fill="#2F2A24"/>
<text x="230" y="408" font-size="4.5" fill="#A2503B">没有环</text>
<text x="230" y="422" font-size="4.2" fill="#6E6459">落在哪儿都</text>
<text x="230" y="434" font-size="4.2" fill="#6E6459">可以叫「中」</text>
<text x="190" y="518" font-size="4.6" fill="#4A5C55" text-anchor="middle">环是靶的，不是你画的：环一擦掉，箭就成了自己给自己判的</text>
<text x="24" y="534" font-size="4.8" fill="#2F2A24">所以「知不知」的「不知」，是有靶可对的不知：他知道自己偏了，靶还在。</text>
<text x="24" y="550" font-size="4.8" fill="#2F2A24">而「不知知」先把环擦掉，再说「都在里圈」。</text>
<text x="24" y="568" font-size="5.0" fill="#4A5C55">靶一旦成了随身之物，箭就再也没有偏过——这不是本事，是病。</text>
<line x1="24" y1="584" x2="338" y2="584" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="592" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="607" font-size="5.2" fill="#2F2A24" text-anchor="middle">靶在彼，不由我说。</text>
<text x="190" y="620" font-size="4.7" fill="#4A5C55" text-anchor="middle">验证的意思是：有一件东西，你说不动它。</text>
<line x1="20" y1="646" x2="360" y2="646" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="660" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="676" font-size="8.4" fill="#2F2A24">知不知，尚矣；不知知，病也。</text>
<text x="20" y="692" font-size="8.4" fill="#2F2A24">知者，命中之事，非胸中之有。</text>
</svg>