<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 684" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="知常容，容乃公，公乃全，全乃天，天乃道，道乃久：六阶是一圈推一圈" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="684" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 六 章 · 知 常</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一圈推一圈</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">知常容，容乃公，公乃全，全乃天，天乃道，道乃久。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">六阶不是六个字并排。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">外环由内环推起来：抽掉内环，外环不起。</text>
<rect x="26" y="146" width="328" height="316" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="190" cy="306" r="22" fill="none" stroke="#4A5C55" stroke-width="0.9" opacity="0.9"/>
<text x="190" y="324" font-size="5.6" fill="#4A5C55" text-anchor="middle" opacity="0.9">容</text>
<circle cx="190" cy="306" r="44" fill="none" stroke="#4A5C55" stroke-width="0.9" opacity="0.8"/>
<text x="190" y="346" font-size="5.6" fill="#4A5C55" text-anchor="middle" opacity="0.8">公</text>
<circle cx="190" cy="306" r="66" fill="none" stroke="#4A5C55" stroke-width="0.9" opacity="0.72"/>
<text x="190" y="368" font-size="5.6" fill="#4A5C55" text-anchor="middle" opacity="0.72">全</text>
<circle cx="190" cy="306" r="92" fill="none" stroke="#4A5C55" stroke-width="0.9" opacity="0.62"/>
<text x="190" y="394" font-size="5.6" fill="#4A5C55" text-anchor="middle" opacity="0.62">天</text>
<circle cx="190" cy="306" r="118" fill="none" stroke="#4A5C55" stroke-width="0.9" opacity="0.5"/>
<text x="190" y="420" font-size="5.6" fill="#4A5C55" text-anchor="middle" opacity="0.5">道</text>
<circle cx="190" cy="306" r="142" fill="none" stroke="#4A5C55" stroke-width="0.9" opacity="0.38"/>
<text x="190" y="444" font-size="5.6" fill="#4A5C55" text-anchor="middle" opacity="0.38">久</text>
<circle cx="190" cy="306" r="2.6" fill="#A2503B"/>
<text x="190" y="296" font-size="5.6" fill="#A2503B" text-anchor="middle">知常</text>
<text x="42" y="450" font-size="4.6" fill="#8A7C69">久在最外：再往外，就看不见边了。</text>
<text x="24" y="482" font-size="4.9" fill="#2F2A24">容是起点，久是终点：每一环都由内环推起来，不是并排六个字。</text>
<text x="24" y="498" font-size="4.9" fill="#2F2A24">容＝不排他；公＝不拿自己那副尺量天下；全＝这才看得见全貌。</text>
<text x="24" y="514" font-size="4.9" fill="#2F2A24">全则合天然，合天然即合道；合道不靠硬撑，所以能久。</text>
<text x="24" y="532" font-size="4.9" fill="#A2503B">不知常，妄作凶：环还没推出去，先把自己搅碎。</text>
<line x1="24" y1="550" x2="338" y2="550" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="558" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="574" font-size="5.8" fill="#2F2A24" text-anchor="middle">知常容，容乃公，公乃全，</text>
<text x="190" y="586" font-size="5.8" fill="#4A5C55" text-anchor="middle">全乃天，天乃道，道乃久。</text>
<line x1="20" y1="612" x2="360" y2="612" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="626" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="642" font-size="8.4" fill="#2F2A24">知常容，容乃公，公乃全，全乃天，天乃道，道乃久。</text>
<text x="20" y="658" font-size="8.4" fill="#2F2A24">没身不殆者，非命长，是险少。</text>
</svg>