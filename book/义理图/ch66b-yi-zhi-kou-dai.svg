<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 724" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="重不是东西多，是压在身上：上位者最容易变成那只口袋" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="724" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 六 章 · 重</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一只口袋</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">处上而民不重。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「重」，《说文》「厚也」，金文从人从东——东是两头扎起的囊橐。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">一个人背着口袋，这就是重：不是东西多，是压在身上。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、背着：每加一件，背上沉一分</text>
<rect x="26" y="160" width="328" height="160" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="308" x2="346" y2="308" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="176" cy="200" r="6.4" fill="none" stroke="#2F2A24" stroke-width="1"/>
<path d="M170,207 L184,205 L196,264 L176,268 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<line x1="182" y1="268" x2="186" y2="308" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="192" y1="266" x2="200" y2="308" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M164,216 Q148,218 150,236 Q152,254 166,254 Q180,254 182,236 Q184,218 168,216 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1"/>
<circle cx="166" cy="213" r="4.6" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<circle cx="166" cy="257" r="4.6" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="158" y1="196" x2="158" y2="210" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<line x1="163" y1="196" x2="163" y2="210" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<line x1="168" y1="196" x2="168" y2="210" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="120" y="298" font-size="4.5" fill="#A2503B" text-anchor="middle">东：两头扎起的囊橐</text>
<rect x="250" y="244" width="58" height="12" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="279" y="252.4" font-size="4.0" fill="#2F2A24" text-anchor="middle">赋税</text>
<rect x="250" y="230" width="58" height="12" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="279" y="238.4" font-size="4.0" fill="#2F2A24" text-anchor="middle">劳役</text>
<rect x="250" y="216" width="58" height="12" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="279" y="224.4" font-size="4.0" fill="#2F2A24" text-anchor="middle">仪仗</text>
<text x="279" y="200" font-size="4.2" fill="#A2503B" text-anchor="middle">每加一件</text>
<text x="279" y="210" font-size="4.2" fill="#A2503B" text-anchor="middle">背上沉一分</text>
<line x1="246" y1="232" x2="186" y2="220" stroke="#A2503B" stroke-width="0.9" stroke-dasharray="3 3" marker-end="url(#arrS)"/>
<text x="190" y="334" font-size="4.6" fill="#A2503B" text-anchor="middle">背上的东西越多，底下越觉得沉</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、放下：背着空，底下就不觉得沉</text>
<rect x="26" y="366" width="328" height="140" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="34" y1="494" x2="346" y2="494" stroke="#2F2A24" stroke-width="1.1"/>
<circle cx="176" cy="396" r="6.4" fill="none" stroke="#2F2A24" stroke-width="1"/>
<rect x="169" y="404" width="14" height="58" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="172" y1="462" x2="170" y2="494" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="180" y1="462" x2="182" y2="494" stroke="#2F2A24" stroke-width="1.2"/>
<path d="M236,458 Q226,460 228,474 Q230,488 242,488 Q254,488 256,474 Q258,460 248,458 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="242" cy="455" r="4.2" fill="none" stroke="#2F2A24" stroke-width="0.8" stroke-dasharray="2 2"/>
<circle cx="242" cy="491" r="4.2" fill="none" stroke="#2F2A24" stroke-width="0.8" stroke-dasharray="2 2"/>
<text x="306" y="478" font-size="4.5" fill="#4A5C55" text-anchor="middle">口袋放在地上</text>
<circle cx="176" cy="432" r="13" fill="none" stroke="#4A5C55" stroke-width="0.9" opacity="0.7"/>
<text x="176" y="434" font-size="4.2" fill="#4A5C55" text-anchor="middle">背空</text>
<text x="190" y="520" font-size="4.6" fill="#4A5C55" text-anchor="middle">民不重：背上不多一个口袋</text>
<text x="24" y="540" font-size="4.8" fill="#2F2A24">重不是东西多，是压在身上：赋税、劳役、仪仗、供应，每加一件沉一分。</text>
<text x="24" y="556" font-size="4.8" fill="#2F2A24">害是抢走本该属于他的：一手举旗，一手在旗下取物。</text>
<text x="24" y="574" font-size="5.0" fill="#4A5C55">处上不重，管的是压；处前不害，管的是抢。</text>
<line x1="24" y1="590" x2="338" y2="590" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="598" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="613" font-size="5.2" fill="#2F2A24" text-anchor="middle">重者，人背一囊；害者，旗下取物。</text>
<text x="190" y="626" font-size="4.8" fill="#4A5C55" text-anchor="middle">上位者最该怕的，就这两件。</text>
<line x1="20" y1="652" x2="360" y2="652" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="666" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="682" font-size="8.4" fill="#2F2A24">重者，人背一囊；害者，旗下取物。</text>
<text x="20" y="698" font-size="8.4" fill="#2F2A24">处上而民不重：不是不上，是上了让人不觉得沉。</text>
</svg>