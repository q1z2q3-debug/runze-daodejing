<path d="M142,242 L232,250 L254,274 L148,248 Z" fill="#F2EADA" stroke="none" opacity="0.75"/>
<path d="M142,242 L232,250" fill="none" stroke="#DCCBB0" stroke-width="0.6"/>
<path d="M142,242 L254,274" fill="none" stroke="#DCCBB0" stroke-width="0.6"/>
<circle cx="244" cy="254" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="244" y1="258" x2="244" y2="282" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="244" y1="282" x2="239" y2="298" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="244" y1="282" x2="249" y2="298" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="245" y1="264" x2="237" y2="256" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="237" y1="256" x2="239" y2="251" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="244" y1="264" x2="234" y2="278" stroke="#2F2A24" stroke-width="0.8"/>
<text x="250" y="236" font-size="4.5" fill="#6E6459" text-anchor="middle">抬手挡了一下</text>
<text x="190" y="174" font-size="4.5" fill="#6E6459" text-anchor="middle">灯举在手上，光落在别人脸上</text>
<text x="190" y="316" font-size="4.5" fill="#8A7C69" text-anchor="middle">昭昭：处处显明自己是对的；察察：照人、挑人</text>
<text x="24" y="339" font-size="5.0" fill="#A2503B">一、举灯：光照在别人脸上</text>
<rect x="26" y="352" width="328" height="168" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M95,492 q9,7 18,0 Z" fill="#E4D8BF" stroke="#2F2A24" stroke-width="0.8"/>
