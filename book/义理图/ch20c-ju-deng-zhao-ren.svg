<path d="M104,491 q-3.5,-5 0,-10 q3.5,5 0,10" fill="none" stroke="#A2503B" stroke-width="1.0"/>
<ellipse cx="104" cy="492" rx="26" ry="6" fill="#F2EADA" stroke="none" opacity="0.7"/>
<circle cx="176" cy="448" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="176" y1="452" x2="176" y2="476" stroke="#2F2A24" stroke-width="1.0"/>
