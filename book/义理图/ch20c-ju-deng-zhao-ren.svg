<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 738" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="俗人昭昭，我独昏昏：举灯照人" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="738" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 章 · 昭 与 昏</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">举灯照人</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">俗人昭昭，我独昏昏；俗人察察，我独闷闷。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">昭昭是向外自证正确，察察是拿灯去照人、挑人。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">昏昏闷闷不是糊涂，是不举这盏灯。</text>
<rect x="26" y="150" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<circle cx="126" cy="254" r="3.4" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
