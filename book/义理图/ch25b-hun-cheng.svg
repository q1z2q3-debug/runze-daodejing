<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="先于一切分割的一整块" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="700" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 五 章 · 有 物 混 成</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一段未剖的原木</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">有物混成，先天地生。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.8" fill="#2F2A24" text-anchor="middle">混成：混然一体，没有分割、没有对立、没有形色、没有边界。</text>
<text x="190" y="127" font-size="4.8" fill="#6E6459" text-anchor="middle">「先」不是时间上的早，是逻辑上的先：天地离了它不成。</text>
<rect x="26" y="152" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M116,182 L306,187 L306,265 L116,270 Z" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.1"/>
<ellipse cx="116" cy="226" rx="15" ry="44" fill="#EADFC8" stroke="#2F2A24" stroke-width="1.2"/>
<ellipse cx="116" cy="226" rx="11" ry="33" fill="none" stroke="#C0AE8C" stroke-width="0.8"/>
<ellipse cx="116" cy="226" rx="8" ry="23" fill="none" stroke="#C0AE8C" stroke-width="0.8"/>
<ellipse cx="116" cy="226" rx="5" ry="13" fill="none" stroke="#C0AE8C" stroke-width="0.8"/>
<circle cx="116" cy="226" r="1.6" fill="#2F2A24"/>
<path d="M122,195 C178,191 266,199 303,195" fill="none" stroke="#C9B79A" stroke-width="0.7"/>
<path d="M122,216 C178,212 266,220 303,216" fill="none" stroke="#C9B79A" stroke-width="0.7"/>
<path d="M122,237 C178,233 266,241 303,237" fill="none" stroke="#C9B79A" stroke-width="0.7"/>
<path d="M122,258 C178,254 266,262 303,258" fill="none" stroke="#C9B79A" stroke-width="0.7"/>
<text x="303" y="176" font-size="3.8" fill="#6E6459" text-anchor="end">树皮在外，年轮在里：没有一条分界线</text>
<text x="190" y="290" font-size="4.0" fill="#4A5C55" text-anchor="middle">一段原木：圆、整、未分。剖开之前，板、碗、名牌都还没有。</text>
<text x="24" y="315" font-size="5.0" fill="#A2503B">一、未剖的原木：一整个，不是零件拼起来的</text>
<rect x="26" y="328" width="328" height="156" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M48,364 L124,364 L124,434 L48,434 Z" fill="none" stroke="#C9B79A" stroke-width="0.9" stroke-dasharray="5 3"/>
<ellipse cx="62" cy="399" rx="9" ry="34" fill="none" stroke="#C9B79A" stroke-width="0.9" stroke-dasharray="5 3"/>
<ellipse cx="62" cy="399" rx="6" ry="25" fill="none" stroke="#DDCDB2" stroke-width="0.7" stroke-dasharray="4 3"/>
<ellipse cx="62" cy="399" rx="4" ry="15" fill="none" stroke="#DDCDB2" stroke-width="0.7" stroke-dasharray="4 3"/>
<ellipse cx="62" cy="399" rx="2" ry="6" fill="none" stroke="#DDCDB2" stroke-width="0.7" stroke-dasharray="4 3"/>
<text x="88" y="452" font-size="3.7" fill="#8A7C69" text-anchor="middle">原来那一段</text>
<rect x="140" y="378" width="74" height="13" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="140" y="395" width="74" height="13" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="140" y="412" width="74" height="13" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<text x="177" y="388" font-size="4.4" fill="#2F2A24" text-anchor="middle">板</text>
<text x="177" y="452" font-size="3.7" fill="#8A7C69" text-anchor="middle">剖开的料</text>
<path d="M226,384 L234,424 L280,424 L288,384" fill="#FCF8EF" stroke="#2F2A24" stroke-width="1.0"/>
<ellipse cx="257" cy="384" rx="31" ry="6" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.0"/>
<text x="257" y="452" font-size="3.7" fill="#8A7C69" text-anchor="middle">碗（器）</text>
<rect x="300" y="390" width="38" height="20" fill="#F2EADA" stroke="#A2503B" stroke-width="1.0"/>
<text x="319" y="404" font-size="5.4" fill="#A2503B" text-anchor="middle">名</text>
<line x1="298" y1="400" x2="292" y2="400" stroke="#A2503B" stroke-width="0.7" stroke-dasharray="3 2"/>
<text x="319" y="452" font-size="3.7" fill="#8A7C69" text-anchor="middle">后贴的牌</text>
<line x1="128" y1="399" x2="136" y2="388" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 2"/>
<text x="190" y="472" font-size="4.0" fill="#4A5C55" text-anchor="middle">板、碗、名，还是那一段里的东西——分割在后，一整块在先。</text>
<text x="24" y="497" font-size="5.0" fill="#4A5C55">二、剖开：板、器、名都是后起的，不是本来的</text>
<text x="24" y="514" font-size="4.9" fill="#2F2A24">「寂兮寥兮」：寂是无声，寥是无形。听觉抓不到，视觉也抓不到。</text>
<text x="24" y="530" font-size="4.9" fill="#2F2A24">老子一路只说它不是什么：无形、无声、不改——正面说不出来。</text>
<text x="24" y="548" font-size="4.9" fill="#4A5C55">名字在这里只是手指：指着它，不等于摸到它。</text>
<line x1="24" y1="566" x2="338" y2="566" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="574" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="590" font-size="5.4" fill="#2F2A24" text-anchor="middle">不是它比天地老，是天地离了它不成。</text>
<text x="190" y="602" font-size="4.4" fill="#4A5C55" text-anchor="middle">名是给有边界的东西用的；对没有边界的东西，名只是手指。</text>
<line x1="20" y1="628" x2="360" y2="628" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="642" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="658" font-size="8.4" fill="#2F2A24">不是它比天地老，是天地离了它不成。</text>
<text x="20" y="674" font-size="8.4" fill="#2F2A24">名是给有边界的东西用的；对没有边界的东西，名只是手指。</text>
</svg>