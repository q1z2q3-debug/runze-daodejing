<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 742" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="混成：不是零件拼起来的，是先于一切分割的一整块" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="742" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 五 章 · 一 段 未 剖 的 原 木</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一段未剖的原木</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">有物混成，先天地生。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">「混成」：混然一体，没有分割、没有对立、没有形色、没有边界。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459">「先天地生」的「先」，不是比天地早多少年，是天地得以显现靠它。</text>
<text x="24" y="152" font-size="5.1" fill="#A2503B">一、原木：年轮一圈套一圈，还没被剖开</text>
<rect x="26" y="164" width="328" height="180" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<ellipse cx="128" cy="246" rx="76" ry="52" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.3"/>
<ellipse cx="128" cy="246" rx="46" ry="31" fill="none" stroke="#B7A99A" stroke-width="0.8"/>
<ellipse cx="128" cy="246" rx="36" ry="24" fill="none" stroke="#B7A99A" stroke-width="0.8"/>
<ellipse cx="128" cy="246" rx="26" ry="17" fill="none" stroke="#B7A99A" stroke-width="0.8"/>
<ellipse cx="128" cy="246" rx="16" ry="10" fill="none" stroke="#B7A99A" stroke-width="0.8"/>
<ellipse cx="128" cy="246" rx="6" ry="4" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<text x="128" y="308" font-size="4.1" fill="#8A7C69" text-anchor="middle">一段原木：圆、整、未分</text>
<text x="252" y="208" font-size="4.1" fill="#A2503B">年轮同心</text>
<text x="252" y="224" font-size="3.9" fill="#8A7C69">一圈套一圈</text>
<line x1="248" y1="240" x2="172" y2="232" stroke="#DCCBB0" stroke-width="0.5"/>
<text x="190" y="330" font-size="4.1" fill="#A2503B" text-anchor="middle">寂兮寥兮：无声，无形——正面说不出来，只能一直说它不是什么</text>
<text x="24" y="370" font-size="5.1" fill="#4A5C55">二、剖开之后：才有板、有器、有名字</text>
<rect x="26" y="382" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<rect x="54" y="442" width="86" height="14" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="54" y="460" width="86" height="14" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="54" y="478" width="86" height="14" fill="#EFE6D4" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="150" y1="466" x2="182" y2="466" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arr2)"/>
<path d="M206,456 L212,484 L244,484 L250,456" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<ellipse cx="228" cy="456" rx="22" ry="5" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.0"/>
<rect x="272" y="456" width="34" height="20" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.9"/>
<text x="289" y="470" font-size="4.4" fill="#A2503B" text-anchor="middle">名</text>
<text x="97" y="510" font-size="4.2" fill="#2F2A24" text-anchor="middle">板</text>
<text x="228" y="510" font-size="4.2" fill="#2F2A24" text-anchor="middle">器</text>
<text x="289" y="510" font-size="4.0" fill="#A2503B" text-anchor="middle">名</text>
<text x="190" y="530" font-size="4.1" fill="#4A5C55" text-anchor="middle">分割之后，才有板、有器、有名字；名字是给有边界的东西用的</text>
<text x="24" y="556" font-size="4.8" fill="#2F2A24">混成不是混沌：混沌是乱的，混成是还没分——它不靠零件凑，也不靠拼装成立。</text>
<text x="24" y="572" font-size="4.8" fill="#2F2A24">「独立而不改」：草木荣枯、王朝兴废全在账上，它不在账上。</text>
<text x="24" y="590" font-size="4.8" fill="#4A5C55">先立得住，才转得动：一个东西要靠不停运转来证明自己存在，那它其实立不住。</text>
<line x1="24" y1="608" x2="338" y2="608" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="616" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="632" font-size="6.0" fill="#2F2A24" text-anchor="middle">有物混成，先天地生。</text>
<text x="190" y="644" font-size="5.0" fill="#4A5C55" text-anchor="middle">独立而不改，周行而不殆。</text>
<line x1="20" y1="670" x2="360" y2="670" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="684" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="700" font-size="8.4" fill="#2F2A24">有物混成，先天地生。</text>
<text x="20" y="716" font-size="8.4" fill="#2F2A24">不是它比天地老，是天地离了它不成。</text>
</svg>