<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 508" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="微妙玄通，深不可识：认不出，是因为他不把自己摆出来" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="508" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 五 章 · 体 道</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">不肯往前站一步</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">七样说的都不是长相，是他站着的样子。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">「强为之容」的「强」是不得已：语言描不准，只好拿譬喻来凑。</text>
<text x="190" y="128" font-size="4.9" fill="#6E6459" text-anchor="middle">「识」是分类、标定、贴标签——他不在那一栏里。</text>
<text x="24" y="158" font-size="5.1" fill="#A2503B">一、七个字，一个也没走到箭头那头</text>
<line x1="36" y1="276" x2="340" y2="276" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="344" y1="272" x2="344" y2="172" stroke="#A2503B" stroke-width="0.8" stroke-dasharray="4 3"/>
<path d="M-3.2,-3.2 L4.2,0 L-3.2,3.2 z" fill="#A2503B" transform="translate(344,168) rotate(-90)"/>
<text x="338" y="160" font-size="4.4" fill="#A2503B" text-anchor="end">往前站一步</text>
<text x="338" y="172" font-size="3.8" fill="#8A7C69" text-anchor="end">（世人的方向）</text>
<circle cx="48" cy="236" r="5.0" fill="none" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="48" y1="241" x2="48" y2="268" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="48" y1="268" x2="43" y2="278" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="48" y1="268" x2="53" y2="278" stroke="#2F2A24" stroke-width="1.0"/>
<text x="48" y="222" font-size="4.2" fill="#8A7C69" text-anchor="middle">他</text>
<circle cx="92" cy="276" r="2.4" fill="#A2503B"/>
<text x="92" y="300" font-size="5.6" fill="#A2503B" text-anchor="middle">豫</text>
<text x="92" y="316" font-size="4.2" fill="#6E6459" text-anchor="middle">不冒进</text>
<circle cx="132" cy="276" r="2.4" fill="#A2503B"/>
<text x="132" y="300" font-size="5.6" fill="#A2503B" text-anchor="middle">犹</text>
<text x="132" y="316" font-size="4.2" fill="#6E6459" text-anchor="middle">不放纵</text>
<circle cx="172" cy="276" r="2.4" fill="#A2503B"/>
<text x="172" y="300" font-size="5.6" fill="#A2503B" text-anchor="middle">俨</text>
<text x="172" y="316" font-size="4.2" fill="#6E6459" text-anchor="middle">不为主</text>
<circle cx="212" cy="276" r="2.4" fill="#A2503B"/>
<text x="212" y="300" font-size="5.6" fill="#A2503B" text-anchor="middle">涣</text>
<text x="212" y="316" font-size="4.2" fill="#6E6459" text-anchor="middle">不僵持</text>
<circle cx="252" cy="276" r="2.4" fill="#A2503B"/>
<text x="252" y="300" font-size="5.6" fill="#A2503B" text-anchor="middle">敦</text>
<text x="252" y="316" font-size="4.2" fill="#6E6459" text-anchor="middle">不雕琢</text>
<circle cx="292" cy="276" r="2.4" fill="#A2503B"/>
<text x="292" y="300" font-size="5.6" fill="#A2503B" text-anchor="middle">旷</text>
<text x="292" y="316" font-size="4.2" fill="#6E6459" text-anchor="middle">不塞满</text>
<circle cx="332" cy="276" r="2.4" fill="#A2503B"/>
<text x="332" y="300" font-size="5.6" fill="#A2503B" text-anchor="middle">混</text>
<text x="332" y="316" font-size="4.2" fill="#6E6459" text-anchor="middle">不分判</text>
<text x="24" y="338" font-size="4.7" fill="#2F2A24">七个字，一个褒词也没有：不冒进、不放纵、不为主、不僵持、不雕琢、不塞满、不分判。</text>
<text x="24" y="354" font-size="4.7" fill="#6E6459">后世把「犹豫」「朴」「浊」读成德目或缺点，全章就读反了——它们是状态，不是品行。</text>
<rect x="20" y="372" width="340" height="42" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<text x="190" y="387" font-size="5.6" fill="#2F2A24" text-anchor="middle">深不可识：不是高深到看不懂。</text>
<text x="190" y="403" font-size="4.9" fill="#4A5C55" text-anchor="middle">是没办法用世人那套分别、归类、评判，去标定他。</text>
<line x1="20" y1="436" x2="360" y2="436" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="450" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="466" font-size="8.4" fill="#2F2A24">微妙者，非精妙，是看不清；玄通者，非玄秘，是不二分。</text>
<text x="20" y="482" font-size="8.4" fill="#2F2A24">豫犹者，非犹豫，是不妄动；若朴者，非俭朴，是未雕琢。</text>
</svg>