<line x1="222.2" y1="376" x2="222.2" y2="407" stroke="#E6D8C2" stroke-width="0.5"/>
<line x1="243.6" y1="376" x2="243.6" y2="407" stroke="#E6D8C2" stroke-width="0.5"/>
<line x1="265.0" y1="376" x2="265.0" y2="407" stroke="#E6D8C2" stroke-width="0.5"/>
<line x1="286.4" y1="376" x2="286.4" y2="407" stroke="#E6D8C2" stroke-width="0.5"/>
