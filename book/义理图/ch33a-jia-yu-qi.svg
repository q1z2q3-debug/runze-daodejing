<circle cx="133" cy="409" r="4.6" fill="#4A4A46" stroke="none"/>
<line x1="140" y1="412" x2="176" y2="390" stroke="#DCCBB0" stroke-width="0.6" stroke-dasharray="3 3"/>
<text x="233" y="366" font-size="4.0" fill="#8A7C69" text-anchor="middle">悬着，不落</text>
<text x="233" y="442" font-size="4.2" fill="#A2503B" text-anchor="middle">手里这一枚，写的是「我要赢」</text>
<rect x="20" y="486" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="504" font-size="5.6" fill="#2F2A24" text-anchor="middle">外物易放，那个「我要赢」最难放。</text>
<text x="190" y="518" font-size="4.6" fill="#4A5C55" text-anchor="middle">前面收的是事，这一章收的是那个做事的人。</text>
<line x1="20" y1="544" x2="360" y2="544" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="558" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="574" font-size="8.4" fill="#2F2A24">外面守得住，是因为里面先不争了。</text>
</svg>