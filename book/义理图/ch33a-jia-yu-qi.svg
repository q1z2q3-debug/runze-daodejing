<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三样大的都收进匣里了，这一小枚还在手里" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="600" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 三 十 三 章</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">匣 与 棋</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">知人者智，自知者明。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.6" fill="#2F2A24" text-anchor="middle">前三章收的是天下、兵、名；这一章收的是那个想去动它们的人。</text>
<text x="190" y="127" font-size="4.6" fill="#6E6459" text-anchor="middle">戒律管得住手，管不住心：外物易放，那个「我要赢」最难放。</text>
<text x="24" y="152" font-size="5.1" fill="#4A5C55">一、三样大的：都收进匣里，盖子合上了</text>
<rect x="26" y="164" width="328" height="130" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<rect x="44" y="202" width="84" height="58" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="39" y="194" width="94" height="9" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="77" y="187" width="18" height="7" rx="2" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.7"/>
<text x="86" y="230" font-size="6.0" fill="#2F2A24" text-anchor="middle">天下</text>
<text x="86" y="242" font-size="3.5" fill="#8A7C69" text-anchor="middle">印</text>
<rect x="68" y="250" width="36" height="10" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<text x="86" y="258" font-size="3.5" fill="#A2503B" text-anchor="middle">已放</text>
<line x1="52" y1="260" x2="120" y2="260" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="138" y="202" width="84" height="58" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="133" y="194" width="94" height="9" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="171" y="187" width="18" height="7" rx="2" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.7"/>
<text x="180" y="230" font-size="6.0" fill="#2F2A24" text-anchor="middle">兵</text>
<text x="180" y="242" font-size="3.5" fill="#8A7C69" text-anchor="middle">剑</text>
<rect x="162" y="250" width="36" height="10" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<text x="180" y="258" font-size="3.5" fill="#A2503B" text-anchor="middle">已放</text>
<line x1="146" y1="260" x2="214" y2="260" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="232" y="202" width="84" height="58" fill="#EDE3CE" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="227" y="194" width="94" height="9" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.9"/>
<rect x="265" y="187" width="18" height="7" rx="2" fill="#DED3BC" stroke="#2F2A24" stroke-width="0.7"/>
<text x="274" y="230" font-size="6.0" fill="#2F2A24" text-anchor="middle">名</text>
<text x="274" y="242" font-size="3.5" fill="#8A7C69" text-anchor="middle">牌</text>
<rect x="256" y="250" width="36" height="10" fill="#FBEFE7" stroke="#A2503B" stroke-width="0.6"/>
<text x="274" y="258" font-size="3.5" fill="#A2503B" text-anchor="middle">已放</text>
<line x1="240" y1="260" x2="308" y2="260" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="190" y="278" font-size="4.5" fill="#2F2A24" text-anchor="middle">天下、兵、名——三样大的，都收起来了。</text>
<text x="24" y="312" font-size="5.1" fill="#A2503B">二、一小枚：收了半天，还在手里</text>
<rect x="26" y="324" width="328" height="150" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="1.0"/>
<line x1="40" y1="456" x2="340" y2="456" stroke="#2F2A24" stroke-width="0.9"/>
