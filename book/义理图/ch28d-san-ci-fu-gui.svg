<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 582" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三次复归，是三次减法" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="582" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 二 十 八 章 · 三 次 复 归</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">婴儿·无极·朴</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">由外而内三层：洗掉别人给的，卸掉自己设的，不做加工。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">三处落点不是三个境界的排名，是三样后天之物，一样一样撤掉。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459">一处撤一样；撤完，剩下的是本来的那点东西。</text>
<text x="24" y="152" font-size="5.1" fill="#A2503B">一、有它的时候／撤掉之后</text>
<rect x="26" y="164" width="328" height="226" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<text x="38" y="182" font-size="4.4" fill="#A2503B">复归婴儿</text>
<text x="38" y="194" font-size="4.2" fill="#8A7C69">撤「染」</text>
<rect x="96" y="176" width="52" height="38" fill="#FBF3E4" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="112" cy="189" rx="11" ry="8" fill="#D8B79A" stroke="none" opacity="0.8"/>
<ellipse cx="130" cy="202" rx="9" ry="6" fill="#D8B79A" stroke="none" opacity="0.6"/>
<text x="122" y="224" font-size="3.8" fill="#8A7C69" text-anchor="middle">染过的布</text>
<line x1="158" y1="194" x2="192" y2="194" stroke="#C9B79A" stroke-width="0.9" marker-end="url(#arr)"/>
<text x="175" y="188" font-size="3.9" fill="#A2503B" text-anchor="middle">撤</text>
<rect x="200" y="176" width="52" height="38" fill="#FBF3E4" stroke="#2F2A24" stroke-width="0.9"/>
<text x="226" y="224" font-size="3.8" fill="#4A5C55" text-anchor="middle">素布</text>
<text x="38" y="254" font-size="4.4" fill="#A2503B">复归无极</text>
<text x="38" y="266" font-size="4.2" fill="#8A7C69">撤「界」</text>
<path d="M96,282 L122,256 L148,282" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<line x1="122" y1="256" x2="122" y2="242" stroke="#2F2A24" stroke-width="1.6"/>
<text x="122" y="239" font-size="3.8" fill="#A2503B" text-anchor="middle">栋</text>
<text x="122" y="296" font-size="3.8" fill="#8A7C69" text-anchor="middle">有顶点的屋</text>
<line x1="158" y1="266" x2="192" y2="266" stroke="#C9B79A" stroke-width="0.9" marker-end="url(#arr)"/>
<text x="175" y="260" font-size="3.9" fill="#A2503B" text-anchor="middle">撤</text>
<path d="M200,282 L226,256 L252,282" fill="none" stroke="#2F2A24" stroke-width="1.1"/>
<text x="226" y="296" font-size="3.8" fill="#4A5C55" text-anchor="middle">无顶点的屋</text>
<text x="38" y="326" font-size="4.4" fill="#A2503B">复归朴</text>
<text x="38" y="338" font-size="4.2" fill="#8A7C69">撤「刀」</text>
<rect x="96" y="332" width="46" height="18" rx="8" fill="#D9C7A6" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="142" cy="341" rx="5" ry="9" fill="#E4D3B2" stroke="#2F2A24" stroke-width="0.8"/>
<line x1="104" y1="335" x2="110" y2="345" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<line x1="114" y1="335" x2="120" y2="345" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<line x1="124" y1="335" x2="130" y2="345" stroke="#A2503B" stroke-width="0.8" opacity="0.7"/>
<text x="122" y="368" font-size="3.8" fill="#8A7C69" text-anchor="middle">挨过刀的木</text>
<line x1="158" y1="338" x2="192" y2="338" stroke="#C9B79A" stroke-width="0.9" marker-end="url(#arr)"/>
<text x="175" y="332" font-size="3.9" fill="#A2503B" text-anchor="middle">撤</text>
<rect x="200" y="332" width="46" height="18" rx="8" fill="#D9C7A6" stroke="#2F2A24" stroke-width="0.9"/>
<ellipse cx="246" cy="341" rx="5" ry="9" fill="#E4D3B2" stroke="#2F2A24" stroke-width="0.8"/>
<text x="226" y="368" font-size="3.8" fill="#4A5C55" text-anchor="middle">整段素木</text>
<text x="190" y="380" font-size="4.1" fill="#8A7C69" text-anchor="middle">染在布上，界在脊上，刀在木上——三样都在外面，不在人身上</text>
<text x="24" y="412" font-size="4.8" fill="#2F2A24">染是别人给的：礼法、是非、荣辱的评价，一层一层刷上来。</text>
<text x="24" y="428" font-size="4.8" fill="#2F2A24">界是自己设的：一定要有一个「最」，有一个「到头了」的地方。</text>
<text x="24" y="446" font-size="4.8" fill="#4A5C55">刀是人加的：雕、削、分、名——把一整块分成一件件。</text>
<line x1="24" y1="464" x2="338" y2="464" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="472" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="488" font-size="6.0" fill="#2F2A24" text-anchor="middle">先洗掉别人给的，再卸掉自己设的，最后连加工也不做。</text>
<text x="190" y="500" font-size="5.0" fill="#4A5C55" text-anchor="middle">由外而内，是三样东西，不是三个境界。</text>
<line x1="20" y1="526" x2="360" y2="526" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="540" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="556" font-size="8.4" fill="#2F2A24">婴儿撤的是染，无极撤的是界，朴撤的是刀。</text>
</svg>