<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 606" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="图训画计难：先把那个难画出来，才有得打算" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="606" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 六 十 三 章 · 图</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一支笔</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">图难于其易，为大于其细。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="5.2" fill="#2F2A24" text-anchor="middle">「图」，《说文》「画计难也」——先把难处画出来，再打算。</text>
<text x="190" y="126" font-size="4.9" fill="#6E6459" text-anchor="middle">所以「图难于其易」，不是趁容易时解决难，是趁它还容易，先把难画出来。</text>
<text x="24" y="148" font-size="4.8" fill="#A2503B">一、木牍上那道山：先画，还没发生</text>
<rect x="100" y="158" width="150" height="196" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="104" y="162" width="142" height="188" fill="none" stroke="#DCCBB0" stroke-width="0.6"/>
<path d="M116,330 L140,254 L158,286 L182,230 L206,278 L230,330" fill="none" stroke="#2F2A24" stroke-width="1.4"/>
<path d="M116,330 L230,330" stroke="#DCCBB0" stroke-width="0.8"/>
<line x1="214" y1="330" x2="214" y2="308" stroke="#4A5C55" stroke-width="1.3"/>
<line x1="214" y1="316" x2="204" y2="305" stroke="#4A5C55" stroke-width="1.1"/>
<line x1="214" y1="311" x2="224" y2="300" stroke="#4A5C55" stroke-width="1.1"/>
<path d="M204,305 l-3,-1" stroke="#4A5C55" stroke-width="1"/>
<path d="M224,300 l3,-1" stroke="#4A5C55" stroke-width="1"/>
<line x1="308" y1="184" x2="236" y2="308" stroke="#2F2A24" stroke-width="2"/>
<line x1="308" y1="176" x2="308" y2="186" stroke="#2F2A24" stroke-width="1"/>
<path d="M236,306 L244,320 L226,316 Z" fill="#A2503B" stroke="#A2503B" stroke-width="0.8"/>
<text x="190" y="372" font-size="4.6" fill="#6E6459" text-anchor="middle">牍上先画：山是难，山脚那株苗，是它现在的样子</text>
<text x="24" y="394" font-size="4.8" fill="#2F2A24">「图」是「画计难」：难还没来时，先把它画在牍上，才知道往哪儿下手。</text>
<text x="24" y="410" font-size="4.9" fill="#2F2A24">等它长成一座山，就只剩对着山叹气；趁它还是那株苗，才画得动。</text>
<text x="24" y="428" font-size="5.0" fill="#4A5C55">为大于其细：大不是从大处做起的，是从那一笔点得下去的地方做起的。</text>
<line x1="24" y1="446" x2="338" y2="446" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="454" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="470" font-size="5.6" fill="#2F2A24" text-anchor="middle">图是「画计难」：先把难画出来，才有得打算；</text>
<text x="190" y="482" font-size="5.2" fill="#4A5C55" text-anchor="middle">趁它还小，笔才落得下去。</text>
<line x1="20" y1="508" x2="360" y2="508" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="522" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="538" font-size="8.4" fill="#2F2A24">图是「画计难」：先把难画出来，才有得打算；趁它还小，笔才落得下去。</text>
<text x="20" y="554" font-size="8.4" fill="#2F2A24">味是尝还没熟的，图是先把难画出来——都在事情还没长成的时候动手。</text>
</svg>