<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 728" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="它每天被人看见，每天不被使用" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="728" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 八 十 章 · 舟</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一条停在岸上的船</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">虽有舟舆，无所乘之。</text>
<rect x="20" y="102" width="340" height="32" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.7" fill="#2F2A24" text-anchor="middle">它能走，能载，能到很远的地方；但它停着。</text>
<text x="190" y="127" font-size="4.7" fill="#6E6459" text-anchor="middle">「无所乘之」不是没有船，是船在而不启动。</text>
<text x="24" y="150" font-size="4.8" fill="#A2503B">一、能走：桨在手</text>
<rect x="26" y="162" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M40,270 q22,6 44,0 q22,-6 44,0 q22,6 44,0 q22,-6 44,0 q22,6 44,0 q22,-6 44,0" fill="none" stroke="#4A5C55" stroke-width="1"/>
<path d="M88,228 L246,228 Q232,266 168,266 Q104,266 88,228 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="80" y1="228" x2="254" y2="228" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="130" y1="208" x2="216" y2="258" stroke="#2F2A24" stroke-width="1.6"/>
<ellipse cx="222" cy="261" rx="9" ry="4" fill="#DED2B8" stroke="#2F2A24" stroke-width="1" transform="rotate(14 222 261)"/>
<text x="190" y="290" font-size="4.5" fill="#A2503B" text-anchor="middle">船能走，桨在手</text>
<text x="190" y="330" font-size="4.6" fill="#4A5C55" text-anchor="middle">有而不用：船不破，水不惊</text>
<text x="24" y="354" font-size="4.8" fill="#4A5C55">二、不启动：桨横在船里</text>
<rect x="26" y="366" width="328" height="152" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M40,476 q22,6 44,0 q22,-6 44,0 q22,6 44,0 q22,-6 44,0 q22,6 44,0 q22,-6 44,0" fill="none" stroke="#4A5C55" stroke-width="1"/>
<path d="M88,434 L246,434 Q232,472 168,472 Q104,472 88,434 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="80" y1="434" x2="254" y2="434" stroke="#2F2A24" stroke-width="1.3"/>
<line x1="112" y1="444" x2="212" y2="444" stroke="#2F2A24" stroke-width="1.6"/>
<ellipse cx="106" cy="444" rx="8" ry="3.4" fill="#DED2B8" stroke="#2F2A24" stroke-width="1"/>
<path d="M246,440 q18,6 6,18" fill="none" stroke="#A2503B" stroke-width="1" stroke-dasharray="3 2"/>
<text x="190" y="496" font-size="4.5" fill="#A2503B" text-anchor="middle">桨横着，绳系着：不启动</text>
<text x="190" y="534" font-size="4.6" fill="#4A5C55" text-anchor="middle">每天被人看见，每天不被使用</text>
<text x="24" y="558" font-size="4.8" fill="#2F2A24">舟在，而不乘：有而不用，不是不能用。</text>
<text x="24" y="574" font-size="4.8" fill="#2F2A24">一条停在岸上的船，比一条在江心的船，少惊动多少人。</text>
<text x="24" y="592" font-size="5.0" fill="#4A5C55">三样都在，三样都不动。</text>
<line x1="24" y1="610" x2="338" y2="610" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="618" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="633" font-size="5.2" fill="#2F2A24" text-anchor="middle">虽有舟舆，无所乘之。</text>
<text x="190" y="646" font-size="4.7" fill="#4A5C55" text-anchor="middle">舟在，而不乘。</text>
<line x1="20" y1="674" x2="360" y2="674" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="688" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="704" font-size="8.4" fill="#2F2A24">虽有舟舆，无所乘之。</text>
<text x="20" y="720" font-size="8.4" fill="#2F2A24">舟者，能行之物；不乘者，有而不启动。</text>
</svg>