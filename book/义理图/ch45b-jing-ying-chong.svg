<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 468" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="越深的井，看下去越像空的" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="468" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 五 章 · 井</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">井口看着是空的</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">大盈若冲，其用不穷。</text>
<rect x="20" y="102" width="340" height="30" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="115" font-size="6.4" fill="#2F2A24" text-anchor="middle">「冲」，虚而不满——里面有东西在动。</text>
<text x="190" y="127" font-size="5.7" fill="#6E6459" text-anchor="middle">不是空，是满在里面、外面不显。</text>
<line x1="24" y1="182" x2="200" y2="182" stroke="#2F2A24" stroke-width="0.7"/>
<path d="M78,182 L86,278 L142,278 L150,182 Z" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<path d="M92,278 L92,244 L136,244 L136,278 Z" fill="#DCE6E0" stroke="#4A5C55" stroke-width="0.5"/>
<line x1="92" y1="244" x2="136" y2="244" stroke="#4A5C55" stroke-width="0.8"/>
<path d="M98,252 q9,-4 18,0 q9,4 18,0" fill="none" stroke="#4A5C55" stroke-width="0.45" opacity="0.8"/>
<path d="M98,261 q9,-4 18,0 q9,4 18,0" fill="none" stroke="#4A5C55" stroke-width="0.45" opacity="0.8"/>
<text x="114" y="266" font-size="4.6" fill="#4A5C55" text-anchor="middle">水在下面</text>
<ellipse cx="114" cy="182" rx="36" ry="7" fill="#EFE4CF" stroke="#2F2A24" stroke-width="0.8"/>
<ellipse cx="114" cy="182" rx="26" ry="4.6" fill="#6E6459" opacity="0.55"/>
<line x1="114" y1="174" x2="114" y2="156" stroke="#A2503B" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="114" y="150" font-size="5.0" fill="#A2503B" text-anchor="middle">看下去，空的</text>
<path d="M226,146 L232,184 L272,184 L278,146" fill="none" stroke="#2F2A24" stroke-width="0.8"/>
<ellipse cx="252" cy="146" rx="26" ry="5.2" fill="none" stroke="#2F2A24" stroke-width="0.7"/>
<rect x="231" y="148" width="42" height="18" fill="#E8D9C4" stroke="#A2503B" stroke-width="0.4"/>
<path d="M240,142 v-3 M252,142 v-5 M264,142 v-3" fill="none" stroke="#A2503B" stroke-width="0.5"/>
<text x="252" y="198" font-size="4.8" fill="#A2503B" text-anchor="middle">满到口沿，一满就到顶</text>
<text x="24" y="304" font-size="5.9" fill="#2F2A24">井：打得越深，口上看着越空。水不在口上，在下面。</text>
<text x="24" y="320" font-size="5.9" fill="#2F2A24">它不往外倒，所以一直有得打——其用不穷。</text>
<text x="24" y="340" font-size="5.9" fill="#A2503B">杯子满到口沿，看着是满的；可它一满就到顶，再多一滴都是溢。</text>
<line x1="24" y1="352" x2="338" y2="352" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="360" width="340" height="44" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="376" font-size="6.2" fill="#2F2A24" text-anchor="middle">满得溢出来的，是在往外倒；满在里面不溢的，是在往里续。</text>
<text x="190" y="390" font-size="6.2" fill="#4A5C55" text-anchor="middle">真正充盈的在里面，外面永远是虚的。</text>
<line x1="20" y1="418" x2="360" y2="418" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="432" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="448" font-size="8.4" fill="#2F2A24">满得溢出来的，是在往外倒；满在里面不溢的，是在往里续。</text>
</svg>