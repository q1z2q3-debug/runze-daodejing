<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 594" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="动力取自回环，方法取自柔曲，根基取自空位" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="594" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 四 十 章 · 反 装</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">一台反装的机器</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">道从不硬来。</text>
<rect x="20" y="102" width="340" height="26" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="118" font-size="6.6" fill="#2F2A24" text-anchor="middle">反者，道之动；弱者，道之用。天下万物生于有，有生于无。</text>
<text x="76" y="140" font-size="6.2" fill="#6E6459" text-anchor="middle">世人的机器</text>
<text x="268" y="140" font-size="6.2" fill="#4A5C55" text-anchor="middle">道的那台</text>
<line x1="24" y1="146" x2="338" y2="146" stroke="#2F2A24" stroke-width="0.6"/>
<text x="26" y="162" font-size="8.0" fill="#A2503B">动</text>
<text x="26" y="176" font-size="8.0" fill="#A2503B">力</text>
<line x1="48" y1="210" x2="60" y2="200" stroke="#C9B79A" stroke-width="0.9" marker-end="url(#arrS)"/>
<line x1="64" y1="198" x2="76" y2="188" stroke="#C9B79A" stroke-width="0.9" marker-end="url(#arrS)"/>
<line x1="80" y1="186" x2="92" y2="176" stroke="#C9B79A" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="84" y="218" font-size="5.8" fill="#6E6459" text-anchor="middle">加码：再多、再快、再强</text>
<circle cx="268" cy="190" r="17" fill="none" stroke="#4A5C55" stroke-width="1"/>
<path d="M268,173 a17,17 0 1 1 -0.1,0" fill="none" stroke="#4A5C55" stroke-width="1.2"/>
<path d="M258,175 l6,-6 l6,6" fill="none" stroke="#4A5C55" stroke-width="1.1"/>
<text x="268" y="222" font-size="5.8" fill="#4A5C55" text-anchor="middle">回环：力不往前使，往回转</text>
<text x="26" y="258" font-size="8.0" fill="#A2503B">方</text>
<text x="26" y="272" font-size="8.0" fill="#A2503B">法</text>
<rect x="58" y="268" width="42" height="16" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="70" y1="254" x2="70" y2="265" stroke="#C9B79A" stroke-width="0.8" marker-end="url(#arrS)"/>
<line x1="88" y1="254" x2="88" y2="265" stroke="#C9B79A" stroke-width="0.8" marker-end="url(#arrS)"/>
<path d="M72,308 l5,-4 l4,4 l5,-4" fill="none" stroke="#A2503B" stroke-width="0.9"/>
<line x1="79" y1="284" x2="79" y2="306" stroke="#2F2A24" stroke-width="1.2"/>
<text x="84" y="322" font-size="5.8" fill="#6E6459" text-anchor="middle">硬顶：顶住、压住、锁住</text>
<path d="M232,306 C238,274 262,266 278,278 C292,288 300,306 304,310" fill="none" stroke="#4A5C55" stroke-width="1.4"/>
<circle cx="268" cy="269" r="3" fill="#A2503B"/>
<text x="268" y="322" font-size="5.8" fill="#4A5C55" text-anchor="middle">柔曲：不加在硬处，加在软处</text>
<text x="26" y="354" font-size="8.0" fill="#A2503B">根</text>
<text x="26" y="368" font-size="8.0" fill="#A2503B">基</text>
<rect x="64" y="396" width="32" height="11" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="64" y="383" width="32" height="11" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.8"/>
<rect x="64" y="370" width="32" height="11" fill="#F2EADA" stroke="#2F2A24" stroke-width="0.8"/>
<text x="84" y="418" font-size="5.8" fill="#6E6459" text-anchor="middle">堆叠：堆到没有一处空</text>
<rect x="238" y="370" width="60" height="34" fill="none" stroke="#4A5C55" stroke-width="1" stroke-dasharray="6 5"/>
<text x="268" y="391" font-size="6.2" fill="#4A5C55" text-anchor="middle">空位</text>
<text x="268" y="418" font-size="5.8" fill="#4A5C55" text-anchor="middle">空位：留一个不被占据的位置</text>
<line x1="24" y1="448" x2="338" y2="448" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="456" width="340" height="50" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="473" font-size="7.0" fill="#2F2A24" text-anchor="middle">两台机器都能转；世人的那台，转到某点就卡死。</text>
<text x="190" y="487" font-size="6.6" fill="#6E6459" text-anchor="middle">加无可加，顶无可顶，堆到没有一处空——力尽而事废。</text>
<text x="190" y="499" font-size="6.6" fill="#A2503B" text-anchor="middle">道的那台方向相反，所以能一直转。</text>
<line x1="20" y1="516" x2="360" y2="516" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="530" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="546" font-size="8.4" fill="#2F2A24">道动常归反，物极必回还。</text>
<text x="20" y="562" font-size="8.4" fill="#2F2A24">妙用存柔弱，不竞自安闲。</text>
</svg>