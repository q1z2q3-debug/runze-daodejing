<text x="150" y="364" font-size="4.8" fill="#A2503B">割</text>
<text x="196" y="442" font-size="4.8" fill="#A2503B">界：船还是两条</text>
<text x="196" y="456" font-size="4.6" fill="#6E6459">路只剩一边</text>
<text x="124" y="486" font-size="4.6" fill="#A2503B">一动刀，并就成了界</text>
<line x1="24" y1="494" x2="338" y2="494" stroke="#DCCBB0" stroke-width="0.6"/>
<text x="24" y="512" font-size="5.2" fill="#2F2A24">四句，是四个方向上的「留一点」：</text>
<text x="26" y="532" font-size="4.8" fill="#A2503B">方而不割</text>
<text x="76" y="532" font-size="4.6" fill="#6E6459">——并着，不收刀</text>
<text x="192" y="532" font-size="4.8" fill="#A2503B">廉而不刿</text>
<text x="242" y="532" font-size="4.6" fill="#6E6459">——边立着，不利手</text>
<text x="26" y="551" font-size="4.8" fill="#A2503B">直而不肆</text>
<text x="76" y="551" font-size="4.6" fill="#6E6459">——话说着，不说尽</text>
<text x="192" y="551" font-size="4.8" fill="#A2503B">光而不耀</text>
<text x="242" y="551" font-size="4.6" fill="#6E6459">——灯亮着，不刺眼</text>
<text x="24" y="582" font-size="5.2" fill="#2F2A24">方是两条船并着：并着不动刀，一动刀就成了界。</text>
<text x="24" y="598" font-size="5.0" fill="#2F2A24">廉是堂屋那条侧边，不是刀口：边要立着，可不能划手。</text>
<text x="24" y="614" font-size="4.6" fill="#4A5C55">直是话说着不说尽，光是灯亮着不刺眼——这一章的功夫，都在「留一点」上。</text>
<rect x="20" y="638" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="654" font-size="5.6" fill="#2F2A24" text-anchor="middle">方是两条船并着；并着不动刀，一动刀就成了界。</text>
<text x="190" y="666" font-size="5.2" fill="#4A5C55" text-anchor="middle">光在，耀不在；一刺眼，照就变成了压。</text>
<line x1="20" y1="692" x2="360" y2="692" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="706" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="722" font-size="8.4" fill="#2F2A24">方是两条船并着；并着不动刀，一动刀就成了界。</text>
</svg>