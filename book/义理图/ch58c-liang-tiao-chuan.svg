<line x1="172" y1="236" x2="191" y2="260" stroke="#2F2A24" stroke-width="1"/>
<line x1="154" y1="262" x2="162" y2="262" stroke="#2F2A24" stroke-width="0.5"/>
<text x="143" y="168" font-size="4.8" fill="#4A5C55" text-anchor="middle">并着：船帮贴船帮，中间没有刀口</text>
<text x="124" y="318" font-size="4.6" fill="#6E6459">方：两条船并在一起</text>
<text x="24" y="326" font-size="5.2" fill="#A2503B">二、一动刀：并就成了界</text>
<path d="M124,358 C141,376 141,444 124,462 C107,444 107,376 124,358 Z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.1"/>
