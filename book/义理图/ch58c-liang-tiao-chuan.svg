<path d="M100,410 C94,417 94,424 100,428" fill="none" stroke="#E6D8C2" stroke-width="0.45"/>
<path d="M100,444 C94,451 94,458 100,462" fill="none" stroke="#E6D8C2" stroke-width="0.45"/>
