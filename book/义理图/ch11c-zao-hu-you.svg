<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 754" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="墙再厚再华丽，封死填满，就只是一座土堆" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5C55"/></marker><marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#4A5C55"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#A2503B"/></marker></defs>
<rect x="0" y="0" width="380" height="754" fill="#F8F3E6"/>
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" letter-spacing="3">第 十 一 章 · 室</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">凿户牖</text>
<text x="20" y="78" font-size="10.5" fill="#6E6459">凿户牖以为室，当其无，有室之用。</text>
<rect x="20" y="102" width="340" height="34" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="114" font-size="4.9" fill="#2F2A24" text-anchor="middle">户是门，牖是窗；墙、梁、屋顶、地基，全部是「有」。</text>
<text x="190" y="128" font-size="4.9" fill="#6E6459" text-anchor="middle">房子的目标不是墙，是墙围出来那一片能让人活在里面的空间。</text>
<text x="24" y="152" font-size="5.2" fill="#A2503B">一、封死：四面墙，一堵不漏</text>
<rect x="26" y="164" width="328" height="180" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M92,248 L150,214 L208,248 z" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="96" y="248" width="108" height="46" fill="#E4D8BF" stroke="#2F2A24" stroke-width="1.2"/>
<line x1="96" y1="294" x2="109" y2="248" stroke="#2F2A24" stroke-width="0.35" opacity="0.45"/>
<line x1="107" y1="294" x2="120" y2="248" stroke="#2F2A24" stroke-width="0.35" opacity="0.45"/>
<line x1="118" y1="294" x2="131" y2="248" stroke="#2F2A24" stroke-width="0.35" opacity="0.45"/>
<line x1="129" y1="294" x2="142" y2="248" stroke="#2F2A24" stroke-width="0.35" opacity="0.45"/>
<line x1="140" y1="294" x2="153" y2="248" stroke="#2F2A24" stroke-width="0.35" opacity="0.45"/>
<line x1="151" y1="294" x2="164" y2="248" stroke="#2F2A24" stroke-width="0.35" opacity="0.45"/>
<line x1="162" y1="294" x2="175" y2="248" stroke="#2F2A24" stroke-width="0.35" opacity="0.45"/>
<line x1="173" y1="294" x2="186" y2="248" stroke="#2F2A24" stroke-width="0.35" opacity="0.45"/>
<line x1="184" y1="294" x2="197" y2="248" stroke="#2F2A24" stroke-width="0.35" opacity="0.45"/>
<line x1="195" y1="294" x2="204" y2="248" stroke="#2F2A24" stroke-width="0.35" opacity="0.45"/>
<line x1="88" y1="294" x2="212" y2="294" stroke="#2F2A24" stroke-width="1.4"/>
<text x="150" y="276" font-size="4.6" fill="#A2503B" text-anchor="middle">无门无窗</text>
<line x1="232" y1="272" x2="208" y2="272" stroke="#A2503B" stroke-width="0.9" marker-end="url(#arrS)"/>
<text x="236" y="276" font-size="4.5" fill="#A2503B">进不去</text>
<text x="150" y="324" font-size="4.5" fill="#A2503B" text-anchor="middle">墙立着，屋子却没生出来：只剩一座土堆</text>
<text x="24" y="360" font-size="5.2" fill="#4A5C55">二、开户牖：门窗是那两处「无」</text>
<rect x="26" y="372" width="328" height="176" fill="#FBF6EC" stroke="#DCCBB0" stroke-width="0.8"/>
<path d="M92,434 L150,400 L208,434 z" fill="#EFE6D4" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="96" y="434" width="108" height="52" fill="#F8F3E6" stroke="#2F2A24" stroke-width="1.2"/>
<rect x="124" y="454" width="30" height="32" fill="#E4EAE0" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="139" y1="454" x2="139" y2="486" stroke="#DCCBB0" stroke-width="0.5"/>
<rect x="168" y="448" width="28" height="20" fill="#E4EAE0" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="182" y1="448" x2="182" y2="468" stroke="#2F2A24" stroke-width="0.5"/>
<line x1="168" y1="458" x2="196" y2="458" stroke="#2F2A24" stroke-width="0.5"/>
<text x="120" y="460" font-size="3.9" fill="#4A5C55" text-anchor="end">户</text>
<text x="182" y="442" font-size="3.9" fill="#4A5C55" text-anchor="middle">牖</text>
<line x1="198" y1="458" x2="216" y2="452" stroke="#4A5C55" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.8"/>
<line x1="198" y1="458" x2="216" y2="458" stroke="#4A5C55" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.8"/>
<line x1="198" y1="458" x2="216" y2="464" stroke="#4A5C55" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.8"/>
<circle cx="146" cy="452" r="2.8" fill="none" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="146" y1="455" x2="146" y2="466" stroke="#2F2A24" stroke-width="1.0"/>
<line x1="146" y1="459" x2="142" y2="465" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="146" y1="459" x2="150" y2="465" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="146" y1="466" x2="143" y2="474" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="146" y1="466" x2="149" y2="474" stroke="#2F2A24" stroke-width="0.9"/>
<line x1="82" y1="474" x2="122" y2="474" stroke="#4A5C55" stroke-width="0.9" marker-end="url(#arr2)"/>
<text x="80" y="467" font-size="4.2" fill="#4A5C55" text-anchor="end">人</text>
<text x="150" y="524" font-size="4.5" fill="#4A5C55" text-anchor="middle">门窗不是墙的缺口，是「无」被开出来的地方</text>
<text x="150" y="538" font-size="4.5" fill="#6E6459" text-anchor="middle">人在里面住、呼吸、往来——用，就发生在这片空里</text>
<text x="24" y="568" font-size="5.2" fill="#2F2A24">墙、梁、门窗框是「有」：划出领地、遮风挡雨、给一个稳定框架——这是「利」。</text>
<text x="24" y="584" font-size="5.2" fill="#2F2A24">室内那片虚空是「无」：居住、停留、往来、生活发生的地方——这才是「用」。</text>
<text x="24" y="602" font-size="5.0" fill="#4A5C55">所以先立界，再开门；介不是墙，是墙围出来的那口空。</text>
<line x1="24" y1="620" x2="338" y2="620" stroke="#DCCBB0" stroke-width="0.6"/>
<rect x="20" y="628" width="340" height="40" fill="#F2EADA" stroke="#C9B79A" stroke-width="1.0"/>
<text x="190" y="644" font-size="6.0" fill="#2F2A24" text-anchor="middle">墙立而成室，室空而人可居；</text>
<text x="190" y="656" font-size="6.0" fill="#4A5C55" text-anchor="middle">封死填满，就只是一座土堆。</text>
<line x1="20" y1="682" x2="360" y2="682" stroke="#E6D8C2" stroke-width="0.8"/>
<text x="20" y="696" font-size="8.0" fill="#A89577" letter-spacing="1">本 章 金 句</text>
<text x="20" y="712" font-size="8.4" fill="#2F2A24">凿户牖以为室，当其无，有室之用。</text>
<text x="20" y="728" font-size="8.4" fill="#2F2A24">封死填满，就只是一座土堆。</text>
</svg>